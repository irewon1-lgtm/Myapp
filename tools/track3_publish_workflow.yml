name: Publish CodingRoadmap lessons and screen
on:
  push:
    branches: [coding-roadmap-live]
    paths: ['live/content.json', 'live/reader.template.html', 'live/track3-book/**', 'tools/build_content.py', 'tools/compile_track3_book.py', 'tools/verify_reader.cjs', 'tools/test_track3_*.py', '.github/workflows/publish-coding-roadmap-live.yml']
permissions:
  contents: write
concurrency:
  group: coding-roadmap-live-publication
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding-roadmap-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools and Korean fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Build canonical continuous textbook
        run: |
          python - <<'PY'
          import json,time,pathlib
          p=pathlib.Path('live/content.json');d=json.loads(p.read_text());d['version']=max(int(time.time()*1000),int(d.get('version',0))+1);p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python tools/build_content.py
          python - <<'PY'
          from pathlib import Path
          p=Path('live/reader.html');assert 0<p.stat().st_size<=3*1024*1024, 'Native reader download limit exceeded'
          PY
      - name: Verify all authored examples and preserved source
        run: |
          python tools/test_track3_book.py
          node tools/verify_reader.cjs
      - name: Verify real browser layout and persisted records
        run: python tools/test_track3_browser.py
      - name: Verify real Python worker and complete capstone
        run: python tools/test_track3_worker.py
      - name: Publish immutable reader then atomically move live channel
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coding-roadmap-live
          test "$(git rev-parse origin/coding-roadmap-live)" = "$(git rev-parse HEAD)" || { echo 'Newer source exists; refusing to overwrite it.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/content.json live/reader.html live/track3-book tools/build_content.py CODINGROADMAP_LIVE.md .github/workflows/publish-coding-roadmap-live.yml
          git add -u live
          if test -f archive/track3-fragmented-manuscript-20260924.md; then git add archive/track3-fragmented-manuscript-20260924.md; fi
          git commit -m 'Build and verify continuous Track 3 textbook reader'
          export CONTENT_COMMIT="$(git rev-parse HEAD)"
          python - <<'PY'
          import os,json,pathlib,hashlib
          p=pathlib.Path('live/reader.html');b=p.read_bytes();d=json.loads(pathlib.Path('live/content.json').read_text())
          channel={'schema':'codingroadmap-live-v1','minShell':1,'version':d['version'],'label':d['label'],'commit':os.environ['CONTENT_COMMIT'],'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}
          pathlib.Path('live/channel.json').write_text(json.dumps(channel,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('review/published-channel.json').write_text(json.dumps(channel,ensure_ascii=False,indent=2)+'\n')
          PY
          git add live/channel.json
          git commit -m 'Publish verified continuous Track 3 textbook channel'
          git push origin HEAD:coding-roadmap-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track3-continuous-book-publication
          retention-days: 7
          path: |
            live/channel.json
            live/content.json
            live/reader.html
            live/track3-book
            review
