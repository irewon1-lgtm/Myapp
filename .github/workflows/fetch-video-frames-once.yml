name: Fetch video learning frames once
on:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/fetch-video-frames-once.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - name: Fetch official YouTube frame images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exact_source/q-j2scvSwdA/frames public/art
          for name in hqdefault hq1 hq2 hq3 0 1 2 3; do
            curl -fsSL --max-time 20 "https://i.ytimg.com/vi/q-j2scvSwdA/${name}.jpg"               -o "exact_source/q-j2scvSwdA/frames/${name}.jpg" || true
          done
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,base64,io
          root=Path('exact_source/q-j2scvSwdA/frames')
          previews=[]
          for p in sorted(root.glob('*.jpg')):
              try:
                  im=Image.open(p).convert('RGB')
                  w,h=im.size
                  # remove YouTube black bars when present
                  if h>=360 and w>=480:
                      im=im.crop((0,max(0,(h-int(w*9/16))//2),w,min(h,(h+int(w*9/16))//2)))
                  buf=io.BytesIO(); im.save(buf,'JPEG',quality=78,optimize=True)
                  previews.append({'name':p.name,'size':[w,h],'data':'data:image/jpeg;base64,'+base64.b64encode(buf.getvalue()).decode()})
                  im.save(Path('public/art')/('yt-vibe-'+p.stem+'.webp'),'WEBP',quality=86,method=6)
              except Exception:
                  pass
          Path('exact_source/q-j2scvSwdA/frame-previews.json').write_text(json.dumps(previews))
          print([(x['name'],x['size']) for x in previews])
          PY
      - name: Commit frame assets
        shell: bash
        run: |
          git config user.name 'Chatbook Frame Import'
          git config user.email 'chatbook-frames@users.noreply.github.com'
          git add exact_source/q-j2scvSwdA/frames exact_source/q-j2scvSwdA/frame-previews.json public/art/yt-vibe-*.webp
          git commit -m 'Add original YouTube frame assets for learning book' || exit 0
          git push origin chatbook-app-20260923
