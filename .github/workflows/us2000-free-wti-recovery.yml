name: US2000 Free Collision Replacements

on:
  push:
    branches: [us2000-free-runner]
    paths:
      - 'us2000-free/collect_replacements.py'
      - '.github/workflows/us2000-free-wti-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us2000-free-collision-replacements
  cancel-in-progress: false

jobs:
  collect-replacements:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us2000-free-runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect three replacement stocks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile us2000-free/collect_500.py us2000-free/collect_replacements.py
          python us2000-free/collect_replacements.py
      - name: CLEAN PASS - replacement contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('us2000-free/replacements.json'); d=json.loads(p.read_text())
          assert d['schema']=='US2000_COLLISION_REPLACEMENTS_1'
          assert d['replaces']==['ENVA','TRUP','YELP']
          assert [r['ticker'] for r in d['records']]==['ICFI','OMF','EE']
          assert [int(r['cik']) for r in d['records']]==[1362004,1584207,1888447]
          assert d['metricCount']==10 and d['totalMetricCells']==30 and d['totalHold']==0
          assert all(len(r['metrics'])==10 for r in d['records'])
          assert all(all(m['status']!='HOLD' for m in r['metrics'].values()) for r in d['records'])
          print('US2000_COLLISION_REPLACEMENTS_CLEAN=PASS')
          PY
      - name: Upload replacement evidence
        uses: actions/upload-artifact@v4
        with:
          name: us2000-collision-replacements
          path: us2000-free/replacements.json
          if-no-files-found: error
          retention-days: 1
