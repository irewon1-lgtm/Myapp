name: US2000 Free Corrected New500

on:
  push:
    branches: [us2000-free-runner]
    paths:
      - 'us2000-free/apply_replacements.py'
      - '.github/workflows/us2000-free-wti-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us2000-free-corrected-new500
  cancel-in-progress: false

jobs:
  correct-new500:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us2000-free-runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recollect three replacement stocks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile us2000-free/collect_500.py us2000-free/collect_replacements.py us2000-free/apply_replacements.py
          python us2000-free/collect_replacements.py
      - name: Apply replacements to the final 500-stock evidence
        shell: bash
        run: |
          set -euo pipefail
          python us2000-free/apply_replacements.py
      - name: CLEAN PASS - corrected 500 identities and 5,000 cells
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('us2000-free/output');m=json.loads((root/'manifest.json').read_text())
          assert m['schema']=='US2000_FREE_NEW500_2',m['schema']
          assert m['recordCount']==500 and m['metricCount']==10 and m['totalMetricCells']==5000,m
          assert m['totalResolved']==5000 and m['totalHold']==0 and m['resolvedRatio']==1.0,m
          records=[]
          for c in m['chunks']:
              raw=(root/c['file']).read_bytes(); assert hashlib.sha256(raw).hexdigest()==c['sha256'],c
              part=json.loads(raw); assert len(part)==c['count']==50,c
              records.extend(part)
          assert len(records)==500 and len({r['ticker'] for r in records})==500 and len({int(r['cik']) for r in records})==500
          tickers={r['ticker'] for r in records}
          assert not {'ENVA','TRUP','YELP'} & tickers,tickers & {'ENVA','TRUP','YELP'}
          assert {'ICFI','OMF','EE'} <= tickers
          assert all(len(r['metrics'])==10 for r in records)
          assert sum(v['status']=='HOLD' for r in records for v in r['metrics'].values())==0
          raw=json.dumps(records,separators=(',',':'),ensure_ascii=False).encode()
          assert hashlib.sha256(raw).hexdigest()==m['recordsSha256']
          assert m['recordsSha256']=='6bd85f5e60831a87768fa80ddec085d24e018adb07ffdb0b27010c3c48fec147',m['recordsSha256']
          print('US2000_CORRECTED_NEW500_FULL_CLEAN=PASS',m['recordsSha256'])
          PY
      - name: Store corrected immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'us2000-free-bot'
          git config user.email 'us2000-free-bot@users.noreply.github.com'
          git add us2000-free/output us2000-free/replacements.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store corrected collision-free US2000 new500 evidence [skip ci]'
            git push origin HEAD:us2000-free-runner
          fi
