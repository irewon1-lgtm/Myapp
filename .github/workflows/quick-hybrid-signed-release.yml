name: Quick hybrid signed release APK

on:
  push:
    branches:
      - textbook-v5-hybrid-p105-apk
    paths:
      - '.github/workflows/quick-hybrid-signed-release.yml'

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK with existing app key
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk final-dist/CodingTextbook_Hybrid_P105_v1.2.15_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out final-dist/CodingTextbook_Hybrid_P105_v1.2.15.apk \
            final-dist/CodingTextbook_Hybrid_P105_v1.2.15_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs final-dist/CodingTextbook_Hybrid_P105_v1.2.15.apk | tee final-dist/apksigner_verify.txt
          sha256sum final-dist/CodingTextbook_Hybrid_P105_v1.2.15.apk | tee final-dist/CodingTextbook_Hybrid_P105_v1.2.15.sha256
          rm final-dist/CodingTextbook_Hybrid_P105_v1.2.15_aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-textbook-hybrid-p105-v1.2.15-signed
          retention-days: 7
          if-no-files-found: error
          path: |
            final-dist/CodingTextbook_Hybrid_P105_v1.2.15.apk
            final-dist/CodingTextbook_Hybrid_P105_v1.2.15.sha256
            final-dist/apksigner_verify.txt
