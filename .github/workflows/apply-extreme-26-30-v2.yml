name: Apply Extreme 26-30 patch v2

on:
  push:
    branches:
      - fix/extreme-26-30
    paths:
      - .github/workflows/apply-extreme-26-30-v2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/extreme-26-30
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reuse patch and fix JSON test runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-extreme-26-30.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          patch_script = textwrap.dedent(workflow[start:end])
          Path('/tmp/extreme_26_30_patch.py').write_text(patch_script, encoding='utf-8')
          PY
          python /tmp/extreme_26_30_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/futuretech/poweruser/update/AppUpdateManagerTest.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import org.junit.Test\n',
              'import org.junit.Test\nimport org.junit.runner.RunWith\nimport org.robolectric.RobolectricTestRunner\nimport org.robolectric.annotation.Config\n',
              1
          )
          text = text.replace(
              'class AppUpdateManagerTest {\n',
              '@RunWith(RobolectricTestRunner::class)\n@Config(sdk = [34])\nclass AppUpdateManagerTest {\n',
              1
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Verify patch and run JVM regression
        run: |
          git diff --check
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Commit verified app patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/verify-textbook-v1.yml
          git commit -m "fix: harden Extreme scenarios 26-30"
          git push origin HEAD:fix/extreme-26-30
