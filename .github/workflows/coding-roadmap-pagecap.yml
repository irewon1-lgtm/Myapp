name: Coding Roadmap Page Height Cap

on:
  push:
    branches: [coding-roadmap-pagecap-v0.8.3]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-pagecap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify default page height budget
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          root = Path('app/src/main/assets/content/track01')

          def lines(text, per=38):
              if not text:
                  return 0
              return sum(max(1, math.ceil(len(x)/per)) for x in text.split('\n'))

          def height(p):
              h = 150
              if p.get('keywords'):
                  h += 40
              for para in p.get('paragraphs', []):
                  h += lines(para, 38)*34 + 18

              for g in p.get('glossary', []):
                  h += 24 + 8
                  h += lines(g['description'],38)*27
                  h += 10 + 18 + 4 + lines(g['usage'],38)*24
                  h += 9 + 18 + 4 + lines(g['example'],38)*24 + 28

              if p.get('visual'):
                  h += 260

              if p.get('bullets'):
                  h += 32
                  for b in p['bullets']:
                      h += lines(b,36)*30 + 8
                  h += 18

              if p.get('calloutTitle'):
                  h += 36 + lines(p.get('calloutBody',''),38)*27 + 38

              if p.get('code'):
                  h += 48 + len(p['code'].splitlines())*28 + 32
                  if p.get('codeNote'):
                      h += 1 + lines(p['codeNote'],40)*23 + 30

              if p.get('practicePrompt'):
                  h += 32 + 18 + 8 + lines(p['practicePrompt'],38)*27 + 20

              if p.get('question'):
                  h += 32 + 18 + 8 + lines(p['question'],34)*30 + 20

              if p.get('answer'):
                  h += 50

              extras = p.get('extras', [])
              visible = min(max(p.get('visibleExtras', len(extras)), 0), len(extras))
              for e in extras[:visible]:
                  h += 12 + 32 + 18 + 8 + lines(e['body'],38)*27 + 20

              if visible < len(extras):
                  h += 52

              if p.get('closingPrompt'):
                  h += 82

              h += 28
              return round(h)

          rows=[]
          total=0
          hidden=0
          for ch in range(1,9):
              data=json.loads((root/f'ch{ch:02d}.json').read_text())
              for i,p in enumerate(data['pages'],1):
                  h=height(p)
                  rows.append((h,ch,i,p['kind'],p['title'],p.get('visibleExtras',0),len(p.get('extras',[]))))
                  total += 1
                  if p.get('visibleExtras',len(p.get('extras',[]))) < len(p.get('extras',[])):
                      hidden += 1

          assert total == 64
          assert max(r[0] for r in rows) <= 1474, max(rows)
          assert min(r[0] for r in rows) >= 1380, min(rows)
          assert max(r[0] for r in rows)-min(r[0] for r in rows) <= 100
          assert hidden > 0

          ch2 = json.loads((root/'ch02.json').read_text())
          summary = [p for p in ch2['pages'] if p['kind']=='summary'][0]
          assert summary['visibleExtras'] < len(summary['extras'])

          print('PAGECAP_GATE=PASS')
          print('pages=', total, 'range=', min(r[0] for r in rows), '..', max(r[0] for r in rows), 'hidden_extra_pages=', hidden)
          print('longest=', sorted(rows, reverse=True)[:5])
          PY

          grep -R -n 'visibleExtras' app/src/main/java/com/codingroadmap/app
          grep -R -n 'closingPrompt' app/src/main/java/com/codingroadmap/app
          grep -R -n '추가 설명' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'MoreExtrasDialog' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'navigationBarsPadding' app/src/main/java/com/codingroadmap/app/ui
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'versionName = "0.8.3"' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          for i in 01 02 03 04 05 06 07 08; do
            unzip -l "$APK" | grep "assets/content/track01/ch$i.json"
          done

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.3'" /tmp/badging.txt

          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.8.3_PAGECAP.apk
          sha256sum dist/CodingRoadmapFresh_v0.8.3_PAGECAP.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.3_PAGECAP
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.3_PAGECAP.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
