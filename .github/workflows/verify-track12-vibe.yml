name: Verify Vibe Coding Track 12 (terms 1-200)
on:
  push:
    branches: [feature/vibe-terms-001-050-20261110, feature/vibe-book-dark-50-20261110, feature/vibe-terms-051-100-20261110, feature/vibe-terms-101-150-20261110, feature/vibe-terms-151-200-20261110]
    paths:
      - 'live/vibe-terms/**'
      - 'tools/compile_track12_glossary.py'
      - 'tools/build_content.py'
      - 'tools/compile_track4_book.py'
      - 'tools/prepare_track4_release.py'
      - 'tools/test_track12_*.py'
      - '.github/workflows/verify-track12-vibe.yml'
  pull_request:
    branches: [coding-roadmap-live]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same browser test dependencies as publishing pipeline (bounded)
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s python -m pip install --disable-pip-version-check --retries 2 --timeout 25 playwright==1.55.0
          if fc-list :lang=ko family | grep -i 'Noto' >/dev/null; then
            echo "Noto Korean font already installed; skip apt network"
          else
            export DEBIAN_FRONTEND=noninteractive
            timeout 120s sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 update -qq
            timeout 120s sudo apt-get -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::Retries=1 install -y -qq fonts-noto-cjk >/dev/null
          fi
          timeout 60s fc-cache -f
          fc-list :lang=ko family | grep -i 'Noto' >/dev/null || { echo "::error::Korean font missing"; exit 1; }
      - name: Preserve pre-change baseline and compile all existing tracks plus Track 12
        run: |
          mkdir -p review
          cp live/content.json review/track4-before.json
          python tools/prepare_track4_release.py
          python tools/build_content.py
      - name: Verify all existing textbooks and source contracts
        run: |
          python tools/test_track3_book.py
          python tools/test_track4_book.py
          node tools/verify_reader.cjs
      - name: Verify full 200-term content and first 150 record preservation
        run: python tools/test_track12_glossary.py
      - name: Regression existing phone/tablet readers
        run: |
          python tools/test_track3_browser.py
          python tools/test_track4_browser.py
      - name: Validate new glossary in real Chromium
        run: python tools/test_track12_browser.py
      - name: Preserve existing real Python execution check
        run: python tools/test_track3_worker.py
      - name: Publish verification evidence (NOT a physical Android test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-track12-qa-evidence
          retention-days: 7
          path: |
            review/track12-vibe-source-tests.json
            review/track12-vibe-browser-tests.json
            review/track12-darkbook-*.png
            review/track3-book-compile.json
            review/track4-book-compile.json
