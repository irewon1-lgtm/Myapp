name: Build final signed release

on:
  push:
    branches:
      - fix/problem-engine-v2
    paths:
      - '.github/workflows/build-final-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'package.json'
      - 'tools/build_ts_runtime.mjs'
      - 'test.keystore'
  workflow_dispatch:

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript compiler assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and verify final release APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk final-dist/FutureTechPowerUser_v1.0.0_FINAL_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk \
            final-dist/FutureTechPowerUser_v1.0.0_FINAL_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk | tee final-dist/apksigner_verify.txt
          sha256sum final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk | tee final-dist/FutureTechPowerUser_v1.0.0_FINAL.sha256
          rm final-dist/FutureTechPowerUser_v1.0.0_FINAL_aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 34 install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb logcat -c
            adb install -r final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk
            adb shell am force-stop com.futuretech.poweruser
            adb shell am start -W -n com.futuretech.poweruser/.MainActivity | tee final-dist/launch_smoke.txt
            sleep 3
            PID="$(adb shell pidof com.futuretech.poweruser | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "PROCESS_EXITED_AFTER_LAUNCH" | tee -a final-dist/launch_smoke.txt
              adb logcat -d -v threadtime > final-dist/logcat_full.txt || true
              grep -E -i 'FATAL EXCEPTION|AndroidRuntime|futuretech|Process: com.futuretech.poweruser|Exception|Error' final-dist/logcat_full.txt | tail -n 250 > final-dist/logcat_crash_excerpt.txt || true
              cat final-dist/logcat_crash_excerpt.txt || true
              exit 1
            fi
            echo "PID=$PID" | tee -a final-dist/launch_smoke.txt
            adb shell dumpsys package com.futuretech.poweruser | grep -E 'versionCode|versionName' | head -n 4 | tee -a final-dist/launch_smoke.txt
            adb logcat -d -v threadtime > final-dist/logcat_full.txt || true

      - name: Upload final signed APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutureTechPowerUser-final-signed-release
          if-no-files-found: error
          retention-days: 90
          path: |
            final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk
            final-dist/FutureTechPowerUser_v1.0.0_FINAL.sha256
            final-dist/apksigner_verify.txt
            final-dist/launch_smoke.txt
            final-dist/logcat_full.txt
            final-dist/logcat_crash_excerpt.txt
