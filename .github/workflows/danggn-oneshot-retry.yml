name: Danggn Retry Failed 48h Chunks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-oneshot-retry.yml'
      - 'ops/danggn-oneshot-retry-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: seongnam
            chunk: 0
            chunks: 10
          - target: seongnam
            chunk: 1
            chunks: 10
          - target: seongnam
            chunk: 2
            chunks: 10
          - target: seongnam
            chunk: 3
            chunks: 10
          - target: songpa
            chunk: 3
            chunks: 5
          - target: songpa
            chunk: 4
            chunks: 5
          - target: gangnam
            chunk: 0
            chunks: 4
          - target: gangnam
            chunk: 1
            chunks: 4
          - target: gangnam
            chunk: 2
            chunks: 4
          - target: gangnam
            chunk: 3
            chunks: 4
          - target: seocho
            chunk: 0
            chunks: 4
          - target: seocho
            chunk: 1
            chunks: 4

    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Retry failed chunk slowly
        env:
          TARGET_SLUG: ${{ matrix.target }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: ${{ matrix.chunks }}
        run: node danggn-bot/oneshot-area-scan.mjs

      - name: Upload retry result
        uses: actions/upload-artifact@v4
        with:
          name: danggn-retry-${{ matrix.target }}-${{ matrix.chunk }}
          path: oneshot-result-${{ matrix.target }}-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 1
