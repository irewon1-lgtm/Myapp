name: Extract 8KCuHHeC_M0 targeted frames once
on:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/frames-8KCuHHeC_M0-once.yml]
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - name: Download low-resolution video and extract lesson frames
        shell: bash
        run: |
          set -euo pipefail
          ID='8KCuHHeC_M0'
          OUT="exact_source/$ID/frames"
          mkdir -p "$OUT"
          python -m pip install -q -U yt-dlp
          yt-dlp --no-warnings -f "worstvideo[height>=360][ext=mp4]/worstvideo[ext=mp4]/worst[ext=mp4]/worst" "https://www.youtube.com/watch?v=$ID" -o /tmp/source.%(ext)s
          SRC=$(ls /tmp/source.* | head -1)
          i=1
          for ts in 00:03:42 00:05:48 00:10:30 00:15:40 00:21:53 00:25:28 00:33:51 00:41:53 00:46:30 00:50:39 00:54:17 00:55:49 00:57:53; do
            ffmpeg -loglevel error -y -ss "$ts" -i "$SRC" -frames:v 1 -vf "scale='min(960,iw)':-2" -q:v 3 "$OUT/frame-$(printf '%02d' $i).jpg"
            i=$((i+1))
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("exact_source/8KCuHHeC_M0/frames")
          stamps=["00:03:42","00:05:48","00:10:30","00:15:40","00:21:53","00:25:28","00:33:51","00:41:53","00:46:30","00:50:39","00:54:17","00:55:49","00:57:53"]
          files=sorted(p.name for p in root.glob("frame-*.jpg"))
          assert len(files)==len(stamps), (len(files),len(stamps))
          meta=[{"file":f,"timestamp":t} for f,t in zip(files,stamps)]
          (root/"frames.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False))
          PY
      - name: Commit frames
        shell: bash
        run: |
          git config user.name 'Chatbook Frame Import'
          git config user.email 'chatbook-source@users.noreply.github.com'
          git add exact_source/8KCuHHeC_M0/frames
          git commit -m 'Add targeted source frames for 8KCuHHeC_M0'
          git push origin chatbook-app-20260923
