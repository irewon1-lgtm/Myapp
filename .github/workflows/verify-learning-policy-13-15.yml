name: Verify learning policy 13-15

on:
  push:
    branches:
      - fix/learning-policy-13-15
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extreme-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13 for Chaquopy build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20 for TypeScript compiler bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare official TypeScript compiler assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Full JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Items 13-15 Extreme60 and CLEAN25
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.futuretech.poweruser.education.LearningPracticePolicyExtreme60Test" \
            --tests "com.futuretech.poweruser.education.LearningPracticePolicyClean25Test" \
            --stacktrace

      - name: Preserve integrated items 10-12 gates
        run: |
          python tools/items_10_12_extreme60.py
          python tools/items_10_12_clean25.py

      - name: Compile app and instrumentation tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Challenge mode UI regression on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.futuretech.poweruser.education.LearningPracticeModeUiInstrumentedTest --stacktrace

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-policy-13-15-evidence
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/apk/debug/app-debug.apk
            items_10_12_extreme60_report.md
            items_10_12_clean25_report.md
