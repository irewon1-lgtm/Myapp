name: Danggn One-Time SGKS Scan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-once-sgks.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run one-time SGKS scan
        run: node danggn-bot/once-sgks-scan.mjs
      - name: Persist one-time result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danggn-once-bot"
          git config user.email "actions@users.noreply.github.com"
          git add danggn-bot/once-sgks-result.json
          git commit -m "chore: save one-time SGKS scan [skip ci]"
          git push origin HEAD:danggn-search-bot
