name: Chatbook source verification

on:
  push:
    branches: [chatbook-app-20260923]
    paths:
      - 'public/**'
      - 'netlify/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.toml'
      - 'index.html'
      - '.github/workflows/chatbook-source-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatbook-source-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify source manifest
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('dist/version.json','utf8'));if(x.sourceSha!==process.env.GITHUB_SHA)throw Error('source SHA mismatch');console.log(x)"
