# Publish approved narrative 1.2, Python textbook v3, app 1.0.3.
name: Chatbook fast publish
on:
  workflow_dispatch:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/chatbook-fast-publish.yml]
permissions:
  contents: write
concurrency:
  group: chatbook-fast-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast build and Netlify publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fast-publish.mjs
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify live HTTPS content, layout and persistence
        run: node tests/narrative-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbook-narrative-production-evidence
          path: |
            tests/narrative-live-results/
            dist/version.json
          retention-days: 3
