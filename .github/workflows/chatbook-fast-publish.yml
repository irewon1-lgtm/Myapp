# Supported production route: exact current content plus actual browser navigation; tolerate canonical URL spelling, not content drift.
name: Chatbook fast publish
on:
  workflow_dispatch:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/chatbook-fast-publish.yml]
permissions:
  contents: write
concurrency:
  group: chatbook-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test current source and publish the existing site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fast-publish.mjs
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify actual HTTPS reader and metadata
        run: |
          node tests/release-live.mjs
          node tests/current-spec-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbook-current-spec-verification
          path: |
            tests/release-live-results/
            tests/current-spec-results/
            dist/version.json
            dist/engine-info.json
            dist/engine-info.html
            dist/engine-spec.json
            dist/engine-spec.html
            dist/llms.txt
          retention-days: 3
