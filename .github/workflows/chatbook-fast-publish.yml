# Publish the existing Chatbook site with source-generated metadata and canonical HTML cache exclusions.
name: Chatbook fast publish
on:
  workflow_dispatch:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/chatbook-fast-publish.yml]
permissions:
  contents: write
concurrency:
  group: chatbook-fast-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test, validate release information and publish existing site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fast-publish.mjs
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify current HTTPS release and metadata-independent reader
        run: node tests/release-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbook-release-production-evidence
          path: |
            tests/release-live-results/
            dist/version.json
            dist/engine-info.json
            dist/engine-info.html
            dist/llms.txt
          retention-days: 3
