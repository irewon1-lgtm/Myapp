name: Quick hybrid debug APK

on:
  push:
    branches:
      - textbook-v5-hybrid-p105-apk
    paths:
      - '.github/workflows/quick-hybrid-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-textbook-hybrid-p105-debug
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
