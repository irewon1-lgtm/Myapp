name: Quick hybrid signed APK

on:
  push:
    branches:
      - textbook-v5-hybrid-p105-apk
    paths:
      - '.github/workflows/quick-hybrid-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and verify APK
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p quick-dist
          "$ZIPALIGN" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.apk \
            quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs \
            quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.apk \
            | tee quick-dist/apksigner_verify.txt
          sha256sum quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.apk \
            | tee quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.sha256
          rm quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15_aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-textbook-hybrid-p105-signed
          retention-days: 7
          path: |
            quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.apk
            quick-dist/Coding_Textbook_Hybrid_P105_v1.2.15.sha256
            quick-dist/apksigner_verify.txt
