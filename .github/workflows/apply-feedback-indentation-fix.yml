name: Apply feedback indentation fix and verify full app

on:
  push:
    branches:
      - fix/feedback-engine-v1
    paths:
      - .github/workflows/apply-feedback-indentation-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout feedback branch
        uses: actions/checkout@v4
        with:
          ref: fix/feedback-engine-v1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Apply language-aware indentation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/futuretech/poweruser/education/PracticeFeedbackEngine.kt')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        val ok = canonical(actual) == canonical(expected)\n        val diff = firstDifference(actual, expected)',
                  '        val preserveIndentation = lesson.practiceLanguage.equals("PYTHON", ignoreCase = true)\n        val ok = canonical(actual, preserveIndentation) == canonical(expected, preserveIndentation)\n        val diff = firstDifference(actual, expected, preserveIndentation)'
              ),
              (
                  '            if (ok) "고장난 예제와 수정 예제의 차이를 찾아 핵심 오류를 바로잡았습니다. ${fixReason(lesson.brokenCode, expected)}"\n            else "수정안이 목표 수정과 아직 다릅니다. ${diff.ifBlank { fixReason(lesson.brokenCode, expected) }}",',
                  '            if (ok) "고장난 예제와 수정 예제의 차이를 찾아 핵심 오류를 바로잡았습니다. ${fixReason(lesson.brokenCode, expected, preserveIndentation)}"\n            else "수정안이 목표 수정과 아직 다릅니다. ${diff.ifBlank { fixReason(lesson.brokenCode, expected, preserveIndentation) }}",'
              ),
              (
                  '    private fun fixReason(broken: String, fixed: String) =\n        firstDifference(broken, fixed).ifBlank { "수정 전후의 핵심 구조 차이를 확인했습니다." }\n\n    private fun firstDifference(actual: String, expected: String): String {\n        val a = meaningfulLines(actual)\n        val e = meaningfulLines(expected)\n        for (i in 0 until maxOf(a.size, e.size)) {\n            val av = a.getOrNull(i)\n            val ev = e.getOrNull(i)\n            if (normalizeCodeLine(av.orEmpty()) != normalizeCodeLine(ev.orEmpty())) {\n                return when {\n                    av == null -> "${i + 1}번째 핵심 줄이 빠졌습니다. 기대 줄: `${ev.orEmpty()}`"\n                    ev == null -> "${i + 1}번째에 불필요한 줄이 있습니다: `$av`"\n                    else -> "${i + 1}번째 핵심 줄이 다릅니다. 내 코드: `$av` / 학습 예제: `$ev`"\n                }\n            }\n        }\n        return ""\n    }',
                  '    private fun fixReason(broken: String, fixed: String, preserveIndentation: Boolean = false) =\n        firstDifference(broken, fixed, preserveIndentation).ifBlank { "수정 전후의 핵심 구조 차이를 확인했습니다." }\n\n    private fun firstDifference(actual: String, expected: String, preserveIndentation: Boolean = false): String {\n        val a = meaningfulLines(actual, preserveIndentation)\n        val e = meaningfulLines(expected, preserveIndentation)\n        for (i in 0 until maxOf(a.size, e.size)) {\n            val av = a.getOrNull(i)\n            val ev = e.getOrNull(i)\n            if (normalizeCodeLine(av.orEmpty(), preserveIndentation) != normalizeCodeLine(ev.orEmpty(), preserveIndentation)) {\n                return when {\n                    av == null -> "${i + 1}번째 핵심 줄이 빠졌습니다. 기대 줄: `${ev.orEmpty()}`"\n                    ev == null -> "${i + 1}번째에 불필요한 줄이 있습니다: `$av`"\n                    preserveIndentation && normalizeCodeLine(av, false) == normalizeCodeLine(ev, false) && leadingIndent(av) != leadingIndent(ev) ->\n                        "${i + 1}번째 핵심 줄의 들여쓰기가 다릅니다. 내 코드 들여쓰기 ${leadingIndent(av)}칸 / 학습 예제 ${leadingIndent(ev)}칸"\n                    else -> "${i + 1}번째 핵심 줄이 다릅니다. 내 코드: `$av` / 학습 예제: `$ev`"\n                }\n            }\n        }\n        return ""\n    }'
              ),
              (
                  '    private fun meaningfulLines(code: String) = code.lines().map { stripComment(it).trim() }.filter { it.isNotEmpty() }\n    private fun canonical(code: String) = meaningfulLines(code).joinToString("\\n") { normalizeCodeLine(it) }\n    private fun normalizeCodeLine(value: String) = value.replace(Regex("\\\\s+"), "")',
                  '    private fun meaningfulLines(code: String, preserveIndentation: Boolean = false) = code.lines()\n        .map { stripComment(it).replace("\\t", "    ").let { line -> if (preserveIndentation) line.trimEnd() else line.trim() } }\n        .filter { it.trim().isNotEmpty() }\n    private fun canonical(code: String, preserveIndentation: Boolean = false) =\n        meaningfulLines(code, preserveIndentation).joinToString("\\n") { normalizeCodeLine(it, preserveIndentation) }\n    private fun normalizeCodeLine(value: String, preserveIndentation: Boolean = false): String {\n        if (!preserveIndentation) return value.replace(Regex("\\\\s+"), "")\n        val expanded = value.replace("\\t", "    ")\n        return "${leadingIndent(expanded)}:${expanded.trimStart().replace(Regex("\\\\s+"), "")}"\n    }\n    private fun leadingIndent(value: String): Int {\n        val expanded = value.replace("\\t", "    ")\n        return expanded.length - expanded.trimStart().length\n    }'
              )
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/futuretech/poweruser/education/PracticeFeedbackEngine.kt

      - name: Re-run the two previously failing areas first
        run: |
          ./gradlew testDebugUnitTest \
            --tests '*FeedbackExtreme60Test' \
            --tests '*PracticeFeedbackEngineTest' \
            --stacktrace

      - name: Commit proven fix to feedback branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/futuretech/poweruser/education/PracticeFeedbackEngine.kt
          git commit -m 'Fix Python indentation-aware feedback comparison'
          git push origin HEAD:fix/feedback-engine-v1
          mkdir -p feedback_evidence
          {
            echo "FIX_COMMIT=$(git rev-parse HEAD)"
            echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
            echo "Python indentation is preserved for code rewrite/debug comparisons."
          } | tee feedback_evidence/indentation_fix.txt

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x tools/lecture_quality_report.py
          chmod +x tools/feedback_quality_report.py
          chmod +x tools/final_release_smoke.sh

      - name: Run all JVM unit tests from start to finish
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify lecture engine still CLEAN
        run: python tools/lecture_quality_report.py

      - name: Verify feedback Extreme60 and CLEAN25
        run: python tools/feedback_quality_report.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and verify release APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk final-dist/FutureTechPowerUser_v1.0.0_FEEDBACK_FINAL_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk \
            final-dist/FutureTechPowerUser_v1.0.0_FEEDBACK_FINAL_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk | tee final-dist/apksigner_verify.txt
          sha256sum final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk | tee final-dist/FutureTechPowerUser_v1.0.0_FINAL.sha256
          rm final-dist/FutureTechPowerUser_v1.0.0_FEEDBACK_FINAL_aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 34 full instrumentation and signed release smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest --stacktrace
            bash tools/final_release_smoke.sh

      - name: Upload complete fix evidence and signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-indentation-fix-full-regression-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            feedback_evidence/
            lecture_evidence/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/debug/app-debug.apk
            final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk
            final-dist/FutureTechPowerUser_v1.0.0_FINAL.sha256
            final-dist/apksigner_verify.txt
            final-dist/launch_smoke.txt
            final-dist/logcat_full.txt
            final-dist/logcat_crash_excerpt.txt
