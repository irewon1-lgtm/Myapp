name: Seoul Quick 72h Check
on:
  push:
    branches: [danggn-search-bot]
    paths:
      - '.github/workflows/seoul-quick72h.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare isolated quick scanner
        run: |
          cp danggn-bot/hourly-scan.mjs /tmp/q.mjs
          python - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/q.mjs')
          s=p.read_text()
          s=s.replace("const STATE_PATH = new URL('./hourly-state.json', import.meta.url);","const STATE_PATH = new URL('./q-state.json', import.meta.url);")
          s=s.replace("const RESULT_PATH = new URL('./hourly-result.json', import.meta.url);","const RESULT_PATH = new URL('./q-result.json', import.meta.url);")
          s=s.replace("const WINDOW_HOURS = 6;","const WINDOW_HOURS = 72;")
          s=s.replace("const DETAIL_LIMIT_PER_CITY = 80;","const DETAIL_LIMIT_PER_CITY = 30;")
          s=s.replace("const UNKNOWN_NEWNESS_PROBE_LIMIT_PER_CITY = 40;","const UNKNOWN_NEWNESS_PROBE_LIMIT_PER_CITY = 20;")
          s=s.replace("async function getHtml(url, attempts = 2)","async function getHtml(url, attempts = 1)")
          s=s.replace("AbortSignal.timeout(10000)","AbortSignal.timeout(6000)")
          old=re.search(r"const CITIES = \[[\s\S]*?\n\];",s)
          new="""const CITIES = [
            { name: '송파구', regionNames: ['잠실본동','가락본동','문정2동'] },
            { name: '광진구', regionNames: ['광장동','화양동','자양제4동'] },
            { name: '서초구', regionNames: ['서초1동','반포1동','양재1동'] },
            { name: '강남구', regionNames: ['역삼1동','대치1동','수서동'] },
            { name: '강동구', regionNames: ['천호동','명일동','고덕제1동'] }
          ];"""
          if not old: raise SystemExit('CITIES block not found')
          s=s[:old.start()]+new+s[old.end():]
          s=s.replace("r.name1 === '경기도'","r.name1 === '서울특별시'")
          s=s.replace("'경기도 ' + city.name","'서울특별시 ' + city.name")
          p.write_text(s)
          pathlib.Path('/tmp/q-state.json').write_text('{"version":1,"updatedAt":null,"items":{}}')
          PY
      - name: Run scan
        run: node /tmp/q.mjs
      - name: Show result
        run: cat /tmp/q-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: seoul-quick72h-result
          path: /tmp/q-result.json
          retention-days: 1
