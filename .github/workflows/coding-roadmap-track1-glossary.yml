name: Coding Roadmap Track 1 Glossary Balance

on:
  push:
    branches: [coding-roadmap-track1-glossary-v0.8.2]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-track1-glossary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify glossary density and Track 2 transition
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          root = Path('app/src/main/assets/content')
          catalog = json.loads((root/'catalog.json').read_text())
          tracks = catalog['tracks']

          assert tracks[0]['available'] is True and len(tracks[0]['chapters']) == 8
          assert tracks[1]['available'] is True and tracks[1]['chapters'] == [
              '조건문 if','반복문 for·while','함수 만들기','리스트와 딕셔너리',
              '문자열 다루기','파일 읽기와 쓰기','예외 처리','Python 자동화 미니 프로젝트'
          ]
          assert all(t['available'] is False for t in tracks[2:])

          expected = ['glossary','glossary','concept','visual','example','practice','check','summary']
          lines = []
          glossary_entries = 0

          def body_chars(p):
              s = ''.join(p.get('paragraphs',[])) + ''.join(p.get('bullets',[]))
              for key in ('codeNote','calloutBody','practicePrompt','question','answer','mistake'):
                  s += p.get(key) or ''
              for e in p.get('extras',[]):
                  s += e.get('title','') + e.get('body','')
              for g in p.get('glossary',[]):
                  s += g['term'] + g['description'] + g['usage'] + g['example']
              return len(s)

          def estimate(p):
              n = 4 + math.ceil(body_chars(p)/32)
              if p.get('code'):
                  n += 2 + len(p['code'].splitlines())
              if p.get('visual'):
                  n += 7
              if p.get('glossary'):
                  n += len(p['glossary'])*2
              return n

          for i in range(1,9):
              ch = json.loads((root/'track01'/f'ch{i:02d}.json').read_text())
              assert len(ch['pages']) == 8
              assert [p['kind'] for p in ch['pages']] == expected

              for gp in ch['pages'][:2]:
                  assert len(gp.get('glossary',[])) == 3
                  for g in gp['glossary']:
                      glossary_entries += 1
                      assert g['term'].strip()
                      assert g['usage'].strip()
                      assert g['example'].strip()
                      sentence_count = g['description'].count('.')
                      assert 2 <= sentence_count <= 3, (g['term'], sentence_count, g['description'])

              for p in ch['pages']:
                  assert p.get('title') and p.get('eyebrow')
                  lines.append(estimate(p))

          assert glossary_entries == 48
          assert len(lines) == 64
          spread = max(lines)-min(lines)
          assert spread <= 3, (min(lines), max(lines), spread)
          assert min(lines) >= 32
          print(f'GLOSSARY_BALANCE_GATE=PASS pages=64 glossary={glossary_entries} estimated_lines={min(lines)}..{max(lines)} spread={spread}')
          PY

          grep -R -n 'GlossaryEntry' app/src/main/java/com/codingroadmap/app
          grep -R -n '어디서 쓰나요' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n '간단한 예시' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'TrackDescriptionPanel' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'store.setPosition(nextTrack' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'screen = "library"' app/src/main/java/com/codingroadmap/app/ui/AppRoot.kt
          grep -R -n 'navigationBarsPadding' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectTapGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectHorizontalDragGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'versionName = "0.8.2"' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          for i in 01 02 03 04 05 06 07 08; do
            unzip -l "$APK" | grep "assets/content/track01/ch$i.json"
          done
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.2'" /tmp/badging.txt
          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.8.2_TRACK1_GLOSSARY_BALANCED.apk
          sha256sum dist/CodingRoadmapFresh_v0.8.2_TRACK1_GLOSSARY_BALANCED.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.2_TRACK1_GLOSSARY_BALANCED
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.2_TRACK1_GLOSSARY_BALANCED.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
