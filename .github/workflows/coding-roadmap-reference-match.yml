name: Coding Roadmap Reference Match

on:
  push:
    branches: [coding-roadmap-reference-match-v0.7.1]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-reference-match.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify page chapter track navigation
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'navigationBarsPadding' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'LazyRow' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectTapGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectHorizontalDragGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'focusMode' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'READER_PAGES_PER_CHAPTER' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'currentPage' app/src/main/java/com/codingroadmap/app
          grep -R -n 'page < READER_PAGES_PER_CHAPTER' app/src/main/java/com/codingroadmap/app/ui
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'versionName = "0.7.3"' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/content/catalog.json'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.7.3'" /tmp/badging.txt
          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.7.3_PAGE_CHAPTER_TRACK.apk
          sha256sum dist/CodingRoadmapFresh_v0.7.3_PAGE_CHAPTER_TRACK.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.7.3_PAGE_CHAPTER_TRACK
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.7.3_PAGE_CHAPTER_TRACK.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
