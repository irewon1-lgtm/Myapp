name: Build fresh coding roadmap APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'fresh-coding-roadmap/**'
      - '.github/workflows/build-fresh-coding-roadmap.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build fresh APK
        working-directory: fresh-coding-roadmap
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p fresh-apk
          cp fresh-coding-roadmap/app/build/outputs/apk/debug/app-debug.apk fresh-apk/CodingRoadmapFresh_Track1-2_v0.7.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh-Track1-2-v0.7.0
          path: fresh-apk/CodingRoadmapFresh_Track1-2_v0.7.0.apk
          retention-days: 30
