name: V5 11-track installed reader validation once

on:
  push:
    branches:
      - textbook-v5-recovery-20260918
    paths:
      - '.github/workflows/v5-alltracks-installed-reader-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js
          chmod +x ./gradlew
          chmod +x tools/v5_alltracks_android_test.sh

      - name: V5 content audit diagnostic
        id: v5audit
        continue-on-error: true
        run: python tools/v5_content_audit.py > alltracks_v5_audit.json

      - name: Unit and Android-test build verification
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 verify all 11 TRACK readers and exact installable APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/v5_alltracks_android_test.sh

      - name: Upload exact tested installable APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coding-Textbook-Recovery-11TRACKS-v1.2.16
          retention-days: 1
          if-no-files-found: error
          path: |
            final-dist/Coding_Textbook_Recovery_11TRACKS_20260918.apk
            final-dist/Coding_Textbook_Recovery_11TRACKS_20260918.sha256
            alltracks-validation/
            alltracks_v5_audit.json
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
