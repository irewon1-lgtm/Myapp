name: Verify real runtimes and AI modes

on:
  push:
    branches:
      - fix/problem-engine-v2
  workflow_dispatch:

jobs:
  runtime-ai-extreme-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13 for Chaquopy build
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20 for TypeScript compiler bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare official TypeScript compiler assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Make scripts executable
        run: chmod +x ./gradlew tools/run_runtime_extreme.sh tools/runtime_cleanpass.py tools/ai_cleanpass.py

      - name: Run JVM unit tests and AI Extreme60
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator Runtime Extreme60 + AI UI credential tests + Runtime CLEAN25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/run_runtime_extreme.sh

      - name: AI three-mode CLEAN25
        run: python tools/ai_cleanpass.py

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ai-extreme-clean-evidence
          if-no-files-found: warn
          path: |
            runtime_extreme_report.json
            runtime_cleanpass_report.md
            runtime_instrumentation_output.txt
            ai_extreme_report.json
            ai_cleanpass_report.md
            app/build/test-results/testDebugUnitTest/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/apk/debug/app-debug.apk
