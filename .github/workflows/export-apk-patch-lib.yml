name: Export APK patch native lib

on:
  push:
    branches:
      - tmp/apk-patch-tools-20260920
    paths:
      - '.github/workflows/export-apk-patch-lib.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export libc++ used by Android build tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          DIR="$ANDROID_HOME/build-tools/$BT"
          LIBCPP="$(find "$DIR" -name 'libc++.so' -type f | head -n 1)"
          test -n "$LIBCPP"
          mkdir -p out
          cp "$LIBCPP" out/libc++.so
          sha256sum out/libc++.so > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk-patch-native-lib
          path: out/*
          retention-days: 1
