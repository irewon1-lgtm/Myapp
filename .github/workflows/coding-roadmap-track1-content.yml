name: Coding Roadmap Track 1 Content

on:
  push:
    branches: [coding-roadmap-track1-content-v0.8.0]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-track1-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Track 1 source content
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('app/src/main/assets/content')
          catalog = json.loads((root / 'catalog.json').read_text())
          tracks = catalog['tracks']
          assert len(tracks) == 4
          assert tracks[0]['available'] is True and len(tracks[0]['chapters']) == 8
          assert all(t['available'] is False and len(t['chapters']) == 0 for t in tracks[1:])

          expected = ['concept','visual','example','practice','check','summary']
          total_pages = 0
          for i in range(1, 9):
              p = root / 'track01' / f'ch{i:02d}.json'
              assert p.exists(), p
              ch = json.loads(p.read_text())
              assert ch['chapter'] == i
              assert ch['title'] == tracks[0]['chapters'][i-1]
              assert len(ch['pages']) == 6
              assert [x['kind'] for x in ch['pages']] == expected
              assert all(x.get('title') and x.get('eyebrow') for x in ch['pages'])
              total_pages += len(ch['pages'])

          assert total_pages == 48
          corpus = ''.join((root/'track01'/f'ch{i:02d}.json').read_text() for i in range(1,9))
          assert '용어집 1/4' not in corpus
          assert 'SyntaxError' in corpus and 'input()' in corpus and 'test case' in corpus
          print('TRACK1_CONTENT_GATE=PASS chapters=8 pages=48')
          PY

          grep -R -n 'Track1ContentLoader' app/src/main/java/com/codingroadmap/app
          grep -R -n 'ConceptDiagram' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n '정답·해설 보기' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'navigationBarsPadding' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectTapGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectHorizontalDragGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'focusMode' app/src/main/java/com/codingroadmap/app/ui
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'versionName = "0.8.0"' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/content/catalog.json'
          for i in 01 02 03 04 05 06 07 08; do
            unzip -l "$APK" | grep "assets/content/track01/ch$i.json"
          done

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.0'" /tmp/badging.txt

          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.8.0_TRACK1_CONTENT.apk
          sha256sum dist/CodingRoadmapFresh_v0.8.0_TRACK1_CONTENT.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.0_TRACK1_CONTENT
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.0_TRACK1_CONTENT.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
