name: Compile CodingRoadmap live shell
on:
  push:
    branches: [coding-roadmap-live]
    paths: ['android-live/**', '.github/workflows/coding-roadmap-live.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile stable offline-capable shell
        shell: bash
        run: |
          set -euo pipefail
          SDK_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$SDK_JAR"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p compiled dex out
          javac -source 8 -target 8 -classpath "$SDK_JAR" -d compiled android-live/com/codingroadmap/live/LiveActivity.java
          jar cf shell.jar -C compiled .
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/d8" --lib "$SDK_JAR" --min-api 26 --output dex shell.jar
          cp dex/classes.dex out/classes3.dex
          sha256sum out/classes3.dex > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coding-roadmap-live-shell
          path: out/*
          retention-days: 7
