name: Import YouTube source q-j2scvSwdA
on:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/import-youtube-q-j2scvSwdA.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Try multiple YouTube extraction routes
        shell: bash
        run: |
          set +e
          python -m pip install -q 'yt-dlp[default,curl-cffi]'
          mkdir -p imports/q-j2scvSwdA/attempts
          URL='https://www.youtube.com/watch?v=q-j2scvSwdA'
          curl -fL --max-time 30 'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=q-j2scvSwdA&format=json' -o imports/q-j2scvSwdA/oembed.json 2>imports/q-j2scvSwdA/attempts/oembed.err
          for client in android_vr web_embedded tv_embedded ios mweb web_creator; do
            echo "TRY $client"
            yt-dlp --no-playlist --skip-download --js-runtimes node --remote-components ejs:github --impersonate chrome --extractor-args "youtube:player_client=$client" --dump-single-json "$URL" > "imports/q-j2scvSwdA/attempts/$client.json" 2> "imports/q-j2scvSwdA/attempts/$client.err"
            python - "$client" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path('imports/q-j2scvSwdA/attempts')/(sys.argv[1]+'.json')
          try:
              d=json.loads(p.read_text() or 'null')
              ok=isinstance(d,dict) and d.get('id') and d.get('title')
          except Exception: ok=False
          raise SystemExit(0 if ok else 1)
          PY
            if [ $? -eq 0 ]; then
              cp "imports/q-j2scvSwdA/attempts/$client.json" imports/q-j2scvSwdA/metadata.json
              yt-dlp --no-playlist --skip-download --js-runtimes node --remote-components ejs:github --impersonate chrome --extractor-args "youtube:player_client=$client" --write-subs --write-auto-subs --sub-langs 'ko.*,ko,en.*,en' --sub-format vtt -o 'imports/q-j2scvSwdA/video.%(ext)s' "$URL" > "imports/q-j2scvSwdA/attempts/$client-subs.out" 2> "imports/q-j2scvSwdA/attempts/$client-subs.err"
              break
            fi
          done
          find imports/q-j2scvSwdA -maxdepth 2 -type f -printf '%p %s bytes\\n' | sort
      - name: Commit source attempts
        shell: bash
        run: |
          git config user.name 'Chatbook Source Importer'
          git config user.email 'chatbook-import@users.noreply.github.com'
          git add imports/q-j2scvSwdA
          if ! git diff --cached --quiet; then
            git commit -m 'Probe requested YouTube source with alternate clients'
            git push origin chatbook-app-20260923
          fi