name: Build Track2 Python Chapter1 v0.7.1

on:
  push:
    branches:
      - track2-python-ch1-expanded-20260920
    paths:
      - 'fresh-coding-roadmap/**'
      - '.github/workflows/build-track2-python-ch1-v071.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify expanded Python chapter 1 source
        shell: bash
        run: |
          set -euo pipefail
          FILE="fresh-coding-roadmap/app/src/main/java/com/codingroadmap/app/Track2Lesson01.java"
          test -f "$FILE"
          test "$(grep -c 'out.add(Track2Content.page(' "$FILE")" -eq 43
          grep -Fq 'P01 · Python과 if를 오늘 처음 본 사람에게' "$FILE"
          grep -Fq 'P26 · Decision Table' "$FILE"
          grep -Fq 'P43 · 프로젝트 정답 + 테스트 + Chapter 1 마무리' "$FILE"
          grep -Fq "versionCode 8" fresh-coding-roadmap/app/build.gradle
          grep -Fq "versionName '0.7.1'" fresh-coding-roadmap/app/build.gradle
          echo "Track2 Python Chapter1 source gate: PASS"

      - name: Build Android debug APK
        working-directory: fresh-coding-roadmap
        run: gradle assembleDebug --stacktrace

      - name: Package APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-apk
          cp fresh-coding-roadmap/app/build/outputs/apk/debug/app-debug.apk             final-apk/CodingRoadmapFresh_Track2_Python_CH1_v0.7.1.apk
          sha256sum final-apk/CodingRoadmapFresh_Track2_Python_CH1_v0.7.1.apk             | tee final-apk/CodingRoadmapFresh_Track2_Python_CH1_v0.7.1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh-Track2-Python-CH1-v0.7.1
          path: final-apk/*
          if-no-files-found: error
          retention-days: 30
