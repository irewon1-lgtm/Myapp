name: Verify curriculum items 1-3 cleanpass

on:
  push:
    branches:
      - fix/curriculum-1-3-cleanpass
  workflow_dispatch:

jobs:
  curriculum-1-3-cleanpass:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Prepare scripts
        run: |
          chmod +x ./gradlew
          chmod +x tools/lecture_quality_report.py
          chmod +x tools/feedback_quality_report.py
          chmod +x tools/review_quality_report.py
          chmod +x tools/textbook_quality_report.py
          chmod +x tools/tablet_capture_smoke.sh

      - name: Run full JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run curriculum Extreme60 and CLEAN25 report
        run: python tools/textbook_quality_report.py

      - name: Run existing lecture regression
        run: python tools/lecture_quality_report.py

      - name: Run existing feedback regression
        run: python tools/feedback_quality_report.py

      - name: Run existing review regression
        run: python tools/review_quality_report.py

      - name: Build debug and unsigned release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 34 phone and Galaxy Tab focused-reader regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            mkdir -p textbook_evidence
            ./gradlew connectedDebugAndroidTest --stacktrace
            bash tools/tablet_capture_smoke.sh textbook_evidence

      - name: Upload cleanpass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-1-3-cleanpass-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            textbook_evidence/
            review_evidence/
            feedback_evidence/
            lecture_evidence/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
