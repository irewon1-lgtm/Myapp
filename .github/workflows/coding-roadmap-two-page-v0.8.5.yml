name: Coding Roadmap Two Page Tab S10 FE

on:
  push:
    branches: [coding-roadmap-two-page-v0.8.5]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-two-page-v0.8.5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify two-page content contract
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base=Path('app/src/main/assets/content/track01')
          files=sorted(base.glob('ch*.json'))
          assert len(files)==8, len(files)

          authored=0
          extras=0
          for f in files:
              data=json.loads(f.read_text())
              assert len(data['pages'])==8, (f, len(data['pages']))
              authored += len(data['pages'])
              for page in data['pages']:
                  assert page.get('title')
                  assert page.get('extras'), (f, page.get('title'))
                  extras += len(page['extras'])

          assert authored==64, authored
          assert authored*2==128
          assert extras>0
          print(f'AUTHORED_PAGES={authored}')
          print(f'EXPANDED_PAGES={authored*2}')
          print(f'AUTHORED_EXTRAS={extras}')
          PY

          grep -n 'flatMap(::expandPage)' app/src/main/java/com/codingroadmap/app/data/TwoPageContentExpander.kt
          grep -n 'return listOf(first, second)' app/src/main/java/com/codingroadmap/app/data/TwoPageContentExpander.kt
          grep -n 'sections += source.extras' app/src/main/java/com/codingroadmap/app/data/TwoPageContentExpander.kt
          grep -n 'ExtraSection("정답·해설"' app/src/main/java/com/codingroadmap/app/data/TwoPageContentExpander.kt
          grep -n 'kind = "depth"' app/src/main/java/com/codingroadmap/app/data/TwoPageContentExpander.kt
          grep -n 'TwoPageContentExpander.expand' app/src/main/java/com/codingroadmap/app/data/TrackContent.kt

          ! grep -q 'MoreExtrasDialog' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          ! grep -q 'showMoreExtras' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          ! grep -q 'visibleExtras' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          ! grep -q 'overflowCeiling' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          ! grep -q '추가 설명 .*보기' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -n 'pageData.extras.forEach' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt

          grep -n 'smallestScreenWidthDp >= 600' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -n 'screenHeightDp >= 900' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -n 'Configuration.ORIENTATION_PORTRAIT' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -n 'depthPage' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -n '0.92f' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt

          grep -n 'versionCode = 16' app/build.gradle.kts
          grep -n 'versionName = "0.8.5"' app/build.gradle.kts
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK and write QA receipt
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/content/catalog.json'
          for n in 01 02 03 04 05 06 07 08; do
            unzip -l "$APK" | grep "assets/content/track01/ch$n.json"
          done

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.5'" /tmp/badging.txt

          mkdir -p dist
          OUT=dist/CodingRoadmapFresh_v0.8.5_TWO_PAGE_TAB_S10_FE.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee dist/SHA256.txt
          {
            echo 'TWO_PAGE_CONTRACT=PASS'
            echo 'AUTHORED_PAGES=64'
            echo 'EXPANDED_RUNTIME_PAGES=128'
            echo 'CONTENT_POPUP=REMOVED'
            echo 'AUTO_HIDE_EXTRAS=REMOVED'
            echo 'TAB_S10_FE_PROFILE=ENABLED'
            echo 'VERSION=0.8.5'
          } | tee dist/TWO_PAGE_QA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.5_TWO_PAGE_TAB_S10_FE
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.5_TWO_PAGE_TAB_S10_FE.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/dist/TWO_PAGE_QA.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
