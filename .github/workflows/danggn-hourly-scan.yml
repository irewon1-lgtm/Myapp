name: Danggn Hourly Sequential Scan

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-hourly-scan.yml'
      - 'ops/danggn-hourly-trigger.txt'

permissions:
  contents: write

concurrency:
  group: danggn-hourly-sequential-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout Danggn branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sequential scanner
        id: scanner
        continue-on-error: true
        run: node danggn-bot/hourly-scan.mjs

      - name: Keep unconfirmed candidates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          result_path = Path("danggn-bot/hourly-result.json")
          pending_path = Path("danggn-bot/pending-alerts.json")

          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except Exception:
              result = {"candidates": []}

          try:
              pending_doc = json.loads(pending_path.read_text(encoding="utf-8"))
          except Exception:
              pending_doc = {"version": 1, "updatedAt": None, "items": {}}

          items = pending_doc.get("items")
          if not isinstance(items, dict):
              items = {}

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for candidate in result.get("candidates") or []:
              key = str(candidate.get("id") or candidate.get("url") or "").strip()
              if not key:
                  continue
              old = items.get(key) if isinstance(items.get(key), dict) else {}
              items[key] = {
                  "id": candidate.get("id"),
                  "title": candidate.get("title") or candidate.get("modelHint") or "노트북 매물",
                  "price": candidate.get("price"),
                  "previousPrice": candidate.get("previousPrice"),
                  "changeType": candidate.get("changeType"),
                  "city": candidate.get("city"),
                  "location": candidate.get("location"),
                  "cpuHint": candidate.get("cpuHint"),
                  "ramGB": candidate.get("ramGB"),
                  "storageGB": candidate.get("storageGB"),
                  "postedAt": candidate.get("postedAt"),
                  "url": candidate.get("url"),
                  "firstAlertedAt": old.get("firstAlertedAt") or now,
                  "lastCandidateAt": now
              }

          pending_doc = {
              "version": 1,
              "updatedAt": now,
              "items": items
          }
          pending_path.write_text(
              json.dumps(pending_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("pending alerts:", len(items))
          PY

      - name: Persist latest state and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danggn-hourly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add danggn-bot/hourly-state.json danggn-bot/hourly-result.json danggn-bot/pending-alerts.json

          if git diff --cached --quiet; then
            echo "No state/result changes"
            exit 0
          fi

          git commit -m "chore: hourly danggn snapshot [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:danggn-search-bot; then
              exit 0
            fi
            git fetch origin danggn-search-bot --depth=20
            git rebase origin/danggn-search-bot
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 2))
          done

          echo "Failed to persist hourly Danggn state/result"
          exit 1

      - name: Send ntfy setup test
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        shell: bash
        run: |
          if [ -z "${NTFY_URL:-}" ]; then
            echo "NTFY_URL secret is missing"
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Title: Danggn alert connected" \
            -H "Priority: high" \
            -H "Tags: white_check_mark" \
            --data-binary "당근 알림 연결 완료. GitHub 검색은 매시간 07/27/47분에 실행됩니다." \
            "$NTFY_URL"

      - name: Notify unconfirmed candidates
        if: always()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = os.environ.get("NTFY_URL", "").strip()
          if not url:
              print("NTFY_URL secret is missing; notification skipped")
              raise SystemExit(0)

          pending_path = Path("danggn-bot/pending-alerts.json")
          result_path = Path("danggn-bot/hourly-result.json")

          try:
              pending_doc = json.loads(pending_path.read_text(encoding="utf-8"))
              pending = list((pending_doc.get("items") or {}).values())
          except Exception:
              pending = []

          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
              health = (result.get("health") or {}).get("status")
          except Exception:
              health = "failed"

          if health and health != "ok":
              req = urllib.request.Request(
                  url,
                  data=("당근 검색 오류: health.status=" + str(health)).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "text/plain; charset=utf-8",
                      "Title": "Danggn search error",
                      "Priority": "high",
                      "Tags": "warning"
                  }
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("health alert:", r.status)

          if not pending:
              print("no unconfirmed candidates")
              raise SystemExit(0)

          def won(value):
              try:
                  n = int(float(value))
                  return f"{n:,}원"
              except Exception:
                  return "가격 확인 필요"

          lines = [
              "미확인 당근 매물입니다.",
              'ChatGPT에 "확인"이라고 말할 때까지 매 검색마다 반복 알림됩니다.',
              ""
          ]

          for idx, item in enumerate(pending[:15], start=1):
              title = str(item.get("title") or "노트북 매물").replace("\n", " ").strip()
              place = " ".join(str(x) for x in [item.get("city"), item.get("location")] if x)
              spec = " · ".join(
                  str(x) for x in [
                      item.get("cpuHint"),
                      ("RAM " + str(item.get("ramGB")) + "GB") if item.get("ramGB") else None,
                      ("SSD " + str(item.get("storageGB")) + "GB") if item.get("storageGB") else None
                  ] if x
              )
              lines.append(f"[{idx}] {title}")
              lines.append(won(item.get("price")) + ((" · " + place) if place else ""))
              if spec:
                  lines.append(spec)
              if item.get("url"):
                  lines.append(str(item.get("url")))
              lines.append("")

          if len(pending) > 15:
              lines.append(f"외 미확인 {len(pending) - 15}건")

          body = "\n".join(lines).strip()
          headers = {
              "Content-Type": "text/plain; charset=utf-8",
              "Title": "Danggn unconfirmed listings",
              "Priority": "high",
              "Tags": "computer,rotating_light"
          }

          first_url = next((str(x.get("url")) for x in pending if x.get("url")), None)
          if first_url:
              headers["Click"] = first_url

          req = urllib.request.Request(
              url,
              data=body.encode("utf-8"),
              method="POST",
              headers=headers
          )
          with urllib.request.urlopen(req, timeout=10) as r:
              print("pending alert:", r.status, "count:", len(pending))
          PY

      - name: Mark failed scan
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Danggn scanner reported a failure"
          exit 1
