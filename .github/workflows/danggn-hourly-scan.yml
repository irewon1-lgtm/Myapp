name: Danggn Hourly Sequential Scan

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-hourly-scan.yml'
      - 'ops/danggn-hourly-trigger.txt'

permissions:
  contents: write

concurrency:
  group: danggn-hourly-sequential-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout Danggn branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sequential scanner
        id: scanner
        continue-on-error: true
        run: node danggn-bot/hourly-scan.mjs

      - name: Keep unconfirmed candidates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          result_path = Path("danggn-bot/hourly-result.json")
          pending_path = Path("danggn-bot/pending-alerts.json")

          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except Exception:
              result = {"candidates": []}

          try:
              pending_doc = json.loads(pending_path.read_text(encoding="utf-8"))
          except Exception:
              pending_doc = {"version": 1, "updatedAt": None, "items": {}}

          items = pending_doc.get("items")
          if not isinstance(items, dict):
              items = {}

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for candidate in result.get("candidates") or []:
              key = str(candidate.get("id") or candidate.get("url") or "").strip()
              if not key:
                  continue
              old = items.get(key) if isinstance(items.get(key), dict) else {}
              items[key] = {
                  "id": candidate.get("id"),
                  "title": candidate.get("title") or candidate.get("modelHint") or "노트북 매물",
                  "price": candidate.get("price"),
                  "previousPrice": candidate.get("previousPrice"),
                  "changeType": candidate.get("changeType"),
                  "city": candidate.get("city"),
                  "location": candidate.get("location"),
                  "cpuHint": candidate.get("cpuHint"),
                  "ramGB": candidate.get("ramGB"),
                  "storageGB": candidate.get("storageGB"),
                  "postedAt": candidate.get("postedAt"),
                  "url": candidate.get("url"),
                  "firstAlertedAt": old.get("firstAlertedAt") or now,
                  "lastCandidateAt": now
              }

          pending_doc = {
              "version": 1,
              "updatedAt": now,
              "items": items
          }
          pending_path.write_text(
              json.dumps(pending_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("pending alerts:", len(items))
          PY

      - name: Persist latest state and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danggn-hourly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add danggn-bot/hourly-state.json danggn-bot/hourly-result.json danggn-bot/pending-alerts.json

          if git diff --cached --quiet; then
            echo "No state/result changes"
            exit 0
          fi

          git commit -m "chore: hourly danggn snapshot [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:danggn-search-bot; then
              exit 0
            fi
            git fetch origin danggn-search-bot --depth=20
            git rebase origin/danggn-search-bot
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 2))
          done

          echo "Failed to persist hourly Danggn state/result"
          exit 1

      - name: Ntfy notifications temporarily paused
        if: always()
        run: |
          echo "ntfy paused until high-confidence deal filter is installed"

      - name: Mark failed scan
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Danggn scanner reported a failure"
          exit 1
