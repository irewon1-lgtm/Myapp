name: Danggn Hourly Sequential Scan

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-hourly-scan.yml'
      - 'ops/danggn-hourly-trigger.txt'

permissions:
  contents: write

concurrency:
  group: danggn-hourly-sequential-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout Danggn branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sequential scanner
        id: scanner
        continue-on-error: true
        run: node danggn-bot/hourly-scan.mjs

      - name: Keep unconfirmed candidates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          result_path = Path("danggn-bot/hourly-result.json")
          pending_path = Path("danggn-bot/pending-alerts.json")

          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except Exception:
              result = {"candidates": []}

          try:
              pending_doc = json.loads(pending_path.read_text(encoding="utf-8"))
          except Exception:
              pending_doc = {"version": 1, "updatedAt": None, "items": {}}

          items = pending_doc.get("items")
          if not isinstance(items, dict):
              items = {}

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          for candidate in result.get("candidates") or []:
              key = str(candidate.get("id") or candidate.get("url") or "").strip()
              if not key:
                  continue
              old = items.get(key) if isinstance(items.get(key), dict) else {}
              items[key] = {
                  "id": candidate.get("id"),
                  "title": candidate.get("title") or candidate.get("modelHint") or "노트북 매물",
                  "price": candidate.get("price"),
                  "previousPrice": candidate.get("previousPrice"),
                  "changeType": candidate.get("changeType"),
                  "city": candidate.get("city"),
                  "location": candidate.get("location"),
                  "cpuHint": candidate.get("cpuHint"),
                  "ramGB": candidate.get("ramGB"),
                  "storageGB": candidate.get("storageGB"),
                  "postedAt": candidate.get("postedAt"),
                  "url": candidate.get("url"),
                  "firstAlertedAt": old.get("firstAlertedAt") or now,
                  "lastCandidateAt": now
              }

          pending_doc = {
              "version": 1,
              "updatedAt": now,
              "items": items
          }
          pending_path.write_text(
              json.dumps(pending_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("pending alerts:", len(items))
          PY

      - name: Send ntfy once for ChatGPT-approved deals
        if: always()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ntfy_url = os.environ.get("NTFY_URL", "").strip()
          if not ntfy_url:
              print("NTFY_URL missing; skip")
              raise SystemExit(0)

          approved_path = Path("danggn-bot/chatgpt-approved.json")
          sent_path = Path("danggn-bot/ntfy-sent.json")

          try:
              approved_doc = json.loads(approved_path.read_text(encoding="utf-8"))
          except Exception:
              approved_doc = {"version": 1, "updatedAt": None, "items": {}}

          try:
              sent_doc = json.loads(sent_path.read_text(encoding="utf-8"))
          except Exception:
              sent_doc = {"version": 1, "updatedAt": None, "items": {}}

          approved = approved_doc.get("items")
          sent = sent_doc.get("items")
          if not isinstance(approved, dict):
              approved = {}
          if not isinstance(sent, dict):
              sent = {}

          fresh = []
          for key, item in approved.items():
              if not isinstance(item, dict):
                  continue
              current_price = item.get("price")
              old = sent.get(key) if isinstance(sent.get(key), dict) else None
              old_price = old.get("price") if old else None

              first_time = old is None
              lower_price = (
                  old is not None
                  and isinstance(current_price, (int, float))
                  and isinstance(old_price, (int, float))
                  and current_price < old_price
              )
              if first_time or lower_price:
                  fresh.append((str(key), item))

          if not fresh:
              print("ntfy: no new approved deals")
              raise SystemExit(0)

          def won(v):
              try:
                  return f"{int(float(v)):,}원"
              except Exception:
                  return "가격 확인 필요"

          lines = ["당근 특가"]
          for idx, (_, item) in enumerate(fresh[:10], 1):
              title = str(item.get("title") or "노트북 매물").replace("\n", " ").strip()
              place = " ".join(str(x) for x in [item.get("city"), item.get("location")] if x)
              spec = " · ".join(
                  str(x) for x in [
                      item.get("cpuHint"),
                      ("RAM " + str(item.get("ramGB")) + "GB") if item.get("ramGB") else None,
                      ("SSD " + str(item.get("storageGB")) + "GB") if item.get("storageGB") else None
                  ] if x
              )
              lines.append(f"[{idx}] {title}")
              lines.append(won(item.get("price")) + ((" · " + place) if place else ""))
              if spec:
                  lines.append(spec)
              if item.get("dealReason"):
                  lines.append(str(item.get("dealReason")))
              if item.get("url"):
                  lines.append(str(item.get("url")))
              lines.append("")

          body = "\n".join(lines).strip()
          headers = {
              "Content-Type": "text/plain; charset=utf-8",
              "Title": "Danggn deal",
              "Priority": "high",
              "Tags": "computer,moneybag"
          }
          first_url = next((str(item.get("url")) for _, item in fresh if item.get("url")), None)
          if first_url:
              headers["Click"] = first_url

          req = urllib.request.Request(
              ntfy_url,
              data=body.encode("utf-8"),
              method="POST",
              headers=headers
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              print("ntfy status:", response.status)

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          for key, item in fresh:
              sent[key] = {
                  "id": item.get("id"),
                  "price": item.get("price"),
                  "url": item.get("url"),
                  "sentAt": now
              }

          sent_doc = {
              "version": 1,
              "updatedAt": now,
              "items": sent
          }
          sent_path.write_text(
              json.dumps(sent_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("ntfy approved one-time alerts:", len(fresh))
          PY

      - name: Persist latest state and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danggn-hourly-bot"
          git config user.email "actions@users.noreply.github.com"

          git add danggn-bot/hourly-state.json danggn-bot/hourly-result.json
          git add danggn-bot/pending-alerts.json danggn-bot/ntfy-sent.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state/result changes"
            exit 0
          fi

          git commit -m "chore: hourly danggn snapshot [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:danggn-search-bot; then
              exit 0
            fi
            git fetch origin danggn-search-bot --depth=20
            git rebase origin/danggn-search-bot
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 2))
          done

          echo "Failed to persist hourly Danggn state/result"
          exit 1

      - name: Mark failed scan
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Danggn scanner reported a failure"
          exit 1
