name: Verify home-first Galaxy Tab smoke

on:
  push:
    branches:
      - fix/home-first-tablet-test
  workflow_dispatch:

concurrency:
  group: home-first-tablet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare local TypeScript assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Build debug app and test APKs
        run: |
          chmod +x ./gradlew tools/tablet_capture_smoke.sh
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Galaxy Tab focused-reader smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/tablet_capture_smoke.sh tablet_evidence

      - name: Upload tablet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-first-tablet-evidence
          if-no-files-found: warn
          path: |
            tablet_evidence/**
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
