name: Verify V5 textbook gates once

on:
  push:
    branches:
      - textbook-v5-deep-book-engine
    paths:
      - '.github/workflows/verify-textbook-v5-once.yml'
  workflow_dispatch:

jobs:
  verify-v5-textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js
          chmod +x ./gradlew

      - name: V5 Python content audit
        if: always()
        run: python tools/v5_content_audit.py

      - name: V5 deterministic reader extreme simulation
        if: always()
        run: python tools/v5_reader_extreme_sim.py

      - name: V5 literal 5x scale corpus gate
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5BookScaleCorpusGateTest' --stacktrace

      - name: V5 editorial density gate
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5EditorialDensityGateTest' --stacktrace

      - name: V5 evidence coverage gate
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5EvidenceCoverageAssetTest' --stacktrace

      - name: V5 existing-part evidence contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5ExistingPartEvidenceContractTest' --stacktrace

      - name: V5 prerequisite concept contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5PrerequisiteConceptContractTest' --stacktrace

      - name: V5 frozen baseline source contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5FrozenBaselineSourceTest' --stacktrace

      - name: V5 source freshness contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5SourceFreshnessContractTest' --stacktrace

      - name: V5 reader source contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5BookReaderSourceContractTest' --stacktrace

      - name: V5 measured reader contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5MeasuredReaderContractTest' --stacktrace

      - name: V5 source registry contract
        if: always()
        run: ./gradlew testDebugUnitTest --tests 'com.futuretech.poweruser.textbook.V5BookSourceRegistryTest' --stacktrace

      - name: Full JVM unit test suite
        if: always()
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        if: always()
        run: ./gradlew assembleDebug --stacktrace
