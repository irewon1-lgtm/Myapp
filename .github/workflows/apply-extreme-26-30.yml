name: Apply Extreme 26-30 patch

on:
  push:
    branches:
      - fix/extreme-26-30
    paths:
      - .github/workflows/apply-extreme-26-30.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/extreme-26-30
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply app patch for scenarios 26-30
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor missing: {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # 26: narrow screen overflow hardening in the textbook top bar.
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/V1TextbookScreen.kt',
              '    Surface(color = ReaderPaper, shadowElevation = 2.dp) {\n',
              '    Surface(\n        modifier = Modifier.testTag("textbook_top_bar"),\n        color = ReaderPaper,\n        shadowElevation = 2.dp\n    ) {\n'
          )
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/V1TextbookScreen.kt',
              '''            OutlinedButton(\n                onClick = onNavigateBack,\n                border = BorderStroke(1.dp, ReaderBorder)\n            ) {\n                Text("전체 과정", color = ReaderInk)\n            }\n''',
              '''            OutlinedButton(\n                onClick = onNavigateBack,\n                border = BorderStroke(1.dp, ReaderBorder),\n                contentPadding = PaddingValues(horizontal = 10.dp, vertical = 6.dp)\n            ) {\n                Text("전체 과정", color = ReaderInk, fontSize = 13.sp, maxLines = 1)\n            }\n'''
          )
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/V1TextbookScreen.kt',
              '''                Text(\n                    text = chapter.title,\n                    color = ReaderInk,\n                    fontSize = 17.sp,\n                    lineHeight = 22.sp,\n                    fontWeight = FontWeight.Bold,\n                    maxLines = 2\n                )\n            }\n            Text(\n                text = "읽기 완료 $readCount/11",\n                color = ReaderMuted,\n                fontSize = 12.sp\n            )\n''',
              '''                Text(\n                    text = chapter.title,\n                    color = ReaderInk,\n                    fontSize = 17.sp,\n                    lineHeight = 22.sp,\n                    fontWeight = FontWeight.Bold,\n                    maxLines = 2\n                )\n                Text(\n                    text = "읽기 완료 $readCount/11",\n                    modifier = Modifier.testTag("textbook_read_progress"),\n                    color = ReaderMuted,\n                    fontSize = 11.sp,\n                    maxLines = 1\n                )\n            }\n'''
          )
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/V1TextbookScreen.kt',
              '''                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            Button(\n                                onClick = { checked = true },\n                                enabled = textAnswer.isNotBlank(),\n                                colors = ButtonDefaults.buttonColors(\n                                    containerColor = ReaderAction,\n                                    contentColor = ReaderInk\n                                )\n                            ) {\n                                Text(if (problem.type == LearningProblemType.OUTPUT_PREDICTION) "예상 저장" else "작성 완료")\n                            }\n                            OutlinedButton(onClick = onOpenPractice) {\n                                Text("전체 실습에서 실행", color = ReaderAccent)\n                            }\n                        }\n''',
              '''                        Column(\n                            modifier = Modifier.fillMaxWidth(),\n                            verticalArrangement = Arrangement.spacedBy(8.dp)\n                        ) {\n                            Button(\n                                onClick = { checked = true },\n                                enabled = textAnswer.isNotBlank(),\n                                modifier = Modifier.fillMaxWidth(),\n                                colors = ButtonDefaults.buttonColors(\n                                    containerColor = ReaderAction,\n                                    contentColor = ReaderInk\n                                )\n                            ) {\n                                Text(if (problem.type == LearningProblemType.OUTPUT_PREDICTION) "예상 저장" else "작성 완료")\n                            }\n                            OutlinedButton(\n                                onClick = onOpenPractice,\n                                modifier = Modifier.fillMaxWidth()\n                            ) {\n                                Text("전체 실습에서 실행", color = ReaderAccent)\n                            }\n                        }\n'''
          )

          # 26/27: review screen should remain readable at 360dp even with 100 queued cards.
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/SecondaryScreens.kt',
              '''                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.SpaceBetween,\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Text("오늘 복습 ${dueReviews.size}개", fontSize = 17.sp, fontWeight = FontWeight.Bold)\n                        Text("오늘 → 1 → 3 → 7 → 14일", fontSize = 12.sp, fontWeight = FontWeight.SemiBold)\n                    }\n''',
              '''                    Column(verticalArrangement = Arrangement.spacedBy(3.dp)) {\n                        Text("오늘 복습 ${dueReviews.size}개", fontSize = 17.sp, fontWeight = FontWeight.Bold)\n                        Text(\n                            "오늘 → 1 → 3 → 7 → 14일",\n                            fontSize = 12.sp,\n                            fontWeight = FontWeight.SemiBold,\n                            color = MaterialTheme.colorScheme.onPrimaryContainer.copy(alpha = 0.78f)\n                        )\n                    }\n'''
          )
          replace(
              'app/src/main/java/com/futuretech/poweruser/ui/SecondaryScreens.kt',
              '''                                Row(\n                                    modifier = Modifier.fillMaxWidth(),\n                                    horizontalArrangement = Arrangement.SpaceBetween,\n                                    verticalAlignment = Alignment.CenterVertically\n                                ) {\n                                    Surface(\n                                        shape = RoundedCornerShape(6.dp),\n                                        color = priorityColor.copy(alpha = 0.12f)\n                                    ) {\n                                        Text(\n                                            guidance.priority.label,\n                                            fontSize = 11.sp,\n                                            fontWeight = FontWeight.Bold,\n                                            color = priorityColor,\n                                            modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)\n                                        )\n                                    }\n                                    Text(\n                                        "${guidance.stageLabel} · ${guidance.progressLabel}",\n                                        fontSize = 11.sp,\n                                        color = MaterialTheme.colorScheme.outline\n                                    )\n                                }\n''',
              '''                                Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {\n                                    Surface(\n                                        shape = RoundedCornerShape(6.dp),\n                                        color = priorityColor.copy(alpha = 0.12f)\n                                    ) {\n                                        Text(\n                                            guidance.priority.label,\n                                            fontSize = 11.sp,\n                                            fontWeight = FontWeight.Bold,\n                                            color = priorityColor,\n                                            modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)\n                                        )\n                                    }\n                                    Text(\n                                        "${guidance.stageLabel} · ${guidance.progressLabel}",\n                                        fontSize = 11.sp,\n                                        lineHeight = 16.sp,\n                                        color = MaterialTheme.colorScheme.outline\n                                    )\n                                }\n'''
          )

          # 29: preserve data across Room schema upgrades and add indexes for accumulated queues.
          db_path = 'app/src/main/java/com/futuretech/poweruser/data/AppDatabase.kt'
          replace(
              db_path,
              'import androidx.room.*\nimport kotlinx.coroutines.flow.Flow\n',
              'import androidx.room.*\nimport androidx.room.migration.Migration\nimport androidx.sqlite.db.SupportSQLiteDatabase\nimport kotlinx.coroutines.flow.Flow\n'
          )
          replace(
              db_path,
              '@Entity(tableName = "spaced_repetition")\n',
              '@Entity(\n    tableName = "spaced_repetition",\n    indices = [Index(value = ["isMastered", "nextReviewTimestamp"])]\n)\n'
          )
          replace(
              db_path,
              '@Entity(tableName = "error_notes")\n',
              '@Entity(\n    tableName = "error_notes",\n    indices = [Index(value = ["occurrenceCount"])]\n)\n'
          )
          replace(db_path, '    version = 1,\n', '    version = 2,\n')
          replace(
              db_path,
              '''abstract class AppDatabase : RoomDatabase() {\n    abstract fun learningDao(): LearningDao\n}\n''',
              '''abstract class AppDatabase : RoomDatabase() {\n    abstract fun learningDao(): LearningDao\n\n    companion object {\n        val MIGRATION_1_2 = object : Migration(1, 2) {\n            override fun migrate(db: SupportSQLiteDatabase) {\n                db.execSQL(\n                    "CREATE INDEX IF NOT EXISTS index_spaced_repetition_isMastered_nextReviewTimestamp " +\n                        "ON spaced_repetition (isMastered, nextReviewTimestamp)"\n                )\n                db.execSQL(\n                    "CREATE INDEX IF NOT EXISTS index_error_notes_occurrenceCount " +\n                        "ON error_notes (occurrenceCount)"\n                )\n            }\n        }\n    }\n}\n'''
          )
          replace(
              'app/src/main/java/com/futuretech/poweruser/data/AppRepository.kt',
              '    ).fallbackToDestructiveMigration().build()\n',
              '    ).addMigrations(AppDatabase.MIGRATION_1_2).build()\n'
          )

          # 30: parse untrusted release JSON deterministically; invalid JSON becomes unavailable, never a crash.
          update_path = 'app/src/main/java/com/futuretech/poweruser/update/AppUpdateManager.kt'
          replace(
              update_path,
              '''            val body = connection.inputStream.bufferedReader().use { it.readText() }\n            val json = JSONObject(body)\n            val tag = json.optString("tag_name")\n            val latestVersion = tag.removePrefix("v").trim()\n            if (latestVersion.isBlank()) {\n                return@withContext CheckResult.Unavailable("release_version_missing")\n            }\n\n            val assets = json.optJSONArray("assets")\n                ?: return@withContext CheckResult.Unavailable("release_assets_missing")\n\n            var fallbackApkUrl: String? = null\n            var preferredApkUrl: String? = null\n            for (index in 0 until assets.length()) {\n                val asset = assets.optJSONObject(index) ?: continue\n                val name = asset.optString("name")\n                val url = asset.optString("browser_download_url")\n                if (url.isBlank()) continue\n                if (name == PREFERRED_ASSET) preferredApkUrl = url\n                if (fallbackApkUrl == null && name.endsWith(".apk", ignoreCase = true)) {\n                    fallbackApkUrl = url\n                }\n            }\n''',
              '''            val body = connection.inputStream.bufferedReader().use { it.readText() }\n            val release = parseReleaseJson(body)\n                ?: return@withContext CheckResult.Unavailable("release_json_invalid")\n            val tag = release.tagName\n            val latestVersion = tag.removePrefix("v").trim()\n            if (latestVersion.isBlank()) {\n                return@withContext CheckResult.Unavailable("release_version_missing")\n            }\n\n            var fallbackApkUrl: String? = null\n            var preferredApkUrl: String? = null\n            release.assets.forEach { asset ->\n                val name = asset.name\n                val url = asset.browserDownloadUrl\n                if (!url.startsWith("https://", ignoreCase = true)) return@forEach\n                if (name == PREFERRED_ASSET) preferredApkUrl = url\n                if (fallbackApkUrl == null && name.endsWith(".apk", ignoreCase = true)) {\n                    fallbackApkUrl = url\n                }\n            }\n'''
          )
          replace(
              update_path,
              '                    releaseNotes = json.optString("body")\n',
              '                    releaseNotes = release.releaseNotes\n'
          )
          replace(
              update_path,
              '\ninternal fun isNewerVersion(latest: String, current: String): Boolean {\n',
              '''\ninternal data class ReleaseAssetJson(\n    val name: String,\n    val browserDownloadUrl: String\n)\n\ninternal data class ParsedReleaseJson(\n    val tagName: String,\n    val releaseNotes: String,\n    val assets: List<ReleaseAssetJson>\n)\n\ninternal fun parseReleaseJson(body: String): ParsedReleaseJson? {\n    if (body.isBlank() || body.length > 512 * 1024) return null\n    return try {\n        val json = JSONObject(body)\n        val tag = json.optString("tag_name").trim()\n        val assetsJson = json.optJSONArray("assets") ?: return null\n        if (tag.isBlank()) return null\n\n        val assets = buildList {\n            for (index in 0 until assetsJson.length()) {\n                val asset = assetsJson.optJSONObject(index) ?: continue\n                val name = asset.optString("name").trim()\n                val url = asset.optString("browser_download_url").trim()\n                if (name.isNotBlank() && url.isNotBlank()) {\n                    add(ReleaseAssetJson(name, url))\n                }\n            }\n        }\n        ParsedReleaseJson(\n            tagName = tag,\n            releaseNotes = json.optString("body").take(20_000),\n            assets = assets\n        )\n    } catch (_: Throwable) {\n        null\n    }\n}\n\ninternal fun isNewerVersion(latest: String, current: String): Boolean {\n'''
          )

          # 30 tests.
          test_path = 'app/src/test/java/com/futuretech/poweruser/update/AppUpdateManagerTest.kt'
          replace(
              test_path,
              'import org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\n',
              'import org.junit.Assert.assertEquals\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertNull\nimport org.junit.Assert.assertTrue\n'
          )
          replace(
              test_path,
              '\n}\n',
              '''\n    @Test\n    fun malformedExternalReleaseJsonIsRejectedWithoutCrash() {\n        assertNull(parseReleaseJson("{not-json"))\n        assertNull(parseReleaseJson("[]"))\n        assertNull(parseReleaseJson("{\\"tag_name\\":\\"v1.2.7\\"}"))\n    }\n\n    @Test\n    fun malformedAssetsAreIgnoredButValidHttpsAssetSurvives() {\n        val parsed = parseReleaseJson(\n            """{\n                "tag_name":"v1.2.7",\n                "body":"ok",\n                "assets":[\n                    null,\n                    {"name":"bad.apk","browser_download_url":""},\n                    {"name":"good.apk","browser_download_url":"https://example.test/good.apk"}\n                ]\n            }""".trimIndent()\n        )\n        assertEquals("v1.2.7", parsed?.tagName)\n        assertEquals(1, parsed?.assets?.size)\n        assertEquals("good.apk", parsed?.assets?.single()?.name)\n    }\n}\n''',
              1
          )

          # 27/28/29 load regression tests using only local Room; no paid backend/API.
          scale_test = Path('app/src/test/java/com/futuretech/poweruser/data/DataScaleRegressionTest.kt')
          scale_test.write_text('''package com.futuretech.poweruser.data\n\nimport android.content.Context\nimport androidx.room.Room\nimport androidx.test.core.app.ApplicationProvider\nimport kotlinx.coroutines.flow.first\nimport kotlinx.coroutines.runBlocking\nimport org.junit.After\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Before\nimport org.junit.Test\nimport org.junit.runner.RunWith\nimport org.robolectric.RobolectricTestRunner\nimport org.robolectric.annotation.Config\n\n@RunWith(RobolectricTestRunner::class)\n@Config(sdk = [34])\nclass DataScaleRegressionTest {\n    private lateinit var db: AppDatabase\n    private lateinit var dao: LearningDao\n\n    @Before\n    fun setUp() {\n        val context = ApplicationProvider.getApplicationContext<Context>()\n        db = Room.inMemoryDatabaseBuilder(context, AppDatabase::class.java)\n            .allowMainThreadQueries()\n            .build()\n        dao = db.learningDao()\n    }\n\n    @After\n    fun tearDown() {\n        db.close()\n    }\n\n    @Test\n    fun reviewQueueHandles100DueItemsWithoutDroppingOrDuplicating() = runBlocking {\n        val now = 1_800_000_000_000L\n        repeat(100) { index ->\n            dao.insertOrUpdateRepetition(\n                SpacedRepetitionItemEntity(\n                    conceptId = "review-$index",\n                    conceptTitle = "복습 $index",\n                    category = "BEGINNER",\n                    definition = "정의 $index",\n                    analogy = "",\n                    example = "",\n                    comparison = "",\n                    reviewIntervalDays = 0,\n                    nextReviewTimestamp = now - index,\n                    reviewCount = 0,\n                    isMastered = false\n                )\n            )\n        }\n\n        val due = dao.getDueReviews(now)\n        assertEquals(100, due.size)\n        assertEquals(100, due.map { it.conceptId }.toSet().size)\n    }\n\n    @Test\n    fun learningProgressPersistsMoreThan100Lessons() = runBlocking {\n        repeat(150) { index ->\n            dao.insertOrUpdateProgress(\n                LearningProgressEntity(\n                    lessonId = "lesson-$index",\n                    curriculumType = if (index < 75) "BEGINNER" else "INTERMEDIATE",\n                    unitNumber = index / 10,\n                    title = "레슨 $index",\n                    status = "UNDERSTAND",\n                    completionPercentage = index % 101,\n                    isCompleted = index % 3 == 0,\n                    lastStudiedTimestamp = 1_800_000_000_000L + index\n                )\n            )\n        }\n\n        val all = dao.getAllProgress().first()\n        assertEquals(150, all.size)\n        assertTrue(all.any { it.lessonId == "lesson-149" })\n    }\n\n    @Test\n    fun databaseKeepsLargeAccumulatedErrorHistory() = runBlocking {\n        repeat(1_000) { index ->\n            dao.insertOrUpdateErrorNote(\n                PersonalErrorNoteEntity(\n                    errorType = "TYPE-$index",\n                    codeSnippet = "print($index)",\n                    errorMessage = "error-$index",\n                    correctionGuide = "guide-$index",\n                    occurrenceCount = (index % 9) + 1,\n                    lastOccurredTimestamp = 1_800_000_000_000L + index\n                )\n            )\n        }\n\n        val all = dao.getAllErrorNotes().first()\n        assertEquals(1_000, all.size)\n        assertTrue(all.first().occurrenceCount >= all.last().occurrenceCount)\n    }\n}\n''', encoding='utf-8')

          # 26 instrumentation assertion: top bar must stay inside the app root.
          ui_test = 'app/src/androidTest/java/com/futuretech/poweruser/textbook/V1TextbookUiInstrumentedTest.kt'
          replace(
              ui_test,
              '''        assertTagExists("textbook_concept_progress")\n\n        assertTextAbsent("AI CODING OS")\n''',
              '''        assertTagExists("textbook_concept_progress")\n        assertNodeWithinRoot("textbook_top_bar", "v1_textbook_root")\n\n        assertTextAbsent("AI CODING OS")\n'''
          )
          replace(
              ui_test,
              '''    private fun assertTextAbsent(text: String) {\n''',
              '''    private fun assertNodeWithinRoot(nodeTag: String, rootTag: String) {\n        val root = compose.onNodeWithTag(rootTag).fetchSemanticsNode().boundsInRoot\n        val node = compose.onNodeWithTag(nodeTag).fetchSemanticsNode().boundsInRoot\n        assertTrue("$nodeTag overflows left", node.left >= root.left - 0.5f)\n        assertTrue("$nodeTag overflows right", node.right <= root.right + 0.5f)\n    }\n\n    private fun assertTextAbsent(text: String) {\n'''
          )

          # Full verification now runs this branch at an actual 360dp width.
          verify = '.github/workflows/verify-textbook-v1.yml'
          replace(
              verify,
              '''    branches:\n      - feat/v1-tablet-textbook\n      - main\n''',
              '''    branches:\n      - feat/v1-tablet-textbook\n      - fix/extreme-26-30\n      - main\n'''
          )
          replace(
              verify,
              '''          script: |\n            set -eu\n            mkdir -p textbook_evidence\n            ./gradlew connectedDebugAndroidTest --stacktrace\n''',
              '''          script: |\n            set -eu\n            mkdir -p textbook_evidence\n            adb shell wm size 1080x2400\n            adb shell wm density 480\n            { adb shell wm size; adb shell wm density; } | tee textbook_evidence/phone_360dp_config.txt\n            ./gradlew connectedDebugAndroidTest --stacktrace\n'''
          )

          # App delivery version: merge to main will publish through the existing verified updater flow.
          replace(
              'app/build.gradle.kts',
              '        versionCode = 9\n        versionName = "1.2.6"\n',
              '        versionCode = 10\n        versionName = "1.2.7"\n'
          )
          PY

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Verify patch and run JVM regression
        run: |
          git diff --check
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Commit verified app patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/verify-textbook-v1.yml
          git commit -m "fix: harden Extreme scenarios 26-30"
          git push origin HEAD:fix/extreme-26-30
