name: Coding Roadmap Track 1 Dense Content

on:
  push:
    branches: [coding-roadmap-track1-dense-v0.8.1]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-track1-dense.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Track 1 density and structure
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('app/src/main/assets/content')
          catalog = json.loads((root / 'catalog.json').read_text())
          tracks = catalog['tracks']
          assert tracks[0]['available'] is True and len(tracks[0]['chapters']) == 8
          assert all(t['available'] is False and len(t['chapters']) == 0 for t in tracks[1:])

          expected = ['concept','visual','example','practice','check','summary']
          lengths = []
          total_pages = 0
          for i in range(1,9):
              ch = json.loads((root/'track01'/f'ch{i:02d}.json').read_text())
              assert len(ch['pages']) == 6
              assert [x['kind'] for x in ch['pages']] == expected
              for p in ch['pages']:
                  body = ''.join(p.get('paragraphs',[])) + ''.join(p.get('bullets',[]))
                  for key in ('codeNote','calloutBody','practicePrompt','question','answer','mistake'):
                      body += p.get(key) or ''
                  lengths.append(len(body))
                  assert p.get('title') and p.get('eyebrow')
              total_pages += len(ch['pages'])

          assert total_pages == 48
          avg = sum(lengths)/len(lengths)
          assert avg >= 450, avg
          assert min(lengths) >= 300, min(lengths)
          print(f'TRACK1_DENSITY_GATE=PASS pages={total_pages} avg={avg:.1f} min={min(lengths)} max={max(lengths)}')
          PY

          grep -R -n 'Track1ContentLoader' app/src/main/java/com/codingroadmap/app
          grep -R -n 'ConceptDiagram' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n '정답·해설 보기' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'navigationBarsPadding' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectTapGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'detectHorizontalDragGestures' app/src/main/java/com/codingroadmap/app/ui
          grep -R -n 'focusMode' app/src/main/java/com/codingroadmap/app/ui
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'versionName = "0.8.1"' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          for i in 01 02 03 04 05 06 07 08; do
            unzip -l "$APK" | grep "assets/content/track01/ch$i.json"
          done

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.1'" /tmp/badging.txt

          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.8.1_TRACK1_DENSE.apk
          sha256sum dist/CodingRoadmapFresh_v0.8.1_TRACK1_DENSE.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.1_TRACK1_DENSE
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.1_TRACK1_DENSE.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
