name: Chatbook production read-only diagnostic
on:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/chatbook-live-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture disposable browser and static request differences
        run: |
          mkdir -p review/live-diagnostic
          python -u - <<'PY'
          import json,pathlib,time,urllib.request,urllib.error
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('review/live-diagnostic');base='https://chatbook-library-20260923.netlify.app';report={'http':[],'console':[],'errors':[],'failedRequests':[],'responses':[]}
          variants=[{}, {'Accept':'*/*'}, {'Accept-Encoding':'gzip, deflate, br'}, {'Sec-Fetch-Dest':'script','Sec-Fetch-Mode':'no-cors','Sec-Fetch-Site':'same-origin'}, {'Accept':'*/*','Accept-Encoding':'gzip, deflate, br','Sec-Fetch-Dest':'script','Sec-Fetch-Mode':'no-cors','Sec-Fetch-Site':'same-origin'}]
          for headers in variants:
            try:
              with urllib.request.urlopen(urllib.request.Request(base+'/live-guard.js',headers=headers),timeout=20) as r:report['http'].append({'requestHeaders':headers,'status':r.status,'headers':dict(r.headers),'size':len(r.read())})
            except urllib.error.HTTPError as e:report['http'].append({'requestHeaders':headers,'status':e.code,'body':e.read().decode(errors='replace')})
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox']);c=b.new_context(viewport={'width':412,'height':915});page=c.new_page()
            page.on('console',lambda m:report['console'].append({'type':m.type,'text':m.text}))
            page.on('pageerror',lambda e:report['errors'].append(str(e)))
            page.on('requestfailed',lambda r:report['failedRequests'].append({'url':r.url,'failure':r.failure,'headers':r.headers}))
            page.on('response',lambda r:report['responses'].append({'url':r.url,'status':r.status,'headers':r.headers}))
            page.goto(base,wait_until='domcontentloaded',timeout=45000);page.wait_for_timeout(5000)
            report['probes']=page.evaluate("async()=>{let out=[];for(const p of ['/live-guard.js','/live-guard.js?v=probe','/live-sw.js','/live-sw.js?v=probe','/manifest.webmanifest']){let r=await fetch(p,{cache:'no-store'});out.push({path:p,status:r.status,type:r.headers.get('content-type'),head:(await r.text()).slice(0,100)})}return out}")
            report['page']=page.evaluate('({url:location.href,base:document.baseURI,cb:typeof CB,live:window.ChatbookLive,body:document.body.innerText.slice(0,1500)})')
            page.screenshot(path=str(root/'production.png'),full_page=True);b.close()
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbook-production-read-only-diagnostic
          path: review/live-diagnostic/
          retention-days: 2
