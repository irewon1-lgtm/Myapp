name: V5 recovery Android validation once

on:
  push:
    branches:
      - textbook-v5-recovery-20260918
    paths:
      - '.github/workflows/v5-recovery-android-validation-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js
          chmod +x ./gradlew

      - name: V5 content audit diagnostic
        id: v5audit
        continue-on-error: true
        run: |
          set +e
          python tools/v5_content_audit.py | tee v5_content_audit.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Targeted V5 reader and evidence tests
        id: v5tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --stacktrace \
            --tests 'com.futuretech.poweruser.textbook.V5HybridContentPolicyTest' \
            --tests 'com.futuretech.poweruser.textbook.V5EvidenceCoverageAssetTest' \
            --tests 'com.futuretech.poweruser.textbook.V5ExistingPartEvidenceContractTest' \
            --tests 'com.futuretech.poweruser.textbook.V5PrerequisiteConceptContractTest' \
            --tests 'com.futuretech.poweruser.textbook.V5BookReaderSourceContractTest'

      - name: Full debug unit tests diagnostic
        id: fulltests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Record diagnostic summary
        if: always()
        shell: bash
        run: |
          mkdir -p recovery-validation
          {
            echo "V5_AUDIT_OUTCOME=${{ steps.v5audit.outcome }}"
            echo "V5_AUDIT_EXIT=${{ steps.v5audit.outputs.exit_code }}"
            echo "V5_TARGETED_TEST_OUTCOME=${{ steps.v5tests.outcome }}"
            echo "FULL_UNIT_TEST_OUTCOME=${{ steps.fulltests.outcome }}"
          } | tee recovery-validation/diagnostic_summary.txt
          cp v5_content_audit.json recovery-validation/ 2>/dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 install and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.futuretech.poweruser
            adb shell am start -W -n com.futuretech.poweruser/.MainActivity > recovery-validation/am_start.txt
            cat recovery-validation/am_start.txt
            sleep 5
            adb shell pidof com.futuretech.poweruser > recovery-validation/pid.txt
            cat recovery-validation/pid.txt
            test -s recovery-validation/pid.txt
            adb shell dumpsys activity activities > recovery-validation/dumpsys_activity.txt
            grep -q "com.futuretech.poweruser/.MainActivity" recovery-validation/dumpsys_activity.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml recovery-validation/window.xml >/dev/null
            adb logcat -d > recovery-validation/logcat_full.txt
            if grep -E "FATAL EXCEPTION|Process: com\.futuretech\.poweruser" recovery-validation/logcat_full.txt; then
              echo "RECOVERY_LAUNCH_CRASH_DETECTED=1" > recovery-validation/runtime_gate.txt
              cat recovery-validation/runtime_gate.txt
              exit 1
            fi
            echo "RECOVERY_INSTALL_LAUNCH_GATE=PASS" > recovery-validation/runtime_gate.txt
            cat recovery-validation/runtime_gate.txt

      - name: Upload recovery APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-recovery-android-validation
          retention-days: 1
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            recovery-validation/
            app/build/test-results/testDebugUnitTest/
