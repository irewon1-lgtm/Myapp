name: Advance Track05 remote channel r2

on:
  push:
    branches:
      - textbook-v5-track05-channel-control-r2
    paths:
      - '.github/workflows/advance-track05-channel-r2.yml'

permissions:
  contents: write

jobs:
  verify-and-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch publication and live branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin textbook-v5-track05-publish:textbook-v5-track05-publish
          git fetch origin textbook-v5-deep-book-engine:textbook-v5-deep-book-engine

      - name: Verify Track05 publication snapshot
        id: content
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach textbook-v5-track05-publish
          test ! -d .track05_payload_xz
          test ! -e .track05_publish_trigger
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('app/src/main/assets/textbook/v5/track_05')
          md=sorted(root.glob('part_*_*.md')); sm=sorted(root.glob('part_*_sources.json'))
          mf=[root/'manifest.json']+sorted(root.glob('manifest_[0-9][0-9].json')); mf=[p for p in mf if p.exists()]
          assert len(md)==105, f'md={len(md)}'; assert len(sm)==105, f'sm={len(sm)}'; assert len(mf)==7, f'mf={len(mf)}'
          fr=[json.loads(p.read_text(encoding='utf-8')) for p in mf]
          base=fr[0]; assert base['trackId']=='T05' and base['trackNumber']==5; title=base['title']; parts=[]
          for f in fr:
              assert f['trackId']=='T05' and f['trackNumber']==5 and f['title']==title; parts+=f['parts']
          parts.sort(key=lambda p:p['order'])
          assert len(parts)==105
          assert [p['order'] for p in parts]==list(range(1,106))
          assert [p['id'] for p in parts]==[f'T05-P{i:02d}' for i in range(1,106)]
          sec={}
          for p in parts:
              a=Path('app/src/main/assets')/p['assetPath']; s=Path('app/src/main/assets')/p['sourceMapPath']
              assert a.is_file() and s.is_file()
              ch=len(re.findall(r'(?m)^## CHAPTER ',a.read_text(encoding='utf-8')))
              j=json.loads(s.read_text(encoding='utf-8')); assert j['partId']==p['id']; assert len(j['sections'])==ch
              ids=set()
              for i,x in enumerate(j['sections'],1):
                  assert x['sectionId'].startswith(f"{p['id']}-S{i:02d}-"); assert x['sourceIds']; assert len(x['sourceIds'])==len(set(x['sourceIds']))
                  ids.add(x['sectionId'])
              sec[p['id']]=ids
          for p in parts:
              for q in p.get('prerequisiteConceptIds',[]):
                  m=re.match(r'^T05-P(\d+)-S\d+-.+$',q); assert m and int(m.group(1))<p['order']; assert q in sec.get(q.split('-S',1)[0],set())
          print('TRACK05_STRUCTURE_PASS parts=105 source_maps=105 manifests=7')
          PY
          echo "content_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check live V5 divergence and hybrid compare cap
        id: safety
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse textbook-v5-deep-book-engine)"
          git checkout textbook-v5-deep-book-engine
          CHANNEL=app/src/main/assets/textbook/v5/channel.json
          CURRENT="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('app/src/main/assets/textbook/v5/channel.json').read_text(encoding='utf-8'))['revision'])
          PY
          )"
          [[ "$CURRENT" =~ ^[0-9a-f]{40}$ ]]

          if [ "$CURRENT" = "$CONTENT_SHA" ]; then
            echo 'CHANNEL_ALREADY_POINTS_TO_TRACK05'
            echo 'already_current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not publish a stale textbook snapshot if the live branch gained other V5 content.
          EXTRA_V5="$(git diff --name-only "$CONTENT_SHA" "$LIVE_SHA" -- app/src/main/assets/textbook/v5/ | grep -v '^app/src/main/assets/textbook/v5/channel.json$' || true)"
          if [ -n "$EXTRA_V5" ]; then
            echo 'Live V5 content moved after Track05 snapshot:'
            echo "$EXTRA_V5"
            exit 22
          fi

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${CURRENT}...${CONTENT_SHA}" \
            -o /tmp/compare.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compare.json',encoding='utf-8')); status=d.get('status'); files=d.get('files') or []
          assert status in {'ahead','identical'}, f'status={status}'
          assert len(files)<300, f'compare_files={len(files)}'
          print(f'HYBRID_COMPARE_PASS status={status} files={len(files)}')
          PY
          echo 'already_current=false' >> "$GITHUB_OUTPUT"

      - name: Advance channel safely
        if: steps.safety.outputs.already_current != 'true'
        env:
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout textbook-v5-deep-book-engine
          git reset --hard origin/textbook-v5-deep-book-engine
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          sha=os.environ['CONTENT_SHA']; assert len(sha)==40
          p=Path('app/src/main/assets/textbook/v5/channel.json')
          p.write_text(json.dumps({'schemaVersion':1,'revision':sha,'publishedAt':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')},indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/textbook/v5/channel.json
          git commit -m 'publish(v5): point remote channel to Track05 content [skip ci]'
          git push origin HEAD:textbook-v5-deep-book-engine

      - name: Verify published channel pointer
        env:
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin textbook-v5-deep-book-engine
          ACTUAL="$(git show origin/textbook-v5-deep-book-engine:app/src/main/assets/textbook/v5/channel.json | python -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          test "$ACTUAL" = "$CONTENT_SHA"
          echo "TRACK05_REMOTE_CHANNEL_PASS revision=$ACTUAL"
