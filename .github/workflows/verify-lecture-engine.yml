name: Verify lecture-first education engine

on:
  push:
    branches:
      - fix/lecture-engine-v1
  workflow_dispatch:

jobs:
  lecture-extreme-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x tools/lecture_quality_report.py

      - name: Unit tests including Lecture Extreme60 and CLEAN25
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Generate strict lecture evidence report
        run: python tools/lecture_quality_report.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 34 lecture gating and full instrumentation regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.futuretech.poweruser
            adb shell am start -W -n com.futuretech.poweruser/.MainActivity | tee lecture_evidence/app_launch.txt
            sleep 3
            PID="$(adb shell pidof com.futuretech.poweruser | tr -d '\r')"
            test -n "$PID"
            echo "PID=$PID" | tee -a lecture_evidence/app_launch.txt

      - name: Upload lecture engine evidence
        uses: actions/upload-artifact@v4
        with:
          name: lecture-engine-extreme60-clean25-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            lecture_evidence/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/debug/app-debug.apk
