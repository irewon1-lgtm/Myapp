name: Verify and commit Extreme 26-30 app patch

on:
  push:
    branches:
      - fix/extreme-26-30
    paths:
      - .github/workflows/apply-extreme-26-30-v3.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/extreme-26-30
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reuse verified patch and Android JSON test runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-extreme-26-30.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          Path('/tmp/extreme_26_30_patch.py').write_text(textwrap.dedent(workflow[start:end]), encoding='utf-8')
          PY
          python /tmp/extreme_26_30_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/futuretech/poweruser/update/AppUpdateManagerTest.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import org.junit.Test\n',
              'import org.junit.Test\nimport org.junit.runner.RunWith\nimport org.robolectric.RobolectricTestRunner\nimport org.robolectric.annotation.Config\n',
              1
          )
          text = text.replace(
              'class AppUpdateManagerTest {\n',
              '@RunWith(RobolectricTestRunner::class)\n@Config(sdk = [34])\nclass AppUpdateManagerTest {\n',
              1
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Run JVM, quality gates, debug and release builds
        run: |
          git diff --check
          chmod +x ./gradlew
          chmod +x tools/lecture_quality_report.py tools/feedback_quality_report.py tools/review_quality_report.py tools/textbook_quality_report.py
          ./gradlew testDebugUnitTest --stacktrace
          python tools/lecture_quality_report.py
          python tools/feedback_quality_report.py
          python tools/review_quality_report.py
          python tools/textbook_quality_report.py
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 34 regression at 360dp width
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb shell wm size 1080x2400
            adb shell wm density 480
            adb shell wm size
            adb shell wm density
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Commit only verified app changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: harden Extreme scenarios 26-30"
          git push origin HEAD:fix/extreme-26-30
