name: Release corrected textbook app v1.2.19 once

on:
  push:
    branches:
      - recovery/correct-app-track02-20260918
    paths:
      - '.release/GO_V1_2_19'

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify correct app identity and content
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 22' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.19"' app/build.gradle.kts
          grep -Fq 'if (hasV5Book)' app/src/main/java/com/futuretech/poweruser/ui/AdaptiveTextbookScreen.kt
          grep -Fq 'V5TrackBookScreen(' app/src/main/java/com/futuretech/poweruser/ui/AdaptiveTextbookScreen.kt
          grep -Fq 'V4PagedBookScreen(' app/src/main/java/com/futuretech/poweruser/ui/AdaptiveTextbookScreen.kt
          test "$(find app/src/main/assets/textbook/v5/track_01 -maxdepth 1 -type f -name 'part_*.md' | wc -l)" -eq 105
          test "$(find app/src/main/assets/textbook/v5/track_02 -maxdepth 1 -type f -name 'part_*.md' | wc -l)" -eq 105
          test -f app/src/main/assets/textbook/v5/track_01/manifest.json
          test -f app/src/main/assets/textbook/v5/track_02/manifest.json

      - name: Verify Track 02 parser safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("app/src/main/assets/textbook/v5/track_02")
          markdown = sorted(root.glob("part_*.md"))
          assert len(markdown) == 105, f"TRACK 02 markdown count: {len(markdown)}"

          ordered = re.compile(r"^\s*(\d+)[.)]\s+(.+)$")
          for md in markdown:
              text = md.read_text(encoding="utf-8")
              assert text.strip(), f"empty markdown: {md.name}"
              for line_no, line in enumerate(text.splitlines(), 1):
                  match = ordered.match(line)
                  if not match:
                      continue
                  number = int(match.group(1))
                  assert 1 <= number <= 2_147_483_647, (
                      f"parser-unsafe ordered-list start: {md.name}:{line_no}: {number}"
                  )

          print("TRACK 02 105 PART + parser-safe ordered-list starts: PASS")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Verify textbook reader and build Android release
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./gradlew
          set +e
          ./gradlew \
            testDebugUnitTest \
            --tests "com.futuretech.poweruser.textbook.V5BookReaderSourceContractTest" \
            --tests "com.futuretech.poweruser.textbook.TextbookMarkdownParserTest" \
            --tests "com.futuretech.poweruser.update.AppUpdateManagerTest" \
            assembleRelease \
            --stacktrace
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            echo "===== failing junit xml ====="
            find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -print -exec cat {} \; 2>/dev/null || true
            exit "$STATUS"
          fi

      - name: Sign and verify corrected APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs \
            final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            | tee final-dist/apksigner_verify.txt
          "$AAPT" dump badging final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            | tee final-dist/aapt_badging.txt
          grep -Fq "versionCode='22'" final-dist/aapt_badging.txt
          grep -Fq "versionName='1.2.19'" final-dist/aapt_badging.txt
          sha256sum final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            | tee final-dist/Myapp_AI_Coding_Textbook_latest.sha256
          rm final-dist/Myapp_AI_Coding_Textbook_aligned.apk

      - name: Guard v1.2.19 identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.19"
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY="$(gh release view "$TAG" --json body --jq '.body')"
            grep -Fq -- "- Source commit: ${GITHUB_SHA}" <<<"$BODY" || {
              echo "Existing v1.2.19 belongs to a different commit; refusing overwrite." >&2
              exit 1
            }
          fi

      - name: Publish corrected v1.2.19 release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.19"
          APK="final-dist/Myapp_AI_Coding_Textbook_latest.apk"
          NOTES="final-dist/release_notes.md"
          cat > "$NOTES" <<EOF
          ## 코딩 완전과정 v1.2.19

          - Android versionCode: 22
          - Source commit: ${GITHUB_SHA}
          - 앱 기준: textbook-v5-app-preview-20260918 UI/reader 그대로
          - TRACK 01: 기존 미리보기 앱 원고 변경 없음
          - TRACK 02: 최신 105 PART 원고 반영
          - V5가 준비된 TRACK만 V5 reader 사용
          - 나머지 TRACK은 기존 V4PagedBookScreen 유지
          - 잘못 배포된 single-live 전체 강제 전환 제거
          - Signed updater asset: Myapp_AI_Coding_Textbook_latest.apk
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "코딩 완전과정 v1.2.19 복구본" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "$TAG" "$APK" \
              --target "${GITHUB_SHA}" \
              --title "코딩 완전과정 v1.2.19 복구본" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Point mistaken v1.2.18 updater to the corrected release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin textbook-v5-live
          git worktree add /tmp/textbook-live origin/textbook-v5-live
          cd /tmp/textbook-live
          mkdir -p app/src/main/assets/update
          cat > app/src/main/assets/update/latest.json <<'EOF'
          {
            "versionName": "1.2.19",
            "tagName": "v1.2.19",
            "apkUrl": "https://github.com/irewon1-lgtm/Myapp/releases/download/v1.2.19/Myapp_AI_Coding_Textbook_latest.apk",
            "releaseNotes": "기존 앱 UI 복구 + TRACK 02 최신 105 PART 반영"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/update/latest.json
          if git diff --cached --quiet; then
            echo "Updater metadata already current."
          else
            git commit -m "release: point updater to corrected v1.2.19 [skip ci]"
            git push origin HEAD:textbook-v5-live
          fi

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: corrected-app-v1.2.19-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            final-dist/Myapp_AI_Coding_Textbook_latest.apk
            final-dist/Myapp_AI_Coding_Textbook_latest.sha256
            final-dist/apksigner_verify.txt
            final-dist/aapt_badging.txt
            final-dist/release_notes.md
