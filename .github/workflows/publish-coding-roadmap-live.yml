name: Publish CodingRoadmap lessons and screen
on:
  push:
    branches: [coding-roadmap-live]
    paths: ['live/content.json', 'live/reader.template.html', 'tools/build_content.py', 'tools/verify_reader.cjs', '.github/workflows/publish-coding-roadmap-live.yml']
permissions:
  contents: write
concurrency:
  group: coding-roadmap-live-publication
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding-roadmap-live
          fetch-depth: 0
      - name: Build and check self-contained reader
        run: |
          python3 - <<'PY'
          import json,time,pathlib
          p=pathlib.Path('live/content.json'); d=json.loads(p.read_text()); d['version']=int(time.time()*1000);p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/build_content.py
          node tools/verify_reader.cjs
      - name: Render smoke test on Galaxy Tab S10 FE geometry
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
          fc-list :lang=ko | head -1 | grep -q .
          mkdir -p review
          ROOT="file://$PWD/live/reader.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2304,1440 --force-device-scale-factor=2 --virtual-time-budget=3500 --dump-dom "$ROOT?preview=reader" > review/reader-landscape-dom.html
          grep -q 'data-qa-ready="1"' review/reader-landscape-dom.html
          grep -q 'data-qa-font="18px"' review/reader-landscape-dom.html
          grep -q 'data-qa-overflow-y="hidden"' review/reader-landscape-dom.html
          grep -q 'data-qa-fit="1"' review/reader-landscape-dom.html
          grep -q 'data-qa-footer-visible="1"' review/reader-landscape-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2304,1440 --force-device-scale-factor=2 --virtual-time-budget=3500 --screenshot=review/reader-landscape.png "$ROOT?preview=reader"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,2304 --force-device-scale-factor=2 --virtual-time-budget=3500 --dump-dom "$ROOT?preview=reader" > review/reader-portrait-dom.html
          grep -q 'data-qa-ready="1"' review/reader-portrait-dom.html
          grep -q 'data-qa-font="18px"' review/reader-portrait-dom.html
          grep -q 'data-qa-overflow-y="hidden"' review/reader-portrait-dom.html
          grep -q 'data-qa-fit="1"' review/reader-portrait-dom.html
          grep -q 'data-qa-footer-visible="1"' review/reader-portrait-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,2304 --force-device-scale-factor=2 --virtual-time-budget=3500 --screenshot=review/reader-portrait.png "$ROOT?preview=reader"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2304,1440 --force-device-scale-factor=2 --virtual-time-budget=2500 --screenshot=review/home-landscape.png "$ROOT"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2304,1440 --force-device-scale-factor=2 --virtual-time-budget=2500 --screenshot=review/track-landscape.png "$ROOT?preview=track"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2304,1440 --force-device-scale-factor=2 --virtual-time-budget=2500 --screenshot=review/saved-landscape.png "$ROOT?preview=saved"
          test -s review/reader-landscape.png
          test -s review/reader-portrait.png
          test -s review/home-landscape.png
          test -s review/track-landscape.png
          test -s review/saved-landscape.png
      - name: Publish immutable content then move channel atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin coding-roadmap-live
          REMOTE_SOURCE="$(git rev-parse origin/coding-roadmap-live)"
          LOCAL_SOURCE="$(git rev-parse HEAD)"
          if [ "$REMOTE_SOURCE" != "$LOCAL_SOURCE" ]; then
            echo "A newer source commit exists; this run is superseded."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/content.json live/reader.html
          git commit -m 'Build verified live reader snapshot'
          CONTENT_COMMIT="$(git rev-parse HEAD)"
          export CONTENT_COMMIT
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          p=pathlib.Path('live/reader.html');b=p.read_bytes();d=json.loads(pathlib.Path('live/content.json').read_text())
          m={'schema':'codingroadmap-live-v1','minShell':1,'version':d['version'],'label':d['label'],'commit':os.environ['CONTENT_COMMIT'],'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}
          pathlib.Path('live/channel.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          git add live/channel.json
          git commit -m 'Publish CodingRoadmap live channel'
          git push origin HEAD:coding-roadmap-live
      - uses: actions/upload-artifact@v4
        with:
          name: coding-roadmap-live-publication
          path: |
            live/channel.json
            review/reader-test-results.json
            review/reader-landscape.png
            review/reader-portrait.png
            review/home-landscape.png
            review/track-landscape.png
            review/saved-landscape.png
            review/reader-landscape-dom.html
            review/reader-portrait-dom.html
          retention-days: 7
