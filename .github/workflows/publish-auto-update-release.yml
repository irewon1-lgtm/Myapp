name: Publish verified auto-update release

on:
  workflow_run:
    workflows:
      - Verify V1 university textbook, tablet UI and full app regression
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve verified commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard release identity
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERIFIED_SHA="${{ steps.commit.outputs.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_BODY="$(gh release view "$TAG" --json body --jq '.body')"
            if ! grep -Fq -- "- Source commit: ${VERIFIED_SHA}" <<<"$EXISTING_BODY"; then
              echo "Refusing to overwrite existing release ${TAG} with a different source commit." >&2
              echo "Bump versionName/versionCode before publishing a new verified source." >&2
              exit 1
            fi
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign verified updater APK
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" sign \
            --ks test.keystore \
            --ks-key-alias testkey \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs \
            final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            | tee final-dist/apksigner_verify.txt
          sha256sum final-dist/Myapp_AI_Coding_Textbook_latest.apk \
            | tee final-dist/Myapp_AI_Coding_Textbook_latest.sha256
          rm final-dist/Myapp_AI_Coding_Textbook_aligned.apk

      - name: Create or refresh GitHub Release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          APK="final-dist/Myapp_AI_Coding_Textbook_latest.apk"
          NOTES_FILE="final-dist/release_notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## AI CODING OS v${VERSION}

          - Android versionCode: ${VERSION_CODE}
          - Source commit: ${{ steps.commit.outputs.sha }}
          - Full textbook / feedback / review regression: PASS before release promotion
          - Release APK is signed with the same application key used by prior Myapp releases
          - In-app updater asset: Myapp_AI_Coding_Textbook_latest.apk

          This release is consumed by the in-app updater. Android still requires final user confirmation before installing a sideloaded APK.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "AI CODING OS v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "$TAG" "$APK" \
              --target "${{ steps.commit.outputs.sha }}" \
              --title "AI CODING OS v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: auto-update-release-v${{ steps.version.outputs.name }}
          retention-days: 90
          path: |
            final-dist/Myapp_AI_Coding_Textbook_latest.apk
            final-dist/Myapp_AI_Coding_Textbook_latest.sha256
            final-dist/apksigner_verify.txt
            final-dist/release_notes.md
