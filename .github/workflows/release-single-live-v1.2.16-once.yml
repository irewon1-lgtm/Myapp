name: Release single-live textbook v1.2.17 once

on:
  push:
    branches:
      - textbook-v5-live
    paths:
      - '.github/workflows/release-single-live-v1.2.16-once.yml'

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact live source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 20' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.17"' app/build.gradle.kts
          grep -Fq 'LIVE_BRANCH = "textbook-v5-live"' app/src/main/java/com/futuretech/poweruser/textbook/V5BookAssetRepository.kt
          test ! -e app/src/main/assets/textbook/v5/channel.json
          ! grep -R -n -E 'CHANNEL_URL|MAX_COMPARE_FILES|COMPARE_BASE|previousRevision|RolledBack|V4PagedBookScreen\(|repo\.loadSourceMap\(part\)|textbook-v5-deep-book-engine|hybrid'             app/src/main/java/com/futuretech/poweruser/textbook             app/src/main/java/com/futuretech/poweruser/ui/AdaptiveTextbookScreen.kt             app/src/main/java/com/futuretech/poweruser/ui/V5TrackBookScreen.kt
          test -f app/src/main/assets/textbook/v5/track_01/manifest.json
          test -f app/src/main/assets/textbook/v5/track_02/manifest.json
          test -f app/src/main/assets/textbook/v5/track_07/manifest.json
          test -f app/src/main/assets/textbook/v5/track_10/manifest.json
          find app/src/main/assets/textbook/v5/track_07 -maxdepth 1 -type f -name 'part_105_*.md' | grep -q .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript runtime assets
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Single-live engine regression and Android release build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            testDebugUnitTest \
            --tests com.futuretech.poweruser.textbook.V5SingleLiveContentPolicyTest \
            --tests com.futuretech.poweruser.textbook.V5BookReaderSourceContractTest \
            --tests com.futuretech.poweruser.textbook.TextbookMarkdownParserTest \
            --tests com.futuretech.poweruser.textbook.V5MeasuredReaderContractTest \
            --tests com.futuretech.poweruser.textbook.V1TextbookCatalogTest \
            --tests com.futuretech.poweruser.update.AppUpdateManagerTest \
            assembleRelease \
            --stacktrace

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          mkdir -p final-dist
          "$ZIPALIGN" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" sign             --ks test.keystore             --ks-key-alias testkey             --ks-pass pass:password             --key-pass pass:password             --out final-dist/Myapp_AI_Coding_Textbook_latest.apk             final-dist/Myapp_AI_Coding_Textbook_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs             final-dist/Myapp_AI_Coding_Textbook_latest.apk             | tee final-dist/apksigner_verify.txt
          "$AAPT" dump badging final-dist/Myapp_AI_Coding_Textbook_latest.apk             | tee final-dist/aapt_badging.txt
          grep -Fq "versionCode='20'" final-dist/aapt_badging.txt
          grep -Fq "versionName='1.2.17'" final-dist/aapt_badging.txt
          sha256sum final-dist/Myapp_AI_Coding_Textbook_latest.apk             | tee final-dist/Myapp_AI_Coding_Textbook_latest.sha256
          rm final-dist/Myapp_AI_Coding_Textbook_aligned.apk

      - name: Guard release identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.17"
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY="$(gh release view "$TAG" --json body --jq '.body')"
            grep -Fq -- "- Source commit: ${GITHUB_SHA}" <<<"$BODY" || {
              echo "Existing v1.2.17 belongs to a different commit; refusing overwrite." >&2
              exit 1
            }
          fi

      - name: Publish v1.2.17 updater release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.17"
          APK="final-dist/Myapp_AI_Coding_Textbook_latest.apk"
          NOTES="final-dist/release_notes.md"
          cat > "$NOTES" <<EOF
          ## 코딩 완전과정 v1.2.17

          - Android versionCode: 20
          - Source commit: ${GITHUB_SHA}
          - 교재 원격 경로: textbook-v5-live/app/src/main/assets/textbook/v5/
          - channel/revision/rollback/compare-file-limit/V4 fallback 제거
          - TRACK 파일의 Git blob SHA가 바뀌면 앱이 해당 TRACK 최신 원고를 다시 읽는 단일 LIVE 방식
          - 현재 LIVE 원고 확인 TRACK: 01, 02, 07, 10\n          - TRACK 02: 105 PART 최신 원고 반영
          - TRACK 07 P105 포함
          - 단일 LIVE 엔진 관련 unit regression + Android release build 검증
          - 전체 11 TRACK corpus 품질 게이트는 아직 별도 미완료이며 이 Release의 PASS 주장에 포함하지 않음
          - Signed updater asset: Myapp_AI_Coding_Textbook_latest.apk

          기존 앱은 GitHub 최신 Release를 확인해 이 버전을 감지합니다.
          Android 정책상 APK 설치 마지막 확인은 사용자가 직접 눌러야 합니다.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG"               --target "${GITHUB_SHA}"               --title "코딩 완전과정 v1.2.17"               --notes-file "$NOTES"               --latest
          else
            gh release create "$TAG" "$APK"               --target "${GITHUB_SHA}"               --title "코딩 완전과정 v1.2.17"               --notes-file "$NOTES"               --latest
          fi

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: single-live-v1.2.17-release-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            final-dist/Myapp_AI_Coding_Textbook_latest.apk
            final-dist/Myapp_AI_Coding_Textbook_latest.sha256
            final-dist/apksigner_verify.txt
            final-dist/aapt_badging.txt
            final-dist/release_notes.md
