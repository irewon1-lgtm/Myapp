name: Chatbook narrative 1.2 upgrade
on:
  workflow_dispatch:
  push:
    branches: [chatbook-app-20260923]
    paths: [.github/workflows/chatbook-narrative-upgrade.yml]
permissions:
  contents: write
concurrency:
  group: chatbook-narrative-upgrade
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatbook-app-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch with exact old and new hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/narrative-apply.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbook-narrative-upgrade-evidence
          path: |
            docs/narrative-1.2/
            dist/version.json
          retention-days: 3
