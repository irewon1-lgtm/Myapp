name: Verify V1 university textbook, tablet UI and full app regression

on:
  push:
    branches:
      - feat/v1-tablet-textbook
      - integrate/v1-depth-latest-main
      - main
  workflow_dispatch:

jobs:
  textbook-extreme-clean-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js
      - name: Make scripts executable
        run: |
          chmod +x ./gradlew
          chmod +x tools/lecture_quality_report.py
          chmod +x tools/feedback_quality_report.py
          chmod +x tools/review_quality_report.py
          chmod +x tools/textbook_quality_report.py
          chmod +x tools/workbook_quality_report.py
          chmod +x tools/items_31_35_extreme60_report.py
          chmod +x tools/items_31_35_clean25.py
          chmod +x tools/tablet_capture_smoke.sh
          chmod +x tools/final_release_smoke.sh
      - name: Run every JVM test from start to finish
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Verify items 31-35 user-flow Extreme60 executed all 60 cases
        run: python tools/items_31_35_extreme60_report.py
      - name: Verify items 31-35 visual/state CLEAN25 source gates
        run: python tools/items_31_35_clean25.py
      - name: Verify lecture engine regression
        run: python tools/lecture_quality_report.py
      - name: Verify feedback engine regression
        run: python tools/feedback_quality_report.py
      - name: Verify spaced review regression
        run: python tools/review_quality_report.py
      - name: Verify textbook anti-bloat depth gates
        run: python tools/textbook_quality_report.py
      - name: Verify workbook practice depth and reader integration
        run: python tools/workbook_quality_report.py
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign and verify release APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          mkdir -p final-dist textbook_evidence
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_aligned.apk
          "$APKSIGNER" sign --ks test.keystore --ks-key-alias testkey --ks-pass pass:password --key-pass pass:password --out final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.apk final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_aligned.apk
          "$APKSIGNER" verify --verbose --print-certs final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.apk | tee final-dist/apksigner_verify.txt
          sha256sum final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.apk | tee final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.sha256
          rm final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_aligned.apk
          cp final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.apk final-dist/FutureTechPowerUser_v1.0.0_FINAL.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API 34 phone regression, Galaxy Tab layout simulation, release install smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            mkdir -p textbook_evidence
            ./gradlew connectedDebugAndroidTest --stacktrace
            bash tools/tablet_capture_smoke.sh textbook_evidence
            bash tools/final_release_smoke.sh
      - name: Upload textbook evidence and signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-textbook-tablet-full-regression-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            textbook_evidence/
            review_evidence/
            feedback_evidence/
            lecture_evidence/
            items_31_35_extreme60_report.md
            items_31_35_clean25_report.md
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/apk/debug/app-debug.apk
            final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.apk
            final-dist/FutureTechPowerUser_v1.0.0_TEXTBOOK_FINAL.sha256
            final-dist/apksigner_verify.txt
            final-dist/launch_smoke.txt
            final-dist/logcat_full.txt
            final-dist/logcat_crash_excerpt.txt
