name: Danggn Hourly Backlog Test

on:
  push:
    branches:
      - danggn-search-bot
    paths:
      - 'danggn-bot/run-hourly-test.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run isolated hourly scan
        run: |
          rm -rf /tmp/danggn-hourly-test
          mkdir -p /tmp/danggn-hourly-test
          cp danggn-bot/hourly-scan.mjs /tmp/danggn-hourly-test/hourly-scan.mjs
          cp danggn-bot/hourly-state.json /tmp/danggn-hourly-test/hourly-state.json
          node /tmp/danggn-hourly-test/hourly-scan.mjs
          cp /tmp/danggn-hourly-test/hourly-result.json danggn-bot/hourly-test-result.json
      - name: Commit isolated test result
        run: |
          git config user.name "danggn-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add danggn-bot/hourly-test-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record hourly backlog scan"
          git pull --rebase origin danggn-search-bot
          git push
