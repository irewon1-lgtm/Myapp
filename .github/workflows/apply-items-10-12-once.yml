name: Apply items 10-12 once

on:
  push:
    branches:
      - fix/items-10-12-extreme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/items-10-12-extreme
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply items 10-12 patch
        run: python tools/apply_items_10_12.py

      - name: Normalize Kotlin verdict regex literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/futuretech/poweruser/ai/AiTutorPolicy.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          found = False
          for i, line in enumerate(lines):
              if 'private val aiGradingVerdict = Regex(' in line:
                  j = i + 1
                  raw = lines[j]
                  stripped = raw.strip()
                  if not (stripped.startswith('"') and stripped.endswith('"')):
                      raise SystemExit(f'unexpected regex line: {raw}')
                  indent = raw[:len(raw) - len(raw.lstrip())]
                  lines[j] = indent + '"""' + stripped[1:-1] + '"""'
                  found = True
                  break
          if not found:
              raise SystemExit('aiGradingVerdict regex not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Prepare TypeScript runtime assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: JVM full regression
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Items 10-12 Extreme60
        run: python tools/items_10_12_extreme60.py

      - name: Items 10-12 CLEAN25
        run: python tools/items_10_12_clean25.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit verified patch
        shell: bash
        run: |
          git checkout -- app/src/main/assets/typescript.js app/src/main/assets/ts_libs.js 2>/dev/null || true
          rm -f tools/apply_items_10_12.py
          rm -f .github/workflows/apply-items-10-12-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No verified patch to commit"; exit 1; }
          git commit -m "feat: harden items 10-12 deterministic grading feedback hints"
          git push origin HEAD:fix/items-10-12-extreme
