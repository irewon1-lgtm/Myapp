name: Danggn Fast 48h Laptop Pass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/danggn-fast-48h.yml'
      - 'ops/danggn-fast-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danggn-fast-48h-pass
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [seongnam, gwangjin, songpa, gangnam, seocho, gangdong]

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout scanner branch
        uses: actions/checkout@v4
        with:
          ref: danggn-search-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stable 48h scan
        env:
          TARGET_SLUG: ${{ matrix.target }}
          CHUNK_INDEX: '0'
          CHUNK_COUNT: '1'
          FAST_MODE: '1'
        run: node danggn-bot/oneshot-area-scan.mjs

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: danggn-fast-48h-${{ matrix.target }}
          path: oneshot-result-${{ matrix.target }}-0.json
          if-no-files-found: error
          retention-days: 1
