name: Verify learning UI 21-25

on:
  push:
    branches:
      - fix/learning-ui-21-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare TypeScript compiler assets
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prepare:typescript
          test -s app/src/main/assets/typescript.js
          test -s app/src/main/assets/ts_libs.js

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Items 21-25 policy tests
        run: ./gradlew testDebugUnitTest --tests "com.futuretech.poweruser.education.LearningUi21To25PolicyTest" --stacktrace

      - name: Full JVM regression
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-ui-21-25-evidence
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/apk/debug/app-debug.apk
