name: Coding Roadmap Tab S10 FE

on:
  push:
    branches: [coding-roadmap-tabs10fe-v0.8.4]
    paths:
      - 'coding-roadmap-shell/**'
      - '.github/workflows/coding-roadmap-tabs10fe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Tab S10 FE profile and 11-track rail
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog=json.loads(Path('app/src/main/assets/content/catalog.json').read_text())
          tracks=catalog['tracks']
          assert len(tracks)==11
          assert [t['id'] for t in tracks]==list(range(1,12))
          assert tracks[2]['title']=='문제 해결'
          assert tracks[4]['title']=='TypeScript'
          assert tracks[5]['title']=='SQL과 데이터'
          assert tracks[6]['title']=='API와 백엔드'
          assert tracks[7]['title']=='Android 앱'
          assert tracks[8]['title']=='Git·테스트·디버깅'
          assert tracks[9]['title']=='AI 활용 개발'
          assert tracks[10]['title']=='시스템 심화'
          print('TRACK_RAIL=PASS count=11')
          PY

          grep -R -n 'smallestScreenWidthDp >= 600' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'screenHeightDp >= 900' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'Configuration.ORIENTATION_PORTRAIT' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'scrollState.maxValue > 8' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'visibleExtras -= 1' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'visibleExtras += 1' app/src/main/java/com/codingroadmap/app/ui/ReaderBody.kt
          grep -R -n 'rememberLazyListState' app/src/main/java/com/codingroadmap/app/ui/HomeScreen.kt
          grep -R -n 'TRACK 11' app/src/main/java/com/codingroadmap/app/ui/HomeScreen.kt
          grep -R -n 'contentPadding = PaddingValues(start = 2.dp, end = 128.dp)' app/src/main/java/com/codingroadmap/app/ui/HomeScreen.kt
          grep -n 'versionName = "0.8.4"' app/build.gradle.kts
          grep -n 'targetSdk = 36' app/build.gradle.kts
          grep -n 'isDebuggable = false' app/build.gradle.kts

      - name: Build release APK
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Android lint
        working-directory: coding-roadmap-shell
        run: gradle --no-daemon :app:lintRelease --stacktrace

      - name: Verify APK
        working-directory: coding-roadmap-shell
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep 'assets/content/catalog.json'

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          grep "versionName='0.8.4'" /tmp/badging.txt

          mkdir -p dist
          cp "$APK" dist/CodingRoadmapFresh_v0.8.4_TAB_S10_FE.apk
          sha256sum dist/CodingRoadmapFresh_v0.8.4_TAB_S10_FE.apk | tee dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.8.4_TAB_S10_FE
          path: |
            coding-roadmap-shell/dist/CodingRoadmapFresh_v0.8.4_TAB_S10_FE.apk
            coding-roadmap-shell/dist/SHA256.txt
            coding-roadmap-shell/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
