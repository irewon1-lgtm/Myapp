name: Coding Roadmap Millie Build

on:
  push:
    branches:
      - coding-roadmap-millie-v0.7.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 12); do
            test "$(stat -c%s ".coding-roadmap/bin/part${i}")" -eq 4500
          done
          test "$(stat -c%s .coding-roadmap/bin/part13)" -eq 3529
          cat .coding-roadmap/bin/part{00..13} > /tmp/coding_roadmap_v070_payload_v2.zip
          echo "19a13eacbc06565a5770ca62cf37211d90d0ee8346b21e4773e0f80d76258d13  /tmp/coding_roadmap_v070_payload_v2.zip" | sha256sum -c -
          unzip -tqq /tmp/coding_roadmap_v070_payload_v2.zip
          rm -rf source
          mkdir -p source
          unzip -q /tmp/coding_roadmap_v070_payload_v2.zip -d source
          echo "fa10d315c4c6a65b3692178c1e32fc8020f97bc70943117e9cdde45d500091bd  source/roadmapapp/src/main/assets/content/track01.json" | sha256sum -c -
          echo "c919b3fee884f11a11de8c0cbd940b46289f04e5aa4bccfd05bd99c60cfb100f  source/roadmapapp/src/main/res/raw/page_turn.wav" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source/roadmapapp/src/main/assets/content/track01.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert p.stat().st_size == 92857
          src=Path('source/roadmapapp/src/main/java/com/codingroadmap/app/MainActivity.kt').read_text(encoding='utf-8')
          assert len(data.get('pages', [])) == 64
          assert len(data.get('glossary', [])) == 32
          assert sum(bool(x.get('practiceAnswer')) for x in data['pages']) == 16
          assert sum(bool(x.get('diagram')) for x in data['pages']) >= 8
          for required in ['WindowCompat.setDecorFitsSystemWindows(window, false)', 'readerDataStore', 'SoundPool', 'visitedPages']:
              assert required in src, required
          print('SOURCE_AND_CONTENT_GATES=PASS')
          PY

      - name: Configure resilient Maven mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/settings.gradle.kts')
          s=p.read_text(encoding='utf-8')
          mirror='maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        maven { url = uri("https://maven.aliyun.com/repository/central") }\n        mavenCentral()'
          s=s.replace('mavenCentral()', mirror)
          p.write_text(s, encoding='utf-8')
          print(p.read_text())
          PY
          cat > source/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :roadmapapp:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/roadmapapp/build/outputs/apk/release/roadmapapp-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -l "$APK" | grep -F 'assets/content/track01.json'
          unzip -p "$APK" assets/content/track01.json | sha256sum | grep -F 'fa10d315c4c6a65b3692178c1e32fc8020f97bc70943117e9cdde45d500091bd'
          if unzip -l "$APK" | grep -q 'res/raw/page_turn.wav'; then
            unzip -p "$APK" res/raw/page_turn.wav | sha256sum | grep -F 'c919b3fee884f11a11de8c0cbd940b46289f04e5aa4bccfd05bd99c60cfb100f'
          else
            echo 'PAGE_TURN_RESOURCE_PACKAGED=COMPILED_RESOURCE'
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.codingroadmap.app'" /tmp/badging.txt
          grep -F "versionName='0.7.0'" /tmp/badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/badging.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest-tree.txt
          if grep -E "android:debuggable.*0xffffffff" /tmp/manifest-tree.txt; then
            echo 'DEBUGGABLE_TRUE=FAIL'
            exit 1
          fi
          echo 'DEBUGGABLE_FALSE=PASS'

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee /tmp/apk.sha256
          stat -c 'APK_BYTES=%s' "$APK"
          echo 'APK_VERIFICATION=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.7.0_Millie_UI
          path: source/roadmapapp/build/outputs/apk/release/roadmapapp-release.apk
          if-no-files-found: error
          retention-days: 7
