name: Coding Roadmap Millie Build

on:
  push:
    branches:
      - coding-roadmap-millie-v0.7.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 12); do
            test "$(stat -c%s ".coding-roadmap/bin/part${i}")" -eq 4500
          done
          stat -c "%n %s" .coding-roadmap/bin/part*\n          test "$(stat -c%s .coding-roadmap/bin/part13)" -eq 3529
          cat .coding-roadmap/bin/part{00..13} > /tmp/coding_roadmap_v070_payload_v2.zip
          echo "19a13eacbc06565a5770ca62cf37211d90d0ee8346b21e4773e0f80d76258d13  /tmp/coding_roadmap_v070_payload_v2.zip" | sha256sum -c -
          unzip -tqq /tmp/coding_roadmap_v070_payload_v2.zip
          rm -rf source
          mkdir -p source
          unzip -q /tmp/coding_roadmap_v070_payload_v2.zip -d source
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source/roadmapapp/src/main/assets/content/track01.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print('TRACK01_JSON=PASS', type(data).__name__, p.stat().st_size)
          assert p.stat().st_size > 50000
          src=Path('source/roadmapapp/src/main/java/com/codingroadmap/app/MainActivity.kt').read_text(encoding='utf-8')
          assert 'WindowCompat.setDecorFitsSystemWindows(window, false)' in src
          assert 'DataStore' in src or 'dataStore' in src
          assert 'SoundPool' in src
          print('SOURCE_GATES=PASS')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :roadmapapp:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/roadmapapp/build/outputs/apk/release/roadmapapp-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -l "$APK" | grep -F 'assets/content/track01.json'

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.codingroadmap.app'" /tmp/badging.txt
          grep -F "versionName='0.7.0'" /tmp/badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/badging.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest-tree.txt
          if grep -E "android:debuggable.*0xffffffff" /tmp/manifest-tree.txt; then
            echo "DEBUGGABLE_TRUE=FAIL"
            exit 1
          fi
          echo "DEBUGGABLE_TRUE=NOT_PRESENT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee /tmp/apk.sha256
          stat -c 'APK_BYTES=%s' "$APK"
          echo "APK_VERIFICATION=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: CodingRoadmapFresh_v0.7.0_Millie_UI
          path: source/roadmapapp/build/outputs/apk/release/roadmapapp-release.apk
          if-no-files-found: error
          retention-days: 7
