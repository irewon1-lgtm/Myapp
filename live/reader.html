cePrompt":"sum()을 쓰지 말고 반복문으로 직접 합계와 평균을 출력하세요.","answerOnNext":true,"extras":[],"code":"scores = [80, 90, 70]\ntotal = 0\n\nfor score in scores:\n    total = ____\n\naverage = ____\nprint(\"합계:\", total)\nprint(\"평균:\", average)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「scores = [80, 90, 70]」 — 「점수 리스트의 합계와 평균을 구해 보세요」에서 여러 값을 리스트로 묶어 scores에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「점수 리스트의 합계와 평균을 구해 보세요」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for score in scores:」 — 「점수 리스트의 합계와 평균을 구해 보세요」에서는 scores에서 값을 하나씩 꺼내 score에 넣습니다. 다음 반복에서는 score가 다음 값으로 바뀝니다.","5행 「total = ____」 — 「점수 리스트의 합계와 평균을 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","7행 「average = ____」 — 「점수 리스트의 합계와 평균을 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","8행 「print(\"합계:\", total)」 — 「점수 리스트의 합계와 평균을 구해 보세요」에서 \"합계:\", total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「print(\"평균:\", average)」 — 「점수 리스트의 합계와 평균을 구해 보세요」에서 \"평균:\", average의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x08","kind":"solution","title":"점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["total을 0으로 만들고 점수를 하나씩 더합니다.","합계는 240이 됩니다.","항목 세 개이므로 평균은 240 / 3 = 80입니다."],"code":"scores = [80, 90, 70]\ntotal = 0\nfor score in scores:\n    total += score\naverage = total / len(scores)\nprint(\"합계:\", total)\nprint(\"평균:\", average)","codeNote":"합계: 240\n평균: 80.0","extras":[],"codeExplain":["1행 「scores = [80, 90, 70]」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 여러 값을 리스트로 묶어 scores에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「for score in scores:」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서는 scores에서 값을 하나씩 꺼내 score에 넣습니다. 다음 반복에서는 score가 다음 값으로 바뀝니다.","4행 「total += score」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 total의 기존 값에 score을 더해 다시 total에 저장합니다.","5행 「average = total / len(scores)」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 오른쪽 total / len(scores)을 먼저 계산하고 그 결과를 average에 저장합니다.","6행 「print(\"합계:\", total)」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 \"합계:\", total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「print(\"평균:\", average)」 — 「점수 리스트의 합계와 평균을 구해 보세요 · 아주 쉬운 풀이」에서 \"평균:\", average의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x09","kind":"practice","title":"상품 재고 딕셔너리에서 값을 바꿔 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["stock = {\"사과\": 3, \"바나나\": 5}가 있습니다.","사과 한 개가 팔렸다면 사과 key의 값만 1 줄입니다."],"practicePrompt":"사과 재고를 1 줄이고 사과와 바나나 재고를 모두 출력하세요.","answerOnNext":true,"extras":[],"code":"stock = {\"사과\": 3, \"바나나\": 5}\n\nstock[\"사과\"] = ____\n\nprint(stock[\"사과\"])\nprint(stock[\"바나나\"])","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「stock = {\"사과\": 3, \"바나나\": 5}」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요」에서 key와 value로 이루어진 딕셔너리를 stock에 저장합니다.","3행 「stock[\"사과\"] = ____」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","5행 「print(stock[\"사과\"])」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요」에서 stock[\"사과\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","6행 「print(stock[\"바나나\"])」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요」에서 stock[\"바나나\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x10","kind":"solution","title":"상품 재고 딕셔너리에서 값을 바꿔 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["stock[\"사과\"]는 현재 3입니다.","stock[\"사과\"] -= 1을 실행하면 2가 됩니다.","바나나는 건드리지 않았으므로 5입니다."],"code":"stock = {\"사과\": 3, \"바나나\": 5}\nstock[\"사과\"] -= 1\nprint(stock[\"사과\"])\nprint(stock[\"바나나\"])","codeNote":"2\n5","extras":[],"codeExplain":["1행 「stock = {\"사과\": 3, \"바나나\": 5}」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요 · 아주 쉬운 풀이」에서 key와 value로 이루어진 딕셔너리를 stock에 저장합니다.","2행 「stock[\"사과\"] -= 1」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요 · 아주 쉬운 풀이」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","3행 「print(stock[\"사과\"])」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요 · 아주 쉬운 풀이」에서 stock[\"사과\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(stock[\"바나나\"])」 — 「상품 재고 딕셔너리에서 값을 바꿔 보세요 · 아주 쉬운 풀이」에서 stock[\"바나나\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x11","kind":"check","title":"없는 인덱스와 없는 key는 어떤 문제가 생길까요?","eyebrow":"초보 확장 · 확인","paragraphs":["길이가 3인 리스트의 양수 인덱스는 0, 1, 2입니다. [3]을 꺼내면 IndexError가 납니다.","없는 key를 dict[\"없는키\"]로 꺼내면 KeyError가 납니다.","dict.get(\"없는키\", 기본값)은 key가 없을 때 기본값을 돌려줄 수 있습니다."],"question":"prices={\"사과\":1000}일 때 prices.get(\"바나나\", 0)의 결과는 무엇인가요?","answerOnNext":true,"extras":[],"code":"student = {\"name\": \"민수\", \"score\": 80}\n\nprint(student[\"name\"])\nstudent[\"score\"] = 90\nprint(student[\"score\"])","codeNote":"name key로 이름을 읽고 score key의 값만 80에서 90으로 바꿉니다.","codeExplain":["1행 「student = {\"name\": \"민수\", \"score\": 80}」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요?」에서 key와 value로 이루어진 딕셔너리를 student에 저장합니다.","3행 「print(student[\"name\"])」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요?」에서 student[\"name\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「student[\"score\"] = 90」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요?」에서 오른쪽 90을 먼저 계산하고 그 결과를 student[\"score\"]에 저장합니다.","5행 「print(student[\"score\"])」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요?」에서 student[\"score\"]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x12","kind":"solution","title":"없는 인덱스와 없는 key는 어떤 문제가 생길까요? · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["바나나 key는 없습니다.","하지만 get은 key가 없을 때 두 번째 인수로 준 기본값을 돌려줍니다.","따라서 오류 대신 0을 얻습니다.","리스트 안의 딕셔너리를 반복할 때는 먼저 리스트에서 딕셔너리 하나를 꺼내고, 그다음 그 딕셔너리에서 필요한 key의 값을 꺼낸다고 두 단계로 생각하세요."],"code":"prices = {\"사과\": 1000}\nprint(prices.get(\"바나나\", 0))","codeNote":"예상 출력: 0","extras":[],"codeExplain":["1행 「prices = {\"사과\": 1000}」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요? · 아주 쉬운 풀이」에서 key와 value로 이루어진 딕셔너리를 prices에 저장합니다.","2행 「print(prices.get(\"바나나\", 0))」 — 「없는 인덱스와 없는 key는 어떤 문제가 생길까요? · 아주 쉬운 풀이」에서 prices.get(\"바나나\", 0)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x13","kind":"concept","title":"리스트 안에 딕셔너리를 넣으면 여러 사람·상품을 표현할 수 있습니다","eyebrow":"초 5 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"string 문자열","description":"글자들의 순서 있는 묶음입니다. Python에서는 str 타입이며 따옴표로 표현합니다.","usage":"이름, 메시지, 파일 내용, 사용자 입력 등 텍스트를 다룰 때 씁니다.","example":"예: name = \"민수\"는 문자열 값입니다."},{"term":"indexing 인덱싱","description":"문자열의 특정 위치 글자에 인덱스로 접근하는 방법입니다. 리스트와 마찬가지로 첫 위치는 0입니다.","usage":"첫 글자나 특정 위치 문자를 확인할 때 씁니다.","example":"예: word[0]은 첫 번째 글자를 반환합니다."},{"term":"slice 슬라이싱","description":"문자열이나 리스트의 일부 구간을 잘라 새 값을 만드는 방법입니다. 시작은 포함하고 끝은 포함하지 않습니다.","usage":"앞부분, 뒷부분, 특정 범위를 추출할 때 씁니다.","example":"예: text[0:3]은 인덱스 0,1,2 구간을 가져옵니다."}],"extras":[],"visibleExtras":2,"id":"t2-c5-p1","code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「먼저 알아두면 좋은 단어」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「먼저 알아두면 좋은 단어」에서 text[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(text[0:3])」 — 「먼저 알아두면 좋은 단어」에서 text[0:3]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(text[-1])」 — 「먼저 알아두면 좋은 단어」에서 text[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"split","description":"구분자를 기준으로 문자열을 여러 조각으로 나누어 리스트로 만드는 메서드입니다.","usage":"CSV 비슷한 단순 텍스트나 공백 단위 단어를 나눌 때 씁니다.","example":"예: \"A,B,C\".split(\",\")는 [\"A\", \"B\", \"C\"]를 만듭니다."},{"term":"strip","description":"문자열 앞뒤의 불필요한 공백이나 줄바꿈을 제거하는 메서드입니다.","usage":"사용자 입력이나 파일 한 줄을 정리할 때 자주 사용합니다.","example":"예: \"  hello \n\".strip()은 \"hello\"가 됩니다."},{"term":"f-string","description":"문자열 안에 변수나 표현식 결과를 자연스럽게 넣는 Python 문법입니다.","usage":"결과 메시지, 로그, 화면 텍스트를 만들 때 사용합니다.","example":"예: f\"합계: {total}원\"처럼 변수 값을 포함합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c5-p2","code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「코드에서 자주 만나는 표현」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「코드에서 자주 만나는 표현」에서 text[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(text[0:3])」 — 「코드에서 자주 만나는 표현」에서 text[0:3]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(text[-1])」 — 「코드에서 자주 만나는 표현」에서 text[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 1/6","title":"문자열도 순서가 있는 데이터입니다","paragraphs":["문자열은 한 덩어리처럼 보이지만 내부적으로 글자들이 순서대로 놓여 있어 인덱싱과 슬라이싱이 가능합니다.","리스트와 같은 0 기반 인덱스 규칙을 사용하므로 문자열을 배우면서 이전 자료구조 개념을 다시 연결할 수 있습니다.","전화번호 일부, 코드 앞자리, 파일 확장자 등 특정 위치나 구간을 확인할 때 유용합니다."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p3","code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「문자열도 순서가 있는 데이터입니다」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「문자열도 순서가 있는 데이터입니다」에서 text[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(text[0:3])」 — 「문자열도 순서가 있는 데이터입니다」에서 text[0:3]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(text[-1])」 — 「문자열도 순서가 있는 데이터입니다」에서 text[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 2/6","title":"문자열은 직접 수정하기보다 새 문자열을 만듭니다","paragraphs":["Python 문자열은 immutable이라 특정 글자 위치에 직접 새 값을 대입할 수 없습니다. 메서드나 슬라이싱 결과로 새 문자열을 만들어 변수에 다시 대입합니다.","text = text.strip()처럼 정리한 결과를 다시 저장하는 패턴이 흔합니다.","이 특성을 알면 문자열 메서드를 호출했는데 원래 변수가 그대로인 이유를 이해하기 쉽습니다."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p4","code":"name = \"MINSU\"\nlower_name = name.lower()\nprint(name)\nprint(lower_name)","codeNote":"lower()는 새 문자열을 만들기 때문에 name은 MINSU 그대로이고 lower_name만 minsu가 됩니다.","codeExplain":["1행 「name = \"MINSU\"」 — 「문자열은 직접 수정하기보다 새 문자열을 만듭니다」에서 오른쪽 \"MINSU\"을 먼저 계산하고 그 결과를 name에 저장합니다.","2행 「lower_name = name.lower()」 — 「문자열은 직접 수정하기보다 새 문자열을 만듭니다」에서 오른쪽 name.lower()을 먼저 계산하고 그 결과를 lower_name에 저장합니다.","3행 「print(name)」 — 「문자열은 직접 수정하기보다 새 문자열을 만듭니다」에서 name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(lower_name)」 — 「문자열은 직접 수정하기보다 새 문자열을 만듭니다」에서 lower_name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 3/6","title":"strip과 split은 입력 정리의 기본 조합입니다","paragraphs":["파일이나 사용자 입력에는 앞뒤 공백과 줄바꿈이 섞이기 쉽습니다. 먼저 strip으로 정리한 뒤 split으로 구조를 나누면 예상치 못한 빈칸을 줄일 수 있습니다.","예: line.strip().split(\",\")처럼 단계적으로 처리하면 한 줄 텍스트를 필드 여러 개로 바꿀 수 있습니다.","실제 데이터가 항상 깔끔하다고 가정하지 않는 습관은 파일과 API 처리에서도 중요합니다."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p5","code":"raw = \"  YES  \"\nclean = raw.strip().lower()\nprint(clean)\nprint(clean == \"yes\")","codeNote":"양끝 공백을 없애고 소문자로 바꿔 \"yes\"와 안정적으로 비교합니다.","codeExplain":["1행 「raw = \"  YES  \"」 — 「strip과 split은 입력 정리의 기본 조합입니다」에서 오른쪽 \"  YES  \"을 먼저 계산하고 그 결과를 raw에 저장합니다.","2행 「clean = raw.strip().lower()」 — 「strip과 split은 입력 정리의 기본 조합입니다」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","3행 「print(clean)」 — 「strip과 split은 입력 정리의 기본 조합입니다」에서 clean의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(clean == \"yes\")」 — 「strip과 split은 입력 정리의 기본 조합입니다」에서 clean == \"yes\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 4/6","title":"문자열 검색과 비교는 대소문자와 공백을 고려합니다","paragraphs":["\"Python\"과 \"python\"은 서로 다른 문자열입니다. 검색 전에 lower()로 소문자화하거나 strip으로 공백을 정리하면 사용자 입력 비교가 더 안정적입니다.","정규화한 값을 별도 변수에 두면 원본을 보존하면서 비교 기준을 통일할 수 있습니다.","이메일, 태그, 검색어처럼 대소문자 차이를 무시해도 되는 값과 비밀번호처럼 그대로 비교해야 하는 값을 구분하세요."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p6","code":"raw = \"  YES  \"\nclean = raw.strip().lower()\nprint(clean)\nprint(clean == \"yes\")","codeNote":"양끝 공백을 없애고 소문자로 바꿔 \"yes\"와 안정적으로 비교합니다.","codeExplain":["1행 「raw = \"  YES  \"」 — 「문자열 검색과 비교는 대소문자와 공백을 고려합니다」에서 오른쪽 \"  YES  \"을 먼저 계산하고 그 결과를 raw에 저장합니다.","2행 「clean = raw.strip().lower()」 — 「문자열 검색과 비교는 대소문자와 공백을 고려합니다」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","3행 「print(clean)」 — 「문자열 검색과 비교는 대소문자와 공백을 고려합니다」에서 clean의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(clean == \"yes\")」 — 「문자열 검색과 비교는 대소문자와 공백을 고려합니다」에서 clean == \"yes\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 5/6","title":"f-string은 값과 설명을 함께 보여 주기 좋습니다","paragraphs":["문자열을 +로 여러 번 이어붙이는 것보다 f\"이름: {name}, 점수: {score}\"처럼 작성하면 어떤 값이 어디에 들어가는지 한눈에 보입니다.","중괄호 안에는 간단한 표현식도 넣을 수 있지만 너무 복잡한 계산은 먼저 변수로 분리하는 편이 읽기 좋습니다.","앱 화면 텍스트, 로그, 리포트 문장을 만들 때 매우 자주 사용합니다."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p7","code":"name = \"민수\"\nage = 10\nprint(f\"{name}는 {age}살입니다\")","codeNote":"중괄호 안의 변수 값이 문자열 안에 들어가 “민수는 10살입니다”가 출력됩니다.","codeExplain":["1행 「name = \"민수\"」 — 「f-string은 값과 설명을 함께 보여 주기 좋습니다」에서 오른쪽 \"민수\"을 먼저 계산하고 그 결과를 name에 저장합니다.","2행 「age = 10」 — 「f-string은 값과 설명을 함께 보여 주기 좋습니다」에서 오른쪽 10을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(f\"{name}는 {age}살입니다\")」 — 「f-string은 값과 설명을 함께 보여 주기 좋습니다」에서 f\"{name}는 {age}살입니다\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 6/6","title":"문자열 처리는 작은 단계로 나누면 오류가 줄어듭니다","paragraphs":["원본 입력 → 공백 제거 → 대소문자 정리 → 분리 → 검증처럼 단계별 변수에 결과를 담으면 어디에서 데이터가 달라졌는지 확인하기 쉽습니다.","한 줄에 여러 메서드를 연결하는 체이닝은 편하지만 학습 단계에서는 중간값을 출력하면서 의미를 확인하는 것이 좋습니다.","텍스트 처리 버그는 눈으로 비슷해 보이는 공백·줄바꿈 때문에 생기기도 하므로 repr()로 실제 문자를 확인하는 방법도 있습니다."],"keywords":["string 문자열","indexing 인덱싱","slice 슬라이싱","split"],"extras":[],"visibleExtras":2,"id":"t2-c5-p8","code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「문자열 처리는 작은 단계로 나누면 오류가 줄어듭니다」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「문자 다루기를 직접 바꾸고 확장합니다","paragraphs":["문자열 문제에서는 원본 글자와 정리된 결과를 따로 생각하세요. strip, lower, split 같은 메서드는 각각 다른 형태의 결과를 만듭니다.","split의 결과는 여러 조각이 들어 있는 리스트입니다. 그래서 나눈 뒤에는 parts[0], parts[1]처럼 위치 번호로 각각의 조각을 꺼낼 수 있습니다.","문자열로 된 숫자는 그대로 더하면 숫자 계산이 되지 않습니다. 가격이나 수량처럼 계산할 값은 int로 바꾼 뒤 연산해야 합니다."],"code":"raw = \" 상품명 , 12000 , 3 \"\nparts = ____\n\nname = ____\nprice = ____\ncount = ____\n\nprint(name)\nprint(price * count)","practicePrompt":"\" 상품명 , 12000 , 3 \" 같은 문자열을 만들고 strip과 split으로 이름·가격·수량을 나눈 뒤 가격과 수량은 int로 바꿔 총액을 출력하세요.","extras":[],"visibleExtras":2,"id":"t2-c5-p11","answerOnNext":true,"codeExplain":["1행 「raw = \" 상품명 , 12000 , 3 \"」 — 「문자열 다루기를 직접 바꾸고 확장합니다」에서 오른쪽 \" 상품명 , 12000 , 3 \"을 먼저 계산하고 그 결과를 raw에 저장합니다.","2행 「parts = ____」 — 「문자열 다루기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","4행 「name = ____」 — 「문자열 다루기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","5행 「price = ____」 — 「문자열 다루기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","6행 「count = ____」 — 「문자열 다루기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","8행 「print(name)」 — 「문자열 다루기를 직접 바꾸고 확장합니다」에서 name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「print(price * count)」 — 「문자열 다루기를 직접 바꾸고 확장합니다」에서 price * count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c5-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"문자열 다루기를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["split(\",\")은 쉼표 기준으로 문자열을 나누어 리스트를 만듭니다.","리스트의 첫 칸 번호는 0이므로 parts[0]이 상품명입니다. 각 칸의 공백을 strip으로 없앱니다.","가격·수량을 int로 바꾼 뒤 곱합니다. 문자열 그대로 곱하려고 하면 원하는 계산이 되지 않습니다."],"code":"raw = \" 상품명 , 12000 , 3 \"\nparts = raw.split(\",\")\nname = parts[0].strip()\nprice = int(parts[1].strip())\ncount = int(parts[2].strip())\nprint(f\"{name}: {price * count}원\")","codeNote":"실행 결과 또는 테스트 기준\n상품명: 36000원","extras":[],"codeExplain":["1행 「raw = \" 상품명 , 12000 , 3 \"」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 \" 상품명 , 12000 , 3 \"을 먼저 계산하고 그 결과를 raw에 저장합니다.","2행 「parts = raw.split(\",\")」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","3행 「name = parts[0].strip()」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","4행 「price = int(parts[1].strip())」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","5행 「count = int(parts[2].strip())」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","6행 「print(f\"{name}: {price * count}원\")」 — 「문자열 다루기를 직접 바꾸고 확장합니다 · 풀이」에서 f\"{name}: {price * count}원\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"문자열 다루기 핵심을 확인합니다","paragraphs":[],"question":"text.strip()만 호출하고 결과를 변수에 다시 저장하지 않았는데 text를 출력하면 공백이 그대로 남을 수 있는 이유는 무엇일까요?","extras":[],"visibleExtras":3,"id":"t2-c5-p12","answerOnNext":true,"code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「문자열 다루기 핵심을 확인합니다」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「문자열 다루기 핵심을 확인합니다」에서 text[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(text[0:3])」 — 「문자열 다루기 핵심을 확인합니다」에서 text[0:3]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(text[-1])」 — 「문자열 다루기 핵심을 확인합니다」에서 text[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c5-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"문자열 다루기 핵심을 확인합니다 · 풀이","paragraphs":["문자열은 직접 변경되는 값이 아니라 strip()이 정리된 새 문자열을 반환하기 때문입니다. text = text.strip()처럼 반환값을 다시 저장해야 이후 text가 정리된 값을 가리킵니다.","split으로 문자열을 나누면 리스트가 만들어집니다. 이후 코드는 문자열 전체가 아니라 잘린 조각들을 하나씩 꺼내 사용하는 구조가 됩니다."],"extras":[],"code":"name = \"  MINSU  \"\nclean = name.strip().lower()\nprint(clean)","codeNote":"strip이 양끝 공백을 없애고 lower가 영어 대문자를 소문자로 바꿉니다.","codeExplain":["1행 「name = \"  MINSU  \"」 — 「문자열 다루기 핵심을 확인합니다 · 풀이」에서 오른쪽 \"  MINSU  \"을 먼저 계산하고 그 결과를 name에 저장합니다.","2행 「clean = name.strip() 해\"]입니다.","len(words)는 항목 수 4를 돌려줍니다.","슬라이스는 시작 위치는 포함하고 끝 위치는 포함하지 않습니다. text[0:3]이라면 0, 1, 2번 글자만 가져옵니다."],"code":"sentence = \"나는 파이썬을 정말 좋아해\"\nwords = sentence.split()\nprint(len(words))","codeNote":"예상 출력: 4","extras":[],"codeExplain":["1행 「sentence = \"나는 파이썬을 정말 좋아해\"」 — 「문장에 단어가 몇 개인지 세어 보세요 · 아주 쉬운 풀이」에서 오른쪽 \"나는 파이썬을 정말 좋아해\"을 먼저 계산하고 그 결과를 sentence에 저장합니다.","2행 「words = sentence.split()」 — 「문장에 단어가 몇 개인지 세어 보세요 · 아주 쉬운 풀이」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","3행 「print(len(words))」 — 「문장에 단어가 몇 개인지 세어 보세요 · 아주 쉬운 풀이」에서 len(words)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c5-x11","kind":"check","title":"f-string과 in을 읽어 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["f-string은 문자열 안에 변수 값을 쉽게 넣는 방법입니다. f\"안녕 {name}\"처럼 중괄호를 씁니다.","in은 어떤 글자나 단어가 문자열 안에 포함되어 있는지 True/False로 알려 줍니다.","둘을 함께 쓰면 검색 결과나 안내 문장을 쉽게 만들 수 있습니다."],"question":"text=\"hello python\"일 때 \"python\" in text의 결과는 무엇인가요?","answerOnNext":true,"extras":[],"code":"name = \"민수\"\nage = 10\nprint(f\"{name}는 {age}살입니다\")","codeNote":"중괄호 안의 변수 값이 문자열 안에 들어가 “민수는 10살입니다”가 출력됩니다.","codeExplain":["1행 「name = \"민수\"」 — 「f-string과 in을 읽어 보세요」에서 오른쪽 \"민수\"을 먼저 계산하고 그 결과를 name에 저장합니다.","2행 「age = 10」 — 「f-string과 in을 읽어 보세요」에서 오른쪽 10을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(f\"{name}는 {age}살입니다\")」 — 「f-string과 in을 읽어 보세요」에서 f\"{name}는 {age}살입니다\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c5-x12","kind":"solution","title":"f-string과 in을 읽어 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["text 안에 실제로 python이라는 글자가 들어 있습니다.","따라서 \"python\" in text는 True입니다.","in은 위치 번호가 아니라 포함 여부만 알려 줍니다.","슬라이스는 시작 위치는 포함하고 끝 위치는 포함하지 않습니다. text[0:3]이라면 0, 1, 2번 글자만 가져옵니다."],"code":"text = \"hello python\"\nprint(\"python\" in text)","codeNote":"예상 출력: True","extras":[],"codeExplain":["1행 「text = \"hello python\"」 — 「f-string과 in을 읽어 보세요 · 아주 쉬운 풀이」에서 오른쪽 \"hello python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(\"python\" in text)」 — 「f-string과 in을 읽어 보세요 · 아주 쉬운 풀이」에서 \"python\" in text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c5-x13","kind":"concept","title":"문자열 메서드는 원본을 몰래 바꾸지 않습니다","eyebrow":"초보 확장 · 개념","paragraphs":["name.lower()를 실행하면 소문자로 바뀐 새 문자열을 돌려줍니다.","그 결과를 저장하지 않으면 name 변수에는 원래 값이 그대로 남습니다.","그래서 name = name.lower()처럼 결과를 다시 저장하는 패턴을 자주 사용합니다."],"extras":[],"code":"name = \"MINSU\"\nlower_name = name.lower()\nprint(name)\nprint(lower_name)","codeNote":"lower()는 새 문자열을 만들기 때문에 name은 MINSU 그대로이고 lower_name만 minsu가 됩니다.","codeExplain":["1행 「name = \"MINSU\"」 — 「문자열 메서드는 원본을 몰래 바꾸지 않습니다」에서 오른쪽 \"MINSU\"을 먼저 계산하고 그 결과를 name에 저장합니다.","2행 「lower_name = name.lower()」 — 「문자열 메서드는 원본을 몰래 바꾸지 않습니다」에서 오른쪽 name.lower()을 먼저 계산하고 그 결과를 lower_name에 저장합니다.","3행 「print(name)」 — 「문자열 메서드는 원본을 몰래 바꾸지 않습니다」에서 name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(lower_name)」 — 「문자열 메서드는 원본을 몰래 바꾸지 않습니다」에서 lower_name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c5-x14","kind":"example","title":"이메일 모양을 아주 단순하게 나눠 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["email에 @가 하나 있다고 가정하고 split(\"@\")으로 두 조각을 만듭니다.","parts[0]은 @ 앞쪽, parts[1]은 @ 뒤쪽입니다. 한 번에 변수 두 개를 받는 축약 표현 대신 리스트 인덱스로 하나씩 꺼냅니다.","이 예제는 실제 이메일 검증기가 아니라 문자열 나누기를 이해하는 연습입니다."],"code":"email = \"kid@example.com\"\nparts = email.split(\"@\")\nprint(parts[0])\nprint(parts[1])","codeNote":"@를 기준으로 두 조각으로 나누어 아이디와 도메인을 각각 꺼냅니다.","extras":[],"codeExplain":["1행 「email = \"kid@example.com\"」 — 「이메일 모양을 아주 단순하게 나눠 봅니다」에서 오른쪽 \"kid@example.com\"을 먼저 계산하고 그 결과를 email에 저장합니다.","2행 「parts = email.split(\"@\")」 — 「이메일 모양을 아주 단순하게 나눠 봅니다」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","3행 「print(parts[0])」 — 「이메일 모양을 아주 단순하게 나눠 봅니다」에서 parts[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(parts[1])」 — 「이메일 모양을 아주 단순하게 나눠 봅니다」에서 parts[1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 5 정리","title":"지금 알아야 할 것","paragraphs":["문자열 다루기 챕터의 목표는 문법을 외우는 것이 아니라 “문자열을 인덱싱·분리·정리·검색·포맷팅하여 사용자 입력과 텍스트 데이터를 안정적으로 처리한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 파일 읽기와 쓰기로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["문자열을 인덱싱·분리·정리·검색·포맷팅하여 사용자 입력과 텍스트 데이터를 안정적으로 처리한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c5-p13","code":"text = \"Python\"\nprint(text[0])\nprint(text[0:3])\nprint(text[-1])","codeNote":"첫 글자는 P, 0:3은 Pyt, 마지막 글자는 n입니다.","codeExplain":["1행 「text = \"Python\"」 — 「지금 알아야 할 것」에서 오른쪽 \"Python\"을 먼저 계산하고 그 결과를 text에 저장합니다.","2행 「print(text[0])」 — 「지금 알아야 할 것」에서 text[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(text[0:3])」 — 「지금 알아야 할 것」에서 text[0:3]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(text[-1])」 — 「지금 알아야 할 것」에서 text[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문자열에서 구문을 찾고 바꾸는 실제 문제를 통해 문자열 처리를 배우는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"문자열·대소문자·부분 문자열·타입 혼동 같은 초보 실수를 실제 값으로 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"원시 데이터를 정리해 다음 계산에 사용할 수 있는 형태로 바꾸는 흐름 참고"}]}],"track":2,"id":"t2-c5","remember":"strip·split의 역할과 반환값","practiceGoal":"문자열 분해·정리·숫자 변환","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문자열에서 구문을 찾고 바꾸는 실제 문제를 통해 문자열 처리를 배우는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"문자열·대소문자·부분 문자열·타입 혼동 같은 초보 실수를 실제 값으로 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"원시 데이터를 정리해 다음 계산에 사용할 수 있는 형태로 바꾸는 흐름 참고"}]},{"chapter":6,"title":"파일 읽기와 쓰기","pages":[{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"file 파일","description":"프로그램이 종료된 뒤에도 데이터를 남겨둘 수 있는 저장 단위입니다. 텍스트 파일은 사람이 읽을 수 있는 문자 데이터를 담습니다.","usage":"설정, 로그, 간단한 데이터 저장과 불러오기에 사용합니다.","example":"예: notes.txt에 메모를 저장하고 다음 실행에서 다시 읽을 수 있습니다."},{"term":"path 경로","description":"파일이 저장된 위치를 나타내는 문자열입니다. 상대 경로와 절대 경로가 있으며 실행 위치에 따라 의미가 달라질 수 있습니다.","usage":"어떤 파일을 열지 지정할 때 사용합니다.","example":"예: \"data/notes.txt\"는 현재 작업 위치를 기준으로 한 상대 경로입니다."},{"term":"open","description":"파일을 읽거나 쓰기 위해 여는 Python 함수입니다. 모드와 인코딩을 함께 지정할 수 있습니다.","usage":"파일 입출력의 시작점으로 사용합니다.","example":"예: open(\"notes.txt\", \"r\", encoding=\"utf-8\")처럼 사용합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c6-p1","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「먼저 알아두면 좋은 단어」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「먼저 알아두면 좋은 단어」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「먼저 알아두면 좋은 단어」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"read / write mode","description":"\"r\"은 읽기, \"w\"는 새로 쓰기, \"a\"는 뒤에 이어 쓰기 같은 파일 모드입니다. 모드에 따라 기존 내용 처리 방식이 달라집니다.","usage":"파일을 어떤 목적으로 열지 지정할 때 씁니다.","example":"예: \"w\"는 기존 파일 내용을 덮어쓸 수 있어 주의가 필요합니다."},{"term":"encoding 인코딩","description":"문자를 파일의 바이트와 서로 변환하는 규칙입니다. 한글 텍스트에서는 UTF-8을 명시하면 환경 차이로 인한 문제를 줄일 수 있습니다.","usage":"한글 깨짐이나 문자 변환 오류를 예방할 때 중요합니다.","example":"예: encoding=\"utf-8\"을 자주 사용합니다."},{"term":"with context manager","description":"파일을 사용한 뒤 자동으로 닫히도록 관리해 주는 문법입니다. 예외가 발생해도 자원 정리가 쉬워집니다.","usage":"파일을 안전하게 열고 닫을 때 사용합니다.","example":"예: with open(...) as f: 블록이 끝나면 파일이 자동으로 닫힙니다."}],"extras":[],"visibleExtras":2,"id":"t2-c6-p2","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「코드에서 자주 만나는 표현」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「코드에서 자주 만나는 표현」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「코드에서 자주 만나는 표현」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 1/6","title":"파일은 프로그램 밖에 남는 상태입니다","paragraphs":["변수 값은 프로그램이 끝나면 사라지지만 파일에 저장하면 다음 실행에서도 다시 읽을 수 있습니다. 그래서 파일 입출력은 작은 프로그램을 실제 도구로 확장하는 첫 단계입니다.","입력 → 처리 → 파일 저장, 또는 파일 읽기 → 처리 → 출력처럼 기존의 입력·처리·출력 구조에 저장소가 추가된다고 생각하면 쉽습니다.","설정 파일, 간단한 기록, 로그, 내보내기 기능 등이 같은 원리를 사용합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p3","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일은 프로그램 밖에 남는 상태입니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일은 프로그램 밖에 남는 상태입니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일은 프로그램 밖에 남는 상태입니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 2/6","title":"with open은 열기와 닫기를 한 구조로 묶습니다","paragraphs":["파일은 열었으면 닫아야 합니다. with 문을 사용하면 블록을 벗어날 때 Python이 파일을 정리하므로 close()를 직접 빼먹을 위험이 줄어듭니다.","with open(path, \"r\", encoding=\"utf-8\") as f: 아래에서 f.read()나 반복문으로 내용을 읽을 수 있습니다.","자원을 열고 정리하는 패턴은 나중에 데이터베이스나 네트워크 연결에서도 비슷한 사고방식으로 이어집니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p4","code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「with open은 열기와 닫기를 한 구조로 묶습니다」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 「with open은 열기와 닫기를 한 구조로 묶습니다」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 3/6","title":"쓰기 모드는 기존 데이터를 지울 수 있습니다","paragraphs":["\"w\" 모드는 파일을 새 내용으로 쓰기 때문에 기존 내용이 사라질 수 있습니다. 기존 기록 뒤에 추가하려면 \"a\"가 더 적합한 경우가 있습니다.","어떤 모드를 쓰기 전에 “기존 내용을 보존해야 하는가?”를 먼저 판단하세요.","중요한 파일을 다룰 때는 테스트용 복사본으로 먼저 확인하는 습관이 안전합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p5","code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「쓰기 모드는 기존 데이터를 지울 수 있습니다」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 「쓰기 모드는 기존 데이터를 지울 수 있습니다」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 4/6","title":"한 줄씩 읽으면 큰 파일도 다루기 쉽습니다","paragraphs":["f.read()는 전체 내용을 한 번에 가져오지만, for line in f: 처럼 반복하면 한 줄씩 처리할 수 있습니다.","각 줄에 strip()을 적용하고 필요한 값으로 변환하면 문자열 챕터에서 배운 기술을 그대로 연결할 수 있습니다.","파일 크기가 커질수록 전체를 한 번에 메모리에 올리는 방식보다 스트리밍 처리의 장점이 커집니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p6","code":"total = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total += int(line.strip())\n\nprint(total)","codeNote":"한 줄씩 읽은 문자열을 정수로 바꿔 total에 누적합니다.","codeExplain":["1행 「total = 0」 — 「한 줄씩 읽으면 큰 파일도 다루기 쉽습니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「한 줄씩 읽으면 큰 파일도 다루기 쉽습니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for line in f:」 — 「한 줄씩 읽으면 큰 파일도 다루기 쉽습니다」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","5행 「total += int(line.strip())」 — 「한 줄씩 읽으면 큰 파일도 다루기 쉽습니다」에서 total의 기존 값에 int(line.strip())을 더해 다시 total에 저장합니다.","7행 「print(total)」 — 「한 줄씩 읽으면 큰 파일도 다루기 쉽습니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 5/6","title":"경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다","paragraphs":["파일 이름이 맞아도 현재 작업 폴더가 다르면 상대 경로가 다른 위치를 가리킬 수 있습니다. FileNotFoundError가 나면 경로 문자열과 실행 위치를 함께 확인하세요.","학습 단계에서는 같은 폴더의 단순 파일부터 시작하고, 나중에 pathlib로 경로를 조합하는 방식을 배우면 좋습니다.","“코드 오류”와 “환경·파일 위치 오류”를 구분하는 습관이 중요합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p7","code":"filename = \"data/memo.txt\"\n\nwith open(filename, \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 위치는 filename 경로가 결정하고, utf-8은 한글을 읽는 문자 인코딩을 지정합니다.","codeExplain":["1행 「filename = \"data/memo.txt\"」 — 「경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다」에서 오른쪽 \"data/memo.txt\"을 먼저 계산하고 그 결과를 filename에 저장합니다.","3행 「with open(filename, \"r\", encoding=\"utf-8\") as f:」 — 「경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「text = f.read()」 — 「경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","6행 「print(text)」 — 「경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 6/6","title":"읽기와 쓰기는 데이터 검증과 함께 사용합니다","paragraphs":["파일에서 읽은 문자열이 항상 기대한 형식이라는 보장은 없습니다. 빈 줄, 잘못된 숫자, 누락된 필드가 있을 수 있습니다.","읽기 → 정리 → 검증 → 변환 → 처리 순서를 지키면 오류 위치가 명확해집니다.","이후 CSV, JSON, 데이터베이스를 배울 때도 외부 데이터를 신뢰하지 않고 구조를 확인하는 원칙은 그대로 유지됩니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p8","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「읽기와 쓰기는 데이터 검증과 함께 사용합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「읽기와 쓰기는 데이터 검증과 함께 사용합니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「읽기와 쓰기는 데이터 검증과 함께 사용합니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"파일 읽기와 쓰기의 전체 흐름","paragraphs":["파일 읽기와 쓰기에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"IPO_PROJECT","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c6-p9","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기의 전체 흐름」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일 읽기와 쓰기의 전체 흐름」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일 읽기와 쓰기의 전체 흐름」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"파일 읽기와 쓰기를 하나의 코드로 연결합니다","paragraphs":[],"code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","extras":[],"visibleExtras":2,"id":"t2-c6-p10","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기를 하나의 코드로 연결합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일 읽기와 쓰기를 하나의 코드로 연결합니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일 읽기와 쓰기를 하나의 코드로 연결합니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"파일 읽기와 쓰기를 직접 바꾸고 확장합니다","paragraphs":["파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다.","파일에 숫자가 적혀 있어도 read나 한 줄 반복으로 가져온 값은 문자열입니다. 줄바꿈을 strip으로 지우고 int로 바꾸어야 숫자 계산이 됩니다.","w 모드는 기존 내용을 새로 쓰고 a 모드는 뒤에 추가합니다. 저장 문제에서는 어떤 모드가 맞는지 먼저 결정한 뒤 write 코드를 작성하세요."],"code":"total = 0\n\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = ____\n        total = ____\n\nprint(total)","practicePrompt":"expenses.txt 파일에 금액을 한 줄에 하나씩 저장한다고 가정하세요. 파일을 읽어 각 줄을 int로 바꾼 뒤 총합을 계산하는 코드를 작성해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c6-p11","answerOnNext":true,"codeExplain":["1행 「total = 0」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for line in f:」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","5행 「number = ____」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","6행 「total = ____」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","8행 「print(total)」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c6-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["앞의 세 줄은 실습용 파일을 만드는 준비 코드입니다. 기존에 중요한 expenses.txt가 있는 폴더에서는 실행하지 마세요.","\"w\"는 파일을 여는 즉시 기존 내용을 비웁니다. \"r\"은 읽기입니다.","각 줄을 읽고 줄바꿈을 제거한 후 숫자로 바꿉니다. 12000 + 8000 + 15000 = 35000입니다.","파일은 현재 작업 폴더에 생깁니다. 휴대폰 다운로드 폴더에 자동으로 생기는 것은 아닙니다."],"code":"with open(\"expenses.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"12000\\n8000\\n15000\\n\")\n\ntotal = 0\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total = total + int(line.strip())\nprint(total)","codeNote":"실행 결과 또는 테스트 기준\n35000","extras":[],"codeExplain":["1행 「with open(\"expenses.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"12000\\n8000\\n15000\\n\")」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다.","4행 「total = 0」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","5행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","6행 「for line in f:」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","7행 「total = total + int(line.strip())」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","8행 「print(total)」 — 「파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"파일 읽기와 쓰기 핵심을 확인합니다","paragraphs":[],"question":"기존 기록을 보존해야 하는 파일을 \"w\" 모드로 열면 어떤 위험이 있을까요?","extras":[],"visibleExtras":3,"id":"t2-c6-p12","answerOnNext":true,"code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기 핵심을 확인합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일 읽기와 쓰기 핵심을 확인합니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일 읽기와 쓰기 핵심을 확인합니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"파일 읽기와 쓰기 핵심을 확인합니다 · 풀이","paragraphs":["\"w\" 모드는 파일을 새로 쓰는 방식이라 기존 내용이 덮어써져 사라질 수 있습니다. 기존 내용 뒤에 추가하려면 상황에 따라 \"a\" 모드를 고려해야 합니다."],"extras":[],"code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"r 모드로 파일을 읽고 그 내용을 text 변수에 저장합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일 읽기와 쓰기 핵심을 확인합니다 · 풀이」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일 읽기와 쓰기 핵심을 확인합니다 · 풀이」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일 읽기와 쓰기 핵심을 확인합니다 · 풀이」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x01","kind":"concept","title":"파일은 프로그램을 꺼도 남는 공책입니다","eyebrow":"초보 확장 · 개념","paragraphs":["변수에 저장한 값은 프로그램이 끝나면 보통 사라집니다. 파일에 적으면 껐다 켜도 내용이 남습니다.","파일 읽기는 공책을 펼쳐 보는 것이고, 파일 쓰기는 공책에 적는 것과 비슷합니다.","“메모리의 변수”와 “저장장치의 파일”을 구분하는 것이 핵심입니다."],"keywords":["file","파일","read","write"],"extras":[],"code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「파일은 프로그램을 꺼도 남는 공책입니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「파일은 프로그램을 꺼도 남는 공책입니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「파일은 프로그램을 꺼도 남는 공책입니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x02","kind":"example","title":"with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다","eyebrow":"초보 확장 · 예제","paragraphs":["open(\"note.txt\", \"r\")는 note.txt를 읽기 모드로 엽니다.","with 블록 안에서 f.read()로 내용을 읽습니다.","with 블록이 끝나면 Python이 파일을 자동으로 닫아 줍니다."],"code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","extras":[],"codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 「with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x03","kind":"concept","title":"r · w · a 모드는 파일에 하는 일이 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["r은 읽기입니다. 파일이 없으면 FileNotFoundError가 납니다.","w는 새로 쓰기입니다. 같은 파일이 있으면 기존 내용을 지우고 새로 쓸 수 있으므로 조심해야 합니다.","a는 뒤에 이어 쓰기입니다. 기존 내용을 남기고 끝에 새 내용을 추가합니다."],"calloutTitle":"중요 경고","calloutBody":"w 모드는 기존 파일을 덮어쓸 수 있습니다. 중요한 파일에는 먼저 복사본을 만들어 두세요.","extras":[],"code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「r · w · a 모드는 파일에 하는 일이 다릅니다」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 「r · w · a 모드는 파일에 하는 일이 다릅니다」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x04","kind":"example","title":"한 줄을 저장한 뒤 다시 읽어 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["첫 with는 write 모드로 hello.txt에 “안녕하세요”를 저장합니다.","두 번째 with는 같은 파일을 read 모드로 다시 열어 읽습니다.","저장 → 다시 읽기 흐름을 직접 해보면 파일 입출력이 쉽게 연결됩니다."],"code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","extras":[],"codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「한 줄을 저장한 뒤 다시 읽어 봅니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「한 줄을 저장한 뒤 다시 읽어 봅니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「한 줄을 저장한 뒤 다시 읽어 봅니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x05","kind":"concept","title":"경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다","eyebrow":"초보 확장 · 개념","paragraphs":["파일 이름만 적으면 현재 작업 폴더를 기준으로 찾습니다.","encoding=\"utf-8\"은 한글 같은 문자를 어떤 규칙으로 읽고 쓸지 알려 줍니다.","파일을 못 찾으면 문법보다 먼저 실행 위치와 파일 위치가 같은지 확인하세요."],"extras":[],"code":"filename = \"data/memo.txt\"\n\nwith open(filename, \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 위치는 filename 경로가 결정하고, utf-8은 한글을 읽는 문자 인코딩을 지정합니다.","codeExplain":["1행 「filename = \"data/memo.txt\"」 — 「경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다」에서 오른쪽 \"data/memo.txt\"을 먼저 계산하고 그 결과를 filename에 저장합니다.","3행 「with open(filename, \"r\", encoding=\"utf-8\") as f:」 — 「경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「text = f.read()」 — 「경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","6행 「print(text)」 — 「경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x06","kind":"example","title":"append로 간단한 기록을 계속 쌓습니다","eyebrow":"초보 확장 · 예제","paragraphs":["a 모드를 쓰면 기존 파일 뒤에 내용을 추가할 수 있습니다.","\\n은 줄바꿈 문자입니다.","로그나 누적 메모처럼 기존 기록을 남기면서 새 내용을 붙일 때 유용합니다."],"code":"with open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"새 기록\\\\n\")","codeNote":"a 모드는 기존 내용을 보존하면서 파일 끝에 새 줄을 추가합니다.","extras":[],"codeExplain":["1행 「with open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:」 — 「append로 간단한 기록을 계속 쌓습니다」에서 파일을 추가 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 기록\\\\n\")」 — 「append로 간단한 기록을 계속 쌓습니다」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x07","kind":"practice","title":"장보기 목록을 파일에 한 줄씩 저장해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["items = [\"우유\", \"달걀\", \"빵\"]이 있습니다.","for로 하나씩 꺼내 f.write(item + \"\\n\")으로 저장할 수 있습니다.","파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다."],"practicePrompt":"with open(..., \"w\")와 for를 사용해 shopping.txt에 세 항목을 한 줄씩 저장하세요.","answerOnNext":true,"extras":[],"code":"items = [\"우유\", \"달걀\", \"빵\"]\n\nwith open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:\n    for item in items:\n        f.write(____)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「items = [\"우유\", \"달걀\", \"빵\"]」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요」에서 여러 값을 리스트로 묶어 items에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「with open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for item in items:」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요」에서는 items에서 값을 하나씩 꺼내 item에 넣습니다. 다음 반복에서는 item가 다음 값으로 바뀝니다.","5행 「f.write(____)」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다."]},{"id":"t2-c6-x08","kind":"solution","title":"장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["w 모드로 shopping.txt를 엽니다.","for로 item을 하나씩 꺼냅니다.","item + \"\\n\"을 쓰면 각 항목 뒤에 줄바꿈이 붙습니다."],"code":"items = [\"우유\", \"달걀\", \"빵\"]\nwith open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:\n    for item in items:\n        f.write(item + \"\\n\")","codeNote":"shopping.txt 내용\n우유\n달걀\n빵","extras":[],"codeExplain":["1행 「items = [\"우유\", \"달걀\", \"빵\"]」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이」에서 여러 값을 리스트로 묶어 items에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「with open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","3행 「for item in items:」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이」에서는 items에서 값을 하나씩 꺼내 item에 넣습니다. 다음 반복에서는 item가 다음 값으로 바뀝니다.","4행 「f.write(item + \"\\n\")」 — 「장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x09","kind":"practice","title":"숫자 파일을 읽어 합계를 구해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["numbers.txt에 10, 20, 30이 각각 한 줄씩 있다고 가정합니다.","파일에서 읽은 줄은 문자열이므로 int로 바꾼 뒤 total에 더합니다.","파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다."],"practicePrompt":"파일을 한 줄씩 읽고 합계 60을 출력하세요.","answerOnNext":true,"extras":[],"code":"total = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = ____\n        total = ____\n\nprint(total)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「total = 0」 — 「숫자 파일을 읽어 합계를 구해 보세요」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「숫자 파일을 읽어 합계를 구해 보세요」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for line in f:」 — 「숫자 파일을 읽어 합계를 구해 보세요」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","5행 「number = ____」 — 「숫자 파일을 읽어 합계를 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","6행 「total = ____」 — 「숫자 파일을 읽어 합계를 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","8행 「print(total)」 — 「숫자 파일을 읽어 합계를 구해 보세요」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x10","kind":"solution","title":"숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["파일 객체는 for로 한 줄씩 읽을 수 있습니다.","line.strip()으로 줄바꿈을 없애고 int로 숫자로 바꿉니다.","total에 하나씩 더하면 60이 됩니다."],"code":"total = 0\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = int(line.strip())\n        total += number\nprint(total)","codeNote":"예상 출력: 60","extras":[],"codeExplain":["1행 「total = 0」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","2행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","3행 「for line in f:」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","4행 「number = int(line.strip())」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","5행 「total += number」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total의 기존 값에 number을 더해 다시 total에 저장합니다.","6행 「print(total)」 — 「숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x11","kind":"check","title":"파일이 없을 때와 w 모드일 때를 구분해 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["r 모드로 없는 파일을 열면 FileNotFoundError가 납니다.","w 모드는 파일이 없으면 새로 만들지만, 같은 이름의 기존 파일이 있으면 덮어쓸 수 있습니다.","파일 작업에서는 모드를 확인하는 습관이 매우 중요합니다."],"question":"중요한 diary.txt가 이미 있는데 \"w\" 모드로 열고 새 글을 쓰면 기존 내용은 어떻게 될까요?","answerOnNext":true,"extras":[],"code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「파일이 없을 때와 w 모드일 때를 구분해 보세요」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 「파일이 없을 때와 w 모드일 때를 구분해 보세요」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x12","kind":"solution","title":"파일이 없을 때와 w 모드일 때를 구분해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["w 모드는 파일 내용을 새로 쓰는 모드입니다.","기존 diary.txt 내용은 지워지고 새 내용으로 바뀔 수 있습니다.","기존 내용 뒤에 추가하려면 a 모드를 사용합니다.","한 줄씩 읽으면 각 line에는 줄바꿈이 붙어 있을 수 있습니다. strip으로 정리하고 숫자라면 int로 변환한 뒤 계산에 사용합니다."],"code":"with open(\"diary.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"새 기록\\n\")","codeNote":"a 모드는 기존 내용 뒤에 추가합니다.","extras":[],"codeExplain":["1행 「with open(\"diary.txt\", \"a\", encoding=\"utf-8\") as f:」 — 「파일이 없을 때와 w 모드일 때를 구분해 보세요 · 아주 쉬운 풀이」에서 파일을 추가 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「f.write(\"새 기록\\n\")」 — 「파일이 없을 때와 w 모드일 때를 구분해 보세요 · 아주 쉬운 풀이」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다."]},{"id":"t2-c6-x13","kind":"concept","title":"쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다","eyebrow":"초보 확장 · 개념","paragraphs":["\"민수,80\"처럼 한 줄에 이름과 점수를 쉼표로 구분해 저장할 수 있습니다.","line.strip().split(\",\")으로 나누면 [\"민수\", \"80\"]처럼 됩니다.","실제 업무에서는 csv 모듈이 더 안전하지만 초보 단계에서는 “한 줄 → 나누기 → 타입 변환” 흐름을 먼저 이해하세요."],"extras":[],"code":"line = \"민수,80\"\nparts = line.split(\",\")\nname = parts[0]\nscore = int(parts[1])\nprint(name, score)","codeNote":"한 줄을 쉼표로 나누고 두 번째 조각만 숫자로 변환합니다.","codeExplain":["1행 「line = \"민수,80\"」 — 「쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다」에서 오른쪽 \"민수,80\"을 먼저 계산하고 그 결과를 line에 저장합니다.","2행 「parts = line.split(\",\")」 — 「쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","3행 「name = parts[0]」 — 「쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다」에서 오른쪽 parts[0]을 먼저 계산하고 그 결과를 name에 저장합니다.","4행 「score = int(parts[1])」 — 「쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다」에서 오른쪽 int(parts[1])을 먼저 계산하고 그 결과를 score에 저장합니다.","5행 「print(name, score)」 — 「쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다」에서 name, score의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c6-x14","kind":"example","title":"이름과 점수가 적힌 파일을 읽어 평균을 구합니다","eyebrow":"초보 확장 · 예제","paragraphs":["각 줄을 쉼표로 나누면 parts라는 리스트가 됩니다.","parts[0]은 이름이고 parts[1]은 점수 글자입니다. 점수 글자는 int로 숫자로 바꿉니다.","점수를 total에 더하고 count를 늘린 뒤 평균을 계산합니다. 한 줄씩 값이 어떻게 변하는지 따라가 보세요."],"code":"total = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total += int(line.strip())\n\nprint(total)","codeNote":"한 줄씩 읽은 문자열을 정수로 바꿔 total에 누적합니다.","extras":[],"codeExplain":["1행 「total = 0」 — 「이름과 점수가 적힌 파일을 읽어 평균을 구합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「이름과 점수가 적힌 파일을 읽어 평균을 구합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for line in f:」 — 「이름과 점수가 적힌 파일을 읽어 평균을 구합니다」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","5행 「total += int(line.strip())」 — 「이름과 점수가 적힌 파일을 읽어 평균을 구합니다」에서 total의 기존 값에 int(line.strip())을 더해 다시 total에 저장합니다.","7행 「print(total)」 — 「이름과 점수가 적힌 파일을 읽어 평균을 구합니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 6 정리","title":"지금 알아야 할 것","paragraphs":["파일 읽기와 쓰기 챕터의 목표는 문법을 외우는 것이 아니라 “with open을 이용해 텍스트 파일을 안전하게 읽고 쓰며, 경로·인코딩·줄 단위 처리의 기본을 익힌다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 예외 처리로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["with open을 이용해 텍스트 파일을 안전하게 읽고 쓰며, 경로·인코딩·줄 단위 처리의 기본을 익힌다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c6-p13","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「지금 알아야 할 것」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","2행 「text = f.read()」 — 「지금 알아야 할 것」에서 read가 열린 파일 내용을 문자열로 읽어 옵니다.","4행 「print(text)」 — 「지금 알아야 할 것」에서 text의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"텍스트 파일을 읽고 필요한 정보를 찾아 처리하는 문제 중심 흐름 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"기존 파일을 읽고 변환한 뒤 결과를 다시 저장하는 자동화 워크플로 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"실제 데이터 파일을 입력으로 받아 분석 가능한 결과로 만드는 완성형 작업 흐름 참고"}]}],"track":2,"id":"t2-c6","remember":"r 읽기, w 비우고 쓰기, a 추가","practiceGoal":"실습 파일 준비·합산","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"텍스트 파일을 읽고 필요한 정보를 찾아 처리하는 문제 중심 흐름 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"기존 파일을 읽고 변환한 뒤 결과를 다시 저장하는 자동화 워크플로 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"실제 데이터 파일을 입력으로 받아 분석 가능한 결과로 만드는 완성형 작업 흐름 참고"}]},{"chapter":7,"title":"예외 처리","pages":[{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"exception 예외","description":"프로그램 실행 중 정상 흐름을 계속하기 어려운 문제가 발생했음을 나타내는 객체입니다. ValueError, FileNotFoundError 등 종류가 원인을 설명합니다.","usage":"실행 중 실패 상황을 구분하고 처리할 때 사용합니다.","example":"예: int(\"abc\")는 ValueError를 발생시킵니다."},{"term":"try","description":"예외가 발생할 수 있는 코드를 넣는 블록입니다. try 안에서 예외가 발생하면 이후 줄을 건너뛰고 맞는 except를 찾습니다.","usage":"실패 가능성이 있는 최소 범위를 감쌀 때 씁니다.","example":"예: 사용자 입력을 int로 변환하는 줄을 try에 둘 수 있습니다."},{"term":"except","description":"특정 예외가 발생했을 때 대신 실행할 처리 블록입니다. 가능한 한 어떤 예외를 처리하는지 구체적으로 적는 것이 좋습니다.","usage":"사용자에게 안내하거나 대체 흐름을 제공할 때 씁니다.","example":"예: except ValueError: 에서 숫자 입력 안내를 보여 줄 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c7-p1","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「먼저 알아두면 좋은 단어」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「먼저 알아두면 좋은 단어」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「먼저 알아두면 좋은 단어」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「먼저 알아두면 좋은 단어」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「먼저 알아두면 좋은 단어」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"finally","description":"예외 발생 여부와 관계없이 마지막에 실행되는 블록입니다. 자원 정리 같은 작업에 사용합니다.","usage":"반드시 실행해야 하는 마무리 작업에 씁니다.","example":"예: 연결 종료나 임시 상태 정리에 사용할 수 있습니다."},{"term":"raise","description":"코드가 특정 문제를 발견했을 때 직접 예외를 발생시키는 문법입니다.","usage":"잘못된 상태를 조용히 계속 진행하지 않고 명확하게 실패시키고 싶을 때 씁니다.","example":"예: 음수 가격이 허용되지 않으면 raise ValueError(...)를 사용할 수 있습니다."},{"term":"fallback 대체 처리","description":"주 작업이 실패했을 때 사용할 안전한 대체 결과나 흐름입니다. 모든 오류에 무조건 대체값을 주는 것이 아니라 의미가 있을 때 사용합니다.","usage":"파일이 없으면 빈 목록으로 시작하는 등 복구 가능한 상황에서 씁니다.","example":"예: 설정 파일이 없으면 기본 설정으로 시작할 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c7-p2","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「코드에서 자주 만나는 표현」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「코드에서 자주 만나는 표현」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「코드에서 자주 만나는 표현」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「코드에서 자주 만나는 표현」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「코드에서 자주 만나는 표현」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 1/6","title":"예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다","paragraphs":["try/except를 쓴다고 잘못된 입력이나 파일 누락이 사라지는 것은 아닙니다. 프로그램이 예상 가능한 실패를 만나도 어떤 행동을 할지 미리 정하는 것입니다.","오류 원인을 무조건 숨기기보다 사용자에게 이해 가능한 안내를 제공하고, 개발 중에는 어떤 예외가 발생했는지 기록하는 것이 중요합니다.","안정적인 앱은 실패가 전혀 없는 앱이 아니라 실패했을 때 상태가 예측 가능한 앱에 가깝습니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p3","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 2/6","title":"try 범위는 가능한 한 작게 잡습니다","paragraphs":["큰 코드 블록 전체를 try로 감싸면 어느 줄에서 어떤 문제가 났는지 모호해집니다. 실제로 실패 가능성이 있는 변환, 파일 열기, 네트워크 호출 같은 부분만 감싸세요.","except도 Exception 전체를 무조건 잡기보다 ValueError처럼 예상한 예외를 구체적으로 처리하는 편이 좋습니다.","예상하지 못한 오류까지 조용히 삼키면 버그가 숨어 실제 문제를 찾기 어려워집니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p4","code":"text = \"1200\"\n\ntry:\n    amount = int(text)\nexcept ValueError:\n    amount = 0\n\nprint(amount)","codeNote":"실패 가능성이 있는 int(text)만 try 안에 두어 오류가 나는 위치가 분명합니다.","codeExplain":["1행 「text = \"1200\"」 — 「try 범위는 가능한 한 작게 잡습니다」에서 오른쪽 \"1200\"을 먼저 계산하고 그 결과를 text에 저장합니다.","3행 「try:」 — 「try 범위는 가능한 한 작게 잡습니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","4행 「amount = int(text)」 — 「try 범위는 가능한 한 작게 잡습니다」에서 오른쪽 int(text)을 먼저 계산하고 그 결과를 amount에 저장합니다.","5행 「except ValueError:」 — 「try 범위는 가능한 한 작게 잡습니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","6행 「amount = 0」 — 「try 범위는 가능한 한 작게 잡습니다」에서 amount을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","8행 「print(amount)」 — 「try 범위는 가능한 한 작게 잡습니다」에서 amount의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 3/6","title":"예외 종류는 문제의 범주를 알려 주는 신호입니다","paragraphs":["ValueError는 값의 내용이 기대 형식과 맞지 않을 때, FileNotFoundError는 파일 경로 문제일 때처럼 예외 이름 자체가 조사 방향을 좁혀 줍니다.","except ValueError와 except FileNotFoundError를 나누면 사용자 안내도 상황에 맞게 바꿀 수 있습니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p5","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 종류는 문제의 범주를 알려 주는 신호입니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 종류는 문제의 범주를 알려 주는 신호입니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 종류는 문제의 범주를 알려 주는 신호입니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 종류는 문제의 범주를 알려 주는 신호입니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 종류는 문제의 범주를 알려 주는 신호입니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 4/6","title":"재시도는 종료 조건과 함께 설계합니다","paragraphs":["입력이 잘못됐다고 무한히 다시 묻는 것보다 최대 시도 횟수나 취소 방법을 정하는 편이 안전합니다. while과 예외 처리를 함께 쓸 때 종료 조건이 특히 중요합니다.","재시도할 가치가 있는 오류와 즉시 중단해야 하는 오류를 구분해야 합니다.","실제 네트워크 프로그램에서도 일시적 실패는 재시도할 수 있지만 잘못된 인증 정보처럼 반복해도 해결되지 않는 문제는 다른 처리가 필요합니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p6","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「재시도는 종료 조건과 함께 설계합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「재시도는 종료 조건과 함께 설계합니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「재시도는 종료 조건과 함께 설계합니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「재시도는 종료 조건과 함께 설계합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「재시도는 종료 조건과 함께 설계합니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 5/6","title":"fallback은 데이터 의미를 망치지 않아야 합니다","paragraphs":["오류가 났을 때 무조건 0이나 빈 문자열을 넣으면 프로그램은 계속 실행되지만 잘못된 결과를 만들 수 있습니다. 대체값이 실제 의미상 안전한 경우에만 사용하세요.","복구할 수 없는 문제라면 명확하게 실패시키고 사용자에게 이유를 알려 주는 편이 더 정확할 수 있습니다.","“계속 실행되는 것”보다 “잘못된 결과를 만들지 않는 것”이 더 중요한 경우가 많습니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p7","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「fallback은 데이터 의미를 망치지 않아야 합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「fallback은 데이터 의미를 망치지 않아야 합니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「fallback은 데이터 의미를 망치지 않아야 합니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「fallback은 데이터 의미를 망치지 않아야 합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「fallback은 데이터 의미를 망치지 않아야 합니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 6/6","title":"예외 처리 후에도 정상 흐름을 검증합니다","paragraphs":["except가 잘 작동하는지만 확인하지 말고 정상 입력도 이전처럼 처리되는지 다시 테스트해야 합니다.","정상값, 경계값, 잘못된 값 세 종류를 넣어 보면 예외 처리 추가가 기존 동작을 망가뜨리지 않았는지 확인할 수 있습니다.","이 방식은 이후 테스트와 안정성 설계의 기본 패턴으로 이어집니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p8","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리 후에도 정상 흐름을 검증합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리 후에도 정상 흐름을 검증합니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리 후에도 정상 흐름을 검증합니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리 후에도 정상 흐름을 검증합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리 후에도 정상 흐름을 검증합니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"예외 처리의 전체 흐름","paragraphs":["예외 처리에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"ERROR_MAP","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c7-p9","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리의 전체 흐름」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리의 전체 흐름」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리의 전체 흐름」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리의 전체 흐름」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리의 전체 흐름」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"예외 처리를 하나의 코드로 연결합니다","paragraphs":[],"code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","extras":[],"visibleExtras":2,"id":"t2-c7-p10","codeExplain":["1행 「try:」 — 「예외 처리를 하나의 코드로 연결합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리를 하나의 코드로 연결합니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리를 하나의 코드로 연결합니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리를 하나의 코드로 연결합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리를 하나의 코드로 연결합니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"예외 처리를 직접 바꾸고 확장합니다","paragraphs":["try 안에는 실제로 실패할 수 있는 줄을 넣습니다. 숫자 변환이면 ValueError, 0으로 나누면 ZeroDivisionError처럼 실패 원인마다 오류 이름이 다릅니다.","정상 입력일 때는 try가 끝까지 실행되고 except는 건너뜁니다. 잘못된 입력일 때는 오류가 난 순간 try의 나머지를 건너뛰고 맞는 except로 이동합니다.","예외 처리 코드를 완성하면 정상 값과 일부러 틀린 값을 모두 넣어 보세요. 두 경우가 각각 어떤 길로 움직이는지 확인해야 제대로 이해한 것입니다."],"code":"attempts = 0\n\nwhile attempts \u003c 3:\n    raw = input(\"금액: \")\n    try:\n        amount = ____\n        print(\"입력 금액:\", amount)\n        break\n    except ____:\n        print(\"숫자로 입력해 주세요.\")\n        attempts += 1","practicePrompt":"금액을 입력받아 int로 변환하는 프로그램을 만들고, 숫자가 아니면 최대 3번까지 다시 입력받도록 while과 try/except를 함께 사용해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c7-p11","answerOnNext":true,"codeExplain":["1행 「attempts = 0」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 attempts을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「while attempts \u003c 3:」 — 「예외 처리를 직접 바꾸고 확장합니다」에서는 attempts \u003c 3이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「raw = input(\"금액: \")」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 오른쪽 input(\"금액: \")을 먼저 계산하고 그 결과를 raw에 저장합니다.","5행 「try:」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","6행 「amount = ____」 — 「예외 처리를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","7행 「print(\"입력 금액:\", amount)」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 \"입력 금액:\", amount의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「break」 — 「예외 처리를 직접 바꾸고 확장합니다」의 반복을 이 지점에서 즉시 끝냅니다. 남은 반복 값은 처리하지 않습니다.","9행 「except ____:」 — 「예외 처리를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","10행 「print(\"숫자로 입력해 주세요.\")」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 \"숫자로 입력해 주세요.\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","11행 「attempts += 1」 — 「예외 처리를 직접 바꾸고 확장합니다」에서 attempts의 기존 값에 1을 더해 다시 attempts에 저장합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c7-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예외 처리를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["이 풀이의 최대 3번은 최초 입력을 포함한 총 세 번입니다. 횟수 규칙부터 명확히 정합니다.","변환이 실패하면 except로 가고 continue가 다음 입력으로 돌아가게 합니다.","정상 숫자는 출력한 뒤 break로 반복을 끝냅니다. 세 번 다 실패하면 마지막 안내가 출력됩니다."],"code":"attempts = 0\nsuccess = False\nwhile attempts \u003c 3:\n    attempts = attempts + 1\n    raw = input(\"금액: \")\n    try:\n        amount = int(raw)\n    except ValueError:\n        print(\"숫자로 입력해 주세요.\")\n        continue\n    print(f\"입력 금액: {amount}\")\n    success = True\n    break\nif not success:\n    print(\"3회 실패하여 종료합니다.\")","codeNote":"실행 결과 또는 테스트 기준\n입력 사과, 12000 →\n숫자로 입력해 주세요.\n입력 금액: 12000","extras":[],"codeExplain":["1행 「attempts = 0」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 attempts을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","2행 「success = False」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 success에 불리언 False를 저장해 뒤 조건식의 판단값으로 사용합니다.","3행 「while attempts \u003c 3:」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서는 attempts \u003c 3이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「attempts = attempts + 1」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 attempts + 1을 먼저 계산하고 그 결과를 attempts에 저장합니다.","5행 「raw = input(\"금액: \")」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 input(\"금액: \")을 먼저 계산하고 그 결과를 raw에 저장합니다.","6행 「try:」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","7행 「amount = int(raw)」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 int(raw)을 먼저 계산하고 그 결과를 amount에 저장합니다.","8행 「except ValueError:」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","9행 「print(\"숫자로 입력해 주세요.\")」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 \"숫자로 입력해 주세요.\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","10행 「continue」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","11행 「print(f\"입력 금액: {amount}\")」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 f\"입력 금액: {amount}\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","12행 「success = True」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 success에 불리언 True를 저장해 뒤 조건식의 판단값으로 사용합니다.","13행 「break」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」의 반복을 이 지점에서 즉시 끝냅니다. 남은 반복 값은 처리하지 않습니다.","14행 「if not success:」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 not success을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","15행 「print(\"3회 실패하여 종료합니다.\")」 — 「예외 처리를 직접 바꾸고 확장합니다 · 풀이」에서 \"3회 실패하여 종료합니다.\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"예외 처리 핵심을 확인합니다","paragraphs":[],"question":"except Exception: 하나로 모든 오류를 잡고 아무 메시지도 남기지 않는 방식이 디버깅을 어렵게 만드는 이유는 무엇일까요?","extras":[],"visibleExtras":3,"id":"t2-c7-p12","answerOnNext":true,"code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리 핵심을 확인합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리 핵심을 확인합니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리 핵심을 확인합니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리 핵심을 확인합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리 핵심을 확인합니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예외 처리 핵심을 확인합니다 · 풀이","paragraphs":["어떤 종류의 오류가 어디서 발생했는지 정보가 사라지고 예상하지 못한 버그까지 정상 처리처럼 숨겨질 수 있기 때문입니다. 가능한 한 예상한 예외를 구체적으로 처리하고 필요한 정보는 남겨야 합니다."],"extras":[],"code":"try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"0으로 나눌 수 없습니다\")","codeNote":"0으로 나누면 ZeroDivisionError가 생기고 안내 문장이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리 핵심을 확인합니다 · 풀이」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「print(10 / 0)」 — 「예외 처리 핵심을 확인합니다 · 풀이」에서 10 / 0의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「except ZeroDivisionError:」 — 「예외 처리 핵심을 확인합니다 · 풀이」에서 try 안에 ZeroDivisionError가 발생했을 때만 이 블록으로 이동합니다.","4행 「print(\"0으로 나눌 수 없습니다\")」 — 「예외 처리 핵심을 확인합니다 · 풀이」에서 \"0으로 나눌 수 없습니다\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x01","kind":"concept","title":"예외 처리는 프로그램의 안전벨트입니다","eyebrow":"초보 확장 · 개념","paragraphs":["사용자는 숫자를 입력하라고 해도 글자를 넣을 수 있고, 파일은 사라질 수 있고, 0으로 나누는 일도 생깁니다.","예외 처리는 오류가 절대 생기지 않게 만드는 마법이 아니라 오류가 생겼을 때 어떻게 대응할지 정하는 방법입니다.","try에는 실패할 수 있는 코드를 넣고 except에는 특정 오류가 생겼을 때 할 일을 넣습니다."],"keywords":["try","except","exception","예외"],"extras":[],"code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「예외 처리는 프로그램의 안전벨트입니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「예외 처리는 프로그램의 안전벨트입니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「예외 처리는 프로그램의 안전벨트입니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「예외 처리는 프로그램의 안전벨트입니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「예외 처리는 프로그램의 안전벨트입니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x02","kind":"example","title":"글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다","eyebrow":"초보 확장 · 예제","paragraphs":["int(\"123\")은 성공하지만 int(\"abc\")는 숫자로 바꿀 수 없어 ValueError가 납니다.","try 안에서 변환을 시도하고 ValueError가 생기면 except로 이동합니다.","사용자에게 “숫자를 입력하세요”라고 안내할 수 있습니다."],"code":"try:\n    number = int(\"abc\")\nexcept ValueError:\n    print(\"숫자로 바꿀 수 없습니다\")","codeNote":"int(\"abc\")에서 ValueError가 발생해 except 블록이 실행됩니다.","extras":[],"codeExplain":["1행 「try:」 — 「글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「number = int(\"abc\")」 — 「글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다」에서 오른쪽 int(\"abc\")을 먼저 계산하고 그 결과를 number에 저장합니다.","3행 「except ValueError:」 — 「글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","4행 「print(\"숫자로 바꿀 수 없습니다\")」 — 「글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다」에서 \"숫자로 바꿀 수 없습니다\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x03","kind":"concept","title":"오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다","eyebrow":"초보 확장 · 개념","paragraphs":["ValueError와 ZeroDivisionError는 원인이 다릅니다.","오류 종류별로 except를 나누면 더 정확한 안내를 줄 수 있습니다.","except Exception처럼 모든 오류를 한꺼번에 잡으면 진짜 버그까지 숨길 수 있습니다."],"extras":[],"code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x04","kind":"example","title":"간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다","eyebrow":"초보 확장 · 예제","paragraphs":["문자열을 int로 바꾸는 과정에서는 ValueError가 날 수 있습니다.","b가 0이면 나눗셈에서 ZeroDivisionError가 납니다.","두 오류를 따로 처리하면 원인이 분명합니다."],"code":"try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"0으로 나눌 수 없습니다\")","codeNote":"10 / 0에서 ZeroDivisionError가 발생하고 해당 except가 처리합니다.","extras":[],"codeExplain":["1행 「try:」 — 「간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「print(10 / 0)」 — 「간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다」에서 10 / 0의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「except ZeroDivisionError:」 — 「간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다」에서 try 안에 ZeroDivisionError가 발생했을 때만 이 블록으로 이동합니다.","4행 「print(\"0으로 나눌 수 없습니다\")」 — 「간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다」에서 \"0으로 나눌 수 없습니다\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x05","kind":"concept","title":"else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다","eyebrow":"초보 확장 · 개념","paragraphs":["try가 오류 없이 끝났을 때만 실행하고 싶은 코드는 else에 둘 수 있습니다.","finally는 성공하든 실패하든 마지막에 실행됩니다.","처음에는 try/except가 우선이고, else는 성공 전용, finally는 무조건 마지막이라고 기억하세요."],"extras":[],"code":"try:\n    number = int(\"20\")\nexcept ValueError:\n    print(\"변환 실패\")\nelse:\n    print(\"변환 성공:\", number)\nfinally:\n    print(\"처리 끝\")","codeNote":"오류가 없어 else가 실행되고, finally는 성공 여부와 관계없이 마지막에 실행됩니다.","codeExplain":["1행 「try:」 — 「else와
