True입니다. 20은 18 이상이기 때문입니다.","has_ticket은 False입니다. and는 양쪽이 모두 True여야 True입니다.","따라서 True and False는 False입니다."],"code":"age = 20\nhas_ticket = False\nprint(age >= 18 and has_ticket)","codeNote":"예상 출력: False","extras":[],"codeExplain":["1행 「age = 20」 — 「and · or · not을 말로 읽어 보세요 · 아주 쉬운 풀이」에서 오른쪽 20을 먼저 계산하고 그 결과를 age에 저장합니다.","2행 「has_ticket = False」 — 「and · or · not을 말로 읽어 보세요 · 아주 쉬운 풀이」에서 has_ticket에 불리언 False를 저장해 뒤 조건식의 판단값으로 사용합니다.","3행 「print(age >= 18 and has_ticket)」 — 「and · or · not을 말로 읽어 보세요 · 아주 쉬운 풀이」에서 age >= 18 and has_ticket의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x13","kind":"concept","title":"조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요","eyebrow":"초보 확장 · 개념","paragraphs":["if 안에 또 if를 넣을 수 있지만 들여쓰기가 깊어지면 초보자는 흐름을 놓치기 쉽습니다.","두 조건을 동시에 만족하면 되는 단순한 상황은 and가 더 읽기 쉬울 수 있습니다.","조건별로 서로 다른 실패 이유를 보여 줘야 하면 if/elif가 더 자연스럽습니다."],"extras":[],"code":"is_logged_in = True\nis_admin = False\n\nif is_logged_in and is_admin:\n    print(\"관리자 화면\")\nelse:\n    print(\"일반 화면\")","codeNote":"두 조건을 한 번에 읽을 수 있어서 if 안에 또 if를 넣는 것보다 흐름이 단순합니다.","codeExplain":["1행 「is_logged_in = True」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 is_logged_in에 불리언 True를 저장해 뒤 조건식의 판단값으로 사용합니다.","2행 「is_admin = False」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 is_admin에 불리언 False를 저장해 뒤 조건식의 판단값으로 사용합니다.","4행 「if is_logged_in and is_admin:」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 is_logged_in and is_admin을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","5행 「print(\"관리자 화면\")」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 \"관리자 화면\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","6행 「else:」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","7행 「print(\"일반 화면\")」 — 「조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요」에서 \"일반 화면\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x14","kind":"example","title":"구매 가능 여부를 조건 세 개로 확인합니다","eyebrow":"초보 확장 · 예제","paragraphs":["상품을 사려면 재고가 있고 돈도 충분해야 합니다.","품절인지 먼저 확인하고, 그다음 돈이 부족한지 확인하면 실패 이유가 분명합니다.","성공이 확정된 else에서만 재고를 줄이는 것이 중요합니다."],"code":"stock = 2\ncash = 5000\nprice = 3000\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    stock -= 1\n    print(\"구매 성공\", stock)","codeNote":"재고가 있고 돈도 충분하므로 else가 실행됩니다. 구매 뒤 stock은 1이 됩니다.","extras":[],"codeExplain":["1행 「stock = 2」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 오른쪽 2을 먼저 계산하고 그 결과를 stock에 저장합니다.","2행 「cash = 5000」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 오른쪽 5000을 먼저 계산하고 그 결과를 cash에 저장합니다.","3행 「price = 3000」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 오른쪽 3000을 먼저 계산하고 그 결과를 price에 저장합니다.","5행 「if stock == 0:」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 stock == 0을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","6행 「print(\"품절\")」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 \"품절\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「elif cash \u003c price:」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 앞 조건이 False였을 때만 cash \u003c price을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","8행 「print(\"금액 부족\")」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 \"금액 부족\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「else:」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","10행 「stock -= 1」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 stock의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","11행 「print(\"구매 성공\", stock)」 — 「구매 가능 여부를 조건 세 개로 확인합니다」에서 \"구매 성공\", stock의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 1 정리","title":"지금 알아야 할 것","paragraphs":["조건문 if 챕터의 목표는 문법을 외우는 것이 아니라 “조건에 따라 실행 경로를 나누고, 비교식과 논리 연산자를 이용해 실제 규칙을 코드로 표현한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","이 챕터의 예제와 실습을 다시 보면서 각 줄이 어떤 값을 만들고, 어떤 조건에서 실행되며, 결과가 어디로 전달되는지 설명할 수 있으면 다음 단계로 넘어갈 준비가 된 것입니다.","다음 챕터에서는 반복문 for·while로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요.","복습할 때는 처음부터 모든 페이지를 다시 읽기보다, 확인 문제에서 막힌 개념과 실습에서 오류가 났던 부분을 우선적으로 다시 보는 편이 효율적입니다."],"bullets":["조건에 따라 실행 경로를 나누고, 비교식과 논리 연산자를 이용해 실제 규칙을 코드로 표현한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c1-p13","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「지금 알아야 할 것」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「지금 알아야 할 것」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「지금 알아야 할 것」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「지금 알아야 할 것」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「지금 알아야 할 것」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문제를 먼저 세우고 if가 실행 흐름을 어떻게 바꾸는지 작동 코드로 확인하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"conditional logic과 if 실행 흐름, 초보자가 값과 타입을 직접 출력해 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"새 문법을 독립적으로 외우지 않고 즉시 쓸 수 있는 문제 안에서 소개하는 방식 참고"}]}],"track":2,"id":"t2-c1","remember":"콜론·들여쓰기, =와 == 구분","practiceGoal":"등급 조건과 경계값 수정","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문제를 먼저 세우고 if가 실행 흐름을 어떻게 바꾸는지 작동 코드로 확인하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"conditional logic과 if 실행 흐름, 초보자가 값과 타입을 직접 출력해 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"새 문법을 독립적으로 외우지 않고 즉시 쓸 수 있는 문제 안에서 소개하는 방식 참고"}]},{"chapter":2,"title":"반복문 for·while","pages":[{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"loop 반복문","description":"같은 종류의 작업을 여러 번 실행하도록 만드는 제어 구조입니다. 데이터 개수만큼 처리하거나 조건이 만족될 때까지 작업을 반복할 수 있습니다.","usage":"목록의 모든 항목 처리, 여러 번 재시도, 누적 계산 등에 사용합니다.","example":"예: for name in names: 는 names의 각 값을 차례대로 처리합니다."},{"term":"for","description":"리스트나 range처럼 여러 값을 차례대로 꺼내며 반복할 때 주로 쓰는 반복문입니다. 반복 횟수나 대상이 비교적 명확할 때 적합합니다.","usage":"목록 전체 순회, 정해진 횟수 반복에 사용합니다.","example":"예: for i in range(3): 는 0, 1, 2 세 번 반복합니다."},{"term":"while","description":"조건이 True인 동안 계속 반복하는 반복문입니다. 몇 번 반복할지보다 언제 멈출지가 중요할 때 사용합니다.","usage":"사용자 입력 재요청, 상태가 바뀔 때까지 반복 등에 씁니다.","example":"예: while attempts \u003c 3: 은 attempts가 3 미만인 동안 반복합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c2-p1","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「먼저 알아두면 좋은 단어」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「먼저 알아두면 좋은 단어」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「먼저 알아두면 좋은 단어」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"iteration 반복 1회","description":"반복문이 한 바퀴 실행되는 한 번의 단위를 말합니다. 각 iteration마다 반복 변수와 내부 상태가 달라질 수 있습니다.","usage":"반복 과정을 한 단계씩 추적할 때 사용합니다.","example":"예: 세 번 반복하면 iteration이 3회 발생합니다."},{"term":"range 범위","description":"정수 흐름을 만들어 for와 함께 자주 쓰는 도구입니다. 시작, 끝, 간격을 지정할 수 있고 끝 값은 포함하지 않습니다.","usage":"정해진 횟수나 인덱스 범위를 만들 때 씁니다.","example":"예: range(1, 4)는 1, 2, 3을 만듭니다."},{"term":"break / continue","description":"break는 반복문을 즉시 끝내고, continue는 현재 iteration의 나머지를 건너뛰고 다음 반복으로 넘어갑니다.","usage":"특정 조건에서 조기 종료하거나 일부 항목만 건너뛸 때 씁니다.","example":"예: 값이 음수면 continue로 해당 항목만 건너뛸 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c2-p2","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「코드에서 자주 만나는 표현」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「코드에서 자주 만나는 표현」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「코드에서 자주 만나는 표현」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 1/6","title":"for는 “각 항목에 같은 규칙 적용”에 강합니다","paragraphs":["for를 읽을 때는 “어떤 묶음에서 값을 하나씩 꺼내고, 각 값에 어떤 작업을 하는가”를 먼저 봅니다. 반복 변수 이름은 현재 항목의 의미가 드러나게 정하는 것이 좋습니다.","for i in range(...)처럼 무조건 i를 쓰기보다 for price in prices처럼 실제 의미를 드러내면 코드가 훨씬 빨리 읽힙니다.","앱에서 검색 결과 목록을 그리거나 파일 목록을 처리하거나 여러 종목 데이터를 계산할 때도 같은 순회 구조를 사용합니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p3","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「for는 “각 항목에 같은 규칙 적용”에 강합니다」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「for는 “각 항목에 같은 규칙 적용”에 강합니다」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「for는 “각 항목에 같은 규칙 적용”에 강합니다」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 2/6","title":"range의 끝 값은 포함되지 않습니다","paragraphs":["range(5)는 0부터 4까지 다섯 개의 값을 만듭니다. range(1, 5)는 1부터 4까지입니다. 끝 값을 포함하지 않는 규칙을 기억하면 반복 횟수 계산 실수가 줄어듭니다.","시작·끝·간격을 직접 적고 실제로 list(range(...))를 출력해 값이 어떻게 만들어지는지 확인하면 빠르게 익숙해집니다.","0부터 시작하는 인덱스와 함께 쓰일 때 이 규칙이 자연스럽지만, 사람 기준 번호를 출력할 때는 +1이 필요한 경우가 있습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p4","code":"for number in range(1, 6):\n    print(number)","codeNote":"range(1, 6)은 1부터 시작해 6 직전인 5까지 만듭니다.","codeExplain":["1행 「for number in range(1, 6):」 — 「range의 끝 값은 포함되지 않습니다」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「print(number)」 — 「range의 끝 값은 포함되지 않습니다」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 3/6","title":"while은 종료 조건을 먼저 설계해야 합니다","paragraphs":["while은 조건이 계속 True이면 끝없이 반복될 수 있습니다. 그래서 코드를 쓰기 전에 어떤 값이 변하고 언제 조건이 False가 되는지 먼저 정해야 합니다.","반복 조건에 사용한 변수가 반복문 안에서 실제로 바뀌는지 확인하세요. 바뀌지 않으면 무한 반복이 될 가능성이 큽니다.","재시도 횟수, 사용자 종료 입력, 네트워크 상태처럼 “몇 번”보다 “언제까지”가 중요한 문제에 적합합니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p5","code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 「while은 종료 조건을 먼저 설계해야 합니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「while은 종료 조건을 먼저 설계해야 합니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「while은 종료 조건을 먼저 설계해야 합니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「while은 종료 조건을 먼저 설계해야 합니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「while은 종료 조건을 먼저 설계해야 합니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 4/6","title":"누적 변수는 반복 전 초기값이 중요합니다","paragraphs":["합계나 개수를 누적할 때 total = 0, count = 0 같은 초기값을 반복문 밖에 둡니다. 매 반복 안에서 다시 0으로 만들면 이전 결과가 사라집니다.","누적 코드를 읽을 때는 반복 시작 전 값과 각 iteration 뒤 값을 표로 적어 보면 정확하게 추적할 수 있습니다.","합계뿐 아니라 최댓값, 조건을 만족한 개수, 문자열 조합 등 다양한 상태를 반복 중에 누적할 수 있습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p6","code":"prices = [1200, 800, 2000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"total은 0→1200→2000→4000 순서로 바뀝니다.","codeExplain":["1행 「prices = [1200, 800, 2000]」 — 「누적 변수는 반복 전 초기값이 중요합니다」에서 여러 값을 리스트로 묶어 prices에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「누적 변수는 반복 전 초기값이 중요합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for price in prices:」 — 「누적 변수는 반복 전 초기값이 중요합니다」에서는 prices에서 값을 하나씩 꺼내 price에 넣습니다. 다음 반복에서는 price가 다음 값으로 바뀝니다.","5행 「total += price」 — 「누적 변수는 반복 전 초기값이 중요합니다」에서 total의 기존 값에 price을 더해 다시 total에 저장합니다.","7행 「print(total)」 — 「누적 변수는 반복 전 초기값이 중요합니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 5/6","title":"break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다","paragraphs":["break는 반복 전체를 끝내고 continue는 현재 반복만 건너뜁니다. 둘 다 유용하지만 많이 쓰면 흐름이 눈에 잘 안 보일 수 있습니다.","조건과 함께 한두 군데 명확하게 사용하고, 왜 조기 종료하거나 건너뛰는지 변수 이름이나 주석으로 의도를 남기는 편이 좋습니다.","검색에서 원하는 값을 찾자마자 break로 끝내거나, 잘못된 데이터만 continue로 제외하는 패턴이 대표적입니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p7","code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"3에서만 continue가 실행되어 3을 건너뛰고 1, 2, 4, 5가 출력됩니다.","codeExplain":["1행 「for number in range(1, 6):」 — 「break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「if number == 3:」 — 「break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다」에서 number == 3을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","3행 「continue」 — 「break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","4행 「print(number)」 — 「break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 6/6","title":"반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다","paragraphs":["10개·100개 데이터를 바로 보지 말고 2~3개짜리 작은 리스트로 각 iteration의 변수와 누적값을 추적하세요. 반복문은 실행 횟수가 많아 보여도 한 번의 규칙이 반복되는 구조입니다.","작은 입력에서 정확히 이해한 뒤 데이터 개수를 늘리면 복잡도가 크게 올라가지 않습니다.","반복문 디버깅에서는 반복 변수와 핵심 누적값을 임시로 print해서 몇 번째 iteration에서 예상과 달라지는지 확인하는 방법도 좋습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p8","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"반복문 for·while의 전체 흐름","paragraphs":["반복문 for·while에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"TOP_TO_BOTTOM","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c2-p9","code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 「반복문 for·while의 전체 흐름」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「반복문 for·while의 전체 흐름」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「반복문 for·while의 전체 흐름」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「반복문 for·while의 전체 흐름」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「반복문 for·while의 전체 흐름」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"반복문 for·while를 하나의 코드로 연결합니다","paragraphs":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"visibleExtras":2,"id":"t2-c2-p10","codeExplain":["1행 「count = 3」 — 「반복문 for·while를 하나의 코드로 연결합니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「반복문 for·while를 하나의 코드로 연결합니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「반복문 for·while를 하나의 코드로 연결합니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「반복문 for·while를 하나의 코드로 연결합니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「반복문 for·while를 하나의 코드로 연결합니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"반복문 for·while을 직접 바꾸고 확장합니다","paragraphs":["반복문 문제는 첫 반복에서 변수 값이 어떻게 바뀌는지 직접 적어 보면 거의 풀립니다. 두 번째 반복에서도 같은 규칙이 반복된다는 사실을 확인하세요.","합계와 개수는 이전 결과를 기억해야 하므로 total과 count 같은 변수를 반복문 밖에서 먼저 만들고 반복할 때마다 갱신합니다.","range를 사용할 때는 시작값, 끝값, 증가폭을 따로 보세요. 특히 끝값은 포함되지 않으므로 원하는 마지막 숫자보다 하나 크게 적는 경우가 많습니다."],"code":"prices = [9000, 10000, 15000, 3000, 20000]\ntotal = 0\ncount = 0\n\nfor price in prices:\n    if ____:\n        total = ____\n        count = ____\n\nprint(total)\nprint(count)","practicePrompt":"리스트에 금액 5개를 넣고 1만원 이상인 값만 합산하세요. 다음에는 처리한 항목 개수도 count 변수로 함께 세어 평균을 계산해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c2-p11","answerOnNext":true,"codeExplain":["1행 「prices = [9000, 10000, 15000, 3000, 20000]」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서 여러 값을 리스트로 묶어 prices에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「count = 0」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서 count을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","5행 「for price in prices:」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서는 prices에서 값을 하나씩 꺼내 price에 넣습니다. 다음 반복에서는 price가 다음 값으로 바뀝니다.","6행 「if ____:」 — 「반복문 for·while을 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","7행 「total = ____」 — 「반복문 for·while을 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","8행 「count = ____」 — 「반복문 for·while을 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","10행 「print(total)」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","11행 「print(count)」 — 「반복문 for·while을 직접 바꾸고 확장합니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c2-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복문 for·while을 직접 바꾸고 확장합니다 · 풀이","paragraphs":["[]는 여러 값을 순서대로 담는 리스트입니다. for price in prices는 값을 하나씩 price에 연결합니다. 리스트는 다음 자료구조 챕터에서 더 배웁니다.","이 풀이의 count는 조건을 만족해 합산한 항목의 개수입니다. 전체 다섯 항목 수와 구분해야 평균의 분모가 맞습니다.","합산한 금액은 10000, 15000, 20000입니다. 합계 45000을 선택된 3개로 나누면 15000.0입니다.","모든 금액을 10000 미만으로 바꾸면 count가 0입니다. 0으로 나누지 않도록 if count > 0을 먼저 검사합니다."],"code":"prices = [9000, 10000, 15000, 3000, 20000]\ntotal = 0\ncount = 0\nfor price in prices:\n    if price >= 10000:\n        total = total + price\n        count = count + 1\nprint(total)\nprint(count)\nif count > 0:\n    print(total / count)\nelse:\n    print(\"조건에 맞는 금액이 없습니다.\")","codeNote":"실행 결과 또는 테스트 기준\n45000\n3\n15000.0","extras":[],"codeExplain":["1행 「prices = [9000, 10000, 15000, 3000, 20000]」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 여러 값을 리스트로 묶어 prices에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「count = 0」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 count을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for price in prices:」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서는 prices에서 값을 하나씩 꺼내 price에 넣습니다. 다음 반복에서는 price가 다음 값으로 바뀝니다.","5행 「if price >= 10000:」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 price >= 10000을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","6행 「total = total + price」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 total + price을 먼저 계산하고 그 결과를 total에 저장합니다.","7행 「count = count + 1」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 count + 1을 먼저 계산하고 그 결과를 count에 저장합니다.","8행 「print(total)」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「print(count)」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","10행 「if count > 0:」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 count > 0을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","11행 「print(total / count)」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 total / count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","12행 「else:」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","13행 「print(\"조건에 맞는 금액이 없습니다.\")」 — 「반복문 for·while을 직접 바꾸고 확장합니다 · 풀이」에서 \"조건에 맞는 금액이 없습니다.\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"반복문 for·while 핵심을 확인합니다","paragraphs":[],"question":"while count \u003c 3: 안에서 count 값을 전혀 바꾸지 않으면 어떤 문제가 생길 수 있을까요?","extras":[],"visibleExtras":3,"id":"t2-c2-p12","answerOnNext":true,"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 「반복문 for·while 핵심을 확인합니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「반복문 for·while 핵심을 확인합니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「반복문 for·while 핵심을 확인합니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「반복문 for·while 핵심을 확인합니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「반복문 for·while 핵심을 확인합니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복문 for·while 핵심을 확인합니다 · 풀이","paragraphs":["count가 계속 같은 값이면 조건 count \u003c 3이 계속 True로 남아 반복문이 끝나지 않는 무한 반복이 될 수 있습니다. while에서는 종료 조건에 영향을 주는 상태가 실제로 변하는지 확인해야 합니다."],"extras":[],"code":"total = 0\n\nfor number in [10, 20, 30]:\n    total += number\n\nprint(total)","codeNote":"total은 0→10→30→60 순서로 바뀝니다. 마지막 출력은 60입니다.","codeExplain":["1행 「total = 0」 — 「반복문 for·while 핵심을 확인합니다 · 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「for number in [10, 20, 30]:」 — 「반복문 for·while 핵심을 확인합니다 · 풀이」에서는 [10, 20, 30]에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","4행 「total += number」 — 「반복문 for·while 핵심을 확인합니다 · 풀이」에서 total의 기존 값에 number을 더해 다시 total에 저장합니다.","6행 「print(total)」 — 「반복문 for·while 핵심을 확인합니다 · 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x01","kind":"concept","title":"반복문은 같은 일을 대신 해주는 로봇입니다","eyebrow":"초보 확장 · 개념","paragraphs":["“안녕”을 다섯 번 출력하려고 print를 다섯 줄 쓰는 대신 반복문에게 “이 일을 다섯 번 해”라고 시킬 수 있습니다.","for는 횟수나 대상이 어느 정도 정해져 있을 때 좋고, while은 어떤 조건이 참인 동안 계속해야 할 때 좋습니다.","반복문을 보면 무엇을 반복하는지, 언제 끝나는지, 반복할 때 값이 어떻게 바뀌는지 찾으세요."],"keywords":["for","while","반복","loop"],"extras":[],"code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「반복문은 같은 일을 대신 해주는 로봇입니다」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「반복문은 같은 일을 대신 해주는 로봇입니다」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「반복문은 같은 일을 대신 해주는 로봇입니다」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x02","kind":"example","title":"range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다","eyebrow":"초보 확장 · 예제","paragraphs":["range(5)는 다섯 개 숫자를 만들지만 1부터 5가 아니라 0부터 4입니다.","for i in range(5)는 숫자를 하나씩 i에 넣고 들여쓰기된 코드를 매번 실행합니다.","i는 “지금 처리 중인 값”을 잠깐 담는 상자라고 생각하면 됩니다."],"code":"for number in range(1, 6):\n    print(number)","codeNote":"range(1, 6)은 1부터 시작해 6 직전인 5까지 만듭니다.","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — 「range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「print(number)」 — 「range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x03","kind":"concept","title":"카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다","eyebrow":"초보 확장 · 개념","paragraphs":["카운터는 몇 번 했는지 셉니다. count += 1처럼 매번 1씩 늘립니다.","누적값은 여러 값을 계속 더해 모읍니다. total += price처럼 지금까지 합계를 저장합니다.","반복문 밖에서 시작값을 만들고 안에서 조금씩 바꾸는 모양을 익히면 합계와 평균 문제가 쉬워집니다."],"extras":[],"code":"prices = [1200, 800, 2000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"total은 0→1200→2000→4000 순서로 바뀝니다.","codeExplain":["1행 「prices = [1200, 800, 2000]」 — 「카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다」에서 여러 값을 리스트로 묶어 prices에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for price in prices:」 — 「카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다」에서는 prices에서 값을 하나씩 꺼내 price에 넣습니다. 다음 반복에서는 price가 다음 값으로 바뀝니다.","5행 「total += price」 — 「카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다」에서 total의 기존 값에 price을 더해 다시 total에 저장합니다.","7행 「print(total)」 — 「카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x04","kind":"example","title":"1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["total은 처음 0이고, 1을 더해 1, 2를 더해 3, 3을 더해 6이 됩니다.","마지막 15만 보지 말고 0→1→3→6→10→15로 변하는 흐름을 보세요.","값 변화를 종이에 적어 따라가는 것을 추적이라고 합니다."],"code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","extras":[],"codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x05","kind":"concept","title":"while은 조건이 True인 동안 계속 돕니다","eyebrow":"초보 확장 · 개념","paragraphs":["while은 “몇 번”보다 “언제까지”가 중요한 반복에 잘 맞습니다.","while 뒤 조건이 계속 True라면 끝나지 않는 무한 반복이 생깁니다.","조건을 언젠가 False로 만드는 값 변화가 반복문 안에 있는지 꼭 확인하세요."],"calloutTitle":"while 안전 질문","calloutBody":"반복할 때마다 조건에 쓰인 값이 실제로 바뀌는가?","extras":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 「while은 조건이 True인 동안 계속 돕니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「while은 조건이 True인 동안 계속 돕니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「while은 조건이 True인 동안 계속 돕니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「while은 조건이 True인 동안 계속 돕니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「while은 조건이 True인 동안 계속 돕니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x06","kind":"example","title":"카운트다운으로 while의 종료 조건을 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["count가 3에서 시작하고 count > 0인 동안 반복합니다.","반복 안에서 count -= 1을 하므로 3→2→1→0으로 줄어듭니다.","0이 되면 조건이 False가 되어 반복이 끝납니다."],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"codeExplain":["1행 「count = 3」 — 「카운트다운으로 while의 종료 조건을 봅니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「카운트다운으로 while의 종료 조건을 봅니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「카운트다운으로 while의 종료 조건을 봅니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「카운트다운으로 while의 종료 조건을 봅니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「카운트다운으로 while의 종료 조건을 봅니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x07","kind":"practice","title":"1부터 5까지 한 줄씩 출력해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["for와 range를 이용해 1, 2, 3, 4, 5를 순서대로 출력합니다.","range의 끝 숫자는 포함되지 않는다는 점을 떠올리세요."],"practicePrompt":"range(...)에 어떤 시작값과 끝값을 넣어야 1부터 5가 나오는지 생각한 뒤 코드를 작성하세요.","answerOnNext":true,"extras":[],"code":"for number in range(____, ____):\n    print(number)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「for number in range(____, ____):」 — 「1부터 5까지 한 줄씩 출력해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","2행 「print(number)」 — 「1부터 5까지 한 줄씩 출력해 보세요」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x08","kind":"solution","title":"1부터 5까지 한 줄씩 출력해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["range(1, 6)은 1에서 시작해 6 직전에서 멈춥니다.","for는 값을 하나씩 number에 넣습니다.","print(number)는 매 반복의 현재 값을 보여 줍니다.","for는 반복할 값 묶음에서 첫 값을 꺼내 변수에 넣고 들여쓰기된 코드를 실행합니다. 끝나면 다음 값을 넣고 같은 코드를 다시 실행합니다. 더 꺼낼 값이 없으면 반복이 끝납니다.","while은 반복 전에 조건을 확인하고 True이면 본문을 실행합니다. 본문 실행 뒤 다시 조건을 검사합니다. 조건에 사용되는 값이 바뀌어야 언젠가 False가 되어 멈출 수 있습니다."],"code":"for number in range(1, 6):\n    print(number)","codeNote":"1\n2\n3\n4\n5","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — 「1부터 5까지 한 줄씩 출력해 보세요 · 아주 쉬운 풀이」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「print(number)」 — 「1부터 5까지 한 줄씩 출력해 보세요 · 아주 쉬운 풀이」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x09","kind":"practice","title":"짝수만 더해서 합계를 구해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["2, 4, 6, 8, 10의 합을 구합니다. total은 0에서 시작합니다.","range(2, 11, 2)의 세 번째 값 2는 “2씩 증가”라는 뜻입니다."],"practicePrompt":"for와 total을 사용해 2부터 10까지 짝수의 합을 구하세요.","answerOnNext":true,"extras":[],"code":"total = 0\n\nfor number in range(____, ____, ____):\n    total = ____\n\nprint(total)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「total = 0」 — 「짝수만 더해서 합계를 구해 보세요」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「for number in range(____, ____, ____):」 — 「짝수만 더해서 합계를 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","4행 「total = ____」 — 「짝수만 더해서 합계를 구해 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","6행 「print(total)」 — 「짝수만 더해서 합계를 구해 보세요」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x10","kind":"solution","title":"짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["range(2, 11, 2)는 2, 4, 6, 8, 10을 만듭니다.","total += number는 total = total + number와 같은 뜻입니다.","반복이 끝나면 total은 30입니다."],"code":"total = 0\nfor number in range(2, 11, 2):\n    total += number\nprint(total)","codeNote":"예상 출력: 30","extras":[],"codeExplain":["1행 「total = 0」 — 「짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","2행 「for number in range(2, 11, 2):」 — 「짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이」에서는 range(2, 11, 2)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","3행 「total += number」 — 「짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total의 기존 값에 number을 더해 다시 total에 저장합니다.","4행 「print(total)」 — 「짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x11","kind":"check","title":"break와 continue의 차이를 구분해 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["break는 반복문 전체를 즉시 끝냅니다.","continue는 이번 한 번만 건너뛰고 다음 반복으로 갑니다.","둘 다 흐름을 바꾸므로 왜 필요한지 설명할 수 있을 때 쓰는 것이 좋습니다."],"question":"1부터 5를 도는 중 number가 3일 때 continue를 실행하면 어떤 숫자들이 출력될까요?","answerOnNext":true,"extras":[],"code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"3에서만 continue가 실행되어 3을 건너뛰고 1, 2, 4, 5가 출력됩니다.","codeExplain":["1행 「for number in range(1, 6):」 — 「break와 continue의 차이를 구분해 보세요」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「if number == 3:」 — 「break와 continue의 차이를 구분해 보세요」에서 number == 3을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","3행 「continue」 — 「break와 continue의 차이를 구분해 보세요」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","4행 「print(number)」 — 「break와 continue의 차이를 구분해 보세요」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x12","kind":"solution","title":"break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["1과 2는 정상 출력합니다.","3에서는 continue로 print를 건너뜁니다.","반복은 끝나지 않아서 4와 5가 다시 출력됩니다."],"code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"1\n2\n4\n5","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — 「break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이」에서는 range(1, 6)에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","2행 「if number == 3:」 — 「break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이」에서 number == 3을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","3행 「continue」 — 「break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","4행 「print(number)」 — 「break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이」에서 number의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x13","kind":"concept","title":"for와 while 중 무엇을 쓸지 이렇게 고릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["목록을 하나씩 처리하거나 정해진 횟수만큼 반복하면 for가 보통 쉽습니다.","맞는 입력이 나올 때까지처럼 종료가 조건에 달려 있으면 while이 자연스럽습니다.","초보 단계에서는 “횟수·목록 = for, 조건이 끝날 때까지 = while”로 시작하면 충분합니다."],"extras":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 「for와 while 중 무엇을 쓸지 이렇게 고릅니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「for와 while 중 무엇을 쓸지 이렇게 고릅니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「for와 while 중 무엇을 쓸지 이렇게 고릅니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「for와 while 중 무엇을 쓸지 이렇게 고릅니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「for와 while 중 무엇을 쓸지 이렇게 고릅니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c2-x14","kind":"example","title":"비밀번호 시도 횟수를 while로 제한합니다","eyebrow":"초보 확장 · 예제","paragraphs":["attempts가 0에서 시작하고 3보다 작은 동안 입력을 받을 수 있습니다.","틀릴 때마다 attempts를 1 늘립니다. 세 번째로 틀렸을 때 “시도 횟수 초과”를 출력합니다.","정답을 입력하면 break로 반복을 즉시 끝냅니다. 초보 단계에서는 while 뒤의 별도 else 문법 없이 이 흐름부터 익히면 충분합니다."],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"codeExplain":["1행 「count = 3」 — 「비밀번호 시도 횟수를 while로 제한합니다」에서 오른쪽 3을 먼저 계산하고 그 결과를 count에 저장합니다.","3행 「while count > 0:」 — 「비밀번호 시도 횟수를 while로 제한합니다」에서는 count > 0이 True인 동안 반복합니다. 이 조건이 False가 되는 순간 반복이 끝납니다.","4행 「print(count)」 — 「비밀번호 시도 횟수를 while로 제한합니다」에서 count의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「count -= 1」 — 「비밀번호 시도 횟수를 while로 제한합니다」에서 count의 기존 값에서 1을 빼고 같은 자리에 저장합니다.","7행 「print(\"끝\")」 — 「비밀번호 시도 횟수를 while로 제한합니다」에서 \"끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 2 정리","title":"지금 알아야 할 것","paragraphs":["반복문 for·while 챕터의 목표는 문법을 외우는 것이 아니라 “반복 작업을 for와 while로 표현하고, 반복 범위·종료 조건·누적 상태를 안전하게 추적한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 함수 만들기로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["반복 작업을 for와 while로 표현하고, 반복 범위·종료 조건·누적 상태를 안전하게 추적한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c2-p13","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 「지금 알아야 할 것」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「지금 알아야 할 것」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「print(\"처리:\", task)」 — 「지금 알아야 할 것」에서 \"처리:\", task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"반복을 문제 안에서 발견하고 작은 작업을 반복시키는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"리스트 순회, while 반복, 누적 처리와 조건 결합을 실제 데이터 흐름으로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복 작업을 자동화 도구로 바꾸고 완성 코드를 연습으로 이어가는 방식 참고"}]}],"track":2,"id":"t2-c2","remember":"range의 끝 제외, 종료 조건","practiceGoal":"금액 필터·합계·평균과 변수 추적","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"반복을 문제 안에서 발견하고 작은 작업을 반복시키는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"리스트 순회, while 반복, 누적 처리와 조건 결합을 실제 데이터 흐름으로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복 작업을 자동화 도구로 바꾸고 완성 코드를 연습으로 이어가는 방식 참고"}]},{"chapter":3,"title":"함수 만들기","pages":[{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"function 함수","description":"특정 작업을 하나의 이름으로 묶어 필요할 때 호출할 수 있게 만든 코드 단위입니다. 입력을 받고 결과를 돌려줄 수도 있습니다.","usage":"반복되는 계산이나 의미 있는 기능을 재사용할 때 씁니다.","example":"예: def calc_total(...): 로 합계 계산 규칙을 함수로 만들 수 있습니다."},{"term":"def","description":"Python에서 새 함수를 정의할 때 사용하는 키워드입니다. 함수 이름과 매개변수를 적고 들여쓴 블록에 실제 동작을 작성합니다.","usage":"새로운 기능 단위를 만들 때 사용합니다.","example":"예: def greet(name): 는 name을 받는 greet 함수를 정의합니다."},{"term":"parameter 매개변수","description":"함수를 정의할 때 외부에서 받을 값을 위한 이름입니다. 함수 내부에서는 일반 변수처럼 사용할 수 있습니다.","usage":"함수가 여러 입력값으로 재사용되도록 만들 때 씁니다.","example":"예: def add(a, b): 에서 a와 b가 parameter입니다."}],"extras":[],"visibleExtras":2,"id":"t2-c3-p1","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「먼저 알아두면 좋은 단어」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「먼저 알아두면 좋은 단어」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「먼저 알아두면 좋은 단어」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「먼저 알아두면 좋은 단어」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"argument 인자","description":"함수를 실제로 호출할 때 전달하는 구체적인 값입니다. 정의의 parameter와 호출의 argument를 구분하면 함수 흐름을 이해하기 쉽습니다.","usage":"함수에 실제 데이터를 넣어 실행할 때 사용합니다.","example":"예: add(3, 5)의 3과 5가 argument입니다."},{"term":"return 반환","description":"함수의 계산 결과를 호출한 위치로 돌려주는 동작입니다. return이 실행되면 그 함수 호출은 끝납니다.","usage":"함수 결과를 다른 계산이나 변수에 다시 사용할 때 씁니다.","example":"예: return total은 계산한 total 값을 호출한 코드에 돌려줍니다."},{"term":"scope 범위","description":"변수 이름이 유효하고 접근 가능한 범위를 뜻합니다. 함수 안에서 만든 지역 변수는 보통 함수 밖에서 직접 사용할 수 없습니다.","usage":"변수 충돌과 데이터 흐름을 이해할 때 중요합니다.","example":"예: 함수 안의 subtotal은 함수 호출이 끝난 뒤 바깥에서 바로 사용할 수 없습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c3-p2","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「코드에서 자주 만나는 표현」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「코드에서 자주 만나는 표현」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「코드에서 자주 만나는 표현」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「코드에서 자주 만나는 표현」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 1/6","title":"함수는 코드에 이름을 붙이는 방법입니다","paragraphs":["함수는 단순히 줄 수를 줄이는 도구가 아니라 “이 코드 묶음이 무슨 일을 하는가”에 이름을 붙이는 방법입니다. calc_shipping, format_name처럼 기능이 드러나는 이름은 코드 자체를 설명서처럼 만듭니다.","한 함수에는 가능한 한 하나의 명확한 책임을 주는 편이 좋습니다. 입력, 계산, 출력, 파일 저장을 모두 한 함수에 넣으면 수정할 때 영향 범위를 파악하기 어렵습니다.","실제 앱에서도 버튼 처리, 데이터 변환, API 호출 등 기능을 작은 함수로 나누면 테스트와 재사용이 쉬워집니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p3","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「함수는 코드에 이름을 붙이는 방법입니다」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수는 코드에 이름을 붙이는 방법입니다」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수는 코드에 이름을 붙이는 방법입니다」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수는 코드에 이름을 붙이는 방법입니다」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 2/6","title":"정의와 호출은 서로 다른 시점입니다","paragraphs":["def로 함수를 정의했다고 바로 내부 코드가 실행되는 것은 아닙니다. 함수는 호출해야 실행됩니다. 코드를 읽을 때 “정의하는 줄”과 “실제로 호출하는 줄”을 구분하세요.","함수 호출이 시작되면 argument가 parameter에 연결되고, 함수 본문이 위에서 아래로 실행된 뒤 return 값이 호출 위치로 돌아옵니다.","이 흐름을 화살표로 그리면 함수가 많아져도 현재 어디에서 실행 중인지 추적하기 쉽습니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p4","code":"def greet():\n    print(\"안녕하세요\")\n\nprint(\"함수 정의 끝\")\ngreet()","codeNote":"def 구간은 기능을 등록하는 단계이고, greet()를 만났을 때 함수 본문이 실행됩니다.","codeExplain":["1행 「def greet():」 — 「정의와 호출은 서로 다른 시점입니다」에서 greet 함수를 만듭니다. 괄호 안 입력 없음이 호출할 때 받을 값입니다.","2행 「print(\"안녕하세요\")」 — 「정의와 호출은 서로 다른 시점입니다」에서 \"안녕하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(\"함수 정의 끝\")」 — 「정의와 호출은 서로 다른 시점입니다」에서 \"함수 정의 끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「greet()」 — 「정의와 호출은 서로 다른 시점입니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 3/6","title":"return과 print는 역할이 다릅니다","paragraphs":["print는 화면에 값을 보여 주고, return은 값을 호출한 코드에 전달합니다. 함수 내부에서 print만 하면 사람은 결과를 볼 수 있지만 다른 코드가 그 값을 계산에 재사용하기 어렵습니다.","계산 함수는 return으로 결과를 돌려주고, 화면 출력은 호출한 쪽에서 필요할 때 수행하는 구조가 재사용에 유리합니다.","result = add(3, 5)처럼 반환값을 변수에 담으면 그 결과를 다시 저장·비교·계산할 수 있습니다.","return 없이 함수 끝에 도달하면 호출 결과는 None입니다. None은 “반환할 값을 따로 주지 않았다”는 특별한 값입니다. print() 자체의 반환값도 None입니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p5","code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","codeExplain":["1행 「def add(a, b):」 — 「return과 print는 역할이 다릅니다」에서 add 함수를 만듭니다. 괄호 안 a, b이 호출할 때 받을 값입니다.","2행 「return a + b」 — 「return과 print는 역할이 다릅니다」에서 a + b의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「result = add(3, 5)」 — 「return과 print는 역할이 다릅니다」에서 오른쪽 add(3, 5)을 먼저 계산하고 그 결과를 result에 저장합니다.","5행 「print(result)」 — 「return과 print는 역할이 다릅니다」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 4/6","title":"매개변수는 함수를 특정 값에서 독립시킵니다","paragraphs":["함수 안에 price = 10000처럼 고정값을 넣으면 그 함수는 한 상황에만 맞습니다. price를 parameter로 받으면 다양한 값에 같은 규칙을 적용할 수 있습니다.","함수에 정말 필요한 값만 전달하면 외부 상태에 덜 의존하고, 어떤 입력으로 어떤 결과가 나오는지 테스트하기 쉬워집니다.","매개변수가 너무 많아지면 함수의 책임이 넓어진 신호일 수 있으므로 기능을 나눌지 검토합니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p6","code":"def greet(name):\n    print(\"안녕하세요,\", name)\n\ngreet(\"민수\")\ngreet(\"영희\")","codeNote":"같은 함수에 다른 이름을 넣어 두 번 재사용합니다. name이 매번 다른 값을 받습니다.","codeExplain":["1행 「def greet(name):」 — 「매개변수는 함수를 특정 값에서 독립시킵니다」에서 greet 함수를 만듭니다. 괄호 안 name이 호출할 때 받을 값입니다.","2행 「print(\"안녕하세요,\", name)」 — 「매개변수는 함수를 특정 값에서 독립시킵니다」에서 \"안녕하세요,\", name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「greet(\"민수\")」 — 「매개변수는 함수를 특정 값에서 독립시킵니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","5행 「greet(\"영희\")」 — 「매개변수는 함수를 특정 값에서 독립시킵니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 5/6","title":"지역 변수는 함수 내부의 작업 공간입니다","paragraphs":["함수 내부에서 만든 변수는 보통 그 함수 안에서만 사용됩니다. 이 지역성 덕분에 다른 함수의 같은 이름과 충돌하지 않고 내부 계산을 안전하게 숨길 수 있습니다.","함수 밖의 전역 변수를 직접 바꾸는 코드가 많아지면 입력과 출력이 보이지 않아 디버깅이 어려워집니다.","입력을 parameter로 받고 결과를 return하는 패턴은 데이터 흐름을 분명하게 만들어 줍니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p7","code":"def make_total(price, count):\n    total = price * count\n    return total\n\nprint(make_total(2000, 3))","codeNote":"total은 함수 안에서만 쓰는 작업용 변수이고, 밖으로 필요한 값은 return으로 전달합니다.","codeExplain":["1행 「def make_total(price, count):」 — 「지역 변수는 함수 내부의 작업 공간입니다」에서 make_total 함수를 만듭니다. 괄호 안 price, count이 호출할 때 받을 값입니다.","2행 「total = price * count」 — 「지역 변수는 함수 내부의 작업 공간입니다」에서 오른쪽 price * count을 먼저 계산하고 그 결과를 total에 저장합니다.","3행 「return total」 — 「지역 변수는 함수 내부의 작업 공간입니다」에서 total의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","5행 「print(make_total(2000, 3))」 — 「지역 변수는 함수 내부의 작업 공간입니다」에서 make_total(2000, 3)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 6/6","title":"함수는 작게 만들고 예제로 테스트합니다","paragraphs":["함수를 만든 뒤 대표 입력, 경계값, 잘못된 입력을 각각 넣어 기대 결과와 비교하세요. 함수는 독립된 작은 단위라 테스트하기 좋습니다.","긴 프로그램 전체를 실행해서 확인하는 것보다 함수 하나의 입력과 출력만 검증하면 원인을 훨씬 빠르게 좁힐 수 있습니다.","나중에 자동 테스트를 배울 때도 “작은 함수 + 명확한 입력/출력” 구조가 큰 장점이 됩니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p8","code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","codeExplain":["1행 「def subtotal(count, price):」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 subtotal 함수를 만듭니다. 괄호 안 count, price이 호출할 때 받을 값입니다.","2행 「return count * price」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 count * price의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「def add_fee(amount):」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 add_fee 함수를 만듭니다. 괄호 안 amount이 호출할 때 받을 값입니다.","5행 「return amount + 3000」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 amount + 3000의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「base = subtotal(2, 5000)」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 오른쪽 subtotal(2, 5000)을 먼저 계산하고 그 결과를 base에 저장합니다.","8행 「print(add_fee(base))」 — 「함수는 작게 만들고 예제로 테스트합니다」에서 add_fee(base)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"함수 만들기의 전체 흐름","paragraphs":["함수 만들기에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"CODE_TO_OUTPUT","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c3-p9","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「함수 만들기의 전체 흐름」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수 만들기의 전체 흐름」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수 만들기의 전체 흐름」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수 만들기의 전체 흐름」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"함수 만들기를 하나의 코드로 연결합니다","paragraphs":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","extras":[],"visibleExtras":2,"id":"t2-c3-p10","codeExplain":["1행 「def double(number):」 — 「함수 만들기를 하나의 코드로 연결합니다」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수 만들기를 하나의 코드로 연결합니다」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수 만들기를 하나의 코드로 연결합니다」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수 만들기를 하나의 코드로 연결합니다」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"함수 만들기를 직접 바꾸고 확장합니다","paragraphs":["함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다.","같은 함수를 여러 값으로 호출해도 함수 안 규칙은 같습니다. 입력값만 달라지고 같은 계산 과정을 거쳐 새로운 결과가 나옵니다.","return이 실행되면 함수는 값을 밖으로 돌려주고 그 자리에서 끝납니다. 단순히 화면에 보여 주는 print와 역할이 다릅니다."],"code":"def calc_shipping(total):\n    if ____:\n        return ____\n    return ____\n\nprint(calc_shipping(49999))\nprint(calc_shipping(50000))\nprint(calc_shipping(50001))","practicePrompt":"배송비를 계산하는 calc_shipping(total) 함수를 만드세요. 5만원 이상이면 0, 그보다 작으면 3000을 return하도록 만들고 여러 금액으로 테스트하세요.","extras":[],"visibleExtras":2,"id":"t2-c3-p11","answerOnNext":true,"codeExplain":["1행 「def calc_shipping(total):」 — 「함수 만들기를 직접 바꾸고 확장합니다」에서 calc_shipping 함수를 만듭니다. 괄호 안 total이 호출할 때 받을 값입니다.","2행 「if ____:」 — 「함수 만들기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","3행 「return ____」 — 「함수 만들기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","4행 「return ____」 — 「함수 만들기를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","6행 「print(calc_shipping(49999))」 — 「함수 만들기를 직접 바꾸고 확장합니다」에서 calc_shipping(49999)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「print(calc_shipping(50000))」 — 「함수 만들기를 직접 바꾸고 확장합니다」에서 calc_shipping(50000)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「print(calc_shipping(50001))」 — 「함수 만들기를 직접 바꾸고 확장합니다」에서 calc_shipping(50001)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c3-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수 만들기를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["def는 함수를 정의하고, calc_shipping(49999)는 그 함수를 호출합니다.","49999가 매개변수 total에 연결됩니다. 조건이 False라 마지막 return 3000까지 갑니다.","50000은 조건이 True여서 return 0을 만나 즉시 함수를 끝냅니다. 아래 return 3000은 실행되지 않습니다."],"code":"def calc_shipping(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\nprint(calc_shipping(49999))\nprint(calc_shipping(50000))\nprint(calc_shipping(50001))","codeNote":"실행 결과 또는 테스트 기준\n3000\n0\n0","extras":[],"codeExplain":["1행 「def calc_shipping(total):」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 calc_shipping 함수를 만듭니다. 괄호 안 total이 호출할 때 받을 값입니다.","2행 「if total >= 50000:」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 total >= 50000을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","3행 「return 0」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 0의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「return 3000」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 3000의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","6행 「print(calc_shipping(49999))」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 calc_shipping(49999)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「print(calc_shipping(50000))」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 calc_shipping(50000)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「print(calc_shipping(50001))」 — 「함수 만들기를 직접 바꾸고 확장합니다 · 풀이」에서 calc_shipping(50001)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"함수 만들기 핵심을 확인합니다","paragraphs":[],"question":"함수 안에서 print(total)만 하고 return을 쓰지 않으면 total 값을 함수 밖 계산에서 바로 재사용하기 어려운 이유는 무엇일까요?","extras":[],"visibleExtras":3,"id":"t2-c3-p12","answerOnNext":true,"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「함수 만들기 핵심을 확인합니다」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수 만들기 핵심을 확인합니다」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수 만들기 핵심을 확인합니다」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수 만들기 핵심을 확인합니다」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수 만들기 핵심을 확인합니다 · 풀이","paragraphs":["print는 화면에 보여 주는 동작입니다. return 없이 끝나는 함수도 호출 결과는 있으며 그 값이 None입니다. 계산 결과를 함수 밖에서 쓰려면 return total처럼 그 값을 명시적으로 돌려줘야 합니다."],"extras":[],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"3은 a에, 5는 b에 들어갑니다. return이 8을 돌려주고 result에 저장됩니다.","codeExplain":["1행 「def add(a, b):」 — 「함수 만들기 핵심을 확인합니다 · 풀이」에서 add 함수를 만듭니다. 괄호 안 a, b이 호출할 때 받을 값입니다.","2행 「return a + b」 — 「함수 만들기 핵심을 확인합니다 · 풀이」에서 a + b의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「result = add(3, 5)」 — 「함수 만들기 핵심을 확인합니다 · 풀이」에서 오른쪽 add(3, 5)을 먼저 계산하고 그 결과를 result에 저장합니다.","5행 「print(result)」 — 「함수 만들기 핵심을 확인합니다 · 풀이」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x01","kind":"concept","title":"함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다","eyebrow":"초보 확장 · 개념","paragraphs":["같은 코드를 반복해서 쓰기보다 코드 묶음에 이름을 붙이면 필요할 때 이름만 불러 쓸 수 있습니다.","def는 함수를 만드는 표시입니다. 만들기만 해서는 실행되지 않고 함수 이름 뒤에 ()를 붙여 호출해야 합니다.","함수의 핵심은 코드를 짧게 만드는 것보다 “이 부분이 무슨 일을 하는지 이름으로 설명”하는 것입니다."],"keywords":["def","함수","호출","return"],"extras":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x02","kind":"example","title":"함수를 만드는 것과 실행하는 것은 다른 일입니다","eyebrow":"초보 확장 · 예제","paragraphs":["greet 함수를 정의하면 Python은 그 기능을 기억합니다.","greet()를 만났을 때 비로소 함수 안 print가 실행됩니다.","두 번 호출하면 두 번 실행됩니다."],"code":"def greet():\n    print(\"안녕하세요\")\n\nprint(\"함수 정의 끝\")\ngreet()","codeNote":"def 구간은 기능을 등록하는 단계이고, greet()를 만났을 때 함수 본문이 실행됩니다.","extras":[],"codeExplain":["1행 「def greet():」 — 「함수를 만드는 것과 실행하는 것은 다른 일입니다」에서 greet 함수를 만듭니다. 괄호 안 입력 없음이 호출할 때 받을 값입니다.","2행 「print(\"안녕하세요\")」 — 「함수를 만드는 것과 실행하는 것은 다른 일입니다」에서 \"안녕하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「print(\"함수 정의 끝\")」 — 「함수를 만드는 것과 실행하는 것은 다른 일입니다」에서 \"함수 정의 끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「greet()」 — 「함수를 만드는 것과 실행하는 것은 다른 일입니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다."]},{"id":"t2-c3-x03","kind":"concept","title":"매개변수는 함수가 받을 값을 위한 빈 상자입니다","eyebrow":"초보 확장 · 개념","paragraphs":["def greet(name):의 name은 나중에 들어올 값을 받을 자리입니다. 이것을 매개변수라고 합니다.","greet(\"민수\")에서 \"민수\"는 실제로 전달하는 값입니다.","매개변수를 쓰면 같은 함수를 여러 값에 재사용할 수 있습니다."],"extras":[],"code":"def greet(name):\n    print(\"안녕하세요,\", name)\n\ngreet(\"민수\")\ngreet(\"영희\")","codeNote":"같은 함수에 다른 이름을 넣어 두 번 재사용합니다. name이 매번 다른 값을 받습니다.","codeExplain":["1행 「def greet(name):」 — 「매개변수는 함수가 받을 값을 위한 빈 상자입니다」에서 greet 함수를 만듭니다. 괄호 안 name이 호출할 때 받을 값입니다.","2행 「print(\"안녕하세요,\", name)」 — 「매개변수는 함수가 받을 값을 위한 빈 상자입니다」에서 \"안녕하세요,\", name의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「greet(\"민수\")」 — 「매개변수는 함수가 받을 값을 위한 빈 상자입니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","5행 「greet(\"영희\")」 — 「매개변수는 함수가 받을 값을 위한 빈 상자입니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다."]},{"id":"t2-c3-x04","kind":"example","title":"두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["add(3, 5)를 호출하면 a에는 3, b에는 5가 들어갑니다.","함수 안에서 a + b를 계산합니다.","return으로 결과를 함수 밖으로 돌려보냅니다."],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","extras":[],"codeExplain":["1행 「def double(number):」 — 「두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x05","kind":"concept","title":"print와 return은 역할이 완전히 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["print는 사람에게 화면으로 보여 줍니다. return은 함수가 계산한 값을 다른 코드가 다시 쓰게 돌려줍니다.","함수 안에서 print(5)를 했다고 해서 함수 결과값이 5가 되는 것은 아닙니다.","“print = 보여주기, return = 건네주기”라고 기억하세요."],"calloutTitle":"한 줄 기억","calloutBody":"print는 사람에게, return은 코드에게 값을 전달합니다.","extras":[],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","codeExplain":["1행 「def add(a, b):」 — 「print와 return은 역할이 완전히 다릅니다」에서 add 함수를 만듭니다. 괄호 안 a, b이 호출할 때 받을 값입니다.","2행 「return a + b」 — 「print와 return은 역할이 완전히 다릅니다」에서 a + b의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「result = add(3, 5)」 — 「print와 return은 역할이 완전히 다릅니다」에서 오른쪽 add(3, 5)을 먼저 계산하고 그 결과를 result에 저장합니다.","5행 「print(result)」 — 「print와 return은 역할이 완전히 다릅니다」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x06","kind":"example","title":"return 값은 다른 계산에 다시 사용할 수 있습니다","eyebrow":"초보 확장 · 예제","paragraphs":["double(4)는 8을 return합니다.","그 8을 value에 저장한 뒤 value + 10처럼 다시 계산할 수 있습니다.","이런 재사용 때문에 계산 함수에서는 return이 중요합니다."],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","extras":[],"codeExplain":["1행 「def add(a, b):」 — 「return 값은 다른 계산에 다시 사용할 수 있습니다」에서 add 함수를 만듭니다. 괄호 안 a, b이 호출할 때 받을 값입니다.","2행 「return a + b」 — 「return 값은 다른 계산에 다시 사용할 수 있습니다」에서 a + b의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「result = add(3, 5)」 — 「return 값은 다른 계산에 다시 사용할 수 있습니다」에서 오른쪽 add(3, 5)을 먼저 계산하고 그 결과를 result에 저장합니다.","5행 「print(result)」 — 「return 값은 다른 계산에 다시 사용할 수 있습니다」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x07","kind":"practice","title":"가로와 세로를 받아 직사각형 넓이를 구하세요","eyebrow":"초보 확장 · 실습","paragraphs":["rectangle_area라는 함수를 만들고 width와 height를 받습니다.","두 값을 곱한 결과를 print하지 말고 return하세요.","함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다."],"practicePrompt":"rectangle_area(4, 3)이 12를 돌려주도록 만들고 바깥에서 출력하세요.","answerOnNext":true,"extras":[],"code":"def rectangle_area(width, height):\n    return ____\n\narea = rectangle_area(4, 3)\nprint(area)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「def rectangle_area(width, height):」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요」에서 rectangle_area 함수를 만듭니다. 괄호 안 width, height이 호출할 때 받을 값입니다.","2행 「return ____」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","4행 「area = rectangle_area(4, 3)」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요」에서 오른쪽 rectangle_area(4, 3)을 먼저 계산하고 그 결과를 area에 저장합니다.","5행 「print(area)」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요」에서 area의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x08","kind":"solution","title":"가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["width와 height는 입력입니다.","넓이는 width * height입니다.","그 값을 return하고 호출 결과를 area에 저장해 출력합니다."],"code":"def rectangle_area(width, height):\n    return width * height\n\narea = rectangle_area(4, 3)\nprint(area)","codeNote":"예상 출력: 12","extras":[],"codeExplain":["1행 「def rectangle_area(width, height):」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이」에서 rectangle_area 함수를 만듭니다. 괄호 안 width, height이 호출할 때 받을 값입니다.","2행 「return width * height」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이」에서 width * height의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「area = rectangle_area(4, 3)」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이」에서 오른쪽 rectangle_area(4, 3)을 먼저 계산하고 그 결과를 area에 저장합니다.","5행 「print(area)」 — 「가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이」에서 area의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x09","kind":"practice","title":"가격과 할인율로 할인된 가격을 계산하세요","eyebrow":"초보 확장 · 실습","paragraphs":["price와 discount_percent를 받습니다.","할인 금액은 price * discount_percent / 100입니다.","함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다."],"practicePrompt":"10000원에 20% 할인을 적용하면 8000이 return되도록 discounted_price 함수를 만드세요.","answerOnNext":true,"extras":[],"code":"def discounted_price(price, discount_percent):\n    discount = ____\n    return ____\n\nprint(discounted_price(10000, 20))","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「def discounted_price(price, discount_percent):」 — 「가격과 할인율로 할인된 가격을 계산하세요」에서 discounted_price 함수를 만듭니다. 괄호 안 price, discount_percent이 호출할 때 받을 값입니다.","2행 「discount = ____」 — 「가격과 할인율로 할인된 가격을 계산하세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","3행 「return ____」 — 「가격과 할인율로 할인된 가격을 계산하세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","5행 「print(discounted_price(10000, 20))」 — 「가격과 할인율로 할인된 가격을 계산하세요」에서 discounted_price(10000, 20)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x10","kind":"solution","title":"가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["20%는 20/100 = 0.2입니다.","10000 * 0.2는 2000원 할인입니다.","10000 - 2000을 return하면 8000이 됩니다."],"code":"def discounted_price(price, discount_percent):\n    discount = price * discount_percent / 100\n    return price - discount\n\nprint(discounted_price(10000, 20))","codeNote":"예상 출력: 8000.0","extras":[],"codeExplain":["1행 「def discounted_price(price, discount_percent):」 — 「가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이」에서 discounted_price 함수를 만듭니다. 괄호 안 price, discount_percent이 호출할 때 받을 값입니다.","2행 「discount = price * discount_percent / 100」 — 「가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이」에서 오른쪽 price * discount_percent / 100을 먼저 계산하고 그 결과를 discount에 저장합니다.","3행 「return price - discount」 — 「가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이」에서 price - discount의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","5행 「print(discounted_price(10000, 20))」 — 「가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이」에서 discounted_price(10000, 20)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x11","kind":"check","title":"함수 안에서 만든 변수는 어디까지 보일까요?","eyebrow":"초보 확장 · 확인","paragraphs":["함수 안에서 만든 변수는 보통 그 함수 안에서만 쓰는 지역 변수입니다.","함수 안을 작은 작업방이라고 생각하면 쉽습니다.","바깥에서 값을 쓰고 싶으면 return으로 돌려받는 방식이 명확합니다."],"question":"함수 안에서만 만든 message를 함수 밖에서 바로 print(message)하면 정상적으로 출력될까요?","answerOnNext":true,"extras":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「함수 안에서 만든 변수는 어디까지 보일까요?」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「함수 안에서 만든 변수는 어디까지 보일까요?」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「함수 안에서 만든 변수는 어디까지 보일까요?」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「함수 안에서 만든 변수는 어디까지 보일까요?」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x12","kind":"solution","title":"함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["message는 greet 함수 안에서 만든 지역 변수입니다.","바깥에서는 그 이름을 바로 찾을 수 없습니다.","필요한 값은 return으로 돌려받아 바깥 변수에 저장하세요."],"code":"def greet():\n    message = \"안녕\"\n    return message\n\noutside = greet()\nprint(outside)","codeNote":"예상 출력: 안녕","extras":[],"codeExplain":["1행 「def greet():」 — 「함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이」에서 greet 함수를 만듭니다. 괄호 안 입력 없음이 호출할 때 받을 값입니다.","2행 「message = \"안녕\"」 — 「함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이」에서 오른쪽 \"안녕\"을 먼저 계산하고 그 결과를 message에 저장합니다.","3행 「return message」 — 「함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이」에서 message의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","5행 「outside = greet()」 — 「함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이」에서 오른쪽 greet()을 먼저 계산하고 그 결과를 outside에 저장합니다.","6행 「print(outside)」 — 「함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이」에서 outside의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x13","kind":"concept","title":"좋은 함수는 한 가지 일을 짧고 분명하게 합니다","eyebrow":"초보 확장 · 개념","paragraphs":["한 함수가 입력, 파일 읽기, 계산, 출력까지 전부 하면 고치기 어렵습니다.","함수 이름을 읽었을 때 무슨 일을 하는지 바로 알 수 있게 만드세요.","calculate_total, is_adult처럼 동작이 보이는 이름이 좋습니다."],"extras":[],"code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","codeExplain":["1행 「def subtotal(count, price):」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 subtotal 함수를 만듭니다. 괄호 안 count, price이 호출할 때 받을 값입니다.","2행 「return count * price」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 count * price의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「def add_fee(amount):」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 add_fee 함수를 만듭니다. 괄호 안 amount이 호출할 때 받을 값입니다.","5행 「return amount + 3000」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 amount + 3000의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「base = subtotal(2, 5000)」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 오른쪽 subtotal(2, 5000)을 먼저 계산하고 그 결과를 base에 저장합니다.","8행 「print(add_fee(base))」 — 「좋은 함수는 한 가지 일을 짧고 분명하게 합니다」에서 add_fee(base)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c3-x14","kind":"example","title":"작은 함수 두 개를 연결하면 긴 문제도 단순해집니다","eyebrow":"초보 확장 · 예제","paragraphs":["subtotal은 수량과 단가를 곱하는 일만 합니다.","add_tax는 금액에 세금을 더하는 일만 합니다.","작은 함수 결과를 연결하면 전체 계산이 완성됩니다."],"code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","extras":[],"codeExplain":["1행 「def subtotal(count, price):」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 subtotal 함수를 만듭니다. 괄호 안 count, price이 호출할 때 받을 값입니다.","2행 「return count * price」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 count * price의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「def add_fee(amount):」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 add_fee 함수를 만듭니다. 괄호 안 amount이 호출할 때 받을 값입니다.","5행 「return amount + 3000」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 amount + 3000의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「base = subtotal(2, 5000)」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 오른쪽 subtotal(2, 5000)을 먼저 계산하고 그 결과를 base에 저장합니다.","8행 「print(add_fee(base))」 — 「작은 함수 두 개를 연결하면 긴 문제도 단순해집니다」에서 add_fee(base)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 3 정리","title":"지금 알아야 할 것","paragraphs":["함수 만들기 챕터의 목표는 문법을 외우는 것이 아니라 “반복되는 코드를 함수로 묶고, 매개변수·반환값·지역 변수를 이용해 재사용 가능한 작은 기능을 만든다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 리스트와 딕셔너리로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["반복되는 코드를 함수로 묶고, 매개변수·반환값·지역 변수를 이용해 재사용 가능한 작은 기능을 만든다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c3-p13","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — 「지금 알아야 할 것」에서 double 함수를 만듭니다. 괄호 안 number이 호출할 때 받을 값입니다.","2행 「return number * 2」 — 「지금 알아야 할 것」에서 number * 2의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「answer = double(4)」 — 「지금 알아야 할 것」에서 오른쪽 double(4)을 먼저 계산하고 그 결과를 answer에 저장합니다.","5행 「print(answer)」 — 「지금 알아야 할 것」에서 answer의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"복잡한 문제를 작은 기능으로 분해하고 추상화하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"함수와 매개변수를 기본 동작을 재사용·확장하는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복되는 연구 작업을 작은 재사용 기능으로 묶어 실제 작업에 바로 쓰는 방식 참고"}]}],"track":2,"id":"t2-c3","remember":"def는 정의, 호출은 실행, return은 반환","practiceGoal":"배송비 함수 만들기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"복잡한 문제를 작은 기능으로 분해하고 추상화하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"함수와 매개변수를 기본 동작을 재사용·확장하는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복되는 연구 작업을 작은 재사용 기능으로 묶어 실제 작업에 바로 쓰는 방식 참고"}]},{"chapter":4,"title":"리스트와 딕셔너리","pages":[{"kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"list 리스트","description":"여러 값을 순서대로 저장하는 Python 자료구조입니다. 각 항목은 0부터 시작하는 인덱스로 접근할 수 있습니다.","usage":"순서가 있는 여러 값을 한 변수에 묶을 때 씁니다.","example":"예: prices = [1000, 2500, 4000]처럼 금액 여러 개를 저장합니다."},{"term":"index 인덱스","description":"리스트에서 항목의 위치를 나타내는 번호입니다. Python 리스트의 첫 번째 위치는 0입니다.","usage":"특정 위치의 값을 읽거나 바꿀 때 사용합니다.","example":"예: prices[0]은 첫 번째 값입니다."},{"term":"append","description":"리스트 맨 뒤에 새 항목 하나를 추가하는 메서드입니다.","usage":"실행 중 데이터가 하나씩 늘어날 때 씁니다.","example":"예: names.append(\"민수\")는 리스트 끝에 이름을 추가합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c4-p1","code":"fruits = [\"사과\", \"바나나\", \"포도\"]\nprint(fruits[0])\nprint(fruits[-1])","codeNote":"0번은 첫 번째 사과이고 -1은 마지막 포도입니다.","codeExplain":["1행 「fruits = [\"사과\", \"바나나\", \"포도\"]」 — 「먼저 알아두면 좋은 단어」에서 여러 값을 리스트로 묶어 fruits에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「print(fruits[0])」 — 「먼저 알아두면 좋은 단어」에서 fruits[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(fruits[-1])」 — 「먼저 알아두면 좋은 단어」에서 fruits[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"dictionary 딕셔너리","description":"키(key)와 값(value)을 한 쌍으로 저장하는 자료구조입니다. 위치보다 이름표로 데이터를 찾는 데 적합합니다.","usage":"사용자 정보, 설정, JSON 형태 데이터처럼 필드 이름이 있는 정보를 저장할 때 씁니다.","example":"예: user = {\"name\": \"민수\", \"age\": 37}처럼 저장합니다."},{"term":"key / value","description":"딕셔너리에서 데이터를 찾는 이름이 key이고 그 key에 연결된 실제 데이터가 value입니다.","usage":"의미 있는 이름으로 특정 값을 빠르게 조회할 때 씁니다.","example":"예: user[\"name\"]에서 \"name\"이 key이고 \"민수\"가 value입니다."},{"term":"membership 포함 검사","description":"in 연산자로 리스트에 값이 있는지, 딕셔너리에 key가 있는지 확인할 수 있습니다.","usage":"중복 확인, 존재 여부 검사 등에 사용합니다.","example":"예: \"age\" in user는 age key 존재 여부를 확인합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c4-p2","code":"fruits = [\"사과\", \"바나나\", \"포도\"]\nprint(fruits[0])\nprint(fruits[-1])","codeNote":"0번은 첫 번째 사과이고 -1은 마지막 포도입니다.","codeExplain":["1행 「fruits = [\"사과\", \"바나나\", \"포도\"]」 — 「코드에서 자주 만나는 표현」에서 여러 값을 리스트로 묶어 fruits에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「print(fruits[0])」 — 「코드에서 자주 만나는 표현」에서 fruits[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(fruits[-1])」 — 「코드에서 자주 만나는 표현」에서 fruits[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 04 · 개념 1/6","title":"리스트는 같은 종류의 여러 값을 순서대로 다룹니다","paragraphs":["변수를 item1, item2, item3처럼 늘리는 대신 리스트 하나에 묶으면 반복문과 함께 전체를 처리하기 쉬워집니다.","인덱스는 0부터 시작하므로 사람 기준 첫 번째가 코드에서는 [0]이라는 점을 기억하세요. 마지막 항목은 [-1]로 접근할 수도 있습니다.","앱의 검색 결과, 장바구니 상품, 날짜별 값처럼 순서가 있는 여러 데이터는 리스트 형태로 자주 표현됩니다."],"keywords":["list 리스트","index 인덱스","append","dictionary 딕셔너리"],"extras":[],"visibleExtras":2,"id":"t2-c4-p3","code":"fruits = [\"사과\", \"바나나\", \"포도\"]\nprint(fruits[0])\nprint(fruits[-1])","codeNote":"0번은 첫 번째 사과이고 -1은 마지막 포도입니다.","codeExplain":["1행 「fruits = [\"사과\", \"바나나\", \"포도\"]」 — 「리스트는 같은 종류의 여러 값을 순서대로 다룹니다」에서 여러 값을 리스트로 묶어 fruits에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「print(fruits[0])」 — 「리스트는 같은 종류의 여러 값을 순서대로 다룹니다」에서 fruits[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(fruits[-1])」 — 「리스트는 같은 종류의 여러 값을 순서대로 다룹니다」에서 fruits[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 04 · 개념 2/6","title":"리스트는 읽기뿐 아니라 수정도 가능합니다","paragraphs":["items[0] = 새값처럼 특정 위치를 바꾸고 append로 뒤에 추가하며 remove나 pop으로 항목을 제거할 수 있습니다.","수정 전에 현재 리스트를 출력하고, 한 작업 뒤 다시 출력해 무엇이 바뀌었는지 확인하면 메서드의 효과를 쉽게 익힐 수 있습니다.","리스트를 반복 중에 동시에 삭제하면 흐름이 복잡해질 수 있으므로 초보 단계에서는 새 리스트를 만드는 방식도 고려합니다."],"keywords":["list 리스트","index 인덱스","append","dictionary 딕셔너리"],"extras":[],"visibleExtras":2,"id":"t2-c4-p4","code":"shopping = [\"우유\", \"달걀\"]\nshopping.append(\"빵\")\nshopping[0] = \"두유\"\nprint(shopping)","codeNote":"append로 끝에 빵을 추가하고, 0번 위치의 우유를 두유로 바꿉니다.","codeExplain":["1행 「shopping = [\"우유\", \"달걀\"]」 — 「리스트는 읽기뿐 아니라 수정도 가능합니다」에서 여러 값을 리스트로 묶어 shopping에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「shopping.append(\"빵\")」 — 「리스트는 읽기뿐 아니라 수정도 가능합니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","3행 「shopping[0] = \"두유\"」 — 「리스트는 읽기뿐 아니라 수정도 가능합니다」에서 오른쪽 \"두유\"을 먼저 계산하고 그 결과를 shopping[0]에 저장합니다.","4행 「print(shopping)」 — 「리스트는 읽기뿐 아니라 수정도 가능합니다」에서 shopping의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 04 · 개념 3/6","title":"딕셔너리는 “몇 번째”보다 “무슨 항목”이 중요한 데이터에 적합합니다","paragraphs":["사용자 이름, 나이, 도시처럼 각 값에 의미 있는 필드명이 있을 때는 인덱스보다 key로 접근하는 편이 읽기 쉽습니다.","user[\"age\"]라고 쓰면 위치를 기억할 필요 없이 어떤 값을 읽는지 코드에 그대로 드러납니다.","API 응답이나 JSON 데이터는 딕셔너리와 리스트가 중첩된 구조로 전달되는 경우가 많아 이후에도 자주 만나게 됩니다."],"keywords":["list 리스트","index 인덱스","append","dictionary 딕셔너리"],"extras":[],"visibleExtras":2,"id":"t2-c4-p5","code":"student = {\"name\": \"민수\", \"score\": 80}\n\nprint(student[\"name\"])\nstudent[\"score\"] = 90\nprint(student[\"score\"])","codeNote":"name key로 이름을 읽고 score key의 값만 80에서 90으로 바꿉니다.","codeExplain":["1행 「student = {\"name\": \"민수\", \"score\": 80}」 — 「딕셔너리는 “몇 번째”보다 “무슨 항목”이 중요한 데이터에 적합합니다」에서 key와 value로 이루어진 딕셔너리를 student에 저장합니다.","3행 「print(student[\"name\"])」 — 「딕셔너리는 “몇 번째”보다 “무슨 항목”이 중요한 데이터에 적합합니다」에서 student[\"name\"]의 현재 결과를 화면에 , \"price\": 9000},\n    {\"name\": \"키보드\", \"price\": 10000},\n    {\"name\": \"가방\", \"price\": 15000}\n]\n\nfor product in products:\n    if ____:\n        print(____)","practicePrompt":"상품 딕셔너리 3개를 리스트에 넣으세요. 각 상품은 name, price key를 갖게 하고, 1만원 이상 상품 이름만 출력해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c4-p11","answerOnNext":true,"codeExplain":["1행 「products = [」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서 여러 값을 리스트로 묶어 products에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「{\"name\": \"노트\", \"price\": 9000},」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","3행 「{\"name\": \"키보드\", \"price\": 10000},」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","4행 「{\"name\": \"가방\", \"price\": 15000}」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","5행 「]」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","7행 「for product in products:」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」에서는 products에서 값을 하나씩 꺼내 product에 넣습니다. 다음 반복에서는 product가 다음 값으로 바뀝니다.","8행 「if ____:」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","9행 「print(____)」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c4-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"리스트와 딕셔너리를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["바깥 []는 여러 상품을 담는 리스트이고, 각 {}는 상품 하나의 이름·가격을 담는 딕셔너리입니다.","product는 반복 중인 상품 한 개입니다. [\"price\"]는 그 상품의 가격을 꺼냅니다.","9000은 제외하고, 기준과 같은 10000과 더 큰 15000은 포함합니다."],"code":"products = [\n    {\"name\": \"노트\", \"price\": 9000},\n    {\"name\": \"키보드\", \"price\": 10000},\n    {\"name\": \"가방\", \"price\": 15000},\n]\nfor product in products:\n    if product[\"price\"] >= 10000:\n        print(product[\"name\"])","codeNote":"실행 결과 또는 테스트 기준\n키보드\n가방","extras":[],"codeExplain":["1행 「products = [」 — 「리스트와 딕셔너리를 직접 바꾸고 확장합니다 · 풀이」에서 여러 값을 리스트로 합니다 · 풀이","paragraphs":["딕셔너리는 각 값의 의미를 key 이름으로 직접 표현하므로 위치를 기억하지 않아도 됩니다. user[\"age\"]처럼 코드만 봐도 어떤 정보를 사용하는지 알 수 있습니다.","딕셔너리에서는 [\"name\"]처럼 key를 적어 값을 찾습니다. 같은 key에 새 값을 대입하면 그 key가 가리키는 값만 바뀝니다."],"extras":[],"code":"shopping = [\"우유\", \"달걀\"]\nshopping.append(\"빵\")\nprint(shopping)","codeNote":"append는 리스트 맨 뒤에 “빵”을 추가합니다.","codeExplain":["1행 「shopping = [\"우유\", \"달걀\"]」 — 「리스트와 딕셔너리 핵심을 확인합니다 · 풀이」에서 여러 값을 리스트로 묶어 shopping에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「shopping.append(\"빵\")」 — 「리스트와 딕셔너리 핵심을 확인합니다 · 풀이」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","3행 「print(shopping)」 — 「리스트와 딕셔너리 핵심을 확인합니다 · 풀이」에서 shopping의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x01","kind":"concept","title":"리스트는 여러 값을 순서대로 넣는 가방입니다","eyebrow":"초보 확장 · 개념","paragraphs":["변수 하나에 값 하나가 아니라 장보기 목록처럼 여러 값을 모으고 싶을 때 리스트가 편합니다.","대괄호 [ ] 안에 값을 쉼표로 나눠 적고 순서대로 저장합니다.","Python의 위치 번호는 0부터 시작합니다. 첫 번째 값의 인덱스가 0입니다."],"keywords":["list","리스트","index","인덱스"],"extras":[],"code":"fruits = [\"사과\", \"바나나\", \"포도\"]\nprint(fruits[0])\nprint(fruits[-1])","codeNote":"0번은 첫 번째 사과이고 -1은 마지막 포도입니다.","codeExplain":["1행 「fruits = [\"사과\", \"바나나\", \"포도\"]」 — 「리스트는 여러 값을 순서대로 넣는 가방입니다」에서 여러 값을 리스트로 묶어 fruits에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「print(fruits[0])」 — 「리스트는 여러 값을 순서대로 넣는 가방입니다」에서 fruits[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(fruits[-1])」 — 「리스트는 여러 값을 순서대로 넣는 가방입니다」에서 fruits[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x02","kind":"example","title":"리스트의 첫 번째 값은 [0]으로 꺼냅니다","eyebrow":"초보 확장 · 예제","paragraphs":["fruits[0]은 첫 번째 사과, fruits[1]은 두 번째 바나나입니다.","fruits[-1]은 뒤에서 첫 번째, 즉 마지막 포도입니다.","0부터 시작한다는 규칙만 익히면 리스트 읽기가 쉬워집니다."],"code":"fruits = [\"사과\", \"바나나\", \"포도\"]\nprint(fruits[0])\nprint(fruits[-1])","codeNote":"0번은 첫 번째 사과이고 -1은 마지막 포도입니다.","extras":[],"codeExplain":["1행 「fruits = [\"사과\", \"바나나\", \"포도\"]」 — 「리스트의 첫 번째 값은 [0]으로 꺼냅니다」에서 여러 값을 리스트로 묶어 fruits에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「print(fruits[0])」 — 「리스트의 첫 번째 값은 [0]으로 꺼냅니다」에서 fruits[0]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","3행 「print(fruits[-1])」 — 「리스트의 첫 번째 값은 [0]으로 꺼냅니다」에서 fruits[-1]의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x03","kind":"concept","title":"append · remove · len으로 리스트를 바꿔 봅니다","eyebrow":"초보 확장 · 개념","paragraphs":["append는 맨 뒤에 새 값을 하나 추가합니다.","remove는 같은 값을 찾아 첫 번째 항목을 삭제합니다.","len은 리스트 안에 값이 몇 개인지 알려 줍니다."],"extras":[],"code":"shopping = [\"우유\", \"달걀\"]\nshopping.append(\"빵\")\nshopping[0] = \"두유\"\nprint(shopping)","codeNote":"append로 끝에 빵을 추가하고, 0번 위치의 우유를 두유로 바꿉니다.","codeExplain":["1행 「shopping = [\"우유\", \"달걀\"]」 — 「append · remove · len으로 리스트를 바꿔 봅니다」에서 여러 값을 리스트로 묶어 shopping에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「shopping.append(\"빵\")」 — 「append · remove · len으로 리스트를 바꿔 봅니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","3행 「shopping[0] = \"두유\"」 — 「append · remove · len으로 리스트를 바꿔 봅니다」에서 오른쪽 \"두유\"을 먼저 계산하고 그 결과를 shopping[0]에 저장합니다.","4행 「print(shopping)」 — 「append · remove · len으로 리스트를 바꿔 봅니다」에서 shopping의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x04","kind":"example","title":"장보기 목록에 추가하고 삭제해 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["처음에는 우유와 달걀 두 개가 있습니다.","append로 빵을 추가하고 remove로 우유를 지웁니다.","마지막 len은 남은 항목 수 2를 알려 줍니다."],"code":"shopping = [\"우유\", \"달걀\"]\nshopping.append(\"빵\")\nshopping[0] = \"두유\"\nprint(shopping)","codeNote":"append로 끝에 빵을 추가하고, 0번 위치의 우유를 두유로 바꿉니다.","extras":[],"codeExplain":["1행 「shopping = [\"우유\", \"달걀\"]」 — 「장보기 목록에 추가하고 삭제해 봅니다」에서 여러 값을 리스트로 묶어 shopping에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「shopping.append(\"빵\")」 — 「장보기 목록에 추가하고 삭제해 봅니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","3행 「shopping[0] = \"두유\"」 — 「장보기 목록에 추가하고 삭제해 봅니다」에서 오른쪽 \"두유\"을 먼저 계산하고 그 결과를 shopping[0]에 저장합니다.","4행 「print(shopping)」 — 「장보기 목록에 추가하고 삭제해 봅니다」에서 shopping의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c4-x05","kind":"concept","title":"딕셔너리는 이름표가 붙은 서랍장입니다","eyebrow":"초보 확장 · 개념","paragraphs":["리스트가 위치 번호로 찾는다면 딕셔너리는 key라는 이름표로 찾습
