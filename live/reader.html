 조건이 바뀌는 바로 그 지점입니다","eyebrow":"CHAPTER 02 · 개념 10/10","paragraphs":["조건문 오류는 기준에서 멀리 떨어진 값보다 기준 바로 근처에서 잘 나타납니다. ‘20,000원 이상 할인’이면 30,000원만 넣어 보는 것보다 19,999원과 20,000원을 비교해야 합니다.","0도 자주 중요한 경계값입니다. 재고 0, 시도 횟수 0, 빈 목록, 잔액 0처럼 ‘없음’을 의미하는 값에서 알고리즘이 예상대로 움직이는지 확인해야 합니다.","경계값을 찾는 습관은 코딩 실력보다 문제 해석 능력에 가깝습니다. 요구사항에서 ‘이상/초과/이하/미만/최대/최소’ 같은 단어를 보면 바로 경계 테스트를 떠올리세요."],"bullets":["기준: 20,000원 이상 → 19,999 / 20,000 / 20,001","최대 3회 → 2회 / 3회 / 4회 시도","1개 이상 → 0 / 1 / 2개","잔액 부족 판단 → 가격보다 1원 적음 / 정확히 같음 / 1원 많음"],"calloutTitle":"조건 기호보다 먼저 한국어를 확인","calloutBody":"‘이상’은 기준값 포함(>=), ‘초과’는 기준값 제외(>)입니다. 문장을 잘못 읽으면 문법이 맞아도 결과가 틀립니다."},{"id":"t3-c2-p14","kind":"concept","title":"실행된다고 해서 알고리즘이 맞는 것은 아닙니다","eyebrow":"정확성 · correctness","paragraphs":["프로그램이 오류 없이 실행되는 것과 올바른 답을 만드는 것은 다른 문제입니다. 할인 기준을 20,000원으로 해야 하는데 2,000원으로 적어도 코드는 멀쩡히 실행될 수 있습니다.","정확성을 확인하려면 요구사항을 하나씩 체크해야 합니다. 정상값에서 맞는지, 경계값에서 맞는지, 잘못된 입력을 약속한 방식으로 처리하는지 확인합니다.","초보자는 ‘한 번 실행해서 화면에 숫자가 나왔다’를 완료로 착각하기 쉽습니다. 더 좋은 완료 기준은 ‘미리 만든 테스트 예시들이 모두 예상 결과와 같다’입니다."],"bullets":["문법 오류가 없는가?","정상 입력에서 맞는가?","경계값에서 조건이 정확한가?","잘못된 입력에서 이상한 계산을 계속하지 않는가?","상태가 성공한 경우에만 바뀌는가?"],"calloutTitle":"완료 기준","calloutBody":"‘돌아간다’가 아니라 ‘약속한 경우들을 테스트했고 결과가 맞다’가 완료에 가깝습니다."},{"id":"t3-c2-p15","kind":"visual","title":"입력에서 출력까지 알고리즘을 한 줄로 봅니다","eyebrow":"흐름으로 이해하기","paragraphs":["알고리즘을 복잡한 문장으로만 보지 말고 입력 → 처리 → 출력의 큰 흐름 안에 조건과 상태 변화를 넣어 보세요.","입력은 시작 재료이고, 처리는 검사·계산·선택·반복이며, 출력은 최종 결과입니다. 상태는 처리 중간에 바뀌며 다음 판단에 영향을 줍니다.","이 큰 틀을 먼저 잡으면 코드가 길어져도 ‘지금 어느 구간을 보고 있는가’를 잃지 않습니다."],"visual":"IPO_PROJECT","bullets":["입력: 사용자가 준 값, 파일에서 읽은 값, 현재 상태","처리: 검증 → 조건 판단 → 계산 → 상태 변경","출력: 화면 결과, 저장된 값, 바뀐 상태","검증: 준비한 테스트를 넣고 예상 결과와 비교"]},{"id":"t3-c2-p16","kind":"concept","title":"의사코드는 ‘사람이 읽는 정확한 실행 순서’입니다","eyebrow":"코드 전 설계 · pseudocode","paragraphs":["의사코드는 한국어 메모이지만 아무 말이나 적는 것은 아닙니다. 위에서 아래로 읽었을 때 실행 순서가 보이고, 조건과 반복의 범위가 분명해야 합니다.","처음에는 한 줄에 한 행동을 적는 것이 좋습니다. ‘입력을 받고 검사해서 계산한다’보다 ‘입력을 받는다 / 허용값인지 검사한다 / 계산한다’로 나누면 빠진 단계를 찾기 쉽습니다.","들여쓰기도 도움이 됩니다. 조건 안에서만 실행되는 문장은 한 칸 안쪽에 적으면 Python 코드의 구조와 자연스럽게 연결됩니다."],"bullets":["1. 한 줄에는 한 행동이나 한 판단을 적습니다.","2. 입력값과 결과값 이름을 가능한 한 구체적으로 적습니다.","3. 조건은 질문처럼 적습니다.","4. 조건 안에서만 하는 일은 들여써서 묶습니다.","5. 상태가 바뀌는 곳은 ‘값을 줄인다/늘린다/바꾼다’고 적습니다.","6. 마지막에 실제 값 하나를 넣어 처음부터 끝까지 따라갑니다."],"calloutTitle":"좋은 의사코드","calloutBody":"다른 사람이 Python을 몰라도 읽을 수 있고, 개발자는 각 줄을 Python 문법으로 옮길 수 있어야 합니다."},{"id":"t3-c2-p17","kind":"example","title":"자판기 문제로 알고리즘을 처음부터 설계합니다","eyebrow":"핵심 예제 1 · 요구사항 정리","paragraphs":["문제: 자판기에 상품 가격과 재고가 있습니다. 사용자가 돈을 넣으면 상품을 살 수 있는지 판단하고, 성공하면 거스름돈을 보여 주고 재고를 1 줄입니다.","규칙 1: 재고가 0이면 돈이 충분해도 판매하지 않습니다. 규칙 2: 넣은 돈이 가격보다 적으면 판매하지 않습니다. 규칙 3: 판매 성공 시에만 재고를 줄입니다.","입력은 넣은 돈 cash, 상품 가격 price, 현재 재고 stock입니다. 출력은 판매 성공 여부와 거스름돈이며, 상태 변화는 stock 감소입니다.","이 문제의 핵심은 조건 순서와 상태 변경입니다. ‘판매 가능한지 확인한 뒤’에만 재고가 줄어야 합니다."],"bullets":["재고 0 → ‘품절’ 출력, 종료","재고 있음 + 돈 부족 → ‘금액 부족’ 출력, 종료","재고 있음 + 돈 충분 → 거스름돈 계산 → 재고 1 감소 → 상품 제공"],"calloutTitle":"먼저 확인할 것","calloutBody":"실패한 경우에는 stock이 절대 줄어들면 안 됩니다."},{"id":"t3-c2-p18","kind":"example","title":"자판기 문제를 의사코드로 적습니다","eyebrow":"핵심 예제 2 · 의사코드","paragraphs":["이제 방금 정리한 규칙을 실제 문법 없이 한 줄씩 적습니다. 각 줄은 사람이 그대로 따라갈 수 있어야 합니다.","조건의 우선순위도 보입니다. 재고가 없으면 돈을 검사할 필요조차 없으므로 품절 검사를 먼저 둡니다.","판매 성공 경로에서만 거스름돈 계산과 재고 감소가 실행되도록 묶습니다."],"calloutTitle":"의사코드","calloutBody":"cash, price, stock을 준비한다\nstock이 0이면 ‘품절’을 보여 주고 끝낸다\n그렇지 않고 cash가 price보다 작으면 ‘금액 부족’을 보여 주고 끝낸다\n그 외에는 cash - price로 거스름돈을 계산한다\nstock을 1 줄인다\n‘구매 성공’과 거스름돈을 보여 준다","extras":[{"title":"왜 품절을 먼저 검사하나요?","body":"재고가 없으면 결제 가능성을 더 볼 필요가 없습니다. 불필요한 계산을 줄이고 실패 이유도 더 정확하게 보여 줄 수 있습니다."},{"title":"왜 stock 감소가 마지막 쪽에 있나요?","body":"판매 성공이 확정된 뒤에만 상태를 바꾸기 위해서입니다."}]},{"id":"t3-c2-p19","kind":"example","title":"같은 알고리즘에 다른 값을 넣어 추적합니다","eyebrow":"핵심 예제 3 · 추적표","paragraphs":["알고리즘이 맞는지 보려면 한 가지 값만 넣지 않습니다. 서로 다른 길을 타는 입력을 골라야 합니다.","아래 세 경우를 보면 품절 분기, 금액 부족 분기, 구매 성공 분기를 각각 한 번씩 확인할 수 있습니다.","특히 실패한 두 경우에서 stock 값이 그대로인지 확인하세요. 이것이 상태 변화 검증입니다."],"bullets":["A: cash=5000, price=3000, stock=0 → 품절 / stock=0","B: cash=2000, price=3000, stock=2 → 금액 부족 / stock=2","C: cash=5000, price=3000, stock=2 → 구매 성공 / change=2000 / stock=1"]},{"id":"t3-c2-p20","kind":"example","title":"의사코드를 Python으로 옮기면 구조가 그대로 보입니다","eyebrow":"핵심 예제 4 · 코드 연결","paragraphs":["이 코드는 새 문법을 배우기 위한 예제가 아닙니다. 의사코드의 각 문장이 if/elif/else와 변수로 어떻게 옮겨지는지 연결해서 읽는 예제입니다.","첫 if는 품절 분기, elif는 금액 부족 분기, else는 구매 성공 경로입니다. stock -= 1은 성공했을 때만 상태를 바꾸는 줄입니다.","코드를 읽을 때 먼저 출력값을 보지 말고 어떤 조건 경로를 탔는지 확인하세요."],"code":"cash = 5000\nprice = 3000\nstock = 2\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    change = cash - price\n    stock -= 1\n    print(\"구매 성공\")\n    print(\"거스름돈:\", change)\n    print(\"남은 재고:\", stock)","codeNote":"예상 결과\n구매 성공\n거스름돈: 2000\n남은 재고: 1","extras":[{"title":"한 줄 추적","body":"stock==0? → False, cash\u003cprice? → False, else 진입, change=2000, stock=1."}]},{"id":"t3-c2-p21","kind":"practice","title":"도서 대출 가능 여부 알고리즘을 설계하세요","eyebrow":"실습 1 · 조건의 우선순위","paragraphs":["문제: 사용자가 도서관에서 책을 빌리려고 합니다. 연체 중이면 대출할 수 없습니다. 연체가 아니어도 현재 빌린 책이 5권 이상이면 더 빌릴 수 없습니다. 책 재고가 0이어도 빌릴 수 없습니다.","대출이 성공한 경우에만 borrowed_count를 1 늘리고 stock을 1 줄입니다.","코드부터 쓰지 말고 실패 이유를 어떤 순서로 검사할지 의사코드로 적으세요. 그다음 성공한 경우에만 상태가 바뀌는지 확인합니다."],"practicePrompt":"① 입력·현재 상태를 적기 ② 실패 조건 세 가지를 순서대로 배치하기 ③ 성공 경로 적기 ④ 성공 시 borrowed_count와 stock이 어떻게 바뀌는지 적기 ⑤ 최소 4개의 테스트 값을 만들기","answerOnNext":true,"extras":[{"title":"힌트","body":"연체 / 대출 권수 / 재고 중 어떤 것을 먼저 검사해도 요구사항을 만족할 수 있지만, 실패 이유를 명확히 보여 주는 순서를 정하고 끝까지 일관되게 쓰면 됩니다."}]},{"id":"t3-c2-p21-solution","kind":"solution","title":"도서 대출 가능 여부 알고리즘을 설계하세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["입력 또는 상태는 overdue, borrowed_count, stock입니다. 출력은 대출 가능 여부와 실패 이유입니다. 성공 시 borrowed_count는 1 증가하고 stock은 1 감소합니다.","한 가지 가능한 순서는 ① 연체 확인 ② 현재 대출 권수 확인 ③ 재고 확인 ④ 성공 처리입니다. 각 실패 조건에서는 상태를 바꾸지 않고 바로 끝냅니다.","테스트는 연체 중인 경우, 5권을 이미 빌린 경우, 재고 0인 경우, 모든 조건을 통과하는 경우를 최소 하나씩 준비하면 세 실패 길과 성공 길을 확인할 수 있습니다."],"code":"overdue = False\nborrowed_count = 3\nstock = 2\n\nif overdue:\n    print(\"연체 중이라 대출할 수 없습니다\")\nelif borrowed_count >= 5:\n    print(\"대출 한도 5권에 도달했습니다\")\nelif stock == 0:\n    print(\"재고가 없습니다\")\nelse:\n    borrowed_count += 1\n    stock -= 1\n    print(\"대출 성공\")\n    print(\"현재 대출 권수:\", borrowed_count)\n    print(\"남은 재고:\", stock)","codeNote":"성공 예시에서는 borrowed_count=4, stock=1이 됩니다."},{"id":"t3-c2-p22","kind":"practice","title":"주차 요금 알고리즘에서 경계값을 찾으세요","eyebrow":"실습 2 · 경계값","paragraphs":["문제: 주차 30분까지는 무료입니다. 30분을 초과하면 초과한 시간에 대해 10분마다 500원을 받습니다. 10분 단위는 올림합니다. 하루 최대 요금은 20,000원입니다.","이 문제는 정상값 하나만 넣으면 실수하기 쉽습니다. 무료 기준 30분, 과금 단위 10분, 최대 요금이라는 세 종류의 경계가 있습니다.","먼저 필요한 중간값을 정하고, 어떤 순서로 계산해야 최대 요금을 정확히 적용할지 적으세요."],"practicePrompt":"① 29·30·31분 결과 예상 ② 39·40·41분 결과 예상 ③ 매우 긴 시간에서 20,000원을 넘지 않는지 확인 ④ 의사코드 작성 ⑤ Python 코드로 옮기기","answerOnNext":true,"extras":[{"title":"힌트","body":"31분은 초과 시간이 1분이지만 ‘10분 단위 올림’이므로 과금 단위 1개가 필요합니다."}]},{"id":"t3-c2-p22-solution","kind":"solution","title":"주차 요금 알고리즘에서 경계값을 찾으세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["30분 이하면 0원입니다. 30분을 초과하면 extra_minutes = minutes - 30을 만들고, 10분 단위 개수를 올림해 계산합니다.","Python에서 양의 정수 분 단위를 올림하려면 (extra_minutes + 9) // 10 같은 방법을 사용할 수 있습니다. 마지막에 계산 요금이 20,000원을 넘으면 20,000원으로 제한합니다.","중요한 것은 수식 암기가 아니라 순서입니다. 무료 여부 판단 → 초과 시간 계산 → 과금 단위 계산 → 요금 계산 → 최대 요금 제한 순서입니다."],"code":"minutes = 41\n\nif minutes \u003c= 30:\n    fee = 0\nelse:\n    extra_minutes = minutes - 30\n    units = (extra_minutes + 9) // 10\n    fee = units * 500\n    if fee > 20000:\n        fee = 20000\n\nprint(\"주차 요금:\", fee)","codeNote":"29분=0원, 30분=0원, 31분=500원, 40분=500원, 41분=1000원","extras":[{"title":"왜 40분은 500원인가?","body":"무료 30분을 뺀 초과 시간이 정확히 10분이므로 과금 단위는 1개입니다."}]},{"id":"t3-c2-p23","kind":"practice","title":"스탬프 쿠폰 알고리즘의 상태 변화를 추적하세요","eyebrow":"실습 3 · 상태와 반복","paragraphs":["문제: 카페에서 음료 한 잔을 구매할 때마다 스탬프가 1개 늘어납니다. 스탬프가 10개가 되면 무료 쿠폰 1장을 만들고 스탬프 10개를 사용합니다. 한 번에 여러 잔을 구매할 수도 있습니다.","현재 stamps=8이고 한 번에 5잔을 샀다고 해 봅시다. 단순히 stamps += 5만 하면 13이 됩니다. 그다음 쿠폰을 만들고 10을 빼서 stamps=3이 되어야 합니다.","한 번에 25잔처럼 많이 구매하면 쿠폰이 두 장 이상 생길 수도 있습니다. 따라서 한 번만 검사할지 반복해서 검사할지 생각해야 합니다."],"practicePrompt":"① stamps=8, cups=5를 추적하기 ② stamps=8, cups=25를 추적하기 ③ 쿠폰이 여러 장 생길 수 있다는 점을 반영한 의사코드 만들기 ④ 마지막 stamps와 coupons를 확인하기","answerOnNext":true},{"id":"t3-c2-p23-solution","kind":"solution","title":"스탬프 쿠폰 알고리즘의 상태 변화를 추적하세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["구매한 잔 수만큼 stamps를 먼저 늘린 뒤, stamps가 10 이상인 동안 쿠폰을 만들고 stamps에서 10을 뺍니다.","stamps=8, cups=5라면 13이 된 뒤 쿠폰 1장, 남은 stamps=3입니다. stamps=8, cups=25라면 33이 된 뒤 쿠폰 3장, 남은 stamps=3입니다.","조건을 if 한 번만 사용하면 33에서 한 번만 10을 빼 23이 남으므로 규칙을 완전히 처리하지 못합니다. ‘10개 이상인 동안 계속’이라는 요구가 반복 구조를 필요로 합니다."],"code":"stamps = 8\ncups = 25\ncoupons = 0\n\nstamps += cups\n\nwhile stamps >= 10:\n    coupons += 1\n    stamps -= 10\n\nprint(\"쿠폰:\", coupons)\nprint(\"남은 스탬프:\", stamps)","codeNote":"예상 결과\n쿠폰: 3\n남은 스탬프: 3"},{"id":"t3-c2-p24","kind":"check","title":"모호한 요구사항을 그대로 코드로 만들면 왜 위험할까요?","eyebrow":"확인 문제 1 · 요구사항 감사","paragraphs":["요구사항: ‘회원이면 많이 할인한다. 오래된 회원은 더 많이 할인한다.’","AI가 곧바로 member이면 10%, old_member이면 20% 할인하는 코드를 작성했습니다.","코드는 실행될 수 있지만 요구사항에 없는 숫자를 AI가 임의로 채웠습니다. 어떤 질문을 먼저 해야 하는지 최소 네 개 적어 보세요."],"question":"할인 알고리즘을 만들기 전에 어떤 기준과 경계값을 확정해야 하나요?","answerOnNext":true,"extras":[{"title":"힌트 1","body":"회원 할인율과 오래된 회원 할인율이 명시됐나요?"},{"title":"힌트 2","body":"‘오래된 회원’은 가입 후 몇 개월 또는 몇 년인가요?"},{"title":"힌트 3","body":"두 할인을 함께 적용할지, 더 큰 할인 하나만 적용할지 정해졌나요?"}]},{"id":"t3-c2-p24-solution","kind":"solution","title":"모호한 요구사항을 그대로 코드로 만들면 왜 위험할까요? · 풀이","eyebrow":"정답과 풀이","paragraphs":["최소한 일반 회원 할인율, 오래된 회원 기준 기간, 오래된 회원 할인율, 두 조건이 겹칠 때 적용 방식, 할인 가능한 상품 범위, 최대 할인 한도 등을 확인해야 합니다.","AI가 10%와 20%를 정한 것은 요구사항을 구현한 것이 아니라 빈칸을 추측으로 채운 것입니다. 이런 코드는 문법적으로 완벽해도 비즈니스 규칙을 틀릴 수 있습니다.","좋은 대응은 모르는 값을 임의로 정하는 것이 아니라 ‘확정 필요’로 표시하고 질문 목록을 만드는 것입니다."],"calloutTitle":"AI 코드 검토 원칙","calloutBody":"코드에 들어간 숫자·기준·예외가 원래 요구사항에서 실제로 나온 것인지 하나씩 대조하세요."},{"id":"t3-c2-p25","kind":"check","title":"코드를 실행하기 전에 값을 한 줄씩 추적해 보세요","eyebrow":"확인 문제 2 · 추적","paragraphs":["아래 코드를 바로 실행하지 말고 현재 값을 종이에 적으며 따라가 보세요.","시작값은 balance=5000, price=3000입니다. 결제할 수 있으면 balance에서 price를 뺍니다. 그다음 balance가 2000 미만이면 ‘잔액 부족 경고’를 출력합니다.","각 조건이 참인지 거짓인지, 마지막 balance가 얼마인지, 어떤 문장이 출력되는지 먼저 예측하세요."],"code":"balance = 5000\nprice = 3000\n\nif balance >= price:\n    balance -= price\n    print(\"결제 성공\")\nelse:\n    print(\"결제 실패\")\n\nif balance \u003c 2000:\n    print(\"잔액 부족 경고\")\n\nprint(\"남은 잔액:\", balance)","question":"출력되는 문장과 마지막 balance 값은 무엇인가요?","answerOnNext":true},{"id":"t3-c2-p25-solution","kind":"solution","title":"코드를 실행하기 전에 값을 한 줄씩 추적해 보세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["처음 balance는 5000이고 price는 3000입니다. balance >= price는 True이므로 결제 성공 경로로 갑니다.","balance -= price 후 balance는 2000이 됩니다. 다음 조건 balance \u003c 2000은 False입니다. 정확히 2000은 2000보다 작은 값이 아니기 때문입니다.","따라서 ‘결제 성공’과 ‘남은 잔액: 2000’이 출력되고 ‘잔액 부족 경고’는 출력되지 않습니다. 이 예제는 경계값에서 \u003c와 \u003c=의 차이를 보여 줍니다."],"codeNote":"예상 출력\n결제 성공\n남은 잔액: 2000"},{"id":"t3-c2-p26","kind":"practice","title":"AI가 만든 알고리즘에서 상태 변경 버그를 찾으세요","eyebrow":"실습 4 · AI 코드 감사","paragraphs":["문제: 재고가 있고 돈이 충분할 때만 상품을 판매해야 합니다. 판매에 실패하면 재고는 그대로여야 합니다.","AI가 아래 코드를 만들었습니다. 얼핏 보면 품절과 금액 부족을 처리하지만, 실제로는 실패한 경우에도 재고가 줄어드는 문제가 숨어 있습니다.","어떤 입력에서 잘못되는지 하나 이상 만들고, 상태 변경 줄을 어디로 옮겨야 하는지 설명하세요."],"code":"cash = 1000\nprice = 3000\nstock = 2\n\nstock -= 1\n\nif stock \u003c 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    print(\"구매 성공\")","practicePrompt":"① cash=1000, price=3000, stock=2를 추적 ② 마지막 stock 값 확인 ③ 왜 요구사항과 다른지 설명 ④ stock 감소 위치를 고쳐 의사코드와 Python 코드를 다시 작성","answerOnNext":true},{"id":"t3-c2-p26-solution","kind":"solution","title":"AI가 만든 알고리즘에서 상태 변경 버그를 찾으세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["cash가 부족하므로 판매는 실패해야 하고 stock은 2로 남아야 합니다. 하지만 AI 코드는 조건을 검사하기 전에 stock -= 1을 실행해 stock을 1로 바꿉니다.","상태 변경은 판매 성공이 확정된 뒤에만 해야 합니다. 즉 재고와 돈 조건을 모두 통과한 else 블록 안으로 stock -= 1을 옮겨야 합니다.","이런 버그는 문법 오류가 아니라 알고리즘 오류입니다. 실행은 정상적으로 되기 때문에 추적과 상태 검사가 없으면 놓치기 쉽습니다."],"code":"cash = 1000\nprice = 3000\nstock = 2\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    stock -= 1\n    print(\"구매 성공\")\n    print(\"남은 재고:\", stock)","codeNote":"cash=1000이면 금액 부족, stock은 2로 유지됩니다.","extras":[]},{"id":"t3-c2-p27","kind":"summary","title":"알고리즘을 만들고 확인하는 순서를 한 번에 정리합니다","eyebrow":"Chapter 2 정리","paragraphs":["챕터 1에서는 큰 문제를 작은 단계로 나눴습니다. 챕터 2에서는 그 단계를 정확한 순서로 연결하고, 조건에서 길을 나누고, 상태가 언제 바뀌는지 표시하는 법을 배웠습니다.","알고리즘은 코드가 아닙니다. 사람이 읽을 수 있는 해결 순서가 먼저이고, Python의 if·for·while·변수는 그 순서를 표현하는 도구입니다.","좋은 알고리즘은 모호한 표현을 줄이고, 각 단계가 필요한 값을 이미 가지고 있으며, 실패한 경우와 성공한 경우의 상태 변화가 분명합니다.","추적표는 머릿속 실행을 종이에 꺼내는 방법입니다. 정상값 하나만 보지 말고 조건이 바뀌는 경계값과 잘못된 입력을 넣어 서로 다른 경로를 확인해야 합니다.","AI가 만든 코드도 같은 방식으로 봅니다. 숫자와 규칙이 요구사항에서 실제로 나온 것인지, 조건 순서가 맞는지, 상태를 바꾸는 줄이 성공한 경우에만 실행되는지 확인합니다."],"bullets":["문제를 작은 단계로 나눈 뒤 실행 순서를 정한다.","모호한 말은 숫자·기준·질문으로 바꾼다.","조건은 질문, 분기는 갈림길, 상태는 현재 값으로 읽는다.","반복은 같은 규칙을 여러 대상에 적용하는 구조로 본다.","중간값에 이름을 붙여 데이터 흐름을 짧게 만든다.","의사코드로 흐름을 적고 실제 값을 넣어 추적한다.","경계값과 실패 경로까지 테스트해야 정확성을 확인할 수 있다.","AI 코드에서도 상태 변경과 임의의 가정을 먼저 감사한다."],"extras":[]}]},{"id":"t3-c3","track":3,"chapter":3,"title":"상태와 데이터 흐름 추적하기","remember":"코드를 한꺼번에 읽지 말고 각 줄의 실행 전·후 상태와 값의 이동을 추적한다","practiceGoal":"변수·조건·반복이 섞인 코드를 추적표로 읽고, 값이 잘못 바뀌는 지점을 찾는다","pages":[{"id":"t3-c3-g1","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 1/4","title":"값이 바뀌는 코드를 읽기 위한 단어","paragraphs":["이 챕터의 목표는 코드를 더 많이 쓰는 것이 아니라, 이미 있는 코드를 보고 ‘지금 어떤 값이 어디에 들어 있고 다음 줄에서 어떻게 바뀌는가’를 따라가는 힘을 만드는 것입니다.","완전 초보일수록 여러 줄을 한 번에 이해하려고 하면 금방 놓칩니다. 먼저 상태·변수·값·스냅샷 네 단어를 잡으면 코드 한 줄씩 멈춰 읽을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"state 상태","description":"상태는 어렵게 생각할 필요 없습니다. 그냥 ‘프로그램이 지금 기억하고 있는 현재 상황’입니다. 사람으로 치면 지갑에 지금 얼마가 있는지, 게임 캐릭터 체력이 지금 몇인지, 로그인 실패를 지금 몇 번 했는지 같은 것입니다. 값이 바뀌면 상태도 바뀝니다.","usage":"실행 중 무엇이 바뀌었는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: balance가 5000이고 tries가 2인 순간의 전체 상황이 하나의 상태입니다."},{"term":"variable 변수","description":"변수는 값을 넣어 두고 이름으로 다시 찾는 상자라고 생각하면 됩니다. 예를 들어 balance라는 상자에 5000을 넣어 두면, 뒤에서 balance라는 이름만 써도 5000을 다시 사용할 수 있습니다. 나중에 balance에 3000을 넣으면 같은 이름이 이제 3000을 기억합니다.","usage":"상태를 구성하는 각각의 값을 저장할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total = 12000에서 total은 변수입니다."},{"term":"value 값","description":"값은 실제 내용물입니다. 변수는 상자 이름이고 값은 그 상자 안에 들어 있는 내용이라고 생각하면 쉽습니다. 10, \"안녕\", True, [1, 2, 3]처럼 컴퓨터가 실제로 다루는 데이터가 값입니다.","usage":"‘이 줄이 실행된 뒤 실제로 남는 것은 무엇인가’를 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total의 값이 12000에서 15000으로 바뀔 수 있습니다."},{"term":"snapshot 상태 스냅샷","description":"스냅샷은 프로그램을 잠깐 멈춰 놓고 ‘이 순간 각 변수에 뭐가 들어 있지?’를 사진 찍듯 적어 보는 것입니다. 코드가 빨리 실행돼서 따라가기 어려울 때 특정 순간의 값을 고정해서 보는 방법입니다.","usage":"긴 실행 흐름을 여러 시점으로 나눠 비교할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 2번째 반복 직후의 i=1, total=7000을 스냅샷으로 적습니다."}]},{"id":"t3-c3-g2","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 2/4","title":"한 줄씩 따라갈 때 쓰는 단어","paragraphs":["코드가 어렵게 느껴지는 이유 중 하나는 눈으로는 모든 줄이 동시에 보이지만, 컴퓨터는 정해진 순서대로 한 줄씩 처리하기 때문입니다.","추적과 추적표는 컴퓨터의 속도를 사람의 속도로 늦춰 보는 방법입니다. 실제 실행을 머릿속에서 한 단계씩 재현합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"trace 실행 추적","description":"실행 추적은 컴퓨터가 코드를 실행하는 속도를 사람 눈에 맞게 아주 느리게 따라가는 연습입니다. 한 줄이 실행될 때마다 어떤 값이 들어오고, 무엇이 바뀌고, 다음에 어느 줄로 가는지를 차례대로 확인합니다.","usage":"예상 결과가 왜 나왔는지 설명하거나 버그 위치를 좁힐 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total이 0→3000→7000→12000으로 변하는 과정을 한 줄씩 적습니다."},{"term":"trace table 추적표","description":"추적표는 실행 추적을 종이나 표에 적는 방법입니다. 예를 들어 ‘몇 번째 반복인지 / 현재 price가 얼마인지 / total이 얼마가 됐는지’를 한 줄씩 적으면 머릿속으로만 계산할 때보다 훨씬 덜 헷갈립니다.","usage":"조건문·반복문이 섞인 코드를 종이에 풀어 읽을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 반복횟수 | price | total 세 열을 만들어 값을 적습니다."},{"term":"data flow 데이터 흐름","description":"데이터 흐름은 값이 어디에서 들어와서 어디를 거쳐 어디로 나가는지를 말합니다. 물이 수도관을 따라 흐르듯, 입력값도 변수와 계산을 거쳐 마지막 출력으로 이동합니다.","usage":"값이 어디서 생겼고 어디로 전달되는지 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: prices → 반복문 → total → print 순서로 값이 이동합니다."},{"term":"mutation 값 변경","description":"값 변경은 이미 있던 값이 실행 중에 다른 값으로 바뀌는 것입니다. total이 0이었다가 3000이 되고, 다시 7000이 되는 것처럼 ‘기억하고 있던 내용이 달라지는 순간’을 뜻합니다.","usage":"‘어느 줄에서 상태가 달라졌는가’를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total += price는 total의 값을 바꾸는 mutation입니다."}]},{"id":"t3-c3-g3","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 3/4","title":"반복되는 계산을 읽을 때 쓰는 단어","paragraphs":["반복문 안에서는 같은 줄이 여러 번 실행되기 때문에 값이 한 번이 아니라 계속 바뀝니다. 이때 카운터와 누적값을 구분하면 훨씬 덜 헷갈립니다.","반복을 볼 때는 ‘몇 번째인가’와 ‘지금까지 얼마나 모였는가’를 따로 생각하세요.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"iteration 반복 1회","description":"반복 1회는 반복문 안의 코드를 처음부터 끝까지 한 번 실행하는 것입니다. 가격이 세 개라면 첫 번째 가격을 처리하는 1회, 두 번째 가격을 처리하는 1회, 세 번째 가격을 처리하는 1회가 생깁니다.","usage":"몇 번째 반복에서 문제가 생겼는지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 첫 번째 iteration에서 price는 3000입니다."},{"term":"counter 카운터","description":"카운터는 ‘몇 번인지’를 세는 변수입니다. 사람 수를 한 명 볼 때마다 count를 1 늘리거나, 로그인 실패 때마다 tries를 1 늘리는 식입니다. 보통 0에서 시작해 1, 2, 3처럼 올라갑니다.","usage":"성공 횟수, 실패 횟수, 처리한 항목 수를 셀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: count += 1로 처리 건수를 셉니다."},{"term":"accumulator 누적값","description":"누적값은 지금까지 나온 결과를 계속 모아 두는 변수입니다. 장바구니에 물건을 하나 넣을 때마다 총액이 커지는 것과 같습니다. total = 0으로 시작해서 가격을 만날 때마다 더해 가는 방식이 대표적입니다.","usage":"합계·총점·전체 문자열처럼 반복할수록 커지는 결과를 만들 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total += price에서 total이 누적값입니다."},{"term":"dependency 의존관계","description":"의존관계는 뒤의 값이 앞의 값에 기대고 있다는 뜻입니다. final_price를 계산할 때 total이 필요하다면 final_price는 total에 의존합니다. 그래서 final_price가 틀렸을 때 total부터 확인해야 할 수 있습니다.","usage":"오류의 출발점을 뒤에서 앞으로 추적할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: final_price가 total에 의존한다면 total부터 확인해야 합니다."}]},{"id":"t3-c3-g4","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 4/4","title":"흐름이 맞는지 판단할 때 쓰는 단어","paragraphs":["추적의 목적은 숫자를 적는 것에서 끝나지 않습니다. 실행 중 계속 지켜져야 하는 규칙과 입력·출력을 함께 보면 ‘이 값은 애초에 말이 되는가?’를 판단할 수 있습니다.","아래 단어까지 알면 추적표가 단순 메모가 아니라 검증 도구가 됩니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"invariant 불변조건","description":"불변조건은 실행 중 값이 바뀌더라도 절대로 깨지면 안 되는 규칙입니다. 재고는 3개에서 2개, 1개, 0개로 바뀔 수 있지만 -1개가 되면 안 됩니다. 이때 ‘재고는 항상 0 이상’이 불변조건입니다.","usage":"반복문이나 계산 중 이상한 상태가 생겼는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 재고 수량은 처리 도중에도 0보다 작아지면 안 됩니다."},{"term":"input 입력","description":"입력은 프로그램이 일을 시작하려고 밖에서 받는 값입니다. 사용자가 적은 나이, 파일에서 읽은 가격, 함수에 넣어 준 숫자 모두 입력이 될 수 있습니다.","usage":"추적을 시작할 때 어떤 값을 넣었는지 고정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: prices = [3000, 4000, 5000]이 입력입니다."},{"term":"output 출력","description":"출력은 프로그램이 일을 끝내고 밖으로 내놓는 결과입니다. 화면에 보이는 글자, 계산된 숫자, 저장된 파일처럼 사용자가 확인할 수 있는 결과를 뜻합니다.","usage":"추적한 과정이 최종 목표와 맞는지 비교할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 최종 total 12000이 출력입니다."},{"term":"execution order 실행 순서","description":"실행 순서는 컴퓨터가 코드를 실제로 처리하는 차례입니다. 화면에는 코드가 전부 한꺼번에 보이지만 컴퓨터는 한 순간에 한 단계씩 처리합니다. 조건문과 반복문이 있으면 다음에 실행할 줄이 단순히 바로 아래 줄이 아닐 수도 있습니다.","usage":"다음에 어느 줄로 이동하는지 따라갈 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: for 안의 두 줄은 항목 수만큼 다시 실행됩니다."}]},{"id":"t3-c3-slow-start","kind":"concept","eyebrow":"CHAPTER 03 · 아주 천천히 시작하기","title":"코드를 읽는다는 것은 변수 안의 값을 따라가는 일입니다","paragraphs":["처음 코드를 배울 때는 코드를 영어 문장처럼 전부 해석해야 한다고 생각하기 쉽습니다. 하지만 실제로는 훨씬 단순한 방법이 있습니다. 지금 실행되는 한 줄과 그 줄 때문에 바뀌는 값 하나만 보면 됩니다.","예를 들어 total = total + price라는 한 줄을 보겠습니다. total이 현재 3000이고 price가 4000이라면 오른쪽의 total + price를 먼저 계산합니다. 3000 + 4000이므로 7000입니다. 그다음 왼쪽 total에 7000을 다시 저장합니다. 그래서 이 한 줄이 끝난 뒤 total은 3000에서 7000으로 바뀝니다.","여기서 total이라는 글자가 양쪽에 있어 이상해 보일 수 있습니다. 오른쪽 total은 ‘바뀌기 전 현재 값’을 읽는 것이고, 왼쪽 total은 ‘새 결과를 다시 저장할 자리’입니다. 같은 이름이지만 한 줄 안에서 역할이 다릅니다.","이 원리만 이해하면 total += price도 같은 뜻으로 읽을 수 있습니다. ‘현재 total에 price를 더해서 다시 total에 저장한다’는 짧은 표현입니다.","앞으로 코드가 길어져도 한 줄씩 이 방식으로 읽으면 됩니다. 어떤 값이 들어 있었는지, 무엇을 계산했는지, 어느 변수에 새 값을 저장했는지를 차례대로 보면 됩니다."],"code":"total = 3000\nprice = 4000\n\ntotal = total + price\nprint(total)","codeNote":"출력은 7000입니다. 중요한 것은 정답 7000을 외우는 것이 아니라 total이 3000 → 7000으로 바뀌는 과정을 설명할 수 있는 것입니다."},{"id":"t3-c3-p1","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"코드는 ‘글’이 아니라 시간에 따라 변하는 상태입니다","paragraphs":["프로그램의 ‘상태’라는 말이 처음에는 아주 추상적으로 들릴 수 있습니다. 하지만 실제 뜻은 단순합니다. 코드가 실행되는 중간중간에 변수 안에 들어 있는 현재 값들을 합쳐서 상태라고 부릅니다.","예를 들어 통장 앱을 생각해 보겠습니다. 처음 잔액이 10,000원인데 3,000원을 쓰면 잔액이 7,000원이 됩니다. 여기서 프로그램 입장에서는 balance가 10000인 순간과 balance가 7000인 순간이 서로 다른 상태입니다. 같은 프로그램이라도 현재 상태가 다르면 다음 계산 결과가 달라질 수 있습니다.","코드를 읽을 때 문장 뜻만 보는 것보다 ‘이 줄을 실행하기 바로 전에는 값이 얼마였고, 이 줄을 실행한 뒤에는 얼마가 되었나’를 보는 이유가 여기에 있습니다. 코드의 의미는 글자뿐 아니라 그 순간의 값과 함께 결정됩니다.","코드를 처음 보면 우리는 책처럼 위에서 아래로 읽으려 합니다. 하지만 코드의 뜻은 문장만으로 결정되지 않습니다. 같은 줄이라도 그 직전에 변수에 어떤 값이 들어 있었는지에 따라 결과가 달라집니다.","예를 들어 total = total + price라는 줄은 오른쪽의 현재 total과 price를 먼저 읽고 두 값을 더한 뒤, 그 결과를 다시 total이라는 변수에 저장합니다. 눈에는 total이 두 번 보이지만 왼쪽과 오른쪽의 역할이 다릅니다.","그래서 코드를 이해할 때는 ‘이 줄이 무슨 뜻이지?’ 하나만 묻지 말고 ‘실행 직전 값은 무엇이었고, 실행 직후 무엇이 바뀌었지?’를 함께 묻는 것이 좋습니다.","이 질문 습관만 생겨도 AI가 만든 코드에서 값이 이상하게 바뀌는 지점을 훨씬 빨리 찾을 수 있습니다."],"calloutTitle":"한 줄을 읽는 두 질문","calloutBody":"실행 전: 변수 값은 무엇인가? → 실행 후: 어떤 값이 새로 저장되었는가?"},{"id":"t3-c3-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"입력에서 출력까지 화살표를 그리면 길이 보입니다","paragraphs":["코드가 길어지면 처음부터 모든 줄을 이해하려고 하지 않아도 됩니다. 먼저 값 하나가 어디서 들어와서 마지막에 어디로 나가는지만 따라가면 전체 길이 보이기 시작합니다.","장바구니 앱이라면 사용자가 넣은 상품 가격들이 입력입니다. 이 가격들이 반복문을 지나면서 total에 더해지고, 할인 계산을 지나 final_price가 되고, 마지막에는 화면에 표시됩니다. 이 한 줄짜리 흐름을 먼저 잡으면 중간 코드가 훨씬 덜 복잡해 보입니다.","즉 데이터 흐름은 ‘값의 여행 경로’입니다. 출발지, 중간 정류장, 도착지만 먼저 표시한 뒤 각 정류장에서 무슨 일이 일어나는지 천천히 보면 됩니다.","코드가 길어지면 세부 문법보다 먼저 큰 데이터 흐름을 잡으세요. 값이 어디서 들어와 어떤 중간값을 만들고 마지막에 어디로 나가는지 화살표로 적습니다.","예를 들어 상품 가격 리스트가 입력되고, 반복문에서 total이라는 누적값으로 모인 뒤, 할인 계산을 거쳐 final_price가 되고, 마지막에 print로 출력될 수 있습니다.","중간값이 많아도 화살표는 한 번에 전부 그릴 필요가 없습니다. 지금 궁금한 출력 하나를 고른 뒤 그 값이 의존하는 변수만 거꾸로 따라가도 됩니다."],"visual":"INPUT_TO_OUTPUT","bullets":["prices 입력 → 반복문에서 total 계산","total → 할인 조건 판단","할인 결과 → final_price","final_price → 화면 출력"]},{"id":"t3-c3-example1","kind":"example","eyebrow":"예제로 연결하기","title":"누적값은 매 반복마다 ‘이전 결과 + 새 값’으로 바뀝니다","paragraphs":["여기서 가장 중요한 것은 total이 매 반복마다 새로 생기는 값이 아니라는 점입니다. total은 앞에서 계산한 결과를 계속 기억하는 변수입니다.","처음에는 total이 0입니다. 첫 번째 가격 3000을 만나면 0+3000이 되어 3000을 기억합니다. 두 번째 가격 4000을 만날 때는 다시 0에서 시작하는 것이 아니라 이미 기억하고 있던 3000에 4000을 더해 7000이 됩니다.","이 과정을 ‘누적한다’고 부릅니다. 장바구니에 물건을 하나씩 넣을 때 총액이 계속 커지는 것과 똑같습니다. 그래서 total 같은 누적값은 반복문을 이해할 때 아주 자주 등장합니다.","아래 코드는 가격 세 개를 차례로 더합니다. 핵심은 total이 매번 0에서 다시 시작하지 않고 이전 반복의 결과를 기억한다는 점입니다.","첫 번째 반복 전 total은 0입니다. price가 3000이 되면 total은 3000이 됩니다. 두 번째 반복에서는 그 3000이 그대로 남아 있으므로 3000 + 4000 = 7000이 됩니다.","세 번째 반복에서 7000 + 5000 = 12000이 되고 반복이 끝납니다. 이처럼 누적값은 실행의 과거를 숫자 하나에 압축해서 기억합니다."],"code":"prices = [3000, 4000, 5000]\ntotal = 0\n\nfor price in prices:\n    total = total + price\n\nprint(total)","codeNote":"예상 출력은 12000입니다. total의 변화만 따로 적으면 0 → 3000 → 7000 → 12000입니다.","codeExplain":["1단계: 1행: prices에 세 가격을 입력으로 저장합니다.","2단계: 2행: 아직 아무 가격도 더하지 않았으므로 누적값 total을 0에서 시작합니다.","3단계: 4행: prices에서 값을 하나씩 꺼내 price에 넣습니다.","4단계: 5행: 현재 total과 현재 price를 더한 결과를 다시 total에 저장합니다.","5단계: 7행: 반복이 모두 끝난 뒤 최종 누적값을 출력합니다."]},{"id":"t3-c3-p2","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"추적표에는 ‘필요한 값만’ 적습니다","paragraphs":["추적표는 어려운 표를 만드는 공부가 아닙니다. 머릿속으로 여러 값을 동시에 기억하기 힘드니, 필요한 숫자 몇 개를 종이에 대신 적어 두는 것입니다.","예를 들어 가격을 더하는 코드라면 모든 변수를 적을 필요가 없습니다. 지금 몇 번째 가격을 보고 있는지, 현재 price가 얼마인지, total이 얼마가 되었는지만 적어도 충분합니다.","코드가 30줄이어도 실제로 궁금한 값이 total 하나라면 total에 영향을 주는 변수만 추적하면 됩니다. 이렇게 범위를 줄이면 긴 코드도 한 번에 이해해야 한다는 부담이 크게 줄어듭니다.","처음 추적표를 만들 때 모든 변수를 다 적으려고 하면 표가 코드보다 복잡해질 수 있습니다. 지금 확인하려는 결과에 영향을 주는 값부터 고르세요.","앞 예제라면 반복 횟수, price, total 세 열이면 충분합니다. 첫 번째 행에는 price=3000, total=3000을 적고, 두 번째 행에는 price=4000, total=7000을 적습니다.","조건문이 있다면 조건 결과 True/False 열을 하나 더 넣으면 좋습니다. 그러면 ‘왜 이 분기로 들어갔는가’가 숫자와 함께 보입니다.","추적표는 정답지가 아닙니다. 내 머릿속 예상 실행을 밖으로 꺼내 놓는 도구입니다. 실제 출력과 다르면 표에서 처음 어긋나는 행을 찾으면 됩니다."],"bullets":["반복 번호","이번에 들어온 값","바뀌기 전 값","바뀐 뒤 값","필요하면 조건 결과 True/False"]},{"id":"t3-c3-example2","kind":"example","eyebrow":"예제로 연결하기","title":"값을 초기화하는 위치 하나가 전체 결과를 바꿉니다","paragraphs":["이 예제는 초보자가 정말 자주 헷갈리는 부분을 보여 줍니다. total = 0이라는 같은 한 줄도 ‘어디에 놓이느냐’에 따라 완전히 다른 결과를 만듭니다.","반복문 밖에 있으면 프로그램이 시작할 때 한 번만 total을 0으로 만듭니다. 그다음에는 이전 합계를 계속 기억할 수 있습니다. 반대로 반복문 안에 있으면 새 가격을 볼 때마다 total을 다시 0으로 지웁니다.","그래서 마지막에는 세 가격의 합계가 아니라 마지막 가격 5000만 남습니다. 코드는 오류 없이 실행되므로 컴퓨터는 아무 경고도 하지 않습니다. 이런 문제를 찾으려면 값이 언제 초기화되고 언제 바뀌는지 추적해야 합니다.","아래 코드는 겉보기에는 앞 예제와 비슷하지만 total = 0이 반복문 안에 있습니다. 그래서 매 반복이 시작될 때 지금까지 모은 합계를 지워 버립니다.","첫 번째 반복에서는 3000, 두 번째에서는 4000, 세 번째에서는 5000이 total에 들어갑니다. 마지막 반복이 끝난 뒤 남는 값은 5000뿐입니다.","이런 버그는 문법 오류가 아니어서 코드가 정상 실행됩니다. 그래서 ‘실행됐으니 맞다’가 아니라 상태가 언제 초기화되는지 추적해야 합니다."],"code":"prices = [3000, 4000, 5000]\n\nfor price in prices:\n    total = 0\n    total = total + price\n\nprint(total)","codeNote":"이 코드는 12000이 아니라 5000을 출력합니다. total = 0의 위치가 반복 밖인지 안인지가 핵심입니다.","codeExplain":["1단계: 1행: 세 가격을 준비합니다.","2단계: 3행: 각 가격마다 반복을 시작합니다.","3단계: 4행: 반복할 때마다 total을 0으로 다시 만듭니다. 이전 합계가 여기서 사라집니다.","4단계: 5행: 0 + 현재 price만 계산하므로 이번 가격만 남습니다.","5단계: 7행: 마지막 반복에서 남은 5000이 출력됩니다."]},{"id":"t3-c3-p3","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"조건문을 추적할 때는 값보다 ‘선택된 길’을 함께 적습니다","paragraphs":["조건문이 들어가면 숫자만 보는 것으로는 부족합니다. 같은 값이 있어도 조건이 True인지 False인지에 따라 다음에 실행되는 코드가 달라지기 때문입니다.","예를 들어 stock이 0이면 품절 안내로 가고, stock이 3이면 결제 코드로 갑니다. 이때 중요한 것은 ‘stock이 얼마인가’와 함께 ‘stock > 0의 결과가 True인가 False인가’를 적는 것입니다.","조건이 여러 개라면 위에서부터 어떤 조건을 검사했고 어느 지점에서 처음 True가 되었는지를 표시하세요. 그러면 왜 특정 코드가 실행되고 다른 코드는 건너뛰었는지 눈에 보입니다.","조건문에서는 변수 값만 적으면 왜 어떤 코드가 실행되지 않았는지 놓칠 수 있습니다. 조건식의 결과와 실제로 선택된 분기를 함께 기록하세요.","예를 들어 stock > 0이 True였다면 결제 가능 경로로 들어가고, False였다면 품절 경로로 갑니다. 여기서 중요한 것은 두 길이 동시에 실행되지 않는다는 점입니다.","여러 elif가 있으면 위에서부터 검사하다 처음 True가 된 분기 하나를 선택합니다. 추적표에 각 조건의 결과를 적으면 조건 순서가 잘못된 문제도 찾기 쉽습니다.","AI가 긴 조건문을 만들었을 때도 입력 하나를 정하고 ‘첫 조건은? 다음 조건은? 실제로 어디에 들어갔나?’만 차례대로 확인하면 됩니다."]},{"id":"t3-c3-p4","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"불변조건은 ‘이 상태는 절대 나오면 안 된다’를 알려줍니다","paragraphs":["불변조건이라는 이름은 어렵지만 뜻은 간단합니다. 값이 계속 바뀌는 중에도 ‘이 선만큼은 절대 넘으면 안 된다’고 정한 안전 규칙입니다.","재고가 3개라면 판매할 때 3→2→1→0으로 바뀌는 것은 정상입니다. 하지만 -1이 되는 순간은 이상합니다. 이때 ‘재고는 0보다 작아지면 안 된다’가 불변조건입니다.","이런 규칙을 미리 알고 있으면 마지막 결과까지 기다리지 않아도 됩니다. 중간에 stock이 -1이 되는 순간 바로 ‘여기서부터 잘못됐다’고 찾을 수 있습니다.","추적표를 적다 보면 값은 계속 변합니다. 그중에는 변해도 되는 값과 어떤 순간에도 규칙을 깨면 안 되는 값이 있습니다.","예를 들어 재고가 3개인 상품을 한 개씩 판매한다면 stock은 3→2→1→0으로 바뀔 수 있습니다. 하지만 -1이 되는 순간은 허용하면 안 됩니다. ‘stock >= 0’은 이 과정에서 지켜야 할 불변조건입니다.","불변조건을 미리 정해 두면 최종 출력이 틀렸을 때까지 기다리지 않고 중간 상태에서 이상을 발견할 수 있습니다.","초보 단계에서는 거창하게 생각하지 말고 ‘이 값은 절대로 음수가 되면 안 됨’, ‘처리한 개수는 전체 개수보다 클 수 없음’처럼 한 문장으로 적으면 충분합니다."]},{"id":"t3-c3-example3","kind":"example","eyebrow":"예제로 연결하기","title":"카운터와 누적값은 역할이 다릅니다","paragraphs":["count와 total은 둘 다 숫자라서 비슷해 보이지만 맡은 일이 다릅니다. count는 몇 개인지 세고, total은 금액을 모읍니다.","7000원짜리 상품 하나를 만나면 count는 1만 늘지만 total은 7000이 늘어납니다. 다음에 9000원짜리 상품을 만나면 count는 다시 1 늘어 2가 되고, total은 9000이 더해져 16000이 됩니다.","같은 반복문 안에 있는 변수라도 ‘무엇을 기억하려고 만든 변수인지’를 먼저 정하면 값 변화가 훨씬 쉽게 읽힙니다.","아래 코드는 주문 가격 중 5000원 이상인 항목의 개수와 금액 합계를 동시에 구합니다. count는 몇 개인지 세는 카운터이고, total은 금액을 모으는 누적값입니다.","같은 반복 안에서 두 변수가 모두 바뀌지만 변화 규칙이 다릅니다. count는 조건을 만족할 때마다 1씩 늘고, total은 해당 가격만큼 늘어납니다.","변수 이름과 역할을 구분해 놓으면 추적할 때 ‘왜 이 값이 1 늘었지?’와 ‘왜 이 값이 7000 늘었지?’를 혼동하지 않습니다."],"code":"prices = [3000, 7000, 9000]\ncount = 0\ntotal = 0\n\nfor price in prices:\n    if price >= 5000:\n        count += 1\n        total += price\n\nprint(count, total)","codeNote":"예상 출력은 2 16000입니다. 7000과 9000 두 항목만 조건을 만족합니다.","codeExplain":["1단계: 2행: 조건을 만족한 항목 수를 셀 count를 0으로 시작합니다.","2단계: 3행: 조건을 만족한 금액을 모을 total도 0으로 시작합니다.","3단계: 6행: 현재 가격이 5000 이상인지 검사합니다.","4단계: 7행: 조건을 만족한 항목 하나를 발견했으므로 count를 1 늘립니다.","5단계: 8행: 그 항목의 가격을 total에 더합니다.","6단계: 10행: 최종 개수와 합계를 함께 확인합니다."]},{"id":"t3-c3-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"추적표를 만들어 최종 값을 먼저 예상하세요","paragraphs":["이 실습에서는 코드를 외우는 것이 아니라 값이 움직이는 순서를 천천히 적는 것이 목표입니다. 바로 정답을 계산하려 하지 말고 반복 한 번마다 무엇이 바뀌는지만 확인하세요.","종이에 n, 조건 결과, score 세 칸을 만들고 첫 번째 반복부터 한 줄씩 적으면 됩니다. 머릿속에서 한 번에 계산할 필요가 없습니다.","아래 코드를 바로 실행하지 말고 먼저 손으로 추적해 보세요. 표에는 n, 조건 결과, score 세 열을 만들면 충분합니다.","score가 바뀌는 줄은 조건 안에 있으므로 모든 반복에서 값이 변하지는 않습니다. 어느 반복에서 그대로 유지되는지도 표시하세요.","마지막에는 출력값만 적지 말고 score가 어떤 순서로 변했는지 화살표로 적어 보세요."],"practicePrompt":"① n이 1, 2, 3, 4일 때 n % 2 == 0이 True인지 적기 ② score의 변화를 적기 ③ 최종 출력 예상하기","code":"score = 0\n\nfor n in [1, 2, 3, 4]:\n    if n % 2 == 0:\n        score += n\n\nprint(score)","answerOnNext":true},{"id":"t3-c3-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"추적표를 만들어 최종 값을 먼저 예상하세요 · 풀이","paragraphs":["풀이에서는 score 하나만 따라가면 됩니다. n이 홀수일 때는 조건이 False라 아무것도 더하지 않고, 짝수일 때만 현재 n을 score에 더합니다.","n=1에서는 짝수 조건이 False라서 score는 0 그대로입니다. n=2에서는 True라서 2가 더해져 score=2가 됩니다.","n=3에서는 다시 False라서 score는 2를 유지합니다. n=4에서는 True라서 4가 더해져 score=6이 됩니다.","중요한 점은 반복할 때마다 score가 초기화되지 않는다는 것입니다. 조건이 False인 반복에서도 이전 값은 그대로 남습니다."],"code":"n=1 → False → score 0\nn=2 → True  → score 2\nn=3 → False → score 2\nn=4 → True  → score 6","codeNote":"최종 출력은 6입니다."},{"id":"t3-c3-check","kind":"check","eyebrow":"확인 문제","title":"상태 추적의 핵심을 확인합니다","paragraphs":["이 확인 문제는 용어를 외웠는지보다 ‘이전 값을 기억해야 하는 이유’를 자기 말로 설명할 수 있는지 확인합니다.","다음 질문은 문법 암기가 아니라 실행을 읽는 방법을 확인하는 문제입니다.","답할 때 ‘어느 줄에서 이전 값이 사라지는가’를 우선 찾아보세요."],"question":"반복문으로 합계를 구하는 코드에서 누적값을 반복문 안에서 매번 0으로 다시 만들면 왜 최종 합계가 나오지 않을까요?","answerOnNext":true},{"id":"t3-c3-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"상태 추적의 핵심을 확인합니다 · 풀이","paragraphs":["풀이에서는 score 하나만 따라가면 됩니다. n이 홀수일 때는 조건이 False라 아무것도 더하지 않고, 짝수일 때만 현재 n을 score에 더합니다.","누적값은 이전 반복까지의 결과를 기억해야 합니다. 그런데 반복문 안에서 매번 0으로 대입하면 그 기억을 지운 뒤 현재 값만 더하게 됩니다.","따라서 합계를 위한 누적값은 일반적으로 반복이 시작되기 전에 한 번 초기화하고, 반복 안에서는 이전 값에 새 값을 더하는 형태로 갱신합니다."]},{"id":"t3-c3-summary","kind":"summary","eyebrow":"Chapter 3 정리","title":"값의 변화가 보이면 긴 코드도 읽을 수 있습니다","paragraphs":["이 챕터에서 가장 먼저 기억할 것은 ‘코드를 한꺼번에 이해하려 하지 않아도 된다’는 점입니다. 한 줄씩 실행 순서대로 보면서 바뀌는 값만 적으면 긴 코드도 작은 단계들의 연속으로 바뀝니다.","상태 추적은 개발자만 쓰는 특별한 기술이 아니라, 코드를 천천히 읽기 위한 기본 도구입니다. 실행 전과 실행 후를 나누고, 바뀌는 변수만 기록하면 됩니다.","반복문에서는 iteration마다 카운터와 누적값이 어떻게 변하는지 보고, 조건문에서는 True/False와 선택된 경로를 함께 적습니다.","다음 챕터에서는 이렇게 읽은 흐름을 반대로 사용합니다. 즉, 원하는 동작을 만들기 위해 순차 실행·조건·반복을 어떻게 배치할지 직접 설계합니다."],"bullets":["값이 이상하면 마지막 출력부터 보지 말고 처음 어긋난 상태를 찾는다.","추적표는 필요한 변수와 조건 결과만 적는다.","카운터·누적값·불변조건의 역할을 구분한다.","실행됨과 정답은 다르다. 상태가 의도대로 변했는지 확인한다."]}]},{"id":"t3-c4","track":3,"chapter":4,"title":"조건과 반복으로 흐름 설계하기","remember":"순차 실행·분기·반복 중 어떤 흐름이 필요한지 먼저 고르고, 종료 조건과 경계값을 확인한다","practiceGoal":"자연어 규칙을 if·for·while 흐름으로 바꾸고 무한 반복과 한 칸 차이 오류를 예방한다","pages":[{"id":"t3-c4-g1","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 1/4","title":"프로그램의 길을 설계할 때 쓰는 단어","paragraphs":["챕터 3에서는 이미 있는 코드를 따라갔습니다. 이제는 반대로 ‘이 문제라면 어떤 길을 만들어야 할까?’를 설계합니다.","프로그램의 흐름은 복잡해 보여도 크게 순차 실행, 조건에 따른 분기, 반복 세 가지를 조합한 것입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"control flow 제어 흐름","description":"제어 흐름은 프로그램이 어느 길로 움직이는지를 말합니다. 위에서 아래로 그대로 갈 수도 있고, 조건에 따라 길이 갈라질 수도 있고, 반복문 때문에 같은 구간을 다시 돌 수도 있습니다.","usage":"코드의 길이 어디서 갈리고 어디서 되돌아오는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 입력 → 검사 → 계산 → 출력이 하나의 control flow입니다."},{"term":"sequence 순차 실행","description":"순차 실행은 가장 단순한 흐름입니다. 1번 일을 하고, 그다음 2번 일을 하고, 그다음 3번 일을 하는 식으로 위에서 아래로 한 번씩 진행합니다.","usage":"항상 같은 순서로 해야 하는 단계에 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 이름 받기 → 인사문 만들기 → 출력하기."},{"term":"condition 조건","description":"조건은 ‘맞아, 아니야?’처럼 True 또는 False로 답할 수 있는 기준입니다. 예를 들어 age >= 19는 ‘나이가 19 이상인가?’라는 질문을 코드로 적은 것입니다.","usage":"다음에 어느 길로 갈지 결정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total >= 50000."},{"term":"boolean 참·거짓 값","description":"boolean은 True와 False 둘 중 하나인 값입니다. ‘로그인했는가’, ‘재고가 있는가’, ‘성인인가’처럼 예/아니오로 나뉘는 상황을 컴퓨터가 표현할 때 씁니다.","usage":"분기 여부를 명확하게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: stock > 0의 결과가 True이면 재고가 있다는 뜻입니다."}]},{"id":"t3-c4-g2","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 2/4","title":"길이 갈라질 때 쓰는 단어","paragraphs":["분기는 현실의 규칙을 코드의 길로 옮기는 방법입니다. 모든 경우를 똑같이 처리하지 않고 상황에 따라 다른 행동을 선택합니다.","조건이 많아질수록 순서가 중요해집니다. 넓은 조건을 먼저 두면 더 구체적인 조건이 영원히 선택되지 않을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"branch 분기","description":"분기는 길이 갈라지는 것입니다. 비가 오면 우산을 챙기고, 비가 안 오면 그냥 나가는 것처럼 조건 결과에 따라 프로그램도 서로 다른 코드를 실행합니다.","usage":"회원·비회원, 성공·실패처럼 처리 방식이 달라질 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: if/else는 두 갈래 branch를 만듭니다."},{"term":"if","description":"if는 ‘이 조건이 맞으면 아래 코드를 실행해’라는 뜻입니다. if 뒤의 조건이 True일 때만 들여쓰기된 코드가 실행됩니다.","usage":"어떤 규칙을 만족할 때만 행동해야 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: if age >= 19:."},{"term":"elif","description":"elif는 ‘앞 조건은 아니었는데, 그럼 이 조건은 어때?’라는 뜻입니다. 여러 선택지 중 하나를 고를 때 if 다음에 이어서 사용합니다.","usage":"등급처럼 여러 구간 중 하나를 선택할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: elif score >= 80:."},{"term":"guard clause 조기 차단","description":"조기 차단은 잘못된 입력을 초반에 바로 걸러 내는 방법입니다. 예를 들어 나이가 -3이라면 뒤의 할인 계산까지 보내지 않고 처음부터 ‘잘못된 나이’라고 끝내는 식입니다.","usage":"잘못된 값이 뒤 계산으로 흘러가는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 금액이 음수면 바로 오류를 알리고 계산을 멈춥니다."}]},{"id":"t3-c4-g3","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 3/4","title":"같은 일을 되풀이할 때 쓰는 단어","paragraphs":["반복은 ‘같은 코드를 여러 번 쓰지 않기 위해서’만 존재하는 것이 아닙니다. 여러 데이터 항목을 같은 규칙으로 처리하거나 어떤 조건이 만족될 때까지 작업을 계속하는 구조입니다.","for와 while의 차이를 문법으로 외우기보다 반복 횟수를 미리 아는지, 종료 조건을 계속 확인해야 하는지로 판단하면 쉽습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"loop 반복","description":"반복은 같은 종류의 일을 여러 번 하는 것입니다. 상품 100개를 하나씩 확인할 때 코드를 100번 복사하지 않고 반복문 하나로 처리합니다.","usage":"여러 항목을 처리하거나 조건이 바뀔 때까지 일을 계속할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 가격 리스트의 모든 항목을 하나씩 확인합니다."},{"term":"iteration 반복 1회","description":"반복 1회는 반복문 안의 코드를 처음부터 끝까지 한 번 실행하는 것입니다. 가격이 세 개라면 첫 번째 가격을 처리하는 1회, 두 번째 가격을 처리하는 1회, 세 번째 가격을 처리하는 1회가 생깁니다.","usage":"몇 번째 반복에서 어떤 값이 나왔는지 추적할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 세 항목이면 보통 세 번의 iteration이 있습니다."},{"term":"for","description":"for는 ‘여기 있는 것들을 하나씩 꺼내서 처리해’에 가깝습니다. 리스트에 사과, 바나나, 포도가 있으면 첫 번째부터 하나씩 꺼내 같은 작업을 할 수 있습니다.","usage":"처리할 항목이 명확할 때 주로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: for price in prices:."},{"term":"while","description":"while은 ‘이 조건이 맞는 동안 계속해’라는 뜻입니다. 몇 번 할지보다 언제 끝날지가 더 중요한 반복에 자주 사용합니다.","usage":"몇 번 반복할지보다 ‘언제 끝낼지’가 중요한 문제에 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: while tries \u003c 3:."}]},{"id":"t3-c4-g4","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 4/4","title":"반복이 멈추는지 확인할 때 쓰는 단어","paragraphs":["while은 특히 종료 조건이 중요합니다. 조건이 계속 True로 남으면 프로그램이 끝나지 않습니다. 반복 변수를 어떻게 바꾸는지까지 한 세트로 봐야 합니다.","또 반복의 시작과 끝에서 하나를 더 처리하거나 덜 처리하는 실수가 자주 생깁니다. 이런 오류를 이름으로 알아두면 찾기가 쉬워집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"termination condition 종료 조건","description":"종료 조건은 반복이 언제 멈출지를 결정하는 기준입니다. while에서는 이 조건이 언젠가 False가 되어야 반복이 끝납니다.","usage":"while을 설계할 때 반드시 확인합니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: tries \u003c 3은 tries가 3이 되면 False가 됩니다."},{"term":"infinite loop 무한 반복","description":"무한 반복은 반복이 끝나는 조건이 영원히 만들어지지 않아 계속 도는 상태입니다. count \u003c 3인데 count를 한 번도 늘리지 않으면 count는 계속 0이라 반복이 끝나지 않습니다.","usage":"프로그램이 멈추지 않는 원인을 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: while count \u003c 3인데 count를 증가시키지 않으면 끝나지 않습니다."},{"term":"off-by-one 한 칸 차이 오류","description":"한 칸 차이 오류는 딱 하나를 더 하거나 덜 해서 생기는 실수입니다. 세 번 반복해야 하는데 두 번만 하거나, 0부터 4까지 다섯 개를 처리해야 하는데 네 개만 처리하는 경우가 대표적입니다.","usage":"횟수·인덱스·범위의 시작과 끝을 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 1~3까지 세 번 해야 하는데 1~2까지만 실행되는 경우입니다."},{"term":"break·continue","description":"break는 반복 전체를 여기서 끝내는 것이고, continue는 이번 한 번만 건너뛰고 다음 반복으로 가는 것입니다. ‘퇴근’과 ‘이번 일만 패스’ 정도로 차이를 생각하면 쉽습니다.","usage":"특정 상황에서 반복의 일반 흐름을 바꿀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 잘못된 항목을 continue로 건너뛸 수 있습니다."}]},{"id":"t3-c4-slow-start","kind":"concept","eyebrow":"CHAPTER 04 · 아주 천천히 시작하기","title":"if·for·while은 컴퓨터에게 길을 알려 주는 표지판입니다","paragraphs":["if, for, while을 처음 보면 서로 다른 어려운 문법처럼 보이지만 실제로는 프로그램의 이동 방법을 정하는 세 가지 표지판이라고 생각하면 됩니다.","if는 갈림길입니다. ‘조건이 맞으면 이쪽으로 가고, 아니면 다른 쪽으로 가라’고 정합니다. for는 목록을 하나씩 꺼내는 반복입니다. ‘이 목록에 있는 것들을 하나씩 전부 처리해라’에 가깝습니다. while은 조건을 확인하면서 계속 도는 반복입니다. ‘이 조건이 맞는 동안 계속해라’라는 뜻입니다.","예를 들어 학교 출입을 생각해 보겠습니다. 학생증이 있으면 들어가고 없으면 안내실로 간다면 if입니다. 학생 30명의 이름을 하나씩 확인한다면 for입니다. 대기 번호가 내 번호가 될 때까지 계속 전광판을 확인한다면 while과 비슷합니다.","코드를 만들 때는 먼저 현실의 행동을 이 세 가지 중 어디에 해당하는지 나눕니다. 그다음 Python 문법으로 옮기면 됩니다. 문법을 먼저 고르는 것보다 훨씬 쉽습니다."]},{"id":"t3-c4-p1","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"먼저 ‘한 번’, ‘갈림’, ‘되풀이’로 문장을 표시하세요","paragraphs":["프로그램 흐름을 설계할 때 처음부터 if, for, while 문법을 떠올릴 필요는 없습니다. 먼저 해야 할 일을 한국어 문장으로 적고, 그 문장이 어떤 종류인지 나누면 됩니다.","항상 한 번 하는 일은 순서대로 실행하면 됩니다. 어떤 상황에서만 하는 일은 조건이 필요합니다. 같은 일을 여러 대상에 해야 한다면 반복이 필요합니다.","예를 들어 ‘상품을 모두 본다 → 재고가 있는 상품만 금액을 더한다 → 마지막에 합계를 보여 준다’라는 문장에서 ‘모두 본다’는 반복, ‘재고가 있는 상품만’은 조건, ‘합계를 보여 준다’는 마지막 순차 실행입니다.","자연어 요구사항을 보면 문법 이름부터 고르지 말고 각 문장이 어떤 흐름인지 표시합니다. 한 번만 하는 일은 순차 실행, 상황에 따라 달라지는 일은 분기, 여러 번 해야 하는 일은 반복입니다.","예를 들어 ‘상품 목록을 모두 확인한다. 재고가 있는 상품만 금액에 더한다. 마지막에 합계를 보여 준다’에서 ‘모두 확인한다’는 반복, ‘재고가 있는 상품만’은 분기, ‘합계를 보여 준다’는 순차 실행입니다.","이렇게 문제 문장을 흐름 유형으로 번역하면 필요한 문법이 뒤에서 자연스럽게 결정됩니다. for 안에 if가 들어가는 이유도 문장 자체가 ‘각 항목마다 조건을 확인한다’이기 때문입니다.","복잡한 코드는 결국 이 세 구조가 겹친 것입니다. 한 겹씩 분리해서 보면 초보자도 설계할 수 있습니다."]},{"id":"t3-c4-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"제어 흐름은 직선·갈림길·되돌아오는 길의 조합입니다","paragraphs":["제어 흐름은 도로라고 생각하면 쉽습니다. 직진만 있는 길도 있고, 신호등에서 두 갈래로 나뉘는 길도 있고, 로터리처럼 같은 구간을 다시 도는 길도 있습니다.","코드도 똑같습니다. 일반 코드는 아래로 직진합니다. if를 만나면 조건에 따라 길이 갈라집니다. for나 while을 만나면 일정 구간을 다시 실행합니다.","복잡한 프로그램도 결국 이 세 가지 길이 여러 번 연결된 것입니다. 처음에는 화살표 몇 개로 길을 그린 뒤 그 길을 Python 문법으로 옮기면 됩니다.","순차 실행은 화살표가 아래로만 내려갑니다. 분기는 조건에서 두 개 이상의 길로 갈라지고, 반복은 일정 구간을 다시 위로 돌아옵니다.","코드로 보기 전에 간단한 화살표 그림을 그리면 잘못된 순서나 빠진 경로를 찾기 쉽습니다.","특히 오류 처리 경로를 정상 경로와 분리해 그리면 뒤 코드가 덜 복잡해집니다."],"visual":"CONTROL_FLOW","bullets":["순차 실행: A → B → C","분기: 조건 → True 길 / False 길","반복: 조건 또는 항목 → 본문 → 다시 확인","끝나는 지점: 모든 경로가 어디에서 종료되는지 표시"]},{"id":"t3-c4-p2","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"조건 순서는 ‘더 구체적인 것부터’ 확인하면 안전합니다","paragraphs":["elif가 여러 개 있을 때 Python은 모든 조건을 끝까지 검사하지 않습니다. 위에서부터 보다가 처음 True가 나온 순간 그 길로 들어가고 나머지는 건너뜁니다.","그래서 점수 조건에서 80점 이상을 먼저 두고 90점 이상을 그 아래 두면 문제가 생깁니다. 95점도 80점 이상이므로 첫 조건에서 이미 True가 되어 B로 끝나기 때문입니다.","이런 코드는 문법 오류가 나지 않습니다. 컴퓨터는 우리가 적은 순서 그대로 충실히 실행합니다. 따라서 여러 구간을 나눌 때는 어떤 조건을 먼저 검사해야 원하는 구간이 정확히 선택되는지 사람이 정해야 합니다.","elif 체인은 위에서부터 처음 True가 된 길 하나만 선택합니다. 따라서 넓은 조건을 먼저 두면 아래의 구체적인 조건이 실행될 기회를 잃을 수 있습니다.","점수가 90 이상이면 A, 80 이상이면 B라고 할 때 score >= 80을 먼저 검사하면 95점도 이미 True라서 B로 끝나 버립니다.","조건을 적은 뒤에는 대표값 하나씩 넣어 위에서부터 실제로 따라가 보세요. ‘95는 어디로 가나, 85는 어디로 가나, 79는 어디로 가나’를 확인하면 순서 실수를 빨리 잡을 수 있습니다.","조건 자체가 복잡하다면 중간 boolean 변수에 의미 있는 이름을 붙여 읽기 쉬운 문장처럼 만드는 것도 좋은 방법입니다."]},{"id":"t3-c4-example1","kind":"example","eyebrow":"예제로 연결하기","title":"조기 차단을 쓰면 정상 흐름이 덜 깊어집니다","paragraphs":["조기 차단은 ‘잘못된 경우를 먼저 내보내고, 정상적인 경우만 아래로 내려보내는 방식’입니다. 놀이공원 입구에서 티켓이 없는 사람을 먼저 돌려보낸 뒤, 들어온 사람만 놀이기구 안내를 받는 것과 비슷합니다.","금액이 -1000원이라면 배송비를 계산할 이유가 없습니다. 처음에 잘못된 금액이라고 처리하고 함수를 끝내면 뒤쪽 코드는 정상 금액만 생각하면 됩니다.","이렇게 하면 if 안에 if 안에 또 if가 들어가는 깊은 구조를 줄일 수 있고, 사람이 읽을 때도 정상 흐름이 한눈에 보입니다.","아래 함수는 주문 금액이 음수인 잘못된 입력을 먼저 막습니다. 그 뒤에는 ‘금액이 정상이다’라는 전제로 배송비 계산을 읽을 수 있습니다.","잘못된 입력을 if 안에서 계속 중첩해 처리하면 정상 계산이 점점 오른쪽으로 밀려 읽기 어려워집니다. 초반에 걸러 내면 중심 로직이 단순해집니다.","여기서 return은 함수를 즉시 끝내고 값을 돌려주는 역할을 합니다. 함수 자체는 다음 챕터에서 더 자세히 다룹니다."],"code":"def shipping_fee(total):\n    if total \u003c 0:\n        return \"잘못된 금액\"\n\n    if total >= 50000:\n        return 0\n\n    return 3000","codeNote":"음수는 첫 조건에서 끝납니다. 정상 금액은 아래 배송비 규칙만 확인하면 됩니다.","codeExplain":["1단계: 2행: 처리하면 안 되는 음수 입력을 가장 먼저 검사합니다.","2단계: 3행: 잘못된 입력이면 그 자리에서 함수를 끝냅니다.","3단계: 5행: 정상 금액만 무료배송 기준을 검사합니다.","4단계: 6행: 50000 이상이면 0을 반환합니다.","5단계: 8행: 앞 조건에 걸리지 않은 나머지 정상 금액은 3000입니다."]},{"id":"t3-c4-p3","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"for는 ‘모든 항목’, while은 ‘조건이 바뀔 때까지’라고 생각하세요","paragraphs":["for와 while을 고르는 가장 쉬운 기준은 ‘무엇을 반복하는지 이미 목록으로 알고 있는가’입니다.","상품 목록에 10개가 있고 그 10개를 하나씩 본다면 for가 자연스럽습니다. 반면 비밀번호를 맞힐 때까지 계속 입력을 받되 최대 3번까지만 허용한다면 ‘몇 번째에서 성공할지 모르는’ 상황이라 while이 잘 맞습니다.","for는 ‘하나씩 꺼내기’, while은 ‘조건이 맞는 동안 계속하기’로 먼저 기억하세요. 문법 모양보다 이 차이를 이해하는 것이 더 중요합니다.","리스트에 있는 주문 10개를 하나씩 검사한다면 처리할 대상이 이미 정해져 있으므로 for가 자연스럽습니다. 로그인 시도를 최대 3회까지 허용하면서 성공하면 일찍 끝낸다면 while이 더 자연스러울 수 있습니다.","for는 ‘무엇을 하나씩 꺼낼까?’를 먼저 묻습니다. while은 ‘무슨 조건이 True인 동안 계속할까?’와 ‘그 조건을 언젠가 False로 만드는 변화가 무엇일까?’를 함께 묻습니다.","while에서 마지막 질문을 빼먹으면 무한 반복이 생기기 쉽습니다. 그래서 while을 작성할 때 조건에 등장하는 변수 중 무엇이 반복 안에서 바뀌는지 표시하세요.","반복을 선택하는 기준은 취향이 아니라 문제의 종료 방식입니다."]},{"id":"t3-c4-example2","kind":"example","eyebrow":"예제로 연결하기","title":"while은 종료 조건과 상태 변화가 한 쌍입니다","paragraphs":["while에서 가장 중요한 것은 반복 조건 자체보다 ‘그 조건이 언젠가 거짓이 될 수 있느냐’입니다.","tries가 0이고 조건이 tries \u003c 3이면 처음에는 True입니다. 한 번 실행한 뒤 tries를 1로, 다시 2로, 다시 3으로 바꾸기 때문에 결국 3 \u003c 3이 False가 되어 멈춥니다.","tries += 1을 빼면 tries는 계속 0입니다. 그러면 0 \u003c 3은 영원히 True이고 프로그램도 영원히 반복합니다. 그래서 while을 볼 때는 조건과 그 조건에 사용된 값의 변화가 항상 한 쌍입니다.","아래 코드는 시도 횟수가 3보다 작은 동안 반복합니다. 반복 한 번이 끝날 때 tries가 1씩 증가하므로 언젠가 조건이 False가 됩니다.","tries += 1을 지우면 tries는 계속 0이고 tries \u003c 3은 영원히 True입니다. 문법 오류는 없지만 프로그램이 끝나지 않습니다.","while을 볼 때는 조건식만 보지 말고 그 조건에 사용된 값이 어디서 바뀌는지 함께 찾으세요."],"code":"tries = 0\n\nwhile tries \u003c 3:\n    print(\"시도\", tries + 1)\n    tries += 1\n\nprint(\"종료\")","codeNote":"시도 1, 시도 2, 시도 3이 출력된 뒤 종료가 출력됩니다.","codeExplain":["1단계: 1행: tries를 0으로 시작합니다.","2단계: 3행: tries가 3보다 작은 동안 반복합니다.","3단계: 4행: 사람이 보기 쉬운 번호로 표시하려고 tries + 1을 출력합니다.","4단계: 5행: tries를 증가시켜 종료 조건에 가까워지게 합니다.","5단계: 7행: tries가 3이 되면 while을 빠져나와 종료를 출력합니다."]},{"id":"t3-c4-p4","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"off-by-one은 경계값 세 개로 잡습니다","paragraphs":["한 칸 차이 오류는 코딩에서 아주 흔합니다. 특히 ‘이상’, ‘초과’, ‘미만’, ‘이하’처럼 경계를 포함하는지 빼는지가 중요할 때 잘 생깁니다.","무료배송이 50000원 이상이라면 50000원이 포함되어야 합니다. 그런데 >를 쓰면 50000은 빠지고 50001부터 무료가 됩니다. 80000 같은 값만 테스트하면 이 실수를 발견하지 못합니다.","그래서 기준 숫자 바로 아래, 기준 숫자 자체, 바로 위 세 개를 넣어 보는 습관이 좋습니다. 49999, 50000, 50001처럼 말입니다.","횟수나 범위를 다루는 코드에서는 ‘딱 시작점’, ‘딱 끝점’, ‘끝 바로 다음’ 값을 넣어 보는 것이 좋습니다. 한 칸 차이 오류는 평범한 중간값으로는 잘 드러나지 않습니다.","예를 들어 최대 3회 시도라면 2회, 3회, 4회 상황을 생각해 봅니다. 무료배송 기준이 50000원이라면 49999, 50000, 50001을 봅니다.","range의 끝 값이 포함되지 않는다는 규칙도 자주 한 칸 차이 오류를 만듭니다. range(1, 4)는 1, 2, 3을 만들고 4는 포함하지 않습니다.","경계값을 테스트로 남겨 두면 나중에 조건을 수정했을 때 같은 실수를 다시 만들 가능성이 줄어듭니다."]},{"id":"t3-c4-example3","kind":"example","eyebrow":"예제로 연결하기","title":"반복 안의 continue는 ‘이번 항목만 건너뛰기’입니다","paragraphs":["continue는 반복을 끝내는 명령이 아닙니다. 지금 보고 있는 항목 하나만 건너뛰고 다음 항목으로 넘어가는 명령입니다.","가격 목록 [3000, -1, 5000]에서 -1이 잘못된 값이라면, -1을 만났을 때 합계 계산만 건너뛰고 5000은 계속 처리해야 합니다. 이때 continue가 잘 맞습니다.","반대로 break를 쓰면 -1을 만난 순간 반복 전체가 끝나므로 뒤의 5000까지 보지 않게 됩니다. 두 문법의 차이는 ‘이번 한 번만 건너뛰기’와 ‘반복 자체 끝내기’입니다.","아래 코드는 음수 가격을 잘못된 데이터로 보고 합계에서 제외합니다. continue를 만나면 현재 iteration의 남은 줄을 건너뛰고 다음 price로 넘어갑니다.","break와 헷갈리지 마세요. break는 전체 반복을 끝냅니다. continue는 반복 자체는 계속하지만 이번 항목만 건너뜁니다.","처음에는 두 문법을 남용하지 않는 것이 좋습니다. 흐름이 더 명확해지는 경우에만 사용하세요."],"code":"prices = [3000, -1, 5000]\ntotal = 0\n\nfor price in prices:\n    if price \u003c 0:\n        continue\n    total += price\n\nprint(total)","codeNote":"예상 출력은 8000입니다. -1이 있는 iteration만 합계 계산을 건너뜁니다.","codeExplain":["1단계: 4행: 가격을 하나씩 꺼냅니다.","2단계: 5행: 음수인지 확인합니다.","3단계: 6행: 음수면 이번 반복의 남은 코드를 건너뜁니다.","4단계: 7행: 정상 가격만 total에 더합니다.","5단계: 9행: 3000 + 5000 결과인 8000을 출력합니다."]},{"id":"t3-c4-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"요구사항을 제어 흐름으로 바꾸세요","paragraphs":["이 실습의 핵심은 Python 문법을 기억하는 것이 아니라 한국어 규칙을 코드의 갈림길로 옮기는 것입니다. 먼저 각 입력이 어디로 가야 하는지 문장으로 정리하세요.","잘못된 입력을 먼저 막고, 정상 범위 안에서는 높은 점수 구간부터 차례대로 내려오면 조건이 겹치는 문제를 줄일 수 있습니다.","요구사항은 ‘점수가 0보다 작거나 100보다 크면 잘못된 점수, 90 이상이면 A, 80 이상이면 B, 그 외에는 C를 출력한다’입니다.","먼저 잘못된 입력을 조기 차단하고, 정상 점수는 높은 기준부터 낮은 기준 순으로 검사해 보세요.","코드를 쓰기 전에 105, 95, 85, 70 네 입력이 각각 어느 경로로 가야 하는지 적습니다."],"practicePrompt":"빈칸을 채워 네 입력이 모두 올바른 결과를 내도록 만드세요.","code":"score = 85\n\nif __________________:\n    print(\"잘못된 점수\")\nelif __________________:\n    print(\"A\")\nelif __________________:\n    print(\"B\")\nelse:\n    print(\"C\")","answerOnNext":true},{"id":"t3-c4-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"요구사항을 제어 흐름으로 바꾸세요 · 풀이","paragraphs":["풀이의 순서는 ‘잘못된 범위 확인 → 90점 이상 확인 → 80점 이상 확인 → 나머지’입니다. 위 조건에서 걸린 값은 아래 조건까지 내려오지 않습니다.","잘못된 범위는 score \u003c 0 or score > 100으로 먼저 잡습니다. 정상 범위만 아래 등급 조건으로 내려갑니다.","등급은 90 이상을 먼저 두고 80 이상을 다음에 둡니다. 순서를 바꾸면 95도 80 이상 조건에서 먼저 True가 되어 B로 잘못 분류될 수 있습니다.","예시 입력 85는 잘못된 범위가 아니고 90 이상도 아니지만 80 이상이므로 B가 출력됩니다."],"code":"score = 85\n\nif score \u003c 0 or score > 100:\n    print(\"잘못된 점수\")\nelif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelse:\n    print(\"C\")","codeNote":"105→잘못된 점수, 95→A, 85→B, 70→C입니다."},{"id":"t3-c4-check","kind":"check","eyebrow":"확인 문제","title":"반복이 끝나는 이유를 설명할 수 있는지 확인합니다","paragraphs":["이 확인 문제는 while이 왜 멈추는지 흐름으로 이해했는지 확인합니다. 조건식만 보지 말고 조건에 쓰인 값이 어떻게 바뀌는지 함께 보세요.","while 코드를 보면 ‘현재 조건’과 ‘조건을 바꾸는 줄’을 한 쌍으로 찾는 습관이 중요합니다.","다음 질문에 조건식과 상태 변화라는 두 단어를 사용해 답해 보세요."],"question":"while count \u003c 3: 안에서 count 값이 한 번도 바뀌지 않으면 왜 무한 반복이 생길 수 있을까요?","answerOnNext":true},{"id":"t3-c4-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복이 끝나는 이유를 설명할 수 있는지 확인합니다 · 풀이","paragraphs":["풀이의 순서는 ‘잘못된 범위 확인 → 90점 이상 확인 → 80점 이상 확인 → 나머지’입니다. 위 조건에서 걸린 값은 아래 조건까지 내려오지 않습니다.","종료 조건은 count \u003c 3입니다. count가 0에서 시작한 뒤 반복 안에서 바뀌지 않으면 이 조건은 계속 True입니다.","따라서 while은 같은 블록을 계속 실행합니다. count += 1처럼 조건 결과가 언젠가 False가 되도록 상태를 변화시키는 단계가 필요합니다."]},{"id":"t3-c4-summary","kind":"summary","eyebrow":"Chapter 4 정리","title":"흐름을 먼저 설계하면 문법 선택이 쉬워집니다","paragraphs":["이 챕터에서 배운 if, for, while의 핵심은 문법 모양이 아니라 길을 만드는 방식입니다. 한 번 하는 일, 조건에 따라 갈리는 일, 여러 번 반복하는 일을 구분하면 필요한 문법을 고르기 쉬워집니다.","문제 문장을 순차 실행·분기·반복으로 분류하면 어떤 제어문이 필요한지 보이기 시작합니다. if는 갈림길, for와 while은 되풀이되는 길입니다.","분기에서는 조건 순서를, while에서는 종료 조건과 상태 변화를, 모든 경계에서는 한 칸 차이 오류를 확인하세요.","다음 챕터에서는 이렇게 설계한 큰 흐름을 함수 단위로 나눕니다. 한 덩어리 코드를 역할별 작은 도구로 바꾸면 읽기와 수정이 쉬워집니다."],"bullets":["요구사항 문장에 ‘한 번·조건에 따라·여러 번’을 표시한다.","조건은 대표값과 경계값을 넣어 위에서부터 실제로 따라간다.","while은 종료 조건에 등장하는 값이 반복 안에서 어떻게 바뀌는지 확인한다.","잘못된 입력을 초반에 차단하면 정상 흐름이 단순해진다."]}]},{"id":"t3-c5","track":3,"chapter":5,"title":"함수로 역할을 나누고 연결하기","remember":"함수는 이름 붙인 작은 작업 단위이며, 입력과 반환값의 계약을 명확히 하고 한 가지 책임에 집중시킨다","practiceGoal":"긴 코드를 역할별 함수로 나누고 parameter·argument·return·scope를 읽어 데이터 흐름을 설명한다","pages":[{"id":"t3-c5-g1","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 1/4","title":"함수를 읽기 위한 기본 단어","paragraphs":["함수는 코드를 멋있게 정리하는 장식이 아닙니다. 큰 문제를 작은 작업 단위로 나누고 각 단위에 이름을 붙이는 방법입니다.","먼저 함수 정의와 호출, 입력을 받는 자리와 실제로 넣는 값을 구분하면 긴 코드도 작은 조각으로 읽을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"function 함수","description":"함수는 여러 줄의 코드를 하나의 이름으로 묶은 작은 도구입니다. 계산기에서 ‘더하기’ 버튼 하나가 내부적으로 여러 동작을 처리하듯, 함수 이름 하나로 필요한 작업을 실행할 수 있습니다.","usage":"같은 일을 재사용하거나 큰 문제를 역할별로 나눌 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: calculate_total()은 합계를 계산하는 함수 이름이 될 수 있습니다."},{"term":"call 호출","description":"호출은 만들어 둔 함수를 실제로 사용하는 것입니다. 함수가 레시피라면 호출은 그 레시피대로 지금 요리를 시작해 달라고 시키는 것과 비슷합니다.","usage":"함수가 언제 동작하는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: calculate_total(prices)는 함수를 호출합니다."},{"term":"parameter 매개변수","description":"매개변수는 함수가 값을 받을 자리의 이름입니다. 택배 상자에 ‘받는 사람’ 칸이 미리 있는 것처럼, 함수 정의에 입력 자리를 만들어 둔 것입니다.","usage":"함수가 어떤 정보를 필요로 하는지 표현할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: def greet(name):에서 name이 parameter입니다."},{"term":"argument 인자","description":"인자는 함수를 실제로 사용할 때 그 자리에 넣어 주는 실제 값입니다. parameter가 ‘받는 사람’이라는 빈 칸이라면 argument는 그 칸에 적는 ‘김민수’ 같은 실제 내용입니다.","usage":"parameter 자리에 어떤 값이 들어가는지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: greet(\"민수\")에서 \"민수\"가 argument입니다."}]},{"id":"t3-c5-g2","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 2/4","title":"함수가 결과를 돌려줄 때 쓰는 단어","paragraphs":["함수 안에서 계산한 결과를 다른 코드가 사용하려면 밖으로 돌려줘야 합니다. 화면에 보여 주는 것과 값을 돌려주는 것은 서로 다른 일입니다.","return과 print를 구분하면 함수가 왜 연결 가능한 작은 부품이 되는지 이해하기 쉬워집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"return 반환","description":"return은 함수 안에서 만든 결과를 함수 밖으로 돌려주는 문법입니다. 계산기가 내부에서 계산한 뒤 화면에 결과 숫자를 내놓는 것처럼, 함수도 다음 코드가 사용할 값을 돌려줄 수 있습니다.","usage":"함수의 계산 결과를 다음 코드에서 다시 사용해야 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: return total은 total 값을 호출한 곳으로 돌려줍니다."},{"term":"return value 반환값","description":"반환값은 함수가 return으로 실제로 돌려준 결과입니다. add(2, 3)이 5를 돌려준다면 5가 반환값입니다.","usage":"함수의 출력이 무엇인지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: add(2, 3)의 반환값이 5일 수 있습니다."},{"term":"print 출력","description":"print는 값을 화면에 보여 주는 도구입니다. 보여 주는 것과 다른 코드에 값을 돌려주는 것은 다릅니다. 그래서 print와 return을 같은 것으로 생각하면 안 됩니다.","usage":"중간값을 확인하거나 사용자에게 결과를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(total)은 total을 화면에 보여 줍니다."},{"term":"contract 계약","description":"함수의 계약은 ‘무엇을 넣으면 무엇이 나온다’라는 약속입니다. 예를 들어 ‘가격 숫자를 넣으면 배송비 숫자를 돌려준다’처럼 함수 사용자가 알아야 할 규칙을 뜻합니다.","usage":"함수 사용자가 내부 코드를 몰라도 안전하게 사용할 기준을 정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘가격 리스트를 받아 0 이상의 정수 합계를 반환한다’가 계약입니다."}]},{"id":"t3-c5-g3","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 3/4","title":"함수 안과 밖의 범위를 이해하는 단어","paragraphs":["함수 안의 변수는 밖의 변수와 같은 이름처럼 보여도 범위가 다를 수 있습니다. 이 차이를 모르면 값이 왜 안 바뀌었는지 혼란스럽습니다.","초보 단계에서는 ‘함수 안에서 만든 변수는 우선 그 함수 안에서 쓰인다’는 감각부터 잡으면 충분합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"scope 범위","description":"scope는 변수 이름을 사용할 수 있는 구역입니다. 교실 A에서 정한 ‘반장’과 교실 B의 ‘반장’이 서로 다른 사람일 수 있듯, 함수 안의 변수와 바깥 변수도 같은 이름이어도 다른 범위일 수 있습니다.","usage":"같은 변수 이름이 어디에서 유효한지 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 함수 안에서 만든 변수는 보통 그 함수의 local scope에 있습니다."},{"term":"local variable 지역 변수","description":"지역 변수는 함수 안에서 잠깐 쓰는 내부용 변수입니다. 함수가 끝나면 바깥 코드가 그 이름을 그대로 사용할 수 없는 경우가 많습니다.","usage":"함수의 중간 계산을 다른 코드와 분리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: fee = 3000을 함수 안에서만 사용할 수 있습니다."},{"term":"responsibility 책임","description":"책임은 그 함수가 맡은 중심 역할입니다. 배송비 함수라면 배송비 계산에 집중하고, 로그인 처리나 화면 색 변경까지 같이 맡기지 않는 식입니다.","usage":"함수에 너무 많은 일을 넣었는지 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: validate_price는 가격 검증만 맡도록 할 수 있습니다."},{"term":"interface 인터페이스","description":"인터페이스는 함수 바깥에서 보이는 사용법입니다. 내부 코드가 복잡해도 사용자는 함수 이름, 넣을 값, 나오는 결과만 알면 사용할 수 있습니다.","usage":"내부 구현을 몰라도 함수를 어떻게 호출할지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: shipping_fee(total) → 숫자 반환이 인터페이스입니다."}]},{"id":"t3-c5-g4","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 4/4","title":"함수를 더 읽기 좋게 다듬을 때 쓰는 단어","paragraphs":["처음부터 완벽하게 함수를 나눌 필요는 없습니다. 동작하는 큰 코드를 만든 뒤 의미 있는 경계를 찾아 작은 함수로 옮기는 작업도 흔합니다.","다만 함수를 많이 만드는 것 자체가 목표는 아닙니다. 이름만 봐도 역할이 보이고 입력과 결과가 분명해야 합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"refactoring 리팩터링","description":"리팩터링은 결과는 그대로 두고 코드의 정리 방식만 더 좋게 바꾸는 작업입니다. 방 안의 가구를 정리해도 집 주소가 바뀌지 않는 것과 비슷합니다.","usage":"긴 함수나 중복 코드를 역할별로 정리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 계산 부분을 shipping_fee()로 분리합니다."},{"term":"helper function 보조 함수","description":"보조 함수는 큰 함수가 일을 쉽게 하도록 작은 부분을 맡아 주는 함수입니다. 큰 요리에서 ‘양파 썰기’만 따로 맡는 작은 단계처럼 생각하면 됩니다.","usage":"검증·변환·계산 같은 반복되는 세부 작업을 분리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: is_valid_price()가 입력 검증을 도울 수 있습니다."},{"term":"pure function 순수 함수","description":"순수 함수는 같은 입력을 주면 항상 같은 결과를 주고, 함수 밖의 상태를 몰래 바꾸지 않는 함수입니다. 계산기처럼 2와 3을 넣으면 언제나 5가 나오는 형태입니다.","usage":"계산 로직을 예측 가능하고 테스트하기 쉽게 만들 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: add_tax(price)처럼 입력을 받아 새 값을 계산해 반환합니다."},{"term":"side effect 부수효과","description":"부수효과는 반환값 말고 바깥 세상에 생기는 변화입니다. 화면 출력, 파일 저장, 전역 변수 변경처럼 함수 밖의 상태가 달라지는 일을 뜻합니다.","usage":"함수의 영향 범위를 파악할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(), 파일 쓰기, 전역 리스트 수정은 side effect가 될 수 있습니다."}]},{"id":"t3-c5-slow-start","kind":"concept","eyebrow":"CHAPTER 05 · 아주 천천히 시작하기","title":"함수는 자주 쓰는 일을 이름 하나로 묶은 작은 도구입니다","paragraphs":["함수를 처음 배우면 def, return, parameter 같은 새 단어가 한꺼번에 나와 어렵게 느껴집니다. 먼저 함수 자체의 목적부터 아주 단순하게 잡겠습니다.","매번 ‘가격에 10%를 곱해서 할인액을 계산한다’는 코드를 반복해서 쓴다고 생각해 보세요. 이 일을 discount라는 이름의 작은 도구로 만들어 두면 다음부터 discount(가격)처럼 이름만 불러 사용할 수 있습니다.","함수는 크게 세 부분만 보면 됩니다. 첫째, 함수 이름은 이 도구가 무슨 일을 하는지 알려 줍니다. 둘째, 괄호 안의 입력 자리는 일을 하려면 어떤 값이 필요한지 알려 줍니다. 셋째, return은 일이 끝난 뒤 어떤 결과를 돌려줄지 알려 줍니다.","즉 함수 내부의 모든 줄을 처음부터 이해하지 못해도 이름·입력·결과 세 가지를 보면 큰 흐름을 먼저 이해할 수 있습니다."]},{"id":"t3-c5-p1","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"함수는 ‘코드를 줄이는 기술’보다 ‘생각을 나누는 기술’입니다","paragraphs":["함수는 처음 보면 새로운 문법 덩어리처럼 느껴지지만, 사실은 ‘길어진 일을 작은 일로 나누고 이름을 붙이는 방법’입니다.","집안일을 ‘집 정리하기’ 한 덩어리로 생각하면 막막하지만 ‘빨래하기, 설거지하기, 쓰레기 버리기’로 나누면 각각 무엇을 해야 하는지 분명해집니다. 함수도 같은 역할을 합니다.","주문 계산 코드가 길다면 검증하기, 할인 계산하기, 배송비 계산하기처럼 나눌 수 있습니다. 그러면 전체 코드를 다 읽기 전에 함수 이름만 보고도 큰 흐름을 이해할 수 있습니다.","긴 코드를 함수로 나누는 가장 큰 이유는 줄 수를 줄이기 위해서가 아닙니다. 사람의 머리가 한 번에 이해해야 하는 범위를 작게 만들기 위해서입니다.","주문 프로그램 전체를 한 번에 읽는 대신 validate_order, calculate_discount, shipping_fee처럼 역할 이름을 먼저 보면 큰 흐름을 빠르게 파악할 수 있습니다.","좋은 함수 이름은 주석 없이도 ‘무엇을 하는가’를 어느 정도 말해 줍니다. 반대로 do_work, process_data처럼 너무 넓은 이름은 함수 안에 여러 책임이 섞였다는 신호일 수 있습니다.","함수를 읽을 때는 내부 코드로 바로 들어가지 말고 먼저 이름·parameter·return value 세 가지를 확인하세요. 이것이 함수의 겉모습인 interface입니다."]},{"id":"t3-c5-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"함수는 작은 입력→처리→출력 상자처럼 연결됩니다","paragraphs":["함수 하나를 작은 기계라고 생각해 보세요. 왼쪽 구멍으로 필요한 값을 넣으면 내부에서 일을 하고 오른쪽 구멍으로 결과를 내보냅니다.","예를 들어 shipping_fee라는 기계에 total=40000을 넣으면 3000을 내놓고, total=60000을 넣으면 0을 내놓는 식입니다.","여러 함수는 이런 작은 기계들을 줄줄이 연결한 것처럼 사용할 수 있습니다. 앞 함수가 만든 결과를 다음 함수에 넣으면 큰 프로그램을 작은 단계들로 조립할 수 있습니다.","함수 하나를 상자라고 생각하면 왼쪽에는 입력이 들어오고 안에서 한 가지 역할을 수행한 뒤 오른쪽으로 반환값이 나옵니다.","여러 함수는 반환값을 다음 함수의 argument로 전달하면서 연결될 수 있습니다. 이때 각 함수의 contract가 맞아야 데이터 흐름이 끊기지 않습니다.","상자 내부를 아직 몰라도 입력과 출력만 알면 큰 프로그램의 흐름을 먼저 읽을 수 있습니다."],"visual":"FUNCTION_PIPELINE","bullets":["입력 total → validate_total(total)","정상 total → discount(total)","할인된 금액 → shipping_fee(total)","각 반환값을 모아 최종 결과 구성"]},{"id":"t3-c5-example1","kind":"example","eyebrow":"예제로 연결하기","title":"parameter는 자리 이름, argument는 실제 값입니다","paragraphs":["parameter와 argument는 이름이 비슷해서 처음에 가장 헷갈리는 용어 중 하나입니다. 빈칸과 실제 값을 구분하면 쉽습니다.","함수를 만들 때 def discount(price, rate):라고 쓰면 price와 rate는 아직 실제 숫자가 아닙니다. ‘여기에 가격과 할인율이 들어올 거야’라고 자리를 만들어 둔 것입니다. 이 자리가 parameter입니다.","discount(10000, 0.1)처럼 실제로 부를 때는 10000과 0.1이 그 빈자리에 들어갑니다. 이 실제 값들이 argument입니다.","아래 함수 정의에서 price와 rate는 입력 자리에 붙인 parameter입니다. 함수가 정의될 때는 아직 실제 숫자가 정해지지 않았습니다.","discount(10000, 0.1)을 호출하는 순간 10000과 0.1이라는 argument가 각각 price와 rate 자리에 들어갑니다.","이 구분을 알면 AI가 함수 호출을 잘못 만들었을 때 ‘parameter 개수와 argument 개수가 맞는가’를 확인할 수 있습니다."],"code":"def discount(price, rate):\n    return price * rate\n\namount = discount(10000, 0.1)\nprint(amount)","codeNote":"반환값은 1000.0이고 amount에 저장됩니다.","codeExplain":["1단계: 1행: discount 함수가 price와 rate 두 parameter를 받도록 정의합니다.","2단계: 2행: 두 입력을 곱한 값을 호출한 곳으로 반환합니다.","3단계: 4행: 10000과 0.1을 argument로 전달해 함수를 호출합니다.","4단계: 4행: 반환된 1000.0을 amount에 저장합니다.","5단계: 5행: 저장된 결과를 화면에서 확인합니다."]},{"id":"t3-c5-p2","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"return과 print를 섞으면 함수 연결이 어려워질 수 있습니다","paragraphs":["print와 return은 둘 다 결과와 관련돼 보여서 초보자가 자주 같은 것으로 생각합니다. 하지만 역할은 완전히 다릅니다.","print는 사람 눈에 보여 주는 기능입니다. return은 다른 코드가 이어서 사용할 수 있도록 값을 돌려주는 기능입니다.","계산기로 비유하면 print는 화면에 숫자를 보여 주는 것이고, return은 그 숫자를 다음 계산에 넘겨주는 것에 가깝습니다. 함수 결과를 다른 계산에 쓰려면 보통 return이 필요합니다.","print는 사람에게 보여 주는 동작이고 return은 다른 코드에게 값을 건네는 동작입니다. 둘은 목적이 다릅니다.","함수 안에서 계산 결과를 print만 하고 return하지 않으면 화면에는 숫자가 보일 수 있지만 다른 코드가 그 값을 받아 추가 계산하기 어렵습니다.","초보자는 화면에 결과가 보이면 함수가 값을 돌려줬다고 생각하기 쉽습니다. 그래서 함수 호출 뒤 변수에 무엇이 저장됐는지 확인하는 습관이 중요합니다.","계산 함수는 가능한 한 결과를 return하고, 최종 사용자 출력은 바깥에서 담당하게 하면 역할이 분명해지는 경우가 많습니다."]},{"id":"t3-c5-example2","kind":"example","eyebrow":"예제로 연결하기","title":"return이 없으면 호출 결과는 None이 될 수 있습니다","paragraphs":["함수 안에서 5를 print했다고 해서 그 함수가 5를 돌려준 것은 아닙니다. 화면에는 5가 보이지만 호출 결과로는 아무 값도 주지 않았을 수 있습니다.","Python 함수가 명시적으로 return하지 않으면 호출 결과는 기본적으로 None입니다. None은 숫자 0이 아니라 ‘돌려받은 값이 없음’에 가까운 특별한 값입니다.","그래서 result = show_sum(2, 3)처럼 저장했는데 result가 None이라면 함수 안에 print만 있고 return이 없는지 확인해야 합니다.","첫 함수는 print만 하므로 화면에는 5가 보이지만 호출한 곳에 계산값을 반환하지 않습니다. 두 번째 함수는 5를 return하므로 result 변수에 저장할 수 있습니다.","None은 ‘값이 없다’는 뜻으로 쓰이는 Python의 특별한 값입니다. 이 예제에서는 함수가 명시적으로 반환한 값이 없어서 result1이 None이 됩니다.","화면 출력과 반환값을 구분하면 ‘왜 다음 계산에서 None이 나왔지?’ 같은 오류를 이해하기 쉬워집니다."],"code":"def show_sum(a, b):\n    print(a + b)\n\ndef get_sum(a, b):\n    return a + b\n\nresult1 = show_sum(2, 3)\nresult2 = get_sum(2, 3)\n\nprint(result1)\nprint(result2)","codeNote":"먼저 5가 한 번 출력되고, 마지막 두 줄에서 None과 5가 출력됩니다.","codeExplain":["1단계: 1~2행: show_sum은 계산 결과를 화면에만 출력합니다.","2단계: 4~5행: get_sum은 계산 결과를 return합니다.","3단계: 7행: show_sum은 반환값이 없으므로 result1에는 None이 들어갑니다.","4단계: 8행: get_sum의 반환값 5가 result2에 들어갑니다.","5단계: 10~11행: 두 변수의 차이를 직접 확인합니다."]},{"id":"t3-c5-p3","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"한 함수에는 한 문장으로 설명 가능한 중심 책임을 줍니다","paragraphs":["함수를 나눌 때 가장 쉬운 기준은 ‘이 함수가 하는 일을 한 문장으로 말할 수 있는가’입니다.","‘배송비를 계산한다’는 한 가지 일입니다. 하지만 ‘주문을 검사하고 할인하고 배송비를 계산하고 화면에도 출력한다’는 여러 가지 일이 한 함수에 섞여 있습니다.","여러 일이 섞이면 하나를 수정할 때 다른 부분까지 영향을 받을 가능성이 커집니다. 그래서 서로 독립적으로 설명할 수 있는 큰 역할은 함수로 나누는 편이 읽고 고치기 쉽습니다.","함수를 나눌 때 가장 실용적인 기준은 ‘이 함수가 하는 일을 한 문장으로 말할 수 있는가?’입니다. 문장에 ‘그리고’가 계속 붙으면 책임이 너무 많을 수 있습니다.","예를 들어 ‘주문을 검증하고 할인하고 배송비를 계산하고 출력한다’는 함수는 여러 이유로 변경될 수 있습니다. 할인 정책만 바뀌어도, 출력 형식만 바뀌어도 같은 함수가 수정됩니다.","반면 validate_order, calculate_discount, calculate_shipping처럼 나누면 각각의 변경 이유가 분리됩니다. 테스트도 작은 단위로 할 수 있습니다.","하지만 두 줄짜리 코드마다 함수를 만드는 것도 읽기 어렵습니다. 반복되거나 의미 있는 독립 역할이 있을 때 경계를 만드는 것이 좋습니다."]},{"id":"t3-c5-p4","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"scope는 함수가 자기 중간값을 안전하게 가두는 경계입니다","paragraphs":["scope는 ‘이 변수 이름이 통하는 구역’이라고 생각하면 됩니다. 같은 이름이라도 구역이 다르면 서로 다른 변수일 수 있습니다.","아파트 101동과 102동에 둘 다 301호가 있어도 서로 다른 집인 것과 비슷합니다. 함수 A 안의 total과 함수 B 안의 total은 이름이 같아도 각각 자기 함수 안에서 따로 존재할 수 있습니다.","이렇게 범위가 나뉘면 한 함수의 중간 계산이 다른 함수의 변수와 마구 섞이는 일을 줄일 수 있습니다.","함수 안에서 만드는 지역 변수는 기본적으로 그 함수의 내부 계산을 위한 것입니다. 바깥 코드가 같은 이름을 써도 서로 다른 범위에 있을 수 있습니다.","이 성질 덕분에 함수마다 total, result 같은 평범한 이름을 사용해도 충돌을 줄일 수 있습니다.","반대로 함수가 바깥의 변수를 직접 바꾸는 side effect가 많으면 어떤 호출이 상태를 바꿨는지 추적하기 어려워집니다. 초보 단계에서는 필요한 값을 parameter로 받고 결과를 return하는 형태를 우선하면 흐름이 분명합니다.","외부 상태를 바꿔야 하는 경우도 있지만, 그때는 함수 이름과 설명에서 영향 범위를 분명하게 표시하는 편이 좋습니다."]},{"id":"t3-c5-example3","kind":"example","eyebrow":"예제로 연결하기","title":"큰 주문 계산을 세 함수로 나누면 흐름이 보입니다","paragraphs":["큰 주문 계산을 한 덩어리로 읽으면 ‘어디서 검증하고 어디서 할인하고 어디서 배송비를 정하는지’를 계속 머릿속에 기억해야 합니다.","함수를 세 개로 나누면 각 함수 이름이 작은 설명서가 됩니다. valid_total은 금액이 정상인지, discount는 할인액이 얼마인지, shipping_fee는 배송비가 얼마인지 담당합니다.","마지막 부분은 이 작은 결과들을 조합하기만 하면 됩니다. AI에게 수정 요청을 할 때도 ‘shipping_fee만 바꿔’라고 범위를 분명하게 말할 수 있습니다.","아래 예제는 검증, 할인, 배송비를 서로 다른 함수로 나눕니다. 각 함수는 입력과 결과가 분명합니다.","최종 코드는 함수 내부 세부사항보다 ‘어떤 순서로 호출되는가’를 먼저 읽을 수 있습니다. total이 검증을 통과하고, 할인액과 배송비를 구해 final 값을 만드는 구조입니다.","이런 분리는 AI에게 수정 범위를 지정할 때도 유리합니다. ‘shipping_fee 함수만 바꿔라’처럼 범위를 좁힐 수 있습니다."],"code":"def valid_total(total):\n    return total >= 0\n\ndef discount(total):\n    if total >= 100000:\n        return total * 0.1\n    return 0\n\ndef shipping_fee(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\ntotal = 80000\n\nif valid_total(total):\n    final = total - discount(total) + shipping_fee(total)\n    print(final)","codeNote":"80000원은 할인 기준 100000원에 못 미쳐 할인 0원, 배송비는 무료이므로 80000이 출력됩니다.","codeExplain":["1단계: valid_total은 입력 검증만 담당합니다.","2단계: discount는 할인액 계산만 담당합니다.","3단계: shipping_fee는 배송비 계산만 담당합니다.","4단계: 마지막 if에서는 세 함수의 contract를 믿고 결과를 조합합니다."]},{"id":"t3-c5-p5","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"리팩터링은 동작을 바꾸지 않고 구조를 바꾸는 작업입니다","paragraphs":["리팩터링은 기능을 새로 만드는 작업이 아닙니다. 사용자 입장에서는 결과가 똑같아야 하고, 내부 코드만 더 읽고 고치기 좋은 구조로 바꾸는 작업입니다.","예를 들어 30줄짜리 배송비 계산을 shipping_fee 함수로 옮겨도 49999원, 50000원, 50001원을 넣었을 때 결과는 이전과 같아야 합니다.","그래서 리팩터링 전후에는 같은 테스트를 돌려 결과가 그대로인지 확인합니다. 구조를 바꾸는 중에 실수로 기능까지 바뀌지 않았는지 보는 것입니다.","긴 코드가 이미 맞게 동작하고 있다면 한 번에 기능과 구조를 동시에 바꾸지 않는 것이 안전합니다. 먼저 현재 결과를 확인하고, 함수로 분리한 뒤 같은 입력에서 결과가 그대로인지 비교하세요.","예를 들어 배송비 계산 코드를 함수로 옮기는 리팩터링을 했다면, 49999·50000·50001 같은 기존 테스트가 모두 같은 결과를 내는지 확인합니다.","구조 변경과 기능 변경을 분리하면 문제가 생겼을 때 원인 범위를 좁히기 쉽습니다.","AI에게 리팩터링을 맡길 때도 ‘외부 동작은 바꾸지 말 것’과 ‘기존 테스트를 통과할 것’을 명시하면 불필요한 변화가 줄어듭니다."]},{"id":"t3-c5-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"긴 계산을 역할별 함수로 나누세요","paragraphs":["이 실습에서는 긴 코드를 두 개의 작은 역할로 나누는 연습을 합니다. 하나는 나이가 정상인지 확인하고, 다른 하나는 정상 나이를 받아 가격을 계산합니다.","두 함수가 서로 다른 일을 맡도록 만들면 나이 허용 범위와 가격 정책 중 하나만 바뀌어도 필요한 함수만 수정할 수 있습니다.","아래 코드는 정상 동작하지만 검증과 계산이 한 덩어리에 있습니다. 두 함수를 만들어 역할을 나눠 보세요.","is_valid_age(age)는 0 이상 120 이하이면 True를 반환하고, ticket_price(age)는 13세 미만 5000원, 그 외 10000원을 반환하도록 설계합니다.","마지막 코드는 두 함수를 호출해 입력을 검사한 뒤 가격을 출력해야 합니다."],"practicePrompt":"두 함수의 빈칸을 채우고 age=10일 때 출력도 예상하세요.","code":"def is_valid_age(age):\n    return __________________\n\ndef ticket_price(age):\n    if __________________:\n        return 5000\n    return 10000\n\nage = 10\n\nif is_valid_age(age):\n    print(ticket_price(age))\nelse:\n    print(\"잘못된 나이\")","answerOnNext":true},{"id":"t3-c5-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"긴 계산을 역할별 함수로 나누세요 · 풀이","paragraphs":["풀이에서는 두 함수의 역할을 섞지 않는 것이 핵심입니다. is_valid_age는 정상 범위인지 True/False만 돌려주고, ticket_price는 가격 숫자만 돌려줍니다.","나이 검증은 0 \u003c= age \u003c= 120으로 한 함수에 모읍니다. 가격 함수는 검증이 끝난 정상 나이를 받는다고 가정하고 나이 구간만 처리합니다.","age=10은 유효한 나이이고 13보다 작으므로 ticket_price의 반환값은 5000입니다.","검증과 가격 계산을 분리했기 때문에 나이 허용 범위가 바뀌어도 가격 함수까지 수정할 필요가 없습니다."],"code":"def is_valid_age(age):\n    return 0 \u003c= age \u003c= 120\n\ndef ticket_price(age):\n    if age \u003c 13:\n        return 5000\n    return 10000\n\nage = 10\n\nif is_valid_age(age):\n    print(ticket_price(age))\nelse:\n    print(\"잘못된 나이\")","codeNote":"출력은 5000입니다."},{"id":"t3-c5-check","kind":"check","eyebrow":"확인 문제","title":"함수의 입력과 출력 계약을 확인합니다","paragraphs":["이 확인 문제는 화면에 보이는 출력과 다른 코드가 사용할 반환값을 구분할 수 있는지 확인합니다.","다음 질문은 화면 출력과 반환값을 구분할 수 있는지 보는 문제입니다.","함수를 다른 계산과 연결하려면 호출한 쪽이 실제 값을 받을 수 있어야 합니다."],"question":"계산 함수 안에서 print(result)만 하고 return result를 하지 않으면, 왜 다른 코드가 그 계산 결과를 이어서 사용하기 어려울까요?","answerOnNext":true},{"id":"t3-c5-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수의 입력과 출력 계약을 확인합니다 · 풀이","paragraphs":["풀이에서는 두 함수의 역할을 섞지 않는 것이 핵심입니다. is_valid_age는 정상 범위인지 True/False만 돌려주고, ticket_price는 가격 숫자만 돌려줍니다.","print는 결과를 화면에 보여 주지만 호출한 코드에 그 값을 전달하지 않습니다. 명시적인 return이 없으면 함수 호출 결과는 보통 None이 됩니다.","다른 계산에서 값을 사용하려면 return으로 반환하고, 호출한 쪽에서 변수에 저장하거나 바로 다음 함수의 argument로 전달해야 합니다."]},{"id":"t3-c5-summary","kind":"summary","eyebrow":"Chapter 5 정리","title":"함수는 큰 문제를 설명 가능한 작은 계약으로 바꿉니다","paragraphs":["함수는 어려운 문법을 하나 더 배우는 것이 아니라 큰 일을 작은 일로 나누는 방법입니다. 이름만 봐도 역할이 보이고, 무엇을 넣으면 무엇이 나오는지가 분명한 함수가 읽고 수정하기 쉽습니다.","함수는 이름, parameter, return value를 가진 작은 작업 단위입니다. 내부 코드보다 먼저 이 세 가지를 보면 프로그램의 큰 구조를 빠르게 읽을 수 있습니다.","한 함수는 가능하면 한 가지 중심 책임을 맡고, 계산 결과는 return으로 밖에 전달합니다. 지역 변수와 scope는 함수 내부의 중간 계산을 다른 부분과 분리해 줍니다.","다음 챕터에서는 함수로 잘 나눈 코드에서도 생길 수 있는 오류를 다룹니다. 핵심은 무작정 수정하는 것이 아니라 같은 오류를 재현하고 원인 범위를 좁히는 것입니다."],"bullets":["parameter는 입력 자리 이름, argument는 호출할 때 넣는 실제 값이다.","print는 보여 주기, return은 값 전달이다.","함수의 contract는 입력·반환값·지켜야 할 규칙이다.","리팩터링 뒤에는 같은 입력에서 외부 동작이 그대로인지 확인한다."]}]},{"id":"t3-c6","track":3,"chapter":6,"title":"오류를 재현하고 원인을 좁히기","remember":"증상과 원인을 구분하고, 같은 오류를 재현한 뒤 범위를 작게 줄여 한 번에 한 가설만 검증한다","practiceGoal":"오류 메시지·중간값·최소 재현 코드를 이용해 버그의 실제 원인을 찾고 수정 후 다시 검증한다","pages":[{"id":"t3-c6-g1","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 1/4","title":"문제가 생겼을 때 먼저 구분할 단어","paragraphs":["코딩을 하다 보면 ‘안 된다’는 순간이 반드시 옵니다. 문제 해결에서 중요한 것은 오류가 생기지 않게 만드는 것이 아니라, 생겼을 때 감으로 여러 곳을 바꾸지 않고 원인을 좁혀 가는 것입니다.","가장 먼저 버그, 오류, 예외, 증상을 구분하면 무엇을 관찰해야 하는지 달라집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"bug 버그","description":"버그는 프로그램이 우리가 원한 대로 움직이지 않게 만드는 문제입니다. 코드가 아예 멈출 수도 있고, 멈추지는 않지만 숫자를 잘못 계산할 수도 있습니다.","usage":"실행은 되지만 결과가 틀리는 문제까지 포함해 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 할인율을 10%가 아니라 100%로 계산하는 코드."},{"term":"error 오류","description":"오류는 잘못된 상태를 넓게 부르는 말입니다. 문법이 틀린 경우도 오류이고, 계산 결과가 틀린 경우도 오류라고 부를 수 있습니다.","usage":"문제의 종류가 아직 확실하지 않을 때 일반적으로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 문법 오류, 잘못된 계산 결과."},{"term":"exception 예외","description":"예외는 Python이 실행 도중 ‘이 상태로는 계속 진행하기 어렵다’고 알리는 오류 신호입니다. 숫자로 바꿀 수 없는 글자를 int()에 넣는 상황처럼 실행 중에 발생합니다.","usage":"파일 없음, 잘못된 타입, 존재하지 않는 키 같은 실행 문제를 다룰 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: int(\"abc\")는 ValueError를 일으킵니다."},{"term":"symptom 증상","description":"증상은 사용자가 겉으로 보는 현상입니다. ‘버튼을 누르니 0원이 나왔다’가 증상이고, 실제 원인은 그 앞의 계산 코드에 있을 수 있습니다.","usage":"문제를 처음 기록할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘결제 버튼을 누르면 합계가 0으로 보인다’가 증상입니다."}]},{"id":"t3-c6-g2","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 2/4","title":"같은 문제를 다시 만들 때 쓰는 단어","paragraphs":["한 번 우연히 생긴 문제를 고치기는 어렵습니다. 어떤 입력과 순서에서 같은 문제가 다시 생기는지 알아야 수정 전후를 비교할 수 있습니다.","재현 가능한 문제는 조사할 수 있는 문제입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"reproduce 재현","description":"재현은 같은 문제를 다시 똑같이 만들어 보는 것입니다. 고장 난 TV가 특정 버튼을 누를 때마다 꺼진다면 그 버튼 순서를 반복해 확인하는 것과 같습니다.","usage":"수정하기 전에 문제를 안정적으로 관찰할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: age=\"abc\"를 넣으면 매번 같은 ValueError가 나는지 확인합니다."},{"term":"reproduction steps 재현 절차","description":"재현 절차는 문제가 생길 때까지 한 행동을 순서대로 적은 것입니다. 누구든 그 순서대로 하면 같은 문제가 생기게 만드는 설명서입니다.","usage":"누구든 같은 문제를 다시 만들 수 있게 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 앱 실행 → 주문 0개 → 쿠폰 적용 → 결제 버튼."},{"term":"minimal reproduction 최소 재현","description":"최소 재현은 문제를 일으키는 데 꼭 필요한 부분만 남긴 작은 예제입니다. 큰 앱 전체 대신 문제가 나는 함수 몇 줄만 떼어 실행해서 원인을 보기 쉽게 만듭니다.","usage":"복잡한 앱에서 문제 범위를 줄일 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 500줄 앱 대신 오류 나는 함수 8줄만 떼어 실행합니다."},{"term":"root cause 근본원인","description":"근본원인은 겉으로 보이는 문제를 실제로 만들어 낸 진짜 원인입니다. 화면에 0원이 나온다고 해서 화면이 원인이라는 뜻은 아닙니다. 앞에서 total을 매번 0으로 지운 것이 진짜 원인일 수 있습니다.","usage":"표면적인 현상만 가리는 수정이 아닌 실제 원인을 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 합계가 0인 증상의 root cause가 반복마다 total을 초기화한 것일 수 있습니다."}]},{"id":"t3-c6-g3","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 3/4","title":"원인을 좁힐 때 쓰는 단어","paragraphs":["디버깅은 정답을 한 번에 맞히는 과정이 아니라, 가능한 원인을 하나씩 제거하는 과정입니다.","가설을 작게 만들고 확인할 증거를 정하면 ‘이것도 바꾸고 저것도 바꾸는’ 혼란을 줄일 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"debugging 디버깅","description":"디버깅은 버그의 진짜 원인을 찾아 고치고, 다시 확인하는 전체 과정입니다. 무작정 여러 줄을 바꾸는 것이 아니라 문제 범위를 조금씩 좁혀 가는 작업입니다.","usage":"오류 조사와 수정 과정을 통틀어 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 재현 → 가설 → 확인 → 수정 → 재검증."},{"term":"hypothesis 가설","description":"가설은 ‘아마 이게 원인일 것 같다’고 세우는 확인 가능한 추측입니다. 중요한 점은 추측에서 끝내지 않고 실제 값이나 테스트로 맞는지 확인하는 것입니다.","usage":"무엇을 먼저 검사할지 정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘쿠폰 적용 후 total이 문자열로 바뀌었을 것이다.’"},{"term":"isolation 격리","description":"격리는 여러 부분 중 하나만 따로 떼어 확인하는 것입니다. 화면, 계산, 네트워크가 모두 연결돼 있을 때 계산 함수만 따로 실행해 보는 식입니다.","usage":"UI·네트워크·계산 중 어느 층에서 틀렸는지 좁힐 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 화면을 제외하고 계산 함수만 직접 호출합니다."},{"term":"verification 검증","description":"검증은 ‘맞는 것 같다’가 아니라 실제 결과로 맞는지 확인하는 일입니다. 같은 입력으로 다시 실행하거나 테스트를 돌려 기대 결과가 나오는지 확인합니다.","usage":"‘고친 것 같다’를 ‘재현이 사라졌다’로 바꿀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 같은 입력으로 다시 실행해 기대값이 나오는지 확인합니다."}]},{"id":"t3-c6-g4","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 4/4","title":"실행 중 단서를 남길 때 쓰는 단어","paragraphs":["코드가 어디서 틀리는지 보이지 않을 때는 중간 상태를 관찰할 수 있는 단서를 남깁니다. 초보 단계에서는 print만으로도 강력한 디버깅이 가능합니다.","오류 메시지의 정보도 중요한 단서입니다. 무서운 영어 덩어리로 보더라도 파일·줄·예외 이름·마지막 설명을 나눠 읽으면 됩니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"traceback 오류 추적정보","description":"traceback은 Python이 예외가 났을 때 보여 주는 ‘어디를 거쳐 어디에서 실패했는지’에 대한 기록입니다. 처음에는 맨 아래 예외 이름과 내가 작성한 코드의 줄 번호부터 보면 됩니다.","usage":"예외가 실제로 터진 위치를 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 마지막 줄의 ValueError와 그 위의 파일 줄 번호를 확인합니다."},{"term":"log 로그","description":"로그는 프로그램이 실행되면서 남기는 기록입니다. 사용자가 보는 화면과 달리 개발자가 ‘언제 무엇이 일어났는지’를 나중에 확인하기 위해 남깁니다.","usage":"사용자가 볼 필요는 없지만 개발자가 실행 과정을 나중에 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘coupon applied: SAVE10, total=45000’ 같은 기록."},{"term":"debug print 디버그 출력","description":"디버그 출력은 원인을 찾으려고 중간값을 임시로 print해 보는 방법입니다. final만 보지 않고 total, discount 같은 중간값을 직접 확인하는 것입니다.","usage":"별도 디버거 없이 중간 상태를 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(\"before discount\", total)."},{"term":"fix 수정","description":"수정은 확인된 원인을 해결하기 위해 코드를 바꾸는 작업입니다. 가능하면 한 번에 여러 곳을 바꾸지 않고 원인과 직접 관련된 부분만 작게 바꿉니다.","usage":"원인 확인 뒤 최소 범위로 변경할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 잘못된 초기화 위치 한 줄을 반복 밖으로 옮깁니다."}]},{"id":"t3-c6-slow-start","kind":"concept","eyebrow":"CHAPTER 06 · 아주 천천히 시작하기","title":"오류가 보인 곳과 오류가 시작된 곳은 다를 수 있습니다","paragraphs":["프로그램에서 문제가 보이면 사람은 자연스럽게 그 화면부터 의심합니다. 하지만 화면은 마지막 결과를 보여 주는 곳일 뿐, 잘못된 값은 훨씬 앞에서 만들어졌을 수 있습니다.","예를 들어 영수증에 최종 금액이 0원으로 찍혔다고 해보겠습니다. 프린터가 고장 났을 수도 있지만, 계산 단계에서 total이 0이 되었을 수도 있고, 데이터가 비어 들어왔을 수도 있습니다. 같은 증상이라도 원인은 여러 가지입니다.","디버깅은 이 여러 가능성 중 실제 원인을 찾는 과정입니다. 그래서 ‘여기가 이상해 보인다’는 느낌보다 실제 값과 실행 결과를 확인합니다.","가장 쉬운 시작은 문제를 다시 만들고, 중간값을 하나씩 확인하는 것입니다. 처음으로 기대와 다른 값이 나온 지점이 원인에 가까운 곳입니다."]},{"id":"t3-c6-p1","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"‘안 돼요’ 대신 관찰한 증상을 정확히 적습니다","paragraphs":["디버깅을 잘하려면 처음부터 원인을 맞히려고 하지 않는 것이 중요합니다. 먼저 ‘내가 실제로 본 현상’만 정확히 적습니다.","예를 들어 ‘서버가 고장 났다’는 원인 추측입니다. ‘결제 버튼을 누르면 최종 금액이 0원으로 표시된다’는 관찰한 증상입니다.","증상을 사실 그대로 적어 두면 원인이 UI인지, 계산인지, 데이터인지 여러 가능성을 열어 둘 수 있습니다. 처음부터 한 원인에 꽂히는 실수를 줄여 줍니다.","디버깅의 첫 문장은 원인 추측이 아니라 관찰한 사실이어야 합니다. ‘서버가 이상하다’보다 ‘저장 버튼을 누르면 3초 뒤 화면이 멈추고 오류 문구가 뜬다’가 좋습니다.","증상과 원인을 섞으면 처음 세운 추측에 끌려갈 수 있습니다. 화면이 멈췄다고 해서 반드시 UI 코드가 원인은 아닙니다. 네트워크 응답이 늦거나 데이터 변환에서 예외가 났을 수도 있습니다.","문제를 기록할 때 입력값, 기대 결과, 실제 결과, 재현 절차를 같이 적으면 가설을 세우기 쉬워집니다.","AI에게 디버깅을 맡길 때도 이 네 가지를 주면 ‘아마 이럴 것’이라는 추측보다 실제 증거에 기반한 답을 받을 가능성이 높아집니다."]},{"id":"t3-c6-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"디버깅은 수정부터가 아니라 재현부터 시작합니다","paragraphs":["디버깅은 고장 난 부분을 보자마자 아무 코드나 바꾸는 작업이 아닙니다. 의사가 증상을 듣고 검사한 뒤 원인을 좁혀 가는 것과 비슷합니다.","먼저 같은 문제를 다시 만들 수 있어야 합니다. 그다음 ‘아마 여기일 것이다’라는 가설 하나를 세우고, 중간값이나 오류 메시지로 그 가설이 맞는지 확인합니다.","원인이 확인된 뒤에야 작은 수정을 합니다. 그리고 처음과 똑같은 방법으로 다시 실행해서 문제가 정말 사라졌는지 확인합니다.","문제를 발견하자마자 코드를 바꾸면 원래 문제가 무엇이었는지 사라져 검증하기 어려워질 수 있습니다.","먼저 같은 문제가 반복되는지 확인하고, 가능한 원인 가설 하나를 세운 뒤 그 가설을 확인할 최소한의 관찰을 합니다.","원인이 확인되면 작은 수정 하나를 적용하고 같은 재현 절차로 다시 확인합니다."],"visual":"DEBUG_LOOP","bullets":["증상 기록","재현","가설 하나 세우기","중간값·오류정보로 확인","최소 수정","같은 절차로 재검증"]},{"id":"t3-c6-p2","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"traceback은 맨 아래 예외 이름부터 읽습니다","paragraphs":["traceback은 처음 보면 영어가 길게 쏟아져 나와 겁이 날 수 있습니다. 전부 읽으려고 하지 않아도 됩니다.","처음에는 맨 아래 줄부터 봅니다. ValueError, TypeError, KeyError처럼 어떤 종류의 문제가 났는지와 짧은 설명이 있습니다. 그다음 위쪽에서 내가 작성한 파일 이름과 줄 번호를 찾습니다.","이 두 정보만으로도 ‘무슨 종류의 오류가 어느 줄에서 드러났는가’를 알 수 있습니다. 나머지 긴 경로는 필요할 때 천천히 보면 됩니다.","Python traceback은 위에서부터 읽으면 긴 경로가 먼저 보여 초보자에게 어렵습니다. 처음에는 맨 아래 줄의 예외 이름과 설명을 먼저 봅니다.","예를 들어 ValueError: invalid literal for int()라는 문구가 있다면 ‘문자열을 정수로 바꾸려 했는데 그 내용이 정수 형태가 아니다’라는 방향을 잡을 수 있습니다.","그다음 바로 위에서 내가 작성한 파일의 줄 번호를 찾습니다. 라이브러리 내부 경로가 여러 줄 있어도 우선 내 코드가 호출된 지점을 찾는 것이 중요합니다.","오류 메시지를 지우고 재실행하기 전에 그대로 복사해 두면 AI에게 질문하거나 검색할 때 훨씬 정확한 단서가 됩니다."]},{"id":"t3-c6-example1","kind":"example","eyebrow":"예제로 연결하기","title":"예외 메시지는 ‘무슨 값에서 실패했는가’를 알려 줍니다","paragraphs":["이 코드에서 int(\"abc\")가 실패하는 이유는 int 함수가 나빠서가 아닙니다. int는 숫자 모양의 글자를 숫자로 바꾸는 도구인데 \"abc\"는 숫자 모양이 아니기 때문입니다.","즉 겉으로 보이는 증상은 프로그램이 예외로 멈춘 것이고, 더 근본적인 문제는 ‘숫자로 바꿀 수 있는 입력인지 확인하지 않고 바로 변환했다’는 것입니다.","오류 메시지를 읽을 때는 ‘어떤 함수가 실패했지?’뿐 아니라 ‘그 함수에 실제로 어떤 값이 들어갔지?’까지 함께 보면 원인을 더 빨리 찾을 수 있습니다.","아래 코드는 문자열 \"abc\"를 int로 바꾸려고 하므로 ValueError가 발생합니다. 여기서 핵심 원인은 int 함수 자체가 고장난 것이 아니라 입력이 숫자 모양이 아니라는 점입니다.","증상은 프로그램이 멈춘 것이고, root cause는 숫자로 바꿀 수 없는 입력을 검사하지 않은 것입니다.","수정 방향은 무조건 try/except를 붙이는 것이 아니라 ‘어떤 입력을 허용할 것인가’를 먼저 정하는 것입니다."],"code":"age_text = \"abc\"\nage = int(age_text)\nprint(age)","codeNote":"실행하면 ValueError가 발생합니다. 오류 메시지의 마지막 줄과 age = int(age_text) 줄을 연결해 읽으세요.","codeExplain":["1단계: 1행: age_text에 숫자가 아닌 문자열을 저장합니다.","2단계: 2행: int가 문자열을 정수로 바꾸려고 시도합니다.","3단계: 2행: \"abc\"는 정수 형태가 아니므로 여기서 ValueError가 발생합니다.","4단계: 3행: 예외로 실행이 중단되므로 print까지 도달하지 못합니다."]},{"id":"t3-c6-p3","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"복잡한 문제는 최소 재현으로 줄입니다","paragraphs":["앱 전체가 5000줄인데 오류가 난다고 해서 5000줄을 모두 읽을 필요는 없습니다. 문제가 나는 부분을 작게 떼어 똑같은 현상이 생기는지 확인하면 됩니다.","예를 들어 주문 계산 화면에서 합계가 틀리다면 UI를 전부 빼고 계산 함수에 숫자 몇 개만 직접 넣어 볼 수 있습니다. 작은 코드에서도 같은 값이 틀리면 원인이 계산 쪽에 있을 가능성이 큽니다.","이렇게 문제를 작게 줄인 예제를 최소 재현이라고 합니다. 원인을 찾기 쉬워지고 AI에게 보여 줄 코드도 훨씬 짧아집니다.","앱 전체에서 오류가 날 때 모든 파일을 동시에 들여다보면 원인 후보가 너무 많습니다. 문제가 의심되는 함수와 입력만 따로 떼어 같은 문제가 나는지 확인합니다.","작게 줄였는데도 문제가 계속 나면 원인은 그 작은 범위 안에 있을 가능성이 높습니다. 반대로 문제가 사라지면 제거한 부분 중 하나가 조건에 관여했을 수 있습니다.","최소 재현은 원본 앱을 버리는 것이 아니라 조사용 복사본을 만드는 개념입니다. 운영 코드를 무작정 삭제하지 마세요.","AI에게도 5000줄 전체보다 20줄 최소 재현과 기대/실제 결과를 주면 더 정확한 분석을 기대할 수 있습니다."]},{"id":"t3-c6-example2","kind":"example","eyebrow":"예제로 연결하기","title":"중간값을 출력하면 처음 어긋난 지점을 찾을 수 있습니다","paragraphs":["최종 결과만 틀렸다고 해서 마지막 계산줄이 원인이라는 뜻은 아닙니다. 중간값이 이미 잘못됐다면 마지막 줄은 그 잘못된 값을 정상적으로 계산했을 뿐일 수 있습니다.","그래서 total, discount_amount, final을 각각 출력해 봅니다. total부터 틀리면 더 앞쪽을 보고, total은 맞는데 discount가 틀리면 할인 계산을 보면 됩니다.","이 방법은 문제 범위를 절반씩 줄여 가는 것과 같습니다. 중간값을 확인할수록 원인이 있을 수 있는 범위가 작아집니다.","아래 코드는 할인 후 금액이 예상과 다르다고 가정해 봅시다. 최종 final만 보면 어느 계산이 틀렸는지 알기 어렵습니다.","total과 discount_amount를 따로 출력하면 입력이 틀렸는지, 할인 계산이 틀렸는지, 마지막 뺄셈이 틀렸는지 범위를 나눌 수 있습니다.","문제를 해결한 뒤 불필요한 debug print는 제거하거나 정식 log로 바꾸는 것이 좋습니다."],"code":"total = 80000\nrate = 0.1\n\ndiscount_amount = total * rate\nfinal = total - discount_amount\n\nprint(\"total:\", total)\nprint(\"discount:\", discount_amount)\nprint(\"final:\", final)","codeNote":"정상이라면 total 80000, discount 8000.0, final 72000.0이 보입니다.","codeExplain":["1단계: 1~2행: 입력 상태를 고정합니다.","2단계: 4행: 할인액이라는 중간값을 따로 만듭니다.","3단계: 5행: 최종값을 계산합니다.","4단계: 7~9행: 각 단계의 실제 값을 노출해 처음 잘못된 값을 찾습니다."]},{"id":"t3-c6-p4","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"한 번에 한 가설만 바꾸면 원인을 잃지 않습니다","paragraphs":["버그를 보면 여러 군데가 수상해 보여 한꺼번에 고치고 싶을 수 있습니다. 하지만 세 곳을 동시에 바꾸면 문제가 사라져도 어느 변경이 진짜 해결책이었는지 알기 어렵습니다.","대신 ‘total을 반복문 안에서 0으로 만드는 것이 원인일 것이다’처럼 가설을 하나 세우고 그 부분만 바꿉니다.","문제가 해결되면 가설이 맞았다는 증거가 늘고, 해결되지 않으면 그 가설을 버리고 다음 가능성을 확인합니다. 실패한 가설도 원인 후보 하나를 제거했다는 점에서 의미가 있습니다.","버그를 발견하면 여러 줄을 동시에 고치고 싶은 마음이 생깁니다. 하지만 세 곳을 바꾼 뒤 문제가 사라지면 어느 수정이 실제 원인이었는지 알기 어렵습니다.","가설을 하나 정하고 그 가설을 확인하는 최소 변경만 적용하세요. 예를 들어 ‘total 초기화 위치가 문제다’라면 그 위치만 옮기고 같은 테스트를 다시 실행합니다.","변경 후 문제가 그대로면 가설이 틀렸다는 증거입니다. 실패한 가설도 가치가 있습니다. 원인 후보 하나를 제거했기 때문입니다.","이 방식은 느려 보이지만 큰 앱에서는 오히려 가장 빠릅니다. 특히 AI가 여러 파일을 한 번에 수정하려 할 때 변경 범위를 작게 유지하는 이유입니다."]},{"id":"t3-c6-p5","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"증상이 사라져도 다른 입력에서 망가지지 않았는지 확인합니다","paragraphs":["한 입력에서 문제가 사라졌다고 바로 끝내면 안 됩니다. 수정한 코드가 다른 정상 상황을 새로 망가뜨렸을 수도 있기 때문입니다.","예를 들어 음수 입력 문제를 고쳤다면 -1만 다시 보는 것이 아니라 0, 1, 50000 같은 원래 정상 값도 확인합니다.","이렇게 수정 때문에 예전 기능이 깨지지 않았는지 보는 습관이 다음 챕터의 회귀 테스트로 이어집니다.","특정 입력 하나에서 문제가 사라졌다고 디버깅이 끝난 것은 아닙니다. 수정 전 정상 동작하던 대표 입력도 다시 확인해야 합니다.","예를 들어 음수 입력 처리를 고쳤다면 정상 양수와 경계값 0도 다시 실행합니다. 새 수정이 기존 정상 경로를 깨뜨리지 않았는지 보는 것입니다.","다음 챕터에서 배우는 테스트와 회귀 검증은 바로 이 과정을 체계화합니다.","‘재현 안 됨’과 ‘원인이 해결됨’은 같지 않을 수 있습니다. 왜 문제가 생겼고 왜 이 수정이 해결하는지 한 문장으로 설명할 수 있어야 합니다."]},{"id":"t3-c6-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"증상에서 root cause까지 좁혀 보세요","paragraphs":["이 실습은 문법 오류가 없는 버그를 찾는 연습입니다. 코드가 실행된다는 사실만으로 결과가 맞다는 뜻은 아닙니다.","total 값이 반복할 때마다 어떻게 바뀌는지 적어 보면 어느 줄에서 이전 합계가 사라지는지 바로 보입니다.","아래 코드는 세 가격의 합계가 12000이 나와야 하지만 실제로 5000이 나옵니다.","문법 오류는 없으므로 traceback은 없습니다. 상태 추적과 최소한의 가설로 원인을 찾으세요.","수정은 한 줄의 위치만 바꾸면 됩니다."],"practicePrompt":"① 증상을 한 문장으로 쓰기 ② root cause가 되는 줄 찾기 ③ 최소 수정 후 기대 결과 쓰기","code":"prices = [3000, 4000, 5000]\n\nfor price in prices:\n    total = 0\n    total += price\n\nprint(total)","answerOnNext":true},{"id":"t3-c6-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"증상에서 root cause까지 좁혀 보세요 · 풀이","paragraphs":["풀이의 핵심은 total = 0의 위치입니다. 합계를 기억하려면 반복 전에 한 번만 0으로 만들고, 반복 안에서는 이전 total에 현재 price만 계속 더해야 합니다.","증상은 ‘세 가격 합계를 기대했지만 5000이 출력된다’입니다. root cause는 total = 0이 반복문 안에 있어 iteration마다 이전 합계를 지우는 것입니다.","total = 0을 for 앞에 한 번만 실행되도록 옮기면 total은 0→3000→7000→12000으로 누적됩니다.","수정 뒤에는 같은 입력에서 12000이 나오는지 확인하고, 빈 리스트에서도 0이 나오는지 함께 확인하면 더 안전합니다."],"code":"prices = [3000, 4000, 5000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"수정 후 출력은 12000입니다."},{"id":"t3-c6-check","kind":"check","eyebrow":"확인 문제","title":"증상과 원인을 구분할 수 있는지 확인합니다","paragraphs":["이 확인 문제는 눈에 보이는 현상과 실제 원인을 같은 것으로 착각하지 않는지 확인합니다.","문제가 보이는 위치와 실제 원인이 있는 위치는 다를 수 있습니다.","다음 질문에 ‘증상’과 ‘root cause’를 각각 한 문장으로 나눠 답해 보세요."],"question":"화면에 최종 금액이 0원으로 표시됩니다. 이 사실만으로 화면 UI 코드가 root cause라고 단정하면 안 되는 이유는 무엇일까요?","answerOnNext":true},{"id":"t3-c6-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"증상과 원인을 구분할 수 있는지 확인합니다 · 풀이","paragraphs":["풀이의 핵심은 total = 0의 위치입니다. 합계를 기억하려면 반복 전에 한 번만 0으로 만들고, 반복 안에서는 이전 total에 현재 price만 계속 더해야 합니다.","0원이 보이는 것은 사용자가 관찰한 증상입니다. 실제 root cause는 앞 단계 계산, 데이터 읽기, 타입 변환, 초기화 위치처럼 화면에 전달되기 전 어느 단계에도 있을 수 있습니다.","따라서 최종 화면에서 거꾸로 데이터 흐름을 따라가며 처음 값이 잘못된 지점을 찾아야 합니다."]},{"id":"t3-c6-summary","kind":"summary","eyebrow":"Chapter 6 정리","title":"디버깅은 감이 아니라 증거를 모으는 과정입니다","paragraphs":["디버깅은 정답을 빨리 맞히는 능력이 아니라 틀릴 수 있는 범위를 하나씩 줄이는 능력입니다. 증상을 정확히 적고, 같은 문제를 재현하고, 가설 하나를 증거로 확인하는 순서를 지키면 됩니다.","좋은 디버깅은 문제를 보자마자 코드를 바꾸는 것이 아니라 증상을 정확히 기록하고 같은 조건에서 재현하는 것부터 시작합니다.","가설을 하나 세우고 중간값·traceback·최소 재현으로 범위를 좁힌 뒤, 원인이 확인되면 최소
