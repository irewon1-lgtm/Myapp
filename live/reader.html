엇이었고, 실행 직후 무엇이 바뀌었지?’를 함께 묻는 것이 좋습니다.","이 질문 습관만 생겨도 AI가 만든 코드에서 값이 이상하게 바뀌는 지점을 훨씬 빨리 찾을 수 있습니다."],"calloutTitle":"한 줄을 읽는 두 질문","calloutBody":"실행 전: 변수 값은 무엇인가? → 실행 후: 어떤 값이 새로 저장되었는가?"},{"id":"t3-c3-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"입력에서 출력까지 화살표를 그리면 길이 보입니다","paragraphs":["코드가 길어지면 처음부터 모든 줄을 이해하려고 하지 않아도 됩니다. 먼저 값 하나가 어디서 들어와서 마지막에 어디로 나가는지만 따라가면 전체 길이 보이기 시작합니다.","장바구니 앱이라면 사용자가 넣은 상품 가격들이 입력입니다. 이 가격들이 반복문을 지나면서 total에 더해지고, 할인 계산을 지나 final_price가 되고, 마지막에는 화면에 표시됩니다. 이 한 줄짜리 흐름을 먼저 잡으면 중간 코드가 훨씬 덜 복잡해 보입니다.","즉 데이터 흐름은 ‘값의 여행 경로’입니다. 출발지, 중간 정류장, 도착지만 먼저 표시한 뒤 각 정류장에서 무슨 일이 일어나는지 천천히 보면 됩니다.","코드가 길어지면 세부 문법보다 먼저 큰 데이터 흐름을 잡으세요. 값이 어디서 들어와 어떤 중간값을 만들고 마지막에 어디로 나가는지 화살표로 적습니다.","예를 들어 상품 가격 리스트가 입력되고, 반복문에서 total이라는 누적값으로 모인 뒤, 할인 계산을 거쳐 final_price가 되고, 마지막에 print로 출력될 수 있습니다.","중간값이 많아도 화살표는 한 번에 전부 그릴 필요가 없습니다. 지금 궁금한 출력 하나를 고른 뒤 그 값이 의존하는 변수만 거꾸로 따라가도 됩니다."],"visual":"INPUT_TO_OUTPUT","bullets":["prices 입력 → 반복문에서 total 계산","total → 할인 조건 판단","할인 결과 → final_price","final_price → 화면 출력"]},{"id":"t3-c3-example1","kind":"example","eyebrow":"예제로 연결하기","title":"누적값은 매 반복마다 ‘이전 결과 + 새 값’으로 바뀝니다","paragraphs":["여기서 가장 중요한 것은 total이 매 반복마다 새로 생기는 값이 아니라는 점입니다. total은 앞에서 계산한 결과를 계속 기억하는 변수입니다.","처음에는 total이 0입니다. 첫 번째 가격 3000을 만나면 0+3000이 되어 3000을 기억합니다. 두 번째 가격 4000을 만날 때는 다시 0에서 시작하는 것이 아니라 이미 기억하고 있던 3000에 4000을 더해 7000이 됩니다.","이 과정을 ‘누적한다’고 부릅니다. 장바구니에 물건을 하나씩 넣을 때 총액이 계속 커지는 것과 똑같습니다. 그래서 total 같은 누적값은 반복문을 이해할 때 아주 자주 등장합니다.","아래 코드는 가격 세 개를 차례로 더합니다. 핵심은 total이 매번 0에서 다시 시작하지 않고 이전 반복의 결과를 기억한다는 점입니다.","첫 번째 반복 전 total은 0입니다. price가 3000이 되면 total은 3000이 됩니다. 두 번째 반복에서는 그 3000이 그대로 남아 있으므로 3000 + 4000 = 7000이 됩니다.","세 번째 반복에서 7000 + 5000 = 12000이 되고 반복이 끝납니다. 이처럼 누적값은 실행의 과거를 숫자 하나에 압축해서 기억합니다."],"code":"prices = [3000, 4000, 5000]\ntotal = 0\n\nfor price in prices:\n    total = total + price\n\nprint(total)","codeNote":"예상 출력은 12000입니다. total의 변화만 따로 적으면 0 → 3000 → 7000 → 12000입니다.","codeExplain":["1단계: 1행: prices에 세 가격을 입력으로 저장합니다.","2단계: 2행: 아직 아무 가격도 더하지 않았으므로 누적값 total을 0에서 시작합니다.","3단계: 4행: prices에서 값을 하나씩 꺼내 price에 넣습니다.","4단계: 5행: 현재 total과 현재 price를 더한 결과를 다시 total에 저장합니다.","5단계: 7행: 반복이 모두 끝난 뒤 최종 누적값을 출력합니다."]},{"id":"t3-c3-p2","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"추적표에는 ‘필요한 값만’ 적습니다","paragraphs":["추적표는 어려운 표를 만드는 공부가 아닙니다. 머릿속으로 여러 값을 동시에 기억하기 힘드니, 필요한 숫자 몇 개를 종이에 대신 적어 두는 것입니다.","예를 들어 가격을 더하는 코드라면 모든 변수를 적을 필요가 없습니다. 지금 몇 번째 가격을 보고 있는지, 현재 price가 얼마인지, total이 얼마가 되었는지만 적어도 충분합니다.","코드가 30줄이어도 실제로 궁금한 값이 total 하나라면 total에 영향을 주는 변수만 추적하면 됩니다. 이렇게 범위를 줄이면 긴 코드도 한 번에 이해해야 한다는 부담이 크게 줄어듭니다.","처음 추적표를 만들 때 모든 변수를 다 적으려고 하면 표가 코드보다 복잡해질 수 있습니다. 지금 확인하려는 결과에 영향을 주는 값부터 고르세요.","앞 예제라면 반복 횟수, price, total 세 열이면 충분합니다. 첫 번째 행에는 price=3000, total=3000을 적고, 두 번째 행에는 price=4000, total=7000을 적습니다.","조건문이 있다면 조건 결과 True/False 열을 하나 더 넣으면 좋습니다. 그러면 ‘왜 이 분기로 들어갔는가’가 숫자와 함께 보입니다.","추적표는 정답지가 아닙니다. 내 머릿속 예상 실행을 밖으로 꺼내 놓는 도구입니다. 실제 출력과 다르면 표에서 처음 어긋나는 행을 찾으면 됩니다."],"bullets":["반복 번호","이번에 들어온 값","바뀌기 전 값","바뀐 뒤 값","필요하면 조건 결과 True/False"]},{"id":"t3-c3-example2","kind":"example","eyebrow":"예제로 연결하기","title":"값을 초기화하는 위치 하나가 전체 결과를 바꿉니다","paragraphs":["이 예제는 초보자가 정말 자주 헷갈리는 부분을 보여 줍니다. total = 0이라는 같은 한 줄도 ‘어디에 놓이느냐’에 따라 완전히 다른 결과를 만듭니다.","반복문 밖에 있으면 프로그램이 시작할 때 한 번만 total을 0으로 만듭니다. 그다음에는 이전 합계를 계속 기억할 수 있습니다. 반대로 반복문 안에 있으면 새 가격을 볼 때마다 total을 다시 0으로 지웁니다.","그래서 마지막에는 세 가격의 합계가 아니라 마지막 가격 5000만 남습니다. 코드는 오류 없이 실행되므로 컴퓨터는 아무 경고도 하지 않습니다. 이런 문제를 찾으려면 값이 언제 초기화되고 언제 바뀌는지 추적해야 합니다.","아래 코드는 겉보기에는 앞 예제와 비슷하지만 total = 0이 반복문 안에 있습니다. 그래서 매 반복이 시작될 때 지금까지 모은 합계를 지워 버립니다.","첫 번째 반복에서는 3000, 두 번째에서는 4000, 세 번째에서는 5000이 total에 들어갑니다. 마지막 반복이 끝난 뒤 남는 값은 5000뿐입니다.","이런 버그는 문법 오류가 아니어서 코드가 정상 실행됩니다. 그래서 ‘실행됐으니 맞다’가 아니라 상태가 언제 초기화되는지 추적해야 합니다."],"code":"prices = [3000, 4000, 5000]\n\nfor price in prices:\n    total = 0\n    total = total + price\n\nprint(total)","codeNote":"이 코드는 12000이 아니라 5000을 출력합니다. total = 0의 위치가 반복 밖인지 안인지가 핵심입니다.","codeExplain":["1단계: 1행: 세 가격을 준비합니다.","2단계: 3행: 각 가격마다 반복을 시작합니다.","3단계: 4행: 반복할 때마다 total을 0으로 다시 만듭니다. 이전 합계가 여기서 사라집니다.","4단계: 5행: 0 + 현재 price만 계산하므로 이번 가격만 남습니다.","5단계: 7행: 마지막 반복에서 남은 5000이 출력됩니다."]},{"id":"t3-c3-p3","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"조건문을 추적할 때는 값보다 ‘선택된 길’을 함께 적습니다","paragraphs":["조건문이 들어가면 숫자만 보는 것으로는 부족합니다. 같은 값이 있어도 조건이 True인지 False인지에 따라 다음에 실행되는 코드가 달라지기 때문입니다.","예를 들어 stock이 0이면 품절 안내로 가고, stock이 3이면 결제 코드로 갑니다. 이때 중요한 것은 ‘stock이 얼마인가’와 함께 ‘stock > 0의 결과가 True인가 False인가’를 적는 것입니다.","조건이 여러 개라면 위에서부터 어떤 조건을 검사했고 어느 지점에서 처음 True가 되었는지를 표시하세요. 그러면 왜 특정 코드가 실행되고 다른 코드는 건너뛰었는지 눈에 보입니다.","조건문에서는 변수 값만 적으면 왜 어떤 코드가 실행되지 않았는지 놓칠 수 있습니다. 조건식의 결과와 실제로 선택된 분기를 함께 기록하세요.","예를 들어 stock > 0이 True였다면 결제 가능 경로로 들어가고, False였다면 품절 경로로 갑니다. 여기서 중요한 것은 두 길이 동시에 실행되지 않는다는 점입니다.","여러 elif가 있으면 위에서부터 검사하다 처음 True가 된 분기 하나를 선택합니다. 추적표에 각 조건의 결과를 적으면 조건 순서가 잘못된 문제도 찾기 쉽습니다.","AI가 긴 조건문을 만들었을 때도 입력 하나를 정하고 ‘첫 조건은? 다음 조건은? 실제로 어디에 들어갔나?’만 차례대로 확인하면 됩니다."]},{"id":"t3-c3-p4","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"불변조건은 ‘이 상태는 절대 나오면 안 된다’를 알려줍니다","paragraphs":["불변조건이라는 이름은 어렵지만 뜻은 간단합니다. 값이 계속 바뀌는 중에도 ‘이 선만큼은 절대 넘으면 안 된다’고 정한 안전 규칙입니다.","재고가 3개라면 판매할 때 3→2→1→0으로 바뀌는 것은 정상입니다. 하지만 -1이 되는 순간은 이상합니다. 이때 ‘재고는 0보다 작아지면 안 된다’가 불변조건입니다.","이런 규칙을 미리 알고 있으면 마지막 결과까지 기다리지 않아도 됩니다. 중간에 stock이 -1이 되는 순간 바로 ‘여기서부터 잘못됐다’고 찾을 수 있습니다.","추적표를 적다 보면 값은 계속 변합니다. 그중에는 변해도 되는 값과 어떤 순간에도 규칙을 깨면 안 되는 값이 있습니다.","예를 들어 재고가 3개인 상품을 한 개씩 판매한다면 stock은 3→2→1→0으로 바뀔 수 있습니다. 하지만 -1이 되는 순간은 허용하면 안 됩니다. ‘stock >= 0’은 이 과정에서 지켜야 할 불변조건입니다.","불변조건을 미리 정해 두면 최종 출력이 틀렸을 때까지 기다리지 않고 중간 상태에서 이상을 발견할 수 있습니다.","초보 단계에서는 거창하게 생각하지 말고 ‘이 값은 절대로 음수가 되면 안 됨’, ‘처리한 개수는 전체 개수보다 클 수 없음’처럼 한 문장으로 적으면 충분합니다."]},{"id":"t3-c3-example3","kind":"example","eyebrow":"예제로 연결하기","title":"카운터와 누적값은 역할이 다릅니다","paragraphs":["count와 total은 둘 다 숫자라서 비슷해 보이지만 맡은 일이 다릅니다. count는 몇 개인지 세고, total은 금액을 모읍니다.","7000원짜리 상품 하나를 만나면 count는 1만 늘지만 total은 7000이 늘어납니다. 다음에 9000원짜리 상품을 만나면 count는 다시 1 늘어 2가 되고, total은 9000이 더해져 16000이 됩니다.","같은 반복문 안에 있는 변수라도 ‘무엇을 기억하려고 만든 변수인지’를 먼저 정하면 값 변화가 훨씬 쉽게 읽힙니다.","아래 코드는 주문 가격 중 5000원 이상인 항목의 개수와 금액 합계를 동시에 구합니다. count는 몇 개인지 세는 카운터이고, total은 금액을 모으는 누적값입니다.","같은 반복 안에서 두 변수가 모두 바뀌지만 변화 규칙이 다릅니다. count는 조건을 만족할 때마다 1씩 늘고, total은 해당 가격만큼 늘어납니다.","변수 이름과 역할을 구분해 놓으면 추적할 때 ‘왜 이 값이 1 늘었지?’와 ‘왜 이 값이 7000 늘었지?’를 혼동하지 않습니다."],"code":"prices = [3000, 7000, 9000]\ncount = 0\ntotal = 0\n\nfor price in prices:\n    if price >= 5000:\n        count += 1\n        total += price\n\nprint(count, total)","codeNote":"예상 출력은 2 16000입니다. 7000과 9000 두 항목만 조건을 만족합니다.","codeExplain":["1단계: 2행: 조건을 만족한 항목 수를 셀 count를 0으로 시작합니다.","2단계: 3행: 조건을 만족한 금액을 모을 total도 0으로 시작합니다.","3단계: 6행: 현재 가격이 5000 이상인지 검사합니다.","4단계: 7행: 조건을 만족한 항목 하나를 발견했으므로 count를 1 늘립니다.","5단계: 8행: 그 항목의 가격을 total에 더합니다.","6단계: 10행: 최종 개수와 합계를 함께 확인합니다."]},{"id":"t3-c3-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"추적표를 만들어 최종 값을 먼저 예상하세요","paragraphs":["이 실습에서는 코드를 외우는 것이 아니라 값이 움직이는 순서를 천천히 적는 것이 목표입니다. 바로 정답을 계산하려 하지 말고 반복 한 번마다 무엇이 바뀌는지만 확인하세요.","종이에 n, 조건 결과, score 세 칸을 만들고 첫 번째 반복부터 한 줄씩 적으면 됩니다. 머릿속에서 한 번에 계산할 필요가 없습니다.","아래 코드를 바로 실행하지 말고 먼저 손으로 추적해 보세요. 표에는 n, 조건 결과, score 세 열을 만들면 충분합니다.","score가 바뀌는 줄은 조건 안에 있으므로 모든 반복에서 값이 변하지는 않습니다. 어느 반복에서 그대로 유지되는지도 표시하세요.","마지막에는 출력값만 적지 말고 score가 어떤 순서로 변했는지 화살표로 적어 보세요."],"practicePrompt":"① n이 1, 2, 3, 4일 때 n % 2 == 0이 True인지 적기 ② score의 변화를 적기 ③ 최종 출력 예상하기","code":"score = 0\n\nfor n in [1, 2, 3, 4]:\n    if n % 2 == 0:\n        score += n\n\nprint(score)","answerOnNext":true},{"id":"t3-c3-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"추적표를 만들어 최종 값을 먼저 예상하세요 · 풀이","paragraphs":["풀이에서는 score 하나만 따라가면 됩니다. n이 홀수일 때는 조건이 False라 아무것도 더하지 않고, 짝수일 때만 현재 n을 score에 더합니다.","n=1에서는 짝수 조건이 False라서 score는 0 그대로입니다. n=2에서는 True라서 2가 더해져 score=2가 됩니다.","n=3에서는 다시 False라서 score는 2를 유지합니다. n=4에서는 True라서 4가 더해져 score=6이 됩니다.","중요한 점은 반복할 때마다 score가 초기화되지 않는다는 것입니다. 조건이 False인 반복에서도 이전 값은 그대로 남습니다."],"code":"n=1 → False → score 0\nn=2 → True  → score 2\nn=3 → False → score 2\nn=4 → True  → score 6","codeNote":"최종 출력은 6입니다."},{"id":"t3-c3-check","kind":"check","eyebrow":"확인 문제","title":"상태 추적의 핵심을 확인합니다","paragraphs":["이 확인 문제는 용어를 외웠는지보다 ‘이전 값을 기억해야 하는 이유’를 자기 말로 설명할 수 있는지 확인합니다.","다음 질문은 문법 암기가 아니라 실행을 읽는 방법을 확인하는 문제입니다.","답할 때 ‘어느 줄에서 이전 값이 사라지는가’를 우선 찾아보세요."],"question":"반복문으로 합계를 구하는 코드에서 누적값을 반복문 안에서 매번 0으로 다시 만들면 왜 최종 합계가 나오지 않을까요?","answerOnNext":true},{"id":"t3-c3-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"상태 추적의 핵심을 확인합니다 · 풀이","paragraphs":["풀이에서는 score 하나만 따라가면 됩니다. n이 홀수일 때는 조건이 False라 아무것도 더하지 않고, 짝수일 때만 현재 n을 score에 더합니다.","누적값은 이전 반복까지의 결과를 기억해야 합니다. 그런데 반복문 안에서 매번 0으로 대입하면 그 기억을 지운 뒤 현재 값만 더하게 됩니다.","따라서 합계를 위한 누적값은 일반적으로 반복이 시작되기 전에 한 번 초기화하고, 반복 안에서는 이전 값에 새 값을 더하는 형태로 갱신합니다."]},{"id":"t3-c3-summary","kind":"summary","eyebrow":"Chapter 3 정리","title":"값의 변화가 보이면 긴 코드도 읽을 수 있습니다","paragraphs":["이 챕터에서 가장 먼저 기억할 것은 ‘코드를 한꺼번에 이해하려 하지 않아도 된다’는 점입니다. 한 줄씩 실행 순서대로 보면서 바뀌는 값만 적으면 긴 코드도 작은 단계들의 연속으로 바뀝니다.","상태 추적은 개발자만 쓰는 특별한 기술이 아니라, 코드를 천천히 읽기 위한 기본 도구입니다. 실행 전과 실행 후를 나누고, 바뀌는 변수만 기록하면 됩니다.","반복문에서는 iteration마다 카운터와 누적값이 어떻게 변하는지 보고, 조건문에서는 True/False와 선택된 경로를 함께 적습니다.","다음 챕터에서는 이렇게 읽은 흐름을 반대로 사용합니다. 즉, 원하는 동작을 만들기 위해 순차 실행·조건·반복을 어떻게 배치할지 직접 설계합니다."],"bullets":["값이 이상하면 마지막 출력부터 보지 말고 처음 어긋난 상태를 찾는다.","추적표는 필요한 변수와 조건 결과만 적는다.","카운터·누적값·불변조건의 역할을 구분한다.","실행됨과 정답은 다르다. 상태가 의도대로 변했는지 확인한다."]}]},{"id":"t3-c4","track":3,"chapter":4,"title":"조건과 반복으로 흐름 설계하기","remember":"순차 실행·분기·반복 중 어떤 흐름이 필요한지 먼저 고르고, 종료 조건과 경계값을 확인한다","practiceGoal":"자연어 규칙을 if·for·while 흐름으로 바꾸고 무한 반복과 한 칸 차이 오류를 예방한다","pages":[{"id":"t3-c4-g1","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 1/4","title":"프로그램의 길을 설계할 때 쓰는 단어","paragraphs":["챕터 3에서는 이미 있는 코드를 따라갔습니다. 이제는 반대로 ‘이 문제라면 어떤 길을 만들어야 할까?’를 설계합니다.","프로그램의 흐름은 복잡해 보여도 크게 순차 실행, 조건에 따른 분기, 반복 세 가지를 조합한 것입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"control flow 제어 흐름","description":"제어 흐름은 프로그램이 어느 길로 움직이는지를 말합니다. 위에서 아래로 그대로 갈 수도 있고, 조건에 따라 길이 갈라질 수도 있고, 반복문 때문에 같은 구간을 다시 돌 수도 있습니다.","usage":"코드의 길이 어디서 갈리고 어디서 되돌아오는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 입력 → 검사 → 계산 → 출력이 하나의 control flow입니다."},{"term":"sequence 순차 실행","description":"순차 실행은 가장 단순한 흐름입니다. 1번 일을 하고, 그다음 2번 일을 하고, 그다음 3번 일을 하는 식으로 위에서 아래로 한 번씩 진행합니다.","usage":"항상 같은 순서로 해야 하는 단계에 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 이름 받기 → 인사문 만들기 → 출력하기."},{"term":"condition 조건","description":"조건은 ‘맞아, 아니야?’처럼 True 또는 False로 답할 수 있는 기준입니다. 예를 들어 age >= 19는 ‘나이가 19 이상인가?’라는 질문을 코드로 적은 것입니다.","usage":"다음에 어느 길로 갈지 결정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total >= 50000."},{"term":"boolean 참·거짓 값","description":"boolean은 True와 False 둘 중 하나인 값입니다. ‘로그인했는가’, ‘재고가 있는가’, ‘성인인가’처럼 예/아니오로 나뉘는 상황을 컴퓨터가 표현할 때 씁니다.","usage":"분기 여부를 명확하게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: stock > 0의 결과가 True이면 재고가 있다는 뜻입니다."}]},{"id":"t3-c4-g2","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 2/4","title":"길이 갈라질 때 쓰는 단어","paragraphs":["분기는 현실의 규칙을 코드의 길로 옮기는 방법입니다. 모든 경우를 똑같이 처리하지 않고 상황에 따라 다른 행동을 선택합니다.","조건이 많아질수록 순서가 중요해집니다. 넓은 조건을 먼저 두면 더 구체적인 조건이 영원히 선택되지 않을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"branch 분기","description":"분기는 길이 갈라지는 것입니다. 비가 오면 우산을 챙기고, 비가 안 오면 그냥 나가는 것처럼 조건 결과에 따라 프로그램도 서로 다른 코드를 실행합니다.","usage":"회원·비회원, 성공·실패처럼 처리 방식이 달라질 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: if/else는 두 갈래 branch를 만듭니다."},{"term":"if","description":"if는 ‘이 조건이 맞으면 아래 코드를 실행해’라는 뜻입니다. if 뒤의 조건이 True일 때만 들여쓰기된 코드가 실행됩니다.","usage":"어떤 규칙을 만족할 때만 행동해야 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: if age >= 19:."},{"term":"elif","description":"elif는 ‘앞 조건은 아니었는데, 그럼 이 조건은 어때?’라는 뜻입니다. 여러 선택지 중 하나를 고를 때 if 다음에 이어서 사용합니다.","usage":"등급처럼 여러 구간 중 하나를 선택할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: elif score >= 80:."},{"term":"guard clause 조기 차단","description":"조기 차단은 잘못된 입력을 초반에 바로 걸러 내는 방법입니다. 예를 들어 나이가 -3이라면 뒤의 할인 계산까지 보내지 않고 처음부터 ‘잘못된 나이’라고 끝내는 식입니다.","usage":"잘못된 값이 뒤 계산으로 흘러가는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 금액이 음수면 바로 오류를 알리고 계산을 멈춥니다."}]},{"id":"t3-c4-g3","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 3/4","title":"같은 일을 되풀이할 때 쓰는 단어","paragraphs":["반복은 ‘같은 코드를 여러 번 쓰지 않기 위해서’만 존재하는 것이 아닙니다. 여러 데이터 항목을 같은 규칙으로 처리하거나 어떤 조건이 만족될 때까지 작업을 계속하는 구조입니다.","for와 while의 차이를 문법으로 외우기보다 반복 횟수를 미리 아는지, 종료 조건을 계속 확인해야 하는지로 판단하면 쉽습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"loop 반복","description":"반복은 같은 종류의 일을 여러 번 하는 것입니다. 상품 100개를 하나씩 확인할 때 코드를 100번 복사하지 않고 반복문 하나로 처리합니다.","usage":"여러 항목을 처리하거나 조건이 바뀔 때까지 일을 계속할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 가격 리스트의 모든 항목을 하나씩 확인합니다."},{"term":"iteration 반복 1회","description":"반복 1회는 반복문 안의 코드를 처음부터 끝까지 한 번 실행하는 것입니다. 가격이 세 개라면 첫 번째 가격을 처리하는 1회, 두 번째 가격을 처리하는 1회, 세 번째 가격을 처리하는 1회가 생깁니다.","usage":"몇 번째 반복에서 어떤 값이 나왔는지 추적할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 세 항목이면 보통 세 번의 iteration이 있습니다."},{"term":"for","description":"for는 ‘여기 있는 것들을 하나씩 꺼내서 처리해’에 가깝습니다. 리스트에 사과, 바나나, 포도가 있으면 첫 번째부터 하나씩 꺼내 같은 작업을 할 수 있습니다.","usage":"처리할 항목이 명확할 때 주로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: for price in prices:."},{"term":"while","description":"while은 ‘이 조건이 맞는 동안 계속해’라는 뜻입니다. 몇 번 할지보다 언제 끝날지가 더 중요한 반복에 자주 사용합니다.","usage":"몇 번 반복할지보다 ‘언제 끝낼지’가 중요한 문제에 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: while tries \u003c 3:."}]},{"id":"t3-c4-g4","kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 4/4","title":"반복이 멈추는지 확인할 때 쓰는 단어","paragraphs":["while은 특히 종료 조건이 중요합니다. 조건이 계속 True로 남으면 프로그램이 끝나지 않습니다. 반복 변수를 어떻게 바꾸는지까지 한 세트로 봐야 합니다.","또 반복의 시작과 끝에서 하나를 더 처리하거나 덜 처리하는 실수가 자주 생깁니다. 이런 오류를 이름으로 알아두면 찾기가 쉬워집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"termination condition 종료 조건","description":"종료 조건은 반복이 언제 멈출지를 결정하는 기준입니다. while에서는 이 조건이 언젠가 False가 되어야 반복이 끝납니다.","usage":"while을 설계할 때 반드시 확인합니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: tries \u003c 3은 tries가 3이 되면 False가 됩니다."},{"term":"infinite loop 무한 반복","description":"무한 반복은 반복이 끝나는 조건이 영원히 만들어지지 않아 계속 도는 상태입니다. count \u003c 3인데 count를 한 번도 늘리지 않으면 count는 계속 0이라 반복이 끝나지 않습니다.","usage":"프로그램이 멈추지 않는 원인을 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: while count \u003c 3인데 count를 증가시키지 않으면 끝나지 않습니다."},{"term":"off-by-one 한 칸 차이 오류","description":"한 칸 차이 오류는 딱 하나를 더 하거나 덜 해서 생기는 실수입니다. 세 번 반복해야 하는데 두 번만 하거나, 0부터 4까지 다섯 개를 처리해야 하는데 네 개만 처리하는 경우가 대표적입니다.","usage":"횟수·인덱스·범위의 시작과 끝을 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 1~3까지 세 번 해야 하는데 1~2까지만 실행되는 경우입니다."},{"term":"break·continue","description":"break는 반복 전체를 여기서 끝내는 것이고, continue는 이번 한 번만 건너뛰고 다음 반복으로 가는 것입니다. ‘퇴근’과 ‘이번 일만 패스’ 정도로 차이를 생각하면 쉽습니다.","usage":"특정 상황에서 반복의 일반 흐름을 바꿀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 잘못된 항목을 continue로 건너뛸 수 있습니다."}]},{"id":"t3-c4-slow-start","kind":"concept","eyebrow":"CHAPTER 04 · 아주 천천히 시작하기","title":"if·for·while은 컴퓨터에게 길을 알려 주는 표지판입니다","paragraphs":["if, for, while을 처음 보면 서로 다른 어려운 문법처럼 보이지만 실제로는 프로그램의 이동 방법을 정하는 세 가지 표지판이라고 생각하면 됩니다.","if는 갈림길입니다. ‘조건이 맞으면 이쪽으로 가고, 아니면 다른 쪽으로 가라’고 정합니다. for는 목록을 하나씩 꺼내는 반복입니다. ‘이 목록에 있는 것들을 하나씩 전부 처리해라’에 가깝습니다. while은 조건을 확인하면서 계속 도는 반복입니다. ‘이 조건이 맞는 동안 계속해라’라는 뜻입니다.","예를 들어 학교 출입을 생각해 보겠습니다. 학생증이 있으면 들어가고 없으면 안내실로 간다면 if입니다. 학생 30명의 이름을 하나씩 확인한다면 for입니다. 대기 번호가 내 번호가 될 때까지 계속 전광판을 확인한다면 while과 비슷합니다.","코드를 만들 때는 먼저 현실의 행동을 이 세 가지 중 어디에 해당하는지 나눕니다. 그다음 Python 문법으로 옮기면 됩니다. 문법을 먼저 고르는 것보다 훨씬 쉽습니다."]},{"id":"t3-c4-p1","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"먼저 ‘한 번’, ‘갈림’, ‘되풀이’로 문장을 표시하세요","paragraphs":["프로그램 흐름을 설계할 때 처음부터 if, for, while 문법을 떠올릴 필요는 없습니다. 먼저 해야 할 일을 한국어 문장으로 적고, 그 문장이 어떤 종류인지 나누면 됩니다.","항상 한 번 하는 일은 순서대로 실행하면 됩니다. 어떤 상황에서만 하는 일은 조건이 필요합니다. 같은 일을 여러 대상에 해야 한다면 반복이 필요합니다.","예를 들어 ‘상품을 모두 본다 → 재고가 있는 상품만 금액을 더한다 → 마지막에 합계를 보여 준다’라는 문장에서 ‘모두 본다’는 반복, ‘재고가 있는 상품만’은 조건, ‘합계를 보여 준다’는 마지막 순차 실행입니다.","자연어 요구사항을 보면 문법 이름부터 고르지 말고 각 문장이 어떤 흐름인지 표시합니다. 한 번만 하는 일은 순차 실행, 상황에 따라 달라지는 일은 분기, 여러 번 해야 하는 일은 반복입니다.","예를 들어 ‘상품 목록을 모두 확인한다. 재고가 있는 상품만 금액에 더한다. 마지막에 합계를 보여 준다’에서 ‘모두 확인한다’는 반복, ‘재고가 있는 상품만’은 분기, ‘합계를 보여 준다’는 순차 실행입니다.","이렇게 문제 문장을 흐름 유형으로 번역하면 필요한 문법이 뒤에서 자연스럽게 결정됩니다. for 안에 if가 들어가는 이유도 문장 자체가 ‘각 항목마다 조건을 확인한다’이기 때문입니다.","복잡한 코드는 결국 이 세 구조가 겹친 것입니다. 한 겹씩 분리해서 보면 초보자도 설계할 수 있습니다."]},{"id":"t3-c4-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"제어 흐름은 직선·갈림길·되돌아오는 길의 조합입니다","paragraphs":["제어 흐름은 도로라고 생각하면 쉽습니다. 직진만 있는 길도 있고, 신호등에서 두 갈래로 나뉘는 길도 있고, 로터리처럼 같은 구간을 다시 도는 길도 있습니다.","코드도 똑같습니다. 일반 코드는 아래로 직진합니다. if를 만나면 조건에 따라 길이 갈라집니다. for나 while을 만나면 일정 구간을 다시 실행합니다.","복잡한 프로그램도 결국 이 세 가지 길이 여러 번 연결된 것입니다. 처음에는 화살표 몇 개로 길을 그린 뒤 그 길을 Python 문법으로 옮기면 됩니다.","순차 실행은 화살표가 아래로만 내려갑니다. 분기는 조건에서 두 개 이상의 길로 갈라지고, 반복은 일정 구간을 다시 위로 돌아옵니다.","코드로 보기 전에 간단한 화살표 그림을 그리면 잘못된 순서나 빠진 경로를 찾기 쉽습니다.","특히 오류 처리 경로를 정상 경로와 분리해 그리면 뒤 코드가 덜 복잡해집니다."],"visual":"CONTROL_FLOW","bullets":["순차 실행: A → B → C","분기: 조건 → True 길 / False 길","반복: 조건 또는 항목 → 본문 → 다시 확인","끝나는 지점: 모든 경로가 어디에서 종료되는지 표시"]},{"id":"t3-c4-p2","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"조건 순서는 ‘더 구체적인 것부터’ 확인하면 안전합니다","paragraphs":["elif가 여러 개 있을 때 Python은 모든 조건을 끝까지 검사하지 않습니다. 위에서부터 보다가 처음 True가 나온 순간 그 길로 들어가고 나머지는 건너뜁니다.","그래서 점수 조건에서 80점 이상을 먼저 두고 90점 이상을 그 아래 두면 문제가 생깁니다. 95점도 80점 이상이므로 첫 조건에서 이미 True가 되어 B로 끝나기 때문입니다.","이런 코드는 문법 오류가 나지 않습니다. 컴퓨터는 우리가 적은 순서 그대로 충실히 실행합니다. 따라서 여러 구간을 나눌 때는 어떤 조건을 먼저 검사해야 원하는 구간이 정확히 선택되는지 사람이 정해야 합니다.","elif 체인은 위에서부터 처음 True가 된 길 하나만 선택합니다. 따라서 넓은 조건을 먼저 두면 아래의 구체적인 조건이 실행될 기회를 잃을 수 있습니다.","점수가 90 이상이면 A, 80 이상이면 B라고 할 때 score >= 80을 먼저 검사하면 95점도 이미 True라서 B로 끝나 버립니다.","조건을 적은 뒤에는 대표값 하나씩 넣어 위에서부터 실제로 따라가 보세요. ‘95는 어디로 가나, 85는 어디로 가나, 79는 어디로 가나’를 확인하면 순서 실수를 빨리 잡을 수 있습니다.","조건 자체가 복잡하다면 중간 boolean 변수에 의미 있는 이름을 붙여 읽기 쉬운 문장처럼 만드는 것도 좋은 방법입니다."]},{"id":"t3-c4-example1","kind":"example","eyebrow":"예제로 연결하기","title":"조기 차단을 쓰면 정상 흐름이 덜 깊어집니다","paragraphs":["조기 차단은 ‘잘못된 경우를 먼저 내보내고, 정상적인 경우만 아래로 내려보내는 방식’입니다. 놀이공원 입구에서 티켓이 없는 사람을 먼저 돌려보낸 뒤, 들어온 사람만 놀이기구 안내를 받는 것과 비슷합니다.","금액이 -1000원이라면 배송비를 계산할 이유가 없습니다. 처음에 잘못된 금액이라고 처리하고 함수를 끝내면 뒤쪽 코드는 정상 금액만 생각하면 됩니다.","이렇게 하면 if 안에 if 안에 또 if가 들어가는 깊은 구조를 줄일 수 있고, 사람이 읽을 때도 정상 흐름이 한눈에 보입니다.","아래 함수는 주문 금액이 음수인 잘못된 입력을 먼저 막습니다. 그 뒤에는 ‘금액이 정상이다’라는 전제로 배송비 계산을 읽을 수 있습니다.","잘못된 입력을 if 안에서 계속 중첩해 처리하면 정상 계산이 점점 오른쪽으로 밀려 읽기 어려워집니다. 초반에 걸러 내면 중심 로직이 단순해집니다.","여기서 return은 함수를 즉시 끝내고 값을 돌려주는 역할을 합니다. 함수 자체는 다음 챕터에서 더 자세히 다룹니다."],"code":"def shipping_fee(total):\n    if total \u003c 0:\n        return \"잘못된 금액\"\n\n    if total >= 50000:\n        return 0\n\n    return 3000","codeNote":"음수는 첫 조건에서 끝납니다. 정상 금액은 아래 배송비 규칙만 확인하면 됩니다.","codeExplain":["1단계: 2행: 처리하면 안 되는 음수 입력을 가장 먼저 검사합니다.","2단계: 3행: 잘못된 입력이면 그 자리에서 함수를 끝냅니다.","3단계: 5행: 정상 금액만 무료배송 기준을 검사합니다.","4단계: 6행: 50000 이상이면 0을 반환합니다.","5단계: 8행: 앞 조건에 걸리지 않은 나머지 정상 금액은 3000입니다."]},{"id":"t3-c4-p3","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"for는 ‘모든 항목’, while은 ‘조건이 바뀔 때까지’라고 생각하세요","paragraphs":["for와 while을 고르는 가장 쉬운 기준은 ‘무엇을 반복하는지 이미 목록으로 알고 있는가’입니다.","상품 목록에 10개가 있고 그 10개를 하나씩 본다면 for가 자연스럽습니다. 반면 비밀번호를 맞힐 때까지 계속 입력을 받되 최대 3번까지만 허용한다면 ‘몇 번째에서 성공할지 모르는’ 상황이라 while이 잘 맞습니다.","for는 ‘하나씩 꺼내기’, while은 ‘조건이 맞는 동안 계속하기’로 먼저 기억하세요. 문법 모양보다 이 차이를 이해하는 것이 더 중요합니다.","리스트에 있는 주문 10개를 하나씩 검사한다면 처리할 대상이 이미 정해져 있으므로 for가 자연스럽습니다. 로그인 시도를 최대 3회까지 허용하면서 성공하면 일찍 끝낸다면 while이 더 자연스러울 수 있습니다.","for는 ‘무엇을 하나씩 꺼낼까?’를 먼저 묻습니다. while은 ‘무슨 조건이 True인 동안 계속할까?’와 ‘그 조건을 언젠가 False로 만드는 변화가 무엇일까?’를 함께 묻습니다.","while에서 마지막 질문을 빼먹으면 무한 반복이 생기기 쉽습니다. 그래서 while을 작성할 때 조건에 등장하는 변수 중 무엇이 반복 안에서 바뀌는지 표시하세요.","반복을 선택하는 기준은 취향이 아니라 문제의 종료 방식입니다."]},{"id":"t3-c4-example2","kind":"example","eyebrow":"예제로 연결하기","title":"while은 종료 조건과 상태 변화가 한 쌍입니다","paragraphs":["while에서 가장 중요한 것은 반복 조건 자체보다 ‘그 조건이 언젠가 거짓이 될 수 있느냐’입니다.","tries가 0이고 조건이 tries \u003c 3이면 처음에는 True입니다. 한 번 실행한 뒤 tries를 1로, 다시 2로, 다시 3으로 바꾸기 때문에 결국 3 \u003c 3이 False가 되어 멈춥니다.","tries += 1을 빼면 tries는 계속 0입니다. 그러면 0 \u003c 3은 영원히 True이고 프로그램도 영원히 반복합니다. 그래서 while을 볼 때는 조건과 그 조건에 사용된 값의 변화가 항상 한 쌍입니다.","아래 코드는 시도 횟수가 3보다 작은 동안 반복합니다. 반복 한 번이 끝날 때 tries가 1씩 증가하므로 언젠가 조건이 False가 됩니다.","tries += 1을 지우면 tries는 계속 0이고 tries \u003c 3은 영원히 True입니다. 문법 오류는 없지만 프로그램이 끝나지 않습니다.","while을 볼 때는 조건식만 보지 말고 그 조건에 사용된 값이 어디서 바뀌는지 함께 찾으세요."],"code":"tries = 0\n\nwhile tries \u003c 3:\n    print(\"시도\", tries + 1)\n    tries += 1\n\nprint(\"종료\")","codeNote":"시도 1, 시도 2, 시도 3이 출력된 뒤 종료가 출력됩니다.","codeExplain":["1단계: 1행: tries를 0으로 시작합니다.","2단계: 3행: tries가 3보다 작은 동안 반복합니다.","3단계: 4행: 사람이 보기 쉬운 번호로 표시하려고 tries + 1을 출력합니다.","4단계: 5행: tries를 증가시켜 종료 조건에 가까워지게 합니다.","5단계: 7행: tries가 3이 되면 while을 빠져나와 종료를 출력합니다."]},{"id":"t3-c4-p4","kind":"concept","eyebrow":"CHAPTER 04 · 핵심 이해","title":"off-by-one은 경계값 세 개로 잡습니다","paragraphs":["한 칸 차이 오류는 코딩에서 아주 흔합니다. 특히 ‘이상’, ‘초과’, ‘미만’, ‘이하’처럼 경계를 포함하는지 빼는지가 중요할 때 잘 생깁니다.","무료배송이 50000원 이상이라면 50000원이 포함되어야 합니다. 그런데 >를 쓰면 50000은 빠지고 50001부터 무료가 됩니다. 80000 같은 값만 테스트하면 이 실수를 발견하지 못합니다.","그래서 기준 숫자 바로 아래, 기준 숫자 자체, 바로 위 세 개를 넣어 보는 습관이 좋습니다. 49999, 50000, 50001처럼 말입니다.","횟수나 범위를 다루는 코드에서는 ‘딱 시작점’, ‘딱 끝점’, ‘끝 바로 다음’ 값을 넣어 보는 것이 좋습니다. 한 칸 차이 오류는 평범한 중간값으로는 잘 드러나지 않습니다.","예를 들어 최대 3회 시도라면 2회, 3회, 4회 상황을 생각해 봅니다. 무료배송 기준이 50000원이라면 49999, 50000, 50001을 봅니다.","range의 끝 값이 포함되지 않는다는 규칙도 자주 한 칸 차이 오류를 만듭니다. range(1, 4)는 1, 2, 3을 만들고 4는 포함하지 않습니다.","경계값을 테스트로 남겨 두면 나중에 조건을 수정했을 때 같은 실수를 다시 만들 가능성이 줄어듭니다."]},{"id":"t3-c4-example3","kind":"example","eyebrow":"예제로 연결하기","title":"반복 안의 continue는 ‘이번 항목만 건너뛰기’입니다","paragraphs":["continue는 반복을 끝내는 명령이 아닙니다. 지금 보고 있는 항목 하나만 건너뛰고 다음 항목으로 넘어가는 명령입니다.","가격 목록 [3000, -1, 5000]에서 -1이 잘못된 값이라면, -1을 만났을 때 합계 계산만 건너뛰고 5000은 계속 처리해야 합니다. 이때 continue가 잘 맞습니다.","반대로 break를 쓰면 -1을 만난 순간 반복 전체가 끝나므로 뒤의 5000까지 보지 않게 됩니다. 두 문법의 차이는 ‘이번 한 번만 건너뛰기’와 ‘반복 자체 끝내기’입니다.","아래 코드는 음수 가격을 잘못된 데이터로 보고 합계에서 제외합니다. continue를 만나면 현재 iteration의 남은 줄을 건너뛰고 다음 price로 넘어갑니다.","break와 헷갈리지 마세요. break는 전체 반복을 끝냅니다. continue는 반복 자체는 계속하지만 이번 항목만 건너뜁니다.","처음에는 두 문법을 남용하지 않는 것이 좋습니다. 흐름이 더 명확해지는 경우에만 사용하세요."],"code":"prices = [3000, -1, 5000]\ntotal = 0\n\nfor price in prices:\n    if price \u003c 0:\n        continue\n    total += price\n\nprint(total)","codeNote":"예상 출력은 8000입니다. -1이 있는 iteration만 합계 계산을 건너뜁니다.","codeExplain":["1단계: 4행: 가격을 하나씩 꺼냅니다.","2단계: 5행: 음수인지 확인합니다.","3단계: 6행: 음수면 이번 반복의 남은 코드를 건너뜁니다.","4단계: 7행: 정상 가격만 total에 더합니다.","5단계: 9행: 3000 + 5000 결과인 8000을 출력합니다."]},{"id":"t3-c4-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"요구사항을 제어 흐름으로 바꾸세요","paragraphs":["이 실습의 핵심은 Python 문법을 기억하는 것이 아니라 한국어 규칙을 코드의 갈림길로 옮기는 것입니다. 먼저 각 입력이 어디로 가야 하는지 문장으로 정리하세요.","잘못된 입력을 먼저 막고, 정상 범위 안에서는 높은 점수 구간부터 차례대로 내려오면 조건이 겹치는 문제를 줄일 수 있습니다.","요구사항은 ‘점수가 0보다 작거나 100보다 크면 잘못된 점수, 90 이상이면 A, 80 이상이면 B, 그 외에는 C를 출력한다’입니다.","먼저 잘못된 입력을 조기 차단하고, 정상 점수는 높은 기준부터 낮은 기준 순으로 검사해 보세요.","코드를 쓰기 전에 105, 95, 85, 70 네 입력이 각각 어느 경로로 가야 하는지 적습니다."],"practicePrompt":"빈칸을 채워 네 입력이 모두 올바른 결과를 내도록 만드세요.","code":"score = 85\n\nif __________________:\n    print(\"잘못된 점수\")\nelif __________________:\n    print(\"A\")\nelif __________________:\n    print(\"B\")\nelse:\n    print(\"C\")","answerOnNext":true},{"id":"t3-c4-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"요구사항을 제어 흐름으로 바꾸세요 · 풀이","paragraphs":["풀이의 순서는 ‘잘못된 범위 확인 → 90점 이상 확인 → 80점 이상 확인 → 나머지’입니다. 위 조건에서 걸린 값은 아래 조건까지 내려오지 않습니다.","잘못된 범위는 score \u003c 0 or score > 100으로 먼저 잡습니다. 정상 범위만 아래 등급 조건으로 내려갑니다.","등급은 90 이상을 먼저 두고 80 이상을 다음에 둡니다. 순서를 바꾸면 95도 80 이상 조건에서 먼저 True가 되어 B로 잘못 분류될 수 있습니다.","예시 입력 85는 잘못된 범위가 아니고 90 이상도 아니지만 80 이상이므로 B가 출력됩니다."],"code":"score = 85\n\nif score \u003c 0 or score > 100:\n    print(\"잘못된 점수\")\nelif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelse:\n    print(\"C\")","codeNote":"105→잘못된 점수, 95→A, 85→B, 70→C입니다."},{"id":"t3-c4-check","kind":"check","eyebrow":"확인 문제","title":"반복이 끝나는 이유를 설명할 수 있는지 확인합니다","paragraphs":["이 확인 문제는 while이 왜 멈추는지 흐름으로 이해했는지 확인합니다. 조건식만 보지 말고 조건에 쓰인 값이 어떻게 바뀌는지 함께 보세요.","while 코드를 보면 ‘현재 조건’과 ‘조건을 바꾸는 줄’을 한 쌍으로 찾는 습관이 중요합니다.","다음 질문에 조건식과 상태 변화라는 두 단어를 사용해 답해 보세요."],"question":"while count \u003c 3: 안에서 count 값이 한 번도 바뀌지 않으면 왜 무한 반복이 생길 수 있을까요?","answerOnNext":true},{"id":"t3-c4-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복이 끝나는 이유를 설명할 수 있는지 확인합니다 · 풀이","paragraphs":["풀이의 순서는 ‘잘못된 범위 확인 → 90점 이상 확인 → 80점 이상 확인 → 나머지’입니다. 위 조건에서 걸린 값은 아래 조건까지 내려오지 않습니다.","종료 조건은 count \u003c 3입니다. count가 0에서 시작한 뒤 반복 안에서 바뀌지 않으면 이 조건은 계속 True입니다.","따라서 while은 같은 블록을 계속 실행합니다. count += 1처럼 조건 결과가 언젠가 False가 되도록 상태를 변화시키는 단계가 필요합니다."]},{"id":"t3-c4-summary","kind":"summary","eyebrow":"Chapter 4 정리","title":"흐름을 먼저 설계하면 문법 선택이 쉬워집니다","paragraphs":["이 챕터에서 배운 if, for, while의 핵심은 문법 모양이 아니라 길을 만드는 방식입니다. 한 번 하는 일, 조건에 따라 갈리는 일, 여러 번 반복하는 일을 구분하면 필요한 문법을 고르기 쉬워집니다.","문제 문장을 순차 실행·분기·반복으로 분류하면 어떤 제어문이 필요한지 보이기 시작합니다. if는 갈림길, for와 while은 되풀이되는 길입니다.","분기에서는 조건 순서를, while에서는 종료 조건과 상태 변화를, 모든 경계에서는 한 칸 차이 오류를 확인하세요.","다음 챕터에서는 이렇게 설계한 큰 흐름을 함수 단위로 나눕니다. 한 덩어리 코드를 역할별 작은 도구로 바꾸면 읽기와 수정이 쉬워집니다."],"bullets":["요구사항 문장에 ‘한 번·조건에 따라·여러 번’을 표시한다.","조건은 대표값과 경계값을 넣어 위에서부터 실제로 따라간다.","while은 종료 조건에 등장하는 값이 반복 안에서 어떻게 바뀌는지 확인한다.","잘못된 입력을 초반에 차단하면 정상 흐름이 단순해진다."]}]},{"id":"t3-c5","track":3,"chapter":5,"title":"함수로 역할을 나누고 연결하기","remember":"함수는 이름 붙인 작은 작업 단위이며, 입력과 반환값의 계약을 명확히 하고 한 가지 책임에 집중시킨다","practiceGoal":"긴 코드를 역할별 함수로 나누고 parameter·argument·return·scope를 읽어 데이터 흐름을 설명한다","pages":[{"id":"t3-c5-g1","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 1/4","title":"함수를 읽기 위한 기본 단어","paragraphs":["함수는 코드를 멋있게 정리하는 장식이 아닙니다. 큰 문제를 작은 작업 단위로 나누고 각 단위에 이름을 붙이는 방법입니다.","먼저 함수 정의와 호출, 입력을 받는 자리와 실제로 넣는 값을 구분하면 긴 코드도 작은 조각으로 읽을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"function 함수","description":"함수는 여러 줄의 코드를 하나의 이름으로 묶은 작은 도구입니다. 계산기에서 ‘더하기’ 버튼 하나가 내부적으로 여러 동작을 처리하듯, 함수 이름 하나로 필요한 작업을 실행할 수 있습니다.","usage":"같은 일을 재사용하거나 큰 문제를 역할별로 나눌 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: calculate_total()은 합계를 계산하는 함수 이름이 될 수 있습니다."},{"term":"call 호출","description":"호출은 만들어 둔 함수를 실제로 사용하는 것입니다. 함수가 레시피라면 호출은 그 레시피대로 지금 요리를 시작해 달라고 시키는 것과 비슷합니다.","usage":"함수가 언제 동작하는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: calculate_total(prices)는 함수를 호출합니다."},{"term":"parameter 매개변수","description":"매개변수는 함수가 값을 받을 자리의 이름입니다. 택배 상자에 ‘받는 사람’ 칸이 미리 있는 것처럼, 함수 정의에 입력 자리를 만들어 둔 것입니다.","usage":"함수가 어떤 정보를 필요로 하는지 표현할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: def greet(name):에서 name이 parameter입니다."},{"term":"argument 인자","description":"인자는 함수를 실제로 사용할 때 그 자리에 넣어 주는 실제 값입니다. parameter가 ‘받는 사람’이라는 빈 칸이라면 argument는 그 칸에 적는 ‘김민수’ 같은 실제 내용입니다.","usage":"parameter 자리에 어떤 값이 들어가는지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: greet(\"민수\")에서 \"민수\"가 argument입니다."}]},{"id":"t3-c5-g2","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 2/4","title":"함수가 결과를 돌려줄 때 쓰는 단어","paragraphs":["함수 안에서 계산한 결과를 다른 코드가 사용하려면 밖으로 돌려줘야 합니다. 화면에 보여 주는 것과 값을 돌려주는 것은 서로 다른 일입니다.","return과 print를 구분하면 함수가 왜 연결 가능한 작은 부품이 되는지 이해하기 쉬워집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"return 반환","description":"return은 함수 안에서 만든 결과를 함수 밖으로 돌려주는 문법입니다. 계산기가 내부에서 계산한 뒤 화면에 결과 숫자를 내놓는 것처럼, 함수도 다음 코드가 사용할 값을 돌려줄 수 있습니다.","usage":"함수의 계산 결과를 다음 코드에서 다시 사용해야 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: return total은 total 값을 호출한 곳으로 돌려줍니다."},{"term":"return value 반환값","description":"반환값은 함수가 return으로 실제로 돌려준 결과입니다. add(2, 3)이 5를 돌려준다면 5가 반환값입니다.","usage":"함수의 출력이 무엇인지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: add(2, 3)의 반환값이 5일 수 있습니다."},{"term":"print 출력","description":"print는 값을 화면에 보여 주는 도구입니다. 보여 주는 것과 다른 코드에 값을 돌려주는 것은 다릅니다. 그래서 print와 return을 같은 것으로 생각하면 안 됩니다.","usage":"중간값을 확인하거나 사용자에게 결과를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(total)은 total을 화면에 보여 줍니다."},{"term":"contract 계약","description":"함수의 계약은 ‘무엇을 넣으면 무엇이 나온다’라는 약속입니다. 예를 들어 ‘가격 숫자를 넣으면 배송비 숫자를 돌려준다’처럼 함수 사용자가 알아야 할 규칙을 뜻합니다.","usage":"함수 사용자가 내부 코드를 몰라도 안전하게 사용할 기준을 정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘가격 리스트를 받아 0 이상의 정수 합계를 반환한다’가 계약입니다."}]},{"id":"t3-c5-g3","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 3/4","title":"함수 안과 밖의 범위를 이해하는 단어","paragraphs":["함수 안의 변수는 밖의 변수와 같은 이름처럼 보여도 범위가 다를 수 있습니다. 이 차이를 모르면 값이 왜 안 바뀌었는지 혼란스럽습니다.","초보 단계에서는 ‘함수 안에서 만든 변수는 우선 그 함수 안에서 쓰인다’는 감각부터 잡으면 충분합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"scope 범위","description":"scope는 변수 이름을 사용할 수 있는 구역입니다. 교실 A에서 정한 ‘반장’과 교실 B의 ‘반장’이 서로 다른 사람일 수 있듯, 함수 안의 변수와 바깥 변수도 같은 이름이어도 다른 범위일 수 있습니다.","usage":"같은 변수 이름이 어디에서 유효한지 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 함수 안에서 만든 변수는 보통 그 함수의 local scope에 있습니다."},{"term":"local variable 지역 변수","description":"지역 변수는 함수 안에서 잠깐 쓰는 내부용 변수입니다. 함수가 끝나면 바깥 코드가 그 이름을 그대로 사용할 수 없는 경우가 많습니다.","usage":"함수의 중간 계산을 다른 코드와 분리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: fee = 3000을 함수 안에서만 사용할 수 있습니다."},{"term":"responsibility 책임","description":"책임은 그 함수가 맡은 중심 역할입니다. 배송비 함수라면 배송비 계산에 집중하고, 로그인 처리나 화면 색 변경까지 같이 맡기지 않는 식입니다.","usage":"함수에 너무 많은 일을 넣었는지 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: validate_price는 가격 검증만 맡도록 할 수 있습니다."},{"term":"interface 인터페이스","description":"인터페이스는 함수 바깥에서 보이는 사용법입니다. 내부 코드가 복잡해도 사용자는 함수 이름, 넣을 값, 나오는 결과만 알면 사용할 수 있습니다.","usage":"내부 구현을 몰라도 함수를 어떻게 호출할지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: shipping_fee(total) → 숫자 반환이 인터페이스입니다."}]},{"id":"t3-c5-g4","kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 4/4","title":"함수를 더 읽기 좋게 다듬을 때 쓰는 단어","paragraphs":["처음부터 완벽하게 함수를 나눌 필요는 없습니다. 동작하는 큰 코드를 만든 뒤 의미 있는 경계를 찾아 작은 함수로 옮기는 작업도 흔합니다.","다만 함수를 많이 만드는 것 자체가 목표는 아닙니다. 이름만 봐도 역할이 보이고 입력과 결과가 분명해야 합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"refactoring 리팩터링","description":"리팩터링은 결과는 그대로 두고 코드의 정리 방식만 더 좋게 바꾸는 작업입니다. 방 안의 가구를 정리해도 집 주소가 바뀌지 않는 것과 비슷합니다.","usage":"긴 함수나 중복 코드를 역할별로 정리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 계산 부분을 shipping_fee()로 분리합니다."},{"term":"helper function 보조 함수","description":"보조 함수는 큰 함수가 일을 쉽게 하도록 작은 부분을 맡아 주는 함수입니다. 큰 요리에서 ‘양파 썰기’만 따로 맡는 작은 단계처럼 생각하면 됩니다.","usage":"검증·변환·계산 같은 반복되는 세부 작업을 분리할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: is_valid_price()가 입력 검증을 도울 수 있습니다."},{"term":"pure function 순수 함수","description":"순수 함수는 같은 입력을 주면 항상 같은 결과를 주고, 함수 밖의 상태를 몰래 바꾸지 않는 함수입니다. 계산기처럼 2와 3을 넣으면 언제나 5가 나오는 형태입니다.","usage":"계산 로직을 예측 가능하고 테스트하기 쉽게 만들 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: add_tax(price)처럼 입력을 받아 새 값을 계산해 반환합니다."},{"term":"side effect 부수효과","description":"부수효과는 반환값 말고 바깥 세상에 생기는 변화입니다. 화면 출력, 파일 저장, 전역 변수 변경처럼 함수 밖의 상태가 달라지는 일을 뜻합니다.","usage":"함수의 영향 범위를 파악할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(), 파일 쓰기, 전역 리스트 수정은 side effect가 될 수 있습니다."}]},{"id":"t3-c5-slow-start","kind":"concept","eyebrow":"CHAPTER 05 · 아주 천천히 시작하기","title":"함수는 자주 쓰는 일을 이름 하나로 묶은 작은 도구입니다","paragraphs":["함수를 처음 배우면 def, return, parameter 같은 새 단어가 한꺼번에 나와 어렵게 느껴집니다. 먼저 함수 자체의 목적부터 아주 단순하게 잡겠습니다.","매번 ‘가격에 10%를 곱해서 할인액을 계산한다’는 코드를 반복해서 쓴다고 생각해 보세요. 이 일을 discount라는 이름의 작은 도구로 만들어 두면 다음부터 discount(가격)처럼 이름만 불러 사용할 수 있습니다.","함수는 크게 세 부분만 보면 됩니다. 첫째, 함수 이름은 이 도구가 무슨 일을 하는지 알려 줍니다. 둘째, 괄호 안의 입력 자리는 일을 하려면 어떤 값이 필요한지 알려 줍니다. 셋째, return은 일이 끝난 뒤 어떤 결과를 돌려줄지 알려 줍니다.","즉 함수 내부의 모든 줄을 처음부터 이해하지 못해도 이름·입력·결과 세 가지를 보면 큰 흐름을 먼저 이해할 수 있습니다."]},{"id":"t3-c5-p1","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"함수는 ‘코드를 줄이는 기술’보다 ‘생각을 나누는 기술’입니다","paragraphs":["함수는 처음 보면 새로운 문법 덩어리처럼 느껴지지만, 사실은 ‘길어진 일을 작은 일로 나누고 이름을 붙이는 방법’입니다.","집안일을 ‘집 정리하기’ 한 덩어리로 생각하면 막막하지만 ‘빨래하기, 설거지하기, 쓰레기 버리기’로 나누면 각각 무엇을 해야 하는지 분명해집니다. 함수도 같은 역할을 합니다.","주문 계산 코드가 길다면 검증하기, 할인 계산하기, 배송비 계산하기처럼 나눌 수 있습니다. 그러면 전체 코드를 다 읽기 전에 함수 이름만 보고도 큰 흐름을 이해할 수 있습니다.","긴 코드를 함수로 나누는 가장 큰 이유는 줄 수를 줄이기 위해서가 아닙니다. 사람의 머리가 한 번에 이해해야 하는 범위를 작게 만들기 위해서입니다.","주문 프로그램 전체를 한 번에 읽는 대신 validate_order, calculate_discount, shipping_fee처럼 역할 이름을 먼저 보면 큰 흐름을 빠르게 파악할 수 있습니다.","좋은 함수 이름은 주석 없이도 ‘무엇을 하는가’를 어느 정도 말해 줍니다. 반대로 do_work, process_data처럼 너무 넓은 이름은 함수 안에 여러 책임이 섞였다는 신호일 수 있습니다.","함수를 읽을 때는 내부 코드로 바로 들어가지 말고 먼저 이름·parameter·return value 세 가지를 확인하세요. 이것이 함수의 겉모습인 interface입니다."]},{"id":"t3-c5-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"함수는 작은 입력→처리→출력 상자처럼 연결됩니다","paragraphs":["함수 하나를 작은 기계라고 생각해 보세요. 왼쪽 구멍으로 필요한 값을 넣으면 내부에서 일을 하고 오른쪽 구멍으로 결과를 내보냅니다.","예를 들어 shipping_fee라는 기계에 total=40000을 넣으면 3000을 내놓고, total=60000을 넣으면 0을 내놓는 식입니다.","여러 함수는 이런 작은 기계들을 줄줄이 연결한 것처럼 사용할 수 있습니다. 앞 함수가 만든 결과를 다음 함수에 넣으면 큰 프로그램을 작은 단계들로 조립할 수 있습니다.","함수 하나를 상자라고 생각하면 왼쪽에는 입력이 들어오고 안에서 한 가지 역할을 수행한 뒤 오른쪽으로 반환값이 나옵니다.","여러 함수는 반환값을 다음 함수의 argument로 전달하면서 연결될 수 있습니다. 이때 각 함수의 contract가 맞아야 데이터 흐름이 끊기지 않습니다.","상자 내부를 아직 몰라도 입력과 출력만 알면 큰 프로그램의 흐름을 먼저 읽을 수 있습니다."],"visual":"FUNCTION_PIPELINE","bullets":["입력 total → validate_total(total)","정상 total → discount(total)","할인된 금액 → shipping_fee(total)","각 반환값을 모아 최종 결과 구성"]},{"id":"t3-c5-example1","kind":"example","eyebrow":"예제로 연결하기","title":"parameter는 자리 이름, argument는 실제 값입니다","paragraphs":["parameter와 argument는 이름이 비슷해서 처음에 가장 헷갈리는 용어 중 하나입니다. 빈칸과 실제 값을 구분하면 쉽습니다.","함수를 만들 때 def discount(price, rate):라고 쓰면 price와 rate는 아직 실제 숫자가 아닙니다. ‘여기에 가격과 할인율이 들어올 거야’라고 자리를 만들어 둔 것입니다. 이 자리가 parameter입니다.","discount(10000, 0.1)처럼 실제로 부를 때는 10000과 0.1이 그 빈자리에 들어갑니다. 이 실제 값들이 argument입니다.","아래 함수 정의에서 price와 rate는 입력 자리에 붙인 parameter입니다. 함수가 정의될 때는 아직 실제 숫자가 정해지지 않았습니다.","discount(10000, 0.1)을 호출하는 순간 10000과 0.1이라는 argument가 각각 price와 rate 자리에 들어갑니다.","이 구분을 알면 AI가 함수 호출을 잘못 만들었을 때 ‘parameter 개수와 argument 개수가 맞는가’를 확인할 수 있습니다."],"code":"def discount(price, rate):\n    return price * rate\n\namount = discount(10000, 0.1)\nprint(amount)","codeNote":"반환값은 1000.0이고 amount에 저장됩니다.","codeExplain":["1단계: 1행: discount 함수가 price와 rate 두 parameter를 받도록 정의합니다.","2단계: 2행: 두 입력을 곱한 값을 호출한 곳으로 반환합니다.","3단계: 4행: 10000과 0.1을 argument로 전달해 함수를 호출합니다.","4단계: 4행: 반환된 1000.0을 amount에 저장합니다.","5단계: 5행: 저장된 결과를 화면에서 확인합니다."]},{"id":"t3-c5-p2","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"return과 print를 섞으면 함수 연결이 어려워질 수 있습니다","paragraphs":["print와 return은 둘 다 결과와 관련돼 보여서 초보자가 자주 같은 것으로 생각합니다. 하지만 역할은 완전히 다릅니다.","print는 사람 눈에 보여 주는 기능입니다. return은 다른 코드가 이어서 사용할 수 있도록 값을 돌려주는 기능입니다.","계산기로 비유하면 print는 화면에 숫자를 보여 주는 것이고, return은 그 숫자를 다음 계산에 넘겨주는 것에 가깝습니다. 함수 결과를 다른 계산에 쓰려면 보통 return이 필요합니다.","print는 사람에게 보여 주는 동작이고 return은 다른 코드에게 값을 건네는 동작입니다. 둘은 목적이 다릅니다.","함수 안에서 계산 결과를 print만 하고 return하지 않으면 화면에는 숫자가 보일 수 있지만 다른 코드가 그 값을 받아 추가 계산하기 어렵습니다.","초보자는 화면에 결과가 보이면 함수가 값을 돌려줬다고 생각하기 쉽습니다. 그래서 함수 호출 뒤 변수에 무엇이 저장됐는지 확인하는 습관이 중요합니다.","계산 함수는 가능한 한 결과를 return하고, 최종 사용자 출력은 바깥에서 담당하게 하면 역할이 분명해지는 경우가 많습니다."]},{"id":"t3-c5-example2","kind":"example","eyebrow":"예제로 연결하기","title":"return이 없으면 호출 결과는 None이 될 수 있습니다","paragraphs":["함수 안에서 5를 print했다고 해서 그 함수가 5를 돌려준 것은 아닙니다. 화면에는 5가 보이지만 호출 결과로는 아무 값도 주지 않았을 수 있습니다.","Python 함수가 명시적으로 return하지 않으면 호출 결과는 기본적으로 None입니다. None은 숫자 0이 아니라 ‘돌려받은 값이 없음’에 가까운 특별한 값입니다.","그래서 result = show_sum(2, 3)처럼 저장했는데 result가 None이라면 함수 안에 print만 있고 return이 없는지 확인해야 합니다.","첫 함수는 print만 하므로 화면에는 5가 보이지만 호출한 곳에 계산값을 반환하지 않습니다. 두 번째 함수는 5를 return하므로 result 변수에 저장할 수 있습니다.","None은 ‘값이 없다’는 뜻으로 쓰이는 Python의 특별한 값입니다. 이 예제에서는 함수가 명시적으로 반환한 값이 없어서 result1이 None이 됩니다.","화면 출력과 반환값을 구분하면 ‘왜 다음 계산에서 None이 나왔지?’ 같은 오류를 이해하기 쉬워집니다."],"code":"def show_sum(a, b):\n    print(a + b)\n\ndef get_sum(a, b):\n    return a + b\n\nresult1 = show_sum(2, 3)\nresult2 = get_sum(2, 3)\n\nprint(result1)\nprint(result2)","codeNote":"먼저 5가 한 번 출력되고, 마지막 두 줄에서 None과 5가 출력됩니다.","codeExplain":["1단계: 1~2행: show_sum은 계산 결과를 화면에만 출력합니다.","2단계: 4~5행: get_sum은 계산 결과를 return합니다.","3단계: 7행: show_sum은 반환값이 없으므로 result1에는 None이 들어갑니다.","4단계: 8행: get_sum의 반환값 5가 result2에 들어갑니다.","5단계: 10~11행: 두 변수의 차이를 직접 확인합니다."]},{"id":"t3-c5-p3","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"한 함수에는 한 문장으로 설명 가능한 중심 책임을 줍니다","paragraphs":["함수를 나눌 때 가장 쉬운 기준은 ‘이 함수가 하는 일을 한 문장으로 말할 수 있는가’입니다.","‘배송비를 계산한다’는 한 가지 일입니다. 하지만 ‘주문을 검사하고 할인하고 배송비를 계산하고 화면에도 출력한다’는 여러 가지 일이 한 함수에 섞여 있습니다.","여러 일이 섞이면 하나를 수정할 때 다른 부분까지 영향을 받을 가능성이 커집니다. 그래서 서로 독립적으로 설명할 수 있는 큰 역할은 함수로 나누는 편이 읽고 고치기 쉽습니다.","함수를 나눌 때 가장 실용적인 기준은 ‘이 함수가 하는 일을 한 문장으로 말할 수 있는가?’입니다. 문장에 ‘그리고’가 계속 붙으면 책임이 너무 많을 수 있습니다.","예를 들어 ‘주문을 검증하고 할인하고 배송비를 계산하고 출력한다’는 함수는 여러 이유로 변경될 수 있습니다. 할인 정책만 바뀌어도, 출력 형식만 바뀌어도 같은 함수가 수정됩니다.","반면 validate_order, calculate_discount, calculate_shipping처럼 나누면 각각의 변경 이유가 분리됩니다. 테스트도 작은 단위로 할 수 있습니다.","하지만 두 줄짜리 코드마다 함수를 만드는 것도 읽기 어렵습니다. 반복되거나 의미 있는 독립 역할이 있을 때 경계를 만드는 것이 좋습니다."]},{"id":"t3-c5-p4","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"scope는 함수가 자기 중간값을 안전하게 가두는 경계입니다","paragraphs":["scope는 ‘이 변수 이름이 통하는 구역’이라고 생각하면 됩니다. 같은 이름이라도 구역이 다르면 서로 다른 변수일 수 있습니다.","아파트 101동과 102동에 둘 다 301호가 있어도 서로 다른 집인 것과 비슷합니다. 함수 A 안의 total과 함수 B 안의 total은 이름이 같아도 각각 자기 함수 안에서 따로 존재할 수 있습니다.","이렇게 범위가 나뉘면 한 함수의 중간 계산이 다른 함수의 변수와 마구 섞이는 일을 줄일 수 있습니다.","함수 안에서 만드는 지역 변수는 기본적으로 그 함수의 내부 계산을 위한 것입니다. 바깥 코드가 같은 이름을 써도 서로 다른 범위에 있을 수 있습니다.","이 성질 덕분에 함수마다 total, result 같은 평범한 이름을 사용해도 충돌을 줄일 수 있습니다.","반대로 함수가 바깥의 변수를 직접 바꾸는 side effect가 많으면 어떤 호출이 상태를 바꿨는지 추적하기 어려워집니다. 초보 단계에서는 필요한 값을 parameter로 받고 결과를 return하는 형태를 우선하면 흐름이 분명합니다.","외부 상태를 바꿔야 하는 경우도 있지만, 그때는 함수 이름과 설명에서 영향 범위를 분명하게 표시하는 편이 좋습니다."]},{"id":"t3-c5-example3","kind":"example","eyebrow":"예제로 연결하기","title":"큰 주문 계산을 세 함수로 나누면 흐름이 보입니다","paragraphs":["큰 주문 계산을 한 덩어리로 읽으면 ‘어디서 검증하고 어디서 할인하고 어디서 배송비를 정하는지’를 계속 머릿속에 기억해야 합니다.","함수를 세 개로 나누면 각 함수 이름이 작은 설명서가 됩니다. valid_total은 금액이 정상인지, discount는 할인액이 얼마인지, shipping_fee는 배송비가 얼마인지 담당합니다.","마지막 부분은 이 작은 결과들을 조합하기만 하면 됩니다. AI에게 수정 요청을 할 때도 ‘shipping_fee만 바꿔’라고 범위를 분명하게 말할 수 있습니다.","아래 예제는 검증, 할인, 배송비를 서로 다른 함수로 나눕니다. 각 함수는 입력과 결과가 분명합니다.","최종 코드는 함수 내부 세부사항보다 ‘어떤 순서로 호출되는가’를 먼저 읽을 수 있습니다. total이 검증을 통과하고, 할인액과 배송비를 구해 final 값을 만드는 구조입니다.","이런 분리는 AI에게 수정 범위를 지정할 때도 유리합니다. ‘shipping_fee 함수만 바꿔라’처럼 범위를 좁힐 수 있습니다."],"code":"def valid_total(total):\n    return total >= 0\n\ndef discount(total):\n    if total >= 100000:\n        return total * 0.1\n    return 0\n\ndef shipping_fee(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\ntotal = 80000\n\nif valid_total(total):\n    final = total - discount(total) + shipping_fee(total)\n    print(final)","codeNote":"80000원은 할인 기준 100000원에 못 미쳐 할인 0원, 배송비는 무료이므로 80000이 출력됩니다.","codeExplain":["1단계: valid_total은 입력 검증만 담당합니다.","2단계: discount는 할인액 계산만 담당합니다.","3단계: shipping_fee는 배송비 계산만 담당합니다.","4단계: 마지막 if에서는 세 함수의 contract를 믿고 결과를 조합합니다."]},{"id":"t3-c5-p5","kind":"concept","eyebrow":"CHAPTER 05 · 핵심 이해","title":"리팩터링은 동작을 바꾸지 않고 구조를 바꾸는 작업입니다","paragraphs":["리팩터링은 기능을 새로 만드는 작업이 아닙니다. 사용자 입장에서는 결과가 똑같아야 하고, 내부 코드만 더 읽고 고치기 좋은 구조로 바꾸는 작업입니다.","예를 들어 30줄짜리 배송비 계산을 shipping_fee 함수로 옮겨도 49999원, 50000원, 50001원을 넣었을 때 결과는 이전과 같아야 합니다.","그래서 리팩터링 전후에는 같은 테스트를 돌려 결과가 그대로인지 확인합니다. 구조를 바꾸는 중에 실수로 기능까지 바뀌지 않았는지 보는 것입니다.","긴 코드가 이미 맞게 동작하고 있다면 한 번에 기능과 구조를 동시에 바꾸지 않는 것이 안전합니다. 먼저 현재 결과를 확인하고, 함수로 분리한 뒤 같은 입력에서 결과가 그대로인지 비교하세요.","예를 들어 배송비 계산 코드를 함수로 옮기는 리팩터링을 했다면, 49999·50000·50001 같은 기존 테스트가 모두 같은 결과를 내는지 확인합니다.","구조 변경과 기능 변경을 분리하면 문제가 생겼을 때 원인 범위를 좁히기 쉽습니다.","AI에게 리팩터링을 맡길 때도 ‘외부 동작은 바꾸지 말 것’과 ‘기존 테스트를 통과할 것’을 명시하면 불필요한 변화가 줄어듭니다."]},{"id":"t3-c5-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"긴 계산을 역할별 함수로 나누세요","paragraphs":["이 실습에서는 긴 코드를 두 개의 작은 역할로 나누는 연습을 합니다. 하나는 나이가 정상인지 확인하고, 다른 하나는 정상 나이를 받아 가격을 계산합니다.","두 함수가 서로 다른 일을 맡도록 만들면 나이 허용 범위와 가격 정책 중 하나만 바뀌어도 필요한 함수만 수정할 수 있습니다.","아래 코드는 정상 동작하지만 검증과 계산이 한 덩어리에 있습니다. 두 함수를 만들어 역할을 나눠 보세요.","is_valid_age(age)는 0 이상 120 이하이면 True를 반환하고, ticket_price(age)는 13세 미만 5000원, 그 외 10000원을 반환하도록 설계합니다.","마지막 코드는 두 함수를 호출해 입력을 검사한 뒤 가격을 출력해야 합니다."],"practicePrompt":"두 함수의 빈칸을 채우고 age=10일 때 출력도 예상하세요.","code":"def is_valid_age(age):\n    return __________________\n\ndef ticket_price(age):\n    if __________________:\n        return 5000\n    return 10000\n\nage = 10\n\nif is_valid_age(age):\n    print(ticket_price(age))\nelse:\n    print(\"잘못된 나이\")","answerOnNext":true},{"id":"t3-c5-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"긴 계산을 역할별 함수로 나누세요 · 풀이","paragraphs":["풀이에서는 두 함수의 역할을 섞지 않는 것이 핵심입니다. is_valid_age는 정상 범위인지 True/False만 돌려주고, ticket_price는 가격 숫자만 돌려줍니다.","나이 검증은 0 \u003c= age \u003c= 120으로 한 함수에 모읍니다. 가격 함수는 검증이 끝난 정상 나이를 받는다고 가정하고 나이 구간만 처리합니다.","age=10은 유효한 나이이고 13보다 작으므로 ticket_price의 반환값은 5000입니다.","검증과 가격 계산을 분리했기 때문에 나이 허용 범위가 바뀌어도 가격 함수까지 수정할 필요가 없습니다."],"code":"def is_valid_age(age):\n    return 0 \u003c= age \u003c= 120\n\ndef ticket_price(age):\n    if age \u003c 13:\n        return 5000\n    return 10000\n\nage = 10\n\nif is_valid_age(age):\n    print(ticket_price(age))\nelse:\n    print(\"잘못된 나이\")","codeNote":"출력은 5000입니다."},{"id":"t3-c5-check","kind":"check","eyebrow":"확인 문제","title":"함수의 입력과 출력 계약을 확인합니다","paragraphs":["이 확인 문제는 화면에 보이는 출력과 다른 코드가 사용할 반환값을 구분할 수 있는지 확인합니다.","다음 질문은 화면 출력과 반환값을 구분할 수 있는지 보는 문제입니다.","함수를 다른 계산과 연결하려면 호출한 쪽이 실제 값을 받을 수 있어야 합니다."],"question":"계산 함수 안에서 print(result)만 하고 return result를 하지 않으면, 왜 다른 코드가 그 계산 결과를 이어서 사용하기 어려울까요?","answerOnNext":true},{"id":"t3-c5-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수의 입력과 출력 계약을 확인합니다 · 풀이","paragraphs":["풀이에서는 두 함수의 역할을 섞지 않는 것이 핵심입니다. is_valid_age는 정상 범위인지 True/False만 돌려주고, ticket_price는 가격 숫자만 돌려줍니다.","print는 결과를 화면에 보여 주지만 호출한 코드에 그 값을 전달하지 않습니다. 명시적인 return이 없으면 함수 호출 결과는 보통 None이 됩니다.","다른 계산에서 값을 사용하려면 return으로 반환하고, 호출한 쪽에서 변수에 저장하거나 바로 다음 함수의 argument로 전달해야 합니다."]},{"id":"t3-c5-summary","kind":"summary","eyebrow":"Chapter 5 정리","title":"함수는 큰 문제를 설명 가능한 작은 계약으로 바꿉니다","paragraphs":["함수는 어려운 문법을 하나 더 배우는 것이 아니라 큰 일을 작은 일로 나누는 방법입니다. 이름만 봐도 역할이 보이고, 무엇을 넣으면 무엇이 나오는지가 분명한 함수가 읽고 수정하기 쉽습니다.","함수는 이름, parameter, return value를 가진 작은 작업 단위입니다. 내부 코드보다 먼저 이 세 가지를 보면 프로그램의 큰 구조를 빠르게 읽을 수 있습니다.","한 함수는 가능하면 한 가지 중심 책임을 맡고, 계산 결과는 return으로 밖에 전달합니다. 지역 변수와 scope는 함수 내부의 중간 계산을 다른 부분과 분리해 줍니다.","다음 챕터에서는 함수로 잘 나눈 코드에서도 생길 수 있는 오류를 다룹니다. 핵심은 무작정 수정하는 것이 아니라 같은 오류를 재현하고 원인 범위를 좁히는 것입니다."],"bullets":["parameter는 입력 자리 이름, argument는 호출할 때 넣는 실제 값이다.","print는 보여 주기, return은 값 전달이다.","함수의 contract는 입력·반환값·지켜야 할 규칙이다.","리팩터링 뒤에는 같은 입력에서 외부 동작이 그대로인지 확인한다."]}]},{"id":"t3-c6","track":3,"chapter":6,"title":"오류를 재현하고 원인을 좁히기","remember":"증상과 원인을 구분하고, 같은 오류를 재현한 뒤 범위를 작게 줄여 한 번에 한 가설만 검증한다","practiceGoal":"오류 메시지·중간값·최소 재현 코드를 이용해 버그의 실제 원인을 찾고 수정 후 다시 검증한다","pages":[{"id":"t3-c6-g1","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 1/4","title":"문제가 생겼을 때 먼저 구분할 단어","paragraphs":["코딩을 하다 보면 ‘안 된다’는 순간이 반드시 옵니다. 문제 해결에서 중요한 것은 오류가 생기지 않게 만드는 것이 아니라, 생겼을 때 감으로 여러 곳을 바꾸지 않고 원인을 좁혀 가는 것입니다.","가장 먼저 버그, 오류, 예외, 증상을 구분하면 무엇을 관찰해야 하는지 달라집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"bug 버그","description":"버그는 프로그램이 우리가 원한 대로 움직이지 않게 만드는 문제입니다. 코드가 아예 멈출 수도 있고, 멈추지는 않지만 숫자를 잘못 계산할 수도 있습니다.","usage":"실행은 되지만 결과가 틀리는 문제까지 포함해 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 할인율을 10%가 아니라 100%로 계산하는 코드."},{"term":"error 오류","description":"오류는 잘못된 상태를 넓게 부르는 말입니다. 문법이 틀린 경우도 오류이고, 계산 결과가 틀린 경우도 오류라고 부를 수 있습니다.","usage":"문제의 종류가 아직 확실하지 않을 때 일반적으로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 문법 오류, 잘못된 계산 결과."},{"term":"exception 예외","description":"예외는 Python이 실행 도중 ‘이 상태로는 계속 진행하기 어렵다’고 알리는 오류 신호입니다. 숫자로 바꿀 수 없는 글자를 int()에 넣는 상황처럼 실행 중에 발생합니다.","usage":"파일 없음, 잘못된 타입, 존재하지 않는 키 같은 실행 문제를 다룰 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: int(\"abc\")는 ValueError를 일으킵니다."},{"term":"symptom 증상","description":"증상은 사용자가 겉으로 보는 현상입니다. ‘버튼을 누르니 0원이 나왔다’가 증상이고, 실제 원인은 그 앞의 계산 코드에 있을 수 있습니다.","usage":"문제를 처음 기록할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘결제 버튼을 누르면 합계가 0으로 보인다’가 증상입니다."}]},{"id":"t3-c6-g2","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 2/4","title":"같은 문제를 다시 만들 때 쓰는 단어","paragraphs":["한 번 우연히 생긴 문제를 고치기는 어렵습니다. 어떤 입력과 순서에서 같은 문제가 다시 생기는지 알아야 수정 전후를 비교할 수 있습니다.","재현 가능한 문제는 조사할 수 있는 문제입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"reproduce 재현","description":"재현은 같은 문제를 다시 똑같이 만들어 보는 것입니다. 고장 난 TV가 특정 버튼을 누를 때마다 꺼진다면 그 버튼 순서를 반복해 확인하는 것과 같습니다.","usage":"수정하기 전에 문제를 안정적으로 관찰할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: age=\"abc\"를 넣으면 매번 같은 ValueError가 나는지 확인합니다."},{"term":"reproduction steps 재현 절차","description":"재현 절차는 문제가 생길 때까지 한 행동을 순서대로 적은 것입니다. 누구든 그 순서대로 하면 같은 문제가 생기게 만드는 설명서입니다.","usage":"누구든 같은 문제를 다시 만들 수 있게 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 앱 실행 → 주문 0개 → 쿠폰 적용 → 결제 버튼."},{"term":"minimal reproduction 최소 재현","description":"최소 재현은 문제를 일으키는 데 꼭 필요한 부분만 남긴 작은 예제입니다. 큰 앱 전체 대신 문제가 나는 함수 몇 줄만 떼어 실행해서 원인을 보기 쉽게 만듭니다.","usage":"복잡한 앱에서 문제 범위를 줄일 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 500줄 앱 대신 오류 나는 함수 8줄만 떼어 실행합니다."},{"term":"root cause 근본원인","description":"근본원인은 겉으로 보이는 문제를 실제로 만들어 낸 진짜 원인입니다. 화면에 0원이 나온다고 해서 화면이 원인이라는 뜻은 아닙니다. 앞에서 total을 매번 0으로 지운 것이 진짜 원인일 수 있습니다.","usage":"표면적인 현상만 가리는 수정이 아닌 실제 원인을 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 합계가 0인 증상의 root cause가 반복마다 total을 초기화한 것일 수 있습니다."}]},{"id":"t3-c6-g3","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 3/4","title":"원인을 좁힐 때 쓰는 단어","paragraphs":["디버깅은 정답을 한 번에 맞히는 과정이 아니라, 가능한 원인을 하나씩 제거하는 과정입니다.","가설을 작게 만들고 확인할 증거를 정하면 ‘이것도 바꾸고 저것도 바꾸는’ 혼란을 줄일 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"debugging 디버깅","description":"디버깅은 버그의 진짜 원인을 찾아 고치고, 다시 확인하는 전체 과정입니다. 무작정 여러 줄을 바꾸는 것이 아니라 문제 범위를 조금씩 좁혀 가는 작업입니다.","usage":"오류 조사와 수정 과정을 통틀어 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 재현 → 가설 → 확인 → 수정 → 재검증."},{"term":"hypothesis 가설","description":"가설은 ‘아마 이게 원인일 것 같다’고 세우는 확인 가능한 추측입니다. 중요한 점은 추측에서 끝내지 않고 실제 값이나 테스트로 맞는지 확인하는 것입니다.","usage":"무엇을 먼저 검사할지 정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘쿠폰 적용 후 total이 문자열로 바뀌었을 것이다.’"},{"term":"isolation 격리","description":"격리는 여러 부분 중 하나만 따로 떼어 확인하는 것입니다. 화면, 계산, 네트워크가 모두 연결돼 있을 때 계산 함수만 따로 실행해 보는 식입니다.","usage":"UI·네트워크·계산 중 어느 층에서 틀렸는지 좁힐 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 화면을 제외하고 계산 함수만 직접 호출합니다."},{"term":"verification 검증","description":"검증은 ‘맞는 것 같다’가 아니라 실제 결과로 맞는지 확인하는 일입니다. 같은 입력으로 다시 실행하거나 테스트를 돌려 기대 결과가 나오는지 확인합니다.","usage":"‘고친 것 같다’를 ‘재현이 사라졌다’로 바꿀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 같은 입력으로 다시 실행해 기대값이 나오는지 확인합니다."}]},{"id":"t3-c6-g4","kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 4/4","title":"실행 중 단서를 남길 때 쓰는 단어","paragraphs":["코드가 어디서 틀리는지 보이지 않을 때는 중간 상태를 관찰할 수 있는 단서를 남깁니다. 초보 단계에서는 print만으로도 강력한 디버깅이 가능합니다.","오류 메시지의 정보도 중요한 단서입니다. 무서운 영어 덩어리로 보더라도 파일·줄·예외 이름·마지막 설명을 나눠 읽으면 됩니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"traceback 오류 추적정보","description":"traceback은 Python이 예외가 났을 때 보여 주는 ‘어디를 거쳐 어디에서 실패했는지’에 대한 기록입니다. 처음에는 맨 아래 예외 이름과 내가 작성한 코드의 줄 번호부터 보면 됩니다.","usage":"예외가 실제로 터진 위치를 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 마지막 줄의 ValueError와 그 위의 파일 줄 번호를 확인합니다."},{"term":"log 로그","description":"로그는 프로그램이 실행되면서 남기는 기록입니다. 사용자가 보는 화면과 달리 개발자가 ‘언제 무엇이 일어났는지’를 나중에 확인하기 위해 남깁니다.","usage":"사용자가 볼 필요는 없지만 개발자가 실행 과정을 나중에 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘coupon applied: SAVE10, total=45000’ 같은 기록."},{"term":"debug print 디버그 출력","description":"디버그 출력은 원인을 찾으려고 중간값을 임시로 print해 보는 방법입니다. final만 보지 않고 total, discount 같은 중간값을 직접 확인하는 것입니다.","usage":"별도 디버거 없이 중간 상태를 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: print(\"before discount\", total)."},{"term":"fix 수정","description":"수정은 확인된 원인을 해결하기 위해 코드를 바꾸는 작업입니다. 가능하면 한 번에 여러 곳을 바꾸지 않고 원인과 직접 관련된 부분만 작게 바꿉니다.","usage":"원인 확인 뒤 최소 범위로 변경할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 잘못된 초기화 위치 한 줄을 반복 밖으로 옮깁니다."}]},{"id":"t3-c6-slow-start","kind":"concept","eyebrow":"CHAPTER 06 · 아주 천천히 시작하기","title":"오류가 보인 곳과 오류가 시작된 곳은 다를 수 있습니다","paragraphs":["프로그램에서 문제가 보이면 사람은 자연스럽게 그 화면부터 의심합니다. 하지만 화면은 마지막 결과를 보여 주는 곳일 뿐, 잘못된 값은 훨씬 앞에서 만들어졌을 수 있습니다.","예를 들어 영수증에 최종 금액이 0원으로 찍혔다고 해보겠습니다. 프린터가 고장 났을 수도 있지만, 계산 단계에서 total이 0이 되었을 수도 있고, 데이터가 비어 들어왔을 수도 있습니다. 같은 증상이라도 원인은 여러 가지입니다.","디버깅은 이 여러 가능성 중 실제 원인을 찾는 과정입니다. 그래서 ‘여기가 이상해 보인다’는 느낌보다 실제 값과 실행 결과를 확인합니다.","가장 쉬운 시작은 문제를 다시 만들고, 중간값을 하나씩 확인하는 것입니다. 처음으로 기대와 다른 값이 나온 지점이 원인에 가까운 곳입니다."]},{"id":"t3-c6-p1","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"‘안 돼요’ 대신 관찰한 증상을 정확히 적습니다","paragraphs":["디버깅을 잘하려면 처음부터 원인을 맞히려고 하지 않는 것이 중요합니다. 먼저 ‘내가 실제로 본 현상’만 정확히 적습니다.","예를 들어 ‘서버가 고장 났다’는 원인 추측입니다. ‘결제 버튼을 누르면 최종 금액이 0원으로 표시된다’는 관찰한 증상입니다.","증상을 사실 그대로 적어 두면 원인이 UI인지, 계산인지, 데이터인지 여러 가능성을 열어 둘 수 있습니다. 처음부터 한 원인에 꽂히는 실수를 줄여 줍니다.","디버깅의 첫 문장은 원인 추측이 아니라 관찰한 사실이어야 합니다. ‘서버가 이상하다’보다 ‘저장 버튼을 누르면 3초 뒤 화면이 멈추고 오류 문구가 뜬다’가 좋습니다.","증상과 원인을 섞으면 처음 세운 추측에 끌려갈 수 있습니다. 화면이 멈췄다고 해서 반드시 UI 코드가 원인은 아닙니다. 네트워크 응답이 늦거나 데이터 변환에서 예외가 났을 수도 있습니다.","문제를 기록할 때 입력값, 기대 결과, 실제 결과, 재현 절차를 같이 적으면 가설을 세우기 쉬워집니다.","AI에게 디버깅을 맡길 때도 이 네 가지를 주면 ‘아마 이럴 것’이라는 추측보다 실제 증거에 기반한 답을 받을 가능성이 높아집니다."]},{"id":"t3-c6-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"디버깅은 수정부터가 아니라 재현부터 시작합니다","paragraphs":["디버깅은 고장 난 부분을 보자마자 아무 코드나 바꾸는 작업이 아닙니다. 의사가 증상을 듣고 검사한 뒤 원인을 좁혀 가는 것과 비슷합니다.","먼저 같은 문제를 다시 만들 수 있어야 합니다. 그다음 ‘아마 여기일 것이다’라는 가설 하나를 세우고, 중간값이나 오류 메시지로 그 가설이 맞는지 확인합니다.","원인이 확인된 뒤에야 작은 수정을 합니다. 그리고 처음과 똑같은 방법으로 다시 실행해서 문제가 정말 사라졌는지 확인합니다.","문제를 발견하자마자 코드를 바꾸면 원래 문제가 무엇이었는지 사라져 검증하기 어려워질 수 있습니다.","먼저 같은 문제가 반복되는지 확인하고, 가능한 원인 가설 하나를 세운 뒤 그 가설을 확인할 최소한의 관찰을 합니다.","원인이 확인되면 작은 수정 하나를 적용하고 같은 재현 절차로 다시 확인합니다."],"visual":"DEBUG_LOOP","bullets":["증상 기록","재현","가설 하나 세우기","중간값·오류정보로 확인","최소 수정","같은 절차로 재검증"]},{"id":"t3-c6-p2","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"traceback은 맨 아래 예외 이름부터 읽습니다","paragraphs":["traceback은 처음 보면 영어가 길게 쏟아져 나와 겁이 날 수 있습니다. 전부 읽으려고 하지 않아도 됩니다.","처음에는 맨 아래 줄부터 봅니다. ValueError, TypeError, KeyError처럼 어떤 종류의 문제가 났는지와 짧은 설명이 있습니다. 그다음 위쪽에서 내가 작성한 파일 이름과 줄 번호를 찾습니다.","이 두 정보만으로도 ‘무슨 종류의 오류가 어느 줄에서 드러났는가’를 알 수 있습니다. 나머지 긴 경로는 필요할 때 천천히 보면 됩니다.","Python traceback은 위에서부터 읽으면 긴 경로가 먼저 보여 초보자에게 어렵습니다. 처음에는 맨 아래 줄의 예외 이름과 설명을 먼저 봅니다.","예를 들어 ValueError: invalid literal for int()라는 문구가 있다면 ‘문자열을 정수로 바꾸려 했는데 그 내용이 정수 형태가 아니다’라는 방향을 잡을 수 있습니다.","그다음 바로 위에서 내가 작성한 파일의 줄 번호를 찾습니다. 라이브러리 내부 경로가 여러 줄 있어도 우선 내 코드가 호출된 지점을 찾는 것이 중요합니다.","오류 메시지를 지우고 재실행하기 전에 그대로 복사해 두면 AI에게 질문하거나 검색할 때 훨씬 정확한 단서가 됩니다."]},{"id":"t3-c6-example1","kind":"example","eyebrow":"예제로 연결하기","title":"예외 메시지는 ‘무슨 값에서 실패했는가’를 알려 줍니다","paragraphs":["이 코드에서 int(\"abc\")가 실패하는 이유는 int 함수가 나빠서가 아닙니다. int는 숫자 모양의 글자를 숫자로 바꾸는 도구인데 \"abc\"는 숫자 모양이 아니기 때문입니다.","즉 겉으로 보이는 증상은 프로그램이 예외로 멈춘 것이고, 더 근본적인 문제는 ‘숫자로 바꿀 수 있는 입력인지 확인하지 않고 바로 변환했다’는 것입니다.","오류 메시지를 읽을 때는 ‘어떤 함수가 실패했지?’뿐 아니라 ‘그 함수에 실제로 어떤 값이 들어갔지?’까지 함께 보면 원인을 더 빨리 찾을 수 있습니다.","아래 코드는 문자열 \"abc\"를 int로 바꾸려고 하므로 ValueError가 발생합니다. 여기서 핵심 원인은 int 함수 자체가 고장난 것이 아니라 입력이 숫자 모양이 아니라는 점입니다.","증상은 프로그램이 멈춘 것이고, root cause는 숫자로 바꿀 수 없는 입력을 검사하지 않은 것입니다.","수정 방향은 무조건 try/except를 붙이는 것이 아니라 ‘어떤 입력을 허용할 것인가’를 먼저 정하는 것입니다."],"code":"age_text = \"abc\"\nage = int(age_text)\nprint(age)","codeNote":"실행하면 ValueError가 발생합니다. 오류 메시지의 마지막 줄과 age = int(age_text) 줄을 연결해 읽으세요.","codeExplain":["1단계: 1행: age_text에 숫자가 아닌 문자열을 저장합니다.","2단계: 2행: int가 문자열을 정수로 바꾸려고 시도합니다.","3단계: 2행: \"abc\"는 정수 형태가 아니므로 여기서 ValueError가 발생합니다.","4단계: 3행: 예외로 실행이 중단되므로 print까지 도달하지 못합니다."]},{"id":"t3-c6-p3","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"복잡한 문제는 최소 재현으로 줄입니다","paragraphs":["앱 전체가 5000줄인데 오류가 난다고 해서 5000줄을 모두 읽을 필요는 없습니다. 문제가 나는 부분을 작게 떼어 똑같은 현상이 생기는지 확인하면 됩니다.","예를 들어 주문 계산 화면에서 합계가 틀리다면 UI를 전부 빼고 계산 함수에 숫자 몇 개만 직접 넣어 볼 수 있습니다. 작은 코드에서도 같은 값이 틀리면 원인이 계산 쪽에 있을 가능성이 큽니다.","이렇게 문제를 작게 줄인 예제를 최소 재현이라고 합니다. 원인을 찾기 쉬워지고 AI에게 보여 줄 코드도 훨씬 짧아집니다.","앱 전체에서 오류가 날 때 모든 파일을 동시에 들여다보면 원인 후보가 너무 많습니다. 문제가 의심되는 함수와 입력만 따로 떼어 같은 문제가 나는지 확인합니다.","작게 줄였는데도 문제가 계속 나면 원인은 그 작은 범위 안에 있을 가능성이 높습니다. 반대로 문제가 사라지면 제거한 부분 중 하나가 조건에 관여했을 수 있습니다.","최소 재현은 원본 앱을 버리는 것이 아니라 조사용 복사본을 만드는 개념입니다. 운영 코드를 무작정 삭제하지 마세요.","AI에게도 5000줄 전체보다 20줄 최소 재현과 기대/실제 결과를 주면 더 정확한 분석을 기대할 수 있습니다."]},{"id":"t3-c6-example2","kind":"example","eyebrow":"예제로 연결하기","title":"중간값을 출력하면 처음 어긋난 지점을 찾을 수 있습니다","paragraphs":["최종 결과만 틀렸다고 해서 마지막 계산줄이 원인이라는 뜻은 아닙니다. 중간값이 이미 잘못됐다면 마지막 줄은 그 잘못된 값을 정상적으로 계산했을 뿐일 수 있습니다.","그래서 total, discount_amount, final을 각각 출력해 봅니다. total부터 틀리면 더 앞쪽을 보고, total은 맞는데 discount가 틀리면 할인 계산을 보면 됩니다.","이 방법은 문제 범위를 절반씩 줄여 가는 것과 같습니다. 중간값을 확인할수록 원인이 있을 수 있는 범위가 작아집니다.","아래 코드는 할인 후 금액이 예상과 다르다고 가정해 봅시다. 최종 final만 보면 어느 계산이 틀렸는지 알기 어렵습니다.","total과 discount_amount를 따로 출력하면 입력이 틀렸는지, 할인 계산이 틀렸는지, 마지막 뺄셈이 틀렸는지 범위를 나눌 수 있습니다.","문제를 해결한 뒤 불필요한 debug print는 제거하거나 정식 log로 바꾸는 것이 좋습니다."],"code":"total = 80000\nrate = 0.1\n\ndiscount_amount = total * rate\nfinal = total - discount_amount\n\nprint(\"total:\", total)\nprint(\"discount:\", discount_amount)\nprint(\"final:\", final)","codeNote":"정상이라면 total 80000, discount 8000.0, final 72000.0이 보입니다.","codeExplain":["1단계: 1~2행: 입력 상태를 고정합니다.","2단계: 4행: 할인액이라는 중간값을 따로 만듭니다.","3단계: 5행: 최종값을 계산합니다.","4단계: 7~9행: 각 단계의 실제 값을 노출해 처음 잘못된 값을 찾습니다."]},{"id":"t3-c6-p4","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"한 번에 한 가설만 바꾸면 원인을 잃지 않습니다","paragraphs":["버그를 보면 여러 군데가 수상해 보여 한꺼번에 고치고 싶을 수 있습니다. 하지만 세 곳을 동시에 바꾸면 문제가 사라져도 어느 변경이 진짜 해결책이었는지 알기 어렵습니다.","대신 ‘total을 반복문 안에서 0으로 만드는 것이 원인일 것이다’처럼 가설을 하나 세우고 그 부분만 바꿉니다.","문제가 해결되면 가설이 맞았다는 증거가 늘고, 해결되지 않으면 그 가설을 버리고 다음 가능성을 확인합니다. 실패한 가설도 원인 후보 하나를 제거했다는 점에서 의미가 있습니다.","버그를 발견하면 여러 줄을 동시에 고치고 싶은 마음이 생깁니다. 하지만 세 곳을 바꾼 뒤 문제가 사라지면 어느 수정이 실제 원인이었는지 알기 어렵습니다.","가설을 하나 정하고 그 가설을 확인하는 최소 변경만 적용하세요. 예를 들어 ‘total 초기화 위치가 문제다’라면 그 위치만 옮기고 같은 테스트를 다시 실행합니다.","변경 후 문제가 그대로면 가설이 틀렸다는 증거입니다. 실패한 가설도 가치가 있습니다. 원인 후보 하나를 제거했기 때문입니다.","이 방식은 느려 보이지만 큰 앱에서는 오히려 가장 빠릅니다. 특히 AI가 여러 파일을 한 번에 수정하려 할 때 변경 범위를 작게 유지하는 이유입니다."]},{"id":"t3-c6-p5","kind":"concept","eyebrow":"CHAPTER 06 · 핵심 이해","title":"증상이 사라져도 다른 입력에서 망가지지 않았는지 확인합니다","paragraphs":["한 입력에서 문제가 사라졌다고 바로 끝내면 안 됩니다. 수정한 코드가 다른 정상 상황을 새로 망가뜨렸을 수도 있기 때문입니다.","예를 들어 음수 입력 문제를 고쳤다면 -1만 다시 보는 것이 아니라 0, 1, 50000 같은 원래 정상 값도 확인합니다.","이렇게 수정 때문에 예전 기능이 깨지지 않았는지 보는 습관이 다음 챕터의 회귀 테스트로 이어집니다.","특정 입력 하나에서 문제가 사라졌다고 디버깅이 끝난 것은 아닙니다. 수정 전 정상 동작하던 대표 입력도 다시 확인해야 합니다.","예를 들어 음수 입력 처리를 고쳤다면 정상 양수와 경계값 0도 다시 실행합니다. 새 수정이 기존 정상 경로를 깨뜨리지 않았는지 보는 것입니다.","다음 챕터에서 배우는 테스트와 회귀 검증은 바로 이 과정을 체계화합니다.","‘재현 안 됨’과 ‘원인이 해결됨’은 같지 않을 수 있습니다. 왜 문제가 생겼고 왜 이 수정이 해결하는지 한 문장으로 설명할 수 있어야 합니다."]},{"id":"t3-c6-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"증상에서 root cause까지 좁혀 보세요","paragraphs":["이 실습은 문법 오류가 없는 버그를 찾는 연습입니다. 코드가 실행된다는 사실만으로 결과가 맞다는 뜻은 아닙니다.","total 값이 반복할 때마다 어떻게 바뀌는지 적어 보면 어느 줄에서 이전 합계가 사라지는지 바로 보입니다.","아래 코드는 세 가격의 합계가 12000이 나와야 하지만 실제로 5000이 나옵니다.","문법 오류는 없으므로 traceback은 없습니다. 상태 추적과 최소한의 가설로 원인을 찾으세요.","수정은 한 줄의 위치만 바꾸면 됩니다."],"practicePrompt":"① 증상을 한 문장으로 쓰기 ② root cause가 되는 줄 찾기 ③ 최소 수정 후 기대 결과 쓰기","code":"prices = [3000, 4000, 5000]\n\nfor price in prices:\n    total = 0\n    total += price\n\nprint(total)","answerOnNext":true},{"id":"t3-c6-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"증상에서 root cause까지 좁혀 보세요 · 풀이","paragraphs":["풀이의 핵심은 total = 0의 위치입니다. 합계를 기억하려면 반복 전에 한 번만 0으로 만들고, 반복 안에서는 이전 total에 현재 price만 계속 더해야 합니다.","증상은 ‘세 가격 합계를 기대했지만 5000이 출력된다’입니다. root cause는 total = 0이 반복문 안에 있어 iteration마다 이전 합계를 지우는 것입니다.","total = 0을 for 앞에 한 번만 실행되도록 옮기면 total은 0→3000→7000→12000으로 누적됩니다.","수정 뒤에는 같은 입력에서 12000이 나오는지 확인하고, 빈 리스트에서도 0이 나오는지 함께 확인하면 더 안전합니다."],"code":"prices = [3000, 4000, 5000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"수정 후 출력은 12000입니다."},{"id":"t3-c6-check","kind":"check","eyebrow":"확인 문제","title":"증상과 원인을 구분할 수 있는지 확인합니다","paragraphs":["이 확인 문제는 눈에 보이는 현상과 실제 원인을 같은 것으로 착각하지 않는지 확인합니다.","문제가 보이는 위치와 실제 원인이 있는 위치는 다를 수 있습니다.","다음 질문에 ‘증상’과 ‘root cause’를 각각 한 문장으로 나눠 답해 보세요."],"question":"화면에 최종 금액이 0원으로 표시됩니다. 이 사실만으로 화면 UI 코드가 root cause라고 단정하면 안 되는 이유는 무엇일까요?","answerOnNext":true},{"id":"t3-c6-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"증상과 원인을 구분할 수 있는지 확인합니다 · 풀이","paragraphs":["풀이의 핵심은 total = 0의 위치입니다. 합계를 기억하려면 반복 전에 한 번만 0으로 만들고, 반복 안에서는 이전 total에 현재 price만 계속 더해야 합니다.","0원이 보이는 것은 사용자가 관찰한 증상입니다. 실제 root cause는 앞 단계 계산, 데이터 읽기, 타입 변환, 초기화 위치처럼 화면에 전달되기 전 어느 단계에도 있을 수 있습니다.","따라서 최종 화면에서 거꾸로 데이터 흐름을 따라가며 처음 값이 잘못된 지점을 찾아야 합니다."]},{"id":"t3-c6-summary","kind":"summary","eyebrow":"Chapter 6 정리","title":"디버깅은 감이 아니라 증거를 모으는 과정입니다","paragraphs":["디버깅은 정답을 빨리 맞히는 능력이 아니라 틀릴 수 있는 범위를 하나씩 줄이는 능력입니다. 증상을 정확히 적고, 같은 문제를 재현하고, 가설 하나를 증거로 확인하는 순서를 지키면 됩니다.","좋은 디버깅은 문제를 보자마자 코드를 바꾸는 것이 아니라 증상을 정확히 기록하고 같은 조건에서 재현하는 것부터 시작합니다.","가설을 하나 세우고 중간값·traceback·최소 재현으로 범위를 좁힌 뒤, 원인이 확인되면 최소 수정 하나를 적용합니다.","다음 챕터에서는 이 과정을 반복 가능한 테스트로 남깁니다. 사람이 매번 기억해서 확인하지 않아도 같은 규칙을 자동으로 검증할 수 있게 만드는 단계입니다."],"bullets":["증상과 root cause를 분리한다.","수정 전에 재현 절차와 입력을 고정한다.","오류 메시지는 맨 아래 예외 이름과 내 코드 줄부터 읽는다.","한 번에 한 가설만 검증하고 수정 후 같은 절차로 다시 확인한다."]}]},{"id":"t3-c7","track":3,"chapter":7,"title":"테스트와 경계값으로 검증하기","remember":"기대 결과를 먼저 적고 정상·경계·잘못된 입력을 테스트해 수정이 기존 동작을 깨지 않았는지 확인한다","practiceGoal":"테스트 케이스 표와 assert를 이용해 함수의 정상 경로·경계값·오류 입력을 검증한다","pages":[{"id":"t3-c7-g1","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 1/4","title":"테스트를 시작할 때 쓰는 단어","paragraphs":["테스트는 코드를 의심한다는 뜻이 아니라, 우리가 기대하는 동작을 구체적인 입력과 결과로 적어 두는 일입니다.","‘잘 됩니다’라는 문장을 여러 개의 테스트 케이스로 바꾸면 무엇이 맞아야 완료인지 분명해집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"test 테스트","description":"테스트는 프로그램이 우리가 정한 규칙대로 움직이는지 실제로 확인하는 일입니다. ‘아마 맞겠지’ 대신 입력을 넣고 결과를 비교합니다.","usage":"기능 완료와 수정 안전성을 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 주문의 배송비가 0인지 확인합니다."},{"term":"test case 테스트 케이스","description":"테스트 케이스는 하나의 검사 상황입니다. 어떤 값을 넣을지와 무엇이 나와야 하는지를 한 세트로 적습니다.","usage":"서로 다른 상황을 빠짐없이 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total=49999 → fee=3000."},{"term":"expected result 기대 결과","description":"기대 결과는 코드를 실행하기 전에 ‘규칙대로라면 이 결과가 나와야 한다’고 정한 값입니다. 실제 결과와 비교할 기준이 됩니다.","usage":"실제 결과와 비교할 기준으로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 이상이면 기대 배송비는 0원입니다."},{"term":"actual result 실제 결과","description":"실제 결과는 코드를 정말 실행해서 나온 값입니다. 기대 결과와 같으면 그 테스트는 통과하고, 다르면 문제가 있는지 조사합니다.","usage":"기대 결과와 비교해 PASS/FAIL을 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 함수가 실제로 3000을 반환했다면 기대값 0과 다릅니다."}]},{"id":"t3-c7-g2","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 2/4","title":"경계와 특수 상황을 검사할 때 쓰는 단어","paragraphs":["평범한 값 하나만 통과하면 규칙이 정확하다고 말하기 어렵습니다. 조건이 바뀌는 바로 주변에서 오류가 잘 드러납니다.","특히 >=와 >처럼 한 글자 차이 문법은 경계값을 넣었을 때만 차이가 보일 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"boundary value 경계값","description":"경계값은 규칙이 바뀌는 정확한 기준 숫자입니다. 50000원부터 무료배송이라면 50000이 경계값입니다.","usage":"비교 연산의 포함·제외가 맞는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 무료배송 기준이 50000원이면 50000이 boundary value입니다."},{"term":"edge case 경계·특수 경우","description":"특수 경우는 평범한 값과 달라서 오류가 잘 숨어 있는 상황입니다. 빈 리스트, 0개, 최대값, 최소값처럼 자주 놓치는 경우를 뜻합니다.","usage":"일반 테스트가 놓치는 문제를 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 빈 리스트, 0개 주문."},{"term":"happy path 정상 경로","description":"정상 경로는 사용자가 올바른 값을 넣고 모든 일이 예상대로 진행되는 가장 기본적인 상황입니다.","usage":"기능의 기본 동작부터 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 정상 가격과 정상 쿠폰으로 결제 성공."},{"term":"negative test 잘못된 입력 테스트","description":"잘못된 입력 테스트는 일부러 틀린 값을 넣어 프로그램이 안전하게 거부하는지 보는 테스트입니다. 예를 들어 나이에 -5를 넣어 보는 식입니다.","usage":"오류 처리와 검증 로직을 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 가격 -1을 넣으면 오류 처리되는지 확인합니다."}]},{"id":"t3-c7-g3","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 3/4","title":"코드로 결과를 확인할 때 쓰는 단어","paragraphs":["테스트를 사람이 눈으로만 확인할 수도 있지만, 기대값과 실제값을 코드가 직접 비교하게 만들면 반복 검증이 쉬워집니다.","Python의 assert는 가장 단순한 자동 확인 도구 중 하나입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"assertion 검증식","description":"검증식은 ‘이 조건은 반드시 맞아야 한다’고 코드에 적어 두는 확인 문장입니다. 실제 결과가 다르면 즉시 실패를 알려 줍니다.","usage":"기대 결과와 실제 결과가 같은지 자동으로 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: assert shipping_fee(50000) == 0."},{"term":"assert","description":"assert는 뒤의 조건이 True인지 확인하는 Python 문법입니다. False이면 AssertionError를 내서 기대와 실제가 다르다는 사실을 알려 줍니다.","usage":"작은 함수나 학습 예제의 기대값을 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: assert add(2, 3) == 5."},{"term":"PASS 통과","description":"PASS는 실제 결과가 기대 결과와 같아서 해당 검사가 성공했다는 뜻입니다.","usage":"검증 결과를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 49999원 배송비 3000원 → PASS."},{"term":"FAIL 실패","description":"FAIL은 실제 결과가 기대 결과와 달라 해당 검사가 실패했다는 뜻입니다. 실패했다고 무조건 코드가 틀렸다는 뜻은 아니고, 테스트 기대값이 잘못됐을 가능성도 확인해야 합니다.","usage":"어떤 규칙이 깨졌는지 찾기 시작할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 배송비가 3000원 → FAIL."}]},{"id":"t3-c7-g4","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 4/4","title":"테스트의 범위와 재발 방지에 쓰는 단어","paragraphs":["테스트는 크기에 따라 목적이 다릅니다. 작은 함수 하나를 따로 확인할 수도 있고, 여러 부분을 연결한 전체 흐름을 확인할 수도 있습니다.","버그를 한 번 고쳤다면 같은 문제가 다시 생기지 않게 테스트로 남기는 것이 중요합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"unit test 단위 테스트","description":"단위 테스트는 작은 부품 하나만 따로 검사하는 테스트입니다. 예를 들어 앱 전체가 아니라 shipping_fee 함수만 여러 금액으로 확인합니다.","usage":"계산 로직처럼 입력과 출력이 분명한 코드를 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: shipping_fee 함수만 여러 금액으로 검사합니다."},{"term":"integration test 통합 테스트","description":"통합 테스트는 여러 부품을 실제로 연결했을 때 잘 맞물리는지 확인하는 테스트입니다. 계산 함수가 맞아도 DB나 화면 연결에서 문제가 날 수 있기 때문입니다.","usage":"함수끼리 연결하거나 API·DB·화면이 이어지는 흐름을 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 주문 계산 → 저장 → 화면 표시까지 연결해 확인합니다."},{"term":"regression 회귀","description":"회귀는 새로 고친 뒤 예전에 잘 되던 기능이 다시 망가지는 것입니다. 그래서 수정 뒤에는 새 문제뿐 아니라 기존 기능도 다시 테스트합니다.","usage":"버그 수정이나 기능 추가 뒤 기존 기능을 재검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 쿠폰 수정 후 무료배송 조건이 깨지는 경우."},{"term":"test suite 테스트 묶음","description":"테스트 묶음은 여러 테스트 케이스를 한꺼번에 실행할 수 있도록 모아 둔 것입니다. 버튼 한 번으로 여러 규칙을 다시 확인할 수 있습니다.","usage":"기능 전체의 규칙을 한 번에 다시 검증할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 정상·경계·음수 입력 테스트를 한 묶음으로 둡니다."}]},{"id":"t3-c7-slow-start","kind":"concept","eyebrow":"CHAPTER 07 · 아주 천천히 시작하기","title":"테스트는 ‘이 값을 넣으면 이 값이 나와야 한다’를 적는 것입니다","paragraphs":["테스트라는 말을 들으면 복잡한 개발 도구를 떠올릴 수 있지만, 가장 기본적인 테스트는 아주 단순합니다. 입력 하나와 정답 하나를 미리 정하고 실제 결과와 비교하는 것입니다.","예를 들어 배송비 규칙이 ‘50000원 이상은 무료’라면 total=50000을 넣었을 때 정답은 0원입니다. 프로그램이 실제로 0을 내놓으면 이 테스트는 통과합니다. 3000을 내놓으면 실패합니다.","테스트를 여러 개 만드는 이유는 상황마다 규칙이 다를 수 있기 때문입니다. 49999, 50000, 50001처럼 경계 주변을 따로 보면 비교 연산자가 맞는지 알 수 있습니다.","즉 테스트는 어려운 별도 기술이라기보다 ‘내가 원하는 결과를 미리 숫자로 적어 두고 컴퓨터에게 계속 확인시키는 방법’입니다."]},{"id":"t3-c7-p1","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트는 코드를 쓴 뒤가 아니라 규칙을 정할 때부터 시작할 수 있습니다","paragraphs":["테스트는 코드를 다 만든 뒤 마지막에 하는 시험이라고만 생각할 필요가 없습니다. 코드를 쓰기 전에도 ‘어떤 입력에서 어떤 결과가 나와야 하지?’를 적을 수 있습니다.","무료배송 규칙이 50000원 이상이라면 코드를 보기 전에 49999→3000, 50000→0, 50001→0이라고 적을 수 있습니다. 이것이 이미 테스트 케이스의 뼈대입니다.","그 뒤 코드를 실행해서 실제 결과와 비교합니다. 기대한 값과 같으면 통과, 다르면 어느 쪽이 잘못됐는지 확인합니다.","함수를 만들기 전에도 테스트 케이스를 적을 수 있습니다. 오히려 기대 결과를 먼저 쓰면 요구사항의 모호함이 드러납니다.","‘50000원 이상 무료배송’이라는 문장이 있다면 49999→3000, 50000→0, 50001→0처럼 표를 만들 수 있습니다. 이 표는 아직 코드가 없어도 만들 수 있습니다.","그다음 코드를 작성하고 actual result를 표 옆에 적습니다. 기대와 실제가 다르면 FAIL이고 조사 대상이 됩니다.","이 습관은 AI에게 코드를 맡길 때 특히 유용합니다. ‘이 테스트들을 모두 통과해야 한다’고 명시하면 완료 기준이 훨씬 객관적이 됩니다."]},{"id":"t3-c7-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"좋은 테스트는 정상·경계·잘못된 입력을 함께 봅니다","paragraphs":["테스트를 하나만 한다면 보통 가장 평범한 정상 상황을 먼저 보게 됩니다. 하지만 버그는 규칙이 바뀌는 경계나 이상한 입력에서 잘 숨어 있습니다.","그래서 80000원처럼 확실히 무료배송인 값 하나만 보지 말고 49999, 50000, 50001을 봅니다. 여기에 -1 같은 잘못된 값도 넣어 봅니다.","이렇게 몇 개만 골라도 ‘정상일 때’, ‘딱 경계일 때’, ‘잘못된 값일 때’를 모두 볼 수 있어 테스트 효율이 높아집니다.","정상 입력 하나만 테스트하면 가장 쉬운 길만 확인한 것입니다. 규칙이 바뀌는 지점과 허용되지 않는 값도 함께 넣어야 합니다.","한 기능에 필요한 모든 경우를 무한히 만들 수는 없지만, 위험이 큰 지점을 우선하면 적은 테스트로 많은 오류를 잡을 수 있습니다.","초보 단계에서는 ‘정상 1개 + 경계 아래 + 경계값 + 경계 위 + 잘못된 입력 1개’부터 시작하세요."],"visual":"TEST_MATRIX","bullets":["정상값: 대표적인 올바른 입력","경계 바로 아래","경계값 자체","경계 바로 위","잘못된 입력 또는 빈 값"]},{"id":"t3-c7-example1","kind":"example","eyebrow":"예제로 연결하기","title":"assert는 기대값과 실제값을 한 줄로 비교합니다","paragraphs":["assert는 아주 간단한 자동 검사입니다. 오른쪽과 왼쪽이 같아야 한다고 적어 두고 실제로 맞는지 Python이 확인합니다.","assert shipping_fee(50000) == 0은 ‘50000을 넣었을 때 결과가 반드시 0이어야 한다’는 뜻입니다.","결과가 0이면 조용히 넘어가고, 3000처럼 다르면 AssertionError가 나옵니다. 사람이 눈으로 숫자를 하나씩 비교하지 않아도 됩니다.","아래 함수는 주문 금액에 따라 배송비를 반환합니다. assert 줄은 함수 반환값이 기대값과 같은지 확인합니다.","모두 맞으면 특별한 출력 없이 지나갑니다. 하나라도 틀리면 AssertionError가 발생해 어느 가정이 깨졌는지 알 수 있습니다.","학습 단계에서는 복잡한 테스트 도구가 없어도 assert만으로 작은 계산 함수를 충분히 검증할 수 있습니다."],"code":"def shipping_fee(total):\n    if total \u003c 0:\n        return None\n    if total >= 50000:\n        return 0\n    return 3000\n\nassert shipping_fee(49999) == 3000\nassert shipping_fee(50000) == 0\nassert shipping_fee(50001) == 0\nassert shipping_fee(-1) is None","codeNote":"네 검증식이 모두 통과하면 현재 규칙 기준으로 PASS입니다.","codeExplain":["1단계: 1~7행: 배송비 규칙을 함수로 정의합니다.","2단계: 9행: 경계 바로 아래를 검사합니다.","3단계: 10행: 경계값 자체가 무료배송에 포함되는지 검사합니다.","4단계: 11행: 경계 바로 위 정상값을 검사합니다.","5단계: 12행: 잘못된 음수 입력이 정해진 방식으로 거부되는지 확인합니다."]},{"id":"t3-c7-p2","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"경계값은 조건문 한 글자 오류를 잡아냅니다","paragraphs":["경계값을 테스트하는 이유는 조건문에서 기호 하나만 달라도 중간값에서는 티가 안 날 수 있기 때문입니다.","total > 50000과 total >= 50000은 80000을 넣으면 둘 다 True입니다. 그래서 80000만 테스트하면 둘의 차이를 못 봅니다.","하지만 50000을 넣으면 첫 번째는 False이고 두 번째는 True입니다. 딱 기준점 자체를 테스트해야 ‘이상’과 ‘초과’ 차이가 드러납니다.","무료배송 조건이 total > 50000으로 잘못 작성돼도 80000 같은 평범한 테스트는 통과합니다. 하지만 정확히 50000을 넣으면 실패합니다.","그래서 조건이 >=인지 >인지, \u003c=인지 \u003c인지 중요한 곳에서는 기준값 자체를 반드시 테스트해야 합니다.","범위에도 같은 원리가 적용됩니다. 나이를 0~120으로 허용한다면 -1, 0, 120, 121을 확인하면 포함·제외 경계를 빠르게 검증할 수 있습니다.","경계값 테스트는 많을수록 좋은 것이 아니라 규칙이 바뀌는 지점을 정확히 찌르는 것이 중요합니다."]},{"id":"t3-c7-p3","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"unit test와 integration test는 서로 다른 질문에 답합니다","paragraphs":["unit test와 integration test의 차이는 검사하는 범위입니다. 작은 부품 하나만 검사하느냐, 여러 부품을 연결해서 검사하느냐의 차이입니다.","shipping_fee 함수만 숫자를 넣어 보는 것은 작은 부품 검사입니다. 함수는 맞아도 실제 앱에서 주문 금액이 잘못 전달된다면 화면에서는 여전히 틀릴 수 있습니다.","그래서 작은 계산은 단위 테스트로 빠르게 확인하고, 중요한 사용 흐름은 통합 테스트로 연결까지 확인합니다.","shipping_fee 함수만 직접 호출해 값이 맞는지 보는 것은 unit test에 가깝습니다. 빠르고 원인 범위를 좁히기 쉽습니다.","하지만 실제 앱에서는 주문 총액이 화면에서 들어오고, 계산되고, 저장되고, 다시 화면에 표시될 수 있습니다. 각 함수가 따로 맞아도 연결 과정에서 문제가 생길 수 있습니다.","그래서 작은 로직은 unit test로 빠르게 확인하고, 중요한 사용자 흐름은 integration test로 연결 상태를 확인합니다.","초보 단계에서 이름을 외우는 것보다 ‘작은 부품만 검사하는가, 여러 부품의 연결을 검사하는가’를 구분할 수 있으면 충분합니다."]},{"id":"t3-c7-example2","kind":"example","eyebrow":"예제로 연결하기","title":"버그를 고쳤다면 그 입력을 테스트로 남깁니다","paragraphs":["버그를 한 번 고쳤다면 그때 문제를 만들었던 정확한 입력을 테스트로 남겨 두는 것이 좋습니다.","50000원에서 한 번 배송비 버그가 났다면 수정 후에도 50000 테스트를 계속 보관합니다. 나중에 누군가 조건을 다시 >로 바꾸면 이 테스트가 바로 실패합니다.","사람이 과거 문제를 기억하지 않아도 테스트가 대신 기억해 주는 셈입니다.","과거에 total=50000에서 배송비가 3000으로 잘못 나오는 버그가 있었다고 해봅시다. 조건을 >=로 수정해 문제를 해결했습니다.","이때 50000 테스트를 삭제하지 말고 계속 남겨 둡니다. 나중에 다른 사람이 조건을 바꾸다가 같은 실수를 다시 만들면 테스트가 즉시 FAIL이 됩니다.","이처럼 과거 버그를 막아 주는 테스트는 회귀 방지 역할을 합니다."],"code":"def shipping_fee(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\n# 과거 버그를 다시 막는 테스트\nassert shipping_fee(50000) == 0","codeNote":"이 테스트가 남아 있으면 경계 조건이 다시 >로 바뀌는 실수를 빠르게 발견할 수 있습니다.","codeExplain":["1단계: 1~4행: 현재 배송비 구현입니다.","2단계: 7행: 과거에 실패했던 정확한 입력을 회귀 테스트로 남깁니다."]},{"id":"t3-c7-p4","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트가 많아도 기대 결과가 틀리면 잘못된 확신을 줄 수 있습니다","paragraphs":["테스트가 많다고 자동으로 안전해지는 것은 아닙니다. 테스트에 적어 둔 기대값 자체가 틀리면 잘못된 코드가 통과할 수도 있습니다.","예를 들어 실제 규칙은 50000원 이상 무료인데 테스트를 실수로 ‘50000→3000’이라고 적었다면, 잘못된 구현이 오히려 PASS할 수 있습니다.","그래서 테스트도 요구사항과 맞는지 검토해야 합니다. 가능하면 구현 코드를 보고 기대값을 정하기보다 원래 요구사항에서 기대값을 먼저 정합니다.","테스트는 코드와 별개의 진실이 아닙니다. 사람이 잘못된 기대값을 적으면 코드가 잘못돼도 테스트가 통과할 수 있습니다.","그래서 중요한 규칙은 요구사항과 테스트 케이스를 함께 읽고, 테스트가 정말 요구사항을 표현하는지 확인해야 합니다.","AI가 테스트를 자동 생성해도 마찬가지입니다. 코드 구현을 그대로 보고 비슷한 테스트를 만들면 구현의 같은 실수를 테스트가 반복할 수 있습니다.","가능하면 요구사항에서 기대 결과를 먼저 만들고, 그다음 구현과 독립적으로 비교하세요."]},{"id":"t3-c7-p5","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트 결과에는 ‘무엇을 확인했는지’가 남아야 합니다","paragraphs":["테스트 결과에 PASS 하나만 남아 있으면 나중에 무엇을 확인했는지 알기 어렵습니다. 어떤 기능, 어떤 입력, 어떤 기대값을 검사했는지 연결돼 있어야 합니다.","예를 들어 ‘배송비 경계 테스트: 50000 입력, 기대 0, 실제 0, PASS’처럼 남아 있으면 실패했을 때 바로 상황을 재현할 수 있습니다.","테스트는 단순히 점수를 매기는 것이 아니라 다음 디버깅을 쉽게 만드는 기록이기도 합니다.","PASS라는 글자 하나만 남기면 어떤 입력을 검사했는지 알기 어렵습니다. 최소한 테스트 이름, 입력, expected result, actual result를 연결할 수 있어야 합니다.","버그를 조사할 때는 실패한 테스트 하나를 최소 재현으로 활용할 수 있습니다. 앱 전체를 실행하지 않고도 같은 문제를 작게 반복할 수 있기 때문입니다.","테스트는 개발 속도를 늦추는 절차가 아니라 수정 후 매번 손으로 같은 확인을 반복하는 시간을 줄이는 장치입니다.","특히 AI가 여러 번 코드를 수정하는 환경에서는 이전 규칙을 자동으로 지켜 주는 안전망 역할을 합니다."]},{"id":"t3-c7-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"배송비 함수의 테스트 표를 완성하세요","paragraphs":["이 실습에서는 테스트 코드 자체보다 ‘어떤 값을 넣으면 무엇이 나와야 하는가’를 먼저 정하는 연습을 합니다.","49999, 50000, 50001은 무료배송 기준의 바로 아래·정확한 기준·바로 위를 확인하는 세 값입니다. -1은 잘못된 입력 처리까지 확인합니다.","규칙은 ‘0원 미만은 None, 0원 이상 50000원 미만은 3000원, 50000원 이상은 0원’입니다.","아래 assert 네 줄의 기대값을 채우세요. 경계 바로 아래, 경계값, 경계 바로 위, 잘못된 입력을 모두 포함합니다.","코드를 실행하기 전에 표로 기대값을 먼저 적어 보세요."],"practicePrompt":"빈칸 네 곳에 올바른 기대값을 넣으세요.","code":"def shipping_fee(total):\n    if total \u003c 0:\n        return None\n    if total >= 50000:\n        return 0\n    return 3000\n\nassert shipping_fee(49999) == ______\nassert shipping_fee(50000) == ______\nassert shipping_fee(50001) == ______\nassert shipping_fee(-1) is ______","answerOnNext":true},{"id":"t3-c7-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"배송비 함수의 테스트 표를 완성하세요 · 풀이","paragraphs":["풀이에서는 규칙 문장을 그대로 값으로 옮기면 됩니다. 50000 미만은 3000, 50000 이상은 0, 음수는 None이라는 세 규칙을 네 입력에 적용합니다.","49999는 무료배송 기준 바로 아래이므로 3000입니다. 50000은 ‘이상’에 포함되므로 0이고 50001도 0입니다.","-1은 허용되지 않는 입력이므로 함수 계약에 따라 None을 반환합니다.","이 네 개만으로도 조건 경계와 잘못된 입력 처리까지 동시에 확인할 수 있습니다."],"code":"assert shipping_fee(49999) == 3000\nassert shipping_fee(50000) == 0\nassert shipping_fee(50001) == 0\nassert shipping_fee(-1) is None","codeNote":"네 테스트가 모두 PASS여야 합니다."},{"id":"t3-c7-check","kind":"check","eyebrow":"확인 문제","title":"테스트의 역할을 확인합니다","paragraphs":["이 확인 문제는 테스트를 한 번 쓰고 버리는 것이 아니라 과거 실수를 다시 막는 안전장치로 이해했는지 확인합니다.","테스트는 ‘오류가 절대 없다’는 보증이 아닙니다. 우리가 선택한 입력과 규칙에 대해 현재 코드가 기대대로 동작한다는 증거입니다.","다음 질문에 경계값과 회귀라는 두 개념을 연결해 답해 보세요."],"question":"50000원 경계에서 한 번 버그가 났다면, 수정 후에도 total=50000 테스트를 계속 남겨 두는 이유는 무엇일까요?","answerOnNext":true},{"id":"t3-c7-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"테스트의 역할을 확인합니다 · 풀이","paragraphs":["풀이에서는 규칙 문장을 그대로 값으로 옮기면 됩니다. 50000 미만은 3000, 50000 이상은 0, 음수는 None이라는 세 규칙을 네 입력에 적용합니다.","50000은 조건이 바뀌는 boundary value라서 >=와 > 차이를 직접 드러냅니다.","과거에 실패했던 이 테스트를 남겨 두면 나중 수정으로 같은 문제가 다시 생기는 regression을 즉시 발견할 수 있습니다."]},{"id":"t3-c7-summary","kind":"summary","eyebrow":"Chapter 7 정리","title":"테스트는 기억 대신 규칙을 코드에 남기는 방법입니다","paragraphs":["테스트는 코드를 믿지 못해서 하는 일이 아니라 우리가 원하는 규칙을 컴퓨터가 계속 확인하게 만드는 방법입니다. 중요한 경계값과 과거 버그를 테스트로 남겨 두면 수정할 때마다 다시 확인할 수 있습니다.","테스트 케이스는 입력과 expected result를 구체적으로 묶습니다. actual result와 비교하면 기능이 맞는지 객관적으로 판단할 수 있습니다.","정상 경로뿐 아니라 boundary value, edge case, negative test를 함께 넣고, 과거 버그 입력은 회귀 방지 테스트로 남깁니다.","다음 챕터에서는 지금까지의 문제 분해·추적·함수화·디버깅·테스트를 AI와 협업하는 한 흐름으로 묶습니다. AI가 코드를 빨리 만들더라도 사람이 목표와 검증 기준을 통제하는 방식입니다."],"bullets":["테스트 전에 기대 결과를 먼저 적는다.","정상값 + 경계 아래 + 경계값 + 경계 위 + 잘못된 입력부터 시작한다.","unit test는 작은 단위, integration test는 연결을 본다.","과거 버그 입력을 남겨 regression을 막는다."]}]},{"id":"t3-c8","track":3,"chapter":8,"title":"AI와 함께 문제를 설계·수정·검증하기","remember":"AI에게 목표·문맥·제약·완료 기준을 주고, 작은 변경을 diff와 테스트 증거로 확인한 뒤 다음 단계로 간다","practiceGoal":"모호한 요청을 검증 가능한 작업 지시로 바꾸고 AI가 만든 변경을 diff·테스트·롤백 기준으로 검토한다","pages":[{"id":"t3-c8-g1","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 1/5","title":"AI와 협업할 때 가장 먼저 쓰는 단어","paragraphs":["AI에게 코딩을 맡긴다고 해서 문제 해결 과정이 사라지는 것은 아닙니다. 오히려 사람이 무엇을 원하는지, 무엇을 바꾸면 안 되는지, 무엇으로 완료를 판단할지 더 분명하게 정해야 합니다.","먼저 model, prompt, context, constraint 네 단어를 구분하면 ‘왜 AI가 엉뚱하게 고쳤지?’를 구조적으로 설명할 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"AI model AI 모델","description":"AI 모델은 사용자가 준 글과 코드, 문맥을 보고 다음 답이나 코드를 만들어 내는 시스템입니다. 사람처럼 프로젝트 전체를 저절로 아는 것이 아니라, 현재 전달받은 정보 안에서 판단합니다.","usage":"어떤 AI가 작업을 수행하는 주체인지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 코드 수정 요청을 AI model에 전달합니다."},{"term":"prompt 지시문","description":"지시문은 AI에게 무엇을 해 달라고 적는 글입니다. 단순히 ‘고쳐줘’라고 하기보다 무엇을 바꾸고 무엇은 건드리지 말아야 하는지 적을수록 결과가 안정적입니다.","usage":"목표·범위·출력 형식을 알려 줄 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘이 함수만 수정하고 기존 API 형식은 유지해.’"},{"term":"context 문맥","description":"문맥은 AI가 지금 작업을 이해하는 데 필요한 배경 자료입니다. 현재 코드, 오류 메시지, 이전 결정, 사용 중인 버전처럼 ‘이 상황이 어떤 상황인지’를 알려 주는 정보입니다.","usage":"AI가 추측하지 않고 실제 상황을 기준으로 작업하게 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 현재 함수 코드와 실패한 테스트를 함께 줍니다."},{"term":"constraint 제약조건","description":"제약조건은 작업 중 반드시 지켜야 하는 제한입니다. ‘DB 구조는 바꾸지 말 것’, ‘무료 기능만 사용할 것’처럼 AI가 마음대로 넘으면 안 되는 선입니다.","usage":"기존 기능·파일·비용·환경을 보호할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘데이터 형식과 로그인 흐름은 변경하지 말 것.’"}]},{"id":"t3-c8-g2","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 2/5","title":"무엇을 만들지 명확히 할 때 쓰는 단어","paragraphs":["‘좋게 고쳐줘’처럼 평가 기준이 없는 요청은 AI가 임의로 해석할 여지가 큽니다. 사람이 원하는 동작을 문장과 테스트 수준으로 구체화해야 합니다.","명세와 완료 기준은 AI에게만 필요한 것이 아니라, 작업이 끝났는지 사람이 판단하기 위한 기준입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"specification 명세","description":"명세는 기능이 정확히 어떻게 동작해야 하는지를 적은 설명입니다. 사람과 AI가 같은 목표를 보고 작업하도록 만드는 기준 문서라고 생각하면 됩니다.","usage":"구현 전에 목표 동작을 고정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘50000원 이상이면 배송비 0, 미만이면 3000.’"},{"term":"acceptance criteria 완료 기준","description":"완료 기준은 ‘어떤 상태가 되면 이 작업이 끝난 것으로 인정할 것인가’를 구체적으로 적은 조건입니다. 예를 들어 특정 테스트 3개 통과처럼 확인 가능한 형태가 좋습니다.","usage":"AI의 ‘완료했습니다’라는 말과 실제 완료를 구분할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘49999/50000/50001 테스트가 모두 통과한다.’"},{"term":"scope 작업 범위","description":"작업 범위는 이번에 손댈 영역입니다. ‘이 함수와 테스트 파일만 수정’처럼 경계를 정하면 AI가 관련 없는 곳까지 크게 바꾸는 일을 줄일 수 있습니다.","usage":"AI가 관련 없는 파일까지 크게 바꾸는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘shipping.py와 해당 테스트만 수정.’"},{"term":"non-goal 비목표","description":"비목표는 이번 작업에서는 일부러 하지 않을 일입니다. ‘UI 재설계는 하지 않음’처럼 좋은 아이디어라도 지금 범위 밖인 것을 분명히 적습니다.","usage":"좋아 보이지만 불필요한 추가 기능이 섞이는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘UI 재설계와 DB 변경은 이번 작업의 non-goal.’"}]},{"id":"t3-c8-g3","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 3/5","title":"AI가 만든 변경을 확인할 때 쓰는 단어","paragraphs":["AI가 코드를 생성했다고 해서 바로 전체 파일을 믿을 필요는 없습니다. 무엇이 바뀌었는지 차이부터 보고, 그 차이가 요청 범위와 맞는지 확인합니다.","작은 변경 단위로 보면 실수도 찾기 쉽고 되돌리기도 쉽습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"patch 변경 묶음","description":"patch는 하나의 목적을 위해 묶은 코드 변경입니다. 너무 큰 patch보다 한 문제를 해결하는 작은 patch가 검토하고 되돌리기 쉽습니다.","usage":"수정 범위를 작게 나눠 검토할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 조건 한 줄과 테스트 두 줄을 하나의 patch로 볼 수 있습니다."},{"term":"diff 변경 비교","description":"diff는 수정 전과 수정 후의 차이만 보여 주는 화면이나 정보입니다. 전체 코드 수천 줄 대신 실제로 바뀐 몇 줄을 빠르게 확인할 수 있습니다.","usage":"AI가 실제로 무엇을 추가·삭제·수정했는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: >가 >=로 바뀐 한 줄을 diff에서 확인합니다."},{"term":"review 검토","description":"검토는 AI가 만든 변경을 사람이 확인하는 과정입니다. 요청한 부분만 바뀌었는지, 이상한 삭제는 없는지, 테스트가 충분한지 살펴봅니다.","usage":"AI 생성 코드를 적용하기 전에 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: diff와 테스트 결과를 보고 불필요한 파일 변경이 없는지 확인합니다."},{"term":"evidence 증거","description":"증거는 작업이 실제로 성공했다는 것을 보여 주는 자료입니다. 테스트 PASS 로그, 실제 화면, 생성된 파일처럼 말이 아니라 확인 가능한 결과를 뜻합니다.","usage":"설명만으로 완료를 믿지 않고 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: PASS한 테스트 로그가 evidence입니다."}]},{"id":"t3-c8-g4","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 4/5","title":"틀렸을 때 안전하게 돌아가기 위한 단어","paragraphs":["AI는 빠르게 많은 코드를 바꿀 수 있기 때문에 실패했을 때 원래 상태로 돌아갈 수 있는 장치가 중요합니다.","작업 전 상태와 수정 단위를 남기면 ‘망가지면 어떡하지?’ 대신 실제로 되돌릴 수 있는 절차를 가질 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"version control 버전 관리","description":"버전 관리는 파일이 언제 어떻게 바뀌었는지 기록하고 필요하면 이전 상태로 돌아갈 수 있게 하는 방식입니다. Git이 대표적인 도구입니다.","usage":"AI 수정 전후를 안전하게 비교·복원할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: Git으로 변경 이력을 남깁니다."},{"term":"checkpoint 체크포인트","description":"체크포인트는 ‘여기까지는 안전하다’고 확인한 중간 저장점입니다. 큰 작업을 하다가 다음 단계가 실패해도 이 지점으로 돌아올 수 있습니다.","usage":"큰 작업을 여러 단계로 나눠 진행할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 테스트가 모두 통과한 커밋을 checkpoint로 삼습니다."},{"term":"rollback 되돌리기","description":"되돌리기는 새 변경이 문제를 만들었을 때 이전의 정상 상태로 돌아가는 것입니다. 수정하기 전에 안전한 버전을 남겨 두는 이유입니다.","usage":"새 수정이 더 큰 문제를 만들었을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실패한 patch를 취소하고 직전 checkpoint로 돌아갑니다."},{"term":"handoff 인계","description":"인계는 다른 사람이나 다른 AI가 바로 이어서 일할 수 있도록 현재 상태를 정리해 넘기는 것입니다. 완료한 것, 남은 것, 정본 파일, 실패한 테스트를 남기면 좋습니다.","usage":"긴 작업을 끊었다가 다시 시작할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 수정한 파일, 실패 테스트, 다음 단계까지 적습니다."}]},{"id":"t3-c8-g5","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 5/5","title":"AI의 답을 믿기 전에 알아둘 단어","paragraphs":["AI는 그럴듯한 설명을 만들 수 있지만 실제 파일을 읽지 않았거나 테스트를 실행하지 않은 상태에서도 자신 있게 말할 수 있습니다.","그래서 AI와 협업할 때는 ‘무엇을 했
