 수정 하나를 적용합니다.","다음 챕터에서는 이 과정을 반복 가능한 테스트로 남깁니다. 사람이 매번 기억해서 확인하지 않아도 같은 규칙을 자동으로 검증할 수 있게 만드는 단계입니다."],"bullets":["증상과 root cause를 분리한다.","수정 전에 재현 절차와 입력을 고정한다.","오류 메시지는 맨 아래 예외 이름과 내 코드 줄부터 읽는다.","한 번에 한 가설만 검증하고 수정 후 같은 절차로 다시 확인한다."]}]},{"id":"t3-c7","track":3,"chapter":7,"title":"테스트와 경계값으로 검증하기","remember":"기대 결과를 먼저 적고 정상·경계·잘못된 입력을 테스트해 수정이 기존 동작을 깨지 않았는지 확인한다","practiceGoal":"테스트 케이스 표와 assert를 이용해 함수의 정상 경로·경계값·오류 입력을 검증한다","pages":[{"id":"t3-c7-g1","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 1/4","title":"테스트를 시작할 때 쓰는 단어","paragraphs":["테스트는 코드를 의심한다는 뜻이 아니라, 우리가 기대하는 동작을 구체적인 입력과 결과로 적어 두는 일입니다.","‘잘 됩니다’라는 문장을 여러 개의 테스트 케이스로 바꾸면 무엇이 맞아야 완료인지 분명해집니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"test 테스트","description":"테스트는 프로그램이 우리가 정한 규칙대로 움직이는지 실제로 확인하는 일입니다. ‘아마 맞겠지’ 대신 입력을 넣고 결과를 비교합니다.","usage":"기능 완료와 수정 안전성을 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 주문의 배송비가 0인지 확인합니다."},{"term":"test case 테스트 케이스","description":"테스트 케이스는 하나의 검사 상황입니다. 어떤 값을 넣을지와 무엇이 나와야 하는지를 한 세트로 적습니다.","usage":"서로 다른 상황을 빠짐없이 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total=49999 → fee=3000."},{"term":"expected result 기대 결과","description":"기대 결과는 코드를 실행하기 전에 ‘규칙대로라면 이 결과가 나와야 한다’고 정한 값입니다. 실제 결과와 비교할 기준이 됩니다.","usage":"실제 결과와 비교할 기준으로 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 이상이면 기대 배송비는 0원입니다."},{"term":"actual result 실제 결과","description":"실제 결과는 코드를 정말 실행해서 나온 값입니다. 기대 결과와 같으면 그 테스트는 통과하고, 다르면 문제가 있는지 조사합니다.","usage":"기대 결과와 비교해 PASS/FAIL을 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 함수가 실제로 3000을 반환했다면 기대값 0과 다릅니다."}]},{"id":"t3-c7-g2","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 2/4","title":"경계와 특수 상황을 검사할 때 쓰는 단어","paragraphs":["평범한 값 하나만 통과하면 규칙이 정확하다고 말하기 어렵습니다. 조건이 바뀌는 바로 주변에서 오류가 잘 드러납니다.","특히 >=와 >처럼 한 글자 차이 문법은 경계값을 넣었을 때만 차이가 보일 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"boundary value 경계값","description":"경계값은 규칙이 바뀌는 정확한 기준 숫자입니다. 50000원부터 무료배송이라면 50000이 경계값입니다.","usage":"비교 연산의 포함·제외가 맞는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 무료배송 기준이 50000원이면 50000이 boundary value입니다."},{"term":"edge case 경계·특수 경우","description":"특수 경우는 평범한 값과 달라서 오류가 잘 숨어 있는 상황입니다. 빈 리스트, 0개, 최대값, 최소값처럼 자주 놓치는 경우를 뜻합니다.","usage":"일반 테스트가 놓치는 문제를 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 빈 리스트, 0개 주문."},{"term":"happy path 정상 경로","description":"정상 경로는 사용자가 올바른 값을 넣고 모든 일이 예상대로 진행되는 가장 기본적인 상황입니다.","usage":"기능의 기본 동작부터 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 정상 가격과 정상 쿠폰으로 결제 성공."},{"term":"negative test 잘못된 입력 테스트","description":"잘못된 입력 테스트는 일부러 틀린 값을 넣어 프로그램이 안전하게 거부하는지 보는 테스트입니다. 예를 들어 나이에 -5를 넣어 보는 식입니다.","usage":"오류 처리와 검증 로직을 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 가격 -1을 넣으면 오류 처리되는지 확인합니다."}]},{"id":"t3-c7-g3","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 3/4","title":"코드로 결과를 확인할 때 쓰는 단어","paragraphs":["테스트를 사람이 눈으로만 확인할 수도 있지만, 기대값과 실제값을 코드가 직접 비교하게 만들면 반복 검증이 쉬워집니다.","Python의 assert는 가장 단순한 자동 확인 도구 중 하나입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"assertion 검증식","description":"검증식은 ‘이 조건은 반드시 맞아야 한다’고 코드에 적어 두는 확인 문장입니다. 실제 결과가 다르면 즉시 실패를 알려 줍니다.","usage":"기대 결과와 실제 결과가 같은지 자동으로 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: assert shipping_fee(50000) == 0."},{"term":"assert","description":"assert는 뒤의 조건이 True인지 확인하는 Python 문법입니다. False이면 AssertionError를 내서 기대와 실제가 다르다는 사실을 알려 줍니다.","usage":"작은 함수나 학습 예제의 기대값을 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: assert add(2, 3) == 5."},{"term":"PASS 통과","description":"PASS는 실제 결과가 기대 결과와 같아서 해당 검사가 성공했다는 뜻입니다.","usage":"검증 결과를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 49999원 배송비 3000원 → PASS."},{"term":"FAIL 실패","description":"FAIL은 실제 결과가 기대 결과와 달라 해당 검사가 실패했다는 뜻입니다. 실패했다고 무조건 코드가 틀렸다는 뜻은 아니고, 테스트 기대값이 잘못됐을 가능성도 확인해야 합니다.","usage":"어떤 규칙이 깨졌는지 찾기 시작할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 50000원 배송비가 3000원 → FAIL."}]},{"id":"t3-c7-g4","kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 4/4","title":"테스트의 범위와 재발 방지에 쓰는 단어","paragraphs":["테스트는 크기에 따라 목적이 다릅니다. 작은 함수 하나를 따로 확인할 수도 있고, 여러 부분을 연결한 전체 흐름을 확인할 수도 있습니다.","버그를 한 번 고쳤다면 같은 문제가 다시 생기지 않게 테스트로 남기는 것이 중요합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"unit test 단위 테스트","description":"단위 테스트는 작은 부품 하나만 따로 검사하는 테스트입니다. 예를 들어 앱 전체가 아니라 shipping_fee 함수만 여러 금액으로 확인합니다.","usage":"계산 로직처럼 입력과 출력이 분명한 코드를 빠르게 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: shipping_fee 함수만 여러 금액으로 검사합니다."},{"term":"integration test 통합 테스트","description":"통합 테스트는 여러 부품을 실제로 연결했을 때 잘 맞물리는지 확인하는 테스트입니다. 계산 함수가 맞아도 DB나 화면 연결에서 문제가 날 수 있기 때문입니다.","usage":"함수끼리 연결하거나 API·DB·화면이 이어지는 흐름을 검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 주문 계산 → 저장 → 화면 표시까지 연결해 확인합니다."},{"term":"regression 회귀","description":"회귀는 새로 고친 뒤 예전에 잘 되던 기능이 다시 망가지는 것입니다. 그래서 수정 뒤에는 새 문제뿐 아니라 기존 기능도 다시 테스트합니다.","usage":"버그 수정이나 기능 추가 뒤 기존 기능을 재검사할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 쿠폰 수정 후 무료배송 조건이 깨지는 경우."},{"term":"test suite 테스트 묶음","description":"테스트 묶음은 여러 테스트 케이스를 한꺼번에 실행할 수 있도록 모아 둔 것입니다. 버튼 한 번으로 여러 규칙을 다시 확인할 수 있습니다.","usage":"기능 전체의 규칙을 한 번에 다시 검증할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 정상·경계·음수 입력 테스트를 한 묶음으로 둡니다."}]},{"id":"t3-c7-slow-start","kind":"concept","eyebrow":"CHAPTER 07 · 아주 천천히 시작하기","title":"테스트는 ‘이 값을 넣으면 이 값이 나와야 한다’를 적는 것입니다","paragraphs":["테스트라는 말을 들으면 복잡한 개발 도구를 떠올릴 수 있지만, 가장 기본적인 테스트는 아주 단순합니다. 입력 하나와 정답 하나를 미리 정하고 실제 결과와 비교하는 것입니다.","예를 들어 배송비 규칙이 ‘50000원 이상은 무료’라면 total=50000을 넣었을 때 정답은 0원입니다. 프로그램이 실제로 0을 내놓으면 이 테스트는 통과합니다. 3000을 내놓으면 실패합니다.","테스트를 여러 개 만드는 이유는 상황마다 규칙이 다를 수 있기 때문입니다. 49999, 50000, 50001처럼 경계 주변을 따로 보면 비교 연산자가 맞는지 알 수 있습니다.","즉 테스트는 어려운 별도 기술이라기보다 ‘내가 원하는 결과를 미리 숫자로 적어 두고 컴퓨터에게 계속 확인시키는 방법’입니다."]},{"id":"t3-c7-p1","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트는 코드를 쓴 뒤가 아니라 규칙을 정할 때부터 시작할 수 있습니다","paragraphs":["테스트는 코드를 다 만든 뒤 마지막에 하는 시험이라고만 생각할 필요가 없습니다. 코드를 쓰기 전에도 ‘어떤 입력에서 어떤 결과가 나와야 하지?’를 적을 수 있습니다.","무료배송 규칙이 50000원 이상이라면 코드를 보기 전에 49999→3000, 50000→0, 50001→0이라고 적을 수 있습니다. 이것이 이미 테스트 케이스의 뼈대입니다.","그 뒤 코드를 실행해서 실제 결과와 비교합니다. 기대한 값과 같으면 통과, 다르면 어느 쪽이 잘못됐는지 확인합니다.","함수를 만들기 전에도 테스트 케이스를 적을 수 있습니다. 오히려 기대 결과를 먼저 쓰면 요구사항의 모호함이 드러납니다.","‘50000원 이상 무료배송’이라는 문장이 있다면 49999→3000, 50000→0, 50001→0처럼 표를 만들 수 있습니다. 이 표는 아직 코드가 없어도 만들 수 있습니다.","그다음 코드를 작성하고 actual result를 표 옆에 적습니다. 기대와 실제가 다르면 FAIL이고 조사 대상이 됩니다.","이 습관은 AI에게 코드를 맡길 때 특히 유용합니다. ‘이 테스트들을 모두 통과해야 한다’고 명시하면 완료 기준이 훨씬 객관적이 됩니다."]},{"id":"t3-c7-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"좋은 테스트는 정상·경계·잘못된 입력을 함께 봅니다","paragraphs":["테스트를 하나만 한다면 보통 가장 평범한 정상 상황을 먼저 보게 됩니다. 하지만 버그는 규칙이 바뀌는 경계나 이상한 입력에서 잘 숨어 있습니다.","그래서 80000원처럼 확실히 무료배송인 값 하나만 보지 말고 49999, 50000, 50001을 봅니다. 여기에 -1 같은 잘못된 값도 넣어 봅니다.","이렇게 몇 개만 골라도 ‘정상일 때’, ‘딱 경계일 때’, ‘잘못된 값일 때’를 모두 볼 수 있어 테스트 효율이 높아집니다.","정상 입력 하나만 테스트하면 가장 쉬운 길만 확인한 것입니다. 규칙이 바뀌는 지점과 허용되지 않는 값도 함께 넣어야 합니다.","한 기능에 필요한 모든 경우를 무한히 만들 수는 없지만, 위험이 큰 지점을 우선하면 적은 테스트로 많은 오류를 잡을 수 있습니다.","초보 단계에서는 ‘정상 1개 + 경계 아래 + 경계값 + 경계 위 + 잘못된 입력 1개’부터 시작하세요."],"visual":"TEST_MATRIX","bullets":["정상값: 대표적인 올바른 입력","경계 바로 아래","경계값 자체","경계 바로 위","잘못된 입력 또는 빈 값"]},{"id":"t3-c7-example1","kind":"example","eyebrow":"예제로 연결하기","title":"assert는 기대값과 실제값을 한 줄로 비교합니다","paragraphs":["assert는 아주 간단한 자동 검사입니다. 오른쪽과 왼쪽이 같아야 한다고 적어 두고 실제로 맞는지 Python이 확인합니다.","assert shipping_fee(50000) == 0은 ‘50000을 넣었을 때 결과가 반드시 0이어야 한다’는 뜻입니다.","결과가 0이면 조용히 넘어가고, 3000처럼 다르면 AssertionError가 나옵니다. 사람이 눈으로 숫자를 하나씩 비교하지 않아도 됩니다.","아래 함수는 주문 금액에 따라 배송비를 반환합니다. assert 줄은 함수 반환값이 기대값과 같은지 확인합니다.","모두 맞으면 특별한 출력 없이 지나갑니다. 하나라도 틀리면 AssertionError가 발생해 어느 가정이 깨졌는지 알 수 있습니다.","학습 단계에서는 복잡한 테스트 도구가 없어도 assert만으로 작은 계산 함수를 충분히 검증할 수 있습니다."],"code":"def shipping_fee(total):\n    if total \u003c 0:\n        return None\n    if total >= 50000:\n        return 0\n    return 3000\n\nassert shipping_fee(49999) == 3000\nassert shipping_fee(50000) == 0\nassert shipping_fee(50001) == 0\nassert shipping_fee(-1) is None","codeNote":"네 검증식이 모두 통과하면 현재 규칙 기준으로 PASS입니다.","codeExplain":["1단계: 1~7행: 배송비 규칙을 함수로 정의합니다.","2단계: 9행: 경계 바로 아래를 검사합니다.","3단계: 10행: 경계값 자체가 무료배송에 포함되는지 검사합니다.","4단계: 11행: 경계 바로 위 정상값을 검사합니다.","5단계: 12행: 잘못된 음수 입력이 정해진 방식으로 거부되는지 확인합니다."]},{"id":"t3-c7-p2","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"경계값은 조건문 한 글자 오류를 잡아냅니다","paragraphs":["경계값을 테스트하는 이유는 조건문에서 기호 하나만 달라도 중간값에서는 티가 안 날 수 있기 때문입니다.","total > 50000과 total >= 50000은 80000을 넣으면 둘 다 True입니다. 그래서 80000만 테스트하면 둘의 차이를 못 봅니다.","하지만 50000을 넣으면 첫 번째는 False이고 두 번째는 True입니다. 딱 기준점 자체를 테스트해야 ‘이상’과 ‘초과’ 차이가 드러납니다.","무료배송 조건이 total > 50000으로 잘못 작성돼도 80000 같은 평범한 테스트는 통과합니다. 하지만 정확히 50000을 넣으면 실패합니다.","그래서 조건이 >=인지 >인지, \u003c=인지 \u003c인지 중요한 곳에서는 기준값 자체를 반드시 테스트해야 합니다.","범위에도 같은 원리가 적용됩니다. 나이를 0~120으로 허용한다면 -1, 0, 120, 121을 확인하면 포함·제외 경계를 빠르게 검증할 수 있습니다.","경계값 테스트는 많을수록 좋은 것이 아니라 규칙이 바뀌는 지점을 정확히 찌르는 것이 중요합니다."]},{"id":"t3-c7-p3","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"unit test와 integration test는 서로 다른 질문에 답합니다","paragraphs":["unit test와 integration test의 차이는 검사하는 범위입니다. 작은 부품 하나만 검사하느냐, 여러 부품을 연결해서 검사하느냐의 차이입니다.","shipping_fee 함수만 숫자를 넣어 보는 것은 작은 부품 검사입니다. 함수는 맞아도 실제 앱에서 주문 금액이 잘못 전달된다면 화면에서는 여전히 틀릴 수 있습니다.","그래서 작은 계산은 단위 테스트로 빠르게 확인하고, 중요한 사용 흐름은 통합 테스트로 연결까지 확인합니다.","shipping_fee 함수만 직접 호출해 값이 맞는지 보는 것은 unit test에 가깝습니다. 빠르고 원인 범위를 좁히기 쉽습니다.","하지만 실제 앱에서는 주문 총액이 화면에서 들어오고, 계산되고, 저장되고, 다시 화면에 표시될 수 있습니다. 각 함수가 따로 맞아도 연결 과정에서 문제가 생길 수 있습니다.","그래서 작은 로직은 unit test로 빠르게 확인하고, 중요한 사용자 흐름은 integration test로 연결 상태를 확인합니다.","초보 단계에서 이름을 외우는 것보다 ‘작은 부품만 검사하는가, 여러 부품의 연결을 검사하는가’를 구분할 수 있으면 충분합니다."]},{"id":"t3-c7-example2","kind":"example","eyebrow":"예제로 연결하기","title":"버그를 고쳤다면 그 입력을 테스트로 남깁니다","paragraphs":["버그를 한 번 고쳤다면 그때 문제를 만들었던 정확한 입력을 테스트로 남겨 두는 것이 좋습니다.","50000원에서 한 번 배송비 버그가 났다면 수정 후에도 50000 테스트를 계속 보관합니다. 나중에 누군가 조건을 다시 >로 바꾸면 이 테스트가 바로 실패합니다.","사람이 과거 문제를 기억하지 않아도 테스트가 대신 기억해 주는 셈입니다.","과거에 total=50000에서 배송비가 3000으로 잘못 나오는 버그가 있었다고 해봅시다. 조건을 >=로 수정해 문제를 해결했습니다.","이때 50000 테스트를 삭제하지 말고 계속 남겨 둡니다. 나중에 다른 사람이 조건을 바꾸다가 같은 실수를 다시 만들면 테스트가 즉시 FAIL이 됩니다.","이처럼 과거 버그를 막아 주는 테스트는 회귀 방지 역할을 합니다."],"code":"def shipping_fee(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\n# 과거 버그를 다시 막는 테스트\nassert shipping_fee(50000) == 0","codeNote":"이 테스트가 남아 있으면 경계 조건이 다시 >로 바뀌는 실수를 빠르게 발견할 수 있습니다.","codeExplain":["1단계: 1~4행: 현재 배송비 구현입니다.","2단계: 7행: 과거에 실패했던 정확한 입력을 회귀 테스트로 남깁니다."]},{"id":"t3-c7-p4","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트가 많아도 기대 결과가 틀리면 잘못된 확신을 줄 수 있습니다","paragraphs":["테스트가 많다고 자동으로 안전해지는 것은 아닙니다. 테스트에 적어 둔 기대값 자체가 틀리면 잘못된 코드가 통과할 수도 있습니다.","예를 들어 실제 규칙은 50000원 이상 무료인데 테스트를 실수로 ‘50000→3000’이라고 적었다면, 잘못된 구현이 오히려 PASS할 수 있습니다.","그래서 테스트도 요구사항과 맞는지 검토해야 합니다. 가능하면 구현 코드를 보고 기대값을 정하기보다 원래 요구사항에서 기대값을 먼저 정합니다.","테스트는 코드와 별개의 진실이 아닙니다. 사람이 잘못된 기대값을 적으면 코드가 잘못돼도 테스트가 통과할 수 있습니다.","그래서 중요한 규칙은 요구사항과 테스트 케이스를 함께 읽고, 테스트가 정말 요구사항을 표현하는지 확인해야 합니다.","AI가 테스트를 자동 생성해도 마찬가지입니다. 코드 구현을 그대로 보고 비슷한 테스트를 만들면 구현의 같은 실수를 테스트가 반복할 수 있습니다.","가능하면 요구사항에서 기대 결과를 먼저 만들고, 그다음 구현과 독립적으로 비교하세요."]},{"id":"t3-c7-p5","kind":"concept","eyebrow":"CHAPTER 07 · 핵심 이해","title":"테스트 결과에는 ‘무엇을 확인했는지’가 남아야 합니다","paragraphs":["테스트 결과에 PASS 하나만 남아 있으면 나중에 무엇을 확인했는지 알기 어렵습니다. 어떤 기능, 어떤 입력, 어떤 기대값을 검사했는지 연결돼 있어야 합니다.","예를 들어 ‘배송비 경계 테스트: 50000 입력, 기대 0, 실제 0, PASS’처럼 남아 있으면 실패했을 때 바로 상황을 재현할 수 있습니다.","테스트는 단순히 점수를 매기는 것이 아니라 다음 디버깅을 쉽게 만드는 기록이기도 합니다.","PASS라는 글자 하나만 남기면 어떤 입력을 검사했는지 알기 어렵습니다. 최소한 테스트 이름, 입력, expected result, actual result를 연결할 수 있어야 합니다.","버그를 조사할 때는 실패한 테스트 하나를 최소 재현으로 활용할 수 있습니다. 앱 전체를 실행하지 않고도 같은 문제를 작게 반복할 수 있기 때문입니다.","테스트는 개발 속도를 늦추는 절차가 아니라 수정 후 매번 손으로 같은 확인을 반복하는 시간을 줄이는 장치입니다.","특히 AI가 여러 번 코드를 수정하는 환경에서는 이전 규칙을 자동으로 지켜 주는 안전망 역할을 합니다."]},{"id":"t3-c7-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"배송비 함수의 테스트 표를 완성하세요","paragraphs":["이 실습에서는 테스트 코드 자체보다 ‘어떤 값을 넣으면 무엇이 나와야 하는가’를 먼저 정하는 연습을 합니다.","49999, 50000, 50001은 무료배송 기준의 바로 아래·정확한 기준·바로 위를 확인하는 세 값입니다. -1은 잘못된 입력 처리까지 확인합니다.","규칙은 ‘0원 미만은 None, 0원 이상 50000원 미만은 3000원, 50000원 이상은 0원’입니다.","아래 assert 네 줄의 기대값을 채우세요. 경계 바로 아래, 경계값, 경계 바로 위, 잘못된 입력을 모두 포함합니다.","코드를 실행하기 전에 표로 기대값을 먼저 적어 보세요."],"practicePrompt":"빈칸 네 곳에 올바른 기대값을 넣으세요.","code":"def shipping_fee(total):\n    if total \u003c 0:\n        return None\n    if total >= 50000:\n        return 0\n    return 3000\n\nassert shipping_fee(49999) == ______\nassert shipping_fee(50000) == ______\nassert shipping_fee(50001) == ______\nassert shipping_fee(-1) is ______","answerOnNext":true},{"id":"t3-c7-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"배송비 함수의 테스트 표를 완성하세요 · 풀이","paragraphs":["풀이에서는 규칙 문장을 그대로 값으로 옮기면 됩니다. 50000 미만은 3000, 50000 이상은 0, 음수는 None이라는 세 규칙을 네 입력에 적용합니다.","49999는 무료배송 기준 바로 아래이므로 3000입니다. 50000은 ‘이상’에 포함되므로 0이고 50001도 0입니다.","-1은 허용되지 않는 입력이므로 함수 계약에 따라 None을 반환합니다.","이 네 개만으로도 조건 경계와 잘못된 입력 처리까지 동시에 확인할 수 있습니다."],"code":"assert shipping_fee(49999) == 3000\nassert shipping_fee(50000) == 0\nassert shipping_fee(50001) == 0\nassert shipping_fee(-1) is None","codeNote":"네 테스트가 모두 PASS여야 합니다."},{"id":"t3-c7-check","kind":"check","eyebrow":"확인 문제","title":"테스트의 역할을 확인합니다","paragraphs":["이 확인 문제는 테스트를 한 번 쓰고 버리는 것이 아니라 과거 실수를 다시 막는 안전장치로 이해했는지 확인합니다.","테스트는 ‘오류가 절대 없다’는 보증이 아닙니다. 우리가 선택한 입력과 규칙에 대해 현재 코드가 기대대로 동작한다는 증거입니다.","다음 질문에 경계값과 회귀라는 두 개념을 연결해 답해 보세요."],"question":"50000원 경계에서 한 번 버그가 났다면, 수정 후에도 total=50000 테스트를 계속 남겨 두는 이유는 무엇일까요?","answerOnNext":true},{"id":"t3-c7-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"테스트의 역할을 확인합니다 · 풀이","paragraphs":["풀이에서는 규칙 문장을 그대로 값으로 옮기면 됩니다. 50000 미만은 3000, 50000 이상은 0, 음수는 None이라는 세 규칙을 네 입력에 적용합니다.","50000은 조건이 바뀌는 boundary value라서 >=와 > 차이를 직접 드러냅니다.","과거에 실패했던 이 테스트를 남겨 두면 나중 수정으로 같은 문제가 다시 생기는 regression을 즉시 발견할 수 있습니다."]},{"id":"t3-c7-summary","kind":"summary","eyebrow":"Chapter 7 정리","title":"테스트는 기억 대신 규칙을 코드에 남기는 방법입니다","paragraphs":["테스트는 코드를 믿지 못해서 하는 일이 아니라 우리가 원하는 규칙을 컴퓨터가 계속 확인하게 만드는 방법입니다. 중요한 경계값과 과거 버그를 테스트로 남겨 두면 수정할 때마다 다시 확인할 수 있습니다.","테스트 케이스는 입력과 expected result를 구체적으로 묶습니다. actual result와 비교하면 기능이 맞는지 객관적으로 판단할 수 있습니다.","정상 경로뿐 아니라 boundary value, edge case, negative test를 함께 넣고, 과거 버그 입력은 회귀 방지 테스트로 남깁니다.","다음 챕터에서는 지금까지의 문제 분해·추적·함수화·디버깅·테스트를 AI와 협업하는 한 흐름으로 묶습니다. AI가 코드를 빨리 만들더라도 사람이 목표와 검증 기준을 통제하는 방식입니다."],"bullets":["테스트 전에 기대 결과를 먼저 적는다.","정상값 + 경계 아래 + 경계값 + 경계 위 + 잘못된 입력부터 시작한다.","unit test는 작은 단위, integration test는 연결을 본다.","과거 버그 입력을 남겨 regression을 막는다."]}]},{"id":"t3-c8","track":3,"chapter":8,"title":"AI와 함께 문제를 설계·수정·검증하기","remember":"AI에게 목표·문맥·제약·완료 기준을 주고, 작은 변경을 diff와 테스트 증거로 확인한 뒤 다음 단계로 간다","practiceGoal":"모호한 요청을 검증 가능한 작업 지시로 바꾸고 AI가 만든 변경을 diff·테스트·롤백 기준으로 검토한다","pages":[{"id":"t3-c8-g1","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 1/5","title":"AI와 협업할 때 가장 먼저 쓰는 단어","paragraphs":["AI에게 코딩을 맡긴다고 해서 문제 해결 과정이 사라지는 것은 아닙니다. 오히려 사람이 무엇을 원하는지, 무엇을 바꾸면 안 되는지, 무엇으로 완료를 판단할지 더 분명하게 정해야 합니다.","먼저 model, prompt, context, constraint 네 단어를 구분하면 ‘왜 AI가 엉뚱하게 고쳤지?’를 구조적으로 설명할 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"AI model AI 모델","description":"AI 모델은 사용자가 준 글과 코드, 문맥을 보고 다음 답이나 코드를 만들어 내는 시스템입니다. 사람처럼 프로젝트 전체를 저절로 아는 것이 아니라, 현재 전달받은 정보 안에서 판단합니다.","usage":"어떤 AI가 작업을 수행하는 주체인지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 코드 수정 요청을 AI model에 전달합니다."},{"term":"prompt 지시문","description":"지시문은 AI에게 무엇을 해 달라고 적는 글입니다. 단순히 ‘고쳐줘’라고 하기보다 무엇을 바꾸고 무엇은 건드리지 말아야 하는지 적을수록 결과가 안정적입니다.","usage":"목표·범위·출력 형식을 알려 줄 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘이 함수만 수정하고 기존 API 형식은 유지해.’"},{"term":"context 문맥","description":"문맥은 AI가 지금 작업을 이해하는 데 필요한 배경 자료입니다. 현재 코드, 오류 메시지, 이전 결정, 사용 중인 버전처럼 ‘이 상황이 어떤 상황인지’를 알려 주는 정보입니다.","usage":"AI가 추측하지 않고 실제 상황을 기준으로 작업하게 할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 현재 함수 코드와 실패한 테스트를 함께 줍니다."},{"term":"constraint 제약조건","description":"제약조건은 작업 중 반드시 지켜야 하는 제한입니다. ‘DB 구조는 바꾸지 말 것’, ‘무료 기능만 사용할 것’처럼 AI가 마음대로 넘으면 안 되는 선입니다.","usage":"기존 기능·파일·비용·환경을 보호할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘데이터 형식과 로그인 흐름은 변경하지 말 것.’"}]},{"id":"t3-c8-g2","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 2/5","title":"무엇을 만들지 명확히 할 때 쓰는 단어","paragraphs":["‘좋게 고쳐줘’처럼 평가 기준이 없는 요청은 AI가 임의로 해석할 여지가 큽니다. 사람이 원하는 동작을 문장과 테스트 수준으로 구체화해야 합니다.","명세와 완료 기준은 AI에게만 필요한 것이 아니라, 작업이 끝났는지 사람이 판단하기 위한 기준입니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"specification 명세","description":"명세는 기능이 정확히 어떻게 동작해야 하는지를 적은 설명입니다. 사람과 AI가 같은 목표를 보고 작업하도록 만드는 기준 문서라고 생각하면 됩니다.","usage":"구현 전에 목표 동작을 고정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘50000원 이상이면 배송비 0, 미만이면 3000.’"},{"term":"acceptance criteria 완료 기준","description":"완료 기준은 ‘어떤 상태가 되면 이 작업이 끝난 것으로 인정할 것인가’를 구체적으로 적은 조건입니다. 예를 들어 특정 테스트 3개 통과처럼 확인 가능한 형태가 좋습니다.","usage":"AI의 ‘완료했습니다’라는 말과 실제 완료를 구분할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘49999/50000/50001 테스트가 모두 통과한다.’"},{"term":"scope 작업 범위","description":"작업 범위는 이번에 손댈 영역입니다. ‘이 함수와 테스트 파일만 수정’처럼 경계를 정하면 AI가 관련 없는 곳까지 크게 바꾸는 일을 줄일 수 있습니다.","usage":"AI가 관련 없는 파일까지 크게 바꾸는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘shipping.py와 해당 테스트만 수정.’"},{"term":"non-goal 비목표","description":"비목표는 이번 작업에서는 일부러 하지 않을 일입니다. ‘UI 재설계는 하지 않음’처럼 좋은 아이디어라도 지금 범위 밖인 것을 분명히 적습니다.","usage":"좋아 보이지만 불필요한 추가 기능이 섞이는 것을 막을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: ‘UI 재설계와 DB 변경은 이번 작업의 non-goal.’"}]},{"id":"t3-c8-g3","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 3/5","title":"AI가 만든 변경을 확인할 때 쓰는 단어","paragraphs":["AI가 코드를 생성했다고 해서 바로 전체 파일을 믿을 필요는 없습니다. 무엇이 바뀌었는지 차이부터 보고, 그 차이가 요청 범위와 맞는지 확인합니다.","작은 변경 단위로 보면 실수도 찾기 쉽고 되돌리기도 쉽습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"patch 변경 묶음","description":"patch는 하나의 목적을 위해 묶은 코드 변경입니다. 너무 큰 patch보다 한 문제를 해결하는 작은 patch가 검토하고 되돌리기 쉽습니다.","usage":"수정 범위를 작게 나눠 검토할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 조건 한 줄과 테스트 두 줄을 하나의 patch로 볼 수 있습니다."},{"term":"diff 변경 비교","description":"diff는 수정 전과 수정 후의 차이만 보여 주는 화면이나 정보입니다. 전체 코드 수천 줄 대신 실제로 바뀐 몇 줄을 빠르게 확인할 수 있습니다.","usage":"AI가 실제로 무엇을 추가·삭제·수정했는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: >가 >=로 바뀐 한 줄을 diff에서 확인합니다."},{"term":"review 검토","description":"검토는 AI가 만든 변경을 사람이 확인하는 과정입니다. 요청한 부분만 바뀌었는지, 이상한 삭제는 없는지, 테스트가 충분한지 살펴봅니다.","usage":"AI 생성 코드를 적용하기 전에 판단할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: diff와 테스트 결과를 보고 불필요한 파일 변경이 없는지 확인합니다."},{"term":"evidence 증거","description":"증거는 작업이 실제로 성공했다는 것을 보여 주는 자료입니다. 테스트 PASS 로그, 실제 화면, 생성된 파일처럼 말이 아니라 확인 가능한 결과를 뜻합니다.","usage":"설명만으로 완료를 믿지 않고 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: PASS한 테스트 로그가 evidence입니다."}]},{"id":"t3-c8-g4","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 4/5","title":"틀렸을 때 안전하게 돌아가기 위한 단어","paragraphs":["AI는 빠르게 많은 코드를 바꿀 수 있기 때문에 실패했을 때 원래 상태로 돌아갈 수 있는 장치가 중요합니다.","작업 전 상태와 수정 단위를 남기면 ‘망가지면 어떡하지?’ 대신 실제로 되돌릴 수 있는 절차를 가질 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"version control 버전 관리","description":"버전 관리는 파일이 언제 어떻게 바뀌었는지 기록하고 필요하면 이전 상태로 돌아갈 수 있게 하는 방식입니다. Git이 대표적인 도구입니다.","usage":"AI 수정 전후를 안전하게 비교·복원할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: Git으로 변경 이력을 남깁니다."},{"term":"checkpoint 체크포인트","description":"체크포인트는 ‘여기까지는 안전하다’고 확인한 중간 저장점입니다. 큰 작업을 하다가 다음 단계가 실패해도 이 지점으로 돌아올 수 있습니다.","usage":"큰 작업을 여러 단계로 나눠 진행할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 테스트가 모두 통과한 커밋을 checkpoint로 삼습니다."},{"term":"rollback 되돌리기","description":"되돌리기는 새 변경이 문제를 만들었을 때 이전의 정상 상태로 돌아가는 것입니다. 수정하기 전에 안전한 버전을 남겨 두는 이유입니다.","usage":"새 수정이 더 큰 문제를 만들었을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실패한 patch를 취소하고 직전 checkpoint로 돌아갑니다."},{"term":"handoff 인계","description":"인계는 다른 사람이나 다른 AI가 바로 이어서 일할 수 있도록 현재 상태를 정리해 넘기는 것입니다. 완료한 것, 남은 것, 정본 파일, 실패한 테스트를 남기면 좋습니다.","usage":"긴 작업을 끊었다가 다시 시작할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 수정한 파일, 실패 테스트, 다음 단계까지 적습니다."}]},{"id":"t3-c8-g5","kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 5/5","title":"AI의 답을 믿기 전에 알아둘 단어","paragraphs":["AI는 그럴듯한 설명을 만들 수 있지만 실제 파일을 읽지 않았거나 테스트를 실행하지 않은 상태에서도 자신 있게 말할 수 있습니다.","그래서 AI와 협업할 때는 ‘무엇을 했다고 말했는가’와 ‘무엇이 실제 evidence로 확인됐는가’를 분리합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"hallucination 환각","description":"환각은 AI가 실제로 확인하지 않았거나 존재하지 않는 내용을 그럴듯하게 말하는 현상입니다. 그래서 ‘완료했다’는 말보다 실제 파일과 테스트 결과를 확인해야 합니다.","usage":"존재하지 않는 파일·함수·실행 결과를 AI가 말할 가능성을 경계할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실제 실행하지 않았는데 ‘테스트 20개 통과’라고 답하는 경우."},{"term":"verification 검증","description":"검증은 ‘맞는 것 같다’가 아니라 실제 결과로 맞는지 확인하는 일입니다. 같은 입력으로 다시 실행하거나 테스트를 돌려 기대 결과가 나오는지 확인합니다.","usage":"작업 완료 판단 전에 반드시 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실제 앱을 열고 수정 기능이 동작하는지 확인합니다."},{"term":"test 테스트","description":"테스트는 프로그램이 우리가 정한 규칙대로 움직이는지 실제로 확인하는 일입니다. ‘아마 맞겠지’ 대신 입력을 넣고 결과를 비교합니다.","usage":"AI가 만든 코드가 기존 규칙을 지키는지 자동 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 수정 전후 같은 test suite를 실행합니다."},{"term":"regression 회귀","description":"회귀는 새로 고친 뒤 예전에 잘 되던 기능이 다시 망가지는 것입니다. 그래서 수정 뒤에는 새 문제뿐 아니라 기존 기능도 다시 테스트합니다.","usage":"AI가 요청한 부분 외에 기존 기능을 깨지 않았는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 수정 후 쿠폰 계산이 깨지는 경우."}]},{"id":"t3-c8-slow-start","kind":"concept","eyebrow":"CHAPTER 08 · 아주 천천히 시작하기","title":"AI 코딩에서도 사람이 정답의 기준을 잡아야 합니다","paragraphs":["AI에게 ‘앱 만들어 줘’, ‘이 코드 고쳐 줘’라고 말하면 AI는 매우 빠르게 많은 코드를 만들 수 있습니다. 하지만 빠르게 만들었다는 것과 내가 원한 것이 정확히 만들어졌다는 것은 다른 문제입니다.","AI는 사용자가 말하지 않은 부분을 스스로 추측할 수 있습니다. 예를 들어 배송비 오류만 고치고 싶었는데, 요청이 모호하면 AI가 함수 이름이나 다른 정책까지 함께 바꿀 수도 있습니다.","그래서 사람은 코드를 전부 직접 쓰지 않더라도 네 가지를 잡아야 합니다. 무엇을 바꿀지, 지금 실제 문제가 무엇인지, 무엇은 건드리면 안 되는지, 어떤 결과면 완료인지입니다.","그다음 AI가 만든 변경을 보고 실제 테스트 결과를 확인합니다. 이 흐름을 지키면 AI는 단순한 ‘자동 코드 작성기’가 아니라 사람이 통제할 수 있는 빠른 작업 도구가 됩니다."]},{"id":"t3-c8-p1","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"AI에게 넘겨도 되는 것은 구현 속도이고, 목표 판단은 사람이 잡습니다","paragraphs":["AI가 코드를 대신 많이 써 주더라도 사람이 해야 할 일이 없어지는 것은 아닙니다. 오히려 ‘무엇을 만들 것인지’와 ‘어떤 결과면 맞는 것인지’를 사람이 더 분명히 잡아야 합니다.","AI는 사용자가 준 정보 안에서 매우 빠르게 코드를 만들지만, 사용자의 머릿속 목표를 자동으로 정확히 알 수는 없습니다. 빈 정보가 있으면 그 부분을 추측해서 채울 수 있습니다.","그래서 AI 코딩에서 사람의 핵심 역할은 모든 문법을 외워 직접 타이핑하는 것이 아니라 목표, 범위, 지켜야 할 것, 완료 기준을 정하고 결과를 검증하는 것입니다.","AI는 코드 초안, 반복 수정, 파일 비교 같은 작업을 빠르게 할 수 있습니다. 하지만 ‘무엇을 만들어야 하는가’와 ‘이 결과가 우리 목적에 맞는가’는 사용자가 통제해야 합니다.","요청이 모호하면 AI는 빈칸을 자기 추측으로 채웁니다. 때로는 그 추측이 괜찮지만, 앱의 기존 기능이나 데이터처럼 중요한 부분에서는 위험할 수 있습니다.","그래서 좋은 AI 코딩은 긴 프롬프트를 쓰는 기술이 아니라, 목표·현재 상태·제약·완료 기준을 빠뜨리지 않는 작업 관리에 가깝습니다.","트랙 3에서 배운 문제 분해가 그대로 사용됩니다. 큰 요청을 작게 나누고, 각 단계마다 무엇이 바뀌어야 하는지와 어떻게 검증할지를 정합니다."]},{"id":"t3-c8-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"AI 작업도 문제 해결의 같은 순서를 따릅니다","paragraphs":["AI를 사용해도 문제 해결의 기본 순서는 달라지지 않습니다. 사람이 직접 코드를 쓰던 때와 똑같이 문제를 정의하고, 작은 단계로 나누고, 실행 결과를 확인해야 합니다.","달라지는 점은 구현 속도입니다. AI가 코드 초안을 빠르게 만들 수 있으므로 사람은 diff를 보고 필요한 변경만 들어갔는지, 테스트가 통과했는지 확인하는 데 더 집중할 수 있습니다.","한 번에 큰 앱 전체를 맡기기보다 작은 변경 하나를 만들고 확인한 뒤 다음으로 가면 문제가 생겨도 어디서 틀렸는지 찾기 쉽습니다.","AI가 들어와도 기본 흐름은 달라지지 않습니다. 요구사항을 정하고, 작은 작업으로 나누고, 변경을 만들고, 실제 증거로 검증합니다.","차이는 구현을 사람이 직접 모두 작성하지 않아도 된다는 점입니다. 대신 review와 verification의 중요성이 더 커집니다.","각 단계가 성공해야 다음 단계로 넘어가면 큰 실패를 작게 제한할 수 있습니다."],"visual":"AI_WORKFLOW","bullets":["목표·현재 상태 정리","constraint와 non-goal 고정","acceptance criteria 작성","작은 patch 요청","diff review","test·실행 evidence 확인","checkpoint 저장 후 다음 단계"]},{"id":"t3-c8-p2","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"좋은 요청은 ‘목표 + 현재 + 제약 + 완료 기준’ 네 덩어리면 충분합니다","paragraphs":["AI에게 좋은 지시를 쓰기 위해 특별한 문장 기술을 외울 필요는 없습니다. 필요한 정보 네 덩어리만 빠뜨리지 않으면 됩니다.","첫째는 무엇을 바꿀지인 목표입니다. 둘째는 지금 실제로 어떤 상태인지입니다. 셋째는 무엇을 건드리면 안 되는지인 제약입니다. 넷째는 어떤 결과가 나오면 완료인지인 완료 기준입니다.","예를 들어 ‘배송비 고쳐줘’보다 ‘50000원에서 3000이 나오는 경계 오류만 수정하고 함수 이름은 유지하며 49999/50000/50001 테스트가 모두 통과해야 한다’가 훨씬 명확합니다.","AI에게 모든 배경을 장황하게 설명할 필요는 없습니다. 필요한 정보가 구조적으로 들어 있으면 짧아도 좋은 요청이 됩니다.","목표에는 무엇을 바꿀지, 현재 상태에는 지금 어떤 문제가 있는지, constraint에는 지켜야 할 기존 기능을, acceptance criteria에는 완료를 어떻게 확인할지 적습니다.","예를 들어 ‘배송비 경계 오류 수정’이라는 목표 아래 ‘50000에서 3000이 나온다’는 현재 증상, ‘다른 가격 정책 변경 금지’라는 제약, ‘49999/50000/50001 테스트 통과’라는 완료 기준을 붙입니다.","이 정도면 AI가 범위를 벗어나 UI를 고치거나 구조 전체를 재설계할 이유가 크게 줄어듭니다."]},{"id":"t3-c8-example1","kind":"example","eyebrow":"예제로 연결하기","title":"모호한 요청을 검증 가능한 작업 지시로 바꿉니다","paragraphs":["모호한 요청은 AI가 스스로 많은 결정을 하게 만듭니다. 스스로 결정하는 부분이 많을수록 사용자가 원하지 않은 변경이 섞일 가능성도 커집니다.","반대로 현재 증상과 숫자 기준, 수정 범위, 완료 기준을 적으면 AI가 추측해야 할 빈칸이 줄어듭니다.","좋은 지시는 길어서 좋은 것이 아닙니다. ‘무엇을 고칠지, 무엇은 유지할지, 어떻게 확인할지’가 분명해서 좋은 것입니다.","‘배송비 코드 좀 고쳐줘’는 AI가 무엇을 문제로 봐야 할지 모호합니다. 아래처럼 실제 증상과 완료 기준을 넣으면 작업의 성공 여부가 분명해집니다.","중요한 것은 문장이 길어서가 아니라 확인 가능한 숫자와 범위가 들어 있다는 점입니다.","특히 non-goal을 적으면 요청과 상관없는 ‘친절한 대개편’을 줄일 수 있습니다."],"code":"목표:\n- shipping_fee()의 무료배송 경계 오류만 수정\n\n현재 증상:\n- total=50000일 때 3000이 반환됨\n- 기대값은 0\n\n제약:\n- 함수 이름과 반환 형식 유지\n- 다른 파일의 가격 정책 수정 금지\n\n완료 기준:\n- 49999 -> 3000\n- 50000 -> 0\n- 50001 -> 0\n- 기존 테스트 모두 통과\n\n비목표:\n- UI, DB, 함수 구조 재설계","codeNote":"이 요청은 AI가 수정 범위와 성공 기준을 스스로 추측할 필요를 줄여 줍니다.","codeExplain":["1단계: 목표: 이번에 바꿀 한 가지를 고정합니다.","2단계: 현재 증상: 실제 관찰값을 제공합니다.","3단계: 제약: 보존해야 할 인터페이스와 영역을 적습니다.","4단계: 완료 기준: 테스트 가능한 입력·출력으로 끝을 정의합니다.","5단계: 비목표: 이번 작업에서 하지 않을 일을 명시합니다."]},{"id":"t3-c8-p3","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"코드 전체보다 diff를 먼저 보면 불필요한 변경이 보입니다","paragraphs":["AI가 파일을 고친 뒤 전체 파일을 처음부터 읽는 것보다 diff를 먼저 보면 훨씬 쉽습니다. diff는 바뀐 줄만 보여 줍니다.","예를 들어 원래 total > 50000이었는데 total >= 50000으로 바뀌었다면 그 한 줄 차이를 바로 확인할 수 있습니다.","그다음 요청하지 않은 다른 함수나 파일까지 바뀌었는지 봅니다. 필요 없는 변경이 많으면 나중에 버그가 생겼을 때 원인 범위도 커집니다.","AI가 파일을 수정한 뒤 완성된 전체 코드만 보면 원래 무엇이 달라졌는지 찾기 어렵습니다. diff는 추가된 줄과 삭제된 줄을 중심으로 보여 줍니다.","review할 때는 세 가지를 봅니다. 요청한 줄이 바뀌었는가, 요청하지 않은 중요한 부분도 바뀌었는가, 테스트가 변경된 구현을 제대로 검증하는가.","AI가 ‘정리하는 김에’ 함수 이름이나 데이터 형식까지 바꿨다면 scope를 넘어선 변경일 수 있습니다. 필요하면 해당 patch를 줄여 달라고 요청합니다.","작은 diff는 정확성을 높일 뿐 아니라 문제 발생 시 rollback도 쉽습니다."]},{"id":"t3-c8-p4","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"AI의 ‘완료’와 실제 완료를 분리합니다","paragraphs":["AI가 ‘완료했습니다’라고 말하는 것과 실제로 작업이 완료된 것은 같은 뜻이 아닙니다. AI가 테스트를 실행할 수 없는 환경인데도 코드만 보고 맞다고 판단했을 수 있습니다.","그래서 완료 기준마다 확인할 증거가 필요합니다. 테스트 PASS 로그, 빌드 성공 결과, 실제 화면, 생성된 파일처럼 사람이 다시 확인할 수 있는 것이 좋습니다.","‘무엇을 했다고 말했는가’와 ‘무엇이 실제로 확인됐는가’를 분리하는 습관이 AI 코딩에서 매우 중요합니다.","AI가 ‘수정 완료, 테스트 통과’라고 말해도 실제 실행 evidence가 없다면 검증된 완료로 취급하지 않는 습관이 중요합니다.","가능하다면 테스트 로그, 빌드 결과, 실제 화면, 생성된 파일 같은 evidence를 확인합니다. 도구 접근이 없어 실행하지 못했다면 그 사실도 완료 보고에 분명히 남아야 합니다.","이 기준은 AI를 불신하자는 뜻이 아닙니다. 사람 개발자도 기억이나 추측만으로 완료를 판단하면 실수할 수 있습니다. 소프트웨어에서는 실행 결과가 가장 강한 증거입니다.","특히 파일이 실제로 저장됐는지, 운영본이 새 버전을 가리키는지처럼 ‘작업 결과가 존재하는가’를 확인해야 합니다."]},{"id":"t3-c8-example2","kind":"example","eyebrow":"예제로 연결하기","title":"작은 patch와 테스트를 한 세트로 요청합니다","paragraphs":["코드 수정만 요청하면 같은 문제가 나중에 다시 생길 수 있습니다. 그래서 중요한 버그는 수정과 테스트를 한 세트로 요청하는 편이 좋습니다.","50000원 무료배송 버그를 고쳤다면 50000을 넣어 0이 나오는 테스트도 같이 남깁니다. 이후 다른 AI가 코드를 바꿔도 테스트가 같은 실수를 잡아 줍니다.","이렇게 구현 변경과 검증 기준을 함께 남기면 사람이 과거 대화를 다시 기억하지 않아도 됩니다.","아래 예시는 구현 변경과 회귀 방지 테스트를 같이 요구하는 방식입니다. AI에게 ‘고쳐라’만 말하는 대신 ‘이 규칙을 테스트로 남겨라’까지 포함합니다.","이렇게 하면 나중에 또 다른 AI가 코드를 수정하더라도 경계 규칙이 자동으로 확인됩니다.","테스트 자체의 기대값이 요구사항과 맞는지는 사람이 review해야 합니다."],"code":"작업:\n1. shipping_fee(total)에서 50000원도 무료배송에 포함되게 수정\n2. 아래 회귀 테스트를 추가\n   - 49999 -> 3000\n   - 50000 -> 0\n   - 50001 -> 0\n3. 다른 동작은 변경하지 않기\n4. diff와 실제 테스트 결과를 함께 보고","codeNote":"목표 변경과 검증을 한 patch로 묶되 범위는 shipping_fee와 해당 테스트로 제한합니다.","codeExplain":["1단계: 구현 변경은 한 규칙에 집중합니다.","2단계: 과거 실패 입력을 regression test로 남깁니다.","3단계: 다른 동작 보존을 constraint로 둡니다.","4단계: 마지막 보고에는 diff와 evidence를 요구합니다."]},{"id":"t3-c8-p5","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"큰 작업은 checkpoint 사이의 작은 작업들로 나눕니다","paragraphs":["큰 작업을 한 번에 맡기면 결과가 빨리 나올 수 있지만, 실패했을 때 어디서 잘못됐는지 찾기 어려워집니다.","예를 들어 ‘앱 전체 완성’ 대신 데이터 저장 수정 → 테스트 → 화면 연결 → 실제 화면 확인 순서로 나눌 수 있습니다. 각 단계가 정상일 때만 다음 단계로 갑니다.","정상인 시점을 체크포인트로 남겨 두면 다음 단계가 실패해도 처음부터 다시 하지 않고 마지막 정상 지점으로 돌아갈 수 있습니다.","앱 전체를 한 번에 ‘완성해’라고 맡기면 수십 파일이 동시에 바뀌고 어느 시점부터 잘못됐는지 찾기 어려워질 수 있습니다.","대신 데이터 구조 수정 → 테스트 통과 → UI 연결 → 실제 화면 확인처럼 단계로 나누고, 각 단계가 검증될 때 checkpoint를 남깁니다.","다음 단계에서 문제가 생기면 마지막 안정 checkpoint로 rollback할 수 있습니다. 이미 끝난 단계 전체를 다시 만들 필요가 없습니다.","이 방식은 긴 AI 작업에서 문맥이 일부 사라져도 handoff를 통해 현재 위치를 복원하기 쉽습니다."]},{"id":"t3-c8-p6","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"handoff에는 ‘무엇을 했는가’보다 ‘현재 상태가 무엇인가’를 남깁니다","paragraphs":["다른 AI에게 작업을 넘길 때 긴 대화를 전부 복사할 필요는 없습니다. 지금 실제로 어떤 파일이 정본인지, 어디까지 끝났는지, 무엇이 실패했는지를 남기는 것이 더 중요합니다.","예를 들어 ‘현재 정본은 live/content.json, Track 3 Chapter 1~5 완료, Chapter 6 테스트 실패, 마지막 정상 커밋은 ○○’처럼 적으면 바로 이어서 작업할 수 있습니다.","좋은 인계는 과거 이야기 모음이 아니라 현재 작업 상태를 복원할 수 있는 설명서입니다.","다른 AI가 이어서 작업할 때 긴 대화 전체를 다시 읽게 하는 것보다 현재 정본, 완료된 범위, 남은 문제, 실패한 시도, 검증 evidence를 짧게 정리하는 것이 좋습니다.","특히 ‘건드리면 안 되는 것’과 마지막 안정 checkpoint를 남기면 반복 작업과 되돌림 사고를 줄일 수 있습니다.","handoff는 설명문이 아니라 작업 상태 파일에 가깝습니다. 파일 경로, 버전, 테스트 결과처럼 다시 확인 가능한 정보를 우선합니다.","이 원칙을 지키면 AI가 바뀌어도 프로젝트의 의사결정과 현재 상태가 이어집니다."]},{"id":"t3-c8-p7","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"환각을 줄이는 가장 좋은 방법은 확인 가능한 대상을 지정하는 것입니다","paragraphs":["AI 환각을 줄이려면 AI에게 확인할 수 있는 실제 대상을 주는 것이 가장 효과적입니다. 파일 이름, 브랜치, 오류 로그, 실제 URL처럼 구체적인 대상을 지정합니다.","‘최신 거 알아서 찾아’보다 ‘coding-roadmap-live 브랜치의 live/content.json을 기준으로 수정’이라고 하면 잘못된 버전을 잡을 가능성이 줄어듭니다.","작업 뒤에도 ‘됐어?’라고 묻는 것보다 실제 커밋, 테스트 결과, 배포 채널이 무엇을 가리키는지 확인하면 훨씬 안전합니다.","AI에게 ‘알아서 최신 파일을 찾아’라고만 하면 잘못된 버전이나 존재하지 않는 경로를 가정할 수 있습니다. 가능한 경우 정본 파일, 브랜치, URL, 버전을 직접 지정합니다.","작업 후에도 ‘고쳤다’는 문장 대신 실제 파일의 변경, 커밋, 테스트 결과처럼 확인 가능한 대상을 요구합니다.","AI가 도구로 확인할 수 없는 부분은 ‘미확인’으로 남기는 것이 정상입니다. 확인하지 못한 내용을 확정처럼 말하는 것이 더 위험합니다.","사람의 역할은 AI보다 코드를 더 빨리 쓰는 것이 아니라, 어떤 evidence가 충분한지 판단하는 것입니다."]},{"id":"t3-c8-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"모호한 AI 요청을 작업 지시서로 바꾸세요","paragraphs":["이 실습에서는 코드를 직접 쓰는 대신 AI에게 줄 작업 지시를 설계합니다. 핵심은 말을 멋있게 쓰는 것이 아니라 AI가 추측할 부분을 줄이는 것입니다.","실제 증상, 수정할 범위, 보존할 것, 완료 기준, 확인할 증거를 각각 적으면 작업의 시작과 끝이 분명해집니다.","상황: 주문 앱에서 50000원 주문이 무료배송이어야 하는데 3000원이 붙습니다. 다른 금액의 배송비 규칙과 UI는 지금 잘 동작합니다.","AI에게 ‘이거 고쳐줘’라고만 하지 말고 목표, 현재 증상, scope, constraint, acceptance criteria, non-goal을 각각 한 줄 이상 적어 보세요.","마지막에는 어떤 evidence를 보고 완료를 판단할지도 적습니다."],"practicePrompt":"아래 틀의 빈칸을 채워 AI에게 그대로 줄 수 있는 작업 지시를 만드세요.","code":"목표:\n- __________________\n\n현재 증상:\n- __________________\n\nscope:\n- __________________\n\nconstraint:\n- __________________\n\nacceptance criteria:\n- __________________\n- __________________\n- __________________\n\nnon-goal:\n- __________________\n\n완료 evidence:\n- __________________","answerOnNext":true},{"id":"t3-c8-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"모호한 AI 요청을 작업 지시서로 바꾸세요 · 풀이","paragraphs":["풀이 예시는 하나의 정답 문장을 외우는 것이 아니라 필요한 정보가 모두 들어 있는 형태를 보여 줍니다. 같은 구조를 다른 기능에도 그대로 적용할 수 있습니다.","정답 문장은 여러 가지가 가능하지만, 실제 관찰값과 보존 조건, 테스트 가능한 완료 기준이 모두 들어가야 합니다.","아래 예시는 shipping_fee 함수와 테스트만 수정 범위로 잡고 UI와 다른 가격 정책은 비목표로 둡니다.","완료 evidence는 말로 된 보고가 아니라 diff와 실제 테스트 결과를 요구합니다."],"code":"목표:\n- 50000원 무료배송 경계 오류 수정\n\n현재 증상:\n- total=50000에서 shipping_fee()가 3000을 반환함\n\nscope:\n- shipping_fee 함수와 해당 테스트만\n\nconstraint:\n- 함수 이름·반환 형식·다른 배송비 정책 유지\n\nacceptance criteria:\n- 49999 -> 3000\n- 50000 -> 0\n- 50001 -> 0\n\nnon-goal:\n- UI, DB, 다른 가격 정책 변경\n\n완료 evidence:\n- 실제 diff + 테스트 실행 결과","codeNote":"이 정도면 AI가 무엇을 바꿔야 하고 무엇을 바꾸면 안 되는지, 언제 완료인지 명확합니다."},{"id":"t3-c8-check","kind":"check","eyebrow":"확인 문제","title":"AI 협업에서 사람의 핵심 역할을 확인합니다","paragraphs":["이 확인 문제는 AI의 설명이 아니라 실제 변경과 실행 결과를 기준으로 완료를 판단하는 습관을 확인합니다.","AI가 코드를 많이 작성할수록 사람이 모든 문법을 직접 외울 필요는 줄 수 있습니다. 하지만 목표와 검증 기준을 잡는 역할은 더 중요해집니다.","다음 질문에 acceptance criteria와 evidence를 사용해 답해 보세요."],"question":"AI가 ‘문제 수정 완료’라고 답했는데 실제 테스트 결과나 변경 diff가 없다면, 왜 아직 검증된 완료라고 보기 어려울까요?","answerOnNext":true},{"id":"t3-c8-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"AI 협업에서 사람의 핵심 역할을 확인합니다 · 풀이","paragraphs":["풀이 예시는 하나의 정답 문장을 외우는 것이 아니라 필요한 정보가 모두 들어 있는 형태를 보여 줍니다. 같은 구조를 다른 기능에도 그대로 적용할 수 있습니다.","완료라는 말만으로는 acceptance criteria가 실제로 충족됐는지 확인할 수 없습니다. AI가 실행하지 않았거나 다른 파일을 수정했을 가능성도 있습니다.","diff로 scope 안의 변경인지 review하고, 실제 테스트·빌드·화면 같은 evidence로 기준을 충족했는지 verification해야 검증된 완료에 가까워집니다."]},{"id":"t3-c8-summary","kind":"summary","eyebrow":"Chapter 8 정리","title":"트랙 3의 끝은 ‘AI에게 잘 시키기’가 아니라 ‘문제를 통제하며 협업하기’입니다","paragraphs":["AI와 코딩할 때 가장 중요한 능력은 프롬프트 문장을 화려하게 쓰는 것이 아닙니다. 목표와 범위를 정하고, AI가 실제로 무엇을 바꿨는지 보고, 테스트와 결과로 확인하는 능력이 더 중요합니다.","트랙 3에서 배운 문제 분해, 상태 추적, 제어 흐름, 함수, 디버깅, 테스트는 AI 시대에도 그대로 중요합니다. AI는 이 과정을 대신 없애는 것이 아니라 구현 속도를 높이는 도구입니다.","좋은 협업은 목표·context·constraint·acceptance criteria를 명확히 하고, 작은 patch를 diff로 review한 뒤 실제 evidence로 verification하는 흐름입니다.","이 과정을 익히면 긴 코드를 처음부터 직접 쓰지 않아도 AI가 만든 결과를 읽고 수정 범위를 지시하며, 잘못된 변경을 되돌리고, 다음 AI에게 작업 상태를 정확히 넘길 수 있습니다.","다음 트랙부터는 웹·TypeScript·데이터·API 같은 실제 기술을 배우게 됩니다. 새로운 기술을 만날 때도 트랙 3의 문제 해결 순서를 그대로 적용하면 됩니다."],"bullets":["AI에게 목표·현재 상태·제약·완료 기준을 함께 준다.","큰 작업을 작은 patch와 checkpoint로 나눈다.","전체 코드보다 diff로 실제 변경을 먼저 본다.","AI의 완료 보고와 실제 evidence를 분리한다.","문제가 생기면 rollback 가능한 상태를 유지하고 handoff로 현재 정본을 남긴다."]}]}],"audit":{"originalPages":208,"removedRepeatedParagraphs":96,"solutionsAdded":32,"track3Completed":true,"track3ChapterCount":8,"removedExperimentalChapter13":true,"contentEngine":"ChatBook 1.2 + ultra-easy detailed textbook prose","track3BeginnerRewrite":true,"track3ExplanationLevel":"asked-again ultra-beginner textbook","track2BeginnerRewrite":true,"track2LineByLineRewrite":true,"track2ExplanationStyle":"concrete syntax-aware beginner explanations","track2LineExplainV2":true,"track2LineExplainMethod":"context-aware base explanation + duplicate-only pedagogical context","track2KoreanPolish":true,"track2DuplicateContextOnly":true,"track2NoRepeatedSentenceGate":true,"track2DuplicateExamplesContextualized":true}}</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course').textContent);
const chapters=COURSE.chapters;
const native=window.RoadmapNative;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const defaults={schema:1,version:4,location:chapters[0].pages[0].id,bookmarks:[],notes:{},complete:[],visited:[],readerPositions:{},readerDark:false,readerFont:18,practiceCode:{},migrated:false};
let state;
try{state=JSON.parse(native?native.getState():localStorage.getItem('codingroadmap-live-state')||'{}')}catch(e){state={}}
state=Object.assign({},defaults,state);
for(const k of ['bookmarks','complete','visited'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.notes||typeof state.notes!=='object'||Array.isArray(state.notes))state.notes={};
if(!state.readerPositions||typeof state.readerPositions!=='object'||Array.isArray(state.readerPositions))state.readerPositions={};
if(!state.practiceCode||typeof state.practiceCode!=='object'||Array.isArray(state.practiceCode))state.practiceCode={};
state.readerDark=!!state.readerDark;
state.readerFont=Math.max(15,Math.min(24,Number(state.readerFont)||18));
let route='home';
let current=locate(state.location)||{c:0,p:0};
let selectedTrack=chapters[current.c].track;
let focus=false;
let searchQuery='';
let savedFilter='all';
let updateStatus=native?native.getStatus():'저장된 교재';
let toastTimer;
let physicalPage=0;
let physicalPages=1;
let pendingTargetId=state.location;
let pendingLast=false;
let pendingPhysicalRatio=null;
let pendingSavedPosition=null;
let pageTurnActive=false;
let trackTransitionDir=0;
let readerMenuOpen=false;
let trackTab='chapters';
let practiceOutput='';
let practiceError='';
let practiceRunning=false;
let pyodidePromise=null;
let trackSlideMap={track:null,key:'',entries:[],byId:{},total:1,ready:false};
let previewRoute='';
try{if(typeof location!=='undefined')previewRoute=new URLSearchParams(location.search).get('preview')||''}catch(e){}

function locate(id){
  for(let c=0;c<chapters.length;c++){
    const p=chapters[c].pages.findIndex(x=>x.id===id);
    if(p>=0)return {c,p};
  }
  return null;
}
function beginPageTurn(){
  pageTurnActive=true;
  if(document.body&&document.body.classList&&typeof document.body.classList.add==='function')document.body.classList.add('page-turning');
}
function finishPageTurn(){
  if(!pageTurnActive)return;
  const done=()=>{
    if(document.body&&document.body.classList&&typeof document.body.classList.remove==='function')document.body.classList.remove('page-turning');
    pageTurnActive=false;
  };
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(done);
  else done();
}
function persist(){
  try{
    const raw=JSON.stringify(state);
    if(native)native.saveState(raw);else localStorage.setItem('codingroadmap-live-state',raw);
  }catch(e){toast('학습 기록을 저장하지 못했습니다')}
}
/* EXACT_READER_RESUME_V1 — logical page + physical slide are persisted together */
function readerPositionKey(cIndex){
  const chapter=chapters[cIndex];
  return chapter?chapter.id:'';
}
function saveReaderPosition(){
  if(route!=='reader'||!chapters[current.c])return;
  const key=readerPositionKey(current.c);
  if(!key)return;
  state.readerPositions[key]={
    logicalId:state.location,
    physical:Math.max(0,Number(physicalPage)||0),
    total:Math.max(1,Number(physicalPages)||1),
    ratio:physicalPages>1?Math.max(0,Math.min(1,physicalPage/(physicalPages-1))):0
  };
  persist();
}
function savedReaderPosition(cIndex){

function migrate(){

  try{

    state.legacy=old;
    if(Object.keys(old).length){
      const c=(Number(old.current_track)||0)*8+(Number(old.current_chapter)||0);
      const chapter=chapters[c];
      if(chapter){
        const id=chapter.id+'-p'+((Number(old.current_page)||0)+1);
        state.location=locate(id)?id:chapter.pages[0].id;
        current=locate(state.location)||current;

    if(c.track!==trackId)return;

function rebuildTrackSlideMap(trackId,paperWidth,wrapHeight){
  const key=[COURSE.version,trackId,Math.round(paperWidth),Math.round(wrapHeight),focus?'focus':'normal'].join(':');
  if(trackSlideMap.ready&&trackSlideMap.key===key)return;

  const items=trackLogicalPages(trackId);
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.position='fixed';
  host.style.left='-20000px';
  host.style.top='0';
  host.style.width=paperWidth+'px';
  host.style.height=wrapHeight+'px';
  host.style.visibility='hidden';
  host.style.pointerEvents='none';
  host.style.overflow='hidden';
  host.style.zIndex='-1';
  document.body.appendChild(host);

  const entries=[],byId={};
  let start=0;
  for(const item of items){
    const p=item.p,c=item.c;
    host.innerHTML='<div class="topic-header"><h1 class="topic-title">'+esc(p.title)+'</h1><div class="section-marker type-'+esc(p.kind)+'"><span class="kind">'+esc(kindLabel(p.kind))+'</span><span class="hint">'+esc(sectionHint(p))+'</span></div></div><article class="reader-paper"><div class="reader-flow">'+lessonSection(p,c,item.pi)+'</div></article>';
    const topic=host.querySelector('.topic-header');
    const measurePaper=host.querySelector('.reader-paper');
    const measureFlow=host.querySelector('.reader-flow');
    topic.style.width=paperWidth+'px';
    topic.style.margin='0';
    const topicHeight=Math.ceil(topic.getBoundingClientRect().height);
    const bodyHeight=Math.max(120,wrapHeight-topicHeight);
    measurePaper.style.width=paperWidth+'px';
    measurePaper.style.height=bodyHeight+'px';
    measurePaper.style.overflow='hidden';
    measureFlow.style.width=paperWidth+'px';
    measureFlow.style.height=bodyHeight+'px';
    measureFlow.style.columnCount='auto';
    measureFlow.style.columnWidth=paperWidth+'px';
    measureFlow.style.columnGap='0px';
    measureFlow.style.columnFill='auto';
    const count=Math.max(1,Math.ceil(Math.max(measureFlow.scrollWidth,paperWidth)/paperWidth-.001));
    const entry={id:p.id,count,start};
    entries.push(entry);
    byId[p.id]=entry;
    start+=count;
  }
  host.remove();
  trackSlideMap={track:trackId,key,entries,byId,total:Math.max(1,start),ready:true};
}
function reconcileCurrentTrackSlideCount(){
  if(!trackSlideMap.ready)return;
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.byId[id];
  if(!entry||entry.count===physicalPages)return;
  const diff=physicalPages-entry.count;
  entry.count=physicalPages;
  let passed=false;
  for(const x of trackSlideMap.entries){
    if(x.id===id){passed=true;continue}
    if(passed)x.start+=diff;
  }
  trackSlideMap.total=Math.max(1,trackSlideMap.total+diff);
}
function currentTrackSlidePosition(){
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.ready?trackSlideMap.byId[id]:null;
  if(!entry){
    const ids=trackPageIds(chapters[current.c].track);
    const logical=Math.max(0,ids.indexOf(id));
    return {current:logical+1,total:Math.max(1,ids.length)};
  }
  return {
    current:Math.max(1,Math.min(trackSlideMap.total,entry.start+physicalPage+1)),
    total:trackSlideMap.total
  };
}

function highlightPythonLine(line){
  let out='',i=0;
  const keywords=new Set(['def','return','if','elif','else','for','while','in','not','and','or','True','False','None','try','except','finally','raise','break','continue','import','from','as','class','with','lambda']);
  const escChar=c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c);
  while(i<line.length){
    const ch=line[i];
    if(ch==='#'){out+='<span class="tok-comment">'+esc(line.slice(i))+'</span>';break}
    if(ch==='"'||ch==="'"){
      const q=ch;let j=i+1;
      while(j<line.length){if(line[j]==='\\'){j+=2;continue}if(line[j]===q){j++;break}j++}
      out+='<span class="tok-string">'+esc(line.slice(i,j))+'</span>';i=j;continue;
    }
    if(/[0-9]/.test(ch)){
      let j=i+1;while(j<line.length&&/[0-9._]/.test(line[j]))j++;
      out+='<span class="tok-number">'+esc(line.slice(i,j))+'</span>';i=j;continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      let j=i+1;while(j<line.length&&/[A-Za-z0-9_]/.test(line[j]))j++;
      const word=line.slice(i,j);
      out+=(keywords.has(word)?'<span class="tok-keyword">'+word+'</span>':esc(word));i=j;continue;
    }
    out+=escChar(ch);i++;
  }
  return out||' ';
}

function ensurePyodide(){

    sc.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';

    document.head.appendChild(sc);
  }).then(()=>window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'}));
  return pyodidePromise;
}

function physicalForId(id){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelector||!paper.getBoundingClientRect)return 0;
  const sec=flow.querySelector('.logical-anchor[data-page-id="'+String(id).replace(/"/g,'\\"')+'"]');
  if(!sec||!sec.getClientRects)return 0;
  const pr=paper.getBoundingClientRect();
  let left=Infinity;
  for(const rect of sec.getClientRects())left=Math.min(left,rect.left-pr.left+paper.scrollLeft);
  return Number.isFinite(left)?Math.max(0,Math.min(physicalPages-1,Math.floor(left/Math.max(paper.clientWidth,1)+.001))):0;
}
function syncLogical(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelectorAll||!paper.getBoundingClientRect||!paper.clientWidth)return;
  const pr=paper.getBoundingClientRect();
  const topBand=Math.min(150,Math.max(86,paper.clientHeight*.16));
  let previous=null,nearTop=null,nearTopY=-Infinity;
  for(const anchor of flow.querySelectorAll('.logical-anchor')){
    if(!anchor.getClientRects)continue;
    const rects=anchor.getClientRects();
    if(!rects||!rects.length)continue;
    const rect=rects[0];
    const left=rect.left-pr.left+paper.scrollLeft;
    const page=Math.max(0,Math.floor(left/Math.max(paper.clientWidth,1)+.001));
    const y=rect.top-pr.top;
    const idx=Number(anchor.dataset.pageIndex);
    if(!Number.isFinite(idx))continue;
    if(page<physicalPage||(page===physicalPage&&y<=0)){
      previous={anchor,idx,page,y};
    }else if(page===physicalPage&&y<=topBand&&y>=nearTopY){
      nearTop={anchor,idx,page,y};
      nearTopY=y;
    }
  }
  const best=nearTop||previous;
  if(!best)return;
  const idx=best.idx;
  if(idx>=0&&idx<chapters[current.c].pages.length){
    current.p=idx;
    state.location=chapters[current.c].pages[idx].id;
    if(!state.visited.includes(state.location))state.visited.push(state.location);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');
    if(star)star.textContent=state.bookmarks.includes(state.location)?'★':'☆';
  }
}

function layoutReader(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!paper.clientWidth||!paper.clientHeight)return;
  const w=paper.clientWidth,h=paper.clientHeight;
  flow.style.width=w+'px';
  flow.style.height=h+'px';
  flow.style.columnCount='auto';
  flow.style.columnWidth=w+'px';
  flow.style.columnGap='0px';
  flow.style.columnFill='auto';
  paper.scrollLeft=0;
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{
    physicalPages=Math.max(1,Math.ceil(Math.max(flow.scrollWidth,w)/w-.001));
    if(pendingPhysicalRatio!==null){
      physicalPage=Math.max(0,Math.min(physicalPages-1,Math.round(pendingPhysicalRatio*Math.max(physicalPages-1,0))));
      pendingPhysicalRatio=null;
    }else if(pendingSavedPosition){
      const saved=pendingSavedPosition;
      const sameLayout=Number(saved.total)===physicalPages;
      const exact=sameLayout?Number(saved.physical):Math.round((Number(saved.ratio)||0)*Math.max(physicalPages-1,0));
      physicalPage=Math.max(0,Math.min(physicalPages-1,Number.isFinite(exact)?exact:physicalForId(pendingTargetId||state.location)));
      pendingSavedPosition=null;
    }else{
      physicalPage=pendingLast?physicalPages-1:physicalForId(pendingTargetId||state.location);
    }
    pendingLast=false;
    pendingTargetId='';
    paper.scrollLeft=physicalPage*w;
    const wrap=document.querySelector('.reader-paper-wrap');
    if(wrap){
      rebuildTrackSlideMap(chapters[current.c].track,w,wrap.clientHeight);
      reconcileCurrentTrackSlideCount();
    }
    syncLogical();
    saveReaderPosition();
    updateHud();
    finishPageTurn();
    try{
      const cs=getComputedStyle(flow),ps=getComputedStyle(paper),footer=document.querySelector('.reader-bottom'),fr=footer&&footer.getBoundingClientRect?footer.getBoundingClientRect():null;
      document.body.dataset.qaReady='1';
      document.body.dataset.qaPages=String(physicalPages);
      document.body.dataset.qaFont=cs.fontSize;
      document.body.dataset.qaLineHeight=cs.lineHeight;
      document.body.dataset.qaOverflowY=ps.overflowY;
      document.body.dataset.qaFit=(flow.scrollHeight<=paper.clientHeight+2?'1':'0');
      document.body.dataset.qaFooterVisible=(!fr||fr.bottom<=innerHeight+1?'1':'0');
      document.body.dataset.qaViewport=String(innerWidth)+'x'+String(innerHeight);
      document.body.dataset.qaColumnFill='auto';
      const qaWrap=document.querySelector('.reader-paper-wrap'),topic=document.querySelector('.topic-header');
      const wrapRect=qaWrap&&qaWrap.getBoundingClientRect?qaWrap.getBoundingClientRect():null;
      const topicRect=topic&&topic.getBoundingClientRect?topic.getBoundingClientRect():null;
      const titleOffset=(wrapRect&&topicRect)?Math.round(topicRect.top-wrapRect.top):9999;
      document.body.dataset.qaTitleOffsets=String(titleOffset);
      document.body.dataset.qaTitleMax=String(Math.abs(titleOffset));
      document.body.dataset.qaTitleTop=(Math.abs(titleOffset)<=2?'1':'0');
      const trackSlide=currentTrackSlidePosition();
      document.body.dataset.qaTrackSlideCurrent=String(trackSlide.current);
      document.body.dataset.qaTrackSlideTotal=String(trackSlide.total);
      document.body.dataset.qaTrackSlideGlobal=(trackSlide.total>=trackPageIds(chapters[current.c].track).length?'1':'0');
    }catch(e){}
  });
}
function changePhysical(delta){
  const paper=document.getElementById('paper');
  beginPageTurn();
  if(!paper||!paper.clientWidth){
    logicalFallback(delta);
    return;
  }
  const next=physicalPage+delta;
  if(next>=0&&next<physicalPages){
    physicalPage=next;
    paper.scrollLeft=physicalPage*paper.clientWidth;
    syncLogical();
    saveReaderPosition();
    updateHud();
    finishPageTurn();
    return;
  }
  logicalFallback(delta);
}
function installReaderGestures(){
  const surface=document.querySelector('.reader-paper-wrap');
  const paper=document.getElementById('paper');
  if(!surface||!paper||!surface.addEventListener)return;

  let start=null,drag=false,startScroll=0,touchRunning=false,lastFinish=0;
  const blocked=el=>el&&el.closest&&el.closest('input,textarea,select,a,summary,details,.copy-btn,.reader-action,.focus-exit,.circle-btn,.focus-btn');

  function begin(x,y,target,source){
    if(blocked(target))return false;
    start={x,y,t:Date.now(),source};
    startScroll=paper.scrollLeft;
    drag=false;
    return true;
  }
  function move(x,y,event){
    if(!start)return;
    const dx=x-start.x,dy=y-start.y;
    if(!drag){
      if(Math.abs(dx)<6)return;
      if(Math.abs(dx)<=Math.abs(dy)*1.02)return;
      drag=true;
    }
    // Do not drag the page itself. Every successful turn uses the same whole-page transition.
    if(event&&event.cancelable)event.preventDefault();
  }
  function finish(x,y,event){
    if(!start)return;
    const dx=x-start.x,dy=y-start.y,ms=Math.max(1,Date.now()-start.t);
    const wasDrag=drag;
    start=null;drag=false;lastFinish=Date.now();
    const distance=Math.abs(dx);
    const horizontal=distance>Math.abs(dy)*1.02;
    const normalThreshold=Math.min(80,Math.max(34,(innerWidth||360)*.06));
    const quickFlick=ms<=420&&distance>=24;
    if(wasDrag&&horizontal&&(distance>=normalThreshold||quickFlick)){
      changePhysical(dx<0?1:-1);
    }else{
      paper.scrollLeft=physicalPage*paper.clientWidth;
    }
    if(event&&event.cancelable&&wasDrag)event.preventDefault();
  }

  // Android/WebView: use native touch events across title + body.
  surface.addEventListener('touchstart',e=>{
    if(!e.touches||e.touches.length!==1)return;
    touchRunning=true;
    const q=e.touches[0];
    begin(q.clientX,q.clientY,e.target,'touch');
  },{passive:true});
  surface.addEventListener('touchmove',e=>{
    if(!touchRunning||!start||start.source!=='touch'||!e.touches||e.touches.length!==1)return;
    const q=e.touches[0];
    move(q.clientX,q.clientY,e);
  },{passive:false});
  surface.addEventListener('touchend',e=>{
    if(!touchRunning)return;
    const q=(e.changedTouches&&e.changedTouches[0])||(start?{clientX:start.x,clientY:start.y}:{clientX:0,clientY:0});
    finish(q.clientX,q.clientY,e);
    touchRunning=false;
  },{passive:false});
  surface.addEventListener('touchcancel',()=>{
    touchRunning=false;start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;
  },{passive:true});

  // Mouse / stylus fallback. Touch pointers are ignored to prevent double firing.
  surface.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||touchRunning||Date.now()-lastFinish<120)return;
    if(begin(e.clientX,e.clientY,e.target,'pointer')){
      try{surface.setPointerCapture&&surface.setPointerCapture(e.pointerId)}catch(err){}
    }
  });
  surface.addEventListener('pointermove',e=>{
    if(!start||start.source!=='pointer')return;
    move(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointerup',e=>{
    if(!start||start.source!=='pointer')return;
    finish(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointercancel',()=>{
    if(start&&start.source==='pointer'){start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;}
  });
}
/* TRACK_SWIPE_NAV_V1 — swipe between learning tracks */
function switchTrack(delta){
  const tracks=COURSE.tracks;
  const index=tracks.findIndex(x=>x.id===selectedTrack);
  if(index<0)return;
  const next=Math.max(0,Math.min(tracks.length-1,index+delta));
  if(next===index)return;
  trackTransitionDir=delta;
  trackTab='chapters';
  selectedTrack=tracks[next].id;
  route='track';
  render();
}
function installTrackGestures(){
  const surface=document.querySelector('.track-swipe-surface');
  if(!surface||!surface.addEventListener)return;
  let start=null;
  const begin=(x,y,target)=>{
    if(target&&target.closest&&target.closest('button,input,textarea,a'))return;
    start={x,y,t:Date.now()};
  };
  const end=(x,y)=>{
    if(!start)return;
    const dx=x-start.x,dy=y-start.y,ms=Date.now()-start.t;
    start=null;
    const horizontal=Math.abs(dx)>Math.abs(dy)*1.15;
    const threshold=Math.min(90,Math.max(42,(innerWidth||360)*.1));
    if(horizontal&&(Math.abs(dx)>=threshold||(ms<360&&Math.abs(dx)>=30)))switchTrack(dx<0?1:-1);
  };
  surface.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length===1)begin(e.touches[0].clientX,e.touches[0].clientY,e.target)},{passive:true});
  surface.addEventListener('touchend',e=>{const q=e.changedTouches&&e.changedTouches[0];if(q)end(q.clientX,q.clientY)},{passive:true});
  surface.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')begin(e.clientX,e.clientY,e.target)});
  surface.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')end(e.clientX,e.clientY)});
}
function modal(title,body){
  const el=document.getElementById('modal');
  el.innerHTML='<div class="modal-top"><h2>'+esc(title)+'</h2><button class="small-btn" data-action="close">닫기</button></div>'+body;
  el.showModal();
}
function goBack(){
  const d=document.getElementById('modal');
  if(d.open){d.close();return true}
  if(route==='home')return false;
  if(route==='reader'){
    saveReaderPosition();route='track';selectedTrack=chapters[current.c].track;
  }else if(route==='practice'){
    route='reader';
  }else route='home';
  render();
  return true;
}
window.goBack=goBack;
function doAction(action,el){
  const c=chapters[current.c],p=c.pages[current.p];
  if(action==='home'||action==='books'||action==='search'||action==='saved'||action==='settings'){leaveReader();readerMenuOpen=false;route=action;render();return}
  if(action==='track'){leaveReader();readerMenuOpen=false;trackTab='chapters';trackTransitionDir=Number(el.dataset.track)>selectedTrack?1:-1;selectedTrack=Number(el.dataset.track);route='track';render();return}
  if(action==='track-current'){saveReaderPosition();readerMenuOpen=false;selectedTrack=c.track;route='track';render();return}
  if(action==='track-tab'){trackTab=el.dataset.tab||'chapters';render();return}
  if(action==='chapter'){const i=Number(el.dataset.c);openPage(chapters[i].pages[0].id);return}
  if(action==='continue'){readerMenuOpen=false;openPage(state.location,false,true);return}
  if(action==='continue-track'){
    const saved=locate(state.location);
    if(saved&&chapters[saved.c].track===selectedTrack)openPage(state.location,false,true);
    else{const first=chapters.findIndex(x=>x.track===selectedTrack);if(first>=0)openPage(chapters[first].pages[0].id)}
    return;
  }
  if(action==='open'){openPage(el.dataset.id);return}
  if(action==='prev'){changePhysical(-1);return}
  if(action==='next'){changePhysical(1);return}
  if(action==='focus'){
    pendingPhysicalRatio=physicalPages>1?physicalPage/(physicalPages-1):0;
    focus=!focus;render();return;
  }
  if(action==='reader-menu'){
    readerMenuOpen=!readerMenuOpen;
    const menu=document.getElementById('reader-menu');if(menu)menu.hidden=!readerMenuOpen;
    return;
  }
  if(action==='toggle-dark'){
    pendingPhysicalRatio=physicalPages>1?physicalPage/(physicalPages-1):0;
    state.readerDark=!state.readerDark;persist();readerMenuOpen=true;render();return;
  }
  if(action==='bookmark'){
    state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):state.bookmarks.concat(p.id);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');if(star)star.textContent=state.bookmarks.includes(p.id)?'★':'☆';
    toast(state.bookmarks.includes(p.id)?'북마크에 저장했습니다':'북마크를 해제했습니다');return;
  }
  if(action==='summary'){
    const summary=(p.paragraphs||[]).slice(0,3).join('\n\n')||(p.bullets||[]).join('\n• ');
    modal('핵심 요약','<section class="summary-modal"><h3>'+esc(p.title)+'</h3><p>'+txt(summary||'이 페이지의 핵심 내용을 다시 읽어보세요.')+'</p></section>');return;
  }
  if(action==='practice'){leaveReader();readerMenuOpen=false;route='practice';practiceOutput='';practiceError='';render();return}
  if(action==='run-python'){runPythonPractice();return}
  if(action==='practice-reset'){
    if(p){delete state.practiceCode[p.id];persist()}
    practiceOutput='';practiceError='';render();return;
  }
  if(action==='note'){modal('내 메모','<p style="color:#817567;margin-top:0">Chapter '+c.chapter+' · '+esc(p.title)+'</p><textarea id="note" rows="8">'+esc(state.notes[p.id]||'')+'</textarea>');return}
  if(action==='display'){readerMenuOpen=true;const menu=document.getElementById('reader-menu');if(menu)menu.hidden=false;return}
  if(action==='complete'){state.complete=state.complete.includes(c.id)?state.complete.filter(x=>x!==c.id):state.complete.concat(c.id);persist();render();return}
  if(action==='copy-code'){
    const code=decodeURIComponent(el.dataset.code||'');
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast('코드를 복사했습니다')).catch(()=>copyFallback(code));else copyFallback(code);return;
  }
  if(action==='saved-filter'){savedFilter=el.dataset.filter||'all';render();return}
  if(action==='refresh'){if(native){native.refresh();toast('최신 교재를 확인합니다')}return}
  if(action==='apply'){if(native)native.apply();return}
  if(action==='legacy'){if(native)native.openLegacy();return}
  if(action==='export'){const raw=JSON.stringify({app:'codingroadmap-live-v1',state},null,2);if(native)native.exportState(raw);return}
  if(action==='import'){if(native)native.importState();else document.getElementById('import-file').click();return}
  if(action==='close'){document.getElementById('modal').close();return}
}
function copyFallback(value){
  const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'코드를 복사했습니다':'코드를 길게 눌러 복사하세요');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const action=el.dataset.action;
  const d=document.getElementById('modal');
  if(d.open&&action!=='close')d.close();
  doAction(action,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){searchQuery=e.target.value;document.getElementById('results').innerHTML=searchResults(searchQuery)}
  if(e.target.id==='note'){state.notes[chapters[current.c].pages[current.p].id]=e.target.value;persist()}
  if(e.target.id==='practice-code'){
    const p=chapters[current.c]?.pages[current.p];if(p){state.practiceCode[p.id]=e.target.value;persist()}
  }
  if(e.target.id==='reader-font-range'){
    const value=Math.max(15,Math.min(24,Number(e.target.value)||18));
    pendingPhysicalRatio=physicalPages>1?physicalPage/(physicalPages-1):0;
    state.readerFont=value;persist();
    const shell=document.querySelector('.reader-shell');if(shell)shell.style.setProperty('--readerBody',value+'px');
    const label=document.getElementById('font-value');if(label)label.textContent=value+'px';
    trackSlideMap.ready=false;
    setTimeout(layoutReader,30);
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveReaderPosition()});
if(typeof window.addEventListener==='function')window.addEventListener('pagehide',saveReaderPosition);
window.importProgress=raw=>{
  try{
    const data=JSON.parse(raw);
    if(data.app!=='codingroadmap-live-v1'||data.state?.schema!==1)throw Error();
    const s=data.state;
    if(!Array.isArray(s.bookmarks)||!Array.isArray(s.complete)||!s.notes||typeof s.notes!=='object')throw Error();
    state.bookmarks=[...new Set(state.bookmarks.concat(s.bookmarks.filter(x=>typeof x==='string')))];
    state.complete=[...new Set(state.complete.concat(s.complete.filter(x=>typeof x==='string')))];
    for(const [id,note] of Object.entries(s.notes)){
      if(typeof note!=='string')continue;
      if(state.notes[id]&&state.notes[id]!==note)state.notes[id]+='\n\n[가져온 메모]\n'+note;else state.notes[id]=note;
    }
    persist();render();toast('학습 기록을 복원했습니다');
  }catch(e){toast('이 앱의 올바른 백업 파일이 아닙니다')}
};
window.onUpdateStatus=s=>{updateStatus=s;if(route==='settings')render()};
if(typeof addEventListener==='function'){
  addEventListener('resize',()=>{if(route==='reader')setTimeout(layoutReader,40)});
  addEventListener('orientationchange',()=>{if(route==='reader')setTimeout(layoutReader,120)});
}
render();
</script>
