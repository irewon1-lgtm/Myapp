디 파일인지, 어떤 글자 규칙인지” 알려 줍니다’ 내용을 설명하는 코드에서는 1행은 \"data/memo.txt\"에서 만든 결과를 filename에 저장하거나 갱신하는 줄입니다.","3행 「with open(filename, \"r\", encoding=\"utf-8\") as f:」 — filename 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다’ 내용을 설명하는 코드에서는 3행은 filename 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다’ 내용을 설명하는 코드에서는 4행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","6행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다’ 내용을 설명하는 코드에서는 6행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x06","kind":"example","title":"append로 간단한 기록을 계속 쌓습니다","eyebrow":"초보 확장 · 예제","paragraphs":["a 모드를 쓰면 기존 파일 뒤에 내용을 추가할 수 있습니다.","\\n은 줄바꿈 문자입니다.","로그나 누적 메모처럼 기존 기록을 남기면서 새 내용을 붙일 때 유용합니다."],"code":"with open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"새 기록\\\\n\")","codeNote":"a 모드는 기존 내용을 보존하면서 파일 끝에 새 줄을 추가합니다.","extras":[],"codeExplain":["1행 「with open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:」 — \"log.txt\" 파일을 기존 내용 뒤에 이어 쓰기 모드(a)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","2행 「f.write(\"새 기록\\\\n\")」 — 문자열 \"새 기록\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다."]},{"id":"t2-c6-x07","kind":"practice","title":"장보기 목록을 파일에 한 줄씩 저장해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["items = [\"우유\", \"달걀\", \"빵\"]이 있습니다.","for로 하나씩 꺼내 f.write(item + \"\\n\")으로 저장할 수 있습니다.","파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다."],"practicePrompt":"with open(..., \"w\")와 for를 사용해 shopping.txt에 세 항목을 한 줄씩 저장하세요.","answerOnNext":true,"extras":[],"code":"items = [\"우유\", \"달걀\", \"빵\"]\n\nwith open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:\n    for item in items:\n        f.write(____)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「items = [\"우유\", \"달걀\", \"빵\"]」 — 여러 값을 순서대로 담은 리스트 [\"우유\", \"달걀\", \"빵\"]을 구한 뒤 결과를 items라는 변수에 저장합니다. 이 줄 이후에는 items라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘장보기 목록을 파일에 한 줄씩 저장해 보세요’ 실습에서는 1행은 [\"우유\", \"달걀\", \"빵\"]에서 만든 결과를 items에 저장하거나 갱신하는 줄입니다.","3행 「with open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"shopping.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","4행 「for item in items:」 — items에서 값을 하나씩 꺼내 item에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","5행 「f.write(____)」 — 직접 채워야 하는 빈칸이 포함된 표현식을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다."]},{"id":"t2-c6-x08","kind":"solution","title":"장보기 목록을 파일에 한 줄씩 저장해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["w 모드로 shopping.txt를 엽니다.","for로 item을 하나씩 꺼냅니다.","item + \"\\n\"을 쓰면 각 항목 뒤에 줄바꿈이 붙습니다."],"code":"items = [\"우유\", \"달걀\", \"빵\"]\nwith open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:\n    for item in items:\n        f.write(item + \"\\n\")","codeNote":"shopping.txt 내용\n우유\n달걀\n빵","extras":[],"codeExplain":["1행 「items = [\"우유\", \"달걀\", \"빵\"]」 — 여러 값을 순서대로 담은 리스트 [\"우유\", \"달걀\", \"빵\"]을 구한 뒤 결과를 items라는 변수에 저장합니다. 이 줄 이후에는 items라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘장보기 목록을 파일에 한 줄씩 저장해 보세요’ 풀이에서는 1행은 [\"우유\", \"달걀\", \"빵\"]에서 만든 결과를 items에 저장하거나 갱신하는 줄입니다.","2행 「with open(\"shopping.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"shopping.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","3행 「for item in items:」 — items에서 값을 하나씩 꺼내 item에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","4행 「f.write(item + \"\\n\")」 — 계산식 item + \"\\n\"의 결과를 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다."]},{"id":"t2-c6-x09","kind":"practice","title":"숫자 파일을 읽어 합계를 구해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["numbers.txt에 10, 20, 30이 각각 한 줄씩 있다고 가정합니다.","파일에서 읽은 줄은 문자열이므로 int로 바꾼 뒤 total에 더합니다.","파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다."],"practicePrompt":"파일을 한 줄씩 읽고 합계 60을 출력하세요.","answerOnNext":true,"extras":[],"code":"total = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = ____\n        total = ____\n\nprint(total)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"numbers.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 3행은 \"numbers.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 4행은 f에서 값을 하나씩 꺼내 line에 넣기 시작하는 반복 지점입니다.","5행 「number = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 number라는 변수에 저장합니다. 이 줄 이후에는 number라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 5행은 ____에서 만든 결과를 number에 저장하거나 갱신하는 줄입니다.","6행 「total = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 6행은 ____에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","8행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 실습에서는 8행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x10","kind":"solution","title":"숫자 파일을 읽어 합계를 구해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["파일 객체는 for로 한 줄씩 읽을 수 있습니다.","line.strip()으로 줄바꿈을 없애고 int로 숫자로 바꿉니다.","total에 하나씩 더하면 60이 됩니다."],"code":"total = 0\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = int(line.strip())\n        total += number\nprint(total)","codeNote":"예상 출력: 60","extras":[],"codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 풀이에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","2행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"numbers.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","3행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","4행 「number = int(line.strip())」 — line.strip()을 정수로 바꾸는 int(line.strip())의 결과를 구해 number에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다.","5행 「total += number」 — 현재 line 값을 처리하는 반복 안에서 현재 total에 number를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다.","6행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘숫자 파일을 읽어 합계를 구해 보세요’ 풀이에서는 6행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x11","kind":"check","title":"파일이 없을 때와 w 모드일 때를 구분해 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["r 모드로 없는 파일을 열면 FileNotFoundError가 납니다.","w 모드는 파일이 없으면 새로 만들지만, 같은 이름의 기존 파일이 있으면 덮어쓸 수 있습니다.","파일 작업에서는 모드를 확인하는 습관이 매우 중요합니다."],"question":"중요한 diary.txt가 이미 있는데 \"w\" 모드로 열고 새 글을 쓰면 기존 내용은 어떻게 될까요?","answerOnNext":true,"extras":[],"code":"# 핵심 개념 확인: 파일이 없을 때와 w 모드일 때를 구분해 보세요\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일이 없을 때와 w 모드일 때를 구분해 보세요’ 확인 문제의 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 w가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 문자열 \"새 메모\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다. ‘파일이 없을 때와 w 모드일 때를 구분해 보세요’ 확인 문제의 코드에서는 2행은 \"새 메모\\\\n\" 내용을 열린 파일 f에 실제로 기록하는 줄입니다."]},{"id":"t2-c6-x12","kind":"solution","title":"파일이 없을 때와 w 모드일 때를 구분해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["w 모드는 파일 내용을 새로 쓰는 모드입니다.","기존 diary.txt 내용은 지워지고 새 내용으로 바뀔 수 있습니다.","기존 내용 뒤에 추가하려면 a 모드를 사용합니다.","한 줄씩 읽으면 각 line에는 줄바꿈이 붙어 있을 수 있습니다. strip으로 정리하고 숫자라면 int로 변환한 뒤 계산에 사용합니다."],"code":"with open(\"diary.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"새 기록\\n\")","codeNote":"a 모드는 기존 내용 뒤에 추가합니다.","extras":[],"codeExplain":["1행 「with open(\"diary.txt\", \"a\", encoding=\"utf-8\") as f:」 — \"diary.txt\" 파일을 기존 내용 뒤에 이어 쓰기 모드(a)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","2행 「f.write(\"새 기록\\n\")」 — 문자열 \"새 기록\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다."]},{"id":"t2-c6-x13","kind":"concept","title":"쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다’에서는 첫 코드 line = \"민수,80\"에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","\"민수,80\"처럼 한 줄에 이름과 점수를 쉼표로 구분해 저장할 수 있습니다.","line.strip().split(\",\")으로 나누면 [\"민수\", \"80\"]처럼 됩니다.","실제 업무에서는 csv 모듈이 더 안전하지만 초보 단계에서는 “한 줄 → 나누기 → 타입 변환” 흐름을 먼저 이해하세요."],"extras":[],"code":"line = \"민수,80\"\nparts = line.split(\",\")\nname = parts[0]\nscore = int(parts[1])\nprint(name, score)","codeNote":"한 줄을 쉼표로 나누고 두 번째 조각만 숫자로 변환합니다.","codeExplain":["1행 「line = \"민수,80\"」 — 문자열 \"민수,80\"을 구한 뒤 결과를 line라는 변수에 저장합니다. 이 줄 이후에는 line라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","2행 「parts = line.split(\",\")」 — line을 \",\" 기준으로 나눈 리스트를 구해 parts에 저장합니다. 한 덩어리 문자열이 여러 조각의 리스트로 바뀌므로 이후 각 위치를 따로 꺼낼 수 있습니다. ‘쉼표로 나눈 간단한 파일도 작은 데이터 표처럼 읽을 수 있습니다’ 내용을 설명하는 코드에서는 2행은 line.split(\",\")에서 만든 결과를 parts에 저장하거나 갱신하는 줄입니다.","3행 「name = parts[0]」 — parts의 첫 번째 값을 구한 뒤 결과를 name라는 변수에 저장합니다. 이 줄 이후에는 name라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","4행 「score = int(parts[1])」 — parts[1]을 정수로 바꾸는 int(parts[1])의 결과를 구해 score에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다.","5행 「print(name, score)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 name의 현재 값, 2번째는 score의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다."]},{"id":"t2-c6-x14","kind":"example","title":"이름과 점수가 적힌 파일을 읽어 평균을 구합니다","eyebrow":"초보 확장 · 예제","paragraphs":["각 줄을 쉼표로 나누면 parts라는 리스트가 됩니다.","parts[0]은 이름이고 parts[1]은 점수 글자입니다. 점수 글자는 int로 숫자로 바꿉니다.","점수를 total에 더하고 count를 늘린 뒤 평균을 계산합니다. 한 줄씩 값이 어떻게 변하는지 따라가 보세요."],"code":"# 예제로 동작 확인: 이름과 점수가 적힌 파일을 읽어 평균을 구합니다\ntotal = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total += int(line.strip())\n\nprint(total)","codeNote":"한 줄씩 읽은 문자열을 정수로 바꿔 total에 누적합니다.","extras":[],"codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘이름과 점수가 적힌 파일을 읽어 평균을 구합니다’ 예제에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"numbers.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘이름과 점수가 적힌 파일을 읽어 평균을 구합니다’ 예제에서는 3행은 \"numbers.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘이름과 점수가 적힌 파일을 읽어 평균을 구합니다’ 예제에서는 4행은 f에서 값을 하나씩 꺼내 line에 넣기 시작하는 반복 지점입니다.","5행 「total += int(line.strip())」 — 현재 line 값을 처리하는 반복 안에서 현재 total에 int(line.strip())를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다. ‘이름과 점수가 적힌 파일을 읽어 평균을 구합니다’ 예제에서는 5행은 total의 이전 값에 int(line.strip()) 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘이름과 점수가 적힌 파일을 읽어 평균을 구합니다’ 예제에서는 7행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"summary","eyebrow":"Chapter 6 정리","title":"지금 알아야 할 것","paragraphs":["파일 읽기와 쓰기 챕터의 목표는 문법을 외우는 것이 아니라 “with open을 이용해 텍스트 파일을 안전하게 읽고 쓰며, 경로·인코딩·줄 단위 처리의 기본을 익힌다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 예외 처리로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["with open을 이용해 텍스트 파일을 안전하게 읽고 쓰며, 경로·인코딩·줄 단위 처리의 기본을 익힌다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c6-p13","code":"# 챕터 핵심 다시 확인: 지금 알아야 할 것\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘지금 알아야 할 것’ 정리 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘지금 알아야 할 것’ 정리 코드에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"텍스트 파일을 읽고 필요한 정보를 찾아 처리하는 문제 중심 흐름 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"기존 파일을 읽고 변환한 뒤 결과를 다시 저장하는 자동화 워크플로 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"실제 데이터 파일을 입력으로 받아 분석 가능한 결과로 만드는 완성형 작업 흐름 참고"}]}],"track":2,"id":"t2-c6","remember":"r 읽기, w 비우고 쓰기, a 추가","practiceGoal":"실습 파일 준비·합산","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"텍스트 파일을 읽고 필요한 정보를 찾아 처리하는 문제 중심 흐름 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"기존 파일을 읽고 변환한 뒤 결과를 다시 저장하는 자동화 워크플로 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"실제 데이터 파일을 입력으로 받아 분석 가능한 결과로 만드는 완성형 작업 흐름 참고"}]},{"chapter":7,"title":"예외 처리","pages":[{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이번 단어장에서는 exception 예외, try, except를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"exception 예외","description":"예외는 실행 중 ‘이 상태로는 정상 흐름을 계속하기 어렵다’고 Python이 알리는 신호입니다. 숫자로 바꿀 수 없는 글자를 int()에 넣거나 없는 파일을 열면 예외가 발생할 수 있습니다.","usage":"실행 중 실패 상황을 구분하고 처리할 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: int(\"abc\")는 ValueError를 발생시킵니다."},{"term":"try","description":"try는 예외가 날 가능성이 있는 코드를 먼저 실행해 보는 구역입니다. 문제가 없으면 그대로 다음으로 가고, 예외가 발생하면 그 종류와 맞는 except를 찾습니다.","usage":"실패 가능성이 있는 최소 범위를 감쌀 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 사용자 입력을 int로 변환하는 줄을 try에 둘 수 있습니다."},{"term":"except","description":"except는 특정 예외가 발생했을 때 대신 실행할 처리 구역입니다. ValueError처럼 어떤 문제를 처리하는지 구체적으로 적으면 예상하지 못한 다른 오류를 숨이는 일을 줄일 수 있습니다.","usage":"사용자에게 안내하거나 대체 흐름을 제공할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: except ValueError: 에서 숫자 입력 안내를 보여 줄 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c7-p1","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. exception 예외, try, except를 실제 코드와 연결해서 보면 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. exception 예외, try, except를 실제 코드와 연결해서 보면 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. exception 예외, try, except를 실제 코드와 연결해서 보면 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. exception 예외, try, except를 실제 코드와 연결해서 보면 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. exception 예외, try, except를 실제 코드와 연결해서 보면 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["이번 단어장에서는 finally, raise, fallback 대체 처리를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"finally","description":"finally는 성공하든 실패하든 마지막에 반드시 실행됩니다. 파일이나 네트워크 연결 정리처럼 결과와 상관없이 꼭 해야 하는 마무리 작업에 사용합니다.","usage":"반드시 실행해야 하는 마무리 작업에 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 연결 종료나 임시 상태 정리에 사용할 수 있습니다."},{"term":"raise","description":"raise는 프로그램이 스스로 ‘이 값은 허용할 수 없다’고 예외를 발생시키는 문법입니다. 가격이 음수처럼 규칙상 잘못된 값을 발견했을 때 즉시 알릴 수 있습니다.","usage":"잘못된 상태를 조용히 계속 진행하지 않고 명확하게 실패시키고 싶을 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 음수 가격이 허용되지 않으면 raise ValueError(...)를 사용할 수 있습니다."},{"term":"fallback 대체 처리","description":"fallback은 원래 작업이 실패했을 때 사용할 대체 흐름이나 값입니다. 무조건 0으로 바꾸는 것이 아니라 그 대체값이 실제 의미를 망치지 않는지 먼저 판단해야 합니다.","usage":"파일이 없으면 빈 목록으로 시작하는 등 복구 가능한 상황에서 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 설정 파일이 없으면 기본 설정으로 시작할 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c7-p2","code":"# 용어를 실제 코드에서 확인: 코드에서 자주 만나는 표현\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. finally, raise, fallback 대체 처리를 실제 코드와 연결해서 보면 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. finally, raise, fallback 대체 처리를 실제 코드와 연결해서 보면 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. finally, raise, fallback 대체 처리를 실제 코드와 연결해서 보면 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. finally, raise, fallback 대체 처리를 실제 코드와 연결해서 보면 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. finally, raise, fallback 대체 처리를 실제 코드와 연결해서 보면 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 1/6","title":"예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다","paragraphs":["‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","try/except를 쓴다고 잘못된 입력이나 파일 누락이 사라지는 것은 아닙니다. 프로그램이 예상 가능한 실패를 만나도 어떤 행동을 할지 미리 정하는 것입니다.","오류 원인을 무조건 숨기기보다 사용자에게 이해 가능한 안내를 제공하고, 개발 중에는 어떤 예외가 발생했는지 기록하는 것이 중요합니다.","안정적인 앱은 실패가 전혀 없는 앱이 아니라 실패했을 때 상태가 예측 가능한 앱에 가깝습니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p3","code":"# 개념을 코드로 확인: 예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’ 내용을 설명하는 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’ 내용을 설명하는 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’ 내용을 설명하는 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리는 오류를 없애는 것이 아니라 다루는 방법입니다’ 내용을 설명하는 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 2/6","title":"try 범위는 가능한 한 작게 잡습니다","paragraphs":["‘try 범위는 가능한 한 작게 잡습니다’에서는 첫 코드 text = \"1200\"에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","큰 코드 블록 전체를 try로 감싸면 어느 줄에서 어떤 문제가 났는지 모호해집니다. 실제로 실패 가능성이 있는 변환, 파일 열기, 네트워크 호출 같은 부분만 감싸세요.","except도 Exception 전체를 무조건 잡기보다 ValueError처럼 예상한 예외를 구체적으로 처리하는 편이 좋습니다.","예상하지 못한 오류까지 조용히 삼키면 버그가 숨어 실제 문제를 찾기 어려워집니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p4","code":"text = \"1200\"\n\ntry:\n    amount = int(text)\nexcept ValueError:\n    amount = 0\n\nprint(amount)","codeNote":"실패 가능성이 있는 int(text)만 try 안에 두어 오류가 나는 위치가 분명합니다.","codeExplain":["1행 「text = \"1200\"」 — 문자열 \"1200\"을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘try 범위는 가능한 한 작게 잡습니다’ 내용을 설명하는 코드에서는 3행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","4행 「amount = int(text)」 — text을 정수로 바꾸는 int(text)의 결과를 구해 amount에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다.","5행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다.","6행 「amount = 0」 — 숫자 0을 구한 뒤 결과를 amount라는 변수에 저장합니다. 이 줄 이후에는 amount라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","8행 「print(amount)」 — amount의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 3/6","title":"예외 종류는 문제의 범주를 알려 주는 신호입니다","paragraphs":["‘예외 종류는 문제의 범주를 알려 주는 신호입니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","ValueError는 값의 내용이 기대 형식과 맞지 않을 때, FileNotFoundError는 파일 경로 문제일 때처럼 예외 이름 자체가 조사 방향을 좁혀 줍니다.","except ValueError와 except FileNotFoundError를 나누면 사용자 안내도 상황에 맞게 바꿀 수 있습니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p5","code":"# 개념을 코드로 확인: 예외 종류는 문제의 범주를 알려 주는 신호입니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 종류는 문제의 범주를 알려 주는 신호입니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘예외 종류는 문제의 범주를 알려 주는 신호입니다’ 내용을 설명하는 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 종류는 문제의 범주를 알려 주는 신호입니다’ 내용을 설명하는 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 종류는 문제의 범주를 알려 주는 신호입니다’ 내용을 설명하는 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 종류는 문제의 범주를 알려 주는 신호입니다’ 내용을 설명하는 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 4/6","title":"재시도는 종료 조건과 함께 설계합니다","paragraphs":["‘재시도는 종료 조건과 함께 설계합니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","입력이 잘못됐다고 무한히 다시 묻는 것보다 최대 시도 횟수나 취소 방법을 정하는 편이 안전합니다. while과 예외 처리를 함께 쓸 때 종료 조건이 특히 중요합니다.","재시도할 가치가 있는 오류와 즉시 중단해야 하는 오류를 구분해야 합니다.","실제 네트워크 프로그램에서도 일시적 실패는 재시도할 수 있지만 잘못된 인증 정보처럼 반복해도 해결되지 않는 문제는 다른 처리가 필요합니다."],"keywords":["exception 예외","try","except","finally"],"extras":[],"visibleExtras":2,"id":"t2-c7-p6","code":"# 개념을 코드로 확인: 재시도는 종료 조건과 함께 설계합니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘재시도는 종료 조건과 함께 설계합니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘재시도는 종료 조건과 함께 설계합니다’ 내용을 설명하는 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘재시도는 종료 조건과 함께 설계합니다’ 내용을 설명하는 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘재시도는 종료 조건과 함께 설계합니다’ 내용을 설명하는 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘재시도는 종료 조건과 함께 설계합니다’ 내용을 설명하는 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 5/6","title":"fallback은 데이터 의미를 망치지 않아야 합니다","paragraphs":["‘fallback은 데이터 의미를 망치지 않아야 합니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","오류가 났을 때 무조건 0이나 빈 문자열을 넣으면 프로그램은 계속 실행되지만 잘못된 결과를 만들 수 있습니다. 대체값이 실제 의미상 안전한 경우에만 사용하세요.","복구할 수 없는 문제라면 명확하게 실패시키고 사용자에게 이유를 알려 주는 편이 더 정확할 수 있습니다.","“계속 실 3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리의 전체 흐름’ 흐름에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리의 전체 흐름’ 흐름에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리의 전체 흐름’ 흐름에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"예외 처리를 하나의 코드로 연결합니다","paragraphs":[],"code":"# 예제로 동작 확인: 예외 처리를 하나의 코드로 연결합니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","extras":[],"visibleExtras":2,"id":"t2-c7-p10","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리를 하나의 코드로 연결합니다’ 예제에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘예외 처리를 하나의 코드로 연결합니다’ 예제에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리를 하나의 코드로 연결합니다’ 예제에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리를 하나의 코드로 연결합니다’ 예제에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리를 하나의 코드로 연결합니다’ 예제에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"예외 처리를 직접 바꾸고 확장합니다","paragraphs":["try 안에는 실제로 실패할 수 있는 줄을 넣습니다. 숫자 변환이면 ValueError, 0으로 나누면 ZeroDivisionError처럼 실패 원인마다 오류 이름이 다릅니다.","정상 입력일 때는 try가 끝까지 실행되고 except는 건너뜁니다. 잘못된 입력일 때는 오류가 난 순간 try의 나머지를 건너뛰고 맞는 except로 이동합니다.","예외 처리 코드를 완성하면 정상 값과 일부러 틀린 값을 모두 넣어 보세요. 두 경우가 각각 어떤 길로 움직이는지 확인해야 제대로 이해한 것입니다."],"code":"attempts = 0\n\nwhile attempts \u003c 3:\n    raw = input(\"금액: \")\n    try:\n        amount = ____\n        print(\"입력 금액:\", amount)\n        break\n    except ____:\n        print(\"숫자로 입력해 주세요.\")\n        attempts += 1","practicePrompt":"금액을 입력받아 int로 변환하는 프로그램을 만들고, 숫자가 아니면 최대 3번까지 다시 입력받도록 while과 try/except를 함께 사용해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c7-p11","answerOnNext":true,"codeExplain":["1행 「attempts = 0」 — 숫자 0을 구한 뒤 결과를 attempts라는 변수에 저장합니다. 이 줄 이후에는 attempts라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 실습에서는 1행은 0에서 만든 결과를 attempts에 저장하거나 갱신하는 줄입니다.","3행 「while attempts \u003c 3:」 — attempts가 3보다 작은지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 실습에서는 3행은 attempts \u003c 3 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「raw = input(\"금액: \")」 — input 함수를 \"금액: \"와 함께 호출한 결과을 구한 뒤 결과를 raw라는 변수에 저장합니다. 이 줄 이후에는 raw라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","5행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 실습에서는 5행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","6행 「amount = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 amount라는 변수에 저장합니다. 이 줄 이후에는 amount라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","7행 「print(\"입력 금액:\", amount)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"입력 금액:\", 2번째는 amount의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다.","8행 「break」 — while 반복 안에서 현재 반복문 전체를 즉시 끝냅니다. 아직 처리할 값이 남아 있어도 더 반복하지 않고 반복문 다음 줄로 이동합니다.","9행 「except ____:」 — try 안에서 ____ 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다.","10행 「print(\"숫자로 입력해 주세요.\")」 — 문자열 \"숫자로 입력해 주세요.\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","11행 「attempts += 1」 — 현재 attempts 값에 + 1 연산을 적용한 뒤 결과를 다시 attempts에 저장합니다. 같은 변수의 이전 값이 새 값으로 바뀌는 줄입니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c7-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예외 처리를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["이 풀이의 최대 3번은 최초 입력을 포함한 총 세 번입니다. 횟수 규칙부터 명확히 정합니다.","변환이 실패하면 except로 가고 continue가 다음 입력으로 돌아가게 합니다.","정상 숫자는 출력한 뒤 break로 반복을 끝냅니다. 세 번 다 실패하면 마지막 안내가 출력됩니다."],"code":"attempts = 0\nsuccess = False\nwhile attempts \u003c 3:\n    attempts = attempts + 1\n    raw = input(\"금액: \")\n    try:\n        amount = int(raw)\n    except ValueError:\n        print(\"숫자로 입력해 주세요.\")\n        continue\n    print(f\"입력 금액: {amount}\")\n    success = True\n    break\nif not success:\n    print(\"3회 실패하여 종료합니다.\")","codeNote":"실행 결과 또는 테스트 기준\n입력 사과, 12000 →\n숫자로 입력해 주세요.\n입력 금액: 12000","extras":[],"codeExplain":["1행 「attempts = 0」 — 숫자 0을 구한 뒤 결과를 attempts라는 변수에 저장합니다. 이 줄 이후에는 attempts라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 풀이에서는 1행은 0에서 만든 결과를 attempts에 저장하거나 갱신하는 줄입니다.","2행 「success = False」 — 참·거짓 값 False을 구한 뒤 결과를 success라는 변수에 저장합니다. 이 줄 이후에는 success라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「while attempts \u003c 3:」 — attempts가 3보다 작은지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 풀이에서는 3행은 attempts \u003c 3 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「attempts = attempts + 1」 — 시도 횟수 attempts를 1 늘립니다. 이 값이 3에 가까워지면서 while attempts \u003c 3 조건도 언젠가 False가 되어 반복이 끝날 수 있습니다.","5행 「raw = input(\"금액: \")」 — input 함수를 \"금액: \"와 함께 호출한 결과을 구한 뒤 결과를 raw라는 변수에 저장합니다. 이 줄 이후에는 raw라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","6행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 풀이에서는 6행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","7행 「amount = int(raw)」 — raw을 정수로 바꾸는 int(raw)의 결과를 구해 amount에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다.","8행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리를 직접 바꾸고 확장합니다’ 풀이에서는 8행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","9행 「print(\"숫자로 입력해 주세요.\")」 — 문자열 \"숫자로 입력해 주세요.\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","10행 「continue」 — ValueError가 발생한 경우에서 이번 iteration의 남은 줄만 건너뛰고 다음 값으로 넘어갑니다. 반복 전체를 끝내는 break와 달리 다음 항목은 계속 처리합니다.","11행 「print(f\"입력 금액: {amount}\")」 — 중괄호 안의 변수나 계산식을 실제 값으로 바꿔 글자와 합치는 f-string을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","12행 「success = True」 — 참·거짓 값 True을 구한 뒤 결과를 success라는 변수에 저장합니다. 이 줄 이후에는 success라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","13행 「break」 — while 반복 안에서 현재 반복문 전체를 즉시 끝냅니다. 아직 처리할 값이 남아 있어도 더 반복하지 않고 반복문 다음 줄로 이동합니다.","14행 「if not success:」 — success가 False인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","15행 「print(\"3회 실패하여 종료합니다.\")」 — 문자열 \"3회 실패하여 종료합니다.\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"kind":"check","eyebrow":"확인 문제","title":"예외 처리 핵심을 확인합니다","paragraphs":[],"question":"except Exception: 하나로 모든 오류를 잡고 아무 메시지도 남기지 않는 방식이 디버깅을 어렵게 만드는 이유는 무엇일까요?","extras":[],"visibleExtras":3,"id":"t2-c7-p12","answerOnNext":true,"code":"# 핵심 개념 확인: 예외 처리 핵심을 확인합니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리 핵심을 확인합니다’ 확인 문제의 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘예외 처리 핵심을 확인합니다’ 확인 문제의 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리 핵심을 확인합니다’ 확인 문제의 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리 핵심을 확인합니다’ 확인 문제의 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리 핵심을 확인합니다’ 확인 문제의 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예외 처리 핵심을 확인합니다 · 풀이","paragraphs":["어떤 종류의 오류가 어디서 발생했는지 정보가 사라지고 예상하지 못한 버그까지 정상 처리처럼 숨겨질 수 있기 때문입니다. 가능한 한 예상한 예외를 구체적으로 처리하고 필요한 정보는 남겨야 합니다."],"extras":[],"code":"try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"0으로 나눌 수 없습니다\")","codeNote":"0으로 나누면 ZeroDivisionError가 생기고 안내 문장이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리 핵심을 확인합니다’ 풀이에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「print(10 / 0)」 — 계산식 10 / 0의 결과를 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리 핵심을 확인합니다’ 풀이에서는 2행은 10 / 0의 실제 결과를 화면에서 확인하는 출력 단계입니다.","3행 「except ZeroDivisionError:」 — try 안에서 ZeroDivisionError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리 핵심을 확인합니다’ 풀이에서는 3행은 ZeroDivisionError 예외가 생겼을 때 이동할 처리 경로입니다.","4행 「print(\"0으로 나눌 수 없습니다\")」 — 문자열 \"0으로 나눌 수 없습니다\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리 핵심을 확인합니다’ 풀이에서는 4행은 \"0으로 나눌 수 없습니다\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x01","kind":"concept","title":"예외 처리는 프로그램의 안전벨트입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘예외 처리는 프로그램의 안전벨트입니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","사용자는 숫자를 입력하라고 해도 글자를 넣을 수 있고, 파일은 사라질 수 있고, 0으로 나누는 일도 생깁니다.","예외 처리는 오류가 절대 생기지 않게 만드는 마법이 아니라 오류가 생겼을 때 어떻게 대응할지 정하는 방법입니다.","try에는 실패할 수 있는 코드를 넣고 except에는 특정 오류가 생겼을 때 할 일을 넣습니다."],"keywords":["try","except","exception","예외"],"extras":[],"code":"# 개념을 코드로 확인: 예외 처리는 프로그램의 안전벨트입니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘예외 처리는 프로그램의 안전벨트입니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘예외 처리는 프로그램의 안전벨트입니다’ 내용을 설명하는 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리는 프로그램의 안전벨트입니다’ 내용을 설명하는 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘예외 처리는 프로그램의 안전벨트입니다’ 내용을 설명하는 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘예외 처리는 프로그램의 안전벨트입니다’ 내용을 설명하는 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x02","kind":"example","title":"글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다","eyebrow":"초보 확장 · 예제","paragraphs":["int(\"123\")은 성공하지만 int(\"abc\")는 숫자로 바꿀 수 없어 ValueError가 납니다.","try 안에서 변환을 시도하고 ValueError가 생기면 except로 이동합니다.","사용자에게 “숫자를 입력하세요”라고 안내할 수 있습니다."],"code":"try:\n    number = int(\"abc\")\nexcept ValueError:\n    print(\"숫자로 바꿀 수 없습니다\")","codeNote":"int(\"abc\")에서 ValueError가 발생해 except 블록이 실행됩니다.","extras":[],"codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다’ 예제에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「number = int(\"abc\")」 — \"abc\"을 정수로 바꾸는 int(\"abc\")의 결과를 구해 number에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다’ 예제에서는 2행은 int(\"abc\")에서 만든 결과를 number에 저장하거나 갱신하는 줄입니다.","3행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다’ 예제에서는 3행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","4행 「print(\"숫자로 바꿀 수 없습니다\")」 — 문자열 \"숫자로 바꿀 수 없습니다\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘글자를 숫자로 바꾸다 실패하는 ValueError를 처리합니다’ 예제에서는 4행은 \"숫자로 바꿀 수 없습니다\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x03","kind":"concept","title":"오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","ValueError와 ZeroDivisionError는 원인이 다릅니다.","오류 종류별로 except를 나누면 더 정확한 안내를 줄 수 있습니다.","except Exception처럼 모든 오류를 한꺼번에 잡으면 진짜 버그까지 숨길 수 있습니다."],"extras":[],"code":"# 개념을 코드로 확인: 오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다\ntry:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = int(\"10\")」 — \"10\"을 정수로 바꾸는 int(\"10\")의 결과를 구해 age에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다. ‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’ 내용을 설명하는 코드에서는 2행은 int(\"10\")에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「print(age)」 — age의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’ 내용을 설명하는 코드에서는 3행은 age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’ 내용을 설명하는 코드에서는 4행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘오류 종류가 다르면 except도 나눠 쓰는 편이 좋습니다’ 내용을 설명하는 코드에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x04","kind":"example","title":"간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다","eyebrow":"초보 확장 · 예제","paragraphs":["문자열을 int로 바꾸는 과정에서는 ValueError가 날 수 있습니다.","b가 0이면 나눗셈에서 ZeroDivisionError가 납니다.","두 오류를 따로 처리하면 원인이 분명합니다."],"code":"# 예제로 동작 확인: 간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다\ntry:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"0으로 나눌 수 없습니다\")","codeNote":"10 / 0에서 ZeroDivisionError가 발생하고 해당 except가 처리합니다.","extras":[],"codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다’ 예제에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「print(10 / 0)」 — 계산식 10 / 0의 결과를 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다’ 예제에서는 2행은 10 / 0의 실제 결과를 화면에서 확인하는 출력 단계입니다.","3행 「except ZeroDivisionError:」 — try 안에서 ZeroDivisionError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다’ 예제에서는 3행은 ZeroDivisionError 예외가 생겼을 때 이동할 처리 경로입니다.","4행 「print(\"0으로 나눌 수 없습니다\")」 — 문자열 \"0으로 나눌 수 없습니다\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘간단한 나눗셈에서 두 종류의 오류를 따로 처리합니다’ 예제에서는 4행은 \"0으로 나눌 수 없습니다\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x05","kind":"concept","title":"else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다’에서는 첫 코드 try:에서 시작해 정상적으로 실행되는 길과 예외가 생겼을 때 이동하는 길을 분리해서 읽습니다. 어떤 오류를 예상하고 어느 except가 처리하는지 알면 예외 처리가 단순한 암기 문법이 아니게 됩니다.","try가 오류 없이 끝났을 때만 실행하고 싶은 코드는 else에 둘 수 있습니다.","finally는 성공하든 실패하든 마지막에 실행됩니다.","처음에는 try/except가 우선이고, else는 성공 전용, finally는 무조건 마지막이라고 기억하세요."],"extras":[],"code":"try:\n    number = int(\"20\")\nexcept ValueError:\n    print(\"변환 실패\")\nelse:\n    print(\"변환 성공:\", number)\nfinally:\n    print(\"처리 끝\")","codeNote":"오류가 없어 else가 실행되고, finally는 성공 여부와 관계없이 마지막에 실행됩니다.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다’ 내용을 설명하는 코드에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「number = int(\"20\")」 — \"20\"을 정수로 바꾸는 int(\"20\")의 결과를 구해 number에 저장합니다. 문자열로 읽은 숫자를 실제 정수로 바꾸는 단계라 이후 덧셈·비교를 숫자 기준으로 할 수 있습니다.","3행 「except ValueError:」 — try 안에서 ValueError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다. ‘else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다’ 내용을 설명하는 코드에서는 3행은 ValueError 예외가 생겼을 때 이동할 처리 경로입니다.","4행 「print(\"변환 실패\")」 — 문자열 \"변환 실패\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘else와 finally는 성공했을 때와 무조건 해야 할 일을 나눕니다’ 내용을 설명하는 코드에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"변환 성공:\", number)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"변환 성공:\", 2번째는 number의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다.","7행 「finally:」 — try가 성공했든 예외가 발생했든 마지막에 반드시 실행되는 블록입니다. 성공 여부와 상관없이 꼭 해야 하는 정리 작업을 넣습니다.","8행 「print(\"처리 끝\")」 — 문자열 \"처리 끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c7-x06","kind":"example","title":"파일 읽기 성공과 실패를 나눠 메시지를 보여 줍니다","eyebrow":"초보 확장 · 예제","paragraphs":["파일이 있으면 내용을 읽고 else에서 읽기 성공을 출력합니다.","파일이 없으면 FileNotFoundError를 잡아 안내합니다.","finally는 어느 길이든 마지막에 실행됩니다."],"code":"try:\n    with open(\"missing.txt\", \"r\", encoding=\"utf-8\") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print(\"파일이 없습니다\")","codeNote":"파일이 없으면 FileNotFoundError가 발생하고 프로그램은 안내 문장을 출력합니다.","extras":[],"codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘파일 읽기 성공과 실패를 나눠 메시지를 보여 줍니다’ 예제에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「with open(\"missing.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"missing.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","3행 「print(f.read())」 — 열린 파일에서 읽어 온 전체 내용을 바로 화면에 보여 줍니다. 별도 변수에 저장하지 않고 파일 내용 자체를 확인하는 방식입니다.","4행 「except FileNotFoundError:」 — try 안에서 FileNotFoundError 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다.","5행 「print(\"파일이 없습니다\")」 — 문자열 \"파일이 없습니다\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c7-x07","kind":"practice","title":"나이 입력을 안전하게 숫자로 바꿔 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["사용자가 \"열살\"처럼 숫자가 아닌 글자를 입력할 수 있습니다.","int(input(...))를 try 안에서 실행하고 ValueError를 except에서 처리하세요."],"practicePrompt":"숫자를 입력하면 나이를 출력하고, 글자를 입력하면 “숫자로 입력하세요”를 출력하세요.","answerOnNext":true,"extras":[],"code":"try:\n    age = ____\n    print(\"입력한 나이:\", age)\nexcept ____:\n    print(\"숫자로 입력하세요\")","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘나이 입력을 안전하게 숫자로 바꿔 보세요’ 실습에서는 1행부터 예외가 날 수 있는 코드를 별도 try 구역에서 실행합니다.","2행 「age = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「print(\"입력한 나이:\", age)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"입력한 나이:\", 2번째는 age의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘나이 입력을 안전하게 숫자로 바꿔 보세요’ 실습에서는 3행은 \"입력한 나이:\", age의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「except ____:」 — try 안에서 ____ 예외가 발생했을 때만 이 블록으로 들어옵니다. 다른 종류의 오류까지 한꺼번에 숨기지 않고 지금 예상한 실패만 처리합니다.","5행 「print(\"숫자로 입력하세요\")」 — 문자열 \"숫자로 입력하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘나이 입력을 안전하게 숫자로 바꿔 보세요’ 실습에서는 5행은 \"숫자로 입력하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c7-x08","kind":"solution","title":"나이 입력을 안전하게 숫자로 바꿔 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["input은 문자열을 돌려줍니다.","int가 숫자로 바꾸려고 시도합니다.","숫자 모양이 아니면 ValueError가 발생해 except가 실행됩니다."],"code":"try:\n    age = int(input(\"나이: \"))\n    print(\"입력한 나이:\", age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"10 입력 → 입력한 나이: 10\n열살 입력 → 숫자로 입력하세요","extras":[],"codeExplain":["1행 「try:」 — 실패할 가능성이 있는 코드를 먼저 실행해 보는 try 블록을 시작합니다. 아래 코드가 정상적으로 끝나면 except는 건너뛰고, 예외가 생기면 그 종류와 맞는 except로 이동합니다. ‘나이 입력을 안전하게 숫자로 바꿔 보세요’ 풀이에서는 1
