어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","for를 읽을 때는 “어떤 묶음에서 값을 하나씩 꺼내고, 각 값에 어떤 작업을 하는가”를 먼저 봅니다. 반복 변수 이름은 현재 항목의 의미가 드러나게 정하는 것이 좋습니다.","for i in range(...)처럼 무조건 i를 쓰기보다 for price in prices처럼 실제 의미를 드러내면 코드가 훨씬 빨리 읽힙니다.","앱에서 검색 결과 목록을 그리거나 파일 목록을 처리하거나 여러 종목 데이터를 계산할 때도 같은 순회 구조를 사용합니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p3","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘for는 “각 항목에 같은 규칙 적용”에 강합니다’ 내용을 설명하는 코드에서는 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘for는 “각 항목에 같은 규칙 적용”에 강합니다’ 내용을 설명하는 코드에서는 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘for는 “각 항목에 같은 규칙 적용”에 강합니다’ 내용을 설명하는 코드에서는 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 2/6","title":"range의 끝 값은 포함되지 않습니다","paragraphs":["‘range의 끝 값은 포함되지 않습니다’에서는 첫 코드 for number in range(1, 6):에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","range(5)는 0부터 4까지 다섯 개의 값을 만듭니다. range(1, 5)는 1부터 4까지입니다. 끝 값을 포함하지 않는 규칙을 기억하면 반복 횟수 계산 실수가 줄어듭니다.","시작·끝·간격을 직접 적고 실제로 list(range(...))를 출력해 값이 어떻게 만들어지는지 확인하면 빠르게 익숙해집니다.","0부터 시작하는 인덱스와 함께 쓰일 때 이 규칙이 자연스럽지만, 사람 기준 번호를 출력할 때는 +1이 필요한 경우가 있습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p4","code":"for number in range(1, 6):\n    print(number)","codeNote":"range(1, 6)은 1부터 시작해 6 직전인 5까지 만듭니다.","codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘range의 끝 값은 포함되지 않습니다’ 내용을 설명하는 코드에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘range의 끝 값은 포함되지 않습니다’ 내용을 설명하는 코드에서는 2행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 3/6","title":"while은 종료 조건을 먼저 설계해야 합니다","paragraphs":["‘while은 종료 조건을 먼저 설계해야 합니다’에서는 첫 코드 count = 3에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","while은 조건이 계속 True이면 끝없이 반복될 수 있습니다. 그래서 코드를 쓰기 전에 어떤 값이 변하고 언제 조건이 False가 되는지 먼저 정해야 합니다.","반복 조건에 사용한 변수가 반복문 안에서 실제로 바뀌는지 확인하세요. 바뀌지 않으면 무한 반복이 될 가능성이 큽니다.","재시도 횟수, 사용자 종료 입력, 네트워크 상태처럼 “몇 번”보다 “언제까지”가 중요한 문제에 적합합니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p5","code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘while은 종료 조건을 먼저 설계해야 합니다’ 내용을 설명하는 코드에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘while은 종료 조건을 먼저 설계해야 합니다’ 내용을 설명하는 코드에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘while은 종료 조건을 먼저 설계해야 합니다’ 내용을 설명하는 코드에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘while은 종료 조건을 먼저 설계해야 합니다’ 내용을 설명하는 코드에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘while은 종료 조건을 먼저 설계해야 합니다’ 내용을 설명하는 코드에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 4/6","title":"누적 변수는 반복 전 초기값이 중요합니다","paragraphs":["‘누적 변수는 반복 전 초기값이 중요합니다’에서는 첫 코드 prices = [1200, 800, 2000]에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","합계나 개수를 누적할 때 total = 0, count = 0 같은 초기값을 반복문 밖에 둡니다. 매 반복 안에서 다시 0으로 만들면 이전 결과가 사라집니다.","누적 코드를 읽을 때는 반복 시작 전 값과 각 iteration 뒤 값을 표로 적어 보면 정확하게 추적할 수 있습니다.","합계뿐 아니라 최댓값, 조건을 만족한 개수, 문자열 조합 등 다양한 상태를 반복 중에 누적할 수 있습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p6","code":"prices = [1200, 800, 2000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"total은 0→1200→2000→4000 순서로 바뀝니다.","codeExplain":["1행 「prices = [1200, 800, 2000]」 — 여러 값을 순서대로 담은 리스트 [1200, 800, 2000]을 구한 뒤 결과를 prices라는 변수에 저장합니다. 이 줄 이후에는 prices라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘누적 변수는 반복 전 초기값이 중요합니다’ 내용을 설명하는 코드에서는 1행은 [1200, 800, 2000]에서 만든 결과를 prices에 저장하거나 갱신하는 줄입니다.","2행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘누적 변수는 반복 전 초기값이 중요합니다’ 내용을 설명하는 코드에서는 2행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","4행 「for price in prices:」 — prices에서 값을 하나씩 꺼내 price에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘누적 변수는 반복 전 초기값이 중요합니다’ 내용을 설명하는 코드에서는 4행은 prices에서 값을 하나씩 꺼내 price에 넣기 시작하는 반복 지점입니다.","5행 「total += price」 — 현재 price 값을 처리하는 반복 안에서 현재 total에 price를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다. ‘누적 변수는 반복 전 초기값이 중요합니다’ 내용을 설명하는 코드에서는 5행은 total의 이전 값에 price 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘누적 변수는 반복 전 초기값이 중요합니다’ 내용을 설명하는 코드에서는 7행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 5/6","title":"break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다","paragraphs":["‘break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다’에서는 첫 코드 for number in range(1, 6):에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","break는 반복 전체를 끝내고 continue는 현재 반복만 건너뜁니다. 둘 다 유용하지만 많이 쓰면 흐름이 눈에 잘 안 보일 수 있습니다.","조건과 함께 한두 군데 명확하게 사용하고, 왜 조기 종료하거나 건너뛰는지 변수 이름이나 주석으로 의도를 남기는 편이 좋습니다.","검색에서 원하는 값을 찾자마자 break로 끝내거나, 잘못된 데이터만 continue로 제외하는 패턴이 대표적입니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p7","code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"3에서만 continue가 실행되어 3을 건너뛰고 1, 2, 4, 5가 출력됩니다.","codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다’ 내용을 설명하는 코드에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「if number == 3:」 — number와 3가 같은지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다’ 내용을 설명하는 코드에서는 2행은 number == 3 조건을 기준으로 실행 경로를 나누는 분기입니다.","3행 「continue」 — 바로 위 조건인 ‘number와 3가 같은지’ 경우에서 이번 iteration의 남은 줄만 건너뛰고 다음 값으로 넘어갑니다. 반복 전체를 끝내는 break와 달리 다음 항목은 계속 처리합니다. ‘break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다’ 내용을 설명하는 코드에서는 3행은 현재 항목의 남은 처리를 건너뛰고 다음 반복으로 이동시키는 줄입니다.","4행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘break와 continue는 흐름을 바꾸므로 이유가 보여야 합니다’ 내용을 설명하는 코드에서는 4행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 6/6","title":"반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다","paragraphs":["‘반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다’에서는 첫 코드 tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","10개·100개 데이터를 바로 보지 말고 2~3개짜리 작은 리스트로 각 iteration의 변수와 누적값을 추적하세요. 반복문은 실행 횟수가 많아 보여도 한 번의 규칙이 반복되는 구조입니다.","작은 입력에서 정확히 이해한 뒤 데이터 개수를 늘리면 복잡도가 크게 올라가지 않습니다.","반복문 디버깅에서는 반복 변수와 핵심 누적값을 임시로 print해서 몇 번째 iteration에서 예상과 달라지는지 확인하는 방법도 좋습니다."],"keywords":["loop 반복문","for","while","iteration 반복 1회"],"extras":[],"visibleExtras":2,"id":"t2-c2-p8","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다’ 내용을 설명하는 코드에서는 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다’ 내용을 설명하는 코드에서는 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘반복문은 작은 입력으로 손으로 먼저 돌려보면 쉽습니다’ 내용을 설명하는 코드에서는 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"반복문 for·while의 전체 흐름","paragraphs":["반복문 for·while에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"TOP_TO_BOTTOM","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c2-p9","code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while의 전체 흐름’ 흐름에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘반복문 for·while의 전체 흐름’ 흐름에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while의 전체 흐름’ 흐름에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘반복문 for·while의 전체 흐름’ 흐름에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while의 전체 흐름’ 흐름에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"반복문 for·while를 하나의 코드로 연결합니다","paragraphs":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"visibleExtras":2,"id":"t2-c2-p10","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while를 하나의 코드로 연결합니다’ 예제에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘반복문 for·while를 하나의 코드로 연결합니다’ 예제에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while를 하나의 코드로 연결합니다’ 예제에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘반복문 for·while를 하나의 코드로 연결합니다’ 예제에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while를 하나의 코드로 연결합니다’ 예제에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"반복문 for·while을 직접 바꾸고 확장합니다","paragraphs":["반복문 문제는 첫 반복에서 변수 값이 어떻게 바뀌는지 직접 적어 보면 거의 풀립니다. 두 번째 반복에서도 같은 규칙이 반복된다는 사실을 확인하세요.","합계와 개수는 이전 결과를 기억해야 하므로 total과 count 같은 변수를 반복문 밖에서 먼저 만들고 반복할 때마다 갱신합니다.","range를 사용할 때는 시작값, 끝값, 증가폭을 따로 보세요. 특히 끝값은 포함되지 않으므로 원하는 마지막 숫자보다 하나 크게 적는 경우가 많습니다."],"code":"prices = [9000, 10000, 15000, 3000, 20000]\ntotal = 0\ncount = 0\n\nfor price in prices:\n    if ____:\n        total = ____\n        count = ____\n\nprint(total)\nprint(count)","practicePrompt":"리스트에 금액 5개를 넣고 1만원 이상인 값만 합산하세요. 다음에는 처리한 항목 개수도 count 변수로 함께 세어 평균을 계산해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c2-p11","answerOnNext":true,"codeExplain":["1행 「prices = [9000, 10000, 15000, 3000, 20000]」 — 여러 값을 순서대로 담은 리스트 [9000, 10000, 15000, 3000, 20000]을 구한 뒤 결과를 prices라는 변수에 저장합니다. 이 줄 이후에는 prices라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 실습에서는 1행은 [9000, 10000, 15000, 3000, 20000]에서 만든 결과를 prices에 저장하거나 갱신하는 줄입니다.","2행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 실습에서는 2행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「count = 0」 — 숫자 0을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 실습에서는 3행은 0에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","5행 「for price in prices:」 — prices에서 값을 하나씩 꺼내 price에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","6행 「if ____:」 — ____가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","7행 「total = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","8행 「count = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","10행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","11행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c2-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복문 for·while을 직접 바꾸고 확장합니다 · 풀이","paragraphs":["[]는 여러 값을 순서대로 담는 리스트입니다. for price in prices는 값을 하나씩 price에 연결합니다. 리스트는 다음 자료구조 챕터에서 더 배웁니다.","이 풀이의 count는 조건을 만족해 합산한 항목의 개수입니다. 전체 다섯 항목 수와 구분해야 평균의 분모가 맞습니다.","합산한 금액은 10000, 15000, 20000입니다. 합계 45000을 선택된 3개로 나누면 15000.0입니다.","모든 금액을 10000 미만으로 바꾸면 count가 0입니다. 0으로 나누지 않도록 if count > 0을 먼저 검사합니다."],"code":"prices = [9000, 10000, 15000, 3000, 20000]\ntotal = 0\ncount = 0\nfor price in prices:\n    if price >= 10000:\n        total = total + price\n        count = count + 1\nprint(total)\nprint(count)\nif count > 0:\n    print(total / count)\nelse:\n    print(\"조건에 맞는 금액이 없습니다.\")","codeNote":"실행 결과 또는 테스트 기준\n45000\n3\n15000.0","extras":[],"codeExplain":["1행 「prices = [9000, 10000, 15000, 3000, 20000]」 — 여러 값을 순서대로 담은 리스트 [9000, 10000, 15000, 3000, 20000]을 구한 뒤 결과를 prices라는 변수에 저장합니다. 이 줄 이후에는 prices라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 풀이에서는 1행은 [9000, 10000, 15000, 3000, 20000]에서 만든 결과를 prices에 저장하거나 갱신하는 줄입니다.","2행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 풀이에서는 2행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「count = 0」 — 숫자 0을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 풀이에서는 3행은 0에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","4행 「for price in prices:」 — prices에서 값을 하나씩 꺼내 price에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 풀이에서는 4행은 prices에서 값을 하나씩 꺼내 price에 넣기 시작하는 반복 지점입니다.","5행 「if price >= 10000:」 — price가 10000 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","6행 「total = total + price」 — 바로 위 조건인 ‘price가 10000 이상인지’ 경우에서 이전 total을 그대로 살려 두고 새 값을 더한 결과를 다시 total에 저장합니다. 합계를 반복할 때 이전 결과를 잃지 않기 위한 누적 방식입니다.","7행 「count = count + 1」 — 바로 위 조건인 ‘price가 10000 이상인지’ 경우에서 count를 1 늘립니다. 현재 조건을 만족한 항목 한 개를 새로 발견했다는 뜻입니다.","8행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while을 직접 바꾸고 확장합니다’ 풀이에서는 8행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다.","9행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","10행 「if count > 0:」 — count가 0보다 큰지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","11행 「print(total / count)」 — 계산식 total / count의 결과를 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","12행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다.","13행 「print(\"조건에 맞는 금액이 없습니다.\")」 — 문자열 \"조건에 맞는 금액이 없습니다.\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"kind":"check","eyebrow":"확인 문제","title":"반복문 for·while 핵심을 확인합니다","paragraphs":[],"question":"while count \u003c 3: 안에서 count 값을 전혀 바꾸지 않으면 어떤 문제가 생길 수 있을까요?","extras":[],"visibleExtras":3,"id":"t2-c2-p12","answerOnNext":true,"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while 핵심을 확인합니다’ 확인 문제의 코드에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘반복문 for·while 핵심을 확인합니다’ 확인 문제의 코드에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while 핵심을 확인합니다’ 확인 문제의 코드에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘반복문 for·while 핵심을 확인합니다’ 확인 문제의 코드에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while 핵심을 확인합니다’ 확인 문제의 코드에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"반복문 for·while 핵심을 확인합니다 · 풀이","paragraphs":["count가 계속 같은 값이면 조건 count \u003c 3이 계속 True로 남아 반복문이 끝나지 않는 무한 반복이 될 수 있습니다. while에서는 종료 조건에 영향을 주는 상태가 실제로 변하는지 확인해야 합니다."],"extras":[],"code":"total = 0\n\nfor number in [10, 20, 30]:\n    total += number\n\nprint(total)","codeNote":"total은 0→10→30→60 순서로 바뀝니다. 마지막 출력은 60입니다.","codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문 for·while 핵심을 확인합니다’ 풀이에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「for number in [10, 20, 30]:」 — [10, 20, 30]에서 값을 하나씩 꺼내 number에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","4행 「total += number」 — 현재 number 값을 처리하는 반복 안에서 현재 total에 number를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다.","6행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘반복문 for·while 핵심을 확인합니다’ 풀이에서는 6행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x01","kind":"concept","title":"반복문은 같은 일을 대신 해주는 로봇입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘반복문은 같은 일을 대신 해주는 로봇입니다’에서는 첫 코드 tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","“안녕”을 다섯 번 출력하려고 print를 다섯 줄 쓰는 대신 반복문에게 “이 일을 다섯 번 해”라고 시킬 수 있습니다.","for는 횟수나 대상이 어느 정도 정해져 있을 때 좋고, while은 어떤 조건이 참인 동안 계속해야 할 때 좋습니다.","반복문을 보면 무엇을 반복하는지, 언제 끝나는지, 반복할 때 값이 어떻게 바뀌는지 찾으세요."],"keywords":["for","while","반복","loop"],"extras":[],"code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘반복문은 같은 일을 대신 해주는 로봇입니다’ 내용을 설명하는 코드에서는 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘반복문은 같은 일을 대신 해주는 로봇입니다’ 내용을 설명하는 코드에서는 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘반복문은 같은 일을 대신 해주는 로봇입니다’ 내용을 설명하는 코드에서는 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x02","kind":"example","title":"range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다","eyebrow":"초보 확장 · 예제","paragraphs":["range(5)는 다섯 개 숫자를 만들지만 1부터 5가 아니라 0부터 4입니다.","for i in range(5)는 숫자를 하나씩 i에 넣고 들여쓰기된 코드를 매번 실행합니다.","i는 “지금 처리 중인 값”을 잠깐 담는 상자라고 생각하면 됩니다."],"code":"for number in range(1, 6):\n    print(number)","codeNote":"range(1, 6)은 1부터 시작해 6 직전인 5까지 만듭니다.","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다’ 예제에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘range(5)는 0, 1, 2, 3, 4를 차례로 꺼냅니다’ 예제에서는 2행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x03","kind":"concept","title":"카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’에서는 첫 코드 prices = [1200, 800, 2000]에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","카운터는 몇 번 했는지 셉니다. count += 1처럼 매번 1씩 늘립니다.","누적값은 여러 값을 계속 더해 모읍니다. total += price처럼 지금까지 합계를 저장합니다.","반복문 밖에서 시작값을 만들고 안에서 조금씩 바꾸는 모양을 익히면 합계와 평균 문제가 쉬워집니다."],"extras":[],"code":"prices = [1200, 800, 2000]\ntotal = 0\n\nfor price in prices:\n    total += price\n\nprint(total)","codeNote":"total은 0→1200→2000→4000 순서로 바뀝니다.","codeExplain":["1행 「prices = [1200, 800, 2000]」 — 여러 값을 순서대로 담은 리스트 [1200, 800, 2000]을 구한 뒤 결과를 prices라는 변수에 저장합니다. 이 줄 이후에는 prices라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’ 내용을 설명하는 코드에서는 1행은 [1200, 800, 2000]에서 만든 결과를 prices에 저장하거나 갱신하는 줄입니다.","2행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’ 내용을 설명하는 코드에서는 2행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","4행 「for price in prices:」 — prices에서 값을 하나씩 꺼내 price에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’ 내용을 설명하는 코드에서는 4행은 prices에서 값을 하나씩 꺼내 price에 넣기 시작하는 반복 지점입니다.","5행 「total += price」 — 현재 price 값을 처리하는 반복 안에서 현재 total에 price를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다. ‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’ 내용을 설명하는 코드에서는 5행은 total의 이전 값에 price 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘카운터와 누적값은 반복문에서 가장 자주 쓰는 두 상자입니다’ 내용을 설명하는 코드에서는 7행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x04","kind":"example","title":"1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["total은 처음 0이고, 1을 더해 1, 2를 더해 3, 3을 더해 6이 됩니다.","마지막 15만 보지 말고 0→1→3→6→10→15로 변하는 흐름을 보세요.","값 변화를 종이에 적어 따라가는 것을 추적이라고 합니다."],"code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","extras":[],"codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다’ 예제에서는 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다’ 예제에서는 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘1부터 5까지 더하면서 total이 어떻게 바뀌는지 봅니다’ 예제에서는 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x05","kind":"concept","title":"while은 조건이 True인 동안 계속 돕니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘while은 조건이 True인 동안 계속 돕니다’에서는 첫 코드 count = 3에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","while은 “몇 번”보다 “언제까지”가 중요한 반복에 잘 맞습니다.","while 뒤 조건이 계속 True라면 끝나지 않는 무한 반복이 생깁니다.","조건을 언젠가 False로 만드는 값 변화가 반복문 안에 있는지 꼭 확인하세요."],"calloutTitle":"while 안전 질문","calloutBody":"반복할 때마다 조건에 쓰인 값이 실제로 바뀌는가?","extras":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘while은 조건이 True인 동안 계속 돕니다’ 내용을 설명하는 코드에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘while은 조건이 True인 동안 계속 돕니다’ 내용을 설명하는 코드에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘while은 조건이 True인 동안 계속 돕니다’ 내용을 설명하는 코드에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘while은 조건이 True인 동안 계속 돕니다’ 내용을 설명하는 코드에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘while은 조건이 True인 동안 계속 돕니다’ 내용을 설명하는 코드에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x06","kind":"example","title":"카운트다운으로 while의 종료 조건을 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["count가 3에서 시작하고 count > 0인 동안 반복합니다.","반복 안에서 count -= 1을 하므로 3→2→1→0으로 줄어듭니다.","0이 되면 조건이 False가 되어 반복이 끝납니다."],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘카운트다운으로 while의 종료 조건을 봅니다’ 예제에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘카운트다운으로 while의 종료 조건을 봅니다’ 예제에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘카운트다운으로 while의 종료 조건을 봅니다’ 예제에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘카운트다운으로 while의 종료 조건을 봅니다’ 예제에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘카운트다운으로 while의 종료 조건을 봅니다’ 예제에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x07","kind":"practice","title":"1부터 5까지 한 줄씩 출력해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["for와 range를 이용해 1, 2, 3, 4, 5를 순서대로 출력합니다.","range의 끝 숫자는 포함되지 않는다는 점을 떠올리세요."],"practicePrompt":"range(...)에 어떤 시작값과 끝값을 넣어야 1부터 5가 나오는지 생각한 뒤 코드를 작성하세요.","answerOnNext":true,"extras":[],"code":"for number in range(____, ____):\n    print(number)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「for number in range(____, ____):」 — range(____, ____)가 만드는 숫자를 하나씩 number에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","2행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘1부터 5까지 한 줄씩 출력해 보세요’ 실습에서는 2행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x08","kind":"solution","title":"1부터 5까지 한 줄씩 출력해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["range(1, 6)은 1에서 시작해 6 직전에서 멈춥니다.","for는 값을 하나씩 number에 넣습니다.","print(number)는 매 반복의 현재 값을 보여 줍니다.","for는 반복할 값 묶음에서 첫 값을 꺼내 변수에 넣고 들여쓰기된 코드를 실행합니다. 끝나면 다음 값을 넣고 같은 코드를 다시 실행합니다. 더 꺼낼 값이 없으면 반복이 끝납니다.","while은 반복 전에 조건을 확인하고 True이면 본문을 실행합니다. 본문 실행 뒤 다시 조건을 검사합니다. 조건에 사용되는 값이 바뀌어야 언젠가 False가 되어 멈출 수 있습니다."],"code":"for number in range(1, 6):\n    print(number)","codeNote":"1\n2\n3\n4\n5","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘1부터 5까지 한 줄씩 출력해 보세요’ 풀이에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘1부터 5까지 한 줄씩 출력해 보세요’ 풀이에서는 2행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x09","kind":"practice","title":"짝수만 더해서 합계를 구해 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["2, 4, 6, 8, 10의 합을 구합니다. total은 0에서 시작합니다.","range(2, 11, 2)의 세 번째 값 2는 “2씩 증가”라는 뜻입니다."],"practicePrompt":"for와 total을 사용해 2부터 10까지 짝수의 합을 구하세요.","answerOnNext":true,"extras":[],"code":"total = 0\n\nfor number in range(____, ____, ____):\n    total = ____\n\nprint(total)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘짝수만 더해서 합계를 구해 보세요’ 실습에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「for number in range(____, ____, ____):」 — range(____, ____, ____)가 만드는 숫자를 하나씩 number에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","4행 「total = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","6행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘짝수만 더해서 합계를 구해 보세요’ 실습에서는 6행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x10","kind":"solution","title":"짝수만 더해서 합계를 구해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["range(2, 11, 2)는 2, 4, 6, 8, 10을 만듭니다.","total += number는 total = total + number와 같은 뜻입니다.","반복이 끝나면 total은 30입니다."],"code":"total = 0\nfor number in range(2, 11, 2):\n    total += number\nprint(total)","codeNote":"예상 출력: 30","extras":[],"codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘짝수만 더해서 합계를 구해 보세요’ 풀이에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","2행 「for number in range(2, 11, 2):」 — range(2, 11, 2)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 2, 4, 6, 8, 10입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","3행 「total += number」 — 현재 number 값을 처리하는 반복 안에서 현재 total에 number를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다.","4행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c2-x11","kind":"check","title":"break와 continue의 차이를 구분해 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["break는 반복문 전체를 즉시 끝냅니다.","continue는 이번 한 번만 건너뛰고 다음 반복으로 갑니다.","둘 다 흐름을 바꾸므로 왜 필요한지 설명할 수 있을 때 쓰는 것이 좋습니다."],"question":"1부터 5를 도는 중 number가 3일 때 continue를 실행하면 어떤 숫자들이 출력될까요?","answerOnNext":true,"extras":[],"code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"3에서만 continue가 실행되어 3을 건너뛰고 1, 2, 4, 5가 출력됩니다.","codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘break와 continue의 차이를 구분해 보세요’ 확인 문제의 코드에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「if number == 3:」 — number와 3가 같은지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘break와 continue의 차이를 구분해 보세요’ 확인 문제의 코드에서는 2행은 number == 3 조건을 기준으로 실행 경로를 나누는 분기입니다.","3행 「continue」 — 바로 위 조건인 ‘number와 3가 같은지’ 경우에서 이번 iteration의 남은 줄만 건너뛰고 다음 값으로 넘어갑니다. 반복 전체를 끝내는 break와 달리 다음 항목은 계속 처리합니다. ‘break와 continue의 차이를 구분해 보세요’ 확인 문제의 코드에서는 3행은 현재 항목의 남은 처리를 건너뛰고 다음 반복으로 이동시키는 줄입니다.","4행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘break와 continue의 차이를 구분해 보세요’ 확인 문제의 코드에서는 4행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x12","kind":"solution","title":"break와 continue의 차이를 구분해 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["1과 2는 정상 출력합니다.","3에서는 continue로 print를 건너뜁니다.","반복은 끝나지 않아서 4와 5가 다시 출력됩니다."],"code":"for number in range(1, 6):\n    if number == 3:\n        continue\n    print(number)","codeNote":"1\n2\n4\n5","extras":[],"codeExplain":["1행 「for number in range(1, 6):」 — range(1, 6)가 만드는 숫자를 하나씩 number에 넣습니다. 실제 순서는 1, 2, 3, 4, 5입니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘break와 continue의 차이를 구분해 보세요’ 풀이에서는 1행은 range(1, 6)에서 값을 하나씩 꺼내 number에 넣기 시작하는 반복 지점입니다.","2행 「if number == 3:」 — number와 3가 같은지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘break와 continue의 차이를 구분해 보세요’ 풀이에서는 2행은 number == 3 조건을 기준으로 실행 경로를 나누는 분기입니다.","3행 「continue」 — 바로 위 조건인 ‘number와 3가 같은지’ 경우에서 이번 iteration의 남은 줄만 건너뛰고 다음 값으로 넘어갑니다. 반복 전체를 끝내는 break와 달리 다음 항목은 계속 처리합니다. ‘break와 continue의 차이를 구분해 보세요’ 풀이에서는 3행은 현재 항목의 남은 처리를 건너뛰고 다음 반복으로 이동시키는 줄입니다.","4행 「print(number)」 — number의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘break와 continue의 차이를 구분해 보세요’ 풀이에서는 4행은 number의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x13","kind":"concept","title":"for와 while 중 무엇을 쓸지 이렇게 고릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’에서는 첫 코드 count = 3에서 시작해 한 번의 반복에서 어떤 값이 변수에 들어오고 다음 반복에서 무엇이 달라지는지 차례대로 봅니다. 반복문은 여러 번 실행된다는 사실보다 각 iteration의 값 변화를 따라가는 것이 핵심입니다.","목록을 하나씩 처리하거나 정해진 횟수만큼 반복하면 for가 보통 쉽습니다.","맞는 입력이 나올 때까지처럼 종료가 조건에 달려 있으면 while이 자연스럽습니다.","초보 단계에서는 “횟수·목록 = for, 조건이 끝날 때까지 = while”로 시작하면 충분합니다."],"extras":[],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’ 내용을 설명하는 코드에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’ 내용을 설명하는 코드에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’ 내용을 설명하는 코드에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’ 내용을 설명하는 코드에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘for와 while 중 무엇을 쓸지 이렇게 고릅니다’ 내용을 설명하는 코드에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c2-x14","kind":"example","title":"비밀번호 시도 횟수를 while로 제한합니다","eyebrow":"초보 확장 · 예제","paragraphs":["attempts가 0에서 시작하고 3보다 작은 동안 입력을 받을 수 있습니다.","틀릴 때마다 attempts를 1 늘립니다. 세 번째로 틀렸을 때 “시도 횟수 초과”를 출력합니다.","정답을 입력하면 break로 반복을 즉시 끝냅니다. 초보 단계에서는 while 뒤의 별도 else 문법 없이 이 흐름부터 익히면 충분합니다."],"code":"count = 3\n\nwhile count > 0:\n    print(count)\n    count -= 1\n\nprint(\"끝\")","codeNote":"count가 3→2→1→0으로 바뀌고 0에서 조건이 False가 되어 반복이 끝납니다.","extras":[],"codeExplain":["1행 「count = 3」 — 숫자 3을 구한 뒤 결과를 count라는 변수에 저장합니다. 이 줄 이후에는 count라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘비밀번호 시도 횟수를 while로 제한합니다’ 예제에서는 1행은 3에서 만든 결과를 count에 저장하거나 갱신하는 줄입니다.","3행 「while count > 0:」 — count가 0보다 큰지 확인하고 True인 동안 아래 블록을 반복합니다. 반복이 끝나려면 보통 블록 안에서 이 조건에 쓰인 값이 바뀌어 언젠가 False가 되어야 합니다. ‘비밀번호 시도 횟수를 while로 제한합니다’ 예제에서는 3행은 count > 0 조건을 매번 다시 확인해 반복을 계속할지 끝낼지 정합니다.","4행 「print(count)」 — count의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘비밀번호 시도 횟수를 while로 제한합니다’ 예제에서는 4행은 count의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「count -= 1」 — 현재 count에서 1을 빼 새 값을 다시 count에 저장합니다. 이 값이 while 조건에 다시 사용되므로 반복이 한 번씩 종료 지점에 가까워집니다. ‘비밀번호 시도 횟수를 while로 제한합니다’ 예제에서는 5행은 count의 이전 값에 1 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(\"끝\")」 — 문자열 \"끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘비밀번호 시도 횟수를 while로 제한합니다’ 예제에서는 7행은 \"끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"summary","eyebrow":"Chapter 2 정리","title":"지금 알아야 할 것","paragraphs":["반복문 for·while 챕터의 목표는 문법을 외우는 것이 아니라 “반복 작업을 for와 while로 표현하고, 반복 범위·종료 조건·누적 상태를 안전하게 추적한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 함수 만들기로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["반복 작업을 for와 while로 표현하고, 반복 범위·종료 조건·누적 상태를 안전하게 추적한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c2-p13","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘지금 알아야 할 것’ 정리 코드에서는 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"반복을 문제 안에서 발견하고 작은 작업을 반복시키는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"리스트 순회, while 반복, 누적 처리와 조건 결합을 실제 데이터 흐름으로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복 작업을 자동화 도구로 바꾸고 완성 코드를 연습으로 이어가는 방식 참고"}]}],"track":2,"id":"t2-c2","remember":"range의 끝 제외, 종료 조건","practiceGoal":"금액 필터·합계·평균과 변수 추적","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"반복을 문제 안에서 발견하고 작은 작업을 반복시키는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"리스트 순회, while 반복, 누적 처리와 조건 결합을 실제 데이터 흐름으로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복 작업을 자동화 도구로 바꾸고 완성 코드를 연습으로 이어가는 방식 참고"}]},{"chapter":3,"title":"함수 만들기","pages":[{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이번 단어장에서는 function 함수, def, parameter 매개변수를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"function 함수","description":"함수는 여러 줄의 작업을 하나의 이름으로 묶어 둔 작은 도구입니다. 배송비 계산 코드를 shipping_fee라는 이름으로 만들면 다음부터 그 이름을 불러 같은 작업을 사용할 수 있습니다. 큰 문제를 작은 역할로 나누는 데도 도움이 됩니다.","usage":"반복되는 계산이나 의미 있는 기능을 재사용할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: def calc_total(...): 로 합계 계산 규칙을 함수로 만들 수 있습니다."},{"term":"def","description":"def는 ‘지금부터 새 함수를 만들겠다’고 Python에 알려 주는 키워드입니다. 함수 이름과 입력받을 자리를 적고 아래 들여쓰기 블록에 실제 동작을 작성합니다. 정의만 했다고 함수가 바로 실행되는 것은 아닙니다.","usage":"새로운 기능 단위를 만들 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: def greet(name): 는 name을 받는 greet 함수를 정의합니다."},{"term":"parameter 매개변수","description":"parameter는 함수를 만들 때 미리 준비하는 입력 자리 이름입니다. def greet(name):에서 name은 아직 실제 값이 아니라 나중에 값이 들어올 빈 자리입니다.","usage":"함수가 여러 입력값으로 재사용되도록 만들 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: def add(a, b): 에서 a와 b가 parameter입니다."}],"extras":[],"visibleExtras":2,"id":"t2-c3-p1","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. function 함수, def, parameter 매개변수를 실제 코드와 연결해서 보면 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. function 함수, def, parameter 매개변수를 실제 코드와 연결해서 보면 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. function 함수, def, parameter 매개변수를 실제 코드와 연결해서 보면 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. function 함수, def, parameter 매개변수를 실제 코드와 연결해서 보면 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["이번 단어장에서는 argument 인자, return 반환, scope 범위를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"argument 인자","description":"argument는 함수를 실제로 호출할 때 parameter 자리에 넣는 실제 값입니다. greet(\"민수\")에서 \"민수\"가 argument입니다. parameter가 빈칸 이름이라면 argument는 그 빈칸에 넣는 내용입니다.","usage":"함수에 실제 데이터를 넣어 실행할 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: add(3, 5)의 3과 5가 argument입니다."},{"term":"return 반환","description":"return은 함수 안에서 만든 결과를 호출한 곳으로 돌려주고 함수 실행을 끝냅니다. print와 달리 return된 값은 변수에 저장하거나 다음 계산에 다시 사용할 수 있습니다.","usage":"함수 결과를 다른 계산이나 변수에 다시 사용할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: return total은 계산한 total 값을 호출한 코드에 돌려줍니다."},{"term":"scope 범위","description":"scope는 변수 이름이 통하는 구역입니다. 함수 안에서 만든 변수는 보통 그 함수 안에서만 사용되고, 함수 밖의 같은 이름과 별개일 수 있습니다. 아파트 동이 다르면 같은 301호라도 다른 집인 것과 비슷합니다.","usage":"변수 충돌과 데이터 흐름을 이해할 때 중요합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 함수 안의 subtotal은 함수 호출이 끝난 뒤 바깥에서 바로 사용할 수 없습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c3-p2","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. argument 인자, return 반환, scope 범위를 실제 코드와 연결해서 보면 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. argument 인자, return 반환, scope 범위를 실제 코드와 연결해서 보면 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. argument 인자, return 반환, scope 범위를 실제 코드와 연결해서 보면 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. argument 인자, return 반환, scope 범위를 실제 코드와 연결해서 보면 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 1/6","title":"함수는 코드에 이름을 붙이는 방법입니다","paragraphs":["‘함수는 코드에 이름을 붙이는 방법입니다’에서는 첫 코드 def double(number):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","함수는 단순히 줄 수를 줄이는 도구가 아니라 “이 코드 묶음이 무슨 일을 하는가”에 이름을 붙이는 방법입니다. calc_shipping, format_name처럼 기능이 드러나는 이름은 코드 자체를 설명서처럼 만듭니다.","한 함수에는 가능한 한 하나의 명확한 책임을 주는 편이 좋습니다. 입력, 계산, 출력, 파일 저장을 모두 한 함수에 넣으면 수정할 때 영향 범위를 파악하기 어렵습니다.","실제 앱에서도 버튼 처리, 데이터 변환, API 호출 등 기능을 작은 함수로 나누면 테스트와 재사용이 쉬워집니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p3","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수는 코드에 이름을 붙이는 방법입니다’ 내용을 설명하는 코드에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수는 코드에 이름을 붙이는 방법입니다’ 내용을 설명하는 코드에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수는 코드에 이름을 붙이는 방법입니다’ 내용을 설명하는 코드에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수는 코드에 이름을 붙이는 방법입니다’ 내용을 설명하는 코드에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 2/6","title":"정의와 호출은 서로 다른 시점입니다","paragraphs":["‘정의와 호출은 서로 다른 시점입니다’에서는 첫 코드 def greet():에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","def로 함수를 정의했다고 바로 내부 코드가 실행되는 것은 아닙니다. 함수는 호출해야 실행됩니다. 코드를 읽을 때 “정의하는 줄”과 “실제로 호출하는 줄”을 구분하세요.","함수 호출이 시작되면 argument가 parameter에 연결되고, 함수 본문이 위에서 아래로 실행된 뒤 return 값이 호출 위치로 돌아옵니다.","이 흐름을 화살표로 그리면 함수가 많아져도 현재 어디에서 실행 중인지 추적하기 쉽습니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p4","code":"def greet():\n    print(\"안녕하세요\")\n\nprint(\"함수 정의 끝\")\ngreet()","codeNote":"def 구간은 기능을 등록하는 단계이고, greet()를 만났을 때 함수 본문이 실행됩니다.","codeExplain":["1행 「def greet():」 — greet이라는 새 함수를 정의합니다. 괄호가 비어 있으므로 외부 입력 없이 호출하는 함수입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘정의와 호출은 서로 다른 시점입니다’ 내용을 설명하는 코드에서는 1행은 greet 함수의 이름과 입력 자리 없음을 정하는 함수 입구입니다.","2행 「print(\"안녕하세요\")」 — 문자열 \"안녕하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘정의와 호출은 서로 다른 시점입니다’ 내용을 설명하는 코드에서는 2행은 \"안녕하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「print(\"함수 정의 끝\")」 — 문자열 \"함수 정의 끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘정의와 호출은 서로 다른 시점입니다’ 내용을 설명하는 코드에서는 4행은 \"함수 정의 끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「greet()」 — greet 함수를 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘정의와 호출은 서로 다른 시점입니다’ 내용을 설명하는 코드에서는 5행은 greet() 동작을 맡는 부분입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 3/6","title":"return과 print는 역할이 다릅니다","paragraphs":["‘return과 print는 역할이 다릅니다’에서는 첫 코드 def add(a, b):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","print는 화면에 값을 보여 주고, return은 값을 호출한 코드에 전달합니다. 함수 내부에서 print만 하면 사람은 결과를 볼 수 있지만 다른 코드가 그 값을 계산에 재사용하기 어렵습니다.","계산 함수는 return으로 결과를 돌려주고, 화면 출력은 호출한 쪽에서 필요할 때 수행하는 구조가 재사용에 유리합니다.","result = add(3, 5)처럼 반환값을 변수에 담으면 그 결과를 다시 저장·비교·계산할 수 있습니다.","return 없이 함수 끝에 도달하면 호출 결과는 None입니다. None은 “반환할 값을 따로 주지 않았다”는 특별한 값입니다. print() 자체의 반환값도 None입니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p5","code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","codeExplain":["1행 「def add(a, b):」 — add이라는 새 함수를 정의합니다. 괄호 안 a, b는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘return과 print는 역할이 다릅니다’ 내용을 설명하는 코드에서는 1행은 add 함수의 이름과 입력 자리 a, b을 정하는 함수 입구입니다.","2행 「return a + b」 — 계산식 a + b의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘return과 print는 역할이 다릅니다’ 내용을 설명하는 코드에서는 2행은 a + b 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「result = add(3, 5)」 — add 함수를 3, 5와 함께 호출한 결과을 구한 뒤 결과를 result라는 변수에 저장합니다. 이 줄 이후에는 result라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘return과 print는 역할이 다릅니다’ 내용을 설명하는 코드에서는 4행은 add(3, 5)에서 만든 결과를 result에 저장하거나 갱신하는 줄입니다.","5행 「print(result)」 — result의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘return과 print는 역할이 다릅니다’ 내용을 설명하는 코드에서는 5행은 result의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 4/6","title":"매개변수는 함수를 특정 값에서 독립시킵니다","paragraphs":["‘매개변수는 함수를 특정 값에서 독립시킵니다’에서는 첫 코드 def greet(name):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","함수 안에 price = 10000처럼 고정값을 넣으면 그 함수는 한 상황에만 맞습니다. price를 parameter로 받으면 다양한 값에 같은 규칙을 적용할 수 있습니다.","함수에 정말 필요한 값만 전달하면 외부 상태에 덜 의존하고, 어떤 입력으로 어떤 결과가 나오는지 테스트하기 쉬워집니다.","매개변수가 너무 많아지면 함수의 책임이 넓어진 신호일 수 있으므로 기능을 나눌지 검토합니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p6","code":"def greet(name):\n    print(\"안녕하세요,\", name)\n\ngreet(\"민수\")\ngreet(\"영희\")","codeNote":"같은 함수에 다른 이름을 넣어 두 번 재사용합니다. name이 매번 다른 값을 받습니다.","codeExplain":["1행 「def greet(name):」 — greet이라는 새 함수를 정의합니다. 괄호 안 name는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘매개변수는 함수를 특정 값에서 독립시킵니다’ 내용을 설명하는 코드에서는 1행은 greet 함수의 이름과 입력 자리 name을 정하는 함수 입구입니다.","2행 「print(\"안녕하세요,\", name)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"안녕하세요,\", 2번째는 name의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘매개변수는 함수를 특정 값에서 독립시킵니다’ 내용을 설명하는 코드에서는 2행은 \"안녕하세요,\", name의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「greet(\"민수\")」 — greet 함수를 \"민수\"와 함께 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘매개변수는 함수를 특정 값에서 독립시킵니다’ 내용을 설명하는 코드에서는 4행은 greet(\"민수\") 동작을 맡는 부분입니다.","5행 「greet(\"영희\")」 — greet 함수를 \"영희\"와 함께 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘매개변수는 함수를 특정 값에서 독립시킵니다’ 내용을 설명하는 코드에서는 5행은 greet(\"영희\") 동작을 맡는 부분입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 5/6","title":"지역 변수는 함수 내부의 작업 공간입니다","paragraphs":["‘지역 변수는 함수 내부의 작업 공간입니다’에서는 첫 코드 def make_total(price, count):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","함수 내부에서 만든 변수는 보통 그 함수 안에서만 사용됩니다. 이 지역성 덕분에 다른 함수의 같은 이름과 충돌하지 않고 내부 계산을 안전하게 숨길 수 있습니다.","함수 밖의 전역 변수를 직접 바꾸는 코드가 많아지면 입력과 출력이 보이지 않아 디버깅이 어려워집니다.","입력을 parameter로 받고 결과를 return하는 패턴은 데이터 흐름을 분명하게 만들어 줍니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p7","code":"def make_total(price, count):\n    total = price * count\n    return total\n\nprint(make_total(2000, 3))","codeNote":"total은 함수 안에서만 쓰는 작업용 변수이고, 밖으로 필요한 값은 return으로 전달합니다.","codeExplain":["1행 「def make_total(price, count):」 — make_total이라는 새 함수를 정의합니다. 괄호 안 price, count는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다.","2행 「total = price * count」 — 계산식 price * count의 결과를 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「return total」 — total의 현재 값을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","5행 「print(make_total(2000, 3))」 — make_total 함수를 2000, 3와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 6/6","title":"함수는 작게 만들고 예제로 테스트합니다","paragraphs":["‘함수는 작게 만들고 예제로 테스트합니다’에서는 첫 코드 def subtotal(count, price):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","함수를 만든 뒤 대표 입력, 경계값, 잘못된 입력을 각각 넣어 기대 결과와 비교하세요. 함수는 독립된 작은 단위라 테스트하기 좋습니다.","긴 프로그램 전체를 실행해서 확인하는 것보다 함수 하나의 입력과 출력만 검증하면 원인을 훨씬 빠르게 좁힐 수 있습니다.","나중에 자동 테스트를 배울 때도 “작은 함수 + 명확한 입력/출력” 구조가 큰 장점이 됩니다."],"keywords":["function 함수","def","parameter 매개변수","argument 인자"],"extras":[],"visibleExtras":2,"id":"t2-c3-p8","code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","codeExplain":["1행 「def subtotal(count, price):」 — subtotal이라는 새 함수를 정의합니다. 괄호 안 count, price는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 1행은 subtotal 함수의 이름과 입력 자리 count, price을 정하는 함수 입구입니다.","2행 「return count * price」 — 계산식 count * price의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 2행은 count * price 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「def add_fee(amount):」 — add_fee이라는 새 함수를 정의합니다. 괄호 안 amount는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 4행은 add_fee 함수의 이름과 입력 자리 amount을 정하는 함수 입구입니다.","5행 「return amount + 3000」 — 계산식 amount + 3000의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 5행은 amount + 3000 결과를 함수 밖으로 돌려주는 함수 출구입니다.","7행 「base = subtotal(2, 5000)」 — subtotal 함수를 2, 5000와 함께 호출한 결과을 구한 뒤 결과를 base라는 변수에 저장합니다. 이 줄 이후에는 base라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 7행은 subtotal(2, 5000)에서 만든 결과를 base에 저장하거나 갱신하는 줄입니다.","8행 「print(add_fee(base))」 — add_fee 함수를 base와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수는 작게 만들고 예제로 테스트합니다’ 내용을 설명하는 코드에서는 8행은 add_fee(base)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"함수 만들기의 전체 흐름","paragraphs":["함수 만들기에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"CODE_TO_OUTPUT","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c3-p9","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기의 전체 흐름’ 흐름에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 만들기의 전체 흐름’ 흐름에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수 만들기의 전체 흐름’ 흐름에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기의 전체 흐름’ 흐름에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"함수 만들기를 하나의 코드로 연결합니다","paragraphs":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","extras":[],"visibleExtras":2,"id":"t2-c3-p10","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기를 하나의 코드로 연결합니다’ 예제에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 만들기를 하나의 코드로 연결합니다’ 예제에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수 만들기를 하나의 코드로 연결합니다’ 예제에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 하나의 코드로 연결합니다’ 예제에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"함수 만들기를 직접 바꾸고 확장합니다","paragraphs":["함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다.","같은 함수를 여러 값으로 호출해도 함수 안 규칙은 같습니다. 입력값만 달라지고 같은 계산 과정을 거쳐 새로운 결과가 나옵니다.","return이 실행되면 함수는 값을 밖으로 돌려주고 그 자리에서 끝납니다. 단순히 화면에 보여 주는 print와 역할이 다릅니다."],"code":"def calc_shipping(total):\n    if ____:\n        return ____\n    return ____\n\nprint(calc_shipping(49999))\nprint(calc_shipping(50000))\nprint(calc_shipping(50001))","practicePrompt":"배송비를 계산하는 calc_shipping(total) 함수를 만드세요. 5만원 이상이면 0, 그보다 작으면 3000을 return하도록 만들고 여러 금액으로 테스트하세요.","extras":[],"visibleExtras":2,"id":"t2-c3-p11","answerOnNext":true,"codeExplain":["1행 「def calc_shipping(total):」 — calc_shipping이라는 새 함수를 정의합니다. 괄호 안 total는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 1행은 calc_shipping 함수의 이름과 입력 자리 total을 정하는 함수 입구입니다.","2행 「if ____:」 — ____가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 2행은 ____ 조건을 기준으로 실행 경로를 나누는 분기입니다.","3행 「return ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 3행은 ____ 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「return ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","6행 「print(calc_shipping(49999))」 — calc_shipping 함수를 49999와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 6행은 calc_shipping(49999)의 실제 결과를 화면에서 확인하는 출력 단계입니다.","7행 「print(calc_shipping(50000))」 — calc_shipping 함수를 50000와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 7행은 calc_shipping(50000)의 실제 결과를 화면에서 확인하는 출력 단계입니다.","8행 「print(calc_shipping(50001))」 — calc_shipping 함수를 50001와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 실습에서는 8행은 calc_shipping(50001)의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c3-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수 만들기를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["def는 함수를 정의하고, calc_shipping(49999)는 그 함수를 호출합니다.","49999가 매개변수 total에 연결됩니다. 조건이 False라 마지막 return 3000까지 갑니다.","50000은 조건이 True여서 return 0을 만나 즉시 함수를 끝냅니다. 아래 return 3000은 실행되지 않습니다."],"code":"def calc_shipping(total):\n    if total >= 50000:\n        return 0\n    return 3000\n\nprint(calc_shipping(49999))\nprint(calc_shipping(50000))\nprint(calc_shipping(50001))","codeNote":"실행 결과 또는 테스트 기준\n3000\n0\n0","extras":[],"codeExplain":["1행 「def calc_shipping(total):」 — calc_shipping이라는 새 함수를 정의합니다. 괄호 안 total는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 풀이에서는 1행은 calc_shipping 함수의 이름과 입력 자리 total을 정하는 함수 입구입니다.","2행 「if total >= 50000:」 — total가 50000 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","3행 「return 0」 — 숫자 0을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","4행 「return 3000」 — 숫자 3000을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","6행 「print(calc_shipping(49999))」 — calc_shipping 함수를 49999와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 풀이에서는 6행은 calc_shipping(49999)의 실제 결과를 화면에서 확인하는 출력 단계입니다.","7행 「print(calc_shipping(50000))」 — calc_shipping 함수를 50000와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 풀이에서는 7행은 calc_shipping(50000)의 실제 결과를 화면에서 확인하는 출력 단계입니다.","8행 「print(calc_shipping(50001))」 — calc_shipping 함수를 50001와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기를 직접 바꾸고 확장합니다’ 풀이에서는 8행은 calc_shipping(50001)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"check","eyebrow":"확인 문제","title":"함수 만들기 핵심을 확인합니다","paragraphs":[],"question":"함수 안에서 print(total)만 하고 return을 쓰지 않으면 total 값을 함수 밖 계산에서 바로 재사용하기 어려운 이유는 무엇일까요?","extras":[],"visibleExtras":3,"id":"t2-c3-p12","answerOnNext":true,"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기 핵심을 확인합니다’ 확인 문제의 코드에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 만들기 핵심을 확인합니다’ 확인 문제의 코드에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수 만들기 핵심을 확인합니다’ 확인 문제의 코드에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기 핵심을 확인합니다’ 확인 문제의 코드에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"함수 만들기 핵심을 확인합니다 · 풀이","paragraphs":["print는 화면에 보여 주는 동작입니다. return 없이 끝나는 함수도 호출 결과는 있으며 그 값이 None입니다. 계산 결과를 함수 밖에서 쓰려면 return total처럼 그 값을 명시적으로 돌려줘야 합니다."],"extras":[],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"3은 a에, 5는 b에 들어갑니다. return이 8을 돌려주고 result에 저장됩니다.","codeExplain":["1행 「def add(a, b):」 — add이라는 새 함수를 정의합니다. 괄호 안 a, b는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 만들기 핵심을 확인합니다’ 풀이에서는 1행은 add 함수의 이름과 입력 자리 a, b을 정하는 함수 입구입니다.","2행 「return a + b」 — 계산식 a + b의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 만들기 핵심을 확인합니다’ 풀이에서는 2행은 a + b 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「result = add(3, 5)」 — add 함수를 3, 5와 함께 호출한 결과을 구한 뒤 결과를 result라는 변수에 저장합니다. 이 줄 이후에는 result라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수 만들기 핵심을 확인합니다’ 풀이에서는 4행은 add(3, 5)에서 만든 결과를 result에 저장하거나 갱신하는 줄입니다.","5행 「print(result)」 — result의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 만들기 핵심을 확인합니다’ 풀이에서는 5행은 result의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x01","kind":"concept","title":"함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다’에서는 첫 코드 def double(number):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","같은 코드를 반복해서 쓰기보다 코드 묶음에 이름을 붙이면 필요할 때 이름만 불러 쓸 수 있습니다.","def는 함수를 만드는 표시입니다. 만들기만 해서는 실행되지 않고 함수 이름 뒤에 ()를 붙여 호출해야 합니다.","함수의 핵심은 코드를 짧게 만드는 것보다 “이 부분이 무슨 일을 하는지 이름으로 설명”하는 것입니다."],"keywords":["def","함수","호출","return"],"extras":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다’ 내용을 설명하는 코드에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다’ 내용을 설명하는 코드에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다’ 내용을 설명하는 코드에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수는 자주 하는 일을 이름 붙여 둔 작은 기계입니다’ 내용을 설명하는 코드에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x02","kind":"example","title":"함수를 만드는 것과 실행하는 것은 다른 일입니다","eyebrow":"초보 확장 · 예제","paragraphs":["greet 함수를 정의하면 Python은 그 기능을 기억합니다.","greet()를 만났을 때 비로소 함수 안 print가 실행됩니다.","두 번 호출하면 두 번 실행됩니다."],"code":"def greet():\n    print(\"안녕하세요\")\n\nprint(\"함수 정의 끝\")\ngreet()","codeNote":"def 구간은 기능을 등록하는 단계이고, greet()를 만났을 때 함수 본문이 실행됩니다.","extras":[],"codeExplain":["1행 「def greet():」 — greet이라는 새 함수를 정의합니다. 괄호가 비어 있으므로 외부 입력 없이 호출하는 함수입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수를 만드는 것과 실행하는 것은 다른 일입니다’ 예제에서는 1행은 greet 함수의 이름과 입력 자리 없음을 정하는 함수 입구입니다.","2행 「print(\"안녕하세요\")」 — 문자열 \"안녕하세요\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수를 만드는 것과 실행하는 것은 다른 일입니다’ 예제에서는 2행은 \"안녕하세요\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「print(\"함수 정의 끝\")」 — 문자열 \"함수 정의 끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수를 만드는 것과 실행하는 것은 다른 일입니다’ 예제에서는 4행은 \"함수 정의 끝\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「greet()」 — greet 함수를 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘함수를 만드는 것과 실행하는 것은 다른 일입니다’ 예제에서는 5행은 greet() 동작을 맡는 부분입니다."]},{"id":"t2-c3-x03","kind":"concept","title":"매개변수는 함수가 받을 값을 위한 빈 상자입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘매개변수는 함수가 받을 값을 위한 빈 상자입니다’에서는 첫 코드 def greet(name):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","def greet(name):의 name은 나중에 들어올 값을 받을 자리입니다. 이것을 매개변수라고 합니다.","greet(\"민수\")에서 \"민수\"는 실제로 전달하는 값입니다.","매개변수를 쓰면 같은 함수를 여러 값에 재사용할 수 있습니다."],"extras":[],"code":"def greet(name):\n    print(\"안녕하세요,\", name)\n\ngreet(\"민수\")\ngreet(\"영희\")","codeNote":"같은 함수에 다른 이름을 넣어 두 번 재사용합니다. name이 매번 다른 값을 받습니다.","codeExplain":["1행 「def greet(name):」 — greet이라는 새 함수를 정의합니다. 괄호 안 name는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘매개변수는 함수가 받을 값을 위한 빈 상자입니다’ 내용을 설명하는 코드에서는 1행은 greet 함수의 이름과 입력 자리 name을 정하는 함수 입구입니다.","2행 「print(\"안녕하세요,\", name)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"안녕하세요,\", 2번째는 name의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘매개변수는 함수가 받을 값을 위한 빈 상자입니다’ 내용을 설명하는 코드에서는 2행은 \"안녕하세요,\", name의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「greet(\"민수\")」 — greet 함수를 \"민수\"와 함께 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘매개변수는 함수가 받을 값을 위한 빈 상자입니다’ 내용을 설명하는 코드에서는 4행은 greet(\"민수\") 동작을 맡는 부분입니다.","5행 「greet(\"영희\")」 — greet 함수를 \"영희\"와 함께 호출합니다. 이 줄에서는 반환값을 따로 저장하지 않고 함수 내부의 출력이나 다른 동작을 바로 사용합니다. ‘매개변수는 함수가 받을 값을 위한 빈 상자입니다’ 내용을 설명하는 코드에서는 5행은 greet(\"영희\") 동작을 맡는 부분입니다."]},{"id":"t2-c3-x04","kind":"example","title":"두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["add(3, 5)를 호출하면 a에는 3, b에는 5가 들어갑니다.","함수 안에서 a + b를 계산합니다.","return으로 결과를 함수 밖으로 돌려보냅니다."],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","extras":[],"codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다’ 예제에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다’ 예제에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다’ 예제에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘두 숫자를 받아 더하는 함수로 입력과 결과를 봅니다’ 예제에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x05","kind":"concept","title":"print와 return은 역할이 완전히 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘print와 return은 역할이 완전히 다릅니다’에서는 첫 코드 def add(a, b):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","print는 사람에게 화면으로 보여 줍니다. return은 함수가 계산한 값을 다른 코드가 다시 쓰게 돌려줍니다.","함수 안에서 print(5)를 했다고 해서 함수 결과값이 5가 되는 것은 아닙니다.","“print = 보여주기, return = 건네주기”라고 기억하세요."],"calloutTitle":"한 줄 기억","calloutBody":"print는 사람에게, return은 코드에게 값을 전달합니다.","extras":[],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","codeExplain":["1행 「def add(a, b):」 — add이라는 새 함수를 정의합니다. 괄호 안 a, b는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘print와 return은 역할이 완전히 다릅니다’ 내용을 설명하는 코드에서는 1행은 add 함수의 이름과 입력 자리 a, b을 정하는 함수 입구입니다.","2행 「return a + b」 — 계산식 a + b의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘print와 return은 역할이 완전히 다릅니다’ 내용을 설명하는 코드에서는 2행은 a + b 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「result = add(3, 5)」 — add 함수를 3, 5와 함께 호출한 결과을 구한 뒤 결과를 result라는 변수에 저장합니다. 이 줄 이후에는 result라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘print와 return은 역할이 완전히 다릅니다’ 내용을 설명하는 코드에서는 4행은 add(3, 5)에서 만든 결과를 result에 저장하거나 갱신하는 줄입니다.","5행 「print(result)」 — result의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘print와 return은 역할이 완전히 다릅니다’ 내용을 설명하는 코드에서는 5행은 result의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x06","kind":"example","title":"return 값은 다른 계산에 다시 사용할 수 있습니다","eyebrow":"초보 확장 · 예제","paragraphs":["double(4)는 8을 return합니다.","그 8을 value에 저장한 뒤 value + 10처럼 다시 계산할 수 있습니다.","이런 재사용 때문에 계산 함수에서는 return이 중요합니다."],"code":"def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)","codeNote":"함수는 8을 return하고, 바깥의 result가 그 값을 받아 출력합니다.","extras":[],"codeExplain":["1행 「def add(a, b):」 — add이라는 새 함수를 정의합니다. 괄호 안 a, b는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘return 값은 다른 계산에 다시 사용할 수 있습니다’ 예제에서는 1행은 add 함수의 이름과 입력 자리 a, b을 정하는 함수 입구입니다.","2행 「return a + b」 — 계산식 a + b의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘return 값은 다른 계산에 다시 사용할 수 있습니다’ 예제에서는 2행은 a + b 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「result = add(3, 5)」 — add 함수를 3, 5와 함께 호출한 결과을 구한 뒤 결과를 result라는 변수에 저장합니다. 이 줄 이후에는 result라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘return 값은 다른 계산에 다시 사용할 수 있습니다’ 예제에서는 4행은 add(3, 5)에서 만든 결과를 result에 저장하거나 갱신하는 줄입니다.","5행 「print(result)」 — result의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘return 값은 다른 계산에 다시 사용할 수 있습니다’ 예제에서는 5행은 result의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x07","kind":"practice","title":"가로와 세로를 받아 직사각형 넓이를 구하세요","eyebrow":"초보 확장 · 실습","paragraphs":["rectangle_area라는 함수를 만들고 width와 height를 받습니다.","두 값을 곱한 결과를 print하지 말고 return하세요.","함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다."],"practicePrompt":"rectangle_area(4, 3)이 12를 돌려주도록 만들고 바깥에서 출력하세요.","answerOnNext":true,"extras":[],"code":"def rectangle_area(width, height):\n    return ____\n\narea = rectangle_area(4, 3)\nprint(area)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「def rectangle_area(width, height):」 — rectangle_area이라는 새 함수를 정의합니다. 괄호 안 width, height는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 실습에서는 1행은 rectangle_area 함수의 이름과 입력 자리 width, height을 정하는 함수 입구입니다.","2행 「return ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","4행 「area = rectangle_area(4, 3)」 — rectangle_area 함수를 4, 3와 함께 호출한 결과을 구한 뒤 결과를 area라는 변수에 저장합니다. 이 줄 이후에는 area라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 실습에서는 4행은 rectangle_area(4, 3)에서 만든 결과를 area에 저장하거나 갱신하는 줄입니다.","5행 「print(area)」 — area의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 실습에서는 5행은 area의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x08","kind":"solution","title":"가로와 세로를 받아 직사각형 넓이를 구하세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["width와 height는 입력입니다.","넓이는 width * height입니다.","그 값을 return하고 호출 결과를 area에 저장해 출력합니다."],"code":"def rectangle_area(width, height):\n    return width * height\n\narea = rectangle_area(4, 3)\nprint(area)","codeNote":"예상 출력: 12","extras":[],"codeExplain":["1행 「def rectangle_area(width, height):」 — rectangle_area이라는 새 함수를 정의합니다. 괄호 안 width, height는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 풀이에서는 1행은 rectangle_area 함수의 이름과 입력 자리 width, height을 정하는 함수 입구입니다.","2행 「return width * height」 — 계산식 width * height의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","4행 「area = rectangle_area(4, 3)」 — rectangle_area 함수를 4, 3와 함께 호출한 결과을 구한 뒤 결과를 area라는 변수에 저장합니다. 이 줄 이후에는 area라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 풀이에서는 4행은 rectangle_area(4, 3)에서 만든 결과를 area에 저장하거나 갱신하는 줄입니다.","5행 「print(area)」 — area의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘가로와 세로를 받아 직사각형 넓이를 구하세요’ 풀이에서는 5행은 area의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x09","kind":"practice","title":"가격과 할인율로 할인된 가격을 계산하세요","eyebrow":"초보 확장 · 실습","paragraphs":["price와 discount_percent를 받습니다.","할인 금액은 price * discount_percent / 100입니다.","함수 문제에서는 괄호 안으로 들어오는 값과 return으로 나가는 값을 먼저 표시하세요. 그 사이의 계산이 함수 본문입니다."],"practicePrompt":"10000원에 20% 할인을 적용하면 8000이 return되도록 discounted_price 함수를 만드세요.","answerOnNext":true,"extras":[],"code":"def discounted_price(price, discount_percent):\n    discount = ____\n    return ____\n\nprint(discounted_price(10000, 20))","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「def discounted_price(price, discount_percent):」 — discounted_price이라는 새 함수를 정의합니다. 괄호 안 price, discount_percent는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘가격과 할인율로 할인된 가격을 계산하세요’ 실습에서는 1행은 discounted_price 함수의 이름과 입력 자리 price, discount_percent을 정하는 함수 입구입니다.","2행 「discount = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 discount라는 변수에 저장합니다. 이 줄 이후에는 discount라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「return ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘가격과 할인율로 할인된 가격을 계산하세요’ 실습에서는 3행은 ____ 결과를 함수 밖으로 돌려주는 함수 출구입니다.","5행 「print(discounted_price(10000, 20))」 — discounted_price 함수를 10000, 20와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘가격과 할인율로 할인된 가격을 계산하세요’ 실습에서는 5행은 discounted_price(10000, 20)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x10","kind":"solution","title":"가격과 할인율로 할인된 가격을 계산하세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["20%는 20/100 = 0.2입니다.","10000 * 0.2는 2000원 할인입니다.","10000 - 2000을 return하면 8000이 됩니다."],"code":"def discounted_price(price, discount_percent):\n    discount = price * discount_percent / 100\n    return price - discount\n\nprint(discounted_price(10000, 20))","codeNote":"예상 출력: 8000.0","extras":[],"codeExplain":["1행 「def discounted_price(price, discount_percent):」 — discounted_price이라는 새 함수를 정의합니다. 괄호 안 price, discount_percent는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘가격과 할인율로 할인된 가격을 계산하세요’ 풀이에서는 1행은 discounted_price 함수의 이름과 입력 자리 price, discount_percent을 정하는 함수 입구입니다.","2행 「discount = price * discount_percent / 100」 — 계산식 price * discount_percent / 100의 결과를 구한 뒤 결과를 discount라는 변수에 저장합니다. 이 줄 이후에는 discount라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「return price - discount」 — 계산식 price - discount의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","5행 「print(discounted_price(10000, 20))」 — discounted_price 함수를 10000, 20와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘가격과 할인율로 할인된 가격을 계산하세요’ 풀이에서는 5행은 discounted_price(10000, 20)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x11","kind":"check","title":"함수 안에서 만든 변수는 어디까지 보일까요?","eyebrow":"초보 확장 · 확인","paragraphs":["함수 안에서 만든 변수는 보통 그 함수 안에서만 쓰는 지역 변수입니다.","함수 안을 작은 작업방이라고 생각하면 쉽습니다.","바깥에서 값을 쓰고 싶으면 return으로 돌려받는 방식이 명확합니다."],"question":"함수 안에서만 만든 message를 함수 밖에서 바로 print(message)하면 정상적으로 출력될까요?","answerOnNext":true,"extras":[],"code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 안에서 만든 변수는 어디까지 보일까요?’ 확인 문제의 코드에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘함수 안에서 만든 변수는 어디까지 보일까요?’ 확인 문제의 코드에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘함수 안에서 만든 변수는 어디까지 보일까요?’ 확인 문제의 코드에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘함수 안에서 만든 변수는 어디까지 보일까요?’ 확인 문제의 코드에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x12","kind":"solution","title":"함수 안에서 만든 변수는 어디까지 보일까요? · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["message는 greet 함수 안에서 만든 지역 변수입니다.","바깥에서는 그 이름을 바로 찾을 수 없습니다.","필요한 값은 return으로 돌려받아 바깥 변수에 저장하세요."],"code":"def greet():\n    message = \"안녕\"\n    return message\n\noutside = greet()\nprint(outside)","codeNote":"예상 출력: 안녕","extras":[],"codeExplain":["1행 「def greet():」 — greet이라는 새 함수를 정의합니다. 괄호가 비어 있으므로 외부 입력 없이 호출하는 함수입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘함수 안에서 만든 변수는 어디까지 보일까요?’ 풀이에서는 1행은 greet 함수의 이름과 입력 자리 없음을 정하는 함수 입구입니다.","2행 「message = \"안녕\"」 — 문자열 \"안녕\"을 구한 뒤 결과를 message라는 변수에 저장합니다. 이 줄 이후에는 message라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「return message」 — message의 현재 값을 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다.","5행 「outside = greet()」 — greet 함수를 호출한 결과을 구한 뒤 결과를 outside라는 변수에 저장합니다. 이 줄 이후에는 outside라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","6행 「print(outside)」 — outside의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c3-x13","kind":"concept","title":"좋은 함수는 한 가지 일을 짧고 분명하게 합니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’에서는 첫 코드 def subtotal(count, price):에서 시작해 함수의 이름, 입력 자리, 호출 시점, 반환값 가운데 이 코드가 어떤 부분을 보여 주는지 연결합니다. 함수 전체를 외우지 않고 값이 들어와 결과가 나가는 길을 읽는 방식으로 이해합니다.","한 함수가 입력, 파일 읽기, 계산, 출력까지 전부 하면 고치기 어렵습니다.","함수 이름을 읽었을 때 무슨 일을 하는지 바로 알 수 있게 만드세요.","calculate_total, is_adult처럼 동작이 보이는 이름이 좋습니다."],"extras":[],"code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","codeExplain":["1행 「def subtotal(count, price):」 — subtotal이라는 새 함수를 정의합니다. 괄호 안 count, price는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 1행은 subtotal 함수의 이름과 입력 자리 count, price을 정하는 함수 입구입니다.","2행 「return count * price」 — 계산식 count * price의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 2행은 count * price 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「def add_fee(amount):」 — add_fee이라는 새 함수를 정의합니다. 괄호 안 amount는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 4행은 add_fee 함수의 이름과 입력 자리 amount을 정하는 함수 입구입니다.","5행 「return amount + 3000」 — 계산식 amount + 3000의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 5행은 amount + 3000 결과를 함수 밖으로 돌려주는 함수 출구입니다.","7행 「base = subtotal(2, 5000)」 — subtotal 함수를 2, 5000와 함께 호출한 결과을 구한 뒤 결과를 base라는 변수에 저장합니다. 이 줄 이후에는 base라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 7행은 subtotal(2, 5000)에서 만든 결과를 base에 저장하거나 갱신하는 줄입니다.","8행 「print(add_fee(base))」 — add_fee 함수를 base와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘좋은 함수는 한 가지 일을 짧고 분명하게 합니다’ 내용을 설명하는 코드에서는 8행은 add_fee(base)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c3-x14","kind":"example","title":"작은 함수 두 개를 연결하면 긴 문제도 단순해집니다","eyebrow":"초보 확장 · 예제","paragraphs":["subtotal은 수량과 단가를 곱하는 일만 합니다.","add_tax는 금액에 세금을 더하는 일만 합니다.","작은 함수 결과를 연결하면 전체 계산이 완성됩니다."],"code":"def subtotal(count, price):\n    return count * price\n\ndef add_fee(amount):\n    return amount + 3000\n\nbase = subtotal(2, 5000)\nprint(add_fee(base))","codeNote":"계산과 배송비 추가를 서로 다른 함수로 나누어 각 함수의 역할이 하나씩 보입니다.","extras":[],"codeExplain":["1행 「def subtotal(count, price):」 — subtotal이라는 새 함수를 정의합니다. 괄호 안 count, price는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 1행은 subtotal 함수의 이름과 입력 자리 count, price을 정하는 함수 입구입니다.","2행 「return count * price」 — 계산식 count * price의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 2행은 count * price 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「def add_fee(amount):」 — add_fee이라는 새 함수를 정의합니다. 괄호 안 amount는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 4행은 add_fee 함수의 이름과 입력 자리 amount을 정하는 함수 입구입니다.","5행 「return amount + 3000」 — 계산식 amount + 3000의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여
