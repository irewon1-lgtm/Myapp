 개념","paragraphs":["숫자라고 해서 항상 정상 값은 아닙니다. 가격 -100원은 숫자지만 우리 규칙에는 잘못된 값입니다.","이럴 때 raise ValueError(...)로 “이 값은 잘못됐다”고 명확하게 알릴 수 있습니다.","초보 단계에서는 try/except가 우선이지만 입력 검증에서 자주 만나게 됩니다."],"extras":[],"code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「잘못된 값은 직접 예외를 발생시켜 막을 수도 있습니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「잘못된 값은 직접 예외를 발생시켜 막을 수도 있습니다」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「잘못된 값은 직접 예외를 발생시켜 막을 수도 있습니다」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「잘못된 값은 직접 예외를 발생시켜 막을 수도 있습니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「잘못된 값은 직접 예외를 발생시켜 막을 수도 있습니다」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c7-x14","kind":"example","title":"가격이 음수면 함수가 즉시 알려 주게 만듭니다","eyebrow":"초보 확장 · 예제","paragraphs":["price가 0보다 작으면 정상 가격이 아니라고 판단합니다.","raise ValueError를 실행하면 함수가 즉시 예외를 바깥으로 보냅니다.","호출하는 쪽에서 try/except로 받아 친절한 메시지를 보여 줄 수 있습니다."],"code":"def check_price(price):\n    if price \u003c 0:\n        raise ValueError(\"가격은 0 이상이어야 합니다\")\n    return price\n\nprint(check_price(1000))","codeNote":"음수 가격만 예외로 막고 1000은 정상적으로 return됩니다.","extras":[],"codeExplain":["1행 「def check_price(price):」 — 「가격이 음수면 함수가 즉시 알려 주게 만듭니다」에서 check_price 함수를 만듭니다. 괄호 안 price이 호출할 때 받을 값입니다.","2행 「if price \u003c 0:」 — 「가격이 음수면 함수가 즉시 알려 주게 만듭니다」에서 price \u003c 0을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","3행 「raise ValueError(\"가격은 0 이상이어야 합니다\")」 — 「가격이 음수면 함수가 즉시 알려 주게 만듭니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","4행 「return price」 — 「가격이 음수면 함수가 즉시 알려 주게 만듭니다」에서 price의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","6행 「print(check_price(1000))」 — 「가격이 음수면 함수가 즉시 알려 주게 만듭니다」에서 check_price(1000)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 7 정리","title":"지금 알아야 할 것","paragraphs":["예외 처리 챕터의 목표는 문법을 외우는 것이 아니라 “try·except를 이용해 예상 가능한 실패를 처리하고, 오류를 숨기지 않으면서 사용자에게 안전한 흐름을 제공한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 Python 자동화 미니 프로젝트로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["try·except를 이용해 예상 가능한 실패를 처리하고, 오류를 숨기지 않으면서 사용자에게 안전한 흐름을 제공한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c7-p13","code":"try:\n    age = int(\"10\")\n    print(age)\nexcept ValueError:\n    print(\"숫자로 입력하세요\")","codeNote":"\"10\"은 정수 10으로 변환되므로 except 없이 10이 출력됩니다.","codeExplain":["1행 「try:」 — 「지금 알아야 할 것」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","2행 「age = int(\"10\")」 — 「지금 알아야 할 것」에서 오른쪽 int(\"10\")을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「print(age)」 — 「지금 알아야 할 것」에서 age의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「except ValueError:」 — 「지금 알아야 할 것」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","5행 「print(\"숫자로 입력하세요\")」 — 「지금 알아야 할 것」에서 \"숫자로 입력하세요\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"오류 메시지를 문제 해결 단서로 보고 실행 중 오류를 단계적으로 좁히는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"try-except를 실제 데이터 처리에서 실패를 다루는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"입력 데이터가 현실적으로 깨질 수 있다는 전제에서 완성 코드를 안전하게 만드는 방식 참고"}]}],"track":2,"id":"t2-c7","remember":"try/except와 구체적인 예외","practiceGoal":"총 3번 제한 입력 재시도","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"오류 메시지를 문제 해결 단서로 보고 실행 중 오류를 단계적으로 좁히는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"try-except를 실제 데이터 처리에서 실패를 다루는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"입력 데이터가 현실적으로 깨질 수 있다는 전제에서 완성 코드를 안전하게 만드는 방식 참고"}]},{"chapter":8,"title":"Python 자동화 미니 프로젝트","pages":[{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"automation 자동화","description":"반복적으로 하던 작업을 코드가 일정한 규칙에 따라 대신 수행하도록 만드는 것입니다. 단순 반복뿐 아니라 읽기, 정리, 계산, 저장을 연결할 수 있습니다.","usage":"매일 같은 파일 정리, 합계 계산, 보고서 초안 생성 같은 작업에 씁니다.","example":"예: 지출 파일을 읽어 카테고리별 합계를 자동으로 계산합니다."},{"term":"pipeline 처리 흐름","description":"입력부터 최종 출력까지 여러 처리 단계를 순서대로 연결한 구조입니다.","usage":"자동화 작업의 큰 흐름을 설계할 때 씁니다.","example":"예: 파일 읽기 → 문자열 정리 → 숫자 변환 → 집계 → 결과 저장 순서입니다."},{"term":"validation 검증","description":"입력이나 중간 결과가 기대한 조건을 만족하는지 확인하는 과정입니다.","usage":"잘못된 데이터가 뒤 계산으로 퍼지는 것을 막을 때 사용합니다.","example":"예: 금액이 숫자로 변환 가능한지, 필수 필드가 있는지 확인합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c8-p1","code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「먼저 알아두면 좋은 단어」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「먼저 알아두면 좋은 단어」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「먼저 알아두면 좋은 단어」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「먼저 알아두면 좋은 단어」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「먼저 알아두면 좋은 단어」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"logging 기록","description":"프로그램이 무엇을 했는지 실행 과정과 결과를 기록하는 것입니다. 초보 단계에서는 print도 간단한 로그 역할을 할 수 있습니다.","usage":"자동화가 어디까지 진행됐는지 확인하고 오류를 추적할 때 씁니다.","example":"예: 처리한 파일 수와 건너뛴 오류 행 수를 출력합니다."},{"term":"idempotent 반복 실행 안전성","description":"같은 작업을 여러 번 실행해도 원치 않는 중복 결과가 쌓이지 않도록 설계하는 성질입니다.","usage":"자동화 작업을 재실행할 가능성이 있을 때 중요합니다.","example":"예: 결과 파일을 매번 새로 만들지, 기존 항목을 중복 추가하지 않을지 정합니다."},{"term":"test case 테스트 케이스","description":"특정 입력과 기대 결과를 한 쌍으로 정한 검증 단위입니다. 정상·경계·오류 입력을 준비하면 자동화 신뢰도가 높아집니다.","usage":"프로젝트 완성 여부를 객관적으로 확인할 때 사용합니다.","example":"예: 정상 3행 + 잘못된 1행 파일에서 합계와 오류 건수를 미리 정합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c8-p2","code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「코드에서 자주 만나는 표현」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「코드에서 자주 만나는 표현」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「코드에서 자주 만나는 표현」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「코드에서 자주 만나는 표현」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「코드에서 자주 만나는 표현」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 1/6","title":"자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다","paragraphs":["“파일을 자동 정리해 줘” 같은 큰 목표를 바로 코드로 쓰지 말고 입력, 검증, 변환, 처리, 출력 단계로 나눕니다.","각 단계가 한 문장으로 설명될 정도로 작아지면 어떤 함수가 필요한지도 자연스럽게 보입니다.","자동화의 핵심은 코드를 많이 쓰는 것이 아니라 사람이 매번 하던 판단 규칙을 명확하게 코드로 옮기는 것입니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p3","code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「자동화는 반복 작업을 작은 단계로 분해하는 것에서 시작합니다」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 2/6","title":"먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다","paragraphs":["프로젝트에서 다룰 파일 형식과 필드 순서를 먼저 정하세요. 예를 들어 날짜, 카테고리, 금액 세 칸으로 통일하면 파싱과 검증 규칙이 명확해집니다.","입력 규칙이 자주 바뀌면 코드 곳곳에 예외 처리가 늘어납니다. 가능한 범위에서 입력 계약을 단순하게 만드는 것이 좋습니다.","실제 시스템에서도 API 규격, 파일 스키마, 데이터베이스 컬럼이 같은 역할을 합니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p4","code":"line = \"식비,12000\"\nparts = line.split(\",\")\ncategory = parts[0]\namount = int(parts[1])\nprint(category, amount)","codeNote":"입력 형식을 “카테고리,금액”으로 고정하면 각 조각을 같은 위치에서 안정적으로 꺼낼 수 있습니다.","codeExplain":["1행 「line = \"식비,12000\"」 — 「먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다」에서 오른쪽 \"식비,12000\"을 먼저 계산하고 그 결과를 line에 저장합니다.","2행 「parts = line.split(\",\")」 — 「먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","3행 「category = parts[0]」 — 「먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다」에서 오른쪽 parts[0]을 먼저 계산하고 그 결과를 category에 저장합니다.","4행 「amount = int(parts[1])」 — 「먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다」에서 오른쪽 int(parts[1])을 먼저 계산하고 그 결과를 amount에 저장합니다.","5행 「print(category, amount)」 — 「먼저 입력 형식을 고정하면 뒤 코드가 단순해집니다」에서 category, amount의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 3/6","title":"함수로 단계를 나누면 실패 위치가 보입니다","paragraphs":["read_rows, parse_row, summarize, save_report처럼 단계를 함수로 나누면 어느 단계가 실패했는지 명확합니다.","각 함수가 입력과 반환값을 가지면 작은 테스트를 따로 만들 수 있어 전체 프로젝트 디버깅이 쉬워집니다.","한 함수가 너무 많은 일을 하면 수정할 때 다른 기능까지 영향을 받을 수 있으므로 책임을 나누는 것이 중요합니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p5","code":"def parse_amount(text):\n    return int(text.strip())\n\ndef add_amount(total, text):\n    return total + parse_amount(text)\n\nprint(add_amount(1000, \"2500\"))","codeNote":"문자열 정리·변환과 합산을 서로 다른 함수로 나누어 어느 단계가 실패했는지 찾기 쉽습니다.","codeExplain":["1행 「def parse_amount(text):」 — 「함수로 단계를 나누면 실패 위치가 보입니다」에서 parse_amount 함수를 만듭니다. 괄호 안 text이 호출할 때 받을 값입니다.","2행 「return int(text.strip())」 — 「함수로 단계를 나누면 실패 위치가 보입니다」에서 int(text.strip())의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「def add_amount(total, text):」 — 「함수로 단계를 나누면 실패 위치가 보입니다」에서 add_amount 함수를 만듭니다. 괄호 안 total, text이 호출할 때 받을 값입니다.","5행 「return total + parse_amount(text)」 — 「함수로 단계를 나누면 실패 위치가 보입니다」에서 total + parse_amount(text)의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「print(add_amount(1000, \"2500\"))」 — 「함수로 단계를 나누면 실패 위치가 보입니다」에서 add_amount(1000, \"2500\")의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 4/6","title":"잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다","paragraphs":["자동화에서는 일부 데이터가 잘못됐을 때 전체를 중단할지, 해당 행만 건너뛰고 계속할지 정책을 정해야 합니다.","정확성이 매우 중요한 데이터라면 중단이 맞을 수 있고, 단순 로그 집계라면 오류 행을 기록하고 계속하는 것이 실용적일 수 있습니다.","이 판단은 기술 문법이 아니라 업무 규칙이므로 코드에 명확하게 드러나야 합니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p6","code":"rows = [\"1000\", \"오류\", \"2500\"]\ntotal = 0\nerrors = 0\n\nfor row in rows:\n    try:\n        total += int(row)\n    except ValueError:\n        errors += 1\n\nprint(total, errors)","codeNote":"잘못된 한 행은 건너뛰고 정상 금액만 더합니다. 결과는 3500과 오류 1건입니다.","codeExplain":["1행 「rows = [\"1000\", \"오류\", \"2500\"]」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 여러 값을 리스트로 묶어 rows에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「errors = 0」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 errors을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","5행 「for row in rows:」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서는 rows에서 값을 하나씩 꺼내 row에 넣습니다. 다음 반복에서는 row가 다음 값으로 바뀝니다.","6행 「try:」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","7행 「total += int(row)」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 total의 기존 값에 int(row)을 더해 다시 total에 저장합니다.","8행 「except ValueError:」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","9행 「errors += 1」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 errors의 기존 값에 1을 더해 다시 errors에 저장합니다.","11행 「print(total, errors)」 — 「잘못된 한 행 때문에 전체 작업을 망칠지 결정해야 합니다」에서 total, errors의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 5/6","title":"재실행했을 때 중복이 생기지 않는지 확인합니다","paragraphs":["자동화는 사람이 실수로 두 번 실행하거나 중간 실패 후 다시 실행할 수 있습니다. 결과 파일에 같은 내용이 계속 추가되는 구조라면 중복 문제가 생길 수 있습니다.","매번 결과를 새로 계산해 덮어쓸지, 처리 완료 표시를 둘지, 고유한 ID로 중복을 검사할지 작업 성격에 맞게 선택합니다.","작은 개인 도구에서도 재실행 안전성을 생각하는 습관은 이후 서버·배치 작업에서 큰 도움이 됩니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p7","code":"result = []\nsource = [\"A\", \"B\", \"B\"]\n\nfor item in source:\n    if item not in result:\n        result.append(item)\n\nprint(result)","codeNote":"같은 입력을 다시 만나도 이미 결과에 있으면 추가하지 않아 중복을 막습니다.","codeExplain":["1행 「result = []」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서 여러 값을 리스트로 묶어 result에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「source = [\"A\", \"B\", \"B\"]」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서 여러 값을 리스트로 묶어 source에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for item in source:」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서는 source에서 값을 하나씩 꺼내 item에 넣습니다. 다음 반복에서는 item가 다음 값으로 바뀝니다.","5행 「if item not in result:」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서 item not in result을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","6행 「result.append(item)」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","8행 「print(result)」 — 「재실행했을 때 중복이 생기지 않는지 확인합니다」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 6/6","title":"완성 기준은 테스트 케이스로 결정합니다","paragraphs":["“잘 되는 것 같다”가 아니라 정상 입력, 빈 파일, 잘못된 숫자, 경계값 등 테스트 케이스와 기대 결과를 미리 정하세요.","기능을 추가한 뒤 기존 테스트도 다시 확인하면 새 수정이 이전 기능을 망가뜨리는 회귀 문제를 줄일 수 있습니다.","프로젝트 마지막에는 코드 길이보다 요구사항과 테스트를 모두 만족하는지가 완료 기준입니다."],"keywords":["automation 자동화","pipeline 처리 흐름","validation 검증","logging 기록"],"extras":[],"visibleExtras":2,"id":"t2-c8-p8","code":"def total(values):\n    answer = 0\n    for value in values:\n        answer += value\n    return answer\n\nprint(total([]))\nprint(total([10]))\nprint(total([10, 20]))","codeNote":"빈 입력, 한 개 입력, 여러 개 입력을 각각 확인해 함수의 기본 동작을 검증합니다.","codeExplain":["1행 「def total(values):」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 total 함수를 만듭니다. 괄호 안 values이 호출할 때 받을 값입니다.","2행 「answer = 0」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 answer을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「for value in values:」 — 「완성 기준은 테스트 케이스로 결정합니다」에서는 values에서 값을 하나씩 꺼내 value에 넣습니다. 다음 반복에서는 value가 다음 값으로 바뀝니다.","4행 「answer += value」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 answer의 기존 값에 value을 더해 다시 answer에 저장합니다.","5행 「return answer」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 answer의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「print(total([]))」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 total([])의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「print(total([10]))」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 total([10])의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「print(total([10, 20]))」 — 「완성 기준은 테스트 케이스로 결정합니다」에서 total([10, 20])의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"Python 자동화 미니 프로젝트의 전체 흐름","paragraphs":["Python 자동화 미니 프로젝트에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"IPO_PROJECT","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c8-p9","code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「Python 자동화 미니 프로젝트의 전체 흐름」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「Python 자동화 미니 프로젝트의 전체 흐름」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「Python 자동화 미니 프로젝트의 전체 흐름」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「Python 자동화 미니 프로젝트의 전체 흐름」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「Python 자동화 미니 프로젝트의 전체 흐름」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-unpack","kind":"concept","eyebrow":"예제 읽기 준비","title":"return total, errors는 두 값을 함께 돌려줍니다","paragraphs":["쉼표로 묶인 여러 값은 튜플(tuple)로 함께 다룰 수 있습니다. return total, errors는 합계와 오류 건수를 한 쌍으로 반환합니다.","total, errors = summarize(rows)는 반환된 두 값을 순서대로 각각의 이름에 연결합니다. 이를 언패킹(unpacking), 즉 묶음 풀기라고 합니다.","숫자에서 total += amount는 total = total + amount를 짧게 적은 형태입니다. 처음에는 긴 형태로 읽어도 됩니다."],"code":"def summarize(values):\n    total = 0\n    errors = 0\n    for value in values:\n        try:\n            total += int(value)\n        except ValueError:\n            errors += 1\n    return total, errors\n\nresult = summarize([\"10\", \"x\", \"20\"])\nprint(result)","codeNote":"함수는 합계 30과 오류 1을 한 번에 돌려주고 result에는 (30, 1)이 들어갑니다.","extras":[],"codeExplain":["1행 「def summarize(values):」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 summarize 함수를 만듭니다. 괄호 안 values이 호출할 때 받을 값입니다.","2행 「total = 0」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「errors = 0」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 errors을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for value in values:」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서는 values에서 값을 하나씩 꺼내 value에 넣습니다. 다음 반복에서는 value가 다음 값으로 바뀝니다.","5행 「try:」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","6행 「total += int(value)」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 total의 기존 값에 int(value)을 더해 다시 total에 저장합니다.","7행 「except ValueError:」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","8행 「errors += 1」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 errors의 기존 값에 1을 더해 다시 errors에 저장합니다.","9행 「return total, errors」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 total, errors의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","11행 「result = summarize([\"10\", \"x\", \"20\"])」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 오른쪽 summarize([\"10\", \"x\", \"20\"])을 먼저 계산하고 그 결과를 result에 저장합니다.","12행 「print(result)」 — 「return total, errors는 두 값을 함께 돌려줍니다」에서 result의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다","paragraphs":[],"code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","extras":[],"visibleExtras":2,"id":"t2-c8-p10","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「Python 자동화 미니 프로젝트를 하나의 코드로 연결합니다」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다","paragraphs":["자동화 코드는 입력을 읽는 단계, 값을 정리하는 단계, 조건을 검사하는 단계, 결과를 계산하고 저장하는 단계로 나누면 훨씬 작게 보입니다.","긴 코드에서도 한 반복에서 처리하는 것은 보통 한 줄 또는 한 항목입니다. 한 항목이 들어와 어떤 검사를 거쳐 어디에 저장되는지 따라가세요.","완성 뒤에는 입력 개수, 정상 처리 개수, 오류 개수, 최종 합계를 함께 확인하세요. 프로그램이 끝났다는 사실보다 결과가 맞는지가 더 중요합니다."],"code":"totals = {}\nerrors = 0\n\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        parts = ____\n        # TODO: 형식 검사\n        # TODO: 금액을 int로 바꾸기\n        # TODO: 카테고리별 합계 누적\n\nwith open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:\n    # TODO: totals 내용을 한 줄씩 저장\n    # TODO: 오류 건수 저장\n    pass","practicePrompt":"expenses.txt의 각 줄이 “카테고리,금액” 형식이라고 가정하고 카테고리별 합계를 딕셔너리로 계산한 뒤 report.txt에 저장하는 자동화 도구를 설계하세요. 잘못된 줄은 오류 건수로 기록하세요.","extras":[],"visibleExtras":2,"id":"t2-c8-p11","answerOnNext":true,"codeExplain":["1행 「totals = {}」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 key와 value로 이루어진 딕셔너리를 totals에 저장합니다.","2행 「errors = 0」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 errors을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","5행 「for line in f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","6행 「parts = ____」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","7행 「# TODO: 형식 검사」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 아직 작성할 작업을 표시한 주석입니다. Python은 이 줄을 실행하지 않습니다.","8행 「# TODO: 금액을 int로 바꾸기」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 아직 작성할 작업을 표시한 주석입니다. Python은 이 줄을 실행하지 않습니다.","9행 「# TODO: 카테고리별 합계 누적」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 아직 작성할 작업을 표시한 주석입니다. Python은 이 줄을 실행하지 않습니다.","11행 「with open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","12행 「# TODO: totals 내용을 한 줄씩 저장」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 아직 작성할 작업을 표시한 주석입니다. Python은 이 줄을 실행하지 않습니다.","13행 「# TODO: 오류 건수 저장」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 아직 작성할 작업을 표시한 주석입니다. Python은 이 줄을 실행하지 않습니다.","14행 「pass」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c8-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["입력 파일은 코드 실행 전에 직접 준비합니다. 쉼표 없는 잘못된 행은 오류 1건으로 세고 넘어갑니다.","len(parts)는 나뉜 칸 수입니다. 두 칸인지 먼저 확인해서 존재하지 않는 칸을 읽는 오류를 막습니다.","totals.get(category, 0)은 해당 카테고리가 없으면 0부터 시작하라는 뜻입니다.","totals.items()는 이름과 합계를 한 쌍씩 제공합니다. for category, total은 그 두 값을 각각 받습니다.","\"w\"로 결과를 새로 쓰므로 같은 입력을 다시 처리해도 합계가 중복으로 쌓이지 않습니다. 단, 다른 중요한 report.txt를 덮어쓰지 않도록 실습 폴더에서 실행합니다.","이는 쉼표가 카테고리 안에 없는 단순 형식 실습입니다. 따옴표·쉼표가 들어가는 실제 CSV는 csv 모듈을 배운 뒤 처리해야 합니다."],"code":"totals = {}\nerrors = 0\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        parts = line.strip().split(\",\")\n        if len(parts) != 2:\n            errors = errors + 1\n            continue\n        category = parts[0].strip()\n        try:\n            amount = int(parts[1].strip())\n        except ValueError:\n            errors = errors + 1\n            continue\n        if category == \"\" or amount \u003c 0:\n            errors = errors + 1\n            continue\n        totals[category] = totals.get(category, 0) + amount\nwith open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:\n    for category, total in totals.items():\n        f.write(f\"{category},{total}\\n\")\n    f.write(f\"오류,{errors}\\n\")\nprint(f\"저장 완료 / 오류 {errors}건\")","codeNote":"실행 결과 또는 테스트 기준\nexpenses.txt 내용:\n식비,12000\n교통,1500\n식비,8000\n잘못된 행\n\nreport.txt 결과:\n식비,20000\n교통,1500\n오류,1","extras":[],"codeExplain":["1행 「totals = {}」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 key와 value로 이루어진 딕셔너리를 totals에 저장합니다.","2행 「errors = 0」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 errors을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 파일을 읽기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","4행 「for line in f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서는 f에서 값을 하나씩 꺼내 line에 넣습니다. 다음 반복에서는 line가 다음 값으로 바뀝니다.","5행 「parts = line.strip().split(\",\")」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 split이 기준 문자로 문자열을 나누어 리스트를 만듭니다.","6행 「if len(parts) != 2:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 len(parts) != 2을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","7행 「errors = errors + 1」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 errors + 1을 먼저 계산하고 그 결과를 errors에 저장합니다.","8행 「continue」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","9행 「category = parts[0].strip()」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","10행 「try:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 실패할 수 있는 연산을 정상적으로 먼저 실행해 보는 구역입니다.","11행 「amount = int(parts[1].strip())」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 strip이 양끝 공백과 줄바꿈을 제거한 새 문자열을 만듭니다.","12행 「except ValueError:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 try 안에 ValueError가 발생했을 때만 이 블록으로 이동합니다.","13행 「errors = errors + 1」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 errors + 1을 먼저 계산하고 그 결과를 errors에 저장합니다.","14행 「continue」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","15행 「if category == \"\" or amount \u003c 0:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 category == \"\" or amount \u003c 0을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","16행 「errors = errors + 1」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 errors + 1을 먼저 계산하고 그 결과를 errors에 저장합니다.","17행 「continue」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 이번 반복의 남은 줄만 건너뛰고 다음 값 처리로 넘어갑니다.","18행 「totals[category] = totals.get(category, 0) + amount」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 totals.get(category, 0) + amount을 먼저 계산하고 그 결과를 totals[category]에 저장합니다.","19행 「with open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 파일을 쓰기 모드로 열어 f라는 이름으로 사용합니다. with 블록이 끝나면 파일 닫기도 처리됩니다.","20행 「for category, total in totals.items():」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 이 연산을 실행한 뒤 다음 줄로 이동합니다. 이 줄의 결과가 뒤 코드의 입력이나 상태가 됩니다.","21행 「f.write(f\"{category},{total}\\n\")」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다.","22행 「f.write(f\"오류,{errors}\\n\")」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 write가 괄호 안 문자열을 열린 파일에 기록합니다.","23행 「print(f\"저장 완료 / 오류 {errors}건\")」 — 「Python 자동화 미니 프로젝트를 직접 바꾸고 확장합니다 · 풀이」에서 f\"저장 완료 / 오류 {errors}건\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"Python 자동화 미니 프로젝트 핵심을 확인합니다","paragraphs":[],"question":"자동화 프로그램이 정상 실행되지만 같은 파일을 두 번 실행했을 때 결과가 중복으로 두 번 저장된다면 무엇을 추가로 설계해야 할까요?","extras":[],"visibleExtras":3,"id":"t2-c8-p12","answerOnNext":true,"code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"Python 자동화 미니 프로젝트 핵심을 확인합니다 · 풀이","paragraphs":["재실행 안전성, 즉 같은 작업을 반복해도 원치 않는 중복이 생기지 않도록 결과 저장 방식을 설계해야 합니다. 덮어쓰기, 중복 키 검사, 처리 완료 기록 등 작업에 맞는 방법을 선택할 수 있습니다."],"extras":[],"code":"tasks = [\"DONE 숙제\", \"TODO 청소\"]\nfor task in tasks:\n    if task.startswith(\"TODO\"):\n        print(task)","codeNote":"조건에 맞는 항목만 골라내는 작은 자동화 예제입니다.","codeExplain":["1행 「tasks = [\"DONE 숙제\", \"TODO 청소\"]」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다 · 풀이」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「for task in tasks:」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다 · 풀이」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","3행 「if task.startswith(\"TODO\"):」 — 「Python 자동화 미니 프로젝트 핵심을 확인합니다 · 풀이」에서 task.startswith(\"TODO\")을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(task)」 해 총액을 구하세요 · 아주 쉬운 풀이」에서 여러 값을 리스트로 묶어 prices에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「가격 문자열 목록을 정리해 총액을 구하세요 · 아주 쉬운 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「for text in prices:」 — 「가격 문자열 목록을 정리해 총액을 구하세요 · 아주 쉬운 풀이」에서는 prices에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","4행 「total += int(text)」 — 「가격 문자열 목록을 정리해 총액을 구하세요 · 아주 쉬운 풀이」에서 total의 기존 값에 int(text)을 더해 다시 total에 저장합니다.","5행 「print(total)」 — 「가격 문자열 목록을 정리해 총액을 구하세요 · 아주 쉬운 풀이」에서 total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x09","kind":"practice","title":"할 일 목록에서 아직 안 한 일만 뽑아 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["tasks = [\"DONE 숙제\", \"TODO 청소\", \"TODO 운동\"]이 있습니다.","각 문자열이 TODO로 시작하는지 확인해 아직 안 한 일만 출력합니다."],"practicePrompt":"for와 if, startswith(\"TODO\")를 사용해 TODO 두 줄만 출력하세요.","answerOnNext":true,"extras":[],"code":"tasks = [\"DONE 숙제\", \"TODO 청소\", \"TODO 운동\"]\n\nfor task in tasks:\n    if ____:\n        print(task)","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「tasks = [\"DONE 숙제\", \"TODO 청소\", \"TODO 운동\"]」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","3행 「for task in tasks:」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","4행 「if ____:」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","5행 「print(task)」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요」에서 task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x10","kind":"solution","title":"할 일 목록에서 아직 안 한 일만 뽑아 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["for로 task를 하나씩 꺼냅니다.","task.startswith(\"TODO\")는 TODO로 시작하면 True입니다.","True인 항목만 print하므로 완료된 숙제는 건너뜁니다."],"code":"tasks = [\"DONE 숙제\", \"TODO 청소\", \"TODO 운동\"]\nfor task in tasks:\n    if task.startswith(\"TODO\"):\n        print(task)","codeNote":"TODO 청소\nTODO 운동","extras":[],"codeExplain":["1행 「tasks = [\"DONE 숙제\", \"TODO 청소\", \"TODO 운동\"]」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요 · 아주 쉬운 풀이」에서 여러 값을 리스트로 묶어 tasks에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「for task in tasks:」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요 · 아주 쉬운 풀이」에서는 tasks에서 값을 하나씩 꺼내 task에 넣습니다. 다음 반복에서는 task가 다음 값으로 바뀝니다.","3행 「if task.startswith(\"TODO\"):」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요 · 아주 쉬운 풀이」에서 task.startswith(\"TODO\")을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(task)」 — 「할 일 목록에서 아직 안 한 일만 뽑아 보세요 · 아주 쉬운 풀이」에서 task의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x11","kind":"check","title":"자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다","eyebrow":"초보 확장 · 확인","paragraphs":["코드가 오류 없이 끝나도 잘못된 파일을 읽었거나 일부 줄을 빼먹었을 수 있습니다.","작은 샘플 데이터로 예상 결과를 손으로 먼저 계산하고 프로그램 결과와 비교해야 합니다.","입력 건수, 처리 건수, 실패 건수, 합계 같은 검증 숫자를 남기면 좋습니다."],"question":"10, 20, 30 세 개를 처리하는 프로그램이라면 어떤 값을 확인하면 제대로 처리됐다고 더 자신 있게 말할 수 있을까요?","answerOnNext":true,"extras":[],"code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x12","kind":"solution","title":"자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["입력 개수가 3인지, 처리한 개수가 3인지 확인합니다.","합계가 손으로 계산한 60과 같은지도 확인합니다.","건너뛴 항목이나 오류 건수도 확인하면 더 안전합니다."],"code":"numbers = [10, 20, 30]\nprocessed = 0\ntotal = 0\nfor number in numbers:\n    total += number\n    processed += 1\nprint(\"입력:\", len(numbers))\nprint(\"처리:\", processed)\nprint(\"합계:\", total)","codeNote":"입력: 3\n처리: 3\n합계: 60","extras":[],"codeExplain":["1행 「numbers = [10, 20, 30]」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 여러 값을 리스트로 묶어 numbers에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「processed = 0」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 processed을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「total = 0」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for number in numbers:」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서는 numbers에서 값을 하나씩 꺼내 number에 넣습니다. 다음 반복에서는 number가 다음 값으로 바뀝니다.","5행 「total += number」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 total의 기존 값에 number을 더해 다시 total에 저장합니다.","6행 「processed += 1」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 processed의 기존 값에 1을 더해 다시 processed에 저장합니다.","7행 「print(\"입력:\", len(numbers))」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 \"입력:\", len(numbers)의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「print(\"처리:\", processed)」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 \"처리:\", processed의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「print(\"합계:\", total)」 — 「자동화가 실행됐다고 바로 성공이라고 보면 안 됩니다 · 아주 쉬운 풀이」에서 \"합계:\", total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x13","kind":"concept","title":"작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다","eyebrow":"초보 확장 · 개념","paragraphs":["파일 읽기, 한 줄 정리, 숫자 변환, 합계 계산, 결과 저장을 한 함수에 다 넣으면 길어집니다.","read_values, calculate_total처럼 역할을 나누면 어느 단계에서 문제가 생겼는지 찾기 쉽습니다.","초보자는 먼저 한 덩어리 코드로 성공시킨 뒤 반복되거나 의미가 분명한 부분부터 함수로 나누면 됩니다."],"extras":[],"code":"def parse_amount(text):\n    return int(text.strip())\n\ndef add_amount(total, text):\n    return total + parse_amount(text)\n\nprint(add_amount(1000, \"2500\"))","codeNote":"문자열 정리·변환과 합산을 서로 다른 함수로 나누어 어느 단계가 실패했는지 찾기 쉽습니다.","codeExplain":["1행 「def parse_amount(text):」 — 「작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다」에서 parse_amount 함수를 만듭니다. 괄호 안 text이 호출할 때 받을 값입니다.","2행 「return int(text.strip())」 — 「작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다」에서 int(text.strip())의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","4행 「def add_amount(total, text):」 — 「작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다」에서 add_amount 함수를 만듭니다. 괄호 안 total, text이 호출할 때 받을 값입니다.","5행 「return total + parse_amount(text)」 — 「작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다」에서 total + parse_amount(text)의 값을 호출한 쪽으로 돌려주고 함수 실행을 끝냅니다.","7행 「print(add_amount(1000, \"2500\"))」 — 「작은 함수들을 연결하면 자동화 프로젝트가 읽기 쉬워집니다」에서 add_amount(1000, \"2500\")의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c8-x14","kind":"example","title":"파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다","eyebrow":"초보 확장 · 예제","paragraphs":["한 줄에 하나씩 금액이 적힌 expenses.txt를 읽습니다. 빈 줄은 건너뜁니다.","숫자가 아닌 줄은 ValueError를 잡아 “건너뜀”이라고 알려 주고 계속 진행합니다.","정상 숫자만 리스트에 넣은 뒤 별도의 calculate_total 함수가 하나씩 더합니다. 반복문·함수·문자열·파일·예외 처리가 모두 눈에 보이게 연결됩니다."],"code":"expenses = [12000, 3500, 8000]\ntotal = 0\n\nfor money in expenses:\n    total += money\n\nprint(\"총 지출:\", total)","codeNote":"세 금액을 차례대로 더해 총 지출 23500을 만듭니다.","extras":[],"codeExplain":["1행 「expenses = [12000, 3500, 8000]」 — 「파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다」에서 여러 값을 리스트로 묶어 expenses에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「total = 0」 — 「파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다」에서 total을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","4행 「for money in expenses:」 — 「파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다」에서는 expenses에서 값을 하나씩 꺼내 money에 넣습니다. 다음 반복에서는 money가 다음 값으로 바뀝니다.","5행 「total += money」 — 「파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다」에서 total의 기존 값에 money을 더해 다시 total에 저장합니다.","7행 「print(\"총 지출:\", total)」 — 「파일·함수·예외 처리를 연결한 작은 지출 요약기를 완성합니다」에서 \"총 지출:\", total의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"summary","eyebrow":"Chapter 8 정리","title":"지금 알아야 할 것","paragraphs":["Python 자동화 미니 프로젝트 챕터의 목표는 문법을 외우는 것이 아니라 “조건문·반복문·함수·자료구조·문자열·파일·예외처리를 연결해 작은 자동화 도구를 설계하고 검증한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","트랙 2의 마지막에서는 지금까지 배운 모든 개념을 작은 자동화 프로젝트 하나로 연결했습니다. 앞으로는 같은 원리를 더 큰 앱과 데이터 시스템으로 확장하게 됩니다."],"bullets":["조건문·반복문·함수·자료구조·문자열·파일·예외처리를 연결해 작은 자동화 도구를 설계하고 검증한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c8-p13","code":"raw = [\"1000\", \"2500\", \"3000\"]\nvalues = []\n\nfor text in raw:\n    values.append(int(text))\n\nprint(values)","codeNote":"문자열 금액을 정수로 변환해 다음 계산에 사용할 숫자 리스트를 만듭니다.","codeExplain":["1행 「raw = [\"1000\", \"2500\", \"3000\"]」 — 「지금 알아야 할 것」에서 여러 값을 리스트로 묶어 raw에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","2행 「values = []」 — 「지금 알아야 할 것」에서 여러 값을 리스트로 묶어 values에 저장합니다. 이후 순서대로 꺼내거나 반복할 수 있습니다.","4행 「for text in raw:」 — 「지금 알아야 할 것」에서는 raw에서 값을 하나씩 꺼내 text에 넣습니다. 다음 반복에서는 text가 다음 값으로 바뀝니다.","5행 「values.append(int(text))」 — 「지금 알아야 할 것」에서 append가 괄호 안 값을 리스트 맨 뒤에 추가합니다.","7행 「print(values)」 — 「지금 알아야 할 것」에서 values의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"큰 목표를 작은 작업 목록으로 분해하고 작동하는 코드까지 연결하는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"수작업을 재사용 가능한 스크립트와 검증 가능한 자동화 흐름으로 바꾸는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"각 장에서 실제 문제 하나를 완성 코드로 해결하고 연습으로 확장하는 프로젝트 구성 방식 참고"}]}],"track":2,"id":"t2-c8","remember":"입력 형식·검증·재실행 규칙","practiceGoal":"분류별 지출 보고서 저장","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"큰 목표를 작은 작업 목록으로 분해하고 작동하는 코드까지 연결하는 문제 해결 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"수작업을 재사용 가능한 스크립트와 검증 가능한 자동화 흐름으로 바꾸는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"각 장에서 실제 문제 하나를 완성 코드로 해결하고 연습으로 확장하는 프로젝트 구성 방식 참고"}]},{"id":"t3-c1","track":3,"chapter":1,"title":"문제를 작은 단계로 쪼개기","remember":"목표·입력·출력·제약을 먼저 적고, 큰 일을 작은 단계로 나눈다","practiceGoal":"요구사항을 단계로 나누고 의사코드와 테스트 예시까지 만든다","pages":[{"id":"t3-c1-p1","kind":"glossary","title":"문제 해결에서 먼저 알아둘 단어","eyebrow":"CHAPTER 01 · 시작 전 단어집 1/2","paragraphs":["트랙 3에서는 새 문법을 많이 외우는 것보다, 무엇을 만들어야 하는지 정확히 이해하고 그 일을 작은 단계로 나누는 연습을 합니다. 코드를 쓰기 전에 생각을 정리하는 힘이 중심입니다.","단어를 외우는 목적은 시험이 아니라 문제를 읽을 때 놓치는 부분을 줄이기 위해서입니다. 아래 단어를 보면 ‘지금 무엇을 확인해야 하는가’를 떠올릴 수 있으면 충분합니다."],"glossary":[{"term":"problem 문제","description":"현재 상태와 원하는 상태 사이의 차이입니다. 프로그래밍 문제는 단순히 ‘코드를 작성하라’가 아니라 어떤 입력을 받아 어떤 결과를 만들어야 하는지 해결해야 하는 상황 전체를 뜻합니다.","usage":"무엇을 해결하려는지 한 문장으로 정의할 때 씁니다.","example":"예: 주문 금액과 회원 여부를 보고 최종 결제 금액을 계산한다."},{"term":"requirement 요구사항","description":"프로그램이 반드시 지켜야 하는 구체적인 조건이나 동작입니다. 요구사항이 모호하면 코드를 잘 작성해도 사용자가 원한 결과와 다를 수 있습니다.","usage":"기능을 만들기 전에 해야 할 일과 규칙을 확인할 때 씁니다.","example":"예: 주문 금액이 50,000원 이상이면 배송비는 0원이어야 한다."},{"term":"goal 목표","description":"문제를 해결했을 때 최종적으로 얻고 싶은 상태입니다. 구현 방법보다 먼저 정해야 하며, 목표가 분명하면 불필요한 기능을 줄이기 쉽습니다.","usage":"‘이 프로그램이 성공했다는 것을 무엇으로 판단할까?’를 정할 때 씁니다.","example":"예: 사용자가 결제 전에 최종 금액과 배송비를 정확히 확인할 수 있게 한다."}],"extras":[{"title":"단어를 코드보다 먼저 보는 이유","body":"초보자는 코드 문법부터 찾기 쉽지만, 문제·요구사항·목표가 섞여 있으면 어떤 문법을 써도 방향을 잃습니다. 먼저 해야 할 일을 문장으로 분리하세요."}]},{"id":"t3-c1-p2","kind":"glossary","title":"문제를 쪼갤 때 계속 쓰는 단어","eyebrow":"CHAPTER 01 · 시작 전 단어집 2/2","paragraphs":["두 번째 단어집은 문제를 실제 단계로 바꿀 때 사용하는 표현입니다. 트랙 1·2에서 배운 변수·조건문·반복문을 어디에 써야 하는지 결정할 때 이 단어들이 기준이 됩니다.","각 단어는 따로 외우지 말고 ‘입력 → 처리 → 출력’ 흐름 안에서 연결해 보세요."],"glossary":[{"term":"input 입력","description":"프로그램이 일을 시작하기 위해 바깥에서 받는 값입니다. 사용자가 적는 값, 파일에서 읽은 값, 함수에 전달한 값 등이 모두 입력이 될 수 있습니다.","usage":"문제를 풀기 전에 어떤 정보가 반드시 필요한지 찾을 때 씁니다.","example":"예: 주문 금액 42,000원, 회원 여부 True."},{"term":"output 출력","description":"프로그램이 처리 후 만들어 내는 결과입니다. 화면의 문장, 계산 결과, 저장된 파일, 바뀐 상태처럼 사용자가 확인할 수 있는 결과를 포함합니다.","usage":"프로그램이 끝났을 때 무엇이 보여야 성공인지 정할 때 씁니다.","example":"예: 최종 결제 금액 45,000원, 배송비 3,000원."},{"term":"constraint 제약조건","description":"해결 방법이 반드시 지켜야 하는 제한이나 규칙입니다. 가능한 입력 범위, 금지된 값, 시간·메모리·비즈니스 규칙 등이 여기에 들어갑니다.","usage":"정상적인 경우뿐 아니라 허용되지 않는 경우와 경계값을 찾을 때 씁니다.","example":"예: 주문 금액은 0보다 작을 수 없다."},{"term":"decomposition 분해","description":"큰 문제를 한 번에 해결하려 하지 않고 서로 설명 가능한 작은 일들로 나누는 방법입니다. 각 단계가 한 문장으로 설명될 정도면 코드로 옮기기 쉬워집니다.","usage":"문제가 복잡해서 어디서부터 코드를 써야 할지 모를 때 씁니다.","example":"예: 입력 받기 → 값 검증 → 할인 계산 → 배송비 계산 → 합계 출력."}],"extras":[{"title":"이번 챕터의 핵심","body":"코드를 먼저 쓰지 않고 입력·출력·제약조건을 찾은 뒤, 문제를 작은 단계로 나누는 순서를 몸에 익히는 것이 목표입니다."}]},{"id":"t3-c1-setup","kind":"concept","title":"코드를 열기 전에 네 칸부터 적으세요","eyebrow":"시작하기 전 · 문제 정리","paragraphs":["문제를 읽자마자 코드 편집기를 열면 문법부터 떠올리게 됩니다. 트랙 3에서는 먼저 메모장이나 종이에 ‘목표 / 입력 / 출력 / 제약조건’ 네 칸을 적습니다.","목표에는 프로그램이 끝났을 때 무엇이 달라져야 하는지 한 문장으로 씁니다. 입력에는 필요한 값, 출력에는 보여 줄 결과, 제약조건에는 지켜야 할 규칙과 허용되지 않는 값을 적습니다.","이 네 칸이 비어 있는 상태에서 코드를 쓰기 시작하면 중간에 규칙을 새로 발견해 코드를 여러 번 뜯어고칠 가능성이 커집니다. 반대로 네 칸이 채워지면 어떤 변수와 조건이 필요한지 훨씬 잘 보입니다.","완벽하게 적을 필요는 없습니다. 처음 메모는 가설입니다. 예제를 풀거나 질문을 받으면서 빠진 요구사항을 발견하면 메모를 수정하면 됩니다."],"bullets":["목표: 무엇이 되면 해결된 것인가?","입력: 어떤 값이 들어오는가?","출력: 무엇을 보여 주거나 저장하는가?","제약조건: 반드시 지켜야 할 규칙은 무엇인가?"],"calloutTitle":"코드보다 먼저 적을 네 줄","calloutBody":"목표 → 입력 → 출력 → 제약조건. 막히면 이 네 줄 중 비어 있는 곳부터 찾으세요."},{"id":"t3-c1-p3","kind":"concept","title":"문제와 해결 방법을 먼저 분리하세요","eyebrow":"CHAPTER 01 · 개념 1/5","paragraphs":["‘배송비를 계산한다’는 문제이고 ‘if문을 쓴다’는 해결 방법입니다. 둘을 섞으면 아직 문제를 제대로 이해하지 않았는데도 익숙한 문법에 끌려갈 수 있습니다.","처음에는 어떤 문법을 쓸지 적지 말고 사용자가 원하는 결과와 지켜야 할 규칙만 문장으로 정리하세요. 그다음 각 규칙을 표현할 수 있는 문법을 고릅니다.","같은 문제도 여러 방법으로 해결할 수 있습니다. 따라서 좋은 문제 해결의 시작은 ‘무슨 코드를 쓸까?’가 아니라 ‘정확히 무엇을 만족해야 할까?’입니다."],"calloutTitle":"문제와 방법을 구분하는 질문","calloutBody":"이 문장에서 Python 문법 이름을 지워도 사용자가 원하는 결과가 그대로 설명된다면, 문제 정의에 가깝습니다.","extras":[{"title":"트랙 1·2와 연결","body":"트랙 1에서 배운 변수·타입, 트랙 2에서 배운 조건문·반복문·함수는 해결 도구입니다. 트랙 3에서는 어떤 상황에 어떤 도구를 꺼낼지 결정합니다."}]},{"id":"t3-c1-p4","kind":"concept","title":"입력과 출력을 먼저 고정하면 길이 보입니다","eyebrow":"CHAPTER 01 · 개념 2/5","paragraphs":["문제가 길어 보여도 시작값과 마지막 결과를 먼저 잡으면 가운데 과정이 훨씬 단순해집니다. 입력은 시작점, 출력은 도착점입니다.","예를 들어 ‘주문 금액과 회원 여부를 받아 최종 금액을 보여 준다’면 입력은 주문 금액과 회원 여부이고 출력은 최종 금액입니다. 이제 가운데에서 할인과 배송비를 계산해야 한다는 사실이 드러납니다.","출력을 구체적으로 적는 것도 중요합니다. ‘결과를 보여 준다’보다 ‘할인액, 배송비, 최종 결제 금액을 각각 보여 준다’가 더 좋은 정의입니다."],"calloutTitle":"입력·출력을 적는 기준","calloutBody":"입력은 프로그램이 시작할 때 아직 모르는 값, 출력은 해결이 끝났다는 것을 확인하게 해 주는 값입니다."},{"id":"t3-c1-p5","kind":"concept","title":"큰 문제는 동사 하나짜리 단계로 나누세요","eyebrow":"CHAPTER 01 · 개념 3/5","paragraphs":["‘주문 계산 프로그램 만들기’는 너무 큽니다. 대신 ‘금액 받기’, ‘잘못된 값 검사하기’, ‘할인 계산하기’, ‘배송비 계산하기’, ‘최종 금액 더하기’, ‘결과 보여 주기’처럼 동사 하나가 중심인 단계로 나눕니다.","한 단계가 너무 길게 설명돼야 한다면 아직 큰 단계일 가능성이 큽니다. 반대로 너무 잘게 나눠서 한 글자 바꾸는 수준이 되면 흐름을 보기 어려워집니다.","좋은 분해의 기준은 각 단계를 따로 테스트하거나 설명할 수 있는가입니다. 단계마다 입력과 결과가 무엇인지 말할 수 있으면 코드로 옮기기도 쉽습니다."],"bullets":["값을 받는다.","허용되는 값인지 확인한다.","규칙에 따라 중간값을 계산한다.","중간값을 합쳐 최종 결과를 만든다.","결과를 사용자에게 보여 준다."],"calloutTitle":"한 단계 = 한 가지 책임","calloutBody":"‘입력 받고 계산하고 출력한다’처럼 여러 동사가 한 문장에 붙어 있으면 더 나눌 수 있는지 확인하세요."},{"id":"t3-c1-p6","kind":"concept","title":"각 단계는 순서·조건·반복으로 분류할 수 있습니다","eyebrow":"CHAPTER 01 · 개념 4/5","paragraphs":["단계를 나눈 뒤에는 각 단계가 어떤 흐름인지 표시합니다. 위에서 아래로 한 번 실행되는 일은 순서, 상황에 따라 갈라지는 일은 조건, 같은 일을 여러 번 하는 것은 반복입니다.","예를 들어 ‘주문 금액을 받는다 → 50,000원 이상인지 확인한다 → 배송비를 정한다 → 결과를 보여 준다’에서 금액 받기와 출력은 순서, 50,000원 판단은 조건입니다.","여러 상품 가격을 하나씩 더해야 한다면 그 부분은 반복입니다. 이렇게 먼저 흐름을 분류하면 트랙 2에서 배운 if·for·while·함수를 어디에 써야 할지 자연스럽게 연결됩니다."],"calloutTitle":"문법은 흐름을 표현하는 도구","calloutBody":"순서 → 일반 문장, 조건 → if/elif/else, 반복 → for/while처럼 문제 구조가 먼저이고 문법 선택은 그다음입니다.","extras":[{"title":"함수는 어디에 쓰나요?","body":"여러 단계 중 독립적으로 설명할 수 있고 반복해서 사용할 가능성이 있는 묶음은 함수 후보가 됩니다. 먼저 문제를 나눈 뒤 함수 경계를 정하세요."}]},{"id":"t3-c1-p7","kind":"concept","title":"경계값과 잘못된 입력을 코드 전에 찾으세요","eyebrow":"CHAPTER 01 · 개념 5/5","paragraphs":["요구사항이 ‘50,000원 이상 무료배송’이라면 70,000원만 시험해서는 조건이 정확한지 알기 어렵습니다. 49,999원, 50,000원, 50,001원을 확인해야 >=와 >의 차이를 잡을 수 있습니다.","또 주문 금액이 -1원처럼 현실적으로 허용되지 않는 값도 생각해야 합니다. 이런 값이 들어왔을 때 계산을 계속할지, 오류를 보여 줄지 요구사항에 적어야 합니다.","문제를 분해할 때 테스트 예시까지 같이 적으면 빠진 규칙을 조기에 발견할 수 있습니다. 코드를 다 쓴 뒤 테스트를 생각하는 것보다 훨씬 싸게 오류를 줄일 수 있습니다."],"calloutTitle":"최소 테스트 세트","calloutBody":"정상값 1개 + 경계 바로 아래 + 경계값 + 경계 바로 위 + 잘못된 값 1개를 먼저 준비해 보세요."},{"id":"t3-c1-p8","kind":"visual","title":"문제 해결의 전체 흐름을 한 줄로 연결합니다","eyebrow":"흐름으로 이해하기","paragraphs":["문제를 해결할 때는 코드를 바로 쓰기보다 아래 순서대로 생각하면 빠뜨리는 조건이 줄어듭니다.","각 단계가 끝날 때 ‘지금 무엇을 확정했는가?’를 말할 수 있어야 합니다. 목표가 불분명한데 입력을 정하거나, 제약조건을 모른 채 코드를 쓰면 뒤에서 다시 돌아올 가능성이 큽니다.","이 흐름은 Python뿐 아니라 웹, 앱, 데이터 처리, 자동화에서도 그대로 사용할 수 있습니다."],"bullets":["1. 목표를 한 문장으로 정의합니다.","2. 입력과 출력을 목록으로 적습니다.","3. 제약조건과 경계값을 찾습니다.","4. 큰 일을 작은 단계로 나눕니다.","5. 단계별로 순서·조건·반복을 표시합니다.","6. 의사코드나 짧은 문장으로 흐름을 점검합니다.","7. 코드를 작성하고 준비한 테스트로 확인합니다."],"visual":"PROBLEM_SOLVING_FLOW"},{"id":"t3-c1-p9","kind":"concept","title":"의사코드는 문법 없이 실행 순서를 적는 메모입니다","eyebrow":"CHAPTER 01 · 코드 전 마지막 단계","paragraphs":["의사코드(pseudocode)는 실제 Python 문법이 아니라 사람이 읽기 쉽게 실행 순서를 적은 메모입니다. 괄호나 콜론을 맞히는 것이 목적이 아니라 빠진 단계가 없는지 확인하는 것이 목적입니다.","예를 들어 ‘주문 금액을 받는다 → 금액이 음수면 오류를 보여 준다 → 50,000원 이상이면 배송비 0원, 아니면 3,000원 → 최종 금액을 출력한다’처럼 적을 수 있습니다.","의사코드가 자연스럽게 읽히면 실제 코드로 옮길 때 각 문장을 변수, if, 함수 같은 문법으로 바꾸면 됩니다. 반대로 의사코드부터 설명이 꼬이면 코드도 복잡해질 가능성이 큽니다."],"calloutTitle":"좋은 의사코드의 기준","calloutBody":"Python 문법을 몰라도 다른 사람이 읽고 ‘무슨 순서로 처리하는지’ 설명할 수 있어야 합니다.","extras":[{"title":"너무 자세히 적지 마세요","body":"의사코드는 코드의 한국어 번역본이 아닙니다. 중요한 판단과 데이터 변화를 중심으로 5~10줄 안에서 먼저 잡으세요."}]},{"id":"t3-c1-p10","kind":"example","title":"주문 금액 문제를 코드보다 먼저 설계합니다","eyebrow":"핵심 예제","paragraphs":["문제: 주문 금액이 50,000원 이상이면 무료배송이고, 그렇지 않으면 배송비 3,000원을 더해 최종 결제 금액을 보여 줍니다. 음수 금액은 허용하지 않습니다.","목표는 최종 결제 금액을 정확히 보여 주는 것입니다. 입력은 주문 금액, 출력은 배송비와 최종 금액, 제약조건은 주문 금액이 0 이상이어야 한다는 점과 무료배송 기준입니다.","분해하면 ① 금액 받기 ② 음수 검사 ③ 배송비 결정 ④ 최종 금액 계산 ⑤ 출력의 다섯 단계가 됩니다. 여기서 ②와 ③은 조건, 나머지는 순서입니다.","코드를 보기 전에 49,999원, 50,000원, -1원을 넣으면 각각 어떤 결과가 나와야 하는지 먼저 적어 보세요."],"calloutTitle":"의사코드","calloutBody":"금액을 받는다 → 음수면 오류 → 50,000원 이상이면 배송비 0, 아니면 3,000 → 최종 금액 계산 → 배송비와 최종 금액 출력","code":"order = 49999\n\nif order \u003c 0:\n    print(\"잘못된 금액\")\nelse:\n    if order >= 50000:\n        shipping = 0\n    else:\n        shipping = 3000\n\n    total = order + shipping\n    print(\"배송비:\", shipping)\n    print(\"최종 금액:\", total)","codeNote":"예상 결과\n배송비: 3000\n최종 금액: 52999\n\norder를 50000, -1로 바꿔 결과를 비교하세요.","extras":[{"title":"코드보다 설계가 먼저인 이유","body":"이 코드는 어려운 문법이 아니라 이미 배운 if와 변수만 사용합니다. 핵심은 어떤 조건과 단계가 필요한지 코드 전에 결정한 것입니다."}]},{"id":"t3-c1-p11","kind":"practice","title":"카페 주문 문제를 네 칸과 단계로 분해하세요","eyebrow":"실습 · 직접 설계하기","paragraphs":["이번 실습의 핵심은 코드를 빨리 쓰는 것이 아니라 요구사항을 구조로 바꾸는 것입니다. 먼저 목표·입력·출력·제약조건을 적고, 그다음 단계 목록과 테스트 값을 만드세요.","문제: 음료 가격과 수량을 받아 총액을 계산합니다. 총액이 20,000원 이상이면 10% 할인합니다. 수량은 1개 이상이어야 합니다. 최종 결제 금액과 할인액을 보여 줍니다.","한 번에 Python 코드부터 작성하지 마세요. 먼저 자연어 단계만 완성하고, 각 단계 옆에 순서·조건·반복 중 무엇인지 표시하세요.","마지막으로 경계값을 포함한 테스트를 최소 네 개 만드세요. 예: 할인 기준 바로 아래, 정확히 기준값, 기준 바로 위, 잘못된 수량."],"practicePrompt":"① 목표·입력·출력·제약조건 네 칸 작성 ② 처리 과정을 5~7단계로 분해 ③ 각 단계를 순서/조건/반복으로 표시 ④ 총액 19,999원·20,000원·20,001원과 수량 0을 테스트에 포함 ⑤ 가능하면 마지막에 Python 코드로 옮기기","answerOnNext":true,"extras":[]},{"id":"t3-c1-p11-solution","kind":"solution","title":"카페 주문 문제를 네 칸과 단계로 분해하세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["목표: 음료 가격과 수량으로 정상적인 최종 결제 금액을 계산합니다. 입력: price, count. 출력: 할인액과 최종 결제 금액. 제약조건: count는 1 이상이며 총액 20,000원 이상에서 10% 할인합니다.","단계는 ① 가격·수량 받기 ② 수량 검증 ③ 원래 총액 계산 ④ 20,000원 이상인지 판단 ⑤ 할인액 계산 ⑥ 최종 금액 계산 ⑦ 결과 출력으로 나눌 수 있습니다.","19,999원과 20,000원을 비교하면 할인 기준의 >=가 맞는지 확인할 수 있고, 수량 0은 정상 계산 전에 입력 검증이 동작하는지 확인합니다.","아래 코드는 한 가지 가능한 구현입니다. 중요한 것은 이 코드를 외우는 것이 아니라 위의 네 칸과 단계가 코드의 각 부분에 어떻게 대응하는지 연결하는 것입니다."],"code":"price = 10000\ncount = 2\n\nif count \u003c 1:\n    print(\"수량은 1개 이상이어야 합니다\")\nelse:\n    subtotal = price * count\n\n    if subtotal >= 20000:\n        discount = subtotal * 0.1\n    else:\n        discount = 0\n\n    total = subtotal - discount\n    print(\"할인액:\", discount)\n    print(\"최종 금액:\", total)","codeNote":"테스트 기준\n총액 19,999원 → 할인 없음\n총액 20,000원 → 10% 할인\n총액 20,001원 → 10% 할인\n수량 0 → 계산하지 않고 안내 문구"},{"id":"t3-c1-p12","kind":"check","title":"코드 전에 무엇을 확인해야 하는지 점검합니다","eyebrow":"확인 문제","paragraphs":["아래 상황을 읽고 바로 코드를 떠올리지 말고 무엇이 빠졌는지 설명해 보세요.","요구사항: ‘나이에 따라 요금을 계산한다. 어린이는 할인한다.’ 개발자가 바로 if age \u003c 13 코드를 작성했습니다.","이 요구사항만으로는 정확한 프로그램을 만들기 어렵습니다. 답을 보기 전에 빠진 정보와 먼저 물어봐야 할 질문을 최소 세 개 적어 보세요."],"question":"‘어린이는 할인한다’라는 문장만 보고 바로 age \u003c 13을 쓰면 왜 위험할까요? 코드를 쓰기 전에 무엇을 확정해야 하나요?","answerOnNext":true,"extras":[{"title":"힌트 1","body":"‘어린이’의 나이 기준이 명확한가요?"},{"title":"힌트 2","body":"할인율 또는 할인 금액이 정해져 있나요?"},{"title":"힌트 3","body":"정상 요금과 출력 형식은 무엇인가요?"}]},{"id":"t3-c1-p12-solution","kind":"solution","title":"코드 전에 무엇을 확인해야 하는지 점검합니다 · 풀이","eyebrow":"정답과 풀이","paragraphs":["‘어린이’의 기준 나이, 기본 요금, 할인 방식, 경계 나이 처리, 입력 가능한 나이 범위가 정해지지 않았기 때문입니다. age \u003c 13은 개발자가 임의로 만든 규칙일 수 있습니다.","코드를 쓰기 전에 최소한 ① 어린이 기준 나이 ② 기본 요금 ③ 할인율/할인액 ④ 경계값 포함 여부 ⑤ 잘못된 나이 입력 처리 ⑥ 무엇을 출력할지 확정해야 합니다.","문법적으로 맞는 코드는 요구사항이 맞다는 뜻이 아닙니다. 문제 해결에서는 ‘코드가 실행되는가’와 ‘올바른 문제를 풀고 있는가’를 따로 확인해야 합니다."],"extras":[]},{"id":"t3-c1-p13","kind":"summary","title":"지금 알아야 할 것","eyebrow":"Chapter 1 정리","paragraphs":["문제 해결의 시작은 코드를 작성하는 것이 아니라 해결할 문제를 정확히 정의하는 것입니다. 목표·입력·출력·제약조건이 먼저입니다.","큰 문제는 한 번에 구현하지 말고 각각 설명하고 테스트할 수 있는 작은 단계로 나눕니다. 각 단계가 순서·조건·반복 중 어떤 흐름인지 표시하면 이미 배운 Python 문법과 연결하기 쉽습니다.","경계값과 잘못된 입력을 코드 작성 전에 생각하면 숨은 규칙을 발견할 수 있습니다. 테스트는 마지막 검사가 아니라 설계를 더 정확하게 만드는 도구입니다.","의사코드는 문법을 맞히는 작업이 아니라 실행 흐름을 점검하는 메모입니다. 의사코드가 자연스럽게 설명되면 실제 코드도 단순해질 가능성이 높습니다.","코드를 작성하다가 조건이 계속 늘어나거나 변수 역할이 헷갈리면 코드를 더 붙이지 말고 목표 → 입력/출력 → 제약조건 → 단계 분해 → 테스트 예시 순서로 한 칸씩 돌아가 확인하세요."],"bullets":["목표·입력·출력·제약조건을 코드보다 먼저 적는다.","문제와 해결 방법을 분리한다.","큰 일을 동사 하나짜리 작은 단계로 나눈다.","각 단계를 순서·조건·반복으로 분류한다.","경계값과 잘못된 입력을 테스트 예시에 포함한다.","의사코드로 흐름을 점검한 뒤 Python 코드로 옮긴다."],"extras":[{"title":"기억할 것 vs 직접 할 것","body":"외울 것은 목표·입력·출력·제약조건·분해의 의미입니다. 직접 연습할 것은 실제 요구사항을 네 칸과 단계 목록으로 바꾸는 일입니다."}]}]},{"id":"t3-c2","track":3,"chapter":2,"title":"작은 단계를 알고리즘으로 연결하기","remember":"알고리즘은 입력에서 출력까지 가는 정확한 순서이며, 조건·상태·경계값을 추적해 맞는지 확인한다","practiceGoal":"자연어 요구사항을 알고리즘·의사코드·추적표·테스트로 바꾸고 Python 코드와 연결한다","pages":[{"id":"t3-c2-p1","kind":"glossary","title":"알고리즘을 배울 때 먼저 알아둘 단어","eyebrow":"CHAPTER 02 · 시작 전 단어집 1/3","paragraphs":["챕터 1에서 큰 문제를 작은 단계로 나눴다면, 챕터 2에서는 그 단계들을 아무렇게나 늘어놓지 않고 ‘정확한 실행 순서’로 연결합니다. 이 연결된 순서가 알고리즘의 시작입니다.","여기서 중요한 것은 어려운 수학이 아닙니다. 다른 사람이 그대로 따라 해도 같은 결과가 나오도록 일을 분명하게 적는 연습입니다."],"glossary":[{"term":"algorithm 알고리즘","description":"어떤 문제를 해결하기 위해 따라가는 명확한 단계들의 순서입니다. 시작점과 끝이 있고, 각 단계가 무엇을 해야 하는지 이해할 수 있어야 합니다.","usage":"문제를 코드로 옮기기 전에 처리 순서를 설계할 때 씁니다.","example":"예: 주문 금액 받기 → 할인 여부 판단 → 최종 금액 계산 → 결과 출력."},{"term":"step 단계","description":"알고리즘을 이루는 한 조각의 행동이나 판단입니다. 한 단계는 가능하면 한 가지 일을 중심으로 적는 것이 읽기 쉽습니다.","usage":"큰 일을 작은 실행 단위로 나눌 때 씁니다.","example":"예: ‘회원인지 확인한다’는 하나의 step입니다."},{"term":"rule 규칙","description":"어떤 상황에서 무엇을 해야 하는지를 정한 약속입니다. 프로그램에서는 숫자 기준, 허용 범위, 할인 조건처럼 결과를 바꾸는 기준이 됩니다.","usage":"조건과 결과를 정확하게 연결할 때 씁니다.","example":"예: 총액이 20,000원 이상이면 10% 할인한다."}],"extras":[]},{"id":"t3-c2-p2","kind":"glossary","title":"길이 갈라지고 값이 바뀔 때 쓰는 단어","eyebrow":"CHAPTER 02 · 시작 전 단어집 2/3","paragraphs":["알고리즘은 항상 직선으로만 움직이지 않습니다. 어떤 상황에서는 A로 가고, 다른 상황에서는 B로 갑니다. 또 중간에 값이 바뀌면 다음 판단 결과도 달라집니다.","조건·분기·상태를 이해하면 긴 코드를 보더라도 ‘지금 왜 이 길로 갔지?’를 따라갈 수 있습니다."],"glossary":[{"term":"condition 조건","description":"참인지 거짓인지 판단할 수 있는 기준입니다. 조건의 결과에 따라 다음에 실행할 단계가 달라질 수 있습니다.","usage":"알고리즘의 길이 갈리는 지점을 만들 때 씁니다.","example":"예: age \u003c 13, total >= 20000."},{"term":"branch 분기","description":"조건 결과에 따라 서로 다른 길로 나뉘는 것을 말합니다. Python의 if/elif/else가 분기를 코드로 표현하는 대표적인 방법입니다.","usage":"상황별 처리 방법이 다를 때 씁니다.","example":"예: 재고가 있으면 결제 진행, 없으면 품절 안내."},{"term":"state 상태","description":"지금 이 순간 프로그램이 기억하고 있는 값이나 상황입니다. 상태가 바뀌면 같은 조건을 다시 검사해도 결과가 달라질 수 있습니다.","usage":"잔액, 재고, 시도 횟수처럼 실행 중 바뀌는 값을 설명할 때 씁니다.","example":"예: 로그인 실패 횟수가 0 → 1 → 2로 바뀌는 것이 state 변화입니다."}],"extras":[]},{"id":"t3-c2-p3","kind":"glossary","title":"맞는 알고리즘인지 확인할 때 쓰는 단어","eyebrow":"CHAPTER 02 · 시작 전 단어집 3/3","paragraphs":["알고리즘을 적었다고 끝이 아닙니다. 실제 값을 넣어 한 줄씩 따라가 보고, 경계에서 틀리지 않는지 확인해야 합니다.","이 페이지의 단어들은 코드를 쓰기 전에도 사용할 수 있습니다. 종이에 적은 알고리즘만으로도 상당수의 실수를 먼저 잡을 수 있습니다."],"glossary":[{"term":"pseudocode 의사코드","description":"실제 프로그래밍 문법 대신 사람이 읽기 쉬운 문장으로 실행 순서를 적는 방법입니다. 문법 정확성보다 흐름 확인이 목적입니다.","usage":"설계한 알고리즘을 코드로 옮기기 전에 점검할 때 씁니다.","example":"예: ‘재고가 0이면 품절을 출력하고 끝낸다.’"},{"term":"trace 추적","description":"하나의 입력을 넣고 알고리즘을 한 단계씩 따라가며 값과 이동 경로가 어떻게 바뀌는지 기록하는 작업입니다.","usage":"예상과 실제 흐름이 같은지 확인할 때 씁니다.","example":"예: 잔액 5,000 → 결제 3,000 → 새 잔액 2,000."},{"term":"edge case 경계·특수 경우","description":"평소 값과 달리 오류가 잘 숨어 있는 경계나 드문 상황입니다. 최소값, 최대값, 0, 빈 값, 기준 바로 앞뒤가 대표적입니다.","usage":"정상 예제만으로 놓치기 쉬운 오류를 찾을 때 씁니다.","example":"예: 할인 기준이 20,000원이면 19,999·20,000·20,001을 확인합니다."},{"term":"correctness 정확성","description":"알고리즘이 약속한 모든 중요한 경우에서 올바른 결과를 만드는 성질입니다. 한 번 맞았다는 것만으로는 정확성이 증명되지 않습니다.","usage":"알고리즘이 요구사항을 제대로 만족하는지 판단할 때 씁니다.","example":"예: 정상값뿐 아니라 경계값과 잘못된 입력에서도 정해진 동작을 해야 합니다."}]},{"id":"t3-c2-setup","kind":"concept","title":"알고리즘은 레시피와 비슷하지만 더 정확해야 합니다","eyebrow":"시작하기 전 · 가장 쉬운 비유","paragraphs":["라면 끓이는 방법을 생각해 보세요. ‘맛있게 끓인다’라고만 적으면 사람마다 행동이 달라집니다. 물을 얼마나 넣는지, 언제 면을 넣는지, 몇 분 끓이는지처럼 순서와 기준을 적어야 다른 사람도 비슷한 결과를 만들 수 있습니다.","알고리즘도 같습니다. ‘계산한다’, ‘적당하면 할인한다’, ‘문제가 있으면 처리한다’처럼 모호하게 쓰면 컴퓨터는 무엇을 해야 할지 결정할 수 없습니다.","좋은 알고리즘은 ① 시작할 때 필요한 값이 무엇인지 ② 어떤 순서로 움직이는지 ③ 어디에서 길이 갈리는지 ④ 값이 어떻게 바뀌는지 ⑤ 언제 끝나는지가 보입니다.","처음부터 멋진 알고리즘을 만들 필요는 없습니다. 아주 쉬운 말로 적고, 실제 값을 넣어 따라가면서 모호한 부분을 하나씩 고치면 됩니다."],"bullets":["사람에게도 설명할 수 있어야 합니다.","같은 입력이면 같은 규칙으로 같은 결과가 나와야 합니다.","각 단계가 무엇을 하는지 애매하지 않아야 합니다.","언제 시작하고 언제 끝나는지 알 수 있어야 합니다."],"calloutTitle":"가장 중요한 질문","calloutBody":"‘내가 옆에서 설명하지 않아도 다른 사람이 이 순서만 보고 그대로 따라갈 수 있을까?’"},{"id":"t3-c2-p4","kind":"concept","title":"알고리즘은 ‘코드’가 아니라 ‘해결 순서’입니다","eyebrow":"CHAPTER 02 · 개념 1/10","paragraphs":["알고리즘은 Python 문법이 아닙니다. 같은 알고리즘을 Python으로도, JavaScript로도, 손으로 계산하는 순서로도 표현할 수 있습니다.","예를 들어 ‘두 숫자 중 큰 값을 찾는다’는 문제에서 알고리즘은 두 값을 비교하고 더 큰 값을 결과로 선택하는 순서입니다. Python의 if는 그 순서를 코드로 표현하는 도구일 뿐입니다.","이 구분이 중요한 이유는 문법을 잊어도 문제 해결 순서를 다시 만들 수 있기 때문입니다. AI가 코드를 대신 작성해도, 알고리즘이 맞는지 판단하려면 사람이 해결 순서를 이해해야 합니다."],"calloutTitle":"알고리즘과 코드의 관계","calloutBody":"알고리즘 = 무엇을 어떤 순서로 할지. 코드 = 그 알고리즘을 특정 프로그래밍 언어로 적은 것."},{"id":"t3-c2-p5","kind":"concept","title":"같은 단계도 순서가 바뀌면 결과가 달라집니다","eyebrow":"CHAPTER 02 · 개념 2/10","paragraphs":["‘할인 전 금액을 계산한다 → 할인 여부를 판단한다 → 할인액을 뺀다’는 순서는 자연스럽습니다. 그런데 할인 여부를 먼저 판단하려고 하면 아직 총액이 없어서 기준을 확인할 수 없습니다.","프로그램은 필요한 값이 만들어지기 전에 그 값을 사용할 수 없습니다. 그래서 각 단계 앞에서 ‘이 단계가 실행되려면 무엇이 이미 준비되어 있어야 하지?’를 확인해야 합니다.","순서를 점검하는 가장 쉬운 방법은 화살표를 그리는 것입니다. 앞 단계의 결과가 다음 단계의 재료가 되는지 보면 잘못된 순서를 찾기 쉽습니다."],"visual":"TOP_TO_BOTTOM","bullets":["입력을 받기 전에 계산할 수 없습니다.","총액을 만들기 전에 총액 기준 할인을 판단할 수 없습니다.","최종 결과가 만들어지기 전에 출력할 수 없습니다."]},{"id":"t3-c2-p6","kind":"concept","title":"‘적당히’ 같은 말은 알고리즘에 그대로 둘 수 없습니다","eyebrow":"CHAPTER 02 · 개념 3/10","paragraphs":["사람끼리는 ‘조금 비싸면 할인해 줘’ 같은 말을 알아서 해석할 수 있지만 컴퓨터는 ‘조금’이 얼마인지 모릅니다. 알고리즘에서는 판단 기준을 숫자나 명확한 규칙으로 바꿔야 합니다.","‘재고가 부족하면 경고’도 부족합니다. 재고가 0일 때만 경고인지, 5개 미만이면 경고인지 정해야 합니다.","요구사항에 기준이 없다면 개발자가 임의로 정하지 말고 ‘확인해야 할 질문’으로 남깁니다. 모호함을 숨기지 않는 것이 좋은 문제 해결입니다."],"bullets":["나쁘게 적은 단계: 금액이 크면 할인한다.","좋게 적은 단계: 총액이 50,000원 이상이면 10% 할인한다.","나쁘게 적은 단계: 너무 많이 실패하면 막는다.","좋게 적은 단계: 로그인 실패가 3회가 되면 더 이상 시도하지 못하게 한다."],"calloutTitle":"모호함 탐지법","calloutBody":"‘얼마나? 언제? 몇 번? 어떤 경우?’라는 질문에 숫자나 규칙으로 답할 수 없는 문장을 찾아보세요."},{"id":"t3-c2-p7","kind":"concept","title":"각 단계는 값을 받아서 바꾸고 다음 단계에 넘깁니다","eyebrow":"CHAPTER 02 · 개념 4/10","paragraphs":["알고리즘을 데이터의 이동으로 보면 훨씬 단순해집니다. 입력값이 들어오고, 한 단계가 그 값을 검사하거나 바꾸고, 결과를 다음 단계로 넘깁니다.","예를 들어 가격 8,000원과 수량 3개를 받으면 ‘총액 계산’ 단계가 24,000원을 만듭니다. 다음 ‘할인 판단’ 단계는 24,000원을 보고 할인 여부를 결정합니다.","긴 알고리즘에서도 한 번에 전체를 보지 말고 ‘이 단계가 받는 값 / 하는 일 / 내보내는 값’을 적으면 흐름이 보입니다."],"visual":"IPO_PROJECT","bullets":["받는 값: 이 단계가 시작될 때 이미 있는 정보","하는 일: 계산·검사·변환·선택","내보내는 값: 다음 단계가 사용할 결과"]},{"id":"t3-c2-p8","kind":"concept","title":"조건은 알고리즘의 갈림길입니다","eyebrow":"CHAPTER 02 · 개념 5/10","paragraphs":["조건은 질문 하나라고 생각하면 쉽습니다. ‘재고가 있는가?’, ‘나이가 13세 미만인가?’, ‘총액이 20,000원 이상인가?’처럼 예/아니오로 답할 수 있는 질문입니다.","조건이 참이면 한쪽 길, 거짓이면 다른 길로 갑니다. 중요한 것은 각 길에서 무엇을 하는지와 다시 어디에서 만나는지가 보이는 것입니다.","조건을 너무 많이 한 줄에 묶으면 초보자가 흐름을 잃기 쉽습니다. 먼저 작은 질문으로 나누고, 정말 함께 판단해야 하는 것만 합치는 편이 안전합니다."],"bullets":["질문: 재고가 0인가?","예 → ‘품절’ 출력 후 종료","아니오 → 결제 가능 여부 확인","그다음 다시 공통 흐름으로 이어지거나 프로그램이 끝납니다."],"calloutTitle":"조건을 말로 읽기","calloutBody":"if stock == 0: 을 보면 먼저 ‘재고가 0인가?’라고 한국어 질문으로 읽으세요."},{"id":"t3-c2-p9","kind":"concept","title":"상태는 프로그램이 들고 있는 ‘현재 상황 메모’입니다","eyebrow":"CHAPTER 02 · 개념 6/10","paragraphs":["같은 프로그램도 현재 상태가 다르면 다음 행동이 달라집니다. 자판기의 재고가 5개일 때와 0개일 때, 카드 잔액이 10,000원일 때와 500원일 때 결과가 다릅니다.","상태는 보통 변수에 저장됩니다. 중요한 점은 값이 ‘바뀐다’는 것입니다. 결제가 성공하면 잔액이 줄고, 상품을 판매하면 재고가 줄고, 로그인에 실패하면 실패 횟수가 늘어납니다.","알고리즘을 추적할 때는 상태가 바뀌는 줄에 표시를 남기세요. 오류는 상태를 바꿔야 하는데 안 바꾸거나, 바꾸면 안 되는 상황에서 바꾸는 경우에 자주 생깁니다."],"bullets":["결제 전 잔액: 10,000","가격: 3,000","결제 성공 후 잔액: 7,000","다음 결제 판단은 10,000이 아니라 7,000을 기준으로 해야 합니다."]},{"id":"t3-c2-p10","kind":"concept","title":"반복은 ‘같은 규칙을 여러 대상에 적용’하는 구조입니다","eyebrow":"CHAPTER 02 · 개념 7/10","paragraphs":["상품 1개의 가격만 더하면 한 번 계산하면 됩니다. 하지만 상품이 10개라면 ‘각 상품의 가격을 총합에 더한다’는 같은 규칙을 여러 번 적용해야 합니다.","알고리즘 수준에서는 먼저 ‘무엇을 반복하는가’와 ‘언제 멈추는가’를 적습니다. 그다음 Python에서는 for나 while 중 맞는 도구를 고릅니다.","반복에서 가장 위험한 실수는 상태를 잘못 갱신하는 것입니다. 합계를 더하지 않거나, 횟수를 늘리지 않으면 결과가 틀리거나 반복이 끝나지 않을 수 있습니다."],"bullets":["반복 대상: 상품 목록의 각 가격","반복 중 하는 일: 현재 가격을 total에 더하기","바뀌는 상태: total","종료 조건: 더 확인할 상품이 없을 때"],"calloutTitle":"반복을 보기 전에","calloutBody":"for/while 문법을 떠올리기 전에 ‘같이 반복되는 한 문장’을 먼저 찾으세요."},{"id":"t3-c2-p11","kind":"concept","title":"중간값에 이름을 붙이면 생각이 짧아집니다","eyebrow":"CHAPTER 02 · 개념 8/10","paragraphs":["복잡한 계산을 한 줄에 모두 넣으면 계산 순서를 따라가기 어렵습니다. 총액, 할인액, 배송비처럼 의미가 있는 중간 결과에 이름을 붙이면 알고리즘이 읽기 쉬워집니다.","예를 들어 ‘price * count - price * count * 0.1 + shipping’보다 subtotal, discount, total을 차례로 만드는 편이 초보자에게 훨씬 안전합니다.","중간값은 단순히 코드를 길게 만드는 것이 아닙니다. 어느 단계에서 값이 잘못됐는지 확인할 수 있는 관찰 지점을 만들어 줍니다."],"code":"price = 8000\ncount = 3\nsubtotal = price * count\ndiscount = subtotal * 0.1\ntotal = subtotal - discount\nprint(total)","codeNote":"subtotal = 24000 → discount = 2400.0 → total = 21600.0","extras":[]},{"id":"t3-c2-p12","kind":"concept","title":"추적표는 머릿속 실행을 종이에 꺼내는 방법입니다","eyebrow":"CHAPTER 02 · 개념 9/10","paragraphs":["초보자가 긴 알고리즘을 머릿속으로만 따라가면 현재 값이 쉽게 섞입니다. 추적표는 단계마다 중요한 변수 값을 한 줄씩 적는 표입니다.","예를 들어 자판기에서 cash=5000, price=3000, stock=2라면 시작 상태를 적고, 조건을 검사한 뒤, 결제가 성공하면 change=2000과 stock=1을 적습니다.","추적표는 정답을 외우는 도구가 아니라 ‘어느 순간 값이 달라졌는가’를 찾는 도구입니다. 코드가 없어도 의사코드만으로 만들 수 있습니다."],"bullets":["시작: cash=5000, price=3000, stock=2","재고 검사: stock==0 → False","돈 검사: cash\u003cprice → False","결제 성공: change=2000","상태 변경: stock=1","끝: 상품 제공, 거스름돈 2000"]},{"id":"t3-c2-p13","kind":"concept","title":"경계값은 조건이 바뀌는 바로 그 지점입니다","eyebrow":"CHAPTER 02 · 개념 10/10","paragraphs":["조건문 오류는 기준에서 멀리 떨어진 값보다 기준 바로 근처에서 잘 나타납니다. ‘20,000원 이상 할인’이면 30,000원만 넣어 보는 것보다 19,999원과 20,000원을 비교해야 합니다.","0도 자주 중요한 경계값입니다. 재고 0, 시도 횟수 0, 빈 목록, 잔액 0처럼 ‘없음’을 의미하는 값에서 알고리즘이 예상대로 움직이는지 확인해야 합니다.","경계값을 찾는 습관은 코딩 실력보다 문제 해석 능력에 가깝습니다. 요구사항에서 ‘이상/초과/이하/미만/최대/최소’ 같은 단어를 보면 바로 경계 테스트를 떠올리세요."],"bullets":["기준: 20,000원 이상 → 19,999 / 20,000 / 20,001","최대 3회 → 2회 / 3회 / 4회 시도","1개 이상 → 0 / 1 / 2개","잔액 부족 판단 → 가격보다 1원 적음 / 정확히 같음 / 1원 많음"],"calloutTitle":"조건 기호보다 먼저 한국어를 확인","calloutBody":"‘이상’은 기준값 포함(>=), ‘초과’는 기준값 제외(>)입니다. 문장을 잘못 읽으면 문법이 맞아도 결과가 틀립니다."},{"id":"t3-c2-p14","kind":"concept","title":"실행된다고 해서 알고리즘이 맞는 것은 아닙니다","eyebrow":"정확성 · correctness","paragraphs":["프로그램이 오류 없이 실행되는 것과 올바른 답을 만드는 것은 다른 문제입니다. 할인 기준을 20,000원으로 해야 하는데 2,000원으로 적어도 코드는 멀쩡히 실행될 수 있습니다.","정확성을 확인하려면 요구사항을 하나씩 체크해야 합니다. 정상값에서 맞는지, 경계값에서 맞는지, 잘못된 입력을 약속한 방식으로 처리하는지 확인합니다.","초보자는 ‘한 번 실행해서 화면에 숫자가 나왔다’를 완료로 착각하기 쉽습니다. 더 좋은 완료 기준은 ‘미리 만든 테스트 예시들이 모두 예상 결과와 같다’입니다."],"bullets":["문법 오류가 없는가?","정상 입력에서 맞는가?","경계값에서 조건이 정확한가?","잘못된 입력에서 이상한 계산을 계속하지 않는가?","상태가 성공한 경우에만 바뀌는가?"],"calloutTitle":"완료 기준","calloutBody":"‘돌아간다’가 아니라 ‘약속한 경우들을 테스트했고 결과가 맞다’가 완료에 가깝습니다."},{"id":"t3-c2-p15","kind":"visual","title":"입력에서 출력까지 알고리즘을 한 줄로 봅니다","eyebrow":"흐름으로 이해하기","paragraphs":["알고리즘을 복잡한 문장으로만 보지 말고 입력 → 처리 → 출력의 큰 흐름 안에 조건과 상태 변화를 넣어 보세요.","입력은 시작 재료이고, 처리는 검사·계산·선택·반복이며, 출력은 최종 결과입니다. 상태는 처리 중간에 바뀌며 다음 판단에 영향을 줍니다.","이 큰 틀을 먼저 잡으면 코드가 길어져도 ‘지금 어느 구간을 보고 있는가’를 잃지 않습니다."],"visual":"IPO_PROJECT","bullets":["입력: 사용자가 준 값, 파일에서 읽은 값, 현재 상태","처리: 검증 → 조건 판단 → 계산 → 상태 변경","출력: 화면 결과, 저장된 값, 바뀐 상태","검증: 준비한 테스트를 넣고 예상 결과와 비교"]},{"id":"t3-c2-p16","kind":"concept","title":"의사코드는 ‘사람이 읽는 정확한 실행 순서’입니다","eyebrow":"코드 전 설계 · pseudocode","paragraphs":["의사코드는 한국어 메모이지만 아무 말이나 적는 것은 아닙니다. 위에서 아래로 읽었을 때 실행 순서가 보이고, 조건과 반복의 범위가 분명해야 합니다.","처음에는 한 줄에 한 행동을 적는 것이 좋습니다. ‘입력을 받고 검사해서 계산한다’보다 ‘입력을 받는다 / 허용값인지 검사한다 / 계산한다’로 나누면 빠진 단계를 찾기 쉽습니다.","들여쓰기도 도움이 됩니다. 조건 안에서만 실행되는 문장은 한 칸 안쪽에 적으면 Python 코드의 구조와 자연스럽게 연결됩니다."],"bullets":["1. 한 줄에는 한 행동이나 한 판단을 적습니다.","2. 입력값과 결과값 이름을 가능한 한 구체적으로 적습니다.","3. 조건은 질문처럼 적습니다.","4. 조건 안에서만 하는 일은 들여써서 묶습니다.","5. 상태가 바뀌는 곳은 ‘값을 줄인다/늘린다/바꾼다’고 적습니다.","6. 마지막에 실제 값 하나를 넣어 처음부터 끝까지 따라갑니다."],"calloutTitle":"좋은 의사코드","calloutBody":"다른 사람이 Python을 몰라도 읽을 수 있고, 개발자는 각 줄을 Python 문법으로 옮길 수 있어야 합니다."},{"id":"t3-c2-p17","kind":"example","title":"자판기 문제로 알고리즘을 처음부터 설계합니다","eyebrow":"핵심 예제 1 · 요구사항 정리","paragraphs":["문제: 자판기에 상품 가격과 재고가 있습니다. 사용자가 돈을 넣으면 상품을 살 수 있는지 판단하고, 성공하면 거스름돈을 보여 주고 재고를 1 줄입니다.","규칙 1: 재고가 0이면 돈이 충분해도 판매하지 않습니다. 규칙 2: 넣은 돈이 가격보다 적으면 판매하지 않습니다. 규칙 3: 판매 성공 시에만 재고를 줄입니다.","입력은 넣은 돈 cash, 상품 가격 price, 현재 재고 stock입니다. 출력은 판매 성공 여부와 거스름돈이며, 상태 변화는 stock 감소입니다.","이 문제의 핵심은 조건 순서와 상태 변경입니다. ‘판매 가능한지 확인한 뒤’에만 재고가 줄어야 합니다."],"bullets":["재고 0 → ‘품절’ 출력, 종료","재고 있음 + 돈 부족 → ‘금액 부족’ 출력, 종료","재고 있음 + 돈 충분 → 거스름돈 계산 → 재고 1 감소 → 상품 제공"],"calloutTitle":"먼저 확인할 것","calloutBody":"실패한 경우에는 stock이 절대 줄어들면 안 됩니다."},{"id":"t3-c2-p18","kind":"example","title":"자판기 문제를 의사코드로 적습니다","eyebrow":"핵심 예제 2 · 의사코드","paragraphs":["이제 방금 정리한 규칙을 실제 문법 없이 한 줄씩 적습니다. 각 줄은 사람이 그대로 따라갈 수 있어야 합니다.","조건의 우선순위도 보입니다. 재고가 없으면 돈을 검사할 필요조차 없으므로 품절 검사를 먼저 둡니다.","판매 성공 경로에서만 거스름돈 계산과 재고 감소가 실행되도록 묶습니다."],"calloutTitle":"의사코드","calloutBody":"cash, price, stock을 준비한다\nstock이 0이면 ‘품절’을 보여 주고 끝낸다\n그렇지 않고 cash가 price보다 작으면 ‘금액 부족’을 보여 주고 끝낸다\n그 외에는 cash - price로 거스름돈을 계산한다\nstock을 1 줄인다\n‘구매 성공’과 거스름돈을 보여 준다","extras":[{"title":"왜 품절을 먼저 검사하나요?","body":"재고가 없으면 결제 가능성을 더 볼 필요가 없습니다. 불필요한 계산을 줄이고 실패 이유도 더 정확하게 보여 줄 수 있습니다."},{"title":"왜 stock 감소가 마지막 쪽에 있나요?","body":"판매 성공이 확정된 뒤에만 상태를 바꾸기 위해서입니다."}]},{"id":"t3-c2-p19","kind":"example","title":"같은 알고리즘에 다른 값을 넣어 추적합니다","eyebrow":"핵심 예제 3 · 추적표","paragraphs":["알고리즘이 맞는지 보려면 한 가지 값만 넣지 않습니다. 서로 다른 길을 타는 입력을 골라야 합니다.","아래 세 경우를 보면 품절 분기, 금액 부족 분기, 구매 성공 분기를 각각 한 번씩 확인할 수 있습니다.","특히 실패한 두 경우에서 stock 값이 그대로인지 확인하세요. 이것이 상태 변화 검증입니다."],"bullets":["A: cash=5000, price=3000, stock=0 → 품절 / stock=0","B: cash=2000, price=3000, stock=2 → 금액 부족 / stock=2","C: cash=5000, price=3000, stock=2 → 구매 성공 / change=2000 / stock=1"]},{"id":"t3-c2-p20","kind":"example","title":"의사코드를 Python으로 옮기면 구조가 그대로 보입니다","eyebrow":"핵심 예제 4 · 코드 연결","paragraphs":["이 코드는 새 문법을 배우기 위한 예제가 아닙니다. 의사코드의 각 문장이 if/elif/else와 변수로 어떻게 옮겨지는지 연결해서 읽는 예제입니다.","첫 if는 품절 분기, elif는 금액 부족 분기, else는 구매 성공 경로입니다. stock -= 1은 성공했을 때만 상태를 바꾸는 줄입니다.","코드를 읽을 때 먼저 출력값을 보지 말고 어떤 조건 경로를 탔는지 확인하세요."],"code":"cash = 5000\nprice = 3000\nstock = 2\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    change = cash - price\n    stock -= 1\n    print(\"구매 성공\")\n    print(\"거스름돈:\", change)\n    print(\"남은 재고:\", stock)","codeNote":"예상 결과\n구매 성공\n거스름돈: 2000\n남은 재고: 1","extras":[{"title":"한 줄 추적","body":"stock==0? → False, cash\u003cprice? → False, else 진입, change=2000, stock=1."}]},{"id":"t3-c2-p21","kind":"practice","title":"도서 대출 가능 여부 알고리즘을 설계하세요","eyebrow":"실습 1 · 조건의 우선순위","paragraphs":["문제: 사용자가 도서관에서 책을 빌리려고 합니다. 연체 중이면 대출할 수 없습니다. 연체가 아니어도 현재 빌린 책이 5권 이상이면 더 빌릴 수 없습니다. 책 재고가 0이어도 빌릴 수 없습니다.","대출이 성공한 경우에만 borrowed_count를 1 늘리고 stock을 1 줄입니다.","코드부터 쓰지 말고 실패 이유를 어떤 순서로 검사할지 의사코드로 적으세요. 그다음 성공한 경우에만 상태가 바뀌는지 확인합니다."],"practicePrompt":"① 입력·현재 상태를 적기 ② 실패 조건 세 가지를 순서대로 배치하기 ③ 성공 경로 적기 ④ 성공 시 borrowed_count와 stock이 어떻게 바뀌는지 적기 ⑤ 최소 4개의 테스트 값을 만들기","answerOnNext":true,"extras":[{"title":"힌트","body":"연체 / 대출 권수 / 재고 중 어떤 것을 먼저 검사해도 요구사항을 만족할 수 있지만, 실패 이유를 명확히 보여 주는 순서를 정하고 끝까지 일관되게 쓰면 됩니다."}]},{"id":"t3-c2-p21-solution","kind":"solution","title":"도서 대출 가능 여부 알고리즘을 설계하세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["입력 또는 상태는 overdue, borrowed_count, stock입니다. 출력은 대출 가능 여부와 실패 이유입니다. 성공 시 borrowed_count는 1 증가하고 stock은 1 감소합니다.","한 가지 가능한 순서는 ① 연체 확인 ② 현재 대출 권수 확인 ③ 재고 확인 ④ 성공 처리입니다. 각 실패 조건에서는 상태를 바꾸지 않고 바로 끝냅니다.","테스트는 연체 중인 경우, 5권을 이미 빌린 경우, 재고 0인 경우, 모든 조건을 통과하는 경우를 최소 하나씩 준비하면 세 실패 길과 성공 길을 확인할 수 있습니다."],"code":"overdue = False\nborrowed_count = 3\nstock = 2\n\nif overdue:\n    print(\"연체 중이라 대출할 수 없습니다\")\nelif borrowed_count >= 5:\n    print(\"대출 한도 5권에 도달했습니다\")\nelif stock == 0:\n    print(\"재고가 없습니다\")\nelse:\n    borrowed_count += 1\n    stock -= 1\n    print(\"대출 성공\")\n    print(\"현재 대출 권수:\", borrowed_count)\n    print(\"남은 재고:\", stock)","codeNote":"성공 예시에서는 borrowed_count=4, stock=1이 됩니다."},{"id":"t3-c2-p22","kind":"practice","title":"주차 요금 알고리즘에서 경계값을 찾으세요","eyebrow":"실습 2 · 경계값","paragraphs":["문제: 주차 30분까지는 무료입니다. 30분을 초과하면 초과한 시간에 대해 10분마다 500원을 받습니다. 10분 단위는 올림합니다. 하루 최대 요금은 20,000원입니다.","이 문제는 정상값 하나만 넣으면 실수하기 쉽습니다. 무료 기준 30분, 과금 단위 10분, 최대 요금이라는 세 종류의 경계가 있습니다.","먼저 필요한 중간값을 정하고, 어떤 순서로 계산해야 최대 요금을 정확히 적용할지 적으세요."],"practicePrompt":"① 29·30·31분 결과 예상 ② 39·40·41분 결과 예상 ③ 매우 긴 시간에서 20,000원을 넘지 않는지 확인 ④ 의사코드 작성 ⑤ Python 코드로 옮기기","answerOnNext":true,"extras":[{"title":"힌트","body":"31분은 초과 시간이 1분이지만 ‘10분 단위 올림’이므로 과금 단위 1개가 필요합니다."}]},{"id":"t3-c2-p22-solution","kind":"solution","title":"주차 요금 알고리즘에서 경계값을 찾으세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["30분 이하면 0원입니다. 30분을 초과하면 extra_minutes = minutes - 30을 만들고, 10분 단위 개수를 올림해 계산합니다.","Python에서 양의 정수 분 단위를 올림하려면 (extra_minutes + 9) // 10 같은 방법을 사용할 수 있습니다. 마지막에 계산 요금이 20,000원을 넘으면 20,000원으로 제한합니다.","중요한 것은 수식 암기가 아니라 순서입니다. 무료 여부 판단 → 초과 시간 계산 → 과금 단위 계산 → 요금 계산 → 최대 요금 제한 순서입니다."],"code":"minutes = 41\n\nif minutes \u003c= 30:\n    fee = 0\nelse:\n    extra_minutes = minutes - 30\n    units = (extra_minutes + 9) // 10\n    fee = units * 500\n    if fee > 20000:\n        fee = 20000\n\nprint(\"주차 요금:\", fee)","codeNote":"29분=0원, 30분=0원, 31분=500원, 40분=500원, 41분=1000원","extras":[{"title":"왜 40분은 500원인가?","body":"무료 30분을 뺀 초과 시간이 정확히 10분이므로 과금 단위는 1개입니다."}]},{"id":"t3-c2-p23","kind":"practice","title":"스탬프 쿠폰 알고리즘의 상태 변화를 추적하세요","eyebrow":"실습 3 · 상태와 반복","paragraphs":["문제: 카페에서 음료 한 잔을 구매할 때마다 스탬프가 1개 늘어납니다. 스탬프가 10개가 되면 무료 쿠폰 1장을 만들고 스탬프 10개를 사용합니다. 한 번에 여러 잔을 구매할 수도 있습니다.","현재 stamps=8이고 한 번에 5잔을 샀다고 해 봅시다. 단순히 stamps += 5만 하면 13이 됩니다. 그다음 쿠폰을 만들고 10을 빼서 stamps=3이 되어야 합니다.","한 번에 25잔처럼 많이 구매하면 쿠폰이 두 장 이상 생길 수도 있습니다. 따라서 한 번만 검사할지 반복해서 검사할지 생각해야 합니다."],"practicePrompt":"① stamps=8, cups=5를 추적하기 ② stamps=8, cups=25를 추적하기 ③ 쿠폰이 여러 장 생길 수 있다는 점을 반영한 의사코드 만들기 ④ 마지막 stamps와 coupons를 확인하기","answerOnNext":true},{"id":"t3-c2-p23-solution","kind":"solution","title":"스탬프 쿠폰 알고리즘의 상태 변화를 추적하세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["구매한 잔 수만큼 stamps를 먼저 늘린 뒤, stamps가 10 이상인 동안 쿠폰을 만들고 stamps에서 10을 뺍니다.","stamps=8, cups=5라면 13이 된 뒤 쿠폰 1장, 남은 stamps=3입니다. stamps=8, cups=25라면 33이 된 뒤 쿠폰 3장, 남은 stamps=3입니다.","조건을 if 한 번만 사용하면 33에서 한 번만 10을 빼 23이 남으므로 규칙을 완전히 처리하지 못합니다. ‘10개 이상인 동안 계속’이라는 요구가 반복 구조를 필요로 합니다."],"code":"stamps = 8\ncups = 25\ncoupons = 0\n\nstamps += cups\n\nwhile stamps >= 10:\n    coupons += 1\n    stamps -= 10\n\nprint(\"쿠폰:\", coupons)\nprint(\"남은 스탬프:\", stamps)","codeNote":"예상 결과\n쿠폰: 3\n남은 스탬프: 3"},{"id":"t3-c2-p24","kind":"check","title":"모호한 요구사항을 그대로 코드로 만들면 왜 위험할까요?","eyebrow":"확인 문제 1 · 요구사항 감사","paragraphs":["요구사항: ‘회원이면 많이 할인한다. 오래된 회원은 더 많이 할인한다.’","AI가 곧바로 member이면 10%, old_member이면 20% 할인하는 코드를 작성했습니다.","코드는 실행될 수 있지만 요구사항에 없는 숫자를 AI가 임의로 채웠습니다. 어떤 질문을 먼저 해야 하는지 최소 네 개 적어 보세요."],"question":"할인 알고리즘을 만들기 전에 어떤 기준과 경계값을 확정해야 하나요?","answerOnNext":true,"extras":[{"title":"힌트 1","body":"회원 할인율과 오래된 회원 할인율이 명시됐나요?"},{"title":"힌트 2","body":"‘오래된 회원’은 가입 후 몇 개월 또는 몇 년인가요?"},{"title":"힌트 3","body":"두 할인을 함께 적용할지, 더 큰 할인 하나만 적용할지 정해졌나요?"}]},{"id":"t3-c2-p24-solution","kind":"solution","title":"모호한 요구사항을 그대로 코드로 만들면 왜 위험할까요? · 풀이","eyebrow":"정답과 풀이","paragraphs":["최소한 일반 회원 할인율, 오래된 회원 기준 기간, 오래된 회원 할인율, 두 조건이 겹칠 때 적용 방식, 할인 가능한 상품 범위, 최대 할인 한도 등을 확인해야 합니다.","AI가 10%와 20%를 정한 것은 요구사항을 구현한 것이 아니라 빈칸을 추측으로 채운 것입니다. 이런 코드는 문법적으로 완벽해도 비즈니스 규칙을 틀릴 수 있습니다.","좋은 대응은 모르는 값을 임의로 정하는 것이 아니라 ‘확정 필요’로 표시하고 질문 목록을 만드는 것입니다."],"calloutTitle":"AI 코드 검토 원칙","calloutBody":"코드에 들어간 숫자·기준·예외가 원래 요구사항에서 실제로 나온 것인지 하나씩 대조하세요."},{"id":"t3-c2-p25","kind":"check","title":"코드를 실행하기 전에 값을 한 줄씩 추적해 보세요","eyebrow":"확인 문제 2 · 추적","paragraphs":["아래 코드를 바로 실행하지 말고 현재 값을 종이에 적으며 따라가 보세요.","시작값은 balance=5000, price=3000입니다. 결제할 수 있으면 balance에서 price를 뺍니다. 그다음 balance가 2000 미만이면 ‘잔액 부족 경고’를 출력합니다.","각 조건이 참인지 거짓인지, 마지막 balance가 얼마인지, 어떤 문장이 출력되는지 먼저 예측하세요."],"code":"balance = 5000\nprice = 3000\n\nif balance >= price:\n    balance -= price\n    print(\"결제 성공\")\nelse:\n    print(\"결제 실패\")\n\nif balance \u003c 2000:\n    print(\"잔액 부족 경고\")\n\nprint(\"남은 잔액:\", balance)","question":"출력되는 문장과 마지막 balance 값은 무엇인가요?","answerOnNext":true},{"id":"t3-c2-p25-solution","kind":"solution","title":"코드를 실행하기 전에 값을 한 줄씩 추적해 보세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["처음 balance는 5000이고 price는 3000입니다. balance >= price는 True이므로 결제 성공 경로로 갑니다.","balance -= price 후 balance는 2000이 됩니다. 다음 조건 balance \u003c 2000은 False입니다. 정확히 2000은 2000보다 작은 값이 아니기 때문입니다.","따라서 ‘결제 성공’과 ‘남은 잔액: 2000’이 출력되고 ‘잔액 부족 경고’는 출력되지 않습니다. 이 예제는 경계값에서 \u003c와 \u003c=의 차이를 보여 줍니다."],"codeNote":"예상 출력\n결제 성공\n남은 잔액: 2000"},{"id":"t3-c2-p26","kind":"practice","title":"AI가 만든 알고리즘에서 상태 변경 버그를 찾으세요","eyebrow":"실습 4 · AI 코드 감사","paragraphs":["문제: 재고가 있고 돈이 충분할 때만 상품을 판매해야 합니다. 판매에 실패하면 재고는 그대로여야 합니다.","AI가 아래 코드를 만들었습니다. 얼핏 보면 품절과 금액 부족을 처리하지만, 실제로는 실패한 경우에도 재고가 줄어드는 문제가 숨어 있습니다.","어떤 입력에서 잘못되는지 하나 이상 만들고, 상태 변경 줄을 어디로 옮겨야 하는지 설명하세요."],"code":"cash = 1000\nprice = 3000\nstock = 2\n\nstock -= 1\n\nif stock \u003c 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    print(\"구매 성공\")","practicePrompt":"① cash=1000, price=3000, stock=2를 추적 ② 마지막 stock 값 확인 ③ 왜 요구사항과 다른지 설명 ④ stock 감소 위치를 고쳐 의사코드와 Python 코드를 다시 작성","answerOnNext":true},{"id":"t3-c2-p26-solution","kind":"solution","title":"AI가 만든 알고리즘에서 상태 변경 버그를 찾으세요 · 풀이","eyebrow":"정답과 풀이","paragraphs":["cash가 부족하므로 판매는 실패해야 하고 stock은 2로 남아야 합니다. 하지만 AI 코드는 조건을 검사하기 전에 stock -= 1을 실행해 stock을 1로 바꿉니다.","상태 변경은 판매 성공이 확정된 뒤에만 해야 합니다. 즉 재고와 돈 조건을 모두 통과한 else 블록 안으로 stock -= 1을 옮겨야 합니다.","이런 버그는 문법 오류가 아니라 알고리즘 오류입니다. 실행은 정상적으로 되기 때문에 추적과 상태 검사가 없으면 놓치기 쉽습니다."],"code":"cash = 1000\nprice = 3000\nstock = 2\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    stock -= 1\n    print(\"구매 성공\")\n    print(\"남은 재고:\", stock)","codeNote":"cash=1000이면 금액 부족, stock은 2로 유지됩니다.","extras":[]},{"id":"t3-c2-p27","kind":"summary","title":"알고리즘을 만들고 확인하는 순서를 한 번에 정리합니다","eyebrow":"Chapter 2 정리","paragraphs":["챕터 1에서는 큰 문제를 작은 단계로 나눴습니다. 챕터 2에서는 그 단계를 정확한 순서로 연결하고, 조건에서 길을 나누고, 상태가 언제 바뀌는지 표시하는 법을 배웠습니다.","알고리즘은 코드가 아닙니다. 사람이 읽을 수 있는 해결 순서가 먼저이고, Python의 if·for·while·변수는 그 순서를 표현하는 도구입니다.","좋은 알고리즘은 모호한 표현을 줄이고, 각 단계가 필요한 값을 이미 가지고 있으며, 실패한 경우와 성공한 경우의 상태 변화가 분명합니다.","추적표는 머릿속 실행을 종이에 꺼내는 방법입니다. 정상값 하나만 보지 말고 조건이 바뀌는 경계값과 잘못된 입력을 넣어 서로 다른 경로를 확인해야 합니다.","AI가 만든 코드도 같은 방식으로 봅니다. 숫자와 규칙이 요구사항에서 실제로 나온 것인지, 조건 순서가 맞는지, 상태를 바꾸는 줄이 성공한 경우에만 실행되는지 확인합니다."],"bullets":["문제를 작은 단계로 나눈 뒤 실행 순서를 정한다.","모호한 말은 숫자·기준·질문으로 바꾼다.","조건은 질문, 분기는 갈림길, 상태는 현재 값으로 읽는다.","반복은 같은 규칙을 여러 대상에 적용하는 구조로 본다.","중간값에 이름을 붙여 데이터 흐름을 짧게 만든다.","의사코드로 흐름을 적고 실제 값을 넣어 추적한다.","경계값과 실패 경로까지 테스트해야 정확성을 확인할 수 있다.","AI 코드에서도 상태 변경과 임의의 가정을 먼저 감사한다."],"extras":[]}]},{"id":"t3-c3","track":3,"chapter":3,"title":"상태와 데이터 흐름 추적하기","remember":"코드를 한꺼번에 읽지 말고 각 줄의 실행 전·후 상태와 값의 이동을 추적한다","practiceGoal":"변수·조건·반복이 섞인 코드를 추적표로 읽고, 값이 잘못 바뀌는 지점을 찾는다","pages":[{"id":"t3-c3-g1","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 1/4","title":"값이 바뀌는 코드를 읽기 위한 단어","paragraphs":["이 챕터의 목표는 코드를 더 많이 쓰는 것이 아니라, 이미 있는 코드를 보고 ‘지금 어떤 값이 어디에 들어 있고 다음 줄에서 어떻게 바뀌는가’를 따라가는 힘을 만드는 것입니다.","완전 초보일수록 여러 줄을 한 번에 이해하려고 하면 금방 놓칩니다. 먼저 상태·변수·값·스냅샷 네 단어를 잡으면 코드 한 줄씩 멈춰 읽을 수 있습니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"state 상태","description":"상태는 어렵게 생각할 필요 없습니다. 그냥 ‘프로그램이 지금 기억하고 있는 현재 상황’입니다. 사람으로 치면 지갑에 지금 얼마가 있는지, 게임 캐릭터 체력이 지금 몇인지, 로그인 실패를 지금 몇 번 했는지 같은 것입니다. 값이 바뀌면 상태도 바뀝니다.","usage":"실행 중 무엇이 바뀌었는지 설명할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: balance가 5000이고 tries가 2인 순간의 전체 상황이 하나의 상태입니다."},{"term":"variable 변수","description":"변수는 값을 넣어 두고 이름으로 다시 찾는 상자라고 생각하면 됩니다. 예를 들어 balance라는 상자에 5000을 넣어 두면, 뒤에서 balance라는 이름만 써도 5000을 다시 사용할 수 있습니다. 나중에 balance에 3000을 넣으면 같은 이름이 이제 3000을 기억합니다.","usage":"상태를 구성하는 각각의 값을 저장할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total = 12000에서 total은 변수입니다."},{"term":"value 값","description":"값은 실제 내용물입니다. 변수는 상자 이름이고 값은 그 상자 안에 들어 있는 내용이라고 생각하면 쉽습니다. 10, \"안녕\", True, [1, 2, 3]처럼 컴퓨터가 실제로 다루는 데이터가 값입니다.","usage":"‘이 줄이 실행된 뒤 실제로 남는 것은 무엇인가’를 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total의 값이 12000에서 15000으로 바뀔 수 있습니다."},{"term":"snapshot 상태 스냅샷","description":"스냅샷은 프로그램을 잠깐 멈춰 놓고 ‘이 순간 각 변수에 뭐가 들어 있지?’를 사진 찍듯 적어 보는 것입니다. 코드가 빨리 실행돼서 따라가기 어려울 때 특정 순간의 값을 고정해서 보는 방법입니다.","usage":"긴 실행 흐름을 여러 시점으로 나눠 비교할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 2번째 반복 직후의 i=1, total=7000을 스냅샷으로 적습니다."}]},{"id":"t3-c3-g2","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 2/4","title":"한 줄씩 따라갈 때 쓰는 단어","paragraphs":["코드가 어렵게 느껴지는 이유 중 하나는 눈으로는 모든 줄이 동시에 보이지만, 컴퓨터는 정해진 순서대로 한 줄씩 처리하기 때문입니다.","추적과 추적표는 컴퓨터의 속도를 사람의 속도로 늦춰 보는 방법입니다. 실제 실행을 머릿속에서 한 단계씩 재현합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"trace 실행 추적","description":"실행 추적은 컴퓨터가 코드를 실행하는 속도를 사람 눈에 맞게 아주 느리게 따라가는 연습입니다. 한 줄이 실행될 때마다 어떤 값이 들어오고, 무엇이 바뀌고, 다음에 어느 줄로 가는지를 차례대로 확인합니다.","usage":"예상 결과가 왜 나왔는지 설명하거나 버그 위치를 좁힐 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total이 0→3000→7000→12000으로 변하는 과정을 한 줄씩 적습니다."},{"term":"trace table 추적표","description":"추적표는 실행 추적을 종이나 표에 적는 방법입니다. 예를 들어 ‘몇 번째 반복인지 / 현재 price가 얼마인지 / total이 얼마가 됐는지’를 한 줄씩 적으면 머릿속으로만 계산할 때보다 훨씬 덜 헷갈립니다.","usage":"조건문·반복문이 섞인 코드를 종이에 풀어 읽을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 반복횟수 | price | total 세 열을 만들어 값을 적습니다."},{"term":"data flow 데이터 흐름","description":"데이터 흐름은 값이 어디에서 들어와서 어디를 거쳐 어디로 나가는지를 말합니다. 물이 수도관을 따라 흐르듯, 입력값도 변수와 계산을 거쳐 마지막 출력으로 이동합니다.","usage":"값이 어디서 생겼고 어디로 전달되는지 찾을 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: prices → 반복문 → total → print 순서로 값이 이동합니다."},{"term":"mutation 값 변경","description":"값 변경은 이미 있던 값이 실행 중에 다른 값으로 바뀌는 것입니다. total이 0이었다가 3000이 되고, 다시 7000이 되는 것처럼 ‘기억하고 있던 내용이 달라지는 순간’을 뜻합니다.","usage":"‘어느 줄에서 상태가 달라졌는가’를 표시할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total += price는 total의 값을 바꾸는 mutation입니다."}]},{"id":"t3-c3-g3","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 3/4","title":"반복되는 계산을 읽을 때 쓰는 단어","paragraphs":["반복문 안에서는 같은 줄이 여러 번 실행되기 때문에 값이 한 번이 아니라 계속 바뀝니다. 이때 카운터와 누적값을 구분하면 훨씬 덜 헷갈립니다.","반복을 볼 때는 ‘몇 번째인가’와 ‘지금까지 얼마나 모였는가’를 따로 생각하세요.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"iteration 반복 1회","description":"반복 1회는 반복문 안의 코드를 처음부터 끝까지 한 번 실행하는 것입니다. 가격이 세 개라면 첫 번째 가격을 처리하는 1회, 두 번째 가격을 처리하는 1회, 세 번째 가격을 처리하는 1회가 생깁니다.","usage":"몇 번째 반복에서 문제가 생겼는지 말할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 첫 번째 iteration에서 price는 3000입니다."},{"term":"counter 카운터","description":"카운터는 ‘몇 번인지’를 세는 변수입니다. 사람 수를 한 명 볼 때마다 count를 1 늘리거나, 로그인 실패 때마다 tries를 1 늘리는 식입니다. 보통 0에서 시작해 1, 2, 3처럼 올라갑니다.","usage":"성공 횟수, 실패 횟수, 처리한 항목 수를 셀 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: count += 1로 처리 건수를 셉니다."},{"term":"accumulator 누적값","description":"누적값은 지금까지 나온 결과를 계속 모아 두는 변수입니다. 장바구니에 물건을 하나 넣을 때마다 총액이 커지는 것과 같습니다. total = 0으로 시작해서 가격을 만날 때마다 더해 가는 방식이 대표적입니다.","usage":"합계·총점·전체 문자열처럼 반복할수록 커지는 결과를 만들 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: total += price에서 total이 누적값입니다."},{"term":"dependency 의존관계","description":"의존관계는 뒤의 값이 앞의 값에 기대고 있다는 뜻입니다. final_price를 계산할 때 total이 필요하다면 final_price는 total에 의존합니다. 그래서 final_price가 틀렸을 때 total부터 확인해야 할 수 있습니다.","usage":"오류의 출발점을 뒤에서 앞으로 추적할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: final_price가 total에 의존한다면 total부터 확인해야 합니다."}]},{"id":"t3-c3-g4","kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 4/4","title":"흐름이 맞는지 판단할 때 쓰는 단어","paragraphs":["추적의 목적은 숫자를 적는 것에서 끝나지 않습니다. 실행 중 계속 지켜져야 하는 규칙과 입력·출력을 함께 보면 ‘이 값은 애초에 말이 되는가?’를 판단할 수 있습니다.","아래 단어까지 알면 추적표가 단순 메모가 아니라 검증 도구가 됩니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"invariant 불변조건","description":"불변조건은 실행 중 값이 바뀌더라도 절대로 깨지면 안 되는 규칙입니다. 재고는 3개에서 2개, 1개, 0개로 바뀔 수 있지만 -1개가 되면 안 됩니다. 이때 ‘재고는 항상 0 이상’이 불변조건입니다.","usage":"반복문이나 계산 중 이상한 상태가 생겼는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 재고 수량은 처리 도중에도 0보다 작아지면 안 됩니다."},{"term":"input 입력","description":"입력은 프로그램이 일을 시작하려고 밖에서 받는 값입니다. 사용자가 적은 나이, 파일에서 읽은 가격, 함수에 넣어 준 숫자 모두 입력이 될 수 있습니다.","usage":"추적을 시작할 때 어떤 값을 넣었는지 고정할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: prices = [3000, 4000, 5000]이 입력입니다."},{"term":"output 출력","description":"출력은 프로그램이 일을 끝내고 밖으로 내놓는 결과입니다. 화면에 보이는 글자, 계산된 숫자, 저장된 파일처럼 사용자가 확인할 수 있는 결과를 뜻합니다.","usage":"추적한 과정이 최종 목표와 맞는지 비교할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 최종 total 12000이 출력입니다."},{"term":"execution order 실행 순서","description":"실행 순서는 컴퓨터가 코드를 실제로 처리하는 차례입니다. 화면에는 코드가 전부 한꺼번에 보이지만 컴퓨터는 한 순간에 한 단계씩 처리합니다. 조건문과 반복문이 있으면 다음에 실행할 줄이 단순히 바로 아래 줄이 아닐 수도 있습니다.","usage":"다음에 어느 줄로 이동하는지 따라갈 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: for 안의 두 줄은 항목 수만큼 다시 실행됩니다."}]},{"id":"t3-c3-slow-start","kind":"concept","eyebrow":"CHAPTER 03 · 아주 천천히 시작하기","title":"코드를 읽는다는 것은 변수 안의 값을 따라가는 일입니다","paragraphs":["처음 코드를 배울 때는 코드를 영어 문장처럼 전부 해석해야 한다고 생각하기 쉽습니다. 하지만 실제로는 훨씬 단순한 방법이 있습니다. 지금 실행되는 한 줄과 그 줄 때문에 바뀌는 값 하나만 보면 됩니다.","예를 들어 total = total + price라는 한 줄을 보겠습니다. total이 현재 3000이고 price가 4000이라면 오른쪽의 total + price를 먼저 계산합니다. 3000 + 4000이므로 7000입니다. 그다음 왼쪽 total에 7000을 다시 저장합니다. 그래서 이 한 줄이 끝난 뒤 total은 3000에서 7000으로 바뀝니다.","여기서 total이라는 글자가 양쪽에 있어 이상해 보일 수 있습니다. 오른쪽 total은 ‘바뀌기 전 현재 값’을 읽는 것이고, 왼쪽 total은 ‘새 결과를 다시 저장할 자리’입니다. 같은 이름이지만 한 줄 안에서 역할이 다릅니다.","이 원리만 이해하면 total += price도 같은 뜻으로 읽을 수 있습니다. ‘현재 total에 price를 더해서 다시 total에 저장한다’는 짧은 표현입니다.","앞으로 코드가 길어져도 한 줄씩 이 방식으로 읽으면 됩니다. 어떤 값이 들어 있었는지, 무엇을 계산했는지, 어느 변수에 새 값을 저장했는지를 차례대로 보면 됩니다."],"code":"total = 3000\nprice = 4000\n\ntotal = total + price\nprint(total)","codeNote":"출력은 7000입니다. 중요한 것은 정답 7000을 외우는 것이 아니라 total이 3000 → 7000으로 바뀌는 과정을 설명할 수 있는 것입니다."},{"id":"t3-c3-p1","kind":"concept","eyebrow":"CHAPTER 03 · 핵심 이해","title":"코드는 ‘글’이 아니라 시간에 따라 변하는 상태입니다","paragraphs":["프로그램의 ‘상태’라는 말이 처음에는 아주 추상적으로 들릴 수 있습니다. 하지만 실제 뜻은 단순합니다. 코드가 실행되는 중간중간에 변수 안에 들어 있는 현재 값들을 합쳐서 상태라고 부릅니다.","예를 들어 통장 앱을 생각해 보겠습니다. 처음 잔액이 10,000원인데 3,000원을 쓰면 잔액이 7,000원이 됩니다. 여기서 프로그램 입장에서는 balance가 10000인 순간과 balance가 7000인 순간이 서로 다른 상태입니다. 같은 프로그램이라도 현재 상태가 다르면 다음 계산 결과가 달라질 수 있습니다.","코드를 읽을 때 문장 뜻만 보는 것보다 ‘이 줄을 실행하기 바로 전에는 값이 얼마였고, 이 줄을 실행한 뒤에는 얼마가 되었나’를 보는 이유가 여기에 있습니다. 코드의 의미는 글자뿐 아니라 그 순간의 값과 함께 결정됩니다.","코드를 처음 보면 우리는 책처럼 위에서 아래로 읽으려 합니다. 하지만 코드의 뜻은 문장만으로 결정되지 않습니다. 같은 줄이라도 그 직전에 변수에 어떤 값이 들어 있었는지에 따라 결과가 달라집니다.","예를 들어 total = total + price라는 줄은 오른쪽의 현재 total과 price를 먼저 읽고 두 값을 더한 뒤, 그 결과를 다시 total이라는 변수에 저장합니다. 눈에는 total이 두 번 보이지만 왼쪽과 오른쪽의 역할이 다릅니다.","그래서 코드를 이해할 때는 ‘이 줄이 무슨 뜻이지?’ 하나만 묻지 말고 ‘실행 직전 값은 무
