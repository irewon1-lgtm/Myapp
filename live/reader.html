 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 5행은 amount + 3000 결과를 함수 밖으로 돌려주는 함수 출구입니다.","7행 「base = subtotal(2, 5000)」 — subtotal 함수를 2, 5000와 함께 호출한 결과을 구한 뒤 결과를 base라는 변수에 저장합니다. 이 줄 이후에는 base라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 7행은 subtotal(2, 5000)에서 만든 결과를 base에 저장하거나 갱신하는 줄입니다.","8행 「print(add_fee(base))」 — add_fee 함수를 base와 함께 호출한 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘작은 함수 두 개를 연결하면 긴 문제도 단순해집니다’ 예제에서는 8행은 add_fee(base)의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"summary","eyebrow":"Chapter 3 정리","title":"지금 알아야 할 것","paragraphs":["함수 만들기 챕터의 목표는 문법을 외우는 것이 아니라 “반복되는 코드를 함수로 묶고, 매개변수·반환값·지역 변수를 이용해 재사용 가능한 작은 기능을 만든다.”를 실제 코드에서 할 수 있게 되는 것입니다.","다음 챕터에서는 리스트와 딕셔너리로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요."],"bullets":["반복되는 코드를 함수로 묶고, 매개변수·반환값·지역 변수를 이용해 재사용 가능한 작은 기능을 만든다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c3-p13","code":"def double(number):\n    return number * 2\n\nanswer = double(4)\nprint(answer)","codeNote":"4가 number에 들어가 8이 계산되고, return된 8이 answer에 저장됩니다.","codeExplain":["1행 「def double(number):」 — double이라는 새 함수를 정의합니다. 괄호 안 number는 나중에 함수가 호출될 때 받을 입력 자리입니다. 이 줄에서는 함수의 이름과 입구만 정하고 실제 동작은 아래 들여쓰기 블록에 작성합니다. ‘지금 알아야 할 것’ 정리 코드에서는 1행은 double 함수의 이름과 입력 자리 number을 정하는 함수 입구입니다.","2행 「return number * 2」 — 계산식 number * 2의 결과를 호출한 곳으로 돌려주고 현재 함수 실행을 끝냅니다. print처럼 화면에만 보여 주는 것이 아니라 다른 코드가 이 값을 이어서 사용할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 2행은 number * 2 결과를 함수 밖으로 돌려주는 함수 출구입니다.","4행 「answer = double(4)」 — double 함수를 4와 함께 호출한 결과을 구한 뒤 결과를 answer라는 변수에 저장합니다. 이 줄 이후에는 answer라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 4행은 double(4)에서 만든 결과를 answer에 저장하거나 갱신하는 줄입니다.","5행 「print(answer)」 — answer의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘지금 알아야 할 것’ 정리 코드에서는 5행은 answer의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"복잡한 문제를 작은 기능으로 분해하고 추상화하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"함수와 매개변수를 기본 동작을 재사용·확장하는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복되는 연구 작업을 작은 재사용 기능으로 묶어 실제 작업에 바로 쓰는 방식 참고"}]}],"track":2,"id":"t2-c3","remember":"def는 정의, 호출은 실행, return은 반환","practiceGoal":"배송비 함수 만들기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"복잡한 문제를 작은 기능으로 분해하고 추상화하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"함수와 매개변수를 기본 동작을 재사용·확장하는 도구로 설명하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"반복되는 연구 작업을 작은 재사용 기능으로 묶어 실제 작업에 바로 쓰는 방식 참고"}]},{"chapter":4,"title":"리스트와 딕셔너리","pages":[{"kind":"glossary","extras":[],"visibleExtras":0,"id":"t2-c4-p1","eyebrow":"CHAPTER 04 · 시작 전 단어집 1/2","title":"리스트를 읽기 전에 알아둘 네 단어","paragraphs":["여러 값을 다루기 시작하면 코드의 모양이 갑자기 복잡해 보입니다. 하지만 리스트는 결국 ‘값 여러 개를 순서대로 묶은 것’입니다. 먼저 list·element·index·mutable 네 단어를 정확히 잡으면 뒤의 대괄호 문법이 훨씬 덜 낯설어집니다.","단어를 외우는 것보다 실제로 무엇을 가리키는지 연결하세요. list는 전체 묶음, element는 그 안의 값 하나, index는 그 값의 위치 번호, mutable은 만들어진 리스트의 내용을 나중에 바꿀 수 있다는 뜻입니다."],"glossary":[{"term":"list 리스트","description":"여러 값을 한 변수 안에 순서대로 보관하는 Python 자료구조입니다. 대괄호 [ ]를 사용하고 값 사이를 쉼표로 구분합니다.","usage":"장보기 목록, 날짜별 매출, 할 일처럼 ‘여러 개가 있고 순서가 의미 있는 데이터’를 다룰 때 씁니다.","example":"prices = [12000, 8500, 31000]"},{"term":"element 요소","description":"리스트 안에 들어 있는 값 하나하나입니다. 리스트 전체와 요소 하나를 구분해서 읽어야 반복문과 수정 코드가 이해됩니다.","usage":"for로 한 값씩 꺼내거나 특정 위치의 값을 바꿀 때 현재 다루는 대상이 element입니다.","example":"[\"사과\", \"배\"]에서 \"사과\"와 \"배\"가 각각 element입니다."},{"term":"index 인덱스","description":"리스트 안에서 요소의 위치를 나타내는 번호입니다. Python은 첫 번째 위치를 0부터 셉니다.","usage":"‘세 번째 값만 꺼내기’처럼 위치를 정확히 알고 있을 때 사용합니다.","example":"items[0]은 첫 번째, items[-1]은 마지막 요소입니다."},{"term":"mutable 변경 가능","description":"리스트를 만든 뒤에도 요소를 바꾸거나 추가·삭제할 수 있다는 뜻입니다. 문자열과 달리 리스트 자체가 수정될 수 있습니다.","usage":"장바구니에 항목을 추가하거나 재고 목록 값을 바꾸는 상황에서 중요합니다.","example":"shopping.append(\"빵\")은 기존 shopping 리스트에 값을 추가합니다."}]},{"kind":"glossary","extras":[],"visibleExtras":0,"id":"t2-c4-p2","eyebrow":"CHAPTER 04 · 시작 전 단어집 2/2","title":"딕셔너리를 읽기 전에 알아둘 네 단어","paragraphs":["딕셔너리는 리스트처럼 값을 여러 개 보관하지만 찾는 기준이 다릅니다. 리스트는 ‘0번째, 1번째’처럼 위치로 찾고, 딕셔너리는 ‘name, price’처럼 의미가 적힌 key로 찾습니다.","key와 value를 한 쌍으로 읽는 습관을 들이면 JSON·API 응답·앱 설정 같은 데이터도 나중에 비슷한 모양으로 보이기 시작합니다."],"glossary":[{"term":"dict 딕셔너리","description":"key와 value를 연결해 저장하는 자료구조입니다. 중괄호 { } 안에 key: value 형태로 적습니다.","usage":"한 사람의 이름·나이·도시처럼 서로 의미가 다른 속성을 한 묶음으로 표현할 때 적합합니다.","example":"user = {\"name\": \"민수\", \"age\": 10}"},{"term":"key 키","description":"딕셔너리에서 원하는 값을 찾기 위한 이름표입니다. 같은 딕셔너리 안의 key는 고유해야 합니다.","usage":"몇 번째 칸인지 기억하는 대신 의미 있는 이름으로 값을 찾을 때 사용합니다.","example":"user[\"name\"]에서 \"name\"이 key입니다."},{"term":"value 값","description":"key에 연결된 실제 데이터입니다. 문자열·숫자·리스트·다른 딕셔너리도 value가 될 수 있습니다.","usage":"key로 찾은 뒤 계산하거나 출력하거나 수정하는 대상입니다.","example":"{\"price\": 3000}에서 3000이 value입니다."},{"term":"get 메서드","description":"딕셔너리에서 key를 찾되, key가 없을 때 오류 대신 기본값을 받을 수 있게 하는 메서드입니다.","usage":"외부 데이터처럼 특정 key가 항상 있다는 보장이 없을 때 안전한 조회에 유용합니다.","example":"product.get(\"discount\", 0)"}]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p3","eyebrow":"CHAPTER 04 · 개념 1/6","title":"값이 늘어날수록 ‘변수 여러 개’보다 리스트가 유리합니다","paragraphs":["상품 가격이 세 개뿐이라면 price1, price2, price3처럼 변수 세 개를 만들 수도 있습니다. 문제는 개수가 바뀔 때입니다. 상품이 30개가 되면 변수 이름도 30개가 필요하고, 합계를 구하는 코드도 같은 모양으로 길어집니다. 데이터 개수가 바뀔 때 코드 구조까지 같이 늘어나는 방식은 유지하기 어렵습니다.","리스트는 이 문제를 ‘값 여러 개를 하나의 묶음으로 취급한다’는 방식으로 해결합니다. prices라는 이름 하나가 전체 목록을 가리키고, 그 안에 가격이 여러 개 들어갑니다. 이후 for 반복문은 prices에 몇 개가 들어 있든 하나씩 꺼낼 수 있습니다.","여기서 중요한 점은 리스트가 단순히 코드를 짧게 만드는 문법이 아니라는 것입니다. 관련된 값들이 ‘같은 모음’이라는 관계를 코드에 표현합니다. 사람 눈에도 prices를 보면 여러 가격이 한 그룹이라는 사실이 드러납니다.","리스트 안의 값은 같은 타입일 수도 있고 서로 다른 타입일 수도 있습니다. Python은 둘 다 허용합니다. 다만 초보 단계에서는 한 리스트가 한 종류의 역할을 갖도록 만드는 편이 읽기 쉽습니다. 가격 리스트라면 숫자, 이름 리스트라면 문자열처럼 의미를 통일하는 방식입니다.","데이터를 리스트로 묶었다면 다음 질문은 ‘몇 번째 값이 필요한가?’ 또는 ‘모든 값을 하나씩 처리할 것인가?’입니다. 전자는 index, 후자는 for가 자연스럽습니다. 위치가 필요하지 않은데 무조건 index를 계산하면 코드가 오히려 복잡해질 수 있습니다.","따라서 리스트를 볼 때 대괄호 자체보다 먼저 ‘무엇을 한 묶음으로 표현했는가’를 읽으세요. 이 기준을 잡으면 이후 append·remove·반복문도 각각의 목적이 연결됩니다."],"keywords":["list","element","순서","for"]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p4","eyebrow":"CHAPTER 04 · 개념 2/6","title":"index는 위치를 읽고, 대입은 그 위치의 값을 바꿉니다","paragraphs":["Python의 index는 0부터 시작합니다. 값이 세 개라면 유효한 index는 0, 1, 2입니다. ‘길이가 3이니 index 3도 있겠지’라고 생각하면 IndexError가 납니다. 길이와 마지막 index가 1 차이 난다는 점을 함께 기억하세요.","대괄호 오른쪽에서 값을 읽을 수도 있고, 대괄호 왼쪽에 대입해 값을 바꿀 수도 있습니다. tasks[0]은 첫 번째 값을 읽는 표현이고 tasks[1] = \"미팅 잡기\"는 두 번째 위치의 값을 새 문자열로 교체하는 명령입니다.","append는 기존 위치를 교체하지 않고 리스트 맨 뒤에 새 요소를 하나 추가합니다. 따라서 길이도 1 늘어납니다. 코드를 읽을 때 ‘수정’과 ‘추가’를 구분하면 실행 후 리스트가 어떤 모양인지 예측하기 쉬워집니다.","아래 코드는 네 동작을 순서대로 보여 줍니다. 리스트 생성 → 첫 값 조회 → 두 번째 값 수정 → 새 값 추가입니다. 실행 전에 마지막 print가 어떤 리스트를 보여 줄지 먼저 예상해 보세요."],"code":"tasks = [\"견적 보내기\", \"전화하기\", \"자료 정리\"]\nprint(tasks[0])\ntasks[1] = \"미팅 잡기\"\ntasks.append(\"결과 기록\")\nprint(tasks)","codeNote":"예상 결과: 첫 출력은 견적 보내기. 마지막 리스트는 [\"견적 보내기\", \"미팅 잡기\", \"자료 정리\", \"결과 기록\"]","codeExplain":["1행은 문자열 세 개를 순서대로 묶어 tasks를 만듭니다. 이 순간 index 0·1·2가 생깁니다.","2행은 index 0의 값을 읽기만 합니다. 리스트 내용은 아직 바뀌지 않습니다.","3행은 index 1 위치를 새 문자열로 교체합니다. 기존 \"전화하기\"는 그 위치에서 사라집니다.","4행은 마지막 위치 뒤에 새 요소를 붙입니다. 교체가 아니라 추가이므로 리스트 길이가 3에서 4로 늘어납니다.","5행은 앞의 수정과 추가가 모두 반영된 현재 리스트를 확인합니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p5","eyebrow":"CHAPTER 04 · 개념 3/6","title":"딕셔너리는 값의 ‘위치’ 대신 ‘뜻’을 key로 적습니다","paragraphs":["한 사람의 이름·도시·방문 횟수를 리스트 [\"민수\", \"서울\", 2]로 저장할 수도 있습니다. 하지만 나중에 2가 무엇을 뜻하는지 코드를 읽는 사람이 기억해야 합니다. 세 번째 값이 방문 횟수인지 나이인지 리스트만 보고는 알기 어렵습니다.","딕셔너리는 이 값을 {\"name\": \"민수\", \"city\": \"서울\", \"visits\": 2}처럼 적습니다. 값 앞에 의미를 나타내는 key가 붙기 때문에 데이터 자체가 작은 설명서 역할을 합니다.","딕셔너리를 읽을 때는 중괄호 안을 key:value 쌍으로 끊어 보세요. user[\"city\"]는 ‘user에서 city라는 이름표에 연결된 값을 꺼낸다’는 뜻입니다. 위치 번호를 외울 필요가 없습니다.","기존 key에 새 값을 대입하면 그 key의 value만 바뀝니다. 아직 없는 key에 값을 대입하면 새 항목이 추가됩니다. 같은 대입 문법이 ‘수정’과 ‘추가’ 둘 다 수행할 수 있으므로, 실행 전 그 key가 이미 존재하는지 보는 습관이 좋습니다.","딕셔너리는 서로 다른 의미의 속성을 한 개체에 묶을 때 특히 강합니다. 사용자, 상품, 일정, 설정처럼 현실의 ‘하나의 대상’이 여러 속성을 가질 때 자연스럽게 대응됩니다."],"code":"customer = {\"name\": \"민수\", \"city\": \"서울\", \"visits\": 2}\nprint(customer[\"city\"])\ncustomer[\"visits\"] = 3\ncustomer[\"vip\"] = True\nprint(customer)","codeNote":"예상 결과: city는 서울. 마지막에는 visits가 3으로 바뀌고 vip: True가 새로 추가됩니다.","codeExplain":["1행은 한 고객의 서로 다른 속성을 name·city·visits라는 key로 묶습니다.","2행은 위치가 아니라 \"city\" key를 사용해 값 \"서울\"을 찾습니다.","3행은 이미 있던 visits의 value만 2에서 3으로 바꿉니다.","4행은 기존에 없던 vip key를 새로 만들고 True를 연결합니다.","마지막 출력은 딕셔너리의 현재 전체 상태를 확인하기 위한 것입니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p6","eyebrow":"CHAPTER 04 · 개념 4/6","title":"없는 index와 없는 key는 ‘데이터가 있다고 가정한 코드’에서 생깁니다","paragraphs":["리스트에서 존재하지 않는 위치를 읽으면 IndexError가 발생합니다. 딕셔너리에서 존재하지 않는 key를 대괄호로 읽으면 KeyError가 발생합니다. 두 오류 모두 ‘내가 있다고 생각한 값이 실제 데이터에는 없다’는 공통점이 있습니다.","오류를 무조건 try-except로 감싸기 전에, 코드가 어떤 전제를 가지고 있는지 확인하는 편이 좋습니다. 리스트라면 필요한 길이가 있는지, 딕셔너리라면 key가 반드시 존재하는 데이터인지 먼저 판단할 수 있습니다.","딕셔너리의 get은 key가 없을 가능성이 정상적인 상황일 때 유용합니다. discount가 없는 상품을 ‘할인 0원’으로 해석해도 되는 규칙이라면 product.get(\"discount\", 0)이 자연스럽습니다. 반대로 반드시 있어야 하는 price가 없는데 0으로 조용히 바꿔 버리면 데이터 오류를 숨길 수 있습니다.","안전한 코드는 오류를 전부 없애는 코드가 아니라, ‘없어도 되는 값’과 ‘없으면 문제인 값’을 구분하는 코드입니다. 자료구조를 읽을 때 이 차이를 함께 생각하세요."],"code":"prices = [12000, 9000]\nif len(prices) > 2:\n    print(prices[2])\nelse:\n    print(\"세 번째 가격이 없습니다\")\n\nproduct = {\"name\": \"노트\"}\nprint(product.get(\"discount\", 0))","codeNote":"예상 결과: 세 번째 가격이 없습니다 / 0","codeExplain":["len(prices) > 2는 index 2를 읽어도 되는 길이인지 먼저 확인합니다. 길이가 2라면 index 2는 존재하지 않습니다.","else에서는 예상 가능한 ‘데이터 없음’을 오류 대신 메시지로 처리합니다.","마지막 get은 discount key가 없을 때 0을 사용합니다. 이 기본값이 업무 규칙에 맞는지 확인하는 것이 중요합니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p7","eyebrow":"CHAPTER 04 · 개념 5/6","title":"리스트 안에 딕셔너리를 넣으면 ‘여러 개체의 표’가 됩니다","paragraphs":["리스트와 딕셔너리는 서로 경쟁하는 문법이 아닙니다. 실제 데이터에서는 둘을 함께 쓰는 경우가 많습니다. 상품 하나는 name·price·stock 같은 여러 속성이 있으므로 dict가 잘 맞고, 상품이 여러 개라면 그 dict들을 list에 담을 수 있습니다.","이 구조에서 바깥 리스트는 ‘상품 여러 개’를 표현하고, 안쪽 딕셔너리는 ‘상품 하나의 속성’을 표현합니다. 바깥과 안쪽의 역할을 따로 읽으면 중첩 구조가 덜 복잡해집니다.","for product in products:라고 쓰면 매 반복마다 product에는 딕셔너리 하나가 들어옵니다. 그 안에서 product[\"price\"]처럼 key를 사용합니다. 초보자가 자주 헷갈리는 지점은 product가 리스트인지 딕셔너리인지입니다. 반복문 바로 앞의 products 구조를 보면 현재 변수의 타입을 추적할 수 있습니다.","중첩은 필요할 때만 한 단계씩 늘리는 것이 좋습니다. 처음부터 리스트 안의 딕셔너리 안에 또 리스트를 넣으면 읽기 부담이 커집니다. 먼저 한 상품 dict를 제대로 다룬 뒤 여러 상품 list로 확장하세요."],"code":"products = [\n    {\"name\": \"노트\", \"price\": 3000},\n    {\"name\": \"키보드\", \"price\": 39000},\n    {\"name\": \"마우스\", \"price\": 24000},\n]\n\nfor product in products:\n    if product[\"price\"] >= 20000:\n        print(product[\"name\"])","codeNote":"예상 결과: 키보드 / 마우스","codeExplain":["1~5행의 바깥 [ ]는 상품 여러 개를 담는 리스트이고, 각 { }는 상품 하나를 나타내는 딕셔너리입니다.","for가 한 번 돌 때마다 product에는 딕셔너리 하나가 들어옵니다.","if는 현재 상품의 price value를 20000과 비교합니다.","조건을 통과한 상품에서 name key만 읽어 출력하므로 키보드와 마우스가 남습니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c4-p8","eyebrow":"CHAPTER 04 · 개념 6/6","title":"자료구조는 문법이 아니라 ‘데이터의 관계’로 고릅니다","paragraphs":["리스트와 딕셔너리를 외울 때 가장 중요한 질문은 ‘어떤 괄호를 쓰지?’가 아닙니다. 먼저 데이터가 어떤 관계인지 봅니다. 같은 역할의 값이 여러 개이고 순서가 중요하다면 list가 자연스럽습니다. 한 대상의 여러 속성에 이름을 붙여야 한다면 dict가 자연스럽습니다.","예를 들어 일주일 매출 [120, 150, 90, ...]은 날짜 순서대로 값이 이어지므로 list가 이해하기 쉽습니다. 반면 한 매장의 정보 {\"name\": ..., \"city\": ..., \"sales\": ...}는 각 값의 의미가 서로 다르므로 dict가 읽기 쉽습니다.","여러 매장을 표현한다면 list 안에 dict를 넣을 수 있습니다. 여기서 중요한 것은 ‘무조건 중첩’이 아니라 현실의 구조를 그대로 단계로 옮기는 것입니다. 매장 하나 → dict, 매장 여러 개 → list입니다.","자료구조를 잘 고르면 이후 코드가 자연스럽게 따라옵니다. list는 반복·순서·추가/삭제가 중심이고, dict는 key 조회·속성 수정·items 반복이 중심입니다.","AI가 만든 코드를 읽을 때도 같은 질문을 던지세요. ‘왜 여기서는 list이고 왜 여기서는 dict인가?’를 설명할 수 있다면 코드를 단순 복사하는 수준에서 벗어나 구조를 판단하고 수정할 수 있습니다."],"bullets":["여러 같은 종류의 값 + 순서가 중요함 → list","한 대상의 여러 속성 + 이름으로 찾고 싶음 → dict","여러 대상 각각이 여러 속성을 가짐 → list 안에 dict","자료구조를 먼저 고르면 반복·조회·수정 코드가 단순해집니다."]},{"kind":"visual","extras":[],"visibleExtras":0,"id":"t2-c4-p9","eyebrow":"흐름으로 이해하기","title":"‘데이터 모양 → 자료구조 → 접근 방식’ 순서로 생각합니다","paragraphs":["코드를 먼저 쓰지 말고 데이터를 한 문장으로 설명해 보세요. ‘가격 여러 개를 순서대로 저장한다’면 list가 보이고, ‘상품 하나의 이름·가격·재고를 저장한다’면 dict가 보입니다. 그 다음에야 index·key·for 같은 접근 방법을 고릅니다.","이 순서를 거꾸로 하면 익숙한 문법을 아무 데나 쓰게 됩니다. 자료구조는 문제를 담는 그릇이므로, 먼저 데이터의 단위와 관계를 정하는 것이 더 중요합니다."],"bullets":["1단계: 값 하나가 무엇을 의미하는지 정합니다.","2단계: 같은 값이 여러 개인지, 서로 다른 속성이 한 묶음인지 구분합니다.","3단계: list 또는 dict를 선택합니다.","4단계: 한 값만 필요하면 index/key, 전부 처리하면 for를 선택합니다.","5단계: 수정 뒤에는 원래 구조가 의도대로 유지됐는지 출력이나 테스트로 확인합니다."]},{"kind":"example","extras":[],"visibleExtras":0,"id":"t2-c4-p10","eyebrow":"핵심 예제","title":"장바구니에서 총액과 재고 부족 상품을 동시에 계산합니다","paragraphs":["아래 예제는 list와 dict가 실제로 어떻게 함께 쓰이는지 한 번에 보여 줍니다. cart는 상품 딕셔너리 여러 개를 담은 리스트입니다. 각 상품에는 name·price·qty·stock이라는 서로 다른 속성이 있습니다.","반복문은 상품을 하나씩 꺼내 subtotal을 계산하고 total에 누적합니다. 동시에 주문 수량 qty가 재고 stock보다 큰지 검사해 부족한 상품 이름을 low_stock 리스트에 추가합니다.","핵심은 코드 길이가 아니라 데이터 역할을 구분하는 것입니다. total은 숫자 누적값, low_stock은 이름 여러 개를 담는 리스트, item은 현재 상품 하나를 담는 딕셔너리입니다. 변수마다 ‘한 값인지 여러 값인지’를 말할 수 있어야 합니다.","실행 전에 total과 low_stock이 무엇이 될지 손으로 계산해 보세요. 그 예상과 출력이 다르면 어느 상품에서 처음 차이가 생기는지 반복 순서대로 추적하면 됩니다."],"code":"cart = [\n    {\"name\": \"노트\", \"price\": 3000, \"qty\": 2, \"stock\": 5},\n    {\"name\": \"펜\", \"price\": 1200, \"qty\": 4, \"stock\": 3},\n    {\"name\": \"파일\", \"price\": 2500, \"qty\": 1, \"stock\": 8},\n]\n\ntotal = 0\nlow_stock = []\n\nfor item in cart:\n    subtotal = item[\"price\"] * item[\"qty\"]\n    total += subtotal\n    if item[\"qty\"] > item[\"stock\"]:\n        low_stock.append(item[\"name\"])\n\nprint(f\"총액: {total}원\")\nprint(\"재고 부족:\", low_stock)","codeNote":"예상 결과: 총액 13300원 / 재고 부족 ['펜']","codeExplain":["cart의 각 딕셔너리는 상품 하나이고, 바깥 list는 주문에 포함된 상품 전체입니다.","total은 0에서 시작해 각 상품의 price × qty를 차례로 더합니다. 노트 6000원, 펜 4800원, 파일 2500원이 누적됩니다.","low_stock은 처음엔 빈 리스트입니다. qty > stock인 상품만 append하므로 펜만 들어갑니다.","한 반복 안에서 ‘계산’과 ‘검사’를 같이 하지만 결과 저장소는 total과 low_stock으로 분리되어 있어 의미를 추적하기 쉽습니다."]},{"kind":"practice","extras":[],"visibleExtras":0,"id":"t2-c4-p11","answerOnNext":true,"eyebrow":"실습 · 직접 만들기","title":"회원 목록에서 조건에 맞는 사람만 골라 새 리스트를 만드세요","paragraphs":["이번 실습에서는 list 안의 dict 구조를 직접 읽습니다. members에는 회원 여러 명이 있고, 각 회원은 name·age·active 속성을 가집니다.","목표는 ‘활성 회원이면서 20세 이상인 사람의 이름만’ selected 리스트에 모으는 것입니다. 조건이 두 개이므로 and를 사용합니다.","빈칸을 채우기 전에 현재 반복의 member가 어떤 타입인지 먼저 말해 보세요. member는 회원 한 명을 나타내는 dict이고, selected는 결과 이름 여러 개를 담는 list입니다."],"code":"members = [\n    {\"name\": \"민수\", \"age\": 19, \"active\": True},\n    {\"name\": \"지영\", \"age\": 27, \"active\": True},\n    {\"name\": \"현우\", \"age\": 31, \"active\": False},\n]\nselected = []\n\nfor member in members:\n    if ____ and ____:\n        selected.append(____)\n\nprint(selected)","codeNote":"시작 코드입니다. 조건 두 곳과 append할 값을 직접 채운 뒤 다음 페이지에서 풀이를 확인하세요.","codeExplain":["members의 요소 하나는 dict이므로 member[\"age\"], member[\"active\"]처럼 key로 값을 읽습니다.","if의 두 빈칸은 각각 20세 이상인지와 active가 True인지 검사하면 됩니다.","조건을 통과한 뒤에는 회원 전체 dict가 아니라 이름 문자열만 selected에 넣도록 설계했습니다."],"practicePrompt":"① 나이 조건을 20세 이상으로 만들기 ② active가 True인 사람만 통과시키기 ③ selected에 name만 추가하기 ④ 예상 결과를 먼저 적기"},{"id":"t2-c4-p11-solution","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"정답과 풀이","title":"회원 필터링 실습 · 풀이","paragraphs":["정답의 핵심은 ‘현재 반복 변수 member는 딕셔너리’라는 사실입니다. 따라서 나이와 활성 여부를 각각 member[\"age\"], member[\"active\"]로 읽습니다.","and는 두 조건이 모두 True일 때만 전체 조건을 True로 만듭니다. 민수는 active지만 19세라 제외되고, 현우는 31세지만 active가 False라 제외됩니다.","지영만 두 조건을 모두 통과합니다. append에는 member 전체가 아니라 member[\"name\"]을 넣었기 때문에 결과 리스트에는 이름 문자열만 남습니다.","실무에서도 먼저 원본 구조와 결과 구조를 따로 정하면 코드를 읽기 쉽습니다. 원본은 ‘회원 dict의 list’, 결과는 ‘이름 str의 list’입니다."],"code":"members = [\n    {\"name\": \"민수\", \"age\": 19, \"active\": True},\n    {\"name\": \"지영\", \"age\": 27, \"active\": True},\n    {\"name\": \"현우\", \"age\": 31, \"active\": False},\n]\nselected = []\n\nfor member in members:\n    if member[\"age\"] >= 20 and member[\"active\"]:\n        selected.append(member[\"name\"])\n\nprint(selected)","codeNote":"예상 결과: ['지영']","codeExplain":["member[\"age\"] >= 20이 첫 조건이고 member[\"active\"]가 두 번째 조건입니다.","지영만 두 조건이 모두 True이므로 if 블록으로 들어갑니다.","append는 지영의 name value만 selected에 추가해 최종 결과 ['지영']을 만듭니다."]},{"kind":"check","extras":[],"visibleExtras":0,"id":"t2-c4-p12","answerOnNext":true,"eyebrow":"확인 문제","title":"list와 dict를 고르는 기준을 말로 설명해 보세요","paragraphs":["문법 이름을 외웠는지보다 데이터 모양을 판단할 수 있는지가 중요합니다. 아래 세 상황에서 list·dict·list 안의 dict 중 무엇이 자연스러운지 생각해 보세요.","정답을 한 단어로 끝내지 말고 ‘왜 그 구조가 맞는지’를 한 문장으로 설명하면 이후 AI가 만든 자료구조도 검토할 수 있습니다."],"question":"① 월~일 7일의 방문자 수 ② 상품 하나의 이름·가격·재고 ③ 상품 100개의 이름·가격·재고. 각각 어떤 자료구조가 자연스럽고, 값을 찾을 때 index와 key 중 무엇을 주로 쓰게 될까요?"},{"id":"t2-c4-p12-solution","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"정답과 풀이","title":"자료구조 선택 문제 · 풀이","paragraphs":["① 7일 방문자 수는 같은 의미의 숫자가 날짜 순서대로 이어지므로 list가 자연스럽습니다. 특정 요일 위치를 알고 있다면 index를 쓸 수 있고, 전체를 처리할 때는 for로 반복할 수 있습니다.","② 상품 하나의 name·price·stock은 서로 의미가 다른 속성이므로 dict가 읽기 쉽습니다. product[\"price\"]처럼 key가 값의 뜻을 직접 보여 줍니다.","③ 상품 100개는 ‘상품 하나=dict’가 100개 있는 구조이므로 list 안에 dict를 넣는 방식이 자연스럽습니다. 바깥 list는 상품을 반복하고, 안쪽 dict는 각 상품의 속성을 key로 찾습니다.","정답보다 중요한 것은 ‘같은 역할의 값이 여러 개인가, 한 대상의 속성이 여러 개인가’를 먼저 구분한 사고 과정입니다."]},{"id":"t2-c4-x01","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 순서","title":"양수 index와 음수 index는 같은 리스트를 양쪽에서 셉니다","paragraphs":["양수 index는 앞에서부터 0, 1, 2처럼 셉니다. 음수 index는 뒤에서부터 -1, -2처럼 셉니다. 마지막 값을 가져올 때 items[len(items)-1]이라고 계산할 수도 있지만 items[-1]이 의도를 더 직접 보여 줍니다.","슬라이스는 한 위치가 아니라 구간을 가져옵니다. items[1:4]에서 시작 1은 포함되고 끝 4는 포함되지 않습니다. 이 ‘끝 제외’ 규칙은 range와 함께 자주 등장합니다.","슬라이스 결과는 원본 리스트의 일부 요소를 담은 새 리스트입니다. 단순한 숫자·문자열 요소를 다룰 때는 원본을 잘라 복사한 결과라고 생각해도 충분합니다.","index와 slice는 데이터의 ‘위치’를 알고 있을 때 강하지만, 데이터 개수가 자주 바뀌고 모든 값을 처리하려면 for가 더 읽기 쉬운 경우가 많습니다."]},{"id":"t2-c4-x02","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"기온 목록에서 앞·뒤·중간 구간을 각각 꺼냅니다","paragraphs":["같은 리스트라도 index는 값 하나를, slice는 값 여러 개가 담긴 새 리스트를 만듭니다. 반환되는 값의 모양이 다르다는 점을 확인하세요.","[-1]은 마지막 숫자 하나이고 [1:4]는 세 개 숫자가 들어 있는 리스트입니다. 이후 코드가 숫자를 기대하는지 리스트를 기대하는지에 따라 선택이 달라집니다."],"code":"temperatures = [18, 21, 23, 20, 17]\nfirst = temperatures[0]\nlast = temperatures[-1]\nmiddle = temperatures[1:4]\n\nprint(first)\nprint(last)\nprint(middle)","codeNote":"예상 결과: 18 / 17 / [21, 23, 20]","codeExplain":["temperatures[0]과 temperatures[-1]은 각각 숫자 하나를 반환합니다.","temperatures[1:4]는 index 1부터 4 직전까지의 세 요소를 담은 새 리스트를 만듭니다.","같은 대괄호 문법이라도 index 하나인지 콜론이 들어간 slice인지에 따라 결과 타입과 개수가 달라집니다."]},{"id":"t2-c4-x03","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 변경","title":"append·insert·pop은 ‘어디에 넣고 무엇을 꺼내는지’가 다릅니다","paragraphs":["append는 맨 뒤에 값을 추가합니다. insert는 원하는 index 위치에 새 값을 끼워 넣습니다. pop은 기본적으로 마지막 값을 리스트에서 제거하면서 그 값을 반환합니다.","세 메서드는 모두 리스트 자체를 바꿉니다. 특히 insert와 pop은 뒤쪽 요소의 index를 바꿀 수 있으므로, 특정 index를 오래 기억해 두고 사용하는 코드는 데이터가 변하면 틀릴 수 있습니다.","remove는 위치가 아니라 값 자체를 찾아 첫 번째 일치 항목을 지웁니다. 같은 값이 여러 번 있을 수 있다면 어떤 항목이 지워지는지 의도와 맞는지 확인해야 합니다.","초보 단계에서는 메서드 이름보다 ‘실행 전 리스트 → 실행 후 리스트’를 종이에 그려 보는 것이 빠릅니다. 상태가 바뀌는 자료구조는 결과를 단계별로 추적해야 합니다."]},{"id":"t2-c4-x04","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"대기열을 추가하고 끼워 넣고 하나 꺼내 봅니다","paragraphs":["대기열 예제로 세 메서드의 차이를 확인합니다. append는 마지막에 추가하고, insert(1, ...)은 index 1 위치에 끼워 넣습니다. pop(0)은 첫 번째 값을 제거하면서 반환합니다.","pop의 반환값을 served에 저장했기 때문에 ‘누가 빠졌는지’도 잃지 않습니다. 리스트를 바꾸는 메서드가 값을 반환하는지 여부를 확인하는 습관이 중요합니다."],"code":"queue = [\"민수\", \"지영\"]\nqueue.append(\"현우\")\nqueue.insert(1, \"서연\")\nserved = queue.pop(0)\n\nprint(\"처리 완료:\", served)\nprint(\"대기:\", queue)","codeNote":"예상 결과: 처리 완료: 민수 / 대기: ['서연', '지영', '현우']","codeExplain":["append 후에는 ['민수','지영','현우']가 됩니다.","insert(1,'서연')은 두 번째 위치에 서연을 넣어 뒤 요소를 한 칸씩 밀어냅니다.","pop(0)은 첫 요소 민수를 제거하고 그 문자열을 반환하므로 served에 저장할 수 있습니다."]},{"id":"t2-c4-x05","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · key","title":"dict에서 ‘key가 있나?’와 ‘value가 무엇인가?’는 다른 질문입니다","paragraphs":["딕셔너리에서 in은 기본적으로 key의 존재 여부를 검사합니다. \"price\" in product는 price라는 key가 있는지를 묻습니다. value 3000이 있는지 알고 싶다면 product.values() 같은 다른 관점이 필요합니다.","대괄호 조회는 key가 반드시 있어야 한다는 전제를 강하게 표현합니다. get은 key가 없을 수도 있다는 상황에 기본값을 줄 수 있습니다. 둘 중 어느 것이 무조건 좋은 게 아니라 데이터 규칙에 따라 고릅니다.","items()는 key와 value를 한 쌍씩 반복할 때 사용합니다. 설정값 전체를 화면에 보여 주거나 보고서를 만들 때 key와 value 둘 다 필요한 경우가 대표적입니다.","dict를 잘 쓰려면 key 이름이 작은 설계가 됩니다. name, price처럼 일관된 영어 이름을 쓰고 같은 의미에 여러 철자를 섞지 않는 것이 중요합니다."]},{"id":"t2-c4-x06","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"설정 딕셔너리에서 존재 여부·기본값·전체 항목을 각각 확인합니다","paragraphs":["하나의 딕셔너리에서도 질문 종류에 따라 문법이 달라집니다. key가 존재하는지, 없는 key의 기본값이 필요한지, 모든 key-value를 순회할지를 구분합니다.","이 차이를 이해하면 dict를 단순한 중괄호 문법이 아니라 ‘이름으로 데이터를 조회하는 도구’로 사용할 수 있습니다."],"code":"settings = {\"theme\": \"dark\", \"font_size\": 18}\n\nprint(\"theme\" in settings)\nprint(settings.get(\"language\", \"ko\"))\n\nfor key, value in settings.items():\n    print(key, \"=\", value)","codeNote":"예상 결과: True / ko / theme = dark / font_size = 18","codeExplain":["\"theme\" in settings는 value가 아니라 key가 있는지를 검사합니다.","get(\"language\", \"ko\")는 language가 없으므로 기본값 \"ko\"를 반환하지만 dict 자체에 새 key를 추가하지는 않습니다.","items()는 각 key와 value를 한 쌍으로 제공해 두 변수가 동시에 채워집니다."]},{"id":"t2-c4-x07","kind":"practice","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 실습","title":"점수 목록에서 80점 이상만 모으고 평균을 계산하세요","paragraphs":["이번 실습은 리스트를 ‘원본 데이터’와 ‘선택된 결과’ 두 개로 나눠 사용합니다. 원본 scores는 바꾸지 않고, 조건을 통과한 점수만 passed에 추가합니다.","평균은 passed의 합계를 passed 개수로 나눕니다. 아무 점수도 통과하지 않았을 때 0으로 나누지 않도록 길이도 함께 생각하세요."],"code":"scores = [72, 88, 91, 65, 80]\npassed = []\n\nfor score in scores:\n    if ____:\n        passed.append(____)\n\nif len(passed) > 0:\n    average = ____ / ____\n    print(passed)\n    print(average)","codeNote":"빈칸을 직접 채우세요. 예상 passed는 [88, 91, 80]입니다.","codeExplain":["for의 score는 scores에서 꺼낸 숫자 하나입니다.","if에서는 80 이상인지 검사하고, 통과한 현재 score를 passed에 넣으면 됩니다.","평균 계산 전 len(passed) > 0을 확인해 빈 리스트일 때 0으로 나누는 문제를 피합니다."],"practicePrompt":"① 80 이상 조건 완성 ② 현재 score를 append ③ sum(passed)와 len(passed)로 평균 완성 ④ 기준을 90으로 바꿨을 때 결과도 예상"},{"id":"t2-c4-x08","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"점수 필터와 평균 · 풀이","paragraphs":["조건은 score >= 80입니다. 조건을 통과한 현재 값 자체를 passed.append(score)로 추가합니다.","sum(passed)는 선택된 점수의 합, len(passed)는 선택된 개수입니다. 원본 scores가 아니라 passed를 기준으로 계산해야 ‘80점 이상 학생들의 평균’이라는 문제와 일치합니다.","빈 passed에서 len이 0이면 평균을 계산하지 않도록 바깥 if가 막습니다. 데이터가 비어 있는 경우를 먼저 생각하는 것이 작은 경계값 테스트입니다."],"code":"scores = [72, 88, 91, 65, 80]\npassed = []\n\nfor score in scores:\n    if score >= 80:\n        passed.append(score)\n\nif passed:\n    average = sum(passed) / len(passed)\n    print(passed)\n    print(average)","codeNote":"예상 결과: [88, 91, 80] / 약 86.33","codeExplain":["score >= 80인 세 값만 passed에 들어갑니다.","if passed는 리스트가 비어 있지 않을 때 True가 되는 Python의 truthiness를 이용합니다.","sum과 len을 같은 passed에 적용하므로 선택된 데이터만 평균에 포함됩니다."]},{"id":"t2-c4-x09","kind":"practice","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 실습","title":"재고 딕셔너리에서 판매 수량만큼 안전하게 빼세요","paragraphs":["inventory는 상품명을 key, 현재 재고 수량을 value로 갖는 딕셔너리입니다. 주문한 상품이 존재하고 재고가 충분할 때만 수량을 줄여야 합니다.","없는 상품을 바로 inventory[name]으로 읽으면 KeyError가 날 수 있습니다. 먼저 key 존재 여부를 확인하고, 그 다음 수량 비교를 하도록 조건의 순서를 설계하세요."],"code":"inventory = {\"노트\": 5, \"펜\": 12, \"파일\": 3}\nname = \"파일\"\nqty = 2\n\nif ____ and ____:\n    inventory[name] = ____\n    print(\"판매 후:\", inventory[name])\nelse:\n    print(\"판매할 수 없습니다\")","codeNote":"파일 재고 3개에서 2개를 판매하므로 예상 판매 후 재고는 1입니다.","codeExplain":["첫 조건은 name이 inventory의 key인지 확인해야 합니다.","두 번째 조건은 현재 재고 inventory[name]이 주문 qty 이상인지 확인합니다.","두 조건이 통과한 뒤에만 기존 재고에서 qty를 빼 새 value로 저장합니다."],"practicePrompt":"① name in inventory ② inventory[name] >= qty ③ inventory[name] - qty를 대입해 완성하세요. name을 '봉투'로 바꾼 경우도 예상해 보세요."},{"id":"t2-c4-x10","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"재고 차감 실습 · 풀이","paragraphs":["and의 왼쪽에서 name in inventory를 먼저 확인합니다. Python의 and는 왼쪽이 False이면 오른쪽을 계산하지 않으므로, 없는 name일 때 inventory[name]을 읽다가 KeyError가 나는 상황도 피할 수 있습니다.","재고가 충분하면 inventory[name] = inventory[name] - qty로 해당 상품 value만 바꿉니다. 다른 상품 재고는 그대로 남습니다.","name을 \"봉투\"로 바꾸면 첫 조건이 False여서 판매 불가 branch로 이동합니다. ‘없는 상품’과 ‘재고 부족’은 실제 프로그램에서는 메시지를 따로 나눌 수도 있습니다."],"code":"inventory = {\"노트\": 5, \"펜\": 12, \"파일\": 3}\nname = \"파일\"\nqty = 2\n\nif name in inventory and inventory[name] >= qty:\n    inventory[name] = inventory[name] - qty\n    print(\"판매 후:\", inventory[name])\nelse:\n    print(\"판매할 수 없습니다\")","codeNote":"예상 결과: 판매 후: 1","codeExplain":["name in inventory가 먼저 key 존재를 확인합니다.","존재할 때만 두 번째 조건 inventory[name] >= qty를 평가합니다.","조건이 모두 True이면 파일의 value 3에서 2를 빼 1로 갱신합니다."]},{"id":"t2-c4-x11","kind":"check","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 확인","title":"두 변수가 같은 리스트를 가리키면 한쪽 수정이 다른 쪽에도 보입니다","paragraphs":["리스트는 mutable 객체입니다. a라는 리스트를 만든 뒤 b = a라고 쓰면 리스트를 새로 하나 복사하는 것이 아니라, b도 같은 리스트 객체를 가리키게 됩니다.","그래서 b.append(...)로 수정하면 a를 출력해도 변경이 보입니다. 초보자는 ‘b만 바꿨는데 왜 a가 바뀌지?’라고 느낄 수 있습니다.","원본과 별도의 얕은 복사본이 필요하다면 a.copy() 또는 a[:] 같은 방법을 쓸 수 있습니다. 지금은 문법 암기보다 ‘대입이 항상 복사를 뜻하지는 않는다’는 사실을 기억하세요."],"question":"a = [1, 2] 다음에 b = a를 실행하고 b.append(3)을 하면 a는 [1, 2]일까요, [1, 2, 3]일까요? 왜 그런가요?"},{"id":"t2-c4-x12","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"같은 리스트를 가리키는 대입 · 풀이","paragraphs":["정답은 a도 [1, 2, 3]입니다. b = a는 리스트 내용을 복사해 새 리스트를 만드는 코드가 아니라 b가 a와 같은 리스트를 가리키도록 합니다.","b.append(3)은 그 공통 리스트 객체 자체를 수정합니다. 따라서 어느 이름으로 보든 현재 내용은 [1, 2, 3]입니다.","서로 독립된 리스트가 필요하면 b = a.copy()처럼 명시적으로 복사본을 만들 수 있습니다. 이 차이는 함수에 리스트를 넘기거나 여러 화면에서 같은 데이터를 공유할 때 매우 중요해집니다."],"code":"a = [1, 2]\nb = a\nb.append(3)\n\nc = a.copy()\nc.append(4)\n\nprint(a)\nprint(c)","codeNote":"예상 결과: a는 [1, 2, 3] / c는 [1, 2, 3, 4]","codeExplain":["b = a 뒤에는 a와 b가 같은 리스트를 가리킵니다. 그래서 b.append(3)이 a에도 보입니다.","c = a.copy()는 별도 리스트를 만듭니다. c에 4를 추가해도 a에는 4가 생기지 않습니다."]},{"id":"t2-c4-x13","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 중첩","title":"중첩 자료구조는 ‘한 단계씩 타입을 추적’하면 읽을 수 있습니다","paragraphs":["중첩 구조를 한꺼번에 보면 괄호가 많아 어려워 보입니다. 대신 왼쪽에서 오른쪽으로 한 단계씩 타입을 추적하세요. records는 list, records[0]은 dict, records[0][\"tags\"]는 list, records[0][\"tags\"][0]은 str처럼 좁혀 갑니다.","매 단계마다 ‘지금 결과가 list인가 dict인가 값 하나인가’를 말하면 다음에 어떤 문법을 써야 하는지도 결정됩니다. list라면 index, dict라면 key, 문자열이라면 더 이상 자료구조 안으로 들어갈 필요가 없는 경우가 많습니다.","중첩이 깊어질수록 중간값을 변수로 꺼내는 것도 좋습니다. first = records[0], tags = first[\"tags\"]처럼 나누면 긴 한 줄보다 디버깅하기 쉽습니다.","AI가 만든 JSON 처리 코드도 결국 이 원리로 읽습니다. 괄호를 외우지 말고 각 단계가 어떤 타입을 반환하는지 추적하세요."]},{"id":"t2-c4-x14","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"할 일 목록에서 미완료이면서 중요한 항목만 뽑습니다","paragraphs":["todos는 할 일 여러 개를 담는 list이고, 할 일 하나는 title·done·priority를 가진 dict입니다. 이번에는 두 속성을 동시에 검사해 사람이 바로 볼 수 있는 문자열 결과를 만듭니다.","자료구조를 이해하면 조건식도 자연스럽습니다. 현재 todo의 done이 False이고 priority가 \"high\"인지 묻습니다. 출력할 때는 title만 사용합니다.","이 예제는 다음 챕터의 문자열 처리와도 연결됩니다. 데이터 구조에서 필요한 값을 꺼낸 뒤 사람이 읽을 문장으로 만들 때 문자열 포맷팅이 필요해집니다."],"code":"todos = [\n    {\"title\": \"견적 보내기\", \"done\": False, \"priority\": \"high\"},\n    {\"title\": \"메일 정리\", \"done\": True, \"priority\": \"low\"},\n    {\"title\": \"계약 검토\", \"done\": False, \"priority\": \"high\"},\n]\n\nurgent = []\nfor todo in todos:\n    if not todo[\"done\"] and todo[\"priority\"] == \"high\":\n        urgent.append(todo[\"title\"])\n\nprint(\"오늘 먼저:\", urgent)","codeNote":"예상 결과: 오늘 먼저: ['견적 보내기', '계약 검토']","codeExplain":["todos의 요소 하나는 dict이고, 반복 변수 todo가 그 한 건을 받습니다.","not todo[\"done\"]은 완료되지 않은 항목을 뜻하고 priority 비교가 중요도를 확인합니다.","두 조건을 모두 통과한 항목의 title만 urgent에 모으므로 결과가 사람이 쓰기 쉬운 문자열 리스트가 됩니다."]},{"kind":"summary","extras":[],"visibleExtras":0,"id":"t2-c4-p13","eyebrow":"Chapter 4 정리","title":"자료구조를 고른 이유까지 설명할 수 있으면 충분합니다","paragraphs":["리스트는 여러 값을 순서대로 묶고, 딕셔너리는 key라는 이름표로 속성을 묶습니다. index·append·slice·get·items 같은 문법은 그 구조를 읽고 바꾸기 위한 도구입니다. 문법을 따로 외우기보다 ‘현재 데이터가 list인지 dict인지, 한 값인지 여러 값인지’를 먼저 확인하세요.","실제 코드는 list와 dict를 함께 사용하는 경우가 많습니다. 상품 하나를 dict로 만들고 상품 여러 개를 list에 넣는 것처럼 현실의 데이터 단위를 한 단계씩 옮기면 중첩 구조도 읽을 수 있습니다.","다음 챕터의 문자열도 순서가 있는 데이터라는 점에서 list와 닮았지만 중요한 차이가 있습니다. 문자열은 immutable이라 글자 하나를 같은 방식으로 바로 바꿀 수 없습니다. 이 차이를 기준으로 문자열 메서드의 동작을 배울 것입니다."],"bullets":["list: 순서 있는 여러 값","dict: key로 의미를 붙인 여러 속성","중첩 구조: 바깥 타입부터 한 단계씩 추적","없을 수 있는 값과 반드시 있어야 하는 값을 구분","대입이 복사인지 같은 객체 공유인지 주의"],"references":[{"book":"Automate the Boring Stuff with Python, 3rd Edition","author":"Al Sweigart","year":2025,"note":"2025년 개정 베스트셀러. 리스트·딕셔너리·문자열을 실제 자동화 문제에 연결하는 입문 흐름을 참고했습니다."},{"book":"Automate the Boring Stuff with Python Workbook","author":"Al Sweigart","year":2025,"note":"2025년 베스트셀러 연계 워크북이자 Higher Education Python 교재. 짧은 연습→수정→완성 코드로 이어지는 실습 설계를 참고했습니다."},{"book":"Coding for Chemists: Saving Time and Solving Problems with Python","author":"Benjamin J. Lear · Christopher J. Johnson","year":2026,"note":"MIT Press 계열의 대학·대학원 수업용 Python 교재. 실제 데이터를 먼저 구조화하고 필요한 계산으로 이어가는 문제 중심 설명을 참고했습니다."}]}],"track":2,"id":"t2-c4","remember":"list는 ‘순서’, dict는 ‘이름표(key)’가 핵심입니다. 먼저 데이터의 모양을 보고 자료구조를 고르세요.","practiceGoal":"여러 상품을 list와 dict로 표현하고, 필요한 값만 찾고 수정하고 집계하기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Automate the Boring Stuff with Python, 3rd Edition","author":"Al Sweigart","year":2025,"note":"2025년 개정 베스트셀러. 리스트·딕셔너리·문자열을 실제 자동화 문제에 연결하는 입문 흐름을 참고했습니다."},{"book":"Automate the Boring Stuff with Python Workbook","author":"Al Sweigart","year":2025,"note":"2025년 베스트셀러 연계 워크북이자 Higher Education Python 교재. 짧은 연습→수정→완성 코드로 이어지는 실습 설계를 참고했습니다."},{"book":"Coding for Chemists: Saving Time and Solving Problems with Python","author":"Benjamin J. Lear · Christopher J. Johnson","year":2026,"note":"MIT Press 계열의 대학·대학원 수업용 Python 교재. 실제 데이터를 먼저 구조화하고 필요한 계산으로 이어가는 문제 중심 설명을 참고했습니다."}]},{"chapter":5,"title":"문자열 다루기","pages":[{"kind":"glossary","extras":[],"visibleExtras":0,"id":"t2-c5-p1","eyebrow":"CHAPTER 05 · 시작 전 단어집 1/2","title":"문자열을 읽기 전에 알아둘 네 단어","paragraphs":["문자열은 그냥 ‘글자’가 아니라 순서가 있는 데이터입니다. 그래서 list처럼 index와 slice를 사용할 수 있지만, 한 가지 큰 차이가 있습니다. 문자열은 만들어진 뒤 글자 하나만 제자리에서 바꾸는 방식이 허용되지 않습니다.","이 챕터에서는 string·character·indexing·immutable 네 단어를 기준으로 문자열의 성질을 먼저 잡습니다. 메서드 이름을 외우기 전에 ‘원본이 바뀌는가, 새 문자열이 만들어지는가’를 계속 확인하세요."],"glossary":[{"term":"string 문자열","description":"글자들이 순서대로 이어진 str 타입의 값입니다. 따옴표 안에 적으며 이름·주소·메시지·파일 한 줄·사용자 입력 등이 대표적인 문자열입니다.","usage":"사람이 읽는 텍스트를 코드에서 저장·비교·가공할 때 사용합니다.","example":"message = \"Python 공부\""},{"term":"character 문자","description":"문자열을 이루는 글자 하나를 말합니다. Python에는 별도의 char 타입이 없고 한 글자도 길이 1인 문자열입니다.","usage":"특정 위치의 글자를 검사하거나 텍스트 규칙을 확인할 때 씁니다.","example":"\"ABC\"[0]의 결과 \"A\"도 str입니다."},{"term":"indexing 인덱싱","description":"문자열의 특정 위치 한 글자를 []로 꺼내는 방법입니다. list와 마찬가지로 첫 위치는 0입니다.","usage":"첫 글자·마지막 글자처럼 위치를 알고 있을 때 사용합니다.","example":"text[-1]은 마지막 글자입니다."},{"term":"immutable 불변","description":"문자열 객체의 일부 글자를 같은 객체 안에서 직접 교체할 수 없다는 뜻입니다. 바꾸려면 새 문자열을 만들어 변수에 다시 저장해야 합니다.","usage":"lower·strip·replace 같은 메서드 결과를 변수에 다시 받아야 하는 이유를 이해할 때 중요합니다.","example":"name = name.strip()처럼 반환값을 다시 저장합니다."}]},{"kind":"glossary","extras":[],"visibleExtras":0,"id":"t2-c5-p2","eyebrow":"CHAPTER 05 · 시작 전 단어집 2/2","title":"텍스트 정리에 자주 쓰는 여섯 도구","paragraphs":["현실의 문자열은 깔끔하지 않은 경우가 많습니다. 앞뒤 공백이 붙고, 대소문자가 제각각이고, 쉼표나 줄바꿈으로 여러 값이 한 줄에 섞입니다. 문자열 메서드는 이런 원시 텍스트를 다음 계산에 쓰기 좋은 형태로 정리합니다.","strip·lower·replace·split·join·f-string은 역할이 서로 다릅니다. ‘지운다, 바꾼다, 나눈다, 붙인다, 문장을 만든다’처럼 동사로 기억하면 코드에서 빠르게 구분할 수 있습니다."],"glossary":[{"term":"strip","description":"문자열 앞뒤의 공백·줄바꿈 같은 여백 문자를 제거한 새 문자열을 반환합니다.","usage":"사용자 입력이나 파일 한 줄을 비교·변환하기 전에 정리할 때 자주 씁니다.","example":"\"  yes\\n\".strip() → \"yes\""},{"term":"lower / upper","description":"영문 대소문자를 각각 소문자·대문자로 바꾼 새 문자열을 반환합니다.","usage":"YES·Yes·yes처럼 표현이 달라도 같은 명령으로 비교하고 싶을 때 유용합니다.","example":"answer.strip().lower() == \"yes\""},{"term":"split","description":"기준 문자열을 경계로 원본 문자열을 나눠 list를 반환합니다.","usage":"\"서울,37\" 같은 한 줄을 여러 필드로 분리할 때 씁니다.","example":"\"a,b,c\".split(\",\") → [\"a\",\"b\",\"c\"]"},{"term":"join","description":"문자열 여러 개가 담긴 iterable 사이에 구분자를 넣어 하나의 새 문자열로 합칩니다.","usage":"여러 단어·이름·경로 조각을 사람이 읽을 한 줄로 만들 때 사용합니다.","example":"\" / \".join([\"홈\",\"설정\"])"},{"term":"replace","description":"찾은 문자열 조각을 다른 문자열로 치환한 새 문자열을 반환합니다.","usage":"불필요한 기호를 제거하거나 표준 표기로 바꿀 때 사용합니다.","example":"\"010-1234\".replace(\"-\", \"\")"},{"term":"f-string","description":"문자열 안의 { }에 변수나 계산 결과를 넣어 읽기 쉬운 문장을 만드는 Python 문자열 표기입니다.","usage":"결과 메시지·로그·보고서 한 줄을 만들 때 사용합니다.","example":"f\"{name}님, 총액은 {total}원입니다\""}]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p3","eyebrow":"CHAPTER 05 · 개념 1/6","title":"문자열도 순서가 있지만 리스트처럼 글자 하나를 바로 바꿀 수는 없습니다","paragraphs":["문자열 \"Python\"은 P, y, t, h, o, n이 순서대로 이어진 데이터입니다. 그래서 text[0]으로 첫 글자를 읽고 text[1:4]로 중간 구간을 잘라낼 수 있습니다. 여기까지는 list와 매우 비슷합니다.","하지만 text[0] = \"J\"처럼 첫 글자만 직접 바꾸는 코드는 허용되지 않습니다. 문자열은 immutable이기 때문입니다. ‘Python’이라는 문자열 객체가 만들어진 뒤 그 내부 글자를 제자리에서 수정하는 방식이 아니라, 원하는 내용으로 새 문자열을 만들어 다른 값으로 대입합니다.","이 차이는 메서드를 읽을 때 중요합니다. text.lower()를 호출했다고 원래 text가 자동으로 소문자로 바뀌는 것이 아닙니다. lower는 소문자로 바꾼 새 문자열을 돌려주므로 그 결과를 쓰거나 변수에 다시 저장해야 합니다.","초보자가 문자열 메서드를 실행하고도 값이 그대로라고 느끼는 가장 흔한 이유가 바로 반환값을 버렸기 때문입니다. ‘메서드를 호출했다’와 ‘그 결과를 저장했다’를 구분하세요.","문자열을 볼 때는 세 가지를 확인하면 좋습니다. 원본 값, 메서드가 반환한 새 값, 변수에 실제로 다시 저장했는지입니다. 이 세 단계를 나누면 텍스트 처리 코드의 변화가 보입니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p4","eyebrow":"CHAPTER 05 · 개념 2/6","title":"strip과 lower는 입력값을 비교하기 전에 모양을 표준화합니다","paragraphs":["사람이 입력한 값은 겉보기에는 같아도 코드상으로 다를 수 있습니다. \"YES\", \" yes \", \"Yes\"는 모두 사람이 보기에는 같은 동의 표현이지만 문자열 자체는 서로 다릅니다.","이럴 때 먼저 strip으로 앞뒤 공백을 없애고 lower로 소문자로 바꾸면 모두 \"yes\"라는 한 가지 표준 형태가 됩니다. 이렇게 비교 전에 값을 정리하는 과정을 정규화(normalization)라고 부를 수 있습니다.","정규화 규칙은 목적에 맞게 정해야 합니다. 이름까지 무조건 lower로 바꾸면 사람이 보는 표기가 손상될 수 있습니다. 로그인 명령·이메일 주소 비교처럼 대소문자를 무시해도 되는 데이터에만 적용하는 것이 좋습니다.","메서드는 왼쪽부터 연쇄해서 쓸 수도 있습니다. raw.strip().lower()에서는 먼저 strip 결과가 만들어지고, 그 새 문자열에 lower가 적용됩니다."],"code":"raw = \"  YeS \\n\"\nclean = raw.strip().lower()\n\nprint(raw == \"yes\")\nprint(clean == \"yes\")\nprint(repr(clean))","codeNote":"예상 결과: False / True / 'yes'","codeExplain":["raw에는 앞뒤 공백과 줄바꿈, 대문자가 그대로 들어 있습니다.","raw.strip()이 여백을 없앤 새 문자열을 만들고, 이어 lower()가 소문자로 바꿉니다. 최종 결과를 clean에 저장합니다.","원본 raw는 여전히 \"yes\"와 같지 않지만 clean은 정확히 \"yes\"가 됩니다.","repr은 눈에 잘 안 보이는 공백·줄바꿈을 포함한 문자열 모양을 확인할 때 유용합니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p5","eyebrow":"CHAPTER 05 · 개념 3/6","title":"split은 한 문자열을 여러 값으로 나누고, join은 여러 문자열을 다시 한 줄로 만듭니다","paragraphs":["split은 텍스트를 구조화된 여러 조각으로 바꾸는 첫 단계입니다. 예를 들어 \"서울,잠실,3층\"은 쉼표가 필드를 구분한다는 약속이 있다면 split(\",\")으로 세 조각의 list를 만들 수 있습니다.","중요한 점은 split 결과가 문자열이 아니라 list라는 것입니다. parts[0]처럼 index를 사용할 수 있고, len(parts)로 몇 조각인지 확인할 수 있습니다. 앞 챕터에서 배운 자료구조가 바로 연결됩니다.","join은 반대 방향입니다. 문자열 list를 하나의 문자열로 합칩니다. separator.join(values) 형태라 처음 보면 순서가 낯설 수 있지만, ‘이 구분자를 values 사이사이에 넣는다’고 읽으면 됩니다.","split과 join은 단순한 모양 바꾸기가 아니라 데이터 경계를 드러내는 도구입니다. 다만 실제 CSV처럼 따옴표 안에 쉼표가 들어갈 수 있는 형식은 단순 split만으로 처리하면 안 되고 csv 모듈 같은 형식 전용 도구가 필요합니다."],"code":"path_text = \"홈>고객>상세\"\nparts = path_text.split(\">\")\nlabel = \" / \".join(parts)\n\nprint(parts)\nprint(label)","codeNote":"예상 결과: ['홈', '고객', '상세'] / 홈 / 고객 / 상세","codeExplain":["split(\">\")은 > 기호를 경계로 세 문자열을 만들어 list에 담습니다.","join은 list의 세 문자열 사이에 ' / '를 넣어 하나의 표시용 문자열을 만듭니다.","parts는 list이고 label은 str이므로 같은 내용이라도 자료형과 용도가 다릅니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p6","eyebrow":"CHAPTER 05 · 개념 4/6","title":"in·startswith·endswith는 문자열 안의 패턴을 빠르게 검사합니다","paragraphs":["문자열에서 어떤 조각이 포함되어 있는지 검사할 때 in을 사용할 수 있습니다. \"error\" in message는 message 어딘가에 정확한 소문자 error가 들어 있는지를 True/False로 돌려줍니다.","문자열 비교는 대소문자를 구분합니다. \"ERROR\"와 \"error\"를 같은 것으로 보고 싶다면 message.lower()처럼 비교용 값을 정규화할 수 있습니다.","startswith와 endswith는 위치까지 포함한 의도를 더 분명히 표현합니다. 파일명이 .csv로 끝나는지, URL이 https://로 시작하는지 확인할 때 전체 문자열을 직접 자르는 것보다 읽기 쉽습니다.","검색 결과를 이용해 분기할 때는 ‘찾고 싶은 패턴이 정확히 무엇인가’를 먼저 정하세요. 단순 부분 문자열 검사는 예상치 못한 긴 단어 안에서도 일치할 수 있습니다."],"code":"filename = \"sales_2026.CSV\"\nnormalized = filename.lower()\n\nprint(normalized.endswith(\".csv\"))\nprint(normalized.startswith(\"sales_\"))\nprint(\"2026\" in normalized)","codeNote":"예상 결과: True / True / True","codeExplain":["lower로 비교 전 파일명 표기를 소문자로 통일합니다.","endswith('.csv')는 확장자 위치까지 포함해 검사하므로 단순 '.csv' in 문자열보다 의도가 분명합니다.","startswith와 in은 각각 앞부분과 전체 포함 여부를 검사해 서로 다른 질문에 답합니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p7","eyebrow":"CHAPTER 05 · 개념 5/6","title":"f-string은 값과 설명을 한 문장으로 연결하지만 값 자체를 바꾸지는 않습니다","paragraphs":["프로그램 내부에는 숫자·문자열·bool 같은 값이 따로 존재합니다. 사용자가 볼 메시지를 만들 때는 이 값들을 설명 문장 안에 넣어야 합니다. f-string은 그 작업을 읽기 쉽게 해 줍니다.","f 앞의 따옴표 안에서 {name}처럼 중괄호를 쓰면 변수의 현재 값이 문자열에 삽입됩니다. {price * qty}처럼 간단한 계산식도 사용할 수 있습니다.","f-string 결과는 새 문자열입니다. 원래 숫자 price나 qty가 문자열로 영구 변환되는 것이 아닙니다. 화면에 보여 줄 표현과 내부 계산용 값을 분리하는 것이 중요합니다.","로그나 보고서에서 변수 이름만 나열하기보다 의미를 함께 적으면 나중에 오류를 찾기 쉽습니다. 예를 들어 \"12000\"만 출력하는 것보다 \"총액: 12000원\"이 훨씬 많은 정보를 줍니다."],"code":"name = \"노트\"\nprice = 3000\nqty = 4\nmessage = f\"{name} {qty}개 · 총 {price * qty:,}원\"\nprint(message)","codeNote":"예상 결과: 노트 4개 · 총 12,000원","codeExplain":["name·price·qty는 계산과 데이터 처리를 위한 원래 값으로 유지됩니다.","f-string은 { } 안의 현재 값을 읽어 사람이 볼 새 문자열 message를 만듭니다.",":, 형식 지정은 숫자를 세 자리마다 쉼표로 표시하지만 price 값 자체를 바꾸지 않습니다."]},{"kind":"concept","extras":[],"visibleExtras":0,"id":"t2-c5-p8","eyebrow":"CHAPTER 05 · 개념 6/6","title":"문자열 처리는 ‘정리 → 검사 → 분리 → 변환’ 순서로 나누면 안전합니다","paragraphs":["현실의 입력은 한 줄에서 여러 작업이 필요합니다. 예를 들어 \" 식비 , 12000 \\n\"을 금액 계산에 쓰려면 앞뒤 공백을 없애고, 쉼표로 나누고, 각 조각을 다시 정리하고, 금액 문자열을 int로 바꿔야 합니다.","이 과정을 한 줄에 전부 압축하면 짧아 보이지만 어느 단계에서 문제가 생겼는지 보기 어렵습니다. 초보 단계에서는 clean, parts, category, amount_text처럼 중간값을 이름 붙여 확인하는 편이 좋습니다.","문자열 변환과 숫자 변환은 실패 방식도 다릅니다. split 결과가 예상한 두 칸이 아닐 수 있고, amount_text가 숫자가 아니어서 int에서 ValueError가 날 수도 있습니다. 그래서 입력 정리와 검증은 다음 챕터의 파일·예외 처리와 바로 이어집니다.","좋은 텍스트 처리 코드는 ‘정상 예제 한 개’만 되는 코드가 아니라 공백·대소문자·빈 문자열·잘못된 형식 같은 경계도 의도적으로 다룹니다."],"bullets":["원본 문자열은 가능하면 바로 덮어쓰지 말고 중간값으로 확인합니다.","비교 전에는 필요한 범위에서만 정규화합니다.","split 뒤에는 조각 개수가 예상과 맞는지 확인합니다.","숫자 변환은 실패할 수 있으므로 예외 처리 경계가 필요합니다.","사람이 볼 메시지와 내부 계산용 값을 분리합니다."]},{"kind":"visual","extras":[],"visibleExtras":0,"id":"t2-c5-p9","eyebrow":"흐름으로 이해하기","title":"한 줄 텍스트가 계산 가능한 데이터가 되는 과정","paragraphs":["문자열 처리의 핵심은 ‘글자를 멋지게 바꾸는 것’이 아니라 의미 있는 데이터로 해석하는 것입니다. 원본 한 줄을 그대로 계산하지 않고, 단계마다 형태를 좁혀 갑니다.","어떤 단계에서 어떤 타입이 되는지 표시하면 오류 위치도 빠르게 찾을 수 있습니다. raw는 str, parts는 list[str], amount_text는 str, amount는 int처럼 타입 변화까지 추적하세요."],"bullets":["1. raw: 파일이나 input에서 들어온 원본 문자열","2. clean: strip 등으로 불필요한 여백 제거","3. parts: split으로 의미 단위 분리","4. validation: 조각 개수·빈 값 확인","5. conversion: 숫자 문자열을 int/float로 변환","6. output: 계산 또는 사람이 읽을 문장으로 재조합"]},{"kind":"example","extras":[],"visibleExtras":0,"id":"t2-c5-p10","eyebrow":"핵심 예제","title":"주문 한 줄을 정리해서 상품명·수량·단가·총액을 만듭니다","paragraphs":["이번 예제의 원본은 사람이 복사해 넣은 주문 문자열이라고 가정합니다. 값 사이에는 | 기호가 있고 앞뒤에 불필요한 공백이 섞여 있습니다.","먼저 전체 줄을 strip한 뒤 |로 split합니다. 각 조각도 다시 strip해 공백을 제거합니다. 그 다음 수량과 단가만 int로 바꾸면 계산 가능한 데이터가 됩니다.","이 코드는 정상 입력을 가정한 예제입니다. 실제 자동화에서는 parts 길이가 3인지, 숫자 변환이 가능한지 검사해야 합니다. 그 검증은 7장 예외 처리와 8장 프로젝트에서 결합합니다.","핵심은 각 줄이 어떤 타입의 값을 만드는지 설명할 수 있는 것입니다. 문자열 → list → 정리된 문자열 → int → 계산 결과의 순서가 보여야 합니다."],"code":"raw = \"  키보드 | 2 | 39000  \"\nparts = raw.strip().split(\"|\")\n\nname = parts[0].strip()\nqty = int(parts[1].strip())\nprice = int(parts[2].strip())\ntotal = qty * price\n\nprint(f\"{name}: {qty}개 / {total:,}원\")","codeNote":"예상 결과: 키보드: 2개 / 78,000원","codeExplain":["strip 후 split('|')을 실행하면 세 문자열이 담긴 list가 생깁니다.","각 parts 요소를 다시 strip해 구분자 주변의 공백을 제거합니다.","qty와 price는 계산해야 하므로 int로 변환하지만 name은 문자열 그대로 둡니다.","마지막 f-string은 내부 데이터들을 사람이 확인하기 쉬운 한 줄로 조합합니다."]},{"kind":"practice","extras":[],"visibleExtras":0,"id":"t2-c5-p11","answerOnNext":true,"eyebrow":"실습 · 직접 만들기","title":"전화번호 입력을 숫자만 남긴 표준 형식으로 정리하세요","paragraphs":["사용자는 전화번호를 010-1234-5678, 010 1234 5678처럼 다르게 입력할 수 있습니다. 이번 실습에서는 두 종류의 구분자 -와 공백을 제거해 숫자 문자열만 남깁니다.","replace는 한 번 호출할 때 한 종류의 문자열을 바꿉니다. 메서드를 연쇄해 두 구분자를 차례로 제거할 수 있습니다.","결과가 실제 전화번호인지 완전히 검증하는 문제는 더 복잡합니다. 여기서는 ‘표기 정리’와 ‘유효성 검증’을 분리해 생각하는 연습에 집중합니다."],"code":"raw = \" 010-1234 5678 \"\nclean = ____\ndigits = clean.replace(____, ____).replace(____, ____)\n\nprint(digits)\nprint(len(digits))","codeNote":"시작 코드입니다. 최종 digits는 01012345678, 길이는 11이 되도록 채우세요.","codeExplain":["clean에는 먼저 앞뒤 공백을 제거한 결과가 들어가야 합니다.","첫 replace는 '-'를 빈 문자열로 바꾸고, 두 번째 replace는 공백을 빈 문자열로 바꾸면 됩니다.","len으로 결과 길이를 확인하지만 이것만으로 전화번호 유효성을 완전히 보장하지는 않습니다."],"practicePrompt":"① strip으로 clean 만들기 ② '-' 제거 ③ 공백 제거 ④ 결과가 11자리인지 확인 ⑤ 원본 raw가 바뀌지 않았다는 점도 확인"},{"id":"t2-c5-p11-solution","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"정답과 풀이","title":"전화번호 정리 실습 · 풀이","paragraphs":["strip은 문자열의 양 끝 여백만 없앱니다. 중간에 있는 하이픈과 공백은 남으므로 replace를 추가로 사용합니다.","replace('-', '')는 하이픈을 빈 문자열로 바꾸어 제거하고, replace(' ', '')는 중간 공백을 제거합니다. 두 메서드의 결과는 매번 새 문자열입니다.","최종 digits는 숫자처럼 보이지만 타입은 여전히 str입니다. 전화번호는 0으로 시작하고 계산할 숫자가 아니므로 int로 바꾸지 않는 편이 자연스럽습니다.","이 예제는 ‘문자열이 숫자 모양이라고 해서 숫자 타입이어야 하는 것은 아니다’라는 점도 보여 줍니다."],"code":"raw = \" 010-1234 5678 \"\nclean = raw.strip()\ndigits = clean.replace(\"-\", \"\").replace(\" \", \"\")\n\nprint(digits)\nprint(len(digits))\nprint(type(digits))","codeNote":"예상 결과: 01012345678 / 11 / \u003cclass 'str'>","codeExplain":["strip은 맨 앞과 맨 뒤의 공백을 제거해 clean을 만듭니다.","두 replace 호출이 하이픈과 중간 공백을 차례로 없앱니다.","전화번호를 int로 바꾸지 않았으므로 앞의 0이 유지되고 타입은 str입니다."]},{"kind":"check","extras":[],"visibleExtras":0,"id":"t2-c5-p12","answerOnNext":true,"eyebrow":"확인 문제","title":"문자열 메서드가 원본을 어떻게 다루는지 확인하세요","paragraphs":["문자열은 immutable입니다. 아래 상황에서 어떤 변수의 값이 실제로 바뀌는지 생각하면 메서드의 반환값을 이해했는지 확인할 수 있습니다.","코드를 실행하기 전에 raw와 clean의 최종 값을 각각 적어 보세요."],"question":"raw = \"  HELLO  \" 다음에 clean = raw.strip().lower()를 실행했습니다. raw와 clean은 각각 무엇이고, 왜 raw 자체는 바뀌지 않나요?"},{"id":"t2-c5-p12-solution","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"정답과 풀이","title":"문자열 불변성과 반환값 · 풀이","paragraphs":["raw는 그대로 \"  HELLO  \"이고 clean은 \"hello\"입니다. strip과 lower는 원본 문자열 내부를 수정하는 대신 각각 새 문자열을 반환합니다.","연쇄 호출에서는 raw.strip()의 새 결과가 lower()의 입력이 됩니다. 최종 결과만 clean에 저장됩니다.","원본까지 바꾸고 싶다면 raw = raw.strip().lower()처럼 결과를 raw 변수에 다시 대입해야 합니다. 이때도 기존 문자열 객체를 고친 것이 아니라 raw가 새 문자열을 가리키도록 바뀐 것입니다."]},{"id":"t2-c5-x01","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · slice","title":"슬라이스의 끝 index는 포함되지 않습니다","paragraphs":["text[start:end]에서 start는 포함되고 end는 포함되지 않습니다. text[0:3]이면 index 0,1,2의 세 글자를 가져옵니다.","끝을 제외하는 규칙은 처음에는 낯설지만 길이 계산이 단순해집니다. 0:3의 길이는 3-0=3, 2:5의 길이는 5-2=3처럼 차이와 요소 개수가 바로 맞습니다.","start나 end를 생략할 수도 있습니다. text[:3]은 처음부터 3 직전까지, text[3:]은 3부터 끝까지입니다.","슬라이스는 원본 문자열을 바꾸지 않고 새 문자열을 만듭니다. 범위를 조금 벗어나도 가능한 구간까지만 반환하므로 단일 index 접근과 오류 동작도 다릅니다."]},{"id":"t2-c5-x02","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"날짜 문자열을 연·월·일 조각으로 자릅니다","paragraphs":["형식이 YYYY-MM-DD로 고정돼 있다는 전제 아래에서는 위치 기반 slice로 각 부분을 읽을 수 있습니다.","이 방법은 형식이 정확히 고정된 데이터에서만 안전합니다. 2026-9-4처럼 자릿수가 달라질 수 있다면 split('-') 같은 방식이 더 적합할 수 있습니다.","문법보다 먼저 데이터 형식의 계약이 무엇인지 확인해야 하는 이유입니다."],"code":"date_text = \"2026-09-24\"\nyear = date_text[:4]\nmonth = date_text[5:7]\nday = date_text[8:]\n\nprint(year, month, day)","codeNote":"예상 결과: 2026 09 24","codeExplain":["[:4]는 index 0~3의 네 글자를 가져옵니다.","[5:7]은 index 5와 6만 가져오고 end 7은 제외합니다.","[8:]은 index 8부터 문자열 끝까지 잘라 day를 만듭니다."]},{"id":"t2-c5-x03","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 검색","title":"find와 index는 둘 다 위치를 찾지만 실패할 때 다르게 동작합니다","paragraphs":["str.find(sub)는 찾은 위치 index를 반환하고 없으면 -1을 반환합니다. str.index(sub)는 찾으면 위치를 반환하지만 없으면 ValueError를 발생시킵니다.","둘 중 하나가 무조건 더 좋은 것은 아닙니다. ‘없을 수도 있는 상황이 정상’이라면 find가 편할 수 있고, 반드시 있어야 하는 패턴이 없으면 오류로 다루고 싶다면 index가 더 명시적일 수 있습니다.","단순히 포함 여부만 필요하면 위치 숫자를 얻기보다 sub in text가 더 읽기 쉽습니다. 필요한 정보 수준에 맞는 도구를 고르세요.","검색 전에 lower 같은 정규화를 할지 여부도 데이터 규칙에 따라 결정해야 합니다."]},{"id":"t2-c5-x04","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"로그 한 줄에서 ERROR의 위치와 뒤쪽 메시지를 분리합니다","paragraphs":["로그 문자열 안에서 특정 단어의 위치를 찾고 그 뒤 내용을 slice로 꺼내는 예제입니다. 위치를 사용해야 하는 이유가 있을 때 find가 유용합니다.","찾지 못했을 때 -1이 나오는 점을 반드시 검사해야 합니다. -1을 그대로 slice에 사용하면 전혀 다른 마지막 글자를 가져올 수 있어 조용한 버그가 생깁니다."],"code":"line = \"2026-09-24 10:30 ERROR payment failed\"\nmarker = \"ERROR\"\npos = line.find(marker)\n\nif pos != -1:\n    message = line[pos + len(marker):].strip()\n    print(message)","codeNote":"예상 결과: payment failed","codeExplain":["find는 ERROR가 시작되는 index를 pos에 저장합니다.","pos != -1로 실제로 찾았는지 먼저 확인합니다.","pos + len(marker)부터 끝까지 잘라 ERROR 단어 자체를 제외하고 strip으로 앞 공백을 정리합니다."]},{"id":"t2-c5-x05","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · split","title":"split에 구분자를 안 주면 연속 공백을 단어 경계처럼 처리합니다","paragraphs":["\"a  b\\tc\".split()처럼 인자를 생략하면 일반적인 공백 문자를 기준으로 나누고 연속 공백도 하나의 경계처럼 처리합니다.","반대로 split(\" \")처럼 정확히 한 칸 공백을 구분자로 지정하면 연속 공백 사이에서 빈 문자열이 생길 수 있습니다. 두 코드가 항상 같은 결과를 만들지 않습니다.","자연어 문장의 단어 개수를 아주 단순하게 세는 상황에서는 split()이 편하지만, 실제 언어 처리에서는 구두점·다국어·특수 공백 등 더 많은 규칙이 필요합니다.","문자열 도구는 입력 형식이 단순할 때 강력합니다. 데이터가 복잡할수록 형식 전용 파서나 라이브러리를 고려해야 합니다."]},{"id":"t2-c5-x06","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"여러 공백이 섞인 문장에서 단어 목록을 만듭니다","paragraphs":["사용자가 스페이스를 여러 번 누르거나 탭을 넣어도 split()은 공백 묶음을 경계로 처리해 깔끔한 단어 list를 만들 수 있습니다.","그 뒤 join으로 원하는 한 칸 공백 표기만 사용해 다시 문장을 만들면 간단한 공백 정규화가 됩니다."],"code":"raw = \"Python   makes\\ttext   easier\"\nwords = raw.split()\nnormalized = \" \".join(words)\n\nprint(words)\nprint(normalized)","codeNote":"예상 결과: ['Python', 'makes', 'text', 'easier'] / Python makes text easier","codeExplain":["split()은 연속 스페이스와 탭을 공백 경계로 취급해 네 단어를 만듭니다.","join은 그 네 단어 사이에 정확히 한 칸 공백만 넣어 표준화된 문자열을 만듭니다."]},{"id":"t2-c5-x07","kind":"practice","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 실습","title":"이름 입력을 ‘앞뒤 공백 제거 + 단어 첫 글자 대문자’로 정리하세요","paragraphs":["사용자가 \"  kim min su  \"처럼 이름을 입력했다고 가정합니다. 앞뒤 공백을 제거하고 title()을 사용해 각 단어의 첫 글자를 대문자로 바꿉니다.","title은 모든 문화권의 실제 이름 표기 규칙을 완벽히 처리하는 도구가 아닙니다. 이번 실습은 문자열 변환과 반환값을 연습하기 위한 단순 예제입니다."],"code":"raw_name = \"  kim min su  \"\nclean = ____\nformatted = ____\n\nprint(formatted)","codeNote":"예상 결과: Kim Min Su","codeExplain":["첫 빈칸은 strip으로 앞뒤 공백을 없애야 합니다.","두 번째 빈칸은 clean.title()의 반환값을 formatted에 저장하면 됩니다."],"practicePrompt":"strip과 title을 각각 한 단계로 나눠 완성하세요. raw_name도 함께 출력해 원본이 그대로인지 확인해 보세요."},{"id":"t2-c5-x08","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"이름 정리 실습 · 풀이","paragraphs":["clean = raw_name.strip()으로 먼저 여백을 제거합니다. 그 다음 formatted = clean.title()로 단어별 첫 글자를 바꿉니다.","두 메서드 모두 새 문자열을 반환하므로 raw_name에는 원래 값이 남아 있습니다.","실제 이름은 McDonald, van der Waals처럼 title() 규칙과 다른 표기가 있을 수 있습니다. 데이터 정리는 ‘기술적으로 가능하다’와 ‘도메인 규칙에 맞다’를 구분해야 합니다."],"code":"raw_name = \"  kim min su  \"\nclean = raw_name.strip()\nformatted = clean.title()\n\nprint(\"원본:\", repr(raw_name))\nprint(\"정리:\", formatted)","codeNote":"예상 결과: 원본에는 양쪽 공백이 보이고 정리 결과는 Kim Min Su","codeExplain":["strip은 여백 제거 결과를 clean에 저장합니다.","title은 clean을 기준으로 새 문자열을 만들며 raw_name에는 영향을 주지 않습니다.","repr(raw_name)은 보이지 않는 공백을 확인하기 쉽게 보여 줍니다."]},{"id":"t2-c5-x09","kind":"practice","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 실습","title":"쉼표로 적힌 태그를 정리하고 빈 태그를 제거하세요","paragraphs":["원본 태그 문자열에는 공백과 빈 항목이 섞여 있습니다. 먼저 쉼표로 나눈 뒤 각 tag를 strip하고, 빈 문자열이 아닌 값만 cleaned_tags에 추가합니다.","이 실습은 split 결과를 바로 믿지 않고 각 조각을 다시 정리·검증하는 습관을 익히는 데 목적이 있습니다."],"code":"raw = \"python, ai, , automation ,  \"\ncleaned_tags = []\n\nfor tag in raw.split(\",\"):\n    clean = ____\n    if ____:\n        cleaned_tags.append(____)\n\nprint(cleaned_tags)","codeNote":"예상 결과: ['python', 'ai', 'automation']","codeExplain":["raw.split(',')은 빈 항목도 포함한 문자열 list를 만듭니다.","반복 안에서 각 tag를 strip해 clean으로 만들고, clean이 빈 문자열이 아닐 때만 결과에 넣어야 합니다."],"practicePrompt":"① clean = tag.strip() ② if clean != '' 또는 if clean 사용 ③ cleaned_tags.append(clean)으로 완성하세요."},{"id":"t2-c5-x10","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"태그 정리 실습 · 풀이","paragraphs":["split 뒤의 각 조각에는 앞뒤 공백이 남을 수 있으므로 strip이 필요합니다. 공백만 있던 조각은 strip 후 빈 문자열 \"\"이 됩니다.","if clean:은 빈 문자열이면 False, 글자가 있으면 True가 되는 Python의 truthiness를 사용합니다.","원본 순서는 유지하면서 유효한 태그만 새 리스트에 모았기 때문에 이후 검색·저장에 더 안정적인 구조가 됩니다."],"code":"raw = \"python, ai, , automation ,  \"\ncleaned_tags = []\n\nfor tag in raw.split(\",\"):\n    clean = tag.strip()\n    if clean:\n        cleaned_tags.append(clean)\n\nprint(cleaned_tags)","codeNote":"예상 결과: ['python', 'ai', 'automation']","codeExplain":["tag.strip() 결과가 빈 문자열이면 if clean을 통과하지 못합니다.","유효한 세 문자열만 append되어 최종 리스트가 만들어집니다."]},{"id":"t2-c5-x11","kind":"check","answerOnNext":true,"extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 확인","title":"문자열 비교 전에 무엇을 정규화해야 하는지 판단하세요","paragraphs":["모든 문자열에 lower·strip을 무조건 적용하는 것이 정답은 아닙니다. 어떤 차이를 ‘같은 것으로 볼 것인지’가 먼저 정해져야 합니다.","명령어 yes/no는 대소문자와 주변 공백을 무시해도 되지만, 비밀번호나 정확한 식별자는 대소문자가 의미를 가질 수 있습니다.","정규화는 편의를 위한 문자열 기술이 아니라 데이터 의미에 대한 규칙입니다."],"question":"사용자 입력을 비교할 때 ① yes/no 응답 ② 비밀번호 ③ 이메일 주소 표시명에 대해 strip·lower를 모두 적용해도 될까요? 각각 왜 그런지 설명해 보세요."},{"id":"t2-c5-x12","kind":"solution","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 풀이","title":"정규화 범위를 정하는 문제 · 풀이","paragraphs":["① yes/no 응답은 주변 공백과 대소문자를 보통 의미 없는 차이로 볼 수 있으므로 strip().lower()가 자연스럽습니다.","② 비밀번호는 대소문자와 문자 하나하나가 값 자체일 수 있으므로 임의로 lower하면 다른 비밀번호를 같은 것으로 바꾸는 위험이 있습니다. 입력 정책에 따라 주변 공백 처리도 신중해야 합니다.","③ 이메일의 표시명은 사람이 보는 표기이므로 무조건 lower하면 원래 표현을 잃을 수 있습니다. 주소 부분도 실제 시스템 규칙에 따라 별도로 다뤄야 합니다.","핵심은 메서드가 가능한지보다 ‘어떤 차이를 버려도 되는지’를 도메인 규칙으로 먼저 정하는 것입니다."]},{"id":"t2-c5-x13","kind":"concept","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 인코딩","title":"문자열은 ‘글자’, 파일과 네트워크에서는 결국 ‘바이트’로 변환됩니다","paragraphs":["Python의 str은 사람이 읽는 문자 단위의 텍스트를 다룹니다. 하지만 파일에 저장하거나 네트워크로 보낼 때는 UTF-8 같은 인코딩 규칙으로 bytes로 바뀝니다.","한글 한 글자가 항상 파일에서 1바이트인 것은 아닙니다. len(\"가\")는 문자열 글자 수 기준 1이지만 \"가\".encode(\"utf-8\")의 바이트 길이는 3입니다.","지금 단계에서 인코딩 표를 외울 필요는 없습니다. 대신 파일을 열 때 encoding=\"utf-8\"을 명시하는 이유가 ‘바이트를 어떤 문자로 해석할지 약속하는 것’이라는 점을 이해하세요.","다음 파일 챕터에서 한글이 깨지는 문제와 연결됩니다."]},{"id":"t2-c5-x14","kind":"example","extras":[],"visibleExtras":0,"eyebrow":"깊이 이해하기 · 예제","title":"같은 한글 문자열의 글자 수와 UTF-8 바이트 수를 비교합니다","paragraphs":["문자열 길이와 저장 크기가 같은 개념이 아니라는 사실을 작은 코드로 확인합니다.","encode는 str을 bytes로 바꿉니다. 화면에 b'...' 형태가 보일 수 있는데, 이는 사람이 읽는 문자열과 저장·전송용 바이트가 다른 타입임을 보여 줍니다.","파일 오류를 디버깅할 때 ‘문자열 내용이 틀린가’와 ‘인코딩이 틀린가’를 구분하는 출발점입니다."],"code":"text = \"가나다\"\ndata = text.encode(\"utf-8\")\n\nprint(len(text))\nprint(len(data))\nprint(type(text), type(data))","codeNote":"예상 결과: 글자 수 3 / UTF-8 바이트 수 9 / str과 bytes는 서로 다른 타입","codeExplain":["len(text)는 Python 문자열의 문자 개수를 세어 3을 반환합니다.","encode('utf-8')는 저장·전송용 bytes를 만들고 한글 세 글자는 9바이트가 됩니다.","type 출력으로 str과 bytes가 다른 자료형임을 확인합니다."]},{"kind":"summary","extras":[],"visibleExtras":0,"id":"t2-c5-p13","eyebrow":"Chapter 5 정리","title":"문자열은 ‘정리하고 해석하는 데이터’로 읽으세요","paragraphs":["문자열은 순서가 있어 index와 slice를 쓸 수 있지만 immutable이라 메서드 결과를 새 문자열로 받아야 합니다. strip·lower·replace는 형태를 정리하고, split은 여러 조각으로 나누며, join은 다시 하나의 문자열로 합칩니다.","중요한 것은 메서드 개수가 아니라 처리 순서입니다. 원본을 정리하고, 필요한 패턴을 검사하고, 의미 단위로 나누고, 숫자가 필요하면 변환하고, 마지막에 사람이 읽을 출력 문자열을 만듭니다.","다음 파일 챕터에서는 문자열이 한 줄씩 디스크에서 들어옵니다. 즉 이번 장의 strip·split·변환이 파일 읽기 코드 안에서 그대로 사용됩니다."],"bullets":["문자열은 immutable: 메서드는 보통 새 문자열을 반환","비교 전에 필요한 범위에서만 정규화","split 뒤에는 list가 되므로 길이와 각 조각을 검증","f-string은 표시용 문자열을 만들 뿐 원래 데이터 타입을 바꾸지 않음","str과 bytes, 문자와 인코딩은 서로 다른 층"],"references":[{"book":"Automate the Boring Stuff with Python, 3rd Edition","author":"Al Sweigart","year":2025,"note":"누적 50만 부 이상 판매된 입문서 계열의 2025년 개정판. 문자열 정리·패턴 처리·자동화 입력을 실제 작업으로 연결하는 방식 참고."},{"book":"Automate the Boring Stuff with Python Workbook","author":"Al Sweigart","year":2025,"note":"Penguin Random House Higher Education의 Python Programming 교재·Exam Copy 대상. 문자열·텍스트 편집을 짧은 문제와 완성 코드로 연결하는 실습 설계 참고."},{"book":"Coding for Chemists: Saving Time and Solving Problems with Python","author":"Benjamin J. Lear · Christopher J. Johnson","year":2026,"note":"MIT Press의 대학·대학원 수업용 교재로 Exam Copy 제공. 원시 텍스트를 정리하고 분석 가능한 데이터로 바꾸는 문제 중심 설명 참고."}]}],"track":2,"id":"t2-c5","remember":"문자열 메서드는 원본 문자열을 직접 고치는 것이 아니라 새 문자열을 돌려주는 경우가 많습니다.","practiceGoal":"사용자 입력과 텍스트 데이터를 정리·분리·검색·재조합해 안전한 값으로 만들기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Automate the Boring Stuff with Python, 3rd Edition","author":"Al Sweigart","year":2025,"note":"누적 50만 부 이상 판매된 입문서 계열의 2025년 개정판. 문자열 정리·패턴 처리·자동화 입력을 실제 작업으로 연결하는 방식 참고."},{"book":"Automate the Boring Stuff with Python Workbook","author":"Al Sweigart","year":2025,"note":"Penguin Random House Higher Education의 Python Programming 교재·Exam Copy 대상. 문자열·텍스트 편집을 짧은 문제와 완성 코드로 연결하는 실습 설계 참고."},{"book":"Coding for Chemists: Saving Time and Solving Problems with Python","author":"Benjamin J. Lear · Christopher J. Johnson","year":2026,"note":"MIT Press의 대학·대학원 수업용 교재로 Exam Copy 제공. 원시 텍스트를 정리하고 분석 가능한 데이터로 바꾸는 문제 중심 설명 참고."}]},{"chapter":6,"title":"파일 읽기와 쓰기","pages":[{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이번 단어장에서는 file 파일, path 경로, open를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"file 파일","description":"파일은 프로그램을 꺼도 내용이 남는 저장 공간입니다. 변수는 실행이 끝나면 사라질 수 있지만 파일에 쓴 내용은 디스크에 남아 다음 실행에서도 다시 읽을 수 있습니다.","usage":"설정, 로그, 간단한 데이터 저장과 불러오기에 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: notes.txt에 메모를 저장하고 다음 실행에서 다시 읽을 수 있습니다."},{"term":"path 경로","description":"경로는 파일이 어디에 있는지 알려 주는 주소입니다. 코드가 맞아도 경로가 틀리면 Python은 파일을 찾지 못합니다. 상대 경로는 프로그램을 어디서 실행했는지에 따라 의미가 달라질 수 있습니다.","usage":"어떤 파일을 열지 지정할 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: \"data/notes.txt\"는 현재 작업 위치를 기준으로 한 상대 경로입니다."},{"term":"open","description":"open은 Python에서 파일을 사용하기 위해 여는 함수입니다. 어떤 파일을 열지와 읽을지 쓸지를 함께 지정합니다. 파일을 열었다면 사용이 끝난 뒤 닫는 것도 중요합니다.","usage":"파일 입출력의 시작점으로 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: open(\"notes.txt\", \"r\", encoding=\"utf-8\")처럼 사용합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c6-p1","code":"with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. file 파일, path 경로, open를 실제 코드와 연결해서 보면 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. file 파일, path 경로, open를 실제 코드와 연결해서 보면 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. file 파일, path 경로, open를 실제 코드와 연결해서 보면 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["이번 단어장에서는 read / write mode, encoding 인코딩, with context manager를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"read / write mode","description":"파일 모드는 그 파일에 무엇을 할지 정합니다. \"r\"은 읽기, \"w\"는 새로 쓰기, \"a\"는 기존 내용 뒤에 이어 쓰기입니다. 특히 \"w\"는 기존 내용을 지울 수 있으므로 주의해야 합니다.","usage":"파일을 어떤 목적으로 열지 지정할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: \"w\"는 기존 파일 내용을 덮어쓸 수 있어 주의가 필요합니다."},{"term":"encoding 인코딩","description":"인코딩은 글자를 파일에 저장하고 다시 읽는 규칙입니다. 한글 텍스트에서는 utf-8을 명시하면 환경 차이로 글자가 깨질 가능성을 줄일 수 있습니다.","usage":"한글 깨짐이나 문자 변환 오류를 예방할 때 중요합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: encoding=\"utf-8\"을 자주 사용합니다."},{"term":"with context manager","description":"with open(...) as f:는 파일을 열고 사용하는 범위를 한 블록으로 묶습니다. 블록이 끝나면 Python이 파일을 자동으로 닫아 주므로 close()를 빠뜨리는 실수를 줄여 줍니다.","usage":"파일을 안전하게 열고 닫을 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: with open(...) as f: 블록이 끝나면 파일이 자동으로 닫힙니다."}],"extras":[],"visibleExtras":2,"id":"t2-c6-p2","code":"# 용어를 실제 코드에서 확인: 코드에서 자주 만나는 표현\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. read / write mode, encoding 인코딩, with context manager를 실제 코드와 연결해서 보면 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. read / write mode, encoding 인코딩, with context manager를 실제 코드와 연결해서 보면 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. read / write mode, encoding 인코딩, with context manager를 실제 코드와 연결해서 보면 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 1/6","title":"파일은 프로그램 밖에 남는 상태입니다","paragraphs":["‘파일은 프로그램 밖에 남는 상태입니다’에서는 첫 코드 with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","변수 값은 프로그램이 끝나면 사라지지만 파일에 저장하면 다음 실행에서도 다시 읽을 수 있습니다. 그래서 파일 입출력은 작은 프로그램을 실제 도구로 확장하는 첫 단계입니다.","입력 → 처리 → 파일 저장, 또는 파일 읽기 → 처리 → 출력처럼 기존의 입력·처리·출력 구조에 저장소가 추가된다고 생각하면 쉽습니다.","설정 파일, 간단한 기록, 로그, 내보내기 기능 등이 같은 원리를 사용합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p3","code":"# 개념을 코드로 확인: 파일은 프로그램 밖에 남는 상태입니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일은 프로그램 밖에 남는 상태입니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일은 프로그램 밖에 남는 상태입니다’ 내용을 설명하는 코드에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일은 프로그램 밖에 남는 상태입니다’ 내용을 설명하는 코드에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 2/6","title":"with open은 열기와 닫기를 한 구조로 묶습니다","paragraphs":["‘with open은 열기와 닫기를 한 구조로 묶습니다’에서는 첫 코드 with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","파일은 열었으면 닫아야 합니다. with 문을 사용하면 블록을 벗어날 때 Python이 파일을 정리하므로 close()를 직접 빼먹을 위험이 줄어듭니다.","with open(path, \"r\", encoding=\"utf-8\") as f: 아래에서 f.read()나 반복문으로 내용을 읽을 수 있습니다.","자원을 열고 정리하는 패턴은 나중에 데이터베이스나 네트워크 연결에서도 비슷한 사고방식으로 이어집니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p4","code":"with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘with open은 열기와 닫기를 한 구조로 묶습니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 w가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 문자열 \"새 메모\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다. ‘with open은 열기와 닫기를 한 구조로 묶습니다’ 내용을 설명하는 코드에서는 2행은 \"새 메모\\\\n\" 내용을 열린 파일 f에 실제로 기록하는 줄입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 3/6","title":"쓰기 모드는 기존 데이터를 지울 수 있습니다","paragraphs":["‘쓰기 모드는 기존 데이터를 지울 수 있습니다’에서는 첫 코드 with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","\"w\" 모드는 파일을 새 내용으로 쓰기 때문에 기존 내용이 사라질 수 있습니다. 기존 기록 뒤에 추가하려면 \"a\"가 더 적합한 경우가 있습니다.","어떤 모드를 쓰기 전에 “기존 내용을 보존해야 하는가?”를 먼저 판단하세요.","중요한 파일을 다룰 때는 테스트용 복사본으로 먼저 확인하는 습관이 안전합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p5","code":"# 개념을 코드로 확인: 쓰기 모드는 기존 데이터를 지울 수 있습니다\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘쓰기 모드는 기존 데이터를 지울 수 있습니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 w가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 문자열 \"새 메모\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다. ‘쓰기 모드는 기존 데이터를 지울 수 있습니다’ 내용을 설명하는 코드에서는 2행은 \"새 메모\\\\n\" 내용을 열린 파일 f에 실제로 기록하는 줄입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 4/6","title":"한 줄씩 읽으면 큰 파일도 다루기 쉽습니다","paragraphs":["‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’에서는 첫 코드 total = 0에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","f.read()는 전체 내용을 한 번에 가져오지만, for line in f: 처럼 반복하면 한 줄씩 처리할 수 있습니다.","각 줄에 strip()을 적용하고 필요한 값으로 변환하면 문자열 챕터에서 배운 기술을 그대로 연결할 수 있습니다.","파일 크기가 커질수록 전체를 한 번에 메모리에 올리는 방식보다 스트리밍 처리의 장점이 커집니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p6","code":"total = 0\n\nwith open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total += int(line.strip())\n\nprint(total)","codeNote":"한 줄씩 읽은 문자열을 정수로 바꿔 total에 누적합니다.","codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’ 내용을 설명하는 코드에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「with open(\"numbers.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"numbers.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’ 내용을 설명하는 코드에서는 3행은 \"numbers.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’ 내용을 설명하는 코드에서는 4행은 f에서 값을 하나씩 꺼내 line에 넣기 시작하는 반복 지점입니다.","5행 「total += int(line.strip())」 — 현재 line 값을 처리하는 반복 안에서 현재 total에 int(line.strip())를 더해 새 합계를 다시 total에 저장합니다. 이전까지의 합계를 지우지 않고 계속 누적하는 줄입니다. ‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’ 내용을 설명하는 코드에서는 5행은 total의 이전 값에 int(line.strip()) 연산을 적용해 같은 변수의 새 값으로 갱신합니다.","7행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘한 줄씩 읽으면 큰 파일도 다루기 쉽습니다’ 내용을 설명하는 코드에서는 7행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 5/6","title":"경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다","paragraphs":["‘경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다’에서는 첫 코드 filename = \"data/memo.txt\"에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","파일 이름이 맞아도 현재 작업 폴더가 다르면 상대 경로가 다른 위치를 가리킬 수 있습니다. FileNotFoundError가 나면 경로 문자열과 실행 위치를 함께 확인하세요.","학습 단계에서는 같은 폴더의 단순 파일부터 시작하고, 나중에 pathlib로 경로를 조합하는 방식을 배우면 좋습니다.","“코드 오류”와 “환경·파일 위치 오류”를 구분하는 습관이 중요합니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p7","code":"filename = \"data/memo.txt\"\n\nwith open(filename, \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 위치는 filename 경로가 결정하고, utf-8은 한글을 읽는 문자 인코딩을 지정합니다.","codeExplain":["1행 「filename = \"data/memo.txt\"」 — 문자열 \"data/memo.txt\"을 구한 뒤 결과를 filename라는 변수에 저장합니다. 이 줄 이후에는 filename라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다’ 내용을 설명하는 코드에서는 1행은 \"data/memo.txt\"에서 만든 결과를 filename에 저장하거나 갱신하는 줄입니다.","3행 「with open(filename, \"r\", encoding=\"utf-8\") as f:」 — filename 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다’ 내용을 설명하는 코드에서는 3행은 filename 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다’ 내용을 설명하는 코드에서는 4행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","6행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘경로 문제는 코드가 맞아도 파일을 못 찾게 만듭니다’ 내용을 설명하는 코드에서는 6행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 6/6","title":"읽기와 쓰기는 데이터 검증과 함께 사용합니다","paragraphs":["‘읽기와 쓰기는 데이터 검증과 함께 사용합니다’에서는 첫 코드 with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","파일에서 읽은 문자열이 항상 기대한 형식이라는 보장은 없습니다. 빈 줄, 잘못된 숫자, 누락된 필드가 있을 수 있습니다.","읽기 → 정리 → 검증 → 변환 → 처리 순서를 지키면 오류 위치가 명확해집니다.","이후 CSV, JSON, 데이터베이스를 배울 때도 외부 데이터를 신뢰하지 않고 구조를 확인하는 원칙은 그대로 유지됩니다."],"keywords":["file 파일","path 경로","open","read / write mode"],"extras":[],"visibleExtras":2,"id":"t2-c6-p8","code":"# 개념을 코드로 확인: 읽기와 쓰기는 데이터 검증과 함께 사용합니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘읽기와 쓰기는 데이터 검증과 함께 사용합니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘읽기와 쓰기는 데이터 검증과 함께 사용합니다’ 내용을 설명하는 코드에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘읽기와 쓰기는 데이터 검증과 함께 사용합니다’ 내용을 설명하는 코드에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"파일 읽기와 쓰기의 전체 흐름","paragraphs":["파일 읽기와 쓰기에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"IPO_PROJECT","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c6-p9","code":"# 전체 실행 흐름 확인: 파일 읽기와 쓰기의 전체 흐름\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일 읽기와 쓰기의 전체 흐름’ 흐름에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기의 전체 흐름’ 흐름에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기의 전체 흐름’ 흐름에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"파일 읽기와 쓰기를 하나의 코드로 연결합니다","paragraphs":[],"code":"# 예제로 동작 확인: 파일 읽기와 쓰기를 하나의 코드로 연결합니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","extras":[],"visibleExtras":2,"id":"t2-c6-p10","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일 읽기와 쓰기를 하나의 코드로 연결합니다’ 예제에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기를 하나의 코드로 연결합니다’ 예제에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기를 하나의 코드로 연결합니다’ 예제에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"파일 읽기와 쓰기를 직접 바꾸고 확장합니다","paragraphs":["파일을 읽는 코드는 먼저 파일을 열고, 한 줄이나 전체 내용을 읽고, 문자열을 필요한 타입으로 바꾸는 순서로 진행됩니다.","파일에 숫자가 적혀 있어도 read나 한 줄 반복으로 가져온 값은 문자열입니다. 줄바꿈을 strip으로 지우고 int로 바꾸어야 숫자 계산이 됩니다.","w 모드는 기존 내용을 새로 쓰고 a 모드는 뒤에 추가합니다. 저장 문제에서는 어떤 모드가 맞는지 먼저 결정한 뒤 write 코드를 작성하세요."],"code":"total = 0\n\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        number = ____\n        total = ____\n\nprint(total)","practicePrompt":"expenses.txt 파일에 금액을 한 줄에 하나씩 저장한다고 가정하세요. 파일을 읽어 각 줄을 int로 바꾼 뒤 총합을 계산하는 코드를 작성해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c6-p11","answerOnNext":true,"codeExplain":["1행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 1행은 0에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","3행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"expenses.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 3행은 \"expenses.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","4행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 4행은 f에서 값을 하나씩 꺼내 line에 넣기 시작하는 반복 지점입니다.","5행 「number = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 number라는 변수에 저장합니다. 이 줄 이후에는 number라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 5행은 ____에서 만든 결과를 number에 저장하거나 갱신하는 줄입니다.","6행 「total = ____」 — 직접 채워야 하는 빈칸이 포함된 표현식을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 6행은 ____에서 만든 결과를 total에 저장하거나 갱신하는 줄입니다.","8행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 실습에서는 8행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c6-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"파일 읽기와 쓰기를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["앞의 세 줄은 실습용 파일을 만드는 준비 코드입니다. 기존에 중요한 expenses.txt가 있는 폴더에서는 실행하지 마세요.","\"w\"는 파일을 여는 즉시 기존 내용을 비웁니다. \"r\"은 읽기입니다.","각 줄을 읽고 줄바꿈을 제거한 후 숫자로 바꿉니다. 12000 + 8000 + 15000 = 35000입니다.","파일은 현재 작업 폴더에 생깁니다. 휴대폰 다운로드 폴더에 자동으로 생기는 것은 아닙니다."],"code":"with open(\"expenses.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"12000\\n8000\\n15000\\n\")\n\ntotal = 0\nwith open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        total = total + int(line.strip())\nprint(total)","codeNote":"실행 결과 또는 테스트 기준\n35000","extras":[],"codeExplain":["1행 「with open(\"expenses.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"expenses.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","2행 「f.write(\"12000\\n8000\\n15000\\n\")」 — 문자열 \"12000\\n8000\\n15000\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다.","4행 「total = 0」 — 숫자 0을 구한 뒤 결과를 total라는 변수에 저장합니다. 이 줄 이후에는 total라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","5행 「with open(\"expenses.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"expenses.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다.","6행 「for line in f:」 — f에서 값을 하나씩 꺼내 line에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다.","7행 「total = total + int(line.strip())」 — 현재 line 값을 처리하는 반복 안에서 이전 total을 그대로 살려 두고 새 값을 더한 결과를 다시 total에 저장합니다. 합계를 반복할 때 이전 결과를 잃지 않기 위한 누적 방식입니다.","8행 「print(total)」 — total의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기를 직접 바꾸고 확장합니다’ 풀이에서는 8행은 total의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"check","eyebrow":"확인 문제","title":"파일 읽기와 쓰기 핵심을 확인합니다","paragraphs":[],"question":"기존 기록을 보존해야 하는 파일을 \"w\" 모드로 열면 어떤 위험이 있을까요?","extras":[],"visibleExtras":3,"id":"t2-c6-p12","answerOnNext":true,"code":"# 핵심 개념 확인: 파일 읽기와 쓰기 핵심을 확인합니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 확인 문제의 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 확인 문제의 코드에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 확인 문제의 코드에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"파일 읽기와 쓰기 핵심을 확인합니다 · 풀이","paragraphs":["\"w\" 모드는 파일을 새로 쓰는 방식이라 기존 내용이 덮어써져 사라질 수 있습니다. 기존 내용 뒤에 추가하려면 상황에 따라 \"a\" 모드를 고려해야 합니다."],"extras":[],"code":"# 정답 코드의 동작 확인: 파일 읽기와 쓰기 핵심을 확인합니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"r 모드로 파일을 읽고 그 내용을 text 변수에 저장합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 풀이에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 풀이에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일 읽기와 쓰기 핵심을 확인합니다’ 풀이에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x01","kind":"concept","title":"파일은 프로그램을 꺼도 남는 공책입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘파일은 프로그램을 꺼도 남는 공책입니다’에서는 첫 코드 with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","변수에 저장한 값은 프로그램이 끝나면 보통 사라집니다. 파일에 적으면 껐다 켜도 내용이 남습니다.","파일 읽기는 공책을 펼쳐 보는 것이고, 파일 쓰기는 공책에 적는 것과 비슷합니다.","“메모리의 변수”와 “저장장치의 파일”을 구분하는 것이 핵심입니다."],"keywords":["file","파일","read","write"],"extras":[],"code":"# 개념을 코드로 확인: 파일은 프로그램을 꺼도 남는 공책입니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘파일은 프로그램을 꺼도 남는 공책입니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘파일은 프로그램을 꺼도 남는 공책입니다’ 내용을 설명하는 코드에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘파일은 프로그램을 꺼도 남는 공책입니다’ 내용을 설명하는 코드에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x02","kind":"example","title":"with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다","eyebrow":"초보 확장 · 예제","paragraphs":["open(\"note.txt\", \"r\")는 note.txt를 읽기 모드로 엽니다.","with 블록 안에서 f.read()로 내용을 읽습니다.","with 블록이 끝나면 Python이 파일을 자동으로 닫아 줍니다."],"code":"# 예제로 동작 확인: with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","extras":[],"codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다’ 예제에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 w가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 문자열 \"새 메모\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다. ‘with open을 쓰면 파일을 안전하게 열고 자동으로 닫습니다’ 예제에서는 2행은 \"새 메모\\\\n\" 내용을 열린 파일 f에 실제로 기록하는 줄입니다."]},{"id":"t2-c6-x03","kind":"concept","title":"r · w · a 모드는 파일에 하는 일이 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘r · w · a 모드는 파일에 하는 일이 다릅니다’에서는 첫 코드 with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","r은 읽기입니다. 파일이 없으면 FileNotFoundError가 납니다.","w는 새로 쓰기입니다. 같은 파일이 있으면 기존 내용을 지우고 새로 쓸 수 있으므로 조심해야 합니다.","a는 뒤에 이어 쓰기입니다. 기존 내용을 남기고 끝에 새 내용을 추가합니다."],"calloutTitle":"중요 경고","calloutBody":"w 모드는 기존 파일을 덮어쓸 수 있습니다. 중요한 파일에는 먼저 복사본을 만들어 두세요.","extras":[],"code":"# 개념을 코드로 확인: r · w · a 모드는 파일에 하는 일이 다릅니다\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"새 메모\\\\n\")","codeNote":"w 모드는 기존 내용을 새로 쓰므로 같은 파일이 이미 있으면 내용이 바뀔 수 있습니다.","codeExplain":["1행 「with open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 기존 내용을 새로 덮어쓸 수 있는 쓰기 모드(w)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘r · w · a 모드는 파일에 하는 일이 다릅니다’ 내용을 설명하는 코드에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 w가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「f.write(\"새 메모\\\\n\")」 — 문자열 \"새 메모\\\\n\"을 열린 파일 f에 실제로 기록합니다. 이 줄의 결과가 메모리 속 변수에만 남는 것이 아니라 디스크의 파일 내용으로 저장됩니다. ‘r · w · a 모드는 파일에 하는 일이 다릅니다’ 내용을 설명하는 코드에서는 2행은 \"새 메모\\\\n\" 내용을 열린 파일 f에 실제로 기록하는 줄입니다."]},{"id":"t2-c6-x04","kind":"example","title":"한 줄을 저장한 뒤 다시 읽어 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["첫 with는 write 모드로 hello.txt에 “안녕하세요”를 저장합니다.","두 번째 with는 같은 파일을 read 모드로 다시 열어 읽습니다.","저장 → 다시 읽기 흐름을 직접 해보면 파일 입출력이 쉽게 연결됩니다."],"code":"# 예제로 동작 확인: 한 줄을 저장한 뒤 다시 읽어 봅니다\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 전체 내용을 문자열로 읽어 text에 저장한 뒤 화면에 출력합니다.","extras":[],"codeExplain":["1행 「with open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:」 — \"memo.txt\" 파일을 읽기 모드(r)로 열고 열린 파일 객체를 f라는 이름으로 사용합니다. encoding=\"utf-8\"로 문자 해석 규칙도 지정합니다. with 블록이 끝나면 파일은 자동으로 닫힙니다. ‘한 줄을 저장한 뒤 다시 읽어 봅니다’ 예제에서는 1행은 \"memo.txt\" 파일을 여는 단계입니다. 모드 r가 읽기·덮어쓰기·이어쓰기 중 무엇인지 여기서 결정됩니다.","2행 「text = f.read()」 — f.read()의 현재 값을 구한 뒤 결과를 text라는 변수에 저장합니다. 이 줄 이후에는 text라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘한 줄을 저장한 뒤 다시 읽어 봅니다’ 예제에서는 2행은 f.read()에서 만든 결과를 text에 저장하거나 갱신하는 줄입니다.","4행 「print(text)」 — text의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘한 줄을 저장한 뒤 다시 읽어 봅니다’ 예제에서는 4행은 text의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c6-x05","kind":"concept","title":"경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다’에서는 첫 코드 filename = \"data/memo.txt\"에서 시작해 파일 이름·모드·인코딩과 실제 데이터 이동을 연결합니다. 코드 한 줄이 디스크의 기존 내용을 읽는지, 지우고 쓰는지, 뒤에 이어 쓰는지 구체적으로 구분합니다.","파일 이름만 적으면 현재 작업 폴더를 기준으로 찾습니다.","encoding=\"utf-8\"은 한글 같은 문자를 어떤 규칙으로 읽고 쓸지 알려 줍니다.","파일을 못 찾으면 문법보다 먼저 실행 위치와 파일 위치가 같은지 확인하세요."],"extras":[],"code":"# 개념을 코드로 확인: 경로와 인코딩은 “어디 파일인지, 어떤 글자 규칙인지” 알려 줍니다\nfilename = \"data/memo.txt\"\n\nwith open(filename, \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(text)","codeNote":"파일 위치는 filename 경로가 결정하고, utf-8은 한글을 읽는 문자 인코딩을 지정합니다.","codeExplain":["1행 「filename = \"data/memo.txt\"」 — 문자열 \"data/memo.txt\"을 구한 뒤 결과를 filename라는 변수에 저장합니다. 이 줄 이후에는 filename라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘경로와 인코딩은 “어
