"))\ncount = int(input(\"수량: \"))\nsubtotal = price * count\ndiscounted = subtotal * 0.9\nfinal_total = discounted + 3000\nprint(final_total)","codeNote":"실행 결과 또는 테스트 기준\n가격 2500, 수량 4 → 12000.0"},{"kind":"concept","eyebrow":"CHAPTER 07 · 실습 확장","title":"입력받는 계산기로 바꿔 보세요 — 이어서 이해하기","paragraphs":["사용자에게 받은 가격과 수량은 문자열이므로 숫자로 바꾼 뒤 곱해야 합니다. 입력과 연산을 함께 다룰 때 타입 확인이 다시 중요해집니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p9"},{"kind":"check","eyebrow":"확인 문제","title":"연산과 계산 순서","question":"print(5 + 2 * 3)과 print((5 + 2) * 3)의 결과는 왜 다를까요?","paragraphs":["연산 우선순위를 외우는 데만 의존하지 말고, 헷갈리면 괄호를 사용하세요. 괄호는 컴퓨터가 계산할 순서를 명확히 할 뿐 아니라 사람에게도 작성자의 의도를 보여 줍니다.","실제 코드에서는 결과가 같더라도 읽기 쉬운 식을 선택하는 것이 좋습니다. ‘다른 사람이 3초 안에 계산 의도를 이해할 수 있는가?’를 기준으로 생각해 보세요."],"extras":[],"visibleExtras":5,"id":"t1-c7-p10","answerOnNext":true},{"id":"t1-c7-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"연산과 계산 순서 · 풀이","paragraphs":["첫 번째는 곱셈 2 * 3을 먼저 계산해 6을 만들고 5를 더해 11이 됩니다. 두 번째는 괄호가 먼저 계산되어 7 * 3 = 21이 됩니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 07 · 확인 확장","title":"연산과 계산 순서 — 이어서 이해하기","paragraphs":["2 + 3 * 4는 곱셈이 먼저라 14가 됩니다. 계산 의도를 사람이 빠르게 읽어야 한다면 2 + (3 * 4)처럼 괄호를 써서 순서를 눈에 보이게 할 수 있습니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p11"},{"kind":"summary","eyebrow":"Chapter 7 정리","title":"계산을 코드로 옮기는 법","paragraphs":["연산자는 값을 계산해 새 값을 만듭니다. 계산 순서를 이해하고, 복잡한 계산은 여러 단계로 나누며, 중간값에 의미 있는 변수 이름을 붙이면 코드가 훨씬 읽기 쉬워집니다.","타입에 따라 같은 연산자의 의미가 달라질 수 있으므로 예상하지 못한 결과가 나오면 type()을 함께 확인하세요.","마지막 챕터에서는 지금까지 배운 것만 사용해 작은 프로그램을 처음부터 설계하고 테스트합니다.","변수와 연산자를 결합하면 입력값이 달라져도 같은 규칙을 반복해서 적용할 수 있습니다. 이것이 프로그램이 계산기를 넘어 ‘규칙을 자동으로 적용하는 도구’가 되는 시작점입니다.","마지막 챕터에서는 지금까지 배운 입력, 변수, 타입, 연산, 디버깅을 한 프로그램 안에 묶습니다. 새 문법보다 기존 개념을 연결하는 것이 목표입니다."],"bullets":["계산 규칙을 작은 단계로 나눈다.","괄호로 의도를 명확히 한다.","중간 결과를 변수에 저장한다.","계산 규칙을 먼저 문장으로 설명해 본다.","중간값을 변수로 나누어 검산한다.","헷갈리는 우선순위는 괄호로 명확하게 한다."],"extras":[],"visibleExtras":2,"id":"t1-c7-p12"},{"kind":"concept","eyebrow":"CHAPTER 07 · 심화 정리","title":"계산을 코드로 옮기는 법 — 한 단계 더","paragraphs":["계산 코드는 수식 자체보다 규칙을 읽기 쉽게 표현하는 것이 중요합니다. 중간값과 단위를 변수로 분리하면 검산과 수정이 쉬워집니다.","한 줄의 긴 식보다 의미 있는 변수 이름과 중간값을 사용하면 수정·검산·재사용이 쉬워집니다. 코드는 짧음보다 명확함이 더 중요한 경우가 많습니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p13"}],"track":1,"id":"t1-c7","remember":"괄호·곱셈의 우선순위","practiceGoal":"가격·수량·할인 계산기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":8,"title":"미니 프로젝트","pages":[{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"project 프로젝트","description":"하나의 목표를 실제로 완성하기 위해 여러 코드와 작업을 묶은 단위입니다. 입문 프로젝트는 작아도 좋으며 처음부터 끝까지 완성해 보는 경험이 중요합니다.","usage":"여러 개념을 연결해 하나의 결과물을 만들 때 사용합니다.","example":"예: 하루 지출 합계를 계산하는 작은 프로그램도 프로젝트입니다."},{"term":"requirement 요구사항","description":"프로그램이 무엇을 해야 하는지 구체적으로 정리한 조건입니다. 기능을 만들기 전에 요구사항을 명확히 하면 불필요한 코드를 줄이고 완료 기준을 정하기 쉽습니다.","usage":"코드를 쓰기 전에 목표와 필요한 기능을 정의할 때 사용합니다.","example":"예: ‘커피·점심·교통비를 입력받아 총합을 보여 준다’가 요구사항입니다."},{"term":"input-process-output","description":"프로그램을 입력·처리·출력 세 단계로 나누어 보는 기본 구조입니다. 복잡한 문제도 이 세 칸으로 나누면 데이터가 어디서 들어와 어떻게 바뀌는지 보기 쉬워집니다.","usage":"프로그램 구조를 설계하거나 문제 위치를 찾을 때 사용합니다.","example":"예: 금액 입력 → 합계 계산 → 총지출 출력으로 나눌 수 있습니다."}],"extras":[],"visibleExtras":1,"id":"t1-c8-p1"},{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"test case 테스트 케이스","description":"특정 입력과 그때 기대하는 결과를 한 묶음으로 정한 것입니다. 프로그램이 실제로 요구사항을 만족하는지 반복해서 확인할 수 있게 해 줍니다.","usage":"코드 수정 후 기능이 여전히 맞는지 검증할 때 사용합니다.","example":"예: 1000, 2000, 3000을 입력하면 기대 결과 6000을 정합니다."},{"term":"expected result 기대 결과","description":"테스트 전에 미리 계산하거나 정의해 둔 올바른 결과입니다. 실제 결과와 비교해야 프로그램이 맞는지 판단할 수 있습니다.","usage":"실행 결과를 객관적으로 검증할 때 사용합니다.","example":"예: 입력 합계가 6000이어야 한다고 미리 정한 값이 expected result입니다."},{"term":"edge case 경계 상황","description":"평소보다 극단적이거나 경계에 가까운 입력 상황을 뜻합니다. 정상 입력만으로는 드러나지 않는 문제를 찾는 데 도움이 됩니다.","usage":"0, 빈 값, 아주 큰 값, 잘못된 형식처럼 특별한 입력을 테스트할 때 사용합니다.","example":"예: 모든 지출이 0원일 때도 합계가 0으로 나오는지 확인합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c8-p2"},{"kind":"concept","eyebrow":"CHAPTER 08 · 처음부터 만들기","title":"프로젝트는 코드를 쓰기 전에 요구사항부터 정합니다","paragraphs":["프로젝트(project)는 하나의 목표를 가진 프로그램이나 기능을 실제로 완성해 보는 작업입니다. 코드를 먼저 쓰기 시작하면 중간에 ‘내가 뭘 만들려고 했지?’가 되기 쉽습니다.","먼저 한 문장으로 목표를 적고, 필요한 입력과 처리 규칙, 최종 출력을 정하세요. 이 작은 요구사항(requirement)이 프로그램 구조를 잡아 줍니다.","이번 프로젝트는 지금까지 배운 input, int, 변수, 덧셈, f-string만 사용합니다. 새 문법을 억지로 추가하지 않습니다.","프로젝트를 시작할 때 기능을 많이 넣는 것보다 ‘이번에 반드시 완성할 최소 범위’를 정하는 것이 중요합니다. 첫 버전은 입력 세 개를 받아 합계를 보여 주는 것만으로도 충분합니다. 작게 완성한 뒤 기능을 하나씩 추가하는 편이 실패 원인을 찾기도 쉽습니다.","요구사항은 ‘무엇을 만들 것인가’뿐 아니라 ‘완료됐다고 판단할 기준이 무엇인가’까지 포함하면 더 명확해집니다. 예를 들어 세 금액을 입력했을 때 총합이 정확히 출력되면 1차 완료라고 정할 수 있습니다."],"keywords":["project 프로젝트","requirement 요구사항","input 입력","process 처리","output 출력","test case 테스트 케이스","expected result 기대 결과"],"calloutTitle":"만들 것","calloutBody":"하루 지출을 입력받아 합계를 계산하고 결과를 보여 주는 아주 작은 프로그램","extras":[],"visibleExtras":3,"id":"t1-c8-p3"},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 심화","title":"프로젝트는 코드를 쓰기 전에 요구사항부터 정합니다 — 이어서 이해하기","paragraphs":["미니 프로젝트에서 가장 중요한 것은 코드를 많이 쓰는 것이 아니라 무엇을 만들지 먼저 명확히 정하는 것입니다. 입력, 처리 규칙, 출력, 성공 조건을 적어 두면 코드가 짧아지고 수정할 때도 어디를 바꿔야 할지 보입니다.","“지출 계산기를 만든다”보다 “금액 두 개를 입력하면 합계를 숫자로 출력한다”처럼 입력과 기대 결과가 포함된 요구사항이 구현하기 쉽습니다.","한 단계 더 나아가면 기능마다 “이 입력을 주면 이 결과가 나와야 한다”는 기대 결과를 먼저 정할 수 있습니다. 이것이 테스트의 가장 단순한 형태입니다. 코드를 쓰기 전에 예시 입력과 기대 출력을 두세 개 적어 두면 완성 여부를 스스로 확인할 수 있습니다.","처음부터 기능을 많이 넣으면 어느 부분에서 오류가 생겼는지 찾기 어려워집니다. 핵심 기능 하나를 완성하고 실행 확인한 뒤 다음 기능을 붙이는 식으로 작은 단위로 확장하세요. 기능 추가 후에는 기존 기능이 그대로 되는지도 다시 확인합니다.","실제 앱 개발도 요구사항 → 화면/데이터 설계 → 작은 기능 구현 → 테스트 → 수정의 반복입니다. 지금 만든 짧은 계산기 프로젝트는 규모만 작을 뿐 실제 개발의 기본 흐름을 그대로 연습하는 것입니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p4"},{"kind":"visual","eyebrow":"설계","title":"입력·처리·출력 세 칸으로 나눕니다","visual":"IPO_PROJECT","paragraphs":["문법을 몰라도 먼저 구조를 설계할 수 있습니다. 종이에 세 칸을 그려 input, process, output을 적는 것만으로도 무엇을 만들어야 하는지가 선명해집니다.","이렇게 역할을 붙이면 새 기능을 추가할 위치나 오류를 확인할 위치도 찾기 쉬워집니다.","INPUT, PROCESS, OUTPUT 세 칸을 먼저 채우면 코드를 쓰기 전에 프로그램 전체 흐름이 보입니다. 여기에 VERIFY를 하나 더 붙이면 어떤 입력으로 결과를 검증할지까지 설계할 수 있습니다.","이 방식은 큰 프로젝트에서도 그대로 확장됩니다. 화면 입력, 데이터 처리, 저장, 출력처럼 구조는 복잡해져도 ‘데이터가 어디서 들어와 어떻게 바뀌고 어디로 나가는가’를 따라가는 사고는 같습니다."],"bullets":["입력: 커피·점심·교통비","처리: 세 값을 숫자로 바꾸고 합계 계산","출력: 오늘 총지출 보여 주기","검증: 예상 결과와 실제 결과 비교","코드를 쓰기 전에 입력과 출력부터 정하면 중간 처리 규칙이 보입니다.","테스트 입력을 미리 정하면 완성 여부를 객관적으로 확인하기 쉽습니다."],"extras":[],"visibleExtras":1,"id":"t1-c8-p5"},{"kind":"concept","eyebrow":"CHAPTER 08 · 흐름 심화","title":"입력·처리·출력 세 칸으로 나눕니다 — 이어서 이해하기","paragraphs":["입력칸에 필요한 값, 처리칸에 계산 규칙, 출력칸에 보여 줄 결과를 적으면 그 순서가 거의 그대로 코드 구조가 됩니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p6"},{"kind":"example","eyebrow":"미니 프로젝트","title":"하루 지출 계산기를 완성합니다","code":"coffee = int(input(\"커피: \"))\nlunch = int(input(\"점심: \"))\ntransport = int(input(\"교통: \"))\ntotal = coffee + lunch + transport\nprint(f\"오늘 총지출: {total}원\")","paragraphs":["coffee·lunch·transport는 입력 데이터이고, total은 처리 결과입니다. 마지막 print는 output입니다.","각 줄을 입력·처리·출력 중 어디에 속하는지 표시해 보면 프로그램 전체 흐름이 한눈에 보입니다.","예제 코드를 한 번에 외우지 말고 줄마다 역할을 표시해 보세요. 첫 세 줄은 INPUT, total 계산 줄은 PROCESS, 마지막 print는 OUTPUT입니다. 이렇게 분류하면 코드가 길어져도 구조를 잃지 않습니다.","각 input을 int로 감싼 이유도 다시 확인하세요. 금액은 합산해야 하므로 문자열이 아니라 숫자 타입이 필요합니다. 이전 챕터의 타입과 형 변환이 실제 프로젝트 안에서 다시 사용되는 지점입니다."],"codeNote":"각 줄 오른쪽에 INPUT / PROCESS / OUTPUT이라고 주석을 붙여 보고, 없어도 의미를 설명할 수 있는지 확인해 보세요.","extras":[],"visibleExtras":3,"id":"t1-c8-p7"},{"kind":"practice","eyebrow":"실습 A/B · 내 프로그램으로 바꾸기","title":"예산 기능을 하나 추가하세요","practicePrompt":"① 오늘 예산을 input()으로 추가 ② remaining = budget - total 계산 ③ 남은 예산 출력 ④ 변수 이름을 의미 있게 유지","paragraphs":["기존 프로그램을 완전히 다시 쓰지 않고, 필요한 입력·처리·출력 위치에 한 줄씩 추가하는 것이 핵심입니다.","기능을 추가할 때 기존 코드 전체를 다시 쓰지 말고, 요구사항이 어느 단계에 영향을 주는지 먼저 찾습니다. 예산 입력은 INPUT, remaining 계산은 PROCESS, 남은 예산 표시는 OUTPUT에 각각 한 줄씩 추가됩니다.","이렇게 작은 변경으로 확장하는 습관은 실제 개발에서도 중요합니다. 한 번에 많은 부분을 바꾸면 오류가 생겼을 때 원인을 추적하기 어려워집니다."],"extras":[],"visibleExtras":4,"id":"t1-c8-p8","answerOnNext":true},{"id":"t1-c8-p8-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예산 기능을 하나 추가하세요 · 풀이","paragraphs":["먼저 세 지출의 합계를 구합니다. 예산에서 합계를 빼면 남은 금액이 됩니다.","예산을 10000으로 바꾸면 남은 예산은 -500입니다. 음수는 예산을 500원 넘겼다는 뜻입니다."],"code":"coffee = int(input(\"커피: \"))\nlunch = int(input(\"점심: \"))\ntransport = int(input(\"교통: \"))\ntotal = coffee + lunch + transport\nbudget = int(input(\"오늘 예산: \"))\nremaining = budget - total\nprint(f\"오늘 총지출: {total}원\")\nprint(f\"남은 예산: {remaining}원\")","codeNote":"실행 결과 또는 테스트 기준\n입력 0, 9000, 1500, 20000 →\n오늘 총지출: 10500원\n남은 예산: 9500원"},{"kind":"concept","eyebrow":"CHAPTER 08 · 실습 확장","title":"예산 기능을 하나 추가하세요 — 이어서 이해하기","paragraphs":["예산 기능을 넣을 때도 기존 지출 합계 계산은 그대로 유지되어야 합니다. 새 기능을 한 덩어리로 넣기보다 예산 입력 → 남은 금액 계산 → 출력 순으로 작게 추가하고 매 단계 실행하세요."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p9"},{"kind":"check","eyebrow":"테스트","title":"입력과 기대 결과를 미리 정하세요","paragraphs":["프로그램이 한 번 잘 됐다고 항상 맞는 것은 아닙니다. 특정 입력과 그때 기대하는 결과를 한 묶음으로 정한 것을 테스트 케이스(test case)라고 합니다.","정상값뿐 아니라 0원, 큰 금액, 숫자 대신 글자 입력처럼 가장자리 상황(edge case)도 확인해야 숨어 있는 문제를 찾을 수 있습니다.","테스트 케이스는 ‘입력값과 기대 결과의 묶음’입니다. 정상적인 값 하나만 확인하면 숨어 있는 문제를 놓칠 수 있으므로 0, 큰 값, 잘못된 형식 같은 경계 상황도 함께 보는 편이 좋습니다.","actual result가 expected result와 다르면 바로 코드 탓으로 단정하지 마세요. 기대값을 손으로 잘못 계산했거나 테스트 입력 자체가 잘못됐을 수도 있습니다. 입력·기대값·실제값 세 가지를 함께 확인해야 합니다."],"bullets":["coffee=0, lunch=9000, transport=1500 → 기대값 10500","모두 0 → 기대값 0","큰 금액 입력 → 계산 확인","‘천원’ 입력 → 어떤 오류가 나는지 기록","정상값 테스트는 기본 동작을 확인합니다.","0과 큰 값은 경계에서 계산이 깨지는지 확인합니다.","잘못된 입력은 오류가 어떤 형태로 나타나는지 학습하는 데 도움됩니다."],"question":"actual result가 expected result와 다르면 무조건 코드가 틀린 걸까요?","extras":[],"visibleExtras":1,"id":"t1-c8-p10","answerOnNext":true},{"id":"t1-c8-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"입력과 기대 결과를 미리 정하세요 · 풀이","paragraphs":["아닙니다. 코드가 틀릴 수도 있지만 expected result 자체를 잘못 계산했을 수도 있습니다. 입력·기대값·실제값을 함께 다시 확인해야 합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 확인 확장","title":"입력과 기대 결과를 미리 정하세요 — 이어서 이해하기","paragraphs":["확인문제는 정답을 빨리 맞히는 것보다 왜 그런 답이 되는지 설명하는 것이 중요합니다. 틀렸다면 어떤 전제를 잘못 이해했는지 찾아보세요.","입력값과 기대 결과를 먼저 적으면 실행 뒤 맞았는지 즉시 판단할 수 있습니다. 정상 입력뿐 아니라 0이나 큰 값처럼 경계에 가까운 입력도 하나 넣어 보면 더 좋습니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p11"},{"kind":"summary","eyebrow":"TRACK 01 마무리","title":"이제 짧은 Python 코드를 읽고 고칠 수 있습니다","paragraphs":["이제 코딩이 무엇인지 설명하고, Python 코드의 기본 실행 흐름을 읽고, 변수와 타입을 구분하고, 입력값을 숫자로 바꾸고, 오류 메시지의 핵심을 읽고, 간단한 계산 프로그램을 설계할 수 있습니다.","트랙1의 목표는 개발자가 되는 것이 아니라 ‘코딩 글을 읽다가 모르는 단어를 검색하고, 짧은 코드를 직접 바꾸고, 오류가 나면 메시지를 보고 질문할 수 있는 상태’가 되는 것입니다.","조건문·반복문·함수 같은 다음 단계 문법은 TRACK 02에서 이어서 배우면 됩니다.","트랙1을 끝냈다고 해서 모든 코드를 스스로 만들 수 있어야 하는 것은 아닙니다. 더 중요한 것은 짧은 코드를 보고 대략 무슨 일을 하는지 설명하고, 값을 조금 바꾸고, 오류가 나면 메시지를 읽고 질문할 수 있는 상태가 되는 것입니다.","앞으로 조건문·반복문·함수를 배울 때도 같은 학습 루프를 사용하세요. 개념을 짧게 읽고, 예제를 실행하고, 한 부분만 바꾸고, 결과를 예상하고, 오류를 기록합니다. 이 방식이 새로운 문법을 가장 안정적으로 자기 것으로 만드는 방법입니다."],"bullets":["코드 변경 → 실행 → 결과 확인 습관","입력 → 처리 → 출력 구조","오류 이름과 줄 번호부터 읽기","테스트 케이스로 결과 검증","변수·타입·입력·연산을 연결해 작은 프로그램을 수정할 수 있다.","오류 메시지를 보고 검색이나 AI 질문에 필요한 정보를 정리할 수 있다.","테스트 입력과 기대 결과를 이용해 프로그램을 검증할 수 있다."],"extras":[],"visibleExtras":1,"id":"t1-c8-p12"},{"kind":"concept","eyebrow":"CHAPTER 08 · 심화 정리","title":"이제 짧은 Python 코드를 읽고 고칠 수 있습니다 — 이어서 이해하기","paragraphs":["짧은 코드를 읽고, 값을 추적하고, 타입과 오류를 확인하고, 작은 기능을 추가할 수 있다면 기초가 연결된 것입니다. 다음 단계에서는 조건과 반복을 추가해 프로그램이 상황에 따라 다른 일을 하게 만듭니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p13"}],"track":1,"id":"t1-c8","remember":"입력·처리·출력 구분","practiceGoal":"예산 계산기 완성","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":1,"title":"조건문 if","pages":[{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"if 조건문","description":"조건이 참일 때 특정 코드 블록을 실행하도록 만드는 제어문입니다. 프로그램이 상황에 따라 다른 행동을 하게 만드는 가장 기본적인 분기 도구입니다.","usage":"점수, 로그인 여부, 재고 상태처럼 조건에 따라 처리 방식이 달라질 때 씁니다.","example":"예: if score >= 60: 아래 블록은 점수가 60 이상일 때만 실행됩니다."},{"term":"condition 조건","description":"True 또는 False로 판단될 수 있는 표현식입니다. 비교 연산이나 bool 값이 조건 자리에 들어갑니다.","usage":"if가 어떤 길을 선택할지 판단하는 기준으로 씁니다.","example":"예: age >= 19는 나이가 19 이상인지 검사하는 조건입니다."},{"term":"comparison 비교 연산","description":"두 값의 관계를 검사해 True 또는 False를 만드는 연산입니다. ==, !=, >, \u003c, >=, \u003c=가 대표적입니다.","usage":"숫자 크기나 문자열 일치 여부를 확인할 때 씁니다.","example":"예: password == \"1234\"는 입력된 비밀번호가 같은지 확인합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c1-p1","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「먼저 알아두면 좋은 단어」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「먼저 알아두면 좋은 단어」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「먼저 알아두면 좋은 단어」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「먼저 알아두면 좋은 단어」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「먼저 알아두면 좋은 단어」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"elif","description":"앞선 if 조건이 거짓일 때 추가 조건을 검사하는 분기입니다. 여러 구간이나 여러 상태 중 하나를 선택할 때 사용합니다.","usage":"등급, 배송비 구간, 상태 코드처럼 선택지가 여러 개일 때 씁니다.","example":"예: score >= 90이면 A, elif score >= 80이면 B처럼 이어 씁니다."},{"term":"else","description":"앞선 if/elif 조건이 모두 거짓일 때 실행되는 마지막 분기입니다. 별도 조건을 적지 않습니다.","usage":"나머지 모든 경우를 처리하고 싶을 때 씁니다.","example":"예: 성인 조건이 아니면 else에서 미성년자 안내를 출력할 수 있습니다."},{"term":"boolean logic 논리 연산","description":"and, or, not을 이용해 여러 조건을 결합하거나 반대로 만드는 규칙입니다.","usage":"두 조건을 동시에 만족시키거나 둘 중 하나만 만족해도 되는 규칙을 표현할 때 씁니다.","example":"예: age >= 19 and has_id는 두 조건이 모두 참이어야 True입니다."}],"extras":[],"visibleExtras":2,"id":"t2-c1-p2","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「코드에서 자주 만나는 표현」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「코드에서 자주 만나는 표현」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「코드에서 자주 만나는 표현」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「코드에서 자주 만나는 표현」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「코드에서 자주 만나는 표현」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-indent","kind":"concept","eyebrow":"조건문 준비","title":"콜론과 들여쓰기는 코드의 경계를 만듭니다","paragraphs":["if score >= 60: 끝의 :은 조건에 따라 실행할 묶음이 이어진다는 표시입니다.","print 앞의 스페이스 네 칸은 이 줄이 if 안이라는 뜻입니다. 마지막 print는 들여쓰기를 없애서 조건과 상관없이 실행합니다.","블록(block)은 함께 묶인 여러 줄입니다. 같은 블록에서는 들여쓰기 깊이를 맞추고 탭과 스페이스를 섞지 마세요."],"code":"temperature = 27\n\nif temperature >= 25:\n    print(\"반팔\")\n\nprint(\"오늘 옷차림 확인 끝\")","codeNote":"temperature가 27이므로 조건은 True입니다. 들여쓰기된 “반팔”이 먼저 출력되고, 마지막 print는 if 바깥이므로 항상 실행됩니다.","extras":[],"codeExplain":["1행 「temperature = 27」 — 「콜론과 들여쓰기는 코드의 경계를 만듭니다」에서 오른쪽 27을 먼저 계산하고 그 결과를 temperature에 저장합니다.","3행 「if temperature >= 25:」 — 「콜론과 들여쓰기는 코드의 경계를 만듭니다」에서 temperature >= 25을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"반팔\")」 — 「콜론과 들여쓰기는 코드의 경계를 만듭니다」에서 \"반팔\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","6행 「print(\"오늘 옷차림 확인 끝\")」 — 「콜론과 들여쓰기는 코드의 경계를 만듭니다」에서 \"오늘 옷차림 확인 끝\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 1/6","title":"조건문은 프로그램의 길을 갈라놓습니다","paragraphs":["조건문을 읽을 때는 먼저 조건식이 어떤 값을 만드는지 확인하고, 그다음 True일 때와 False일 때 각각 어느 줄로 이동하는지 화살표로 그려보는 것이 좋습니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p3","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「조건문은 프로그램의 길을 갈라놓습니다」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「조건문은 프로그램의 길을 갈라놓습니다」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「조건문은 프로그램의 길을 갈라놓습니다」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「조건문은 프로그램의 길을 갈라놓습니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「조건문은 프로그램의 길을 갈라놓습니다」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 2/6","title":"비교식은 판단 결과를 값으로 만듭니다","paragraphs":["score >= 60 같은 비교식의 결과는 문장이 아니라 bool 값 True 또는 False입니다. if는 이 bool 값을 보고 실행 경로를 결정합니다.","==는 값이 같은지 비교하는 연산자이고 =는 값을 변수에 대입하는 기호입니다. 둘을 혼동하면 의도와 전혀 다른 코드가 됩니다.","조건식을 print(score >= 60)처럼 직접 출력해 보면 어떤 입력에서 True/False가 되는지 눈으로 확인할 수 있습니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p4","code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — 「비교식은 판단 결과를 값으로 만듭니다」에서는 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 다음 반복에서는 age가 다음 값으로 바뀝니다.","2행 「print(age, age >= 18)」 — 「비교식은 판단 결과를 값으로 만듭니다」에서 age, age >= 18의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 3/6","title":"elif는 위에서부터 처음 맞는 길 하나를 고릅니다","paragraphs":["if와 여러 elif가 이어지면 Python은 위에서 아래로 조건을 검사하다가 처음 True가 된 블록 하나만 실행하고 나머지 분기는 건너뜁니다.","범위가 넓은 조건을 위에 두면 아래 조건이 영원히 실행되지 않을 수 있습니다. 점수 등급처럼 구간을 나눌 때 조건 순서가 중요한 이유입니다.","90점 이상, 80점 이상, 70점 이상처럼 높은 기준부터 낮은 기준 순으로 배치하면 읽기도 쉽고 중복 조건도 줄어듭니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p5","code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","codeExplain":["1행 「score = 85」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 오른쪽 85을 먼저 계산하고 그 결과를 score에 저장합니다.","3행 「if score >= 90:」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 score >= 90을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"A\")」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 \"A\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「elif score >= 80:」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 앞 조건이 False였을 때만 score >= 80을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","6행 「print(\"B\")」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 \"B\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「elif score >= 70:」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 앞 조건이 False였을 때만 score >= 70을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","8행 「print(\"C\")」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 \"C\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「else:」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","10행 「print(\"D\")」 — 「elif는 위에서부터 처음 맞는 길 하나를 고릅니다」에서 \"D\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 4/6","title":"and·or·not으로 현실의 규칙을 조합합니다","paragraphs":["현실의 규칙은 조건 하나로 끝나지 않는 경우가 많습니다. and는 모든 조건이 참이어야 하고, or는 하나 이상 참이면 되며, not은 참과 거짓을 뒤집습니다.","복합 조건이 길어지면 괄호를 이용해 묶음을 명확하게 하고, 중간 bool 변수를 만들어 이름을 붙이면 훨씬 읽기 쉬워집니다.","예: is_adult = age >= 19, can_enter = is_adult and has_ticket처럼 단계로 나누면 규칙 자체가 설명서처럼 보입니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p6","code":"age = 20\nhas_ticket = False\n\ncan_enter = age >= 18 and has_ticket\nprint(can_enter)","codeNote":"나이 조건은 True지만 티켓이 False라서 True and False의 결과는 False입니다.","codeExplain":["1행 「age = 20」 — 「and·or·not으로 현실의 규칙을 조합합니다」에서 오른쪽 20을 먼저 계산하고 그 결과를 age에 저장합니다.","2행 「has_ticket = False」 — 「and·or·not으로 현실의 규칙을 조합합니다」에서 has_ticket에 불리언 False를 저장해 뒤 조건식의 판단값으로 사용합니다.","4행 「can_enter = age >= 18 and has_ticket」 — 「and·or·not으로 현실의 규칙을 조합합니다」에서 오른쪽 age >= 18 and has_ticket을 먼저 계산하고 그 결과를 can_enter에 저장합니다.","5행 「print(can_enter)」 — 「and·or·not으로 현실의 규칙을 조합합니다」에서 can_enter의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 5/6","title":"중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다","paragraphs":["if 안에 또 if를 넣는 중첩은 필요할 때도 있지만 깊어질수록 현재 어떤 조건 아래에 있는지 추적하기 어려워집니다.","가능하면 빠르게 종료하거나 조건을 합치거나 의미 있는 bool 변수로 나누어 들여쓰기 깊이를 줄이는 편이 좋습니다.","초보 단계에서는 기능이 맞는 것이 먼저지만, 같은 동작이라면 눈으로 한 번에 흐름이 보이는 구조를 선택하는 습관을 들이세요."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p7","code":"is_logged_in = True\nis_admin = False\n\nif is_logged_in and is_admin:\n    print(\"관리자 화면\")\nelse:\n    print(\"일반 화면\")","codeNote":"두 조건을 한 번에 읽을 수 있어서 if 안에 또 if를 넣는 것보다 흐름이 단순합니다.","codeExplain":["1행 「is_logged_in = True」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 is_logged_in에 불리언 True를 저장해 뒤 조건식의 판단값으로 사용합니다.","2행 「is_admin = False」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 is_admin에 불리언 False를 저장해 뒤 조건식의 판단값으로 사용합니다.","4행 「if is_logged_in and is_admin:」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 is_logged_in and is_admin을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","5행 「print(\"관리자 화면\")」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 \"관리자 화면\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","6행 「else:」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","7행 「print(\"일반 화면\")」 — 「중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다」에서 \"일반 화면\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 6/6","title":"경계값을 테스트해야 조건문이 믿을 만해집니다","paragraphs":["조건문은 경계 바로 앞과 바로 뒤에서 실수가 자주 생깁니다. >=와 >, \u003c=와 \u003c의 차이는 평소 입력에서는 잘 드러나지 않고 기준값에서 드러납니다.","60점 이상 합격이라면 59, 60, 61을 테스트하고, 나이 19세 이상이라면 18, 19, 20을 확인하는 식으로 경계값을 의도적으로 넣어 보세요.","이 습관은 이후 테스트를 배울 때 그대로 이어집니다. 조건이 많아질수록 정상값보다 경계값이 더 좋은 버그 탐지 입력이 됩니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p8","code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — 「경계값을 테스트해야 조건문이 믿을 만해집니다」에서는 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 다음 반복에서는 age가 다음 값으로 바뀝니다.","2행 「print(age, age >= 18)」 — 「경계값을 테스트해야 조건문이 믿을 만해집니다」에서 age, age >= 18의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"조건문 if의 전체 흐름","paragraphs":["조건문 if에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"TOP_TO_BOTTOM","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c1-p9","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「조건문 if의 전체 흐름」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「조건문 if의 전체 흐름」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「조건문 if의 전체 흐름」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「조건문 if의 전체 흐름」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「조건문 if의 전체 흐름」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"조건문 if를 하나의 코드로 연결합니다","paragraphs":[],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","extras":[],"visibleExtras":2,"id":"t2-c1-p10","codeExplain":["1행 「age = 15」 — 「조건문 if를 하나의 코드로 연결합니다」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「조건문 if를 하나의 코드로 연결합니다」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「조건문 if를 하나의 코드로 연결합니다」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「조건문 if를 하나의 코드로 연결합니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「조건문 if를 하나의 코드로 연결합니다」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"조건문 if를 직접 바꾸고 확장합니다","paragraphs":["조건식은 말로 된 규칙을 코드로 바꾸는 과정입니다. “12세 이상”이면 먼저 12가 포함되는지 생각하고, 그 뜻에 맞는 비교 기호를 고릅니다.","코드를 완성한 뒤에는 조건에 딱 걸치는 값과 바로 앞뒤 값을 모두 넣어 보세요. 경계값에서 예상한 길로 들어가면 조건을 제대로 만든 것입니다.","if와 elif가 여러 개라면 위에서부터 한 줄씩 검사한다는 순서를 기억하세요. 앞 조건이 True가 된 순간 그 아래 다른 elif는 더 이상 검사하지 않습니다."],"code":"score = 80\nattendance = 80\n\nif ____ and ____:\n    print(\"A\")\nelif ____ and ____:\n    print(\"B\")\nelif ____ and ____:\n    print(\"C\")\nelse:\n    print(\"D\")","practicePrompt":"점수를 직접 바꾸며 69, 70, 79, 80, 89, 90에서 결과를 확인하세요. 그다음 “출석률 80% 이상” 조건을 and로 추가해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c1-p11","answerOnNext":true,"codeExplain":["1행 「score = 80」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 오른쪽 80을 먼저 계산하고 그 결과를 score에 저장합니다.","2행 「attendance = 80」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 오른쪽 80을 먼저 계산하고 그 결과를 attendance에 저장합니다.","4행 「if ____ and ____:」 — 「조건문 if를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","5행 「print(\"A\")」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 \"A\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","6행 「elif ____ and ____:」 — 「조건문 if를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","7행 「print(\"B\")」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 \"B\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","8행 「elif ____ and ____:」 — 「조건문 if를 직접 바꾸고 확장합니다」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","9행 「print(\"C\")」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 \"C\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","10행 「else:」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","11행 「print(\"D\")」 — 「조건문 if를 직접 바꾸고 확장합니다」에서 \"D\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c1-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"조건문 if를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["이 예시에서는 출석률 80% 미만이면 D라는 추가 규칙을 정했습니다. 규칙이 다르면 else의 처리도 달라져야 합니다.","and는 점수 기준과 출석률 기준을 모두 만족할 때만 해당 등급을 선택하게 합니다.","점수 80, 출석률 80은 첫 A 조건에서 False, 다음 B 조건에서 True가 되어 B가 출력됩니다.","89·90과 출석률 79·80을 각각 바꾸어 기준 바로 앞과 같은 값에서 결과를 비교하세요."],"code":"score = 80\nattendance = 80\nif score >= 90 and attendance >= 80:\n    print(\"A\")\nelif score >= 80 and attendance >= 80:\n    print(\"B\")\nelif score >= 70 and attendance >= 80:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"실행 결과 또는 테스트 기준\n출석률 80일 때: 69→D, 70→C, 79→C, 80→B, 89→B, 90→A\n출석률 79일 때: 같은 점수 모두 D","extras":[],"codeExplain":["1행 「score = 80」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 80을 먼저 계산하고 그 결과를 score에 저장합니다.","2행 「attendance = 80」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 오른쪽 80을 먼저 계산하고 그 결과를 attendance에 저장합니다.","3행 「if score >= 90 and attendance >= 80:」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 score >= 90 and attendance >= 80을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"A\")」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 \"A\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「elif score >= 80 and attendance >= 80:」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 앞 조건이 False였을 때만 score >= 80 and attendance >= 80을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","6행 「print(\"B\")」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 \"B\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「elif score >= 70 and attendance >= 80:」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 앞 조건이 False였을 때만 score >= 70 and attendance >= 80을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","8행 「print(\"C\")」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 \"C\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「else:」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","10행 「print(\"D\")」 — 「조건문 if를 직접 바꾸고 확장합니다 · 풀이」에서 \"D\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"kind":"check","eyebrow":"확인 문제","title":"조건문 if 핵심을 확인합니다","paragraphs":[],"question":"score가 95일 때 if score >= 60을 먼저 쓰고 그 아래 elif score >= 90을 쓰면 왜 90점 분기가 실행되지 않을까요?","extras":[],"visibleExtras":3,"id":"t2-c1-p12","answerOnNext":true,"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「조건문 if 핵심을 확인합니다」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「조건문 if 핵심을 확인합니다」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「조건문 if 핵심을 확인합니다」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「조건문 if 핵심을 확인합니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「조건문 if 핵심을 확인합니다」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"조건문 if 핵심을 확인합니다 · 풀이","paragraphs":["if score >= 60이 먼저 True가 되어 그 블록이 실행되면 같은 if/elif 묶음의 나머지 분기는 검사하지 않기 때문입니다. 구간 분기는 보통 더 구체적이거나 높은 기준부터 배치합니다."],"extras":[],"code":"stock = 0\n\nif stock == 0:\n    print(\"품절\")\nelse:\n    print(\"구매 가능\")","codeNote":"==는 “같은가?”를 묻습니다. stock이 0과 같아서 “품절”이 출력됩니다.","codeExplain":["1행 「stock = 0」 — 「조건문 if 핵심을 확인합니다 · 풀이」에서 stock을 0으로 시작합니다. 아직 누적된 값이 없는 초기 상태입니다.","3행 「if stock == 0:」 — 「조건문 if 핵심을 확인합니다 · 풀이」에서 stock == 0을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"품절\")」 — 「조건문 if 핵심을 확인합니다 · 풀이」에서 \"품절\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「조건문 if 핵심을 확인합니다 · 풀이」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"구매 가능\")」 — 「조건문 if 핵심을 확인합니다 · 풀이」에서 \"구매 가능\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x01","kind":"concept","title":"if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다","eyebrow":"초보 확장 · 개념","paragraphs":["조건문은 횡단보도와 비슷합니다. 초록불이면 건너고, 빨간불이면 기다립니다. 코드에서는 “이 조건이 맞나?”처럼 True 또는 False로 답할 수 있는 질문을 만듭니다.","if 뒤에는 질문이 옵니다. 질문이 True이면 들여쓰기된 코드를 실행하고, False이면 그 부분을 건너뜁니다.","age >= 13을 보면 기호부터 겁먹지 말고 “age가 13 이상인가?”라고 한국어로 읽으세요."],"keywords":["if","조건","True","False"],"calloutTitle":"초보 규칙","calloutBody":"조건식을 보면 먼저 한국어 질문으로 바꿔 읽습니다.","extras":[],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 「if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x02","kind":"example","title":"코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다","eyebrow":"초보 확장 · 예제","paragraphs":["age에 15를 넣고 13 이상인지 확인합니다. 15는 13 이상이므로 조건은 True입니다.","콜론(:) 뒤에서 들여쓰기된 print는 “조건이 맞을 때만 실행되는 줄”입니다.","실행 전에 먼저 True일지 False일지 말한 뒤 결과를 확인해 보세요."],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","bullets":["age = 15 → age에 15 저장","age >= 13 → True","들여쓰기된 print 실행","마지막 print는 if 밖이라 항상 실행"],"extras":[],"codeExplain":["1행 「age = 15」 — 「코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다」에서 오른쪽 15을 먼저 계산하고 그 결과를 age에 저장합니다.","3행 「if age >= 13:」 — 「코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다」에서 age >= 13을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"청소년 이상\")」 — 「코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다」에서 \"청소년 이상\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「else:」 — 「코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","6행 「print(\"어린이\")」 — 「코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다」에서 \"어린이\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x03","kind":"concept","title":">, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":[">는 “더 크다”, >=는 “크거나 같다”입니다. 그래서 18 > 18은 False지만 18 >= 18은 True입니다.","==는 “같은가?”를 묻는 비교입니다. = 하나는 값을 저장하고, == 두 개는 같은지 묻습니다.","!=는 “같지 않은가?”입니다. password != \"1234\"는 비밀번호가 1234가 아닌지를 묻습니다."],"bullets":["= : 값을 저장","== : 같은지 비교","!= : 다른지 비교","> / \u003c : 더 큰지·작은지",">= / \u003c= : 같은 경우까지 포함"],"extras":[],"code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — 「>, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다」에서는 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 다음 반복에서는 age가 다음 값으로 바뀝니다.","2행 「print(age, age >= 18)」 — 「>, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다」에서 age, age >= 18의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x04","kind":"example","title":"18세 경계값으로 >와 >= 차이를 확인합니다","eyebrow":"초보 확장 · 예제","paragraphs":["나이 제한이 “18세 이상”이면 18도 포함해야 하므로 age >= 18이 맞습니다.","age > 18이라고 쓰면 18세는 탈락합니다. 문법 오류는 아니지만 규칙을 잘못 구현한 것입니다.","기준 숫자 바로 아래·같음·바로 위 값을 넣어 확인하는 습관을 들이세요."],"code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","extras":[],"codeExplain":["1행 「for age in [17, 18, 19]:」 — 「18세 경계값으로 >와 >= 차이를 확인합니다」에서는 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 다음 반복에서는 age가 다음 값으로 바뀝니다.","2행 「print(age, age >= 18)」 — 「18세 경계값으로 >와 >= 차이를 확인합니다」에서 age, age >= 18의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x05","kind":"concept","title":"if · elif · else는 여러 길 중 딱 한 길을 고릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["if는 첫 번째 질문입니다. 틀리면 elif로 넘어가 다음 질문을 합니다. 앞 조건이 이미 맞았다면 뒤의 elif는 보지 않습니다.","else는 “앞의 모든 조건이 아니면”이라는 마지막 길입니다. else 뒤에는 조건을 쓰지 않습니다.","등급처럼 여러 범위를 나눌 때는 높은 기준부터 아래로 내려오면 읽기 쉽습니다."],"extras":[],"code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","codeExplain":["1행 「score = 85」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 오른쪽 85을 먼저 계산하고 그 결과를 score에 저장합니다.","3행 「if score >= 90:」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 score >= 90을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"A\")」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 \"A\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「elif score >= 80:」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 앞 조건이 False였을 때만 score >= 80을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","6행 「print(\"B\")」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 \"B\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「elif score >= 70:」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 앞 조건이 False였을 때만 score >= 70을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","8행 「print(\"C\")」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 \"C\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","9행 「else:」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","10행 「print(\"D\")」 — 「if · elif · else는 여러 길 중 딱 한 길을 고릅니다」에서 \"D\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x06","kind":"example","title":"점수 등급을 위에서 아래로 읽어 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["score가 85이면 90 이상은 False라서 다음 elif로 갑니다. 80 이상은 True라서 B를 고르고 끝납니다.","그 뒤 70 이상 조건은 이미 한 길을 골랐으므로 보지 않습니다.","조건 순서는 결과를 바꿀 수 있습니다. 낮은 기준을 먼저 두지 않도록 주의하세요."],"code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","extras":[],"codeExplain":["1행 「score = 85」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 오른쪽 85을 먼저 계산하고 그 결과를 score에 저장합니다.","3행 「if score >= 90:」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 score >= 90을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"A\")」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 \"A\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「elif score >= 80:」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 앞 조건이 False였을 때만 score >= 80을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","6행 「print(\"B\")」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 \"B\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「elif score >= 70:」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 앞 조건이 False였을 때만 score >= 70을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","8행 「print(\"C\")」 — 「점수 등급을 위에서 아래로 읽어 봅니다」에서 \"C\"의 현재 결과를 화면에 보여 니다.","3행 「if temperature >= 25:」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 temperature >= 25을 판단합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 건너뜁니다.","4행 「print(\"반팔\")」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 \"반팔\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","5행 「elif temperature >= 15:」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 앞 조건이 False였을 때만 temperature >= 15을 이어서 검사합니다. 여기서 True가 되면 뒤 조건은 보지 않습니다.","6행 「print(\"얇은 겉옷\")」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 \"얇은 겉옷\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","7행 「else:」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","8행 「print(\"두꺼운 겉옷\")」 — 「온도에 따라 옷차림을 정해 보세요 · 아주 쉬운 풀이」에서 \"두꺼운 겉옷\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x09","kind":"practice","title":"영화 관람 나이 제한을 경계값까지 맞춰 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["12세 미만은 관람 불가, 12세 이상은 관람 가능입니다. 11, 12, 13을 테스트합니다.","“12세 이상”이라는 말을 비교 연산자로 정확하게 옮기는 것이 목표입니다."],"practicePrompt":"age가 12 이상이면 “관람 가능”, 아니면 “관람 불가”를 출력하고 11, 12, 13을 모두 테스트하세요.","answerOnNext":true,"extras":[],"code":"for age in [11, 12, 13]:\n    if ____:\n        print(age, \"관람 가능\")\n    else:\n        print(age, \"관람 불가\")","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「for age in [11, 12, 13]:」 — 「영화 관람 나이 제한을 경계값까지 맞춰 보세요」에서는 [11, 12, 13]에서 값을 하나씩 꺼내 age에 넣습니다. 다음 반복에서는 age가 다음 값으로 바뀝니다.","2행 「if ____:」 — 「영화 관람 나이 제한을 경계값까지 맞춰 보세요」의 핵심 빈칸입니다. 문제 문장의 조건이나 계산식을 Python 표현으로 바꾸어 넣습니다.","3행 「print(age, \"관람 가능\")」 — 「영화 관람 나이 제한을 경계값까지 맞춰 보세요」에서 age, \"관람 가능\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다.","4행 「else:」 — 「영화 관람 나이 제한을 경계값까지 맞춰 보세요」에서 앞의 모든 조건이 False일 때 선택되는 마지막 경로입니다.","5행 「print(age, \"관람 불가\")」 — 「영화 관람 나이 제한을 경계값까지 맞춰 보세요」에서 age, \"관람 불가\"의 현재 결과를 화면에 보여 줍니다. 이 출력으로 계산이나 분기가 맞는지 확인합니다."]},{"id":"t2-c1-x10","kind":"solution","title":"영화 관람 나이 제한을 경계값까지 맞춰 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["“이상”에는 같은 값도 포함되므로 >=를 사용합니다.","12 > 12는 False이므로 >를 쓰면 12세가 잘못 탈락합니다.",
