tring은 여러 변수 값을 자연스럽게 문장에 넣을 때 편리합니다. 문자열 앞에 f를 붙이고 중괄호 안에 변수 이름이나 간단한 표현식을 적으면 해당 값이 문자열 안에 들어갑니다."],"extras":[],"visibleExtras":3,"id":"t1-c5-p8"},{"kind":"concept","eyebrow":"CHAPTER 05 · 예제 확장","title":"입력받은 나이로 다음 나이를 계산합니다 — 이어서 이해하기","paragraphs":["\"37\"과 37은 보기에는 비슷하지만 하나는 문자열이고 하나는 정수입니다. 다음 나이를 계산하려면 먼저 정수로 변환해야 합니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p9"},{"kind":"practice","eyebrow":"실습 A/B · 입력받는 계산기","title":"숫자 입력을 계산에 사용해 보세요","practicePrompt":"① 숫자 두 개를 input()으로 받기 ② int로 변환해 더하기 ③ 결과 출력 ④ int를 일부러 빼고 결과가 어떻게 달라지는지 확인","code":"a = int(input(\"첫 수: \"))\nb = int(input(\"둘째 수: \"))\nprint(a + b)","paragraphs":["int를 빼고 문자열 두 개를 +하면 숫자 덧셈이 아니라 문자열 연결이 일어납니다. 이 차이를 직접 경험해 보면 ‘입력은 문자열’이라는 사실이 훨씬 오래 기억됩니다.","실습할 때 10과 5뿐 아니라 0, 음수, 큰 수 등 여러 값을 넣어 보세요. 입력값이 바뀌어도 프로그램의 구조는 그대로 유지되어야 합니다."],"extras":[],"visibleExtras":4,"id":"t1-c5-p10","answerOnNext":true},{"id":"t1-c5-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"숫자 입력을 계산에 사용해 보세요 · 풀이","paragraphs":["input이 받은 \"10\"과 \"5\"는 문자열입니다. int가 각각 10과 5로 바꿉니다.","두 줄 모두 int를 빼면 문자열 연결 결과 105가 출력됩니다. 한쪽만 빼면 문자열과 숫자를 더해서 TypeError가 발생합니다."],"code":"a = int(input(\"첫 수: \"))\nb = int(input(\"둘째 수: \"))\nprint(a + b)","codeNote":"실행 결과 또는 테스트 기준\n입력 10, 5 → 출력 15"},{"kind":"check","eyebrow":"확인 문제","title":"입력과 형 변환","question":"x = input(\"숫자: \") 뒤에 7을 입력했습니다. x의 타입은 무엇이고, x + 3을 계산하려면 무엇이 필요할까요?","paragraphs":["x + 3에서 x가 str이라면 TypeError가 발생할 수 있습니다. 반대로 int(\"사과\")처럼 문자열을 숫자로 바꾸려고 했지만 내용이 숫자가 아니면 ValueError가 발생합니다. 둘 다 ‘입력 문제’처럼 보이지만 원인 종류가 다릅니다.","오류 이름을 정확히 구분하면 검색이나 AI 질문도 더 구체적으로 할 수 있습니다. ‘Python input 숫자 계산 안 됨’보다 ‘input 결과 str이라 int 변환 후 ValueError’라고 설명하는 편이 훨씬 유용합니다."],"extras":[],"visibleExtras":4,"id":"t1-c5-p11","answerOnNext":true},{"id":"t1-c5-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"입력과 형 변환 · 풀이","paragraphs":["x는 str입니다. 숫자 계산을 하려면 int(x) 또는 상황에 따라 float(x)로 변환해야 합니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 05 · 확인 확장","title":"입력과 형 변환 — 이어서 이해하기","paragraphs":["int(\"37\")은 가능하지만 int(\"서른일곱\")은 바로 변환할 수 없습니다. 변환 함수는 모든 문자열을 자동으로 숫자로 이해하는 도구가 아닙니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p12"},{"kind":"summary","eyebrow":"Chapter 5 정리","title":"입력은 타입까지 확인합니다","paragraphs":["프로그램은 입력을 받고, 처리하고, 결과를 출력합니다. input()의 결과는 문자열이므로 숫자 계산이 필요하면 int()나 float()로 변환합니다.","입력값을 받은 즉시 필요한 형식으로 정리해 두면 뒤의 코드가 단순해집니다. 잘못된 값은 변환 과정에서 ValueError를 일으킬 수 있다는 점도 기억하세요.","다음 챕터에서는 이런 오류 메시지를 읽고 원인을 좁히는 디버깅 방법을 배웁니다.","입력을 다룰 때는 값 자체뿐 아니라 타입과 형식을 함께 봅니다. 프로그램 내부로 들어온 값이 이후 계산이나 출력에 맞는 형태인지 확인하는 습관은 매우 중요합니다.","다음 챕터에서는 변환 실패나 잘못된 변수 이름처럼 실제로 자주 만나는 오류를 읽는 방법을 배웁니다. 입력과 타입을 이해해 두면 오류 메시지의 의미도 더 잘 보이기 시작합니다."],"bullets":["input() → str","계산 전 필요한 타입으로 변환","변환 실패도 정상적으로 만날 수 있는 오류","입력→처리→출력 구조로 생각하기","input()은 사용자와 프로그램 사이의 경계다.","외부 입력은 필요한 타입으로 정리한 뒤 사용한다.","TypeError와 ValueError의 차이를 상황과 함께 본다."],"extras":[],"visibleExtras":2,"id":"t1-c5-p13"},{"kind":"concept","eyebrow":"CHAPTER 05 · 심화 정리","title":"입력은 타입까지 확인합니다 — 한 단계 더","paragraphs":["외부 입력을 내부 계산에 바로 쓰지 않고 검증과 변환을 거치는 습관은 실제 앱에서도 매우 중요합니다. 작은 예제에서 이 흐름을 익히면 이후 폼 입력이나 API 데이터 처리로 그대로 확장됩니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p14"}],"track":1,"id":"t1-c5","remember":"input은 str, int/float는 변환","practiceGoal":"문자열 연결과 숫자 합산 비교","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":6,"title":"오류와 디버깅","pages":[{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"error 오류","description":"프로그램이 기대한 대로 실행되지 않거나 더 진행할 수 없는 문제를 넓게 부르는 말입니다. 오류 메시지는 원인을 찾기 위한 단서이므로 숨기기보다 읽는 습관이 중요합니다.","usage":"프로그램 문제 상황을 일반적으로 설명할 때 사용합니다.","example":"예: 변수 이름을 잘못 쓰거나 문법을 틀리면 error가 발생할 수 있습니다."},{"term":"exception 예외","description":"Python 실행 중 발생하는 특정 종류의 오류 객체를 말합니다. ValueError, TypeError, NameError처럼 예외 종류가 원인 범주를 알려 줍니다.","usage":"실행 중 발생한 문제 유형을 구체적으로 구분할 때 씁니다.","example":"예: 10 + \"5\"는 TypeError 예외를 만들 수 있습니다."},{"term":"debugging 디버깅","description":"문제 증상을 재현하고 원인을 좁힌 뒤 코드를 수정하고 다시 확인하는 과정입니다. 한 번에 여러 곳을 고치기보다 작은 가설을 하나씩 검증하는 것이 핵심입니다.","usage":"버그나 예상과 다른 결과를 찾아 고칠 때 사용합니다.","example":"예: 변수 타입을 print(type(...))로 확인한 뒤 한 줄만 수정하고 재실행합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c6-p1"},{"kind":"glossary","eyebrow":"CHAPTER 06 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"traceback 트레이스백","description":"예외가 발생하기까지 어떤 파일과 함수, 줄을 거쳐 왔는지 보여 주는 실행 경로 정보입니다. 초보자는 우선 마지막 오류 이름과 내 코드의 줄 번호부터 읽으면 됩니다.","usage":"오류가 어디에서 발생했는지 위치와 호출 경로를 찾을 때 사용합니다.","example":"예: traceback의 마지막 부분에서 TypeError와 문제 줄을 확인합니다."},{"term":"line number 줄 번호","description":"소스 코드에서 특정 줄의 위치를 나타내는 번호입니다. 오류 메시지가 알려 주는 줄 번호는 조사 범위를 빠르게 줄이는 데 도움이 됩니다.","usage":"문제가 난 코드를 빠르게 찾아갈 때 사용합니다.","example":"예: line 12라고 나오면 먼저 12번째 줄과 그 주변 값을 확인합니다."},{"term":"hypothesis 가설","description":"문제 원인에 대해 현재 증거를 바탕으로 세우는 임시 설명입니다. 디버깅에서는 가설을 하나 세운 뒤 가장 작은 실험으로 맞는지 확인합니다.","usage":"무작정 수정하지 않고 원인을 체계적으로 검증할 때 사용합니다.","example":"예: ‘price가 str이라 계산이 이상한 것 같다’라는 가설을 세우고 type(price)를 확인합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c6-p2"},{"kind":"concept","eyebrow":"CHAPTER 06 · 문제 찾기","title":"오류는 ‘틀렸다’가 아니라 단서입니다","paragraphs":["코딩에서는 오류가 자주 발생합니다. 오류 메시지는 컴퓨터가 화내는 문장이 아니라 ‘여기에서 이런 이유로 더 진행할 수 없다’고 알려 주는 보고서에 가깝습니다.","오류 원인을 찾고 고치는 과정을 디버깅(debugging)이라고 합니다. 숙련된 개발자도 오류를 없애는 사람이 아니라, 오류를 빠르게 읽고 범위를 좁히는 능력을 사용합니다.","처음에는 오류 이름, 메시지, 줄 번호, 그 줄의 실제 값과 타입, 최근 변경 내용 순서로 확인하면 좋습니다.","Traceback은 오류가 발생하기까지 어떤 코드가 실행되었는지 보여 주는 기록입니다. 처음에는 전체 내용을 다 이해하려 하지 말고, 맨 아래쪽의 오류 이름과 메시지, 그리고 내 코드 파일과 줄 번호부터 확인하면 됩니다.","디버깅은 ‘감으로 여기저기 고치는 것’과 다릅니다. 현재 증상을 정확히 재현하고, 가능한 원인을 하나 세우고, 가장 작은 수정을 한 뒤 같은 조건에서 다시 실행해 확인하는 과정입니다."],"keywords":["error 오류","exception 예외","debugging 디버깅","traceback 실행 경로","line number 줄 번호","error message 오류 메시지"],"calloutTitle":"읽는 순서","calloutBody":"① 오류 이름 ② 메시지 ③ 내 코드 줄 번호 ④ 실제 값과 타입 ⑤ 최근 변경","extras":[],"visibleExtras":3,"id":"t1-c6-p3"},{"kind":"concept","eyebrow":"CHAPTER 06 · 개념 심화","title":"오류는 ‘틀렸다’가 아니라 단서입니다 — 이어서 이해하기","paragraphs":["디버깅은 틀린 코드를 감으로 고치는 작업이 아니라, 관찰한 증거로 가능한 원인을 좁히는 과정입니다. 오류 이름, 발생한 줄, 직전의 입력과 값은 모두 원인을 찾는 단서입니다.","오류가 발생했다는 사실보다 어떤 오류 이름이 나왔고 어느 줄에서 발생했는지가 더 중요합니다. 메시지는 프로그램이 제공하는 첫 번째 진단 자료입니다.","traceback은 오류가 최종적으로 발생한 위치뿐 아니라 어떤 호출 흐름을 거쳐 그 위치까지 왔는지를 보여 줍니다. 지금 단계에서는 가장 아래쪽 오류 이름과 내가 작성한 코드 줄부터 보고, 나중에는 위쪽 호출 흐름까지 읽는 습관으로 확장하면 됩니다.","한 번에 여러 줄을 고치면 문제가 해결돼도 무엇이 원인이었는지 알기 어렵고, 새 오류가 생겼을 때 되돌리기도 힘듭니다. 재현 → 가설 하나 → 최소 수정 → 다시 실행의 순서를 지키면 작은 코드에서도 원인이 명확해집니다.","실무에서는 로그, 테스트, 디버거 같은 도구를 추가로 쓰지만 사고방식은 같습니다. 증상을 정확히 재현하고, 원인을 좁히며, 가장 작은 수정으로 가설을 확인하는 습관이 디버깅 실력의 중심입니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p4"},{"kind":"visual","eyebrow":"대표 오류 4가지","title":"오류 이름으로 조사 범위를 좁히세요","visual":"ERROR_MAP","paragraphs":["오류 이름만으로 정확한 원인을 모두 알 수는 없지만, 어디부터 봐야 할지는 크게 좁힐 수 있습니다.","오류 이름은 문제의 범주를 알려 주는 출발점입니다. SyntaxError라면 코드 모양과 문법, NameError라면 이름과 실행 순서, TypeError라면 값의 종류, ValueError라면 값 내용과 변환 가능성을 먼저 봅니다.","같은 오류 이름이라도 실제 원인은 여러 가지일 수 있습니다. 그래서 오류 이름만 보고 끝내지 말고 메시지와 문제 줄의 실제 코드를 함께 읽어야 합니다."],"bullets":["SyntaxError → 문법·따옴표·괄호 확인","NameError → 변수 정의·철자·실행 순서 확인","TypeError → 서로 섞인 값의 타입 확인","ValueError → 타입은 맞지만 값의 형식이 변환 가능한지 확인","오류 이름은 범위를 좁히는 힌트이지 완전한 정답은 아닙니다.","오류 메시지와 문제 줄의 실제 값을 함께 확인합니다."],"extras":[],"visibleExtras":2,"id":"t1-c6-p5"},{"kind":"concept","eyebrow":"CHAPTER 06 · 흐름 심화","title":"오류 이름으로 조사 범위를 좁히세요 — 이어서 이해하기","paragraphs":["디버깅은 감으로 코드를 고치는 일이 아니라 증상과 증거를 보고 작은 가설을 검증하는 과정입니다. 한 번에 한 가지씩 바꾸는 원칙을 지키세요.","NameError는 이름, TypeError는 타입과 연산, ValueError는 값의 형식처럼 오류 종류마다 먼저 볼 범위가 다릅니다. 이름을 읽으면 모든 코드를 무작정 의심할 필요가 없습니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p6"},{"kind":"example","eyebrow":"예제","title":"오류는 한 번에 하나씩 재현하세요","code":"print(user_name)","paragraphs":["오류 하나당 새 파일 또는 빈 실행 칸에서 실험하세요. 아래는 변수를 정의하지 않은 NameError 예제입니다.","문법 오류가 파일에 하나라도 있으면 파일 전체를 실행하기 전에 구문 분석에서 멈출 수 있습니다. 네 오류를 한 코드 블록에 넣으면 서로 독립적으로 실험하기 어렵습니다."],"codeNote":"새 파일에서 이 한 줄만 실행 → NameError\n수정: 앞줄에 user_name = \"승원\" 추가","extras":[{"title":"SyntaxError를 따로 실험","body":"print(\"안녕) → 닫는 따옴표가 없습니다. print(\"안녕\")으로 수정합니다."},{"title":"TypeError를 따로 실험","body":"print(10 + \"5\") → 정수와 문자열을 더했습니다. 숫자 계산 의도라면 print(10 + int(\"5\"))로 수정합니다."},{"title":"ValueError를 따로 실험","body":"int(\"사과\") → 숫자로 읽을 수 없는 내용입니다. \"5\" 등 유효한 숫자 문자열을 입력해야 합니다."}],"visibleExtras":3,"id":"t1-c6-p7"},{"kind":"concept","eyebrow":"CHAPTER 06 · 예제 확장","title":"오류는 한 번에 하나씩 재현하세요 — 이어서 이해하기","paragraphs":["재현 가능한 오류는 입력과 실행 순서를 고정할 수 있기 때문에 수정 전후를 비교하기 쉽습니다. 가끔만 발생하는 문제보다 원인 확인이 훨씬 수월합니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p8"},{"kind":"practice","eyebrow":"실습 A/B · 일부러 오류 만들기","title":"관찰 → 가설 → 최소 수정 → 재검증","practicePrompt":"① 정상 코드를 실행 ② 한 부분만 일부러 고장 내기 ③ 오류 이름과 줄 번호 기록 ④ 가장 작은 수정으로 복구 ⑤ 같은 입력으로 다시 실행","calloutTitle":"디버깅 4단계","calloutBody":"증상 확인 → 원인 가설 → 최소 수정 → 다시 실행해 검증","paragraphs":["좋은 디버깅 기록은 긴 보고서가 아니라 짧은 가설 메모면 충분합니다. 예: ‘user_age가 정의되기 전에 사용된 것 같다 → 정의 위치 확인 → 한 줄 위로 이동 → 같은 입력으로 재실행’. 이런 기록은 같은 실수를 반복하는 것을 줄여 줍니다.","문제가 재현되지 않으면 고쳤다고 판단하기 어렵습니다. 입력값, 실행 순서, 사용한 코드가 같은지 맞춘 뒤 다시 테스트하는 것이 중요합니다."],"extras":[],"visibleExtras":3,"id":"t1-c6-p9","answerOnNext":true},{"id":"t1-c6-p9-solution","kind":"solution","eyebrow":"정답과 풀이","title":"관찰 → 가설 → 최소 수정 → 재검증 · 풀이","paragraphs":["수정 전 print(user_name)만 새 파일에서 실행하면 user_name을 찾지 못해 NameError가 발생합니다.","따옴표 없는 user_name은 이름을 찾아 값을 읽으라는 뜻입니다. user_name = \"승원\"으로 먼저 정의하면 해결됩니다.","print(\"user_name\")은 오류를 고쳐 이름 값을 보여 주는 것이 아니라 글자 user_name 자체를 출력합니다."],"code":"user_name = \"승원\"\nprint(user_name)","codeNote":"실행 결과 또는 테스트 기준\n승원"},{"kind":"concept","eyebrow":"CHAPTER 06 · 실습 확장","title":"관찰 → 가설 → 최소 수정 → 재검증 — 이어서 이해하기","paragraphs":["“코드 전체가 이상하다”는 가설은 확인하기 어렵습니다. “age가 문자열이라 + 1에서 TypeError가 난다”처럼 특정 값·타입·줄을 포함해야 한 번의 수정으로 확인할 수 있습니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p10"},{"kind":"check","eyebrow":"확인 문제","title":"오류 이름으로 범위를 좁혀 봅니다","question":"print(user_age)에서 NameError가 났습니다. 무엇부터 확인해야 할까요?","paragraphs":["NameError를 만났을 때는 변수 이름을 새로 만들기 전에 먼저 철자와 정의 위치를 확인하세요. 비슷한 이름을 또 만들면 문제를 숨길 수 있습니다.","특히 대소문자도 구분됩니다. userAge와 user_age는 완전히 다른 이름입니다. 복사·붙여넣기나 자동완성 없이 직접 입력할 때 이런 차이로 오류가 자주 발생합니다."],"extras":[],"visibleExtras":5,"id":"t1-c6-p11","answerOnNext":true},{"id":"t1-c6-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"오류 이름으로 범위를 좁혀 봅니다 · 풀이","paragraphs":["user_age 변수를 앞에서 만든 적이 있는지, 철자가 정확한지, 변수를 만드는 줄보다 먼저 사용한 것은 아닌지 순서대로 확인합니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 06 · 확인 확장","title":"오류 이름으로 범위를 좁혀 봅니다 — 이어서 이해하기","paragraphs":["오류 이름을 본 뒤 관련된 변수와 연산만 확인하면 조사 범위가 작아집니다. 범위를 줄이는 능력이 디버깅 속도를 결정합니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p12"},{"kind":"summary","eyebrow":"Chapter 6 정리","title":"오류를 읽는 순서를 습관화하세요","paragraphs":["오류는 디버깅을 위한 단서입니다. SyntaxError·NameError·TypeError·ValueError 네 가지를 알아두면 검색하거나 AI에게 질문할 때도 훨씬 정확해집니다.","오류 메시지를 그대로 무서워하지 말고, 마지막 오류 이름과 관련 줄부터 범위를 좁히세요.","다음 챕터에서는 변수와 연산자를 조합해 실제 계산 도구를 만듭니다.","검색이나 AI를 이용할 때는 오류 메시지를 일부만 바꾸어 전달하기보다, 오류 이름·문제 줄·관련 코드 몇 줄·예상한 결과·실제 결과를 함께 주는 편이 좋습니다. 그러면 답변의 정확도가 크게 올라갑니다.","디버깅 능력은 오류를 안 만드는 능력이 아니라, 오류를 만나도 차분하게 범위를 좁힐 수 있는 능력입니다. 다음 챕터에서는 이런 습관을 실제 계산 코드에 적용합니다."],"bullets":["오류를 숨기지 말고 재현한다.","한 번에 하나만 바꾼다.","수정 후 반드시 같은 조건으로 다시 실행한다.","오류 이름+타입+상황을 함께 검색한다.","오류 이름과 메시지를 그대로 기록한다.","한 번에 하나의 가설만 검증한다.","수정 전후에 같은 입력으로 재현한다."],"extras":[],"visibleExtras":2,"id":"t1-c6-p13"},{"kind":"concept","eyebrow":"CHAPTER 06 · 심화 정리","title":"오류를 읽는 순서를 습관화하세요 — 한 단계 더","paragraphs":["① 재현 ② 오류 이름과 줄 확인 ③ 관련 값·타입 확인 ④ 가설 하나 ⑤ 최소 수정 ⑥ 재실행의 순서를 반복하면 당황하지 않고 문제를 처리할 수 있습니다."],"keywords":["오류 메시지","traceback","최소 재현","가설 검증"],"extras":[],"visibleExtras":0,"id":"t1-c6-p14"}],"track":1,"id":"t1-c6","remember":"오류 이름·파일·줄 번호 읽는 순서","practiceGoal":"고장 한 개 만들고 고치기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":7,"title":"연산","pages":[{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"operator 연산자","description":"값에 특정 계산이나 동작을 적용하는 기호 또는 키워드입니다. +, -, *, /처럼 익숙한 산술 연산자뿐 아니라 이후 비교 연산자도 같은 큰 범주에 들어갑니다.","usage":"값 두 개를 계산하거나 관계를 표현할 때 사용합니다.","example":"예: price * count에서 *는 곱셈 operator입니다."},{"term":"arithmetic operator 산술 연산자","description":"숫자 계산에 사용하는 연산자 묶음을 말합니다. +, -, *, /, //, %, ** 등이 대표적이며 각각 결과 의미가 다릅니다.","usage":"금액, 수량, 비율, 누적값 같은 계산 규칙을 코드로 옮길 때 사용합니다.","example":"예: total = price * count + shipping처럼 여러 산술 연산자를 조합합니다."},{"term":"expression 표현식","description":"연산되어 하나의 값을 만들어 내는 코드 조각입니다. 표현식은 변수에 저장되거나 함수의 인자로 전달되거나 print에 바로 사용될 수 있습니다.","usage":"한 줄 안에서 어떤 값이 먼저 만들어지는지 설명할 때 씁니다.","example":"예: price * count는 subtotal 값을 만드는 expression입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c7-p1"},{"kind":"glossary","eyebrow":"CHAPTER 07 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"precedence 우선순위","description":"여러 연산자가 함께 있을 때 어떤 연산을 먼저 계산할지 정하는 규칙입니다. 헷갈릴 때는 외우기보다 괄호로 의도를 명확하게 적는 것이 좋습니다.","usage":"복합 계산식의 결과를 정확히 예측할 때 사용합니다.","example":"예: 5 + 2 * 3에서는 곱셈이 먼저 계산됩니다."},{"term":"parentheses 괄호","description":"연산 순서를 명확하게 만들거나 함수 호출을 표현하는 데 사용하는 기호입니다. 계산식에서는 괄호 안을 먼저 처리하도록 의도를 드러낼 수 있습니다.","usage":"복잡한 계산을 읽기 쉽게 하고 실수를 줄일 때 사용합니다.","example":"예: (5 + 2) * 3은 덧셈을 먼저 하도록 지정합니다."},{"term":"floor division // · modulo %","description":"//는 몫을 구하는 나눗셈이고 %는 나머지를 구하는 연산입니다. 둘은 반복 주기, 짝수·홀수 판단, 묶음 계산 등에서 자주 쓰입니다.","usage":"나눈 뒤 몫이나 나머지가 필요한 계산에 사용합니다.","example":"예: 10 // 3은 3, 10 % 3은 1입니다."}],"extras":[],"visibleExtras":2,"id":"t1-c7-p2"},{"kind":"concept","eyebrow":"CHAPTER 07 · 계산하기","title":"연산자는 값으로 새로운 값을 만듭니다","paragraphs":["+, -, *, / 같은 기호는 값을 계산하는 연산자(operator)입니다. 연산자와 값을 조합해 하나의 새 값이 되는 부분을 표현식(expression)이라고 합니다.","계산 순서가 헷갈리면 괄호를 사용해 의도를 분명하게 표현하는 편이 안전합니다. 괄호는 컴퓨터뿐 아니라 코드를 읽는 사람에게도 ‘여기를 먼저 계산한다’고 알려 줍니다.","변수와 입력을 함께 사용하면 같은 계산 규칙을 여러 상황에서 재사용할 수 있습니다.","연산자는 단순한 계산 기호가 아니라 값과 값 사이의 규칙을 표현합니다. +, -, *, /는 익숙하지만 //, %, **는 처음 볼 수 있습니다. 각각 몫, 나머지, 거듭제곱을 구할 때 사용합니다.","/는 정수끼리 나누어도 보통 float 결과를 만듭니다. 반면 //는 소수 부분을 단순히 ‘버린다’기보다 아래 방향으로 내림하는 floor division이라는 점을 정확히 알아두면 좋습니다. 입문 실습에서는 양수 예제를 중심으로 익히면 충분합니다."],"keywords":["operator 연산자","arithmetic operator 산술 연산자","expression 표현식","precedence 우선순위","parentheses 괄호","total 합계"],"calloutTitle":"중요","calloutBody":"연산자를 볼 때는 왼쪽·오른쪽 값의 타입과 결과 타입까지 함께 생각하세요.","extras":[],"visibleExtras":3,"id":"t1-c7-p3"},{"kind":"concept","eyebrow":"CHAPTER 07 · 개념 심화","title":"연산자는 값으로 새로운 값을 만듭니다 — 이어서 이해하기","paragraphs":["연산은 단순히 기호를 외우는 일이 아니라, 어떤 값에서 어떤 새 값을 만들 것인지 규칙을 코드로 표현하는 일입니다. 계산이 길어질수록 한 줄로 압축하기보다 중간값을 이름으로 나누는 편이 읽기와 검산에 유리합니다.","price * count의 결과는 새로운 숫자 값이고, 그 값을 total에 대입하거나 print에 전달할 수 있습니다. 표현식의 결과가 다음 연산의 입력이 되는 구조를 이해하세요.","연산자에는 우선순위가 있어서 곱셈과 나눗셈이 덧셈보다 먼저 계산됩니다. 사람이 읽었을 때 의도가 헷갈릴 수 있다면 괄호를 사용해 계산 순서를 명시하세요. 컴퓨터가 이해할 수 있는 코드와 사람이 바로 이해할 수 있는 코드는 서로 다를 수 있습니다.","금액, 개수, 비율처럼 서로 다른 단위를 섞으면 식 자체는 실행돼도 의미가 틀릴 수 있습니다. total_price, quantity, discount_rate처럼 이름에 의미를 드러내고 중간값을 출력해 보면 계산 오류를 쉽게 찾을 수 있습니다.","이후 데이터 분석이나 앱의 가격 계산, 통계 처리에서도 같은 원칙이 쓰입니다. 복잡한 식을 작은 계산 단계로 나누고 각 단계의 값과 단위를 확인하는 방식이 가장 안정적입니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p4"},{"kind":"visual","eyebrow":"계산 순서","title":"작은 계산부터 단계별로 나누세요","visual":"CALC_STEPS","paragraphs":["복잡한 계산을 한 줄에 다 넣기보다 중간 결과에 이름을 붙이면 읽기와 수정이 쉬워집니다.","subtotal = price * count, tax = subtotal * 0.1, total = subtotal + tax처럼 각 단계가 눈에 보이게 만들 수 있습니다.","복잡한 계산은 한 줄에 압축할수록 읽기 어려워집니다. 중간 단계에 subtotal, discount, tax, total 같은 이름을 붙이면 계산 의도가 보이고 결과를 한 단계씩 검산할 수 있습니다.","값에 단위가 있다는 점도 중요합니다. price가 원 단위인지, discount가 0.1 같은 비율인지, count가 개수인지 변수 이름과 주변 설명으로 구분해야 실수를 줄일 수 있습니다."],"bullets":["곱셈·나눗셈은 덧셈·뺄셈보다 먼저","괄호는 우선 계산을 명확히 함","/ 결과는 보통 float","//는 몫, %는 나머지, **는 거듭제곱","중간 결과를 저장하면 어느 단계가 틀렸는지 찾기 쉽습니다.","변수 이름에 단위와 역할이 드러나면 계산식이 읽기 쉬워집니다."],"extras":[],"visibleExtras":2,"id":"t1-c7-p5"},{"kind":"example","eyebrow":"예제","title":"장보기 계산기를 작은 단계로 만듭니다","code":"price = 2500\ncount = 4\nsubtotal = price * count\nshipping = 3000\ntotal = subtotal + shipping\nprint(total)","paragraphs":["각 상품 금액이나 중간 계산을 변수로 나누면 오류가 났을 때 어느 단계가 잘못됐는지 찾기 쉽습니다.","현실의 돈 계산처럼 익숙한 숫자를 사용하면 변수와 연산자가 어떻게 연결되는지 이해하기 좋습니다.","예제에서 subtotal을 따로 만든 이유는 단순히 줄 수를 늘리기 위해서가 아닙니다. 상품 금액 계산과 배송비 추가를 분리하면 규칙이 바뀌었을 때 수정해야 할 위치가 명확해집니다.","프로그램이 길어질수록 ‘한 줄에 최대한 많이 적기’보다 ‘한 줄이 한 가지 역할을 하게 만들기’가 읽기와 디버깅에 유리합니다."],"codeNote":"결과: 13000\n\n중간마다 print(subtotal), print(total)을 잠깐 넣어 단계별 결과를 확인해도 좋습니다.","extras":[],"visibleExtras":3,"id":"t1-c7-p6"},{"kind":"concept","eyebrow":"CHAPTER 07 · 예제 확장","title":"장보기 계산기를 작은 단계로 만듭니다 — 이어서 이해하기","paragraphs":["subtotal, discount, total처럼 중간 단계를 변수로 분리하면 어느 단계에서 계산이 틀렸는지 확인하기 쉽습니다. 실제 업무용 계산도 이 방식이 안전합니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p7"},{"kind":"practice","eyebrow":"실습 A/B · 계산기 확장","title":"입력받는 계산기로 바꿔 보세요","practicePrompt":"① price와 count를 input()으로 받기 ② 필요한 타입으로 변환 ③ 할인율 10% 적용 ④ 배송비 3000원 더하기 ⑤ 0원·큰 금액도 테스트","paragraphs":["한 번에 완벽하게 만들기보다 단계별 값을 print로 확인해 보는 것도 좋은 디버깅 방법입니다.","할인율 10%를 적용할 때는 먼저 ‘무엇의 10%인가’를 명확히 하세요. subtotal에 적용하는지 배송비까지 포함한 total에 적용하는지 요구사항에 따라 결과가 달라집니다.","이처럼 코딩 문제에서 계산식 자체보다 ‘규칙을 정확히 해석하는 것’이 더 중요할 때가 많습니다. 애매한 규칙은 코드로 옮기기 전에 문장으로 다시 정리하는 습관이 좋습니다."],"extras":[],"visibleExtras":4,"id":"t1-c7-p8","answerOnNext":true},{"id":"t1-c7-p8-solution","kind":"solution","eyebrow":"정답과 풀이","title":"입력받는 계산기로 바꿔 보세요 · 풀이","paragraphs":["2500 × 4 = 10000원입니다. 10% 할인은 90%를 내는 것이므로 0.9를 곱해 9000.0이 됩니다.","배송비 3000을 마지막에 더하면 12000.0입니다. 배송비까지 할인하지 않도록 계산 순서를 구분합니다.","0원도 배송비가 붙는다는 현재 규칙을 먼저 정했습니다. 실제 돈 계산의 소수 처리·반올림 규칙은 별도 설계가 필요합니다."],"code":"price = int(input(\"가격: \"))\ncount = int(input(\"수량: \"))\nsubtotal = price * count\ndiscounted = subtotal * 0.9\nfinal_total = discounted + 3000\nprint(final_total)","codeNote":"실행 결과 또는 테스트 기준\n가격 2500, 수량 4 → 12000.0"},{"kind":"concept","eyebrow":"CHAPTER 07 · 실습 확장","title":"입력받는 계산기로 바꿔 보세요 — 이어서 이해하기","paragraphs":["사용자에게 받은 가격과 수량은 문자열이므로 숫자로 바꾼 뒤 곱해야 합니다. 입력과 연산을 함께 다룰 때 타입 확인이 다시 중요해집니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p9"},{"kind":"check","eyebrow":"확인 문제","title":"연산과 계산 순서","question":"print(5 + 2 * 3)과 print((5 + 2) * 3)의 결과는 왜 다를까요?","paragraphs":["연산 우선순위를 외우는 데만 의존하지 말고, 헷갈리면 괄호를 사용하세요. 괄호는 컴퓨터가 계산할 순서를 명확히 할 뿐 아니라 사람에게도 작성자의 의도를 보여 줍니다.","실제 코드에서는 결과가 같더라도 읽기 쉬운 식을 선택하는 것이 좋습니다. ‘다른 사람이 3초 안에 계산 의도를 이해할 수 있는가?’를 기준으로 생각해 보세요."],"extras":[],"visibleExtras":5,"id":"t1-c7-p10","answerOnNext":true},{"id":"t1-c7-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"연산과 계산 순서 · 풀이","paragraphs":["첫 번째는 곱셈 2 * 3을 먼저 계산해 6을 만들고 5를 더해 11이 됩니다. 두 번째는 괄호가 먼저 계산되어 7 * 3 = 21이 됩니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 07 · 확인 확장","title":"연산과 계산 순서 — 이어서 이해하기","paragraphs":["2 + 3 * 4는 곱셈이 먼저라 14가 됩니다. 계산 의도를 사람이 빠르게 읽어야 한다면 2 + (3 * 4)처럼 괄호를 써서 순서를 눈에 보이게 할 수 있습니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p11"},{"kind":"summary","eyebrow":"Chapter 7 정리","title":"계산을 코드로 옮기는 법","paragraphs":["연산자는 값을 계산해 새 값을 만듭니다. 계산 순서를 이해하고, 복잡한 계산은 여러 단계로 나누며, 중간값에 의미 있는 변수 이름을 붙이면 코드가 훨씬 읽기 쉬워집니다.","타입에 따라 같은 연산자의 의미가 달라질 수 있으므로 예상하지 못한 결과가 나오면 type()을 함께 확인하세요.","마지막 챕터에서는 지금까지 배운 것만 사용해 작은 프로그램을 처음부터 설계하고 테스트합니다.","변수와 연산자를 결합하면 입력값이 달라져도 같은 규칙을 반복해서 적용할 수 있습니다. 이것이 프로그램이 계산기를 넘어 ‘규칙을 자동으로 적용하는 도구’가 되는 시작점입니다.","마지막 챕터에서는 지금까지 배운 입력, 변수, 타입, 연산, 디버깅을 한 프로그램 안에 묶습니다. 새 문법보다 기존 개념을 연결하는 것이 목표입니다."],"bullets":["계산 규칙을 작은 단계로 나눈다.","괄호로 의도를 명확히 한다.","중간 결과를 변수에 저장한다.","계산 규칙을 먼저 문장으로 설명해 본다.","중간값을 변수로 나누어 검산한다.","헷갈리는 우선순위는 괄호로 명확하게 한다."],"extras":[],"visibleExtras":2,"id":"t1-c7-p12"},{"kind":"concept","eyebrow":"CHAPTER 07 · 심화 정리","title":"계산을 코드로 옮기는 법 — 한 단계 더","paragraphs":["계산 코드는 수식 자체보다 규칙을 읽기 쉽게 표현하는 것이 중요합니다. 중간값과 단위를 변수로 분리하면 검산과 수정이 쉬워집니다.","한 줄의 긴 식보다 의미 있는 변수 이름과 중간값을 사용하면 수정·검산·재사용이 쉬워집니다. 코드는 짧음보다 명확함이 더 중요한 경우가 많습니다."],"keywords":["연산자","우선순위","중간값","단위 확인"],"extras":[],"visibleExtras":0,"id":"t1-c7-p13"}],"track":1,"id":"t1-c7","remember":"괄호·곱셈의 우선순위","practiceGoal":"가격·수량·할인 계산기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":8,"title":"미니 프로젝트","pages":[{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"project 프로젝트","description":"하나의 목표를 실제로 완성하기 위해 여러 코드와 작업을 묶은 단위입니다. 입문 프로젝트는 작아도 좋으며 처음부터 끝까지 완성해 보는 경험이 중요합니다.","usage":"여러 개념을 연결해 하나의 결과물을 만들 때 사용합니다.","example":"예: 하루 지출 합계를 계산하는 작은 프로그램도 프로젝트입니다."},{"term":"requirement 요구사항","description":"프로그램이 무엇을 해야 하는지 구체적으로 정리한 조건입니다. 기능을 만들기 전에 요구사항을 명확히 하면 불필요한 코드를 줄이고 완료 기준을 정하기 쉽습니다.","usage":"코드를 쓰기 전에 목표와 필요한 기능을 정의할 때 사용합니다.","example":"예: ‘커피·점심·교통비를 입력받아 총합을 보여 준다’가 요구사항입니다."},{"term":"input-process-output","description":"프로그램을 입력·처리·출력 세 단계로 나누어 보는 기본 구조입니다. 복잡한 문제도 이 세 칸으로 나누면 데이터가 어디서 들어와 어떻게 바뀌는지 보기 쉬워집니다.","usage":"프로그램 구조를 설계하거나 문제 위치를 찾을 때 사용합니다.","example":"예: 금액 입력 → 합계 계산 → 총지출 출력으로 나눌 수 있습니다."}],"extras":[],"visibleExtras":1,"id":"t1-c8-p1"},{"kind":"glossary","eyebrow":"CHAPTER 08 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"test case 테스트 케이스","description":"특정 입력과 그때 기대하는 결과를 한 묶음으로 정한 것입니다. 프로그램이 실제로 요구사항을 만족하는지 반복해서 확인할 수 있게 해 줍니다.","usage":"코드 수정 후 기능이 여전히 맞는지 검증할 때 사용합니다.","example":"예: 1000, 2000, 3000을 입력하면 기대 결과 6000을 정합니다."},{"term":"expected result 기대 결과","description":"테스트 전에 미리 계산하거나 정의해 둔 올바른 결과입니다. 실제 결과와 비교해야 프로그램이 맞는지 판단할 수 있습니다.","usage":"실행 결과를 객관적으로 검증할 때 사용합니다.","example":"예: 입력 합계가 6000이어야 한다고 미리 정한 값이 expected result입니다."},{"term":"edge case 경계 상황","description":"평소보다 극단적이거나 경계에 가까운 입력 상황을 뜻합니다. 정상 입력만으로는 드러나지 않는 문제를 찾는 데 도움이 됩니다.","usage":"0, 빈 값, 아주 큰 값, 잘못된 형식처럼 특별한 입력을 테스트할 때 사용합니다.","example":"예: 모든 지출이 0원일 때도 합계가 0으로 나오는지 확인합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c8-p2"},{"kind":"concept","eyebrow":"CHAPTER 08 · 처음부터 만들기","title":"프로젝트는 코드를 쓰기 전에 요구사항부터 정합니다","paragraphs":["프로젝트(project)는 하나의 목표를 가진 프로그램이나 기능을 실제로 완성해 보는 작업입니다. 코드를 먼저 쓰기 시작하면 중간에 ‘내가 뭘 만들려고 했지?’가 되기 쉽습니다.","먼저 한 문장으로 목표를 적고, 필요한 입력과 처리 규칙, 최종 출력을 정하세요. 이 작은 요구사항(requirement)이 프로그램 구조를 잡아 줍니다.","이번 프로젝트는 지금까지 배운 input, int, 변수, 덧셈, f-string만 사용합니다. 새 문법을 억지로 추가하지 않습니다.","프로젝트를 시작할 때 기능을 많이 넣는 것보다 ‘이번에 반드시 완성할 최소 범위’를 정하는 것이 중요합니다. 첫 버전은 입력 세 개를 받아 합계를 보여 주는 것만으로도 충분합니다. 작게 완성한 뒤 기능을 하나씩 추가하는 편이 실패 원인을 찾기도 쉽습니다.","요구사항은 ‘무엇을 만들 것인가’뿐 아니라 ‘완료됐다고 판단할 기준이 무엇인가’까지 포함하면 더 명확해집니다. 예를 들어 세 금액을 입력했을 때 총합이 정확히 출력되면 1차 완료라고 정할 수 있습니다."],"keywords":["project 프로젝트","requirement 요구사항","input 입력","process 처리","output 출력","test case 테스트 케이스","expected result 기대 결과"],"calloutTitle":"만들 것","calloutBody":"하루 지출을 입력받아 합계를 계산하고 결과를 보여 주는 아주 작은 프로그램","extras":[],"visibleExtras":3,"id":"t1-c8-p3"},{"kind":"concept","eyebrow":"CHAPTER 08 · 개념 심화","title":"프로젝트는 코드를 쓰기 전에 요구사항부터 정합니다 — 이어서 이해하기","paragraphs":["미니 프로젝트에서 가장 중요한 것은 코드를 많이 쓰는 것이 아니라 무엇을 만들지 먼저 명확히 정하는 것입니다. 입력, 처리 규칙, 출력, 성공 조건을 적어 두면 코드가 짧아지고 수정할 때도 어디를 바꿔야 할지 보입니다.","“지출 계산기를 만든다”보다 “금액 두 개를 입력하면 합계를 숫자로 출력한다”처럼 입력과 기대 결과가 포함된 요구사항이 구현하기 쉽습니다.","한 단계 더 나아가면 기능마다 “이 입력을 주면 이 결과가 나와야 한다”는 기대 결과를 먼저 정할 수 있습니다. 이것이 테스트의 가장 단순한 형태입니다. 코드를 쓰기 전에 예시 입력과 기대 출력을 두세 개 적어 두면 완성 여부를 스스로 확인할 수 있습니다.","처음부터 기능을 많이 넣으면 어느 부분에서 오류가 생겼는지 찾기 어려워집니다. 핵심 기능 하나를 완성하고 실행 확인한 뒤 다음 기능을 붙이는 식으로 작은 단위로 확장하세요. 기능 추가 후에는 기존 기능이 그대로 되는지도 다시 확인합니다.","실제 앱 개발도 요구사항 → 화면/데이터 설계 → 작은 기능 구현 → 테스트 → 수정의 반복입니다. 지금 만든 짧은 계산기 프로젝트는 규모만 작을 뿐 실제 개발의 기본 흐름을 그대로 연습하는 것입니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p4"},{"kind":"visual","eyebrow":"설계","title":"입력·처리·출력 세 칸으로 나눕니다","visual":"IPO_PROJECT","paragraphs":["문법을 몰라도 먼저 구조를 설계할 수 있습니다. 종이에 세 칸을 그려 input, process, output을 적는 것만으로도 무엇을 만들어야 하는지가 선명해집니다.","이렇게 역할을 붙이면 새 기능을 추가할 위치나 오류를 확인할 위치도 찾기 쉬워집니다.","INPUT, PROCESS, OUTPUT 세 칸을 먼저 채우면 코드를 쓰기 전에 프로그램 전체 흐름이 보입니다. 여기에 VERIFY를 하나 더 붙이면 어떤 입력으로 결과를 검증할지까지 설계할 수 있습니다.","이 방식은 큰 프로젝트에서도 그대로 확장됩니다. 화면 입력, 데이터 처리, 저장, 출력처럼 구조는 복잡해져도 ‘데이터가 어디서 들어와 어떻게 바뀌고 어디로 나가는가’를 따라가는 사고는 같습니다."],"bullets":["입력: 커피·점심·교통비","처리: 세 값을 숫자로 바꾸고 합계 계산","출력: 오늘 총지출 보여 주기","검증: 예상 결과와 실제 결과 비교","코드를 쓰기 전에 입력과 출력부터 정하면 중간 처리 규칙이 보입니다.","테스트 입력을 미리 정하면 완성 여부를 객관적으로 확인하기 쉽습니다."],"extras":[],"visibleExtras":1,"id":"t1-c8-p5"},{"kind":"concept","eyebrow":"CHAPTER 08 · 흐름 심화","title":"입력·처리·출력 세 칸으로 나눕니다 — 이어서 이해하기","paragraphs":["입력칸에 필요한 값, 처리칸에 계산 규칙, 출력칸에 보여 줄 결과를 적으면 그 순서가 거의 그대로 코드 구조가 됩니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p6"},{"kind":"example","eyebrow":"미니 프로젝트","title":"하루 지출 계산기를 완성합니다","code":"coffee = int(input(\"커피: \"))\nlunch = int(input(\"점심: \"))\ntransport = int(input(\"교통: \"))\ntotal = coffee + lunch + transport\nprint(f\"오늘 총지출: {total}원\")","paragraphs":["coffee·lunch·transport는 입력 데이터이고, total은 처리 결과입니다. 마지막 print는 output입니다.","각 줄을 입력·처리·출력 중 어디에 속하는지 표시해 보면 프로그램 전체 흐름이 한눈에 보입니다.","예제 코드를 한 번에 외우지 말고 줄마다 역할을 표시해 보세요. 첫 세 줄은 INPUT, total 계산 줄은 PROCESS, 마지막 print는 OUTPUT입니다. 이렇게 분류하면 코드가 길어져도 구조를 잃지 않습니다.","각 input을 int로 감싼 이유도 다시 확인하세요. 금액은 합산해야 하므로 문자열이 아니라 숫자 타입이 필요합니다. 이전 챕터의 타입과 형 변환이 실제 프로젝트 안에서 다시 사용되는 지점입니다."],"codeNote":"각 줄 오른쪽에 INPUT / PROCESS / OUTPUT이라고 주석을 붙여 보고, 없어도 의미를 설명할 수 있는지 확인해 보세요.","extras":[],"visibleExtras":3,"id":"t1-c8-p7"},{"kind":"practice","eyebrow":"실습 A/B · 내 프로그램으로 바꾸기","title":"예산 기능을 하나 추가하세요","practicePrompt":"① 오늘 예산을 input()으로 추가 ② remaining = budget - total 계산 ③ 남은 예산 출력 ④ 변수 이름을 의미 있게 유지","paragraphs":["기존 프로그램을 완전히 다시 쓰지 않고, 필요한 입력·처리·출력 위치에 한 줄씩 추가하는 것이 핵심입니다.","기능을 추가할 때 기존 코드 전체를 다시 쓰지 말고, 요구사항이 어느 단계에 영향을 주는지 먼저 찾습니다. 예산 입력은 INPUT, remaining 계산은 PROCESS, 남은 예산 표시는 OUTPUT에 각각 한 줄씩 추가됩니다.","이렇게 작은 변경으로 확장하는 습관은 실제 개발에서도 중요합니다. 한 번에 많은 부분을 바꾸면 오류가 생겼을 때 원인을 추적하기 어려워집니다."],"extras":[],"visibleExtras":4,"id":"t1-c8-p8","answerOnNext":true},{"id":"t1-c8-p8-solution","kind":"solution","eyebrow":"정답과 풀이","title":"예산 기능을 하나 추가하세요 · 풀이","paragraphs":["먼저 세 지출의 합계를 구합니다. 예산에서 합계를 빼면 남은 금액이 됩니다.","예산을 10000으로 바꾸면 남은 예산은 -500입니다. 음수는 예산을 500원 넘겼다는 뜻입니다."],"code":"coffee = int(input(\"커피: \"))\nlunch = int(input(\"점심: \"))\ntransport = int(input(\"교통: \"))\ntotal = coffee + lunch + transport\nbudget = int(input(\"오늘 예산: \"))\nremaining = budget - total\nprint(f\"오늘 총지출: {total}원\")\nprint(f\"남은 예산: {remaining}원\")","codeNote":"실행 결과 또는 테스트 기준\n입력 0, 9000, 1500, 20000 →\n오늘 총지출: 10500원\n남은 예산: 9500원"},{"kind":"concept","eyebrow":"CHAPTER 08 · 실습 확장","title":"예산 기능을 하나 추가하세요 — 이어서 이해하기","paragraphs":["예산 기능을 넣을 때도 기존 지출 합계 계산은 그대로 유지되어야 합니다. 새 기능을 한 덩어리로 넣기보다 예산 입력 → 남은 금액 계산 → 출력 순으로 작게 추가하고 매 단계 실행하세요."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p9"},{"kind":"check","eyebrow":"테스트","title":"입력과 기대 결과를 미리 정하세요","paragraphs":["프로그램이 한 번 잘 됐다고 항상 맞는 것은 아닙니다. 특정 입력과 그때 기대하는 결과를 한 묶음으로 정한 것을 테스트 케이스(test case)라고 합니다.","정상값뿐 아니라 0원, 큰 금액, 숫자 대신 글자 입력처럼 가장자리 상황(edge case)도 확인해야 숨어 있는 문제를 찾을 수 있습니다.","테스트 케이스는 ‘입력값과 기대 결과의 묶음’입니다. 정상적인 값 하나만 확인하면 숨어 있는 문제를 놓칠 수 있으므로 0, 큰 값, 잘못된 형식 같은 경계 상황도 함께 보는 편이 좋습니다.","actual result가 expected result와 다르면 바로 코드 탓으로 단정하지 마세요. 기대값을 손으로 잘못 계산했거나 테스트 입력 자체가 잘못됐을 수도 있습니다. 입력·기대값·실제값 세 가지를 함께 확인해야 합니다."],"bullets":["coffee=0, lunch=9000, transport=1500 → 기대값 10500","모두 0 → 기대값 0","큰 금액 입력 → 계산 확인","‘천원’ 입력 → 어떤 오류가 나는지 기록","정상값 테스트는 기본 동작을 확인합니다.","0과 큰 값은 경계에서 계산이 깨지는지 확인합니다.","잘못된 입력은 오류가 어떤 형태로 나타나는지 학습하는 데 도움됩니다."],"question":"actual result가 expected result와 다르면 무조건 코드가 틀린 걸까요?","extras":[],"visibleExtras":1,"id":"t1-c8-p10","answerOnNext":true},{"id":"t1-c8-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"입력과 기대 결과를 미리 정하세요 · 풀이","paragraphs":["아닙니다. 코드가 틀릴 수도 있지만 expected result 자체를 잘못 계산했을 수도 있습니다. 입력·기대값·실제값을 함께 다시 확인해야 합니다."]},{"kind":"concept","eyebrow":"CHAPTER 08 · 확인 확장","title":"입력과 기대 결과를 미리 정하세요 — 이어서 이해하기","paragraphs":["확인문제는 정답을 빨리 맞히는 것보다 왜 그런 답이 되는지 설명하는 것이 중요합니다. 틀렸다면 어떤 전제를 잘못 이해했는지 찾아보세요.","입력값과 기대 결과를 먼저 적으면 실행 뒤 맞았는지 즉시 판단할 수 있습니다. 정상 입력뿐 아니라 0이나 큰 값처럼 경계에 가까운 입력도 하나 넣어 보면 더 좋습니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p11"},{"kind":"summary","eyebrow":"TRACK 01 마무리","title":"이제 짧은 Python 코드를 읽고 고칠 수 있습니다","paragraphs":["이제 코딩이 무엇인지 설명하고, Python 코드의 기본 실행 흐름을 읽고, 변수와 타입을 구분하고, 입력값을 숫자로 바꾸고, 오류 메시지의 핵심을 읽고, 간단한 계산 프로그램을 설계할 수 있습니다.","트랙1의 목표는 개발자가 되는 것이 아니라 ‘코딩 글을 읽다가 모르는 단어를 검색하고, 짧은 코드를 직접 바꾸고, 오류가 나면 메시지를 보고 질문할 수 있는 상태’가 되는 것입니다.","조건문·반복문·함수 같은 다음 단계 문법은 TRACK 02에서 이어서 배우면 됩니다.","트랙1을 끝냈다고 해서 모든 코드를 스스로 만들 수 있어야 하는 것은 아닙니다. 더 중요한 것은 짧은 코드를 보고 대략 무슨 일을 하는지 설명하고, 값을 조금 바꾸고, 오류가 나면 메시지를 읽고 질문할 수 있는 상태가 되는 것입니다.","앞으로 조건문·반복문·함수를 배울 때도 같은 학습 루프를 사용하세요. 개념을 짧게 읽고, 예제를 실행하고, 한 부분만 바꾸고, 결과를 예상하고, 오류를 기록합니다. 이 방식이 새로운 문법을 가장 안정적으로 자기 것으로 만드는 방법입니다."],"bullets":["코드 변경 → 실행 → 결과 확인 습관","입력 → 처리 → 출력 구조","오류 이름과 줄 번호부터 읽기","테스트 케이스로 결과 검증","변수·타입·입력·연산을 연결해 작은 프로그램을 수정할 수 있다.","오류 메시지를 보고 검색이나 AI 질문에 필요한 정보를 정리할 수 있다.","테스트 입력과 기대 결과를 이용해 프로그램을 검증할 수 있다."],"extras":[],"visibleExtras":1,"id":"t1-c8-p12"},{"kind":"concept","eyebrow":"CHAPTER 08 · 심화 정리","title":"이제 짧은 Python 코드를 읽고 고칠 수 있습니다 — 이어서 이해하기","paragraphs":["짧은 코드를 읽고, 값을 추적하고, 타입과 오류를 확인하고, 작은 기능을 추가할 수 있다면 기초가 연결된 것입니다. 다음 단계에서는 조건과 반복을 추가해 프로그램이 상황에 따라 다른 일을 하게 만듭니다."],"keywords":["요구사항","입력·처리·출력","기대 결과","작은 기능 단위"],"extras":[],"visibleExtras":0,"id":"t1-c8-p13"}],"track":1,"id":"t1-c8","remember":"입력·처리·출력 구분","practiceGoal":"예산 계산기 완성","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":1,"title":"조건문 if","pages":[{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이번 단어장에서는 if 조건문, condition 조건, comparison 비교 연산를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"if 조건문","description":"if는 ‘이 조건이 맞으면 아래 코드를 실행해’라는 뜻입니다. 나이가 19 이상일 때만 성인 안내를 보여 주는 것처럼, 어떤 상황에서만 실행할 코드를 고릅니다. 조건이 True면 들여쓰기된 줄로 들어가고 False면 그 줄들을 건너뜁니다.","usage":"점수, 로그인 여부, 재고 상태처럼 조건에 따라 처리 방식이 달라질 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: if score >= 60: 아래 블록은 점수가 60 이상일 때만 실행됩니다."},{"term":"condition 조건","description":"조건은 컴퓨터에게 던지는 예/아니오 질문입니다. age >= 19는 ‘age가 19 이상인가?’라는 질문이고 결과는 True 또는 False 둘 중 하나입니다. if는 이 결과를 보고 어느 길로 갈지 정합니다.","usage":"if가 어떤 길을 선택할지 판단하는 기준으로 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: age >= 19는 나이가 19 이상인지 검사하는 조건입니다."},{"term":"comparison 비교 연산","description":"비교 연산은 두 값을 비교해 True 또는 False를 만드는 기호입니다. ==는 같은지, !=는 다른지, >와 \u003c는 큰지 작은지, >=와 \u003c=는 기준값까지 포함하는지를 확인합니다. 기호 하나 차이로 경계값 결과가 달라질 수 있습니다.","usage":"숫자 크기나 문자열 일치 여부를 확인할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: password == \"1234\"는 입력된 비밀번호가 같은지 확인합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c1-p1","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. if 조건문, condition 조건, comparison 비교 연산를 실제 코드와 연결해서 보면 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. if 조건문, condition 조건, comparison 비교 연산를 실제 코드와 연결해서 보면 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. if 조건문, condition 조건, comparison 비교 연산를 실제 코드와 연결해서 보면 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. if 조건문, condition 조건, comparison 비교 연산를 실제 코드와 연결해서 보면 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. if 조건문, condition 조건, comparison 비교 연산를 실제 코드와 연결해서 보면 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["이번 단어장에서는 elif, else, boolean logic 논리 연산를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"elif","description":"elif는 앞의 if가 False였을 때 ‘그럼 이 조건은 어떤가?’ 하고 다음 조건을 확인합니다. 점수 등급처럼 여러 구간 중 하나를 고를 때 자주 씁니다. 위에서부터 처음 True가 된 한 길만 실행됩니다.","usage":"등급, 배송비 구간, 상태 코드처럼 선택지가 여러 개일 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: score >= 90이면 A, elif score >= 80이면 B처럼 이어 씁니다."},{"term":"else","description":"else는 앞의 if와 elif가 전부 False였을 때 들어가는 마지막 길입니다. 별도 조건을 적지 않고 앞에서 잡히지 않은 나머지 모든 경우를 처리합니다.","usage":"나머지 모든 경우를 처리하고 싶을 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 성인 조건이 아니면 else에서 미성년자 안내를 출력할 수 있습니다."},{"term":"boolean logic 논리 연산","description":"and, or, not은 여러 조건을 한 문장으로 묶는 도구입니다. and는 둘 다 True여야 하고, or는 하나만 True여도 되며, not은 True와 False를 뒤집습니다. ‘성인이면서 티켓이 있어야 입장’ 같은 현실 규칙을 코드로 옮길 때 사용합니다.","usage":"두 조건을 동시에 만족시키거나 둘 중 하나만 만족해도 되는 규칙을 표현할 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: age >= 19 and has_id는 두 조건이 모두 참이어야 True입니다."}],"extras":[],"visibleExtras":2,"id":"t2-c1-p2","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. elif, else, boolean logic 논리 연산를 실제 코드와 연결해서 보면 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. elif, else, boolean logic 논리 연산를 실제 코드와 연결해서 보면 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. elif, else, boolean logic 논리 연산를 실제 코드와 연결해서 보면 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. elif, else, boolean logic 논리 연산를 실제 코드와 연결해서 보면 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. elif, else, boolean logic 논리 연산를 실제 코드와 연결해서 보면 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-indent","kind":"concept","eyebrow":"조건문 준비","title":"콜론과 들여쓰기는 코드의 경계를 만듭니다","paragraphs":["‘콜론과 들여쓰기는 코드의 경계를 만듭니다’에서는 첫 코드 temperature = 27에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","if score >= 60: 끝의 :은 조건에 따라 실행할 묶음이 이어진다는 표시입니다.","print 앞의 스페이스 네 칸은 이 줄이 if 안이라는 뜻입니다. 마지막 print는 들여쓰기를 없애서 조건과 상관없이 실행합니다.","블록(block)은 함께 묶인 여러 줄입니다. 같은 블록에서는 들여쓰기 깊이를 맞추고 탭과 스페이스를 섞지 마세요."],"code":"temperature = 27\n\nif temperature >= 25:\n    print(\"반팔\")\n\nprint(\"오늘 옷차림 확인 끝\")","codeNote":"temperature가 27이므로 조건은 True입니다. 들여쓰기된 “반팔”이 먼저 출력되고, 마지막 print는 if 바깥이므로 항상 실행됩니다.","extras":[],"codeExplain":["1행 「temperature = 27」 — 숫자 27을 구한 뒤 결과를 temperature라는 변수에 저장합니다. 이 줄 이후에는 temperature라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「if temperature >= 25:」 — temperature가 25 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘콜론과 들여쓰기는 코드의 경계를 만듭니다’ 내용을 설명하는 코드에서는 3행은 temperature >= 25 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"반팔\")」 — 문자열 \"반팔\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘콜론과 들여쓰기는 코드의 경계를 만듭니다’ 내용을 설명하는 코드에서는 4행은 \"반팔\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","6행 「print(\"오늘 옷차림 확인 끝\")」 — 문자열 \"오늘 옷차림 확인 끝\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 1/6","title":"조건문은 프로그램의 길을 갈라놓습니다","paragraphs":["‘조건문은 프로그램의 길을 갈라놓습니다’에서는 첫 코드 age = 15에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","조건문을 읽을 때는 먼저 조건식이 어떤 값을 만드는지 확인하고, 그다음 True일 때와 False일 때 각각 어느 줄로 이동하는지 화살표로 그려보는 것이 좋습니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p3","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문은 프로그램의 길을 갈라놓습니다’ 내용을 설명하는 코드에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘조건문은 프로그램의 길을 갈라놓습니다’ 내용을 설명하는 코드에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문은 프로그램의 길을 갈라놓습니다’ 내용을 설명하는 코드에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문은 프로그램의 길을 갈라놓습니다’ 내용을 설명하는 코드에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문은 프로그램의 길을 갈라놓습니다’ 내용을 설명하는 코드에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 2/6","title":"비교식은 판단 결과를 값으로 만듭니다","paragraphs":["‘비교식은 판단 결과를 값으로 만듭니다’에서는 첫 코드 for age in [17, 18, 19]:에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","score >= 60 같은 비교식의 결과는 문장이 아니라 bool 값 True 또는 False입니다. if는 이 bool 값을 보고 실행 경로를 결정합니다.","==는 값이 같은지 비교하는 연산자이고 =는 값을 변수에 대입하는 기호입니다. 둘을 혼동하면 의도와 전혀 다른 코드가 됩니다.","조건식을 print(score >= 60)처럼 직접 출력해 보면 어떤 입력에서 True/False가 되는지 눈으로 확인할 수 있습니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p4","code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘비교식은 판단 결과를 값으로 만듭니다’ 내용을 설명하는 코드에서는 1행은 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「print(age, age >= 18)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 조건식 age >= 18의 True/False 결과입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘비교식은 판단 결과를 값으로 만듭니다’ 내용을 설명하는 코드에서는 2행은 age, age >= 18의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 3/6","title":"elif는 위에서부터 처음 맞는 길 하나를 고릅니다","paragraphs":["‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’에서는 첫 코드 score = 85에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","if와 여러 elif가 이어지면 Python은 위에서 아래로 조건을 검사하다가 처음 True가 된 블록 하나만 실행하고 나머지 분기는 건너뜁니다.","범위가 넓은 조건을 위에 두면 아래 조건이 영원히 실행되지 않을 수 있습니다. 점수 등급처럼 구간을 나눌 때 조건 순서가 중요한 이유입니다.","90점 이상, 80점 이상, 70점 이상처럼 높은 기준부터 낮은 기준 순으로 배치하면 읽기도 쉽고 중복 조건도 줄어듭니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p5","code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","codeExplain":["1행 「score = 85」 — 숫자 85을 구한 뒤 결과를 score라는 변수에 저장합니다. 이 줄 이후에는 score라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 1행은 85에서 만든 결과를 score에 저장하거나 갱신하는 줄입니다.","3행 「if score >= 90:」 — score가 90 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 3행은 score >= 90 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"A\")」 — 문자열 \"A\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 4행은 \"A\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「elif score >= 80:」 — 앞의 if·elif가 모두 False였을 때만 score가 80 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 5행은 앞 조건이 실패했을 때 score >= 80 조건을 추가로 확인하는 분기입니다.","6행 「print(\"B\")」 — 문자열 \"B\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 6행은 \"B\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","7행 「elif score >= 70:」 — 앞의 if·elif가 모두 False였을 때만 score가 70 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 7행은 앞 조건이 실패했을 때 score >= 70 조건을 추가로 확인하는 분기입니다.","8행 「print(\"C\")」 — 문자열 \"C\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 8행은 \"C\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","9행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 9행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","10행 「print(\"D\")」 — 문자열 \"D\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘elif는 위에서부터 처음 맞는 길 하나를 고릅니다’ 내용을 설명하는 코드에서는 10행은 \"D\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 4/6","title":"and·or·not으로 현실의 규칙을 조합합니다","paragraphs":["‘and·or·not으로 현실의 규칙을 조합합니다’에서는 첫 코드 age = 20에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","현실의 규칙은 조건 하나로 끝나지 않는 경우가 많습니다. and는 모든 조건이 참이어야 하고, or는 하나 이상 참이면 되며, not은 참과 거짓을 뒤집습니다.","복합 조건이 길어지면 괄호를 이용해 묶음을 명확하게 하고, 중간 bool 변수를 만들어 이름을 붙이면 훨씬 읽기 쉬워집니다.","예: is_adult = age >= 19, can_enter = is_adult and has_ticket처럼 단계로 나누면 규칙 자체가 설명서처럼 보입니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p6","code":"age = 20\nhas_ticket = False\n\ncan_enter = age >= 18 and has_ticket\nprint(can_enter)","codeNote":"나이 조건은 True지만 티켓이 False라서 True and False의 결과는 False입니다.","codeExplain":["1행 「age = 20」 — 숫자 20을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and·or·not으로 현실의 규칙을 조합합니다’ 내용을 설명하는 코드에서는 1행은 20에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","2행 「has_ticket = False」 — 참·거짓 값 False을 구한 뒤 결과를 has_ticket라는 변수에 저장합니다. 이 줄 이후에는 has_ticket라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and·or·not으로 현실의 규칙을 조합합니다’ 내용을 설명하는 코드에서는 2행은 False에서 만든 결과를 has_ticket에 저장하거나 갱신하는 줄입니다.","4행 「can_enter = age >= 18 and has_ticket」 — 조건식 age >= 18 and has_ticket의 True/False 결과을 구한 뒤 결과를 can_enter라는 변수에 저장합니다. 이 줄 이후에는 can_enter라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and·or·not으로 현실의 규칙을 조합합니다’ 내용을 설명하는 코드에서는 4행은 age >= 18 and has_ticket에서 만든 결과를 can_enter에 저장하거나 갱신하는 줄입니다.","5행 「print(can_enter)」 — can_enter의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘and·or·not으로 현실의 규칙을 조합합니다’ 내용을 설명하는 코드에서는 5행은 can_enter의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 5/6","title":"중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다","paragraphs":["‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’에서는 첫 코드 is_logged_in = True에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","if 안에 또 if를 넣는 중첩은 필요할 때도 있지만 깊어질수록 현재 어떤 조건 아래에 있는지 추적하기 어려워집니다.","가능하면 빠르게 종료하거나 조건을 합치거나 의미 있는 bool 변수로 나누어 들여쓰기 깊이를 줄이는 편이 좋습니다.","초보 단계에서는 기능이 맞는 것이 먼저지만, 같은 동작이라면 눈으로 한 번에 흐름이 보이는 구조를 선택하는 습관을 들이세요."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p7","code":"is_logged_in = True\nis_admin = False\n\nif is_logged_in and is_admin:\n    print(\"관리자 화면\")\nelse:\n    print(\"일반 화면\")","codeNote":"두 조건을 한 번에 읽을 수 있어서 if 안에 또 if를 넣는 것보다 흐름이 단순합니다.","codeExplain":["1행 「is_logged_in = True」 — 참·거짓 값 True을 구한 뒤 결과를 is_logged_in라는 변수에 저장합니다. 이 줄 이후에는 is_logged_in라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 1행은 True에서 만든 결과를 is_logged_in에 저장하거나 갱신하는 줄입니다.","2행 「is_admin = False」 — 참·거짓 값 False을 구한 뒤 결과를 is_admin라는 변수에 저장합니다. 이 줄 이후에는 is_admin라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 2행은 False에서 만든 결과를 is_admin에 저장하거나 갱신하는 줄입니다.","4행 「if is_logged_in and is_admin:」 — is_logged_in가 True인지 그리고 is_admin가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 4행은 is_logged_in and is_admin 조건을 기준으로 실행 경로를 나누는 분기입니다.","5행 「print(\"관리자 화면\")」 — 문자열 \"관리자 화면\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 5행은 \"관리자 화면\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","6행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 6행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","7행 「print(\"일반 화면\")」 — 문자열 \"일반 화면\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘중첩 if보다 조건을 단순하게 만드는 습관이 중요합니다’ 내용을 설명하는 코드에서는 7행은 \"일반 화면\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 01 · 개념 6/6","title":"경계값을 테스트해야 조건문이 믿을 만해집니다","paragraphs":["‘경계값을 테스트해야 조건문이 믿을 만해집니다’에서는 첫 코드 for age in [17, 18, 19]:에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","조건문은 경계 바로 앞과 바로 뒤에서 실수가 자주 생깁니다. >=와 >, \u003c=와 \u003c의 차이는 평소 입력에서는 잘 드러나지 않고 기준값에서 드러납니다.","60점 이상 합격이라면 59, 60, 61을 테스트하고, 나이 19세 이상이라면 18, 19, 20을 확인하는 식으로 경계값을 의도적으로 넣어 보세요.","이 습관은 이후 테스트를 배울 때 그대로 이어집니다. 조건이 많아질수록 정상값보다 경계값이 더 좋은 버그 탐지 입력이 됩니다."],"keywords":["if 조건문","condition 조건","comparison 비교 연산","elif"],"extras":[],"visibleExtras":2,"id":"t2-c1-p8","code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘경계값을 테스트해야 조건문이 믿을 만해집니다’ 내용을 설명하는 코드에서는 1행은 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「print(age, age >= 18)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 조건식 age >= 18의 True/False 결과입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘경계값을 테스트해야 조건문이 믿을 만해집니다’ 내용을 설명하는 코드에서는 2행은 age, age >= 18의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"조건문 if의 전체 흐름","paragraphs":["조건문 if에서 중요한 것은 문법 조각을 따로 외우는 것이 아니라 입력이 들어와 어떤 판단과 변환을 거쳐 결과가 되는지 흐름으로 보는 것입니다."],"visual":"TOP_TO_BOTTOM","bullets":["입력 또는 시작 상태를 확인합니다.","현재 단계의 조건·변환·반복 규칙을 확인합니다.","중간값을 변수나 출력으로 관찰합니다.","예상 결과와 실제 결과를 비교합니다.","문제가 있으면 처음 달라진 단계만 좁혀 수정합니다.","수정 뒤 같은 테스트를 다시 실행합니다."],"extras":[],"visibleExtras":1,"id":"t2-c1-p9","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if의 전체 흐름’ 흐름에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘조건문 if의 전체 흐름’ 흐름에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if의 전체 흐름’ 흐름에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문 if의 전체 흐름’ 흐름에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if의 전체 흐름’ 흐름에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"example","eyebrow":"핵심 예제","title":"조건문 if를 하나의 코드로 연결합니다","paragraphs":[],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","extras":[],"visibleExtras":2,"id":"t2-c1-p10","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if를 하나의 코드로 연결합니다’ 예제에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘조건문 if를 하나의 코드로 연결합니다’ 예제에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 하나의 코드로 연결합니다’ 예제에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문 if를 하나의 코드로 연결합니다’ 예제에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 하나의 코드로 연결합니다’ 예제에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"practice","eyebrow":"실습 · 직접 만들기","title":"조건문 if를 직접 바꾸고 확장합니다","paragraphs":["조건식은 말로 된 규칙을 코드로 바꾸는 과정입니다. “12세 이상”이면 먼저 12가 포함되는지 생각하고, 그 뜻에 맞는 비교 기호를 고릅니다.","코드를 완성한 뒤에는 조건에 딱 걸치는 값과 바로 앞뒤 값을 모두 넣어 보세요. 경계값에서 예상한 길로 들어가면 조건을 제대로 만든 것입니다.","if와 elif가 여러 개라면 위에서부터 한 줄씩 검사한다는 순서를 기억하세요. 앞 조건이 True가 된 순간 그 아래 다른 elif는 더 이상 검사하지 않습니다."],"code":"score = 80\nattendance = 80\n\nif ____ and ____:\n    print(\"A\")\nelif ____ and ____:\n    print(\"B\")\nelif ____ and ____:\n    print(\"C\")\nelse:\n    print(\"D\")","practicePrompt":"점수를 직접 바꾸며 69, 70, 79, 80, 89, 90에서 결과를 확인하세요. 그다음 “출석률 80% 이상” 조건을 and로 추가해 보세요.","extras":[],"visibleExtras":2,"id":"t2-c1-p11","answerOnNext":true,"codeExplain":["1행 「score = 80」 — 숫자 80을 구한 뒤 결과를 score라는 변수에 저장합니다. 이 줄 이후에는 score라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 실습에서는 1행은 80에서 만든 결과를 score에 저장하거나 갱신하는 줄입니다.","2행 「attendance = 80」 — 숫자 80을 구한 뒤 결과를 attendance라는 변수에 저장합니다. 이 줄 이후에는 attendance라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 실습에서는 2행은 80에서 만든 결과를 attendance에 저장하거나 갱신하는 줄입니다.","4행 「if ____ and ____:」 — ____가 True인지 그리고 ____가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","5행 「print(\"A\")」 — 문자열 \"A\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","6행 「elif ____ and ____:」 — 앞의 if·elif가 모두 False였을 때만 ____가 True인지 그리고 ____가 True인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다.","7행 「print(\"B\")」 — 문자열 \"B\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","8행 「elif ____ and ____:」 — 앞의 if·elif가 모두 False였을 때만 ____가 True인지 그리고 ____가 True인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다.","9행 「print(\"C\")」 — 문자열 \"C\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","10행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다.","11행 「print(\"D\")」 — 문자열 \"D\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."],"codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요."},{"id":"t2-c1-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"조건문 if를 직접 바꾸고 확장합니다 · 풀이","paragraphs":["이 예시에서는 출석률 80% 미만이면 D라는 추가 규칙을 정했습니다. 규칙이 다르면 else의 처리도 달라져야 합니다.","and는 점수 기준과 출석률 기준을 모두 만족할 때만 해당 등급을 선택하게 합니다.","점수 80, 출석률 80은 첫 A 조건에서 False, 다음 B 조건에서 True가 되어 B가 출력됩니다.","89·90과 출석률 79·80을 각각 바꾸어 기준 바로 앞과 같은 값에서 결과를 비교하세요."],"code":"score = 80\nattendance = 80\nif score >= 90 and attendance >= 80:\n    print(\"A\")\nelif score >= 80 and attendance >= 80:\n    print(\"B\")\nelif score >= 70 and attendance >= 80:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"실행 결과 또는 테스트 기준\n출석률 80일 때: 69→D, 70→C, 79→C, 80→B, 89→B, 90→A\n출석률 79일 때: 같은 점수 모두 D","extras":[],"codeExplain":["1행 「score = 80」 — 숫자 80을 구한 뒤 결과를 score라는 변수에 저장합니다. 이 줄 이후에는 score라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 1행은 80에서 만든 결과를 score에 저장하거나 갱신하는 줄입니다.","2행 「attendance = 80」 — 숫자 80을 구한 뒤 결과를 attendance라는 변수에 저장합니다. 이 줄 이후에는 attendance라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 2행은 80에서 만든 결과를 attendance에 저장하거나 갱신하는 줄입니다.","3행 「if score >= 90 and attendance >= 80:」 — score가 90 이상인지 그리고 attendance가 80 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","4행 「print(\"A\")」 — 문자열 \"A\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 4행은 \"A\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「elif score >= 80 and attendance >= 80:」 — 앞의 if·elif가 모두 False였을 때만 score가 80 이상인지 그리고 attendance가 80 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다.","6행 「print(\"B\")」 — 문자열 \"B\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 6행은 \"B\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","7행 「elif score >= 70 and attendance >= 80:」 — 앞의 if·elif가 모두 False였을 때만 score가 70 이상인지 그리고 attendance가 80 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다.","8행 「print(\"C\")」 — 문자열 \"C\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 8행은 \"C\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","9행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 9행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","10행 「print(\"D\")」 — 문자열 \"D\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if를 직접 바꾸고 확장합니다’ 풀이에서는 10행은 \"D\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"check","eyebrow":"확인 문제","title":"조건문 if 핵심을 확인합니다","paragraphs":[],"question":"score가 95일 때 if score >= 60을 먼저 쓰고 그 아래 elif score >= 90을 쓰면 왜 90점 분기가 실행되지 않을까요?","extras":[],"visibleExtras":3,"id":"t2-c1-p12","answerOnNext":true,"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건문 if 핵심을 확인합니다’ 확인 문제의 코드에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘조건문 if 핵심을 확인합니다’ 확인 문제의 코드에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if 핵심을 확인합니다’ 확인 문제의 코드에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문 if 핵심을 확인합니다’ 확인 문제의 코드에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건문 if 핵심을 확인합니다’ 확인 문제의 코드에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-p12-solution","kind":"solution","eyebrow":"정답과 풀이","title":"조건문 if 핵심을 확인합니다 · 풀이","paragraphs":["if score >= 60이 먼저 True가 되어 그 블록이 실행되면 같은 if/elif 묶음의 나머지 분기는 검사하지 않기 때문입니다. 구간 분기는 보통 더 구체적이거나 높은 기준부터 배치합니다."],"extras":[],"code":"stock = 0\n\nif stock == 0:\n    print(\"품절\")\nelse:\n    print(\"구매 가능\")","codeNote":"==는 “같은가?”를 묻습니다. stock이 0과 같아서 “품절”이 출력됩니다.","codeExplain":["1행 「stock = 0」 — 숫자 0을 구한 뒤 결과를 stock라는 변수에 저장합니다. 이 줄 이후에는 stock라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「if stock == 0:」 — stock와 0가 같은지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","4행 「print(\"품절\")」 — 문자열 \"품절\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건문 if 핵심을 확인합니다’ 풀이에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"구매 가능\")」 — 문자열 \"구매 가능\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c1-x01","kind":"concept","title":"if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’에서는 첫 코드 age = 15에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","조건문은 횡단보도와 비슷합니다. 초록불이면 건너고, 빨간불이면 기다립니다. 코드에서는 “이 조건이 맞나?”처럼 True 또는 False로 답할 수 있는 질문을 만듭니다.","if 뒤에는 질문이 옵니다. 질문이 True이면 들여쓰기된 코드를 실행하고, False이면 그 부분을 건너뜁니다.","age >= 13을 보면 기호부터 겁먹지 말고 “age가 13 이상인가?”라고 한국어로 읽으세요."],"keywords":["if","조건","True","False"],"calloutTitle":"초보 규칙","calloutBody":"조건식을 보면 먼저 한국어 질문으로 바꿔 읽습니다.","extras":[],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’ 내용을 설명하는 코드에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’ 내용을 설명하는 코드에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’ 내용을 설명하는 코드에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’ 내용을 설명하는 코드에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if는 “맞으면 이쪽, 아니면 저쪽”을 고르는 표지판입니다’ 내용을 설명하는 코드에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x02","kind":"example","title":"코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다","eyebrow":"초보 확장 · 예제","paragraphs":["age에 15를 넣고 13 이상인지 확인합니다. 15는 13 이상이므로 조건은 True입니다.","콜론(:) 뒤에서 들여쓰기된 print는 “조건이 맞을 때만 실행되는 줄”입니다.","실행 전에 먼저 True일지 False일지 말한 뒤 결과를 확인해 보세요."],"code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","bullets":["age = 15 → age에 15 저장","age >= 13 → True","들여쓰기된 print 실행","마지막 print는 if 밖이라 항상 실행"],"extras":[],"codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다’ 예제에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다’ 예제에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다’ 예제에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다’ 예제에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘코드를 한 줄씩 따라가면 if가 훨씬 쉬워집니다’ 예제에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x03","kind":"concept","title":">, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘>, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다’에서는 첫 코드 for age in [17, 18, 19]:에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.",">는 “더 크다”, >=는 “크거나 같다”입니다. 그래서 18 > 18은 False지만 18 >= 18은 True입니다.","==는 “같은가?”를 묻는 비교입니다. = 하나는 값을 저장하고, == 두 개는 같은지 묻습니다.","!=는 “같지 않은가?”입니다. password != \"1234\"는 비밀번호가 1234가 아닌지를 묻습니다."],"bullets":["= : 값을 저장","== : 같은지 비교","!= : 다른지 비교","> / \u003c : 더 큰지·작은지",">= / \u003c= : 같은 경우까지 포함"],"extras":[],"code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","codeExplain":["1행 「for age in [17, 18, 19]:」 — [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘>, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다’ 내용을 설명하는 코드에서는 1행은 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「print(age, age >= 18)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 조건식 age >= 18의 True/False 결과입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘>, >=, ==, !=는 비슷해 보여도 뜻이 다릅니다’ 내용을 설명하는 코드에서는 2행은 age, age >= 18의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x04","kind":"example","title":"18세 경계값으로 >와 >= 차이를 확인합니다","eyebrow":"초보 확장 · 예제","paragraphs":["나이 제한이 “18세 이상”이면 18도 포함해야 하므로 age >= 18이 맞습니다.","age > 18이라고 쓰면 18세는 탈락합니다. 문법 오류는 아니지만 규칙을 잘못 구현한 것입니다.","기준 숫자 바로 아래·같음·바로 위 값을 넣어 확인하는 습관을 들이세요."],"code":"for age in [17, 18, 19]:\n    print(age, age >= 18)","codeNote":"출력은 17 False, 18 True, 19 True입니다. “18세 이상”에서 18 자체가 포함된다는 점을 확인할 수 있습니다.","extras":[],"codeExplain":["1행 「for age in [17, 18, 19]:」 — [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘18세 경계값으로 >와 >= 차이를 확인합니다’ 예제에서는 1행은 [17, 18, 19]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「print(age, age >= 18)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 조건식 age >= 18의 True/False 결과입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘18세 경계값으로 >와 >= 차이를 확인합니다’ 예제에서는 2행은 age, age >= 18의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x05","kind":"concept","title":"if · elif · else는 여러 길 중 딱 한 길을 고릅니다","eyebrow":"초보 확장 · 개념","paragraphs":["‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’에서는 첫 코드 score = 85에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","if는 첫 번째 질문입니다. 틀리면 elif로 넘어가 다음 질문을 합니다. 앞 조건이 이미 맞았다면 뒤의 elif는 보지 않습니다.","else는 “앞의 모든 조건이 아니면”이라는 마지막 길입니다. else 뒤에는 조건을 쓰지 않습니다.","등급처럼 여러 범위를 나눌 때는 높은 기준부터 아래로 내려오면 읽기 쉽습니다."],"extras":[],"code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","codeExplain":["1행 「score = 85」 — 숫자 85을 구한 뒤 결과를 score라는 변수에 저장합니다. 이 줄 이후에는 score라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 1행은 85에서 만든 결과를 score에 저장하거나 갱신하는 줄입니다.","3행 「if score >= 90:」 — score가 90 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 3행은 score >= 90 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"A\")」 — 문자열 \"A\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 4행은 \"A\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「elif score >= 80:」 — 앞의 if·elif가 모두 False였을 때만 score가 80 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 5행은 앞 조건이 실패했을 때 score >= 80 조건을 추가로 확인하는 분기입니다.","6행 「print(\"B\")」 — 문자열 \"B\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 6행은 \"B\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","7행 「elif score >= 70:」 — 앞의 if·elif가 모두 False였을 때만 score가 70 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 7행은 앞 조건이 실패했을 때 score >= 70 조건을 추가로 확인하는 분기입니다.","8행 「print(\"C\")」 — 문자열 \"C\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 8행은 \"C\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","9행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 9행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","10행 「print(\"D\")」 — 문자열 \"D\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘if · elif · else는 여러 길 중 딱 한 길을 고릅니다’ 내용을 설명하는 코드에서는 10행은 \"D\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x06","kind":"example","title":"점수 등급을 위에서 아래로 읽어 봅니다","eyebrow":"초보 확장 · 예제","paragraphs":["score가 85이면 90 이상은 False라서 다음 elif로 갑니다. 80 이상은 True라서 B를 고르고 끝납니다.","그 뒤 70 이상 조건은 이미 한 길을 골랐으므로 보지 않습니다.","조건 순서는 결과를 바꿀 수 있습니다. 낮은 기준을 먼저 두지 않도록 주의하세요."],"code":"score = 85\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"D\")","codeNote":"85는 90 이상이 아니므로 첫 if를 지나고, 80 이상 조건이 True라서 B가 출력됩니다.","extras":[],"codeExplain":["1행 「score = 85」 — 숫자 85을 구한 뒤 결과를 score라는 변수에 저장합니다. 이 줄 이후에는 score라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘점수 등급을 위에서 아래로 읽어 봅니다’ 예제에서는 1행은 85에서 만든 결과를 score에 저장하거나 갱신하는 줄입니다.","3행 「if score >= 90:」 — score가 90 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘점수 등급을 위에서 아래로 읽어 봅니다’ 예제에서는 3행은 score >= 90 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"A\")」 — 문자열 \"A\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘점수 등급을 위에서 아래로 읽어 봅니다’ 예제에서는 4행은 \"A\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「elif score >= 80:」 — 앞의 if·elif가 모두 False였을 때만 score가 80 이상인지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다. ‘점수 등급을 위에서 아래로 읽어 봅니다’ 예제에서는 5행은 앞 조건이 실패했을 때 score >= 80 조건을 추가로 확인하는 분기입니다.","6행 「print(\"B\")」 — 문자열 \"B\"을 화면에 보여  풀이에서는 8행은 \"두꺼운 겉옷\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x09","kind":"practice","title":"영화 관람 나이 제한을 경계값까지 맞춰 보세요","eyebrow":"초보 확장 · 실습","paragraphs":["12세 미만은 관람 불가, 12세 이상은 관람 가능입니다. 11, 12, 13을 테스트합니다.","“12세 이상”이라는 말을 비교 연산자로 정확하게 옮기는 것이 목표입니다."],"practicePrompt":"age가 12 이상이면 “관람 가능”, 아니면 “관람 불가”를 출력하고 11, 12, 13을 모두 테스트하세요.","answerOnNext":true,"extras":[],"code":"for age in [11, 12, 13]:\n    if ____:\n        print(age, \"관람 가능\")\n    else:\n        print(age, \"관람 불가\")","codeNote":"정답 코드가 아니라 시작 코드입니다. ____ 또는 TODO 부분을 직접 채운 뒤 다음 페이지에서 정답과 풀이를 확인하세요.","codeExplain":["1행 「for age in [11, 12, 13]:」 — [11, 12, 13]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 실습에서는 1행은 [11, 12, 13]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「if ____:」 — ____가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 실습에서는 2행은 ____ 조건을 기준으로 실행 경로를 나누는 분기입니다.","3행 「print(age, \"관람 가능\")」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 문자열 \"관람 가능\"입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 실습에서는 3행은 age, \"관람 가능\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 실습에서는 4행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","5행 「print(age, \"관람 불가\")」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 문자열 \"관람 불가\"입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 실습에서는 5행은 age, \"관람 불가\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x10","kind":"solution","title":"영화 관람 나이 제한을 경계값까지 맞춰 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["“이상”에는 같은 값도 포함되므로 >=를 사용합니다.","12 > 12는 False이므로 >를 쓰면 12세가 잘못 탈락합니다.","기준보다 1 작은 값, 기준값, 1 큰 값을 넣으면 경계 실수를 쉽게 찾을 수 있습니다."],"code":"for age in [11, 12, 13]:\n    if age >= 12:\n        print(age, \"관람 가능\")\n    else:\n        print(age, \"관람 불가\")","codeNote":"11 관람 불가\n12 관람 가능\n13 관람 가능","extras":[],"codeExplain":["1행 「for age in [11, 12, 13]:」 — [11, 12, 13]에서 값을 하나씩 꺼내 age에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 풀이에서는 1행은 [11, 12, 13]에서 값을 하나씩 꺼내 age에 넣기 시작하는 반복 지점입니다.","2행 「if age >= 12:」 — age가 12 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","3행 「print(age, \"관람 가능\")」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 문자열 \"관람 가능\"입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 풀이에서는 3행은 age, \"관람 가능\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","4행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 풀이에서는 4행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","5행 「print(age, \"관람 불가\")」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 age의 현재 값, 2번째는 문자열 \"관람 불가\"입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. ‘영화 관람 나이 제한을 경계값까지 맞춰 보세요’ 풀이에서는 5행은 age, \"관람 불가\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x11","kind":"check","title":"and · or · not을 말로 읽어 보세요","eyebrow":"초보 확장 · 확인","paragraphs":["and는 “둘 다”, or는 “둘 중 하나라도”, not은 “반대로”입니다.","age >= 18 and has_ticket은 “18세 이상이고 티켓도 있는가?”입니다.","비교식이 길면 기호만 보지 말고 한국어 한 문장으로 읽어 보세요."],"question":"age=20, has_ticket=False일 때 age >= 18 and has_ticket의 결과는 True일까요 False일까요? 이유도 말해 보세요.","answerOnNext":true,"extras":[],"code":"age = 20\nhas_ticket = False\n\ncan_enter = age >= 18 and has_ticket\nprint(can_enter)","codeNote":"나이 조건은 True지만 티켓이 False라서 True and False의 결과는 False입니다.","codeExplain":["1행 「age = 20」 — 숫자 20을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and · or · not을 말로 읽어 보세요’ 확인 문제의 코드에서는 1행은 20에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","2행 「has_ticket = False」 — 참·거짓 값 False을 구한 뒤 결과를 has_ticket라는 변수에 저장합니다. 이 줄 이후에는 has_ticket라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and · or · not을 말로 읽어 보세요’ 확인 문제의 코드에서는 2행은 False에서 만든 결과를 has_ticket에 저장하거나 갱신하는 줄입니다.","4행 「can_enter = age >= 18 and has_ticket」 — 조건식 age >= 18 and has_ticket의 True/False 결과을 구한 뒤 결과를 can_enter라는 변수에 저장합니다. 이 줄 이후에는 can_enter라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and · or · not을 말로 읽어 보세요’ 확인 문제의 코드에서는 4행은 age >= 18 and has_ticket에서 만든 결과를 can_enter에 저장하거나 갱신하는 줄입니다.","5행 「print(can_enter)」 — can_enter의 현재 값을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘and · or · not을 말로 읽어 보세요’ 확인 문제의 코드에서는 5행은 can_enter의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x12","kind":"solution","title":"and · or · not을 말로 읽어 보세요 · 아주 쉬운 풀이","eyebrow":"초보 확장 · 풀이","paragraphs":["age >= 18은 True입니다. 20은 18 이상이기 때문입니다.","has_ticket은 False입니다. and는 양쪽이 모두 True여야 True입니다.","따라서 True and False는 False입니다."],"code":"age = 20\nhas_ticket = False\nprint(age >= 18 and has_ticket)","codeNote":"예상 출력: False","extras":[],"codeExplain":["1행 「age = 20」 — 숫자 20을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and · or · not을 말로 읽어 보세요’ 풀이에서는 1행은 20에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","2행 「has_ticket = False」 — 참·거짓 값 False을 구한 뒤 결과를 has_ticket라는 변수에 저장합니다. 이 줄 이후에는 has_ticket라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘and · or · not을 말로 읽어 보세요’ 풀이에서는 2행은 False에서 만든 결과를 has_ticket에 저장하거나 갱신하는 줄입니다.","3행 「print(age >= 18 and has_ticket)」 — 조건식 age >= 18 and has_ticket의 True/False 결과을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다."]},{"id":"t2-c1-x13","kind":"concept","title":"조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요","eyebrow":"초보 확장 · 개념","paragraphs":["‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’에서는 첫 코드 is_logged_in = True에서 시작해 조건식이 어떤 True/False를 만들고 그 결과가 어느 들여쓰기 블록을 선택하는지 실제 실행 순서대로 봅니다. 조건문은 외울 문법보다 ‘어느 경우에 어느 길을 택하는가’를 읽는 것이 먼저입니다.","if 안에 또 if를 넣을 수 있지만 들여쓰기가 깊어지면 초보자는 흐름을 놓치기 쉽습니다.","두 조건을 동시에 만족하면 되는 단순한 상황은 and가 더 읽기 쉬울 수 있습니다.","조건별로 서로 다른 실패 이유를 보여 줘야 하면 if/elif가 더 자연스럽습니다."],"extras":[],"code":"is_logged_in = True\nis_admin = False\n\nif is_logged_in and is_admin:\n    print(\"관리자 화면\")\nelse:\n    print(\"일반 화면\")","codeNote":"두 조건을 한 번에 읽을 수 있어서 if 안에 또 if를 넣는 것보다 흐름이 단순합니다.","codeExplain":["1행 「is_logged_in = True」 — 참·거짓 값 True을 구한 뒤 결과를 is_logged_in라는 변수에 저장합니다. 이 줄 이후에는 is_logged_in라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 1행은 True에서 만든 결과를 is_logged_in에 저장하거나 갱신하는 줄입니다.","2행 「is_admin = False」 — 참·거짓 값 False을 구한 뒤 결과를 is_admin라는 변수에 저장합니다. 이 줄 이후에는 is_admin라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 2행은 False에서 만든 결과를 is_admin에 저장하거나 갱신하는 줄입니다.","4행 「if is_logged_in and is_admin:」 — is_logged_in가 True인지 그리고 is_admin가 True인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 4행은 is_logged_in and is_admin 조건을 기준으로 실행 경로를 나누는 분기입니다.","5행 「print(\"관리자 화면\")」 — 문자열 \"관리자 화면\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 5행은 \"관리자 화면\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","6행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 6행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","7행 「print(\"일반 화면\")」 — 문자열 \"일반 화면\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘조건을 너무 깊게 겹치지 말고 한 문장으로 읽히게 만드세요’ 내용을 설명하는 코드에서는 7행은 \"일반 화면\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"id":"t2-c1-x14","kind":"example","title":"구매 가능 여부를 조건 세 개로 확인합니다","eyebrow":"초보 확장 · 예제","paragraphs":["상품을 사려면 재고가 있고 돈도 충분해야 합니다.","품절인지 먼저 확인하고, 그다음 돈이 부족한지 확인하면 실패 이유가 분명합니다.","성공이 확정된 else에서만 재고를 줄이는 것이 중요합니다."],"code":"stock = 2\ncash = 5000\nprice = 3000\n\nif stock == 0:\n    print(\"품절\")\nelif cash \u003c price:\n    print(\"금액 부족\")\nelse:\n    stock -= 1\n    print(\"구매 성공\", stock)","codeNote":"재고가 있고 돈도 충분하므로 else가 실행됩니다. 구매 뒤 stock은 1이 됩니다.","extras":[],"codeExplain":["1행 「stock = 2」 — 숫자 2을 구한 뒤 결과를 stock라는 변수에 저장합니다. 이 줄 이후에는 stock라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","2행 「cash = 5000」 — 숫자 5000을 구한 뒤 결과를 cash라는 변수에 저장합니다. 이 줄 이후에는 cash라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","3행 「price = 3000」 — 숫자 3000을 구한 뒤 결과를 price라는 변수에 저장합니다. 이 줄 이후에는 price라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다.","5행 「if stock == 0:」 — stock와 0가 같은지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다.","6행 「print(\"품절\")」 — 문자열 \"품절\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","7행 「elif cash \u003c price:」 — 앞의 if·elif가 모두 False였을 때만 cash 이 price보다 작은지 다시 확인합니다. 여기서 True가 되면 이 블록 하나를 실행하고 같은 분기의 뒤 조건은 더 보지 않습니다.","8행 「print(\"금액 부족\")」 — 문자열 \"금액 부족\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다.","9행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘구매 가능 여부를 조건 세 개로 확인합니다’ 예제에서는 9행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","10행 「stock -= 1」 — 현재 stock 값에 - 1 연산을 적용한 뒤 결과를 다시 stock에 저장합니다. 같은 변수의 이전 값이 새 값으로 바뀌는 줄입니다.","11행 「print(\"구매 성공\", stock)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"구매 성공\", 2번째는 stock의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다."]},{"kind":"summary","eyebrow":"Chapter 1 정리","title":"지금 알아야 할 것","paragraphs":["조건문 if 챕터의 목표는 문법을 외우는 것이 아니라 “조건에 따라 실행 경로를 나누고, 비교식과 논리 연산자를 이용해 실제 규칙을 코드로 표현한다.”를 실제 코드에서 할 수 있게 되는 것입니다.","이 챕터의 예제와 실습을 다시 보면서 각 줄이 어떤 값을 만들고, 어떤 조건에서 실행되며, 결과가 어디로 전달되는지 설명할 수 있으면 다음 단계로 넘어갈 준비가 된 것입니다.","다음 챕터에서는 반복문 for·while로 확장합니다. 지금 배운 개념이 다음 데이터 흐름에 어떻게 연결될지 한 문장으로 예상해 보세요.","복습할 때는 처음부터 모든 페이지를 다시 읽기보다, 확인 문제에서 막힌 개념과 실습에서 오류가 났던 부분을 우선적으로 다시 보는 편이 효율적입니다."],"bullets":["조건에 따라 실행 경로를 나누고, 비교식과 논리 연산자를 이용해 실제 규칙을 코드로 표현한다.","예제 값을 바꿔도 결과를 실행 전에 어느 정도 예측할 수 있다.","오류가 나면 문제 줄과 현재 값을 기준으로 원인을 좁힐 수 있다.","정상 입력뿐 아니라 경계값·잘못된 입력도 테스트한다."],"extras":[],"visibleExtras":2,"id":"t2-c1-p13","code":"age = 15\n\nif age >= 13:\n    print(\"청소년 이상\")\nelse:\n    print(\"어린이\")","codeNote":"15 >= 13은 True이므로 “청소년 이상”이 출력됩니다.","codeExplain":["1행 「age = 15」 — 숫자 15을 구한 뒤 결과를 age라는 변수에 저장합니다. 이 줄 이후에는 age라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. ‘지금 알아야 할 것’ 정리 코드에서는 1행은 15에서 만든 결과를 age에 저장하거나 갱신하는 줄입니다.","3행 「if age >= 13:」 — age가 13 이상인지 확인합니다. True이면 바로 아래 들여쓰기 블록을 실행하고 False이면 그 블록을 건너뜁니다. ‘지금 알아야 할 것’ 정리 코드에서는 3행은 age >= 13 조건을 기준으로 실행 경로를 나누는 분기입니다.","4행 「print(\"청소년 이상\")」 — 문자열 \"청소년 이상\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘지금 알아야 할 것’ 정리 코드에서는 4행은 \"청소년 이상\"의 실제 결과를 화면에서 확인하는 출력 단계입니다.","5행 「else:」 — 앞의 if와 elif가 모두 False였을 때 들어오는 마지막 경로입니다. 앞 조건들에 해당하지 않은 나머지 경우를 이 블록에서 처리합니다. ‘지금 알아야 할 것’ 정리 코드에서는 5행은 앞 조건에 하나도 해당하지 않은 나머지 경우가 들어오는 마지막 분기입니다.","6행 「print(\"어린이\")」 — 문자열 \"어린이\"을 화면에 보여 줍니다. 앞에서 저장하거나 계산한 값이 실제로 무엇인지 확인하는 출력 단계입니다. ‘지금 알아야 할 것’ 정리 코드에서는 6행은 \"어린이\"의 실제 결과를 화면에서 확인하는 출력 단계입니다."],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문제를 먼저 세우고 if가 실행 흐름을 어떻게 바꾸는지 작동 코드로 확인하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"conditional logic과 if 실행 흐름, 초보자가 값과 타입을 직접 출력해 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"새 문법을 독립적으로 외우지 않고 즉시 쓸 수 있는 문제 안에서 소개하는 방식 참고"}]}],"track":2,"id":"t2-c1","remember":"콜론·들여쓰기, =와 == 구분","practiceGoal":"등급 조건과 경계값 수정","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}],"references":[{"book":"Problem Solving with Python","author":"Michael D. Smith","year":2026,"note":"문제를 먼저 세우고 if가 실행 흐름을 어떻게 바꾸는지 작동 코드로 확인하는 방식 참고"},{"book":"Automate Excel with Python","author":"John Wengler","year":2026,"note":"conditional logic과 if 실행 흐름, 초보자가 값과 타입을 직접 출력해 확인하는 방식 참고"},{"book":"Coding for Chemists","author":"Christopher J. Johnson · Benjamin J. Lear","year":2026,"note":"새 문법을 독립적으로 외우지 않고 즉시 쓸 수 있는 문제 안에서 소개하는 방식 참고"}]},{"chapter":2,"title":"반복문 for·while","pages":[{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이번 단어장에서는 loop 반복문, for, while를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"loop 반복문","description":"반복문은 같은 종류의 일을 여러 번 시킬 때 씁니다. 상품 100개를 하나씩 확인해야 한다면 코드를 100번 복사하는 대신 반복문 하나로 처리합니다. 반복할 대상과 멈추는 기준을 먼저 생각하면 쉽습니다.","usage":"목록의 모든 항목 처리, 여러 번 재시도, 누적 계산 등에 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: for name in names: 는 names의 각 값을 차례대로 처리합니다."},{"term":"for","description":"for는 ‘여기 있는 값을 하나씩 꺼내 같은 일을 해’라는 뜻에 가깝습니다. 리스트나 range처럼 처리할 대상이 이미 정해져 있을 때 잘 맞습니다. 반복할 때마다 변수에는 다음 값이 차례대로 들어갑니다.","usage":"목록 전체 순회, 정해진 횟수 반복에 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: for i in range(3): 는 0, 1, 2 세 번 반복합니다."},{"term":"while","description":"while은 ‘이 조건이 True인 동안 계속 반복해’라는 뜻입니다. 몇 번 반복할지보다 언제 끝날지가 중요한 상황에서 사용합니다. 조건에 쓰인 값이 반복 안에서 바뀌지 않으면 끝나지 않을 수 있습니다.","usage":"사용자 입력 재요청, 상태가 바뀔 때까지 반복 등에 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: while attempts \u003c 3: 은 attempts가 3 미만인 동안 반복합니다."}],"extras":[],"visibleExtras":2,"id":"t2-c2-p1","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. loop 반복문, for, while를 실제 코드와 연결해서 보면 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. loop 반복문, for, while를 실제 코드와 연결해서 보면 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. loop 반복문, for, while를 실제 코드와 연결해서 보면 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["이번 단어장에서는 iteration 반복 1회, range 범위, break / continue를 다룹니다. 각 용어를 따로 외우기보다 바로 아래 예제 코드에서 어떤 기호·변수·줄을 가리키는지 연결하면 실제 뜻이 훨씬 쉽게 잡힙니다."],"glossary":[{"term":"iteration 반복 1회","description":"iteration은 반복문 안의 코드를 처음부터 끝까지 한 번 실행한 것입니다. 가격이 세 개라면 첫 번째 가격 처리 1회, 두 번째 가격 처리 1회, 세 번째 가격 처리 1회가 생깁니다.","usage":"반복 과정을 한 단계씩 추적할 때 사용합니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 세 번 반복하면 iteration이 3회 발생합니다."},{"term":"range 범위","description":"range는 연속된 정수 흐름을 만들어 줍니다. range(1, 6)은 1, 2, 3, 4, 5를 만들고 끝 값 6은 포함하지 않습니다. for와 함께 반복 횟수를 숫자로 정할 때 자주 씁니다.","usage":"정해진 횟수나 인덱스 범위를 만들 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: range(1, 4)는 1, 2, 3을 만듭니다."},{"term":"break / continue","description":"break는 반복문 전체를 즉시 끝냅니다. continue는 이번 반복의 남은 코드만 건너뛰고 다음 반복으로 갑니다. ‘전체 종료’와 ‘이번 항목만 패스’의 차이입니다.","usage":"특정 조건에서 조기 종료하거나 일부 항목만 건너뛸 때 씁니다. 처음에는 이 용어가 코드의 어느 부분을 가리키는지만 찾을 수 있어도 충분합니다.","example":"예: 값이 음수면 continue로 해당 항목만 건너뛸 수 있습니다."}],"extras":[],"visibleExtras":2,"id":"t2-c2-p2","code":"tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]\n\nfor task in tasks:\n    print(\"처리:\", task)","codeNote":"리스트에서 task를 하나씩 꺼내 같은 작업을 세 번 반복합니다.","codeExplain":["1행 「tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]」 — 여러 값을 순서대로 담은 리스트 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]을 구한 뒤 결과를 tasks라는 변수에 저장합니다. 이 줄 이후에는 tasks라는 이름으로 방금 만든 값을 다시 사용할 수 있습니다. iteration 반복 1회, range 범위, break / continue를 실제 코드와 연결해서 보면 1행은 [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 만든 결과를 tasks에 저장하거나 갱신하는 줄입니다.","3행 「for task in tasks:」 — tasks에서 값을 하나씩 꺼내 task에 넣습니다. 값을 하나 넣을 때마다 아래 들여쓰기 블록을 한 번 실행하고, 그다음 값으로 바꿔 다시 실행합니다. iteration 반복 1회, range 범위, break / continue를 실제 코드와 연결해서 보면 3행은 tasks에서 값을 하나씩 꺼내 task에 넣기 시작하는 반복 지점입니다.","4행 「print(\"처리:\", task)」 — print 안의 값을 왼쪽부터 차례대로 같은 출력에 보여 줍니다. 1번째는 문자열 \"처리:\", 2번째는 task의 현재 값입니다. 이 줄에서 계산값과 조건 결과를 함께 보면 바로 앞 흐름이 예상대로 움직였는지 확인할 수 있습니다. iteration 반복 1회, range 범위, break / continue를 실제 코드와 연결해서 보면 4행은 \"처리:\", task의 실제 결과를 화면에서 확인하는 출력 단계입니다."]},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 1/6","title":"for는 “각 항목에 같은 규칙 적용”에 강합니다","paragraphs":["‘for는 “각 항목에 같은 규칙 적용”에 강합니다’에서는 첫 코드 tasks = [\"메일 확인\", \"자료 정리\", \"보고서 저장\"]에서 시작해 한 번의 반복에서 어떤 값이 변수에 들
