다고 말했는가’와 ‘무엇이 실제 evidence로 확인됐는가’를 분리합니다.","단어를 외우는 것보다 실제 코드에서 이 단어가 무엇을 가리키는지 알아보는 것이 더 중요합니다. 아래 설명은 처음 배우는 사람이 바로 떠올릴 수 있도록 일상적인 상황과 코드 상황을 함께 연결합니다."],"glossary":[{"term":"hallucination 환각","description":"환각은 AI가 실제로 확인하지 않았거나 존재하지 않는 내용을 그럴듯하게 말하는 현상입니다. 그래서 ‘완료했다’는 말보다 실제 파일과 테스트 결과를 확인해야 합니다.","usage":"존재하지 않는 파일·함수·실행 결과를 AI가 말할 가능성을 경계할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실제 실행하지 않았는데 ‘테스트 20개 통과’라고 답하는 경우."},{"term":"verification 검증","description":"검증은 ‘맞는 것 같다’가 아니라 실제 결과로 맞는지 확인하는 일입니다. 같은 입력으로 다시 실행하거나 테스트를 돌려 기대 결과가 나오는지 확인합니다.","usage":"작업 완료 판단 전에 반드시 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 실제 앱을 열고 수정 기능이 동작하는지 확인합니다."},{"term":"test 테스트","description":"테스트는 프로그램이 우리가 정한 규칙대로 움직이는지 실제로 확인하는 일입니다. ‘아마 맞겠지’ 대신 입력을 넣고 결과를 비교합니다.","usage":"AI가 만든 코드가 기존 규칙을 지키는지 자동 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 수정 전후 같은 test suite를 실행합니다."},{"term":"regression 회귀","description":"회귀는 새로 고친 뒤 예전에 잘 되던 기능이 다시 망가지는 것입니다. 그래서 수정 뒤에는 새 문제뿐 아니라 기존 기능도 다시 테스트합니다.","usage":"AI가 요청한 부분 외에 기존 기능을 깨지 않았는지 확인할 때 씁니다. 처음에는 이 단어를 봤을 때 ‘지금 코드의 어느 부분을 말하는 거지?’라고 위치를 찾는 정도면 충분합니다.","example":"예: 배송비 수정 후 쿠폰 계산이 깨지는 경우."}]},{"id":"t3-c8-slow-start","kind":"concept","eyebrow":"CHAPTER 08 · 아주 천천히 시작하기","title":"AI 코딩에서도 사람이 정답의 기준을 잡아야 합니다","paragraphs":["AI에게 ‘앱 만들어 줘’, ‘이 코드 고쳐 줘’라고 말하면 AI는 매우 빠르게 많은 코드를 만들 수 있습니다. 하지만 빠르게 만들었다는 것과 내가 원한 것이 정확히 만들어졌다는 것은 다른 문제입니다.","AI는 사용자가 말하지 않은 부분을 스스로 추측할 수 있습니다. 예를 들어 배송비 오류만 고치고 싶었는데, 요청이 모호하면 AI가 함수 이름이나 다른 정책까지 함께 바꿀 수도 있습니다.","그래서 사람은 코드를 전부 직접 쓰지 않더라도 네 가지를 잡아야 합니다. 무엇을 바꿀지, 지금 실제 문제가 무엇인지, 무엇은 건드리면 안 되는지, 어떤 결과면 완료인지입니다.","그다음 AI가 만든 변경을 보고 실제 테스트 결과를 확인합니다. 이 흐름을 지키면 AI는 단순한 ‘자동 코드 작성기’가 아니라 사람이 통제할 수 있는 빠른 작업 도구가 됩니다."]},{"id":"t3-c8-p1","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"AI에게 넘겨도 되는 것은 구현 속도이고, 목표 판단은 사람이 잡습니다","paragraphs":["AI가 코드를 대신 많이 써 주더라도 사람이 해야 할 일이 없어지는 것은 아닙니다. 오히려 ‘무엇을 만들 것인지’와 ‘어떤 결과면 맞는 것인지’를 사람이 더 분명히 잡아야 합니다.","AI는 사용자가 준 정보 안에서 매우 빠르게 코드를 만들지만, 사용자의 머릿속 목표를 자동으로 정확히 알 수는 없습니다. 빈 정보가 있으면 그 부분을 추측해서 채울 수 있습니다.","그래서 AI 코딩에서 사람의 핵심 역할은 모든 문법을 외워 직접 타이핑하는 것이 아니라 목표, 범위, 지켜야 할 것, 완료 기준을 정하고 결과를 검증하는 것입니다.","AI는 코드 초안, 반복 수정, 파일 비교 같은 작업을 빠르게 할 수 있습니다. 하지만 ‘무엇을 만들어야 하는가’와 ‘이 결과가 우리 목적에 맞는가’는 사용자가 통제해야 합니다.","요청이 모호하면 AI는 빈칸을 자기 추측으로 채웁니다. 때로는 그 추측이 괜찮지만, 앱의 기존 기능이나 데이터처럼 중요한 부분에서는 위험할 수 있습니다.","그래서 좋은 AI 코딩은 긴 프롬프트를 쓰는 기술이 아니라, 목표·현재 상태·제약·완료 기준을 빠뜨리지 않는 작업 관리에 가깝습니다.","트랙 3에서 배운 문제 분해가 그대로 사용됩니다. 큰 요청을 작게 나누고, 각 단계마다 무엇이 바뀌어야 하는지와 어떻게 검증할지를 정합니다."]},{"id":"t3-c8-flow","kind":"visual","eyebrow":"흐름으로 이해하기","title":"AI 작업도 문제 해결의 같은 순서를 따릅니다","paragraphs":["AI를 사용해도 문제 해결의 기본 순서는 달라지지 않습니다. 사람이 직접 코드를 쓰던 때와 똑같이 문제를 정의하고, 작은 단계로 나누고, 실행 결과를 확인해야 합니다.","달라지는 점은 구현 속도입니다. AI가 코드 초안을 빠르게 만들 수 있으므로 사람은 diff를 보고 필요한 변경만 들어갔는지, 테스트가 통과했는지 확인하는 데 더 집중할 수 있습니다.","한 번에 큰 앱 전체를 맡기기보다 작은 변경 하나를 만들고 확인한 뒤 다음으로 가면 문제가 생겨도 어디서 틀렸는지 찾기 쉽습니다.","AI가 들어와도 기본 흐름은 달라지지 않습니다. 요구사항을 정하고, 작은 작업으로 나누고, 변경을 만들고, 실제 증거로 검증합니다.","차이는 구현을 사람이 직접 모두 작성하지 않아도 된다는 점입니다. 대신 review와 verification의 중요성이 더 커집니다.","각 단계가 성공해야 다음 단계로 넘어가면 큰 실패를 작게 제한할 수 있습니다."],"visual":"AI_WORKFLOW","bullets":["목표·현재 상태 정리","constraint와 non-goal 고정","acceptance criteria 작성","작은 patch 요청","diff review","test·실행 evidence 확인","checkpoint 저장 후 다음 단계"]},{"id":"t3-c8-p2","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"좋은 요청은 ‘목표 + 현재 + 제약 + 완료 기준’ 네 덩어리면 충분합니다","paragraphs":["AI에게 좋은 지시를 쓰기 위해 특별한 문장 기술을 외울 필요는 없습니다. 필요한 정보 네 덩어리만 빠뜨리지 않으면 됩니다.","첫째는 무엇을 바꿀지인 목표입니다. 둘째는 지금 실제로 어떤 상태인지입니다. 셋째는 무엇을 건드리면 안 되는지인 제약입니다. 넷째는 어떤 결과가 나오면 완료인지인 완료 기준입니다.","예를 들어 ‘배송비 고쳐줘’보다 ‘50000원에서 3000이 나오는 경계 오류만 수정하고 함수 이름은 유지하며 49999/50000/50001 테스트가 모두 통과해야 한다’가 훨씬 명확합니다.","AI에게 모든 배경을 장황하게 설명할 필요는 없습니다. 필요한 정보가 구조적으로 들어 있으면 짧아도 좋은 요청이 됩니다.","목표에는 무엇을 바꿀지, 현재 상태에는 지금 어떤 문제가 있는지, constraint에는 지켜야 할 기존 기능을, acceptance criteria에는 완료를 어떻게 확인할지 적습니다.","예를 들어 ‘배송비 경계 오류 수정’이라는 목표 아래 ‘50000에서 3000이 나온다’는 현재 증상, ‘다른 가격 정책 변경 금지’라는 제약, ‘49999/50000/50001 테스트 통과’라는 완료 기준을 붙입니다.","이 정도면 AI가 범위를 벗어나 UI를 고치거나 구조 전체를 재설계할 이유가 크게 줄어듭니다."]},{"id":"t3-c8-example1","kind":"example","eyebrow":"예제로 연결하기","title":"모호한 요청을 검증 가능한 작업 지시로 바꿉니다","paragraphs":["모호한 요청은 AI가 스스로 많은 결정을 하게 만듭니다. 스스로 결정하는 부분이 많을수록 사용자가 원하지 않은 변경이 섞일 가능성도 커집니다.","반대로 현재 증상과 숫자 기준, 수정 범위, 완료 기준을 적으면 AI가 추측해야 할 빈칸이 줄어듭니다.","좋은 지시는 길어서 좋은 것이 아닙니다. ‘무엇을 고칠지, 무엇은 유지할지, 어떻게 확인할지’가 분명해서 좋은 것입니다.","‘배송비 코드 좀 고쳐줘’는 AI가 무엇을 문제로 봐야 할지 모호합니다. 아래처럼 실제 증상과 완료 기준을 넣으면 작업의 성공 여부가 분명해집니다.","중요한 것은 문장이 길어서가 아니라 확인 가능한 숫자와 범위가 들어 있다는 점입니다.","특히 non-goal을 적으면 요청과 상관없는 ‘친절한 대개편’을 줄일 수 있습니다."],"code":"목표:\n- shipping_fee()의 무료배송 경계 오류만 수정\n\n현재 증상:\n- total=50000일 때 3000이 반환됨\n- 기대값은 0\n\n제약:\n- 함수 이름과 반환 형식 유지\n- 다른 파일의 가격 정책 수정 금지\n\n완료 기준:\n- 49999 -> 3000\n- 50000 -> 0\n- 50001 -> 0\n- 기존 테스트 모두 통과\n\n비목표:\n- UI, DB, 함수 구조 재설계","codeNote":"이 요청은 AI가 수정 범위와 성공 기준을 스스로 추측할 필요를 줄여 줍니다.","codeExplain":["1단계: 목표: 이번에 바꿀 한 가지를 고정합니다.","2단계: 현재 증상: 실제 관찰값을 제공합니다.","3단계: 제약: 보존해야 할 인터페이스와 영역을 적습니다.","4단계: 완료 기준: 테스트 가능한 입력·출력으로 끝을 정의합니다.","5단계: 비목표: 이번 작업에서 하지 않을 일을 명시합니다."]},{"id":"t3-c8-p3","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"코드 전체보다 diff를 먼저 보면 불필요한 변경이 보입니다","paragraphs":["AI가 파일을 고친 뒤 전체 파일을 처음부터 읽는 것보다 diff를 먼저 보면 훨씬 쉽습니다. diff는 바뀐 줄만 보여 줍니다.","예를 들어 원래 total > 50000이었는데 total >= 50000으로 바뀌었다면 그 한 줄 차이를 바로 확인할 수 있습니다.","그다음 요청하지 않은 다른 함수나 파일까지 바뀌었는지 봅니다. 필요 없는 변경이 많으면 나중에 버그가 생겼을 때 원인 범위도 커집니다.","AI가 파일을 수정한 뒤 완성된 전체 코드만 보면 원래 무엇이 달라졌는지 찾기 어렵습니다. diff는 추가된 줄과 삭제된 줄을 중심으로 보여 줍니다.","review할 때는 세 가지를 봅니다. 요청한 줄이 바뀌었는가, 요청하지 않은 중요한 부분도 바뀌었는가, 테스트가 변경된 구현을 제대로 검증하는가.","AI가 ‘정리하는 김에’ 함수 이름이나 데이터 형식까지 바꿨다면 scope를 넘어선 변경일 수 있습니다. 필요하면 해당 patch를 줄여 달라고 요청합니다.","작은 diff는 정확성을 높일 뿐 아니라 문제 발생 시 rollback도 쉽습니다."]},{"id":"t3-c8-p4","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"AI의 ‘완료’와 실제 완료를 분리합니다","paragraphs":["AI가 ‘완료했습니다’라고 말하는 것과 실제로 작업이 완료된 것은 같은 뜻이 아닙니다. AI가 테스트를 실행할 수 없는 환경인데도 코드만 보고 맞다고 판단했을 수 있습니다.","그래서 완료 기준마다 확인할 증거가 필요합니다. 테스트 PASS 로그, 빌드 성공 결과, 실제 화면, 생성된 파일처럼 사람이 다시 확인할 수 있는 것이 좋습니다.","‘무엇을 했다고 말했는가’와 ‘무엇이 실제로 확인됐는가’를 분리하는 습관이 AI 코딩에서 매우 중요합니다.","AI가 ‘수정 완료, 테스트 통과’라고 말해도 실제 실행 evidence가 없다면 검증된 완료로 취급하지 않는 습관이 중요합니다.","가능하다면 테스트 로그, 빌드 결과, 실제 화면, 생성된 파일 같은 evidence를 확인합니다. 도구 접근이 없어 실행하지 못했다면 그 사실도 완료 보고에 분명히 남아야 합니다.","이 기준은 AI를 불신하자는 뜻이 아닙니다. 사람 개발자도 기억이나 추측만으로 완료를 판단하면 실수할 수 있습니다. 소프트웨어에서는 실행 결과가 가장 강한 증거입니다.","특히 파일이 실제로 저장됐는지, 운영본이 새 버전을 가리키는지처럼 ‘작업 결과가 존재하는가’를 확인해야 합니다."]},{"id":"t3-c8-example2","kind":"example","eyebrow":"예제로 연결하기","title":"작은 patch와 테스트를 한 세트로 요청합니다","paragraphs":["코드 수정만 요청하면 같은 문제가 나중에 다시 생길 수 있습니다. 그래서 중요한 버그는 수정과 테스트를 한 세트로 요청하는 편이 좋습니다.","50000원 무료배송 버그를 고쳤다면 50000을 넣어 0이 나오는 테스트도 같이 남깁니다. 이후 다른 AI가 코드를 바꿔도 테스트가 같은 실수를 잡아 줍니다.","이렇게 구현 변경과 검증 기준을 함께 남기면 사람이 과거 대화를 다시 기억하지 않아도 됩니다.","아래 예시는 구현 변경과 회귀 방지 테스트를 같이 요구하는 방식입니다. AI에게 ‘고쳐라’만 말하는 대신 ‘이 규칙을 테스트로 남겨라’까지 포함합니다.","이렇게 하면 나중에 또 다른 AI가 코드를 수정하더라도 경계 규칙이 자동으로 확인됩니다.","테스트 자체의 기대값이 요구사항과 맞는지는 사람이 review해야 합니다."],"code":"작업:\n1. shipping_fee(total)에서 50000원도 무료배송에 포함되게 수정\n2. 아래 회귀 테스트를 추가\n   - 49999 -> 3000\n   - 50000 -> 0\n   - 50001 -> 0\n3. 다른 동작은 변경하지 않기\n4. diff와 실제 테스트 결과를 함께 보고","codeNote":"목표 변경과 검증을 한 patch로 묶되 범위는 shipping_fee와 해당 테스트로 제한합니다.","codeExplain":["1단계: 구현 변경은 한 규칙에 집중합니다.","2단계: 과거 실패 입력을 regression test로 남깁니다.","3단계: 다른 동작 보존을 constraint로 둡니다.","4단계: 마지막 보고에는 diff와 evidence를 요구합니다."]},{"id":"t3-c8-p5","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"큰 작업은 checkpoint 사이의 작은 작업들로 나눕니다","paragraphs":["큰 작업을 한 번에 맡기면 결과가 빨리 나올 수 있지만, 실패했을 때 어디서 잘못됐는지 찾기 어려워집니다.","예를 들어 ‘앱 전체 완성’ 대신 데이터 저장 수정 → 테스트 → 화면 연결 → 실제 화면 확인 순서로 나눌 수 있습니다. 각 단계가 정상일 때만 다음 단계로 갑니다.","정상인 시점을 체크포인트로 남겨 두면 다음 단계가 실패해도 처음부터 다시 하지 않고 마지막 정상 지점으로 돌아갈 수 있습니다.","앱 전체를 한 번에 ‘완성해’라고 맡기면 수십 파일이 동시에 바뀌고 어느 시점부터 잘못됐는지 찾기 어려워질 수 있습니다.","대신 데이터 구조 수정 → 테스트 통과 → UI 연결 → 실제 화면 확인처럼 단계로 나누고, 각 단계가 검증될 때 checkpoint를 남깁니다.","다음 단계에서 문제가 생기면 마지막 안정 checkpoint로 rollback할 수 있습니다. 이미 끝난 단계 전체를 다시 만들 필요가 없습니다.","이 방식은 긴 AI 작업에서 문맥이 일부 사라져도 handoff를 통해 현재 위치를 복원하기 쉽습니다."]},{"id":"t3-c8-p6","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"handoff에는 ‘무엇을 했는가’보다 ‘현재 상태가 무엇인가’를 남깁니다","paragraphs":["다른 AI에게 작업을 넘길 때 긴 대화를 전부 복사할 필요는 없습니다. 지금 실제로 어떤 파일이 정본인지, 어디까지 끝났는지, 무엇이 실패했는지를 남기는 것이 더 중요합니다.","예를 들어 ‘현재 정본은 live/content.json, Track 3 Chapter 1~5 완료, Chapter 6 테스트 실패, 마지막 정상 커밋은 ○○’처럼 적으면 바로 이어서 작업할 수 있습니다.","좋은 인계는 과거 이야기 모음이 아니라 현재 작업 상태를 복원할 수 있는 설명서입니다.","다른 AI가 이어서 작업할 때 긴 대화 전체를 다시 읽게 하는 것보다 현재 정본, 완료된 범위, 남은 문제, 실패한 시도, 검증 evidence를 짧게 정리하는 것이 좋습니다.","특히 ‘건드리면 안 되는 것’과 마지막 안정 checkpoint를 남기면 반복 작업과 되돌림 사고를 줄일 수 있습니다.","handoff는 설명문이 아니라 작업 상태 파일에 가깝습니다. 파일 경로, 버전, 테스트 결과처럼 다시 확인 가능한 정보를 우선합니다.","이 원칙을 지키면 AI가 바뀌어도 프로젝트의 의사결정과 현재 상태가 이어집니다."]},{"id":"t3-c8-p7","kind":"concept","eyebrow":"CHAPTER 08 · 핵심 이해","title":"환각을 줄이는 가장 좋은 방법은 확인 가능한 대상을 지정하는 것입니다","paragraphs":["AI 환각을 줄이려면 AI에게 확인할 수 있는 실제 대상을 주는 것이 가장 효과적입니다. 파일 이름, 브랜치, 오류 로그, 실제 URL처럼 구체적인 대상을 지정합니다.","‘최신 거 알아서 찾아’보다 ‘coding-roadmap-live 브랜치의 live/content.json을 기준으로 수정’이라고 하면 잘못된 버전을 잡을 가능성이 줄어듭니다.","작업 뒤에도 ‘됐어?’라고 묻는 것보다 실제 커밋, 테스트 결과, 배포 채널이 무엇을 가리키는지 확인하면 훨씬 안전합니다.","AI에게 ‘알아서 최신 파일을 찾아’라고만 하면 잘못된 버전이나 존재하지 않는 경로를 가정할 수 있습니다. 가능한 경우 정본 파일, 브랜치, URL, 버전을 직접 지정합니다.","작업 후에도 ‘고쳤다’는 문장 대신 실제 파일의 변경, 커밋, 테스트 결과처럼 확인 가능한 대상을 요구합니다.","AI가 도구로 확인할 수 없는 부분은 ‘미확인’으로 남기는 것이 정상입니다. 확인하지 못한 내용을 확정처럼 말하는 것이 더 위험합니다.","사람의 역할은 AI보다 코드를 더 빨리 쓰는 것이 아니라, 어떤 evidence가 충분한지 판단하는 것입니다."]},{"id":"t3-c8-practice","kind":"practice","eyebrow":"직접 풀어보기","title":"모호한 AI 요청을 작업 지시서로 바꾸세요","paragraphs":["이 실습에서는 코드를 직접 쓰는 대신 AI에게 줄 작업 지시를 설계합니다. 핵심은 말을 멋있게 쓰는 것이 아니라 AI가 추측할 부분을 줄이는 것입니다.","실제 증상, 수정할 범위, 보존할 것, 완료 기준, 확인할 증거를 각각 적으면 작업의 시작과 끝이 분명해집니다.","상황: 주문 앱에서 50000원 주문이 무료배송이어야 하는데 3000원이 붙습니다. 다른 금액의 배송비 규칙과 UI는 지금 잘 동작합니다.","AI에게 ‘이거 고쳐줘’라고만 하지 말고 목표, 현재 증상, scope, constraint, acceptance criteria, non-goal을 각각 한 줄 이상 적어 보세요.","마지막에는 어떤 evidence를 보고 완료를 판단할지도 적습니다."],"practicePrompt":"아래 틀의 빈칸을 채워 AI에게 그대로 줄 수 있는 작업 지시를 만드세요.","code":"목표:\n- __________________\n\n현재 증상:\n- __________________\n\nscope:\n- __________________\n\nconstraint:\n- __________________\n\nacceptance criteria:\n- __________________\n- __________________\n- __________________\n\nnon-goal:\n- __________________\n\n완료 evidence:\n- __________________","answerOnNext":true},{"id":"t3-c8-practice-solution","kind":"solution","eyebrow":"정답과 풀이","title":"모호한 AI 요청을 작업 지시서로 바꾸세요 · 풀이","paragraphs":["풀이 예시는 하나의 정답 문장을 외우는 것이 아니라 필요한 정보가 모두 들어 있는 형태를 보여 줍니다. 같은 구조를 다른 기능에도 그대로 적용할 수 있습니다.","정답 문장은 여러 가지가 가능하지만, 실제 관찰값과 보존 조건, 테스트 가능한 완료 기준이 모두 들어가야 합니다.","아래 예시는 shipping_fee 함수와 테스트만 수정 범위로 잡고 UI와 다른 가격 정책은 비목표로 둡니다.","완료 evidence는 말로 된 보고가 아니라 diff와 실제 테스트 결과를 요구합니다."],"code":"목표:\n- 50000원 무료배송 경계 오류 수정\n\n현재 증상:\n- total=50000에서 shipping_fee()가 3000을 반환함\n\nscope:\n- shipping_fee 함수와 해당 테스트만\n\nconstraint:\n- 함수 이름·반환 형식·다른 배송비 정책 유지\n\nacceptance criteria:\n- 49999 -> 3000\n- 50000 -> 0\n- 50001 -> 0\n\nnon-goal:\n- UI, DB, 다른 가격 정책 변경\n\n완료 evidence:\n- 실제 diff + 테스트 실행 결과","codeNote":"이 정도면 AI가 무엇을 바꿔야 하고 무엇을 바꾸면 안 되는지, 언제 완료인지 명확합니다."},{"id":"t3-c8-check","kind":"check","eyebrow":"확인 문제","title":"AI 협업에서 사람의 핵심 역할을 확인합니다","paragraphs":["이 확인 문제는 AI의 설명이 아니라 실제 변경과 실행 결과를 기준으로 완료를 판단하는 습관을 확인합니다.","AI가 코드를 많이 작성할수록 사람이 모든 문법을 직접 외울 필요는 줄 수 있습니다. 하지만 목표와 검증 기준을 잡는 역할은 더 중요해집니다.","다음 질문에 acceptance criteria와 evidence를 사용해 답해 보세요."],"question":"AI가 ‘문제 수정 완료’라고 답했는데 실제 테스트 결과나 변경 diff가 없다면, 왜 아직 검증된 완료라고 보기 어려울까요?","answerOnNext":true},{"id":"t3-c8-check-solution","kind":"solution","eyebrow":"정답과 풀이","title":"AI 협업에서 사람의 핵심 역할을 확인합니다 · 풀이","paragraphs":["풀이 예시는 하나의 정답 문장을 외우는 것이 아니라 필요한 정보가 모두 들어 있는 형태를 보여 줍니다. 같은 구조를 다른 기능에도 그대로 적용할 수 있습니다.","완료라는 말만으로는 acceptance criteria가 실제로 충족됐는지 확인할 수 없습니다. AI가 실행하지 않았거나 다른 파일을 수정했을 가능성도 있습니다.","diff로 scope 안의 변경인지 review하고, 실제 테스트·빌드·화면 같은 evidence로 기준을 충족했는지 verification해야 검증된 완료에 가까워집니다."]},{"id":"t3-c8-summary","kind":"summary","eyebrow":"Chapter 8 정리","title":"트랙 3의 끝은 ‘AI에게 잘 시키기’가 아니라 ‘문제를 통제하며 협업하기’입니다","paragraphs":["AI와 코딩할 때 가장 중요한 능력은 프롬프트 문장을 화려하게 쓰는 것이 아닙니다. 목표와 범위를 정하고, AI가 실제로 무엇을 바꿨는지 보고, 테스트와 결과로 확인하는 능력이 더 중요합니다.","트랙 3에서 배운 문제 분해, 상태 추적, 제어 흐름, 함수, 디버깅, 테스트는 AI 시대에도 그대로 중요합니다. AI는 이 과정을 대신 없애는 것이 아니라 구현 속도를 높이는 도구입니다.","좋은 협업은 목표·context·constraint·acceptance criteria를 명확히 하고, 작은 patch를 diff로 review한 뒤 실제 evidence로 verification하는 흐름입니다.","이 과정을 익히면 긴 코드를 처음부터 직접 쓰지 않아도 AI가 만든 결과를 읽고 수정 범위를 지시하며, 잘못된 변경을 되돌리고, 다음 AI에게 작업 상태를 정확히 넘길 수 있습니다.","다음 트랙부터는 웹·TypeScript·데이터·API 같은 실제 기술을 배우게 됩니다. 새로운 기술을 만날 때도 트랙 3의 문제 해결 순서를 그대로 적용하면 됩니다."],"bullets":["AI에게 목표·현재 상태·제약·완료 기준을 함께 준다.","큰 작업을 작은 patch와 checkpoint로 나눈다.","전체 코드보다 diff로 실제 변경을 먼저 본다.","AI의 완료 보고와 실제 evidence를 분리한다.","문제가 생기면 rollback 가능한 상태를 유지하고 handoff로 현재 정본을 남긴다."]}]}],"audit":{"originalPages":208,"removedRepeatedParagraphs":96,"solutionsAdded":32,"track3Completed":true,"track3ChapterCount":8,"removedExperimentalChapter13":true,"contentEngine":"ChatBook 1.2 + ultra-easy detailed textbook prose","track3BeginnerRewrite":true,"track3ExplanationLevel":"asked-again ultra-beginner textbook"}}</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course').textContent);
const chapters=COURSE.chapters;
const native=window.RoadmapNative;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const defaults={schema:1,version:2,location:chapters[0].pages[0].id,bookmarks:[],notes:{},complete:[],visited:[],migrated:false};
let state;
try{state=JSON.parse(native?native.getState():localStorage.getItem('codingroadmap-live-state')||'{}')}catch(e){state={}}
state=Object.assign({},defaults,state);
for(const k of ['bookmarks','complete','visited'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.notes||typeof state.notes!=='object'||Array.isArray(state.notes))state.notes={};
let route='home';
let current=locate(state.location)||{c:0,p:0};
let selectedTrack=chapters[current.c].track;
let focus=false;
let searchQuery='';
let savedFilter='all';
let updateStatus=native?native.getStatus():'저장된 교재';
let toastTimer;
let physicalPage=0;
let physicalPages=1;
let pendingTargetId=state.location;
let pendingLast=false;
let pendingPhysicalRatio=null;
let pageTurnActive=false;
let trackSlideMap={track:null,key:'',entries:[],byId:{},total:1,ready:false};
let previewRoute='';
try{if(typeof location!=='undefined')previewRoute=new URLSearchParams(location.search).get('preview')||''}catch(e){}

function locate(id){
  for(let c=0;c<chapters.length;c++){
    const p=chapters[c].pages.findIndex(x=>x.id===id);
    if(p>=0)return {c,p};
  }
  return null;
}
function beginPageTurn(){
  pageTurnActive=true;
  if(document.body&&document.body.classList&&typeof document.body.classList.add==='function')document.body.classList.add('page-turning');
}
function finishPageTurn(){
  if(!pageTurnActive)return;
  const done=()=>{
    if(document.body&&document.body.classList&&typeof document.body.classList.remove==='function')document.body.classList.remove('page-turning');
    pageTurnActive=false;
  };
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(done);
  else done();
}
function persist(){
  try{
    const raw=JSON.stringify(state);

function migrate(){
  if(state.migrated)return;
  try{
    const old=native?JSON.parse(native.getLegacy()||'{}'):{};
    state.legacy=old;
    if(Object.keys(old).length){
      const c=(Number(old.current_track)||0)*8+(Number(old.current_chapter)||0);
      const chapter=chapters[c];
      if(chapter){
        const id=chapter.id+'-p'+((Number(old.current_page)||0)+1);
        state.location=locate(id)?id:chapter.pages[0].id;
        current=locate(state.location)||current;
      }
    }
  }catch(e){}
  state.migrated=true;
  persist();
}

function trackStats(id){

  const visited=new Set(state.visited);
  const read=ids.filter(pageId=>visited.has(pageId)).length;
  return {total:ids.length,read,remaining:Math.max(0,ids.length-read)};
}
function progressForTrack(id){

function trackLogicalPages(trackId){
  const out=[];
  chapters.forEach((c,ci)=>{
    if(c.track!==trackId)return;

}
function rebuildTrackSlideMap(trackId,paperWidth,wrapHeight){
  const key=[COURSE.version,trackId,Math.round(paperWidth),Math.round(wrapHeight),focus?'focus':'normal'].join(':');
  if(trackSlideMap.ready&&trackSlideMap.key===key)return;

  const items=trackLogicalPages(trackId);
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.position='fixed';
  host.style.left='-20000px';
  host.style.top='0';
  host.style.width=paperWidth+'px';
  host.style.height=wrapHeight+'px';
  host.style.visibility='hidden';
  host.style.pointerEvents='none';
  host.style.overflow='hidden';
  host.style.zIndex='-1';
  document.body.appendChild(host);

  const entries=[],byId={};
  let start=0;
  for(const item of items){
    const p=item.p,c=item.c;
    host.innerHTML='<div class="topic-header"><h1 class="topic-title">'+esc(p.title)+'</h1><div class="section-marker type-'+esc(p.kind)+'"><span class="kind">'+esc(kindLabel(p.kind))+'</span><span class="hint">'+esc(sectionHint(p))+'</span></div></div><article class="reader-paper"><div class="reader-flow">'+lessonSection(p,c,item.pi)+'</div></article>';
    const topic=host.querySelector('.topic-header');
    const measurePaper=host.querySelector('.reader-paper');
    const measureFlow=host.querySelector('.reader-flow');
    topic.style.width=paperWidth+'px';
    topic.style.margin='0';
    const topicHeight=Math.ceil(topic.getBoundingClientRect().height);
    const bodyHeight=Math.max(120,wrapHeight-topicHeight);
    measurePaper.style.width=paperWidth+'px';
    measurePaper.style.height=bodyHeight+'px';
    measurePaper.style.overflow='hidden';
    measureFlow.style.width=paperWidth+'px';
    measureFlow.style.height=bodyHeight+'px';
    measureFlow.style.columnCount='auto';
    measureFlow.style.columnWidth=paperWidth+'px';
    measureFlow.style.columnGap='0px';
    measureFlow.style.columnFill='auto';
    const count=Math.max(1,Math.ceil(Math.max(measureFlow.scrollWidth,paperWidth)/paperWidth-.001));
    const entry={id:p.id,count,start};
    entries.push(entry);
    byId[p.id]=entry;
    start+=count;
  }
  host.remove();
  trackSlideMap={track:trackId,key,entries,byId,total:Math.max(1,start),ready:true};
}
function reconcileCurrentTrackSlideCount(){
  if(!trackSlideMap.ready)return;
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.byId[id];
  if(!entry||entry.count===physicalPages)return;
  const diff=physicalPages-entry.count;
  entry.count=physicalPages;
  let passed=false;
  for(const x of trackSlideMap.entries){
    if(x.id===id){passed=true;continue}
    if(passed)x.start+=diff;
  }
  trackSlideMap.total=Math.max(1,trackSlideMap.total+diff);
}
function currentTrackSlidePosition(){
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.ready?trackSlideMap.byId[id]:null;
  if(!entry){
    const ids=trackPageIds(chapters[current.c].track);
    const logical=Math.max(0,ids.indexOf(id));
    return {current:logical+1,total:Math.max(1,ids.length)};
  }
  return {
    current:Math.max(1,Math.min(trackSlideMap.total,entry.start+physicalPage+1)),
    total:trackSlideMap.total
  };
}

function logicalFallback(delta){
  let c=current.c,p=current.p+delta;
  if(p<0){if(c===0)return;c--;p=chapters[c].pages.length-1}
  else if(p>=chapters[c].pages.length){if(c===chapters.length-1)return;c++;p=0}
  openPage(chapters[c].pages[p].id,delta<0);
}
function physicalForId(id){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelector||!paper.getBoundingClientRect)return 0;
  const sec=flow.querySelector('.logical-anchor[data-page-id="'+String(id).replace(/"/g,'\\"')+'"]');
  if(!sec||!sec.getClientRects)return 0;
  const pr=paper.getBoundingClientRect();
  let left=Infinity;
  for(const rect of sec.getClientRects())left=Math.min(left,rect.left-pr.left+paper.scrollLeft);
  return Number.isFinite(left)?Math.max(0,Math.min(physicalPages-1,Math.floor(left/Math.max(paper.clientWidth,1)+.001))):0;
}
function syncLogical(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelectorAll||!paper.getBoundingClientRect||!paper.clientWidth)return;
  const pr=paper.getBoundingClientRect();
  const topBand=Math.min(150,Math.max(86,paper.clientHeight*.16));
  let previous=null,nearTop=null,nearTopY=-Infinity;
  for(const anchor of flow.querySelectorAll('.logical-anchor')){
    if(!anchor.getClientRects)continue;
    const rects=anchor.getClientRects();
    if(!rects||!rects.length)continue;
    const rect=rects[0];
    const left=rect.left-pr.left+paper.scrollLeft;
    const page=Math.max(0,Math.floor(left/Math.max(paper.clientWidth,1)+.001));
    const y=rect.top-pr.top;
    const idx=Number(anchor.dataset.pageIndex);
    if(!Number.isFinite(idx))continue;
    if(page<physicalPage||(page===physicalPage&&y<=0)){
      previous={anchor,idx,page,y};
    }else if(page===physicalPage&&y<=topBand&&y>=nearTopY){
      nearTop={anchor,idx,page,y};
      nearTopY=y;
    }
  }
  const best=nearTop||previous;
  if(!best)return;
  const idx=best.idx;
  if(idx>=0&&idx<chapters[current.c].pages.length){
    current.p=idx;
    state.location=chapters[current.c].pages[idx].id;
    if(!state.visited.includes(state.location))state.visited.push(state.location);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');
    if(star)star.textContent=state.bookmarks.includes(state.location)?'★':'☆';
  }
}
function updateHud(){
  const pos=document.getElementById('page-pos');

function layoutReader(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!paper.clientWidth||!paper.clientHeight)return;
  const w=paper.clientWidth,h=paper.clientHeight;
  flow.style.width=w+'px';
  flow.style.height=h+'px';
  flow.style.columnCount='auto';
  flow.style.columnWidth=w+'px';
  flow.style.columnGap='0px';
  flow.style.columnFill='auto';
  paper.scrollLeft=0;
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{
    physicalPages=Math.max(1,Math.ceil(Math.max(flow.scrollWidth,w)/w-.001));
    if(pendingPhysicalRatio!==null){
      physicalPage=Math.max(0,Math.min(physicalPages-1,Math.round(pendingPhysicalRatio*Math.max(physicalPages-1,0))));
      pendingPhysicalRatio=null;
    }else{
      physicalPage=pendingLast?physicalPages-1:physicalForId(pendingTargetId||state.location);
    }
    pendingLast=false;
    pendingTargetId='';
    paper.scrollLeft=physicalPage*w;
    const wrap=document.querySelector('.reader-paper-wrap');
    if(wrap){
      rebuildTrackSlideMap(chapters[current.c].track,w,wrap.clientHeight);
      reconcileCurrentTrackSlideCount();
    }
    syncLogical();
    updateHud();
    finishPageTurn();
    try{
      const cs=getComputedStyle(flow),ps=getComputedStyle(paper),footer=document.querySelector('.reader-bottom'),fr=footer&&footer.getBoundingClientRect?footer.getBoundingClientRect():null;
      document.body.dataset.qaReady='1';
      document.body.dataset.qaPages=String(physicalPages);
      document.body.dataset.qaFont=cs.fontSize;
      document.body.dataset.qaLineHeight=cs.lineHeight;
      document.body.dataset.qaOverflowY=ps.overflowY;
      document.body.dataset.qaFit=(flow.scrollHeight<=paper.clientHeight+2?'1':'0');
      document.body.dataset.qaFooterVisible=(!fr||fr.bottom<=innerHeight+1?'1':'0');
      document.body.dataset.qaViewport=String(innerWidth)+'x'+String(innerHeight);
      document.body.dataset.qaColumnFill='auto';
      const qaWrap=document.querySelector('.reader-paper-wrap'),topic=document.querySelector('.topic-title');
      const wrapRect=qaWrap&&qaWrap.getBoundingClientRect?qaWrap.getBoundingClientRect():null;
      const topicRect=topic&&topic.getBoundingClientRect?topic.getBoundingClientRect():null;
      const titleOffset=(wrapRect&&topicRect)?Math.round(topicRect.top-wrapRect.top):9999;
      document.body.dataset.qaTitleOffsets=String(titleOffset);
      document.body.dataset.qaTitleMax=String(Math.abs(titleOffset));
      document.body.dataset.qaTitleTop=(Math.abs(titleOffset)<=2?'1':'0');
      const trackSlide=currentTrackSlidePosition();
      document.body.dataset.qaTrackSlideCurrent=String(trackSlide.current);
      document.body.dataset.qaTrackSlideTotal=String(trackSlide.total);
      document.body.dataset.qaTrackSlideGlobal=(trackSlide.total>=trackPageIds(chapters[current.c].track).length?'1':'0');
    }catch(e){}
  });
}
function changePhysical(delta){
  const paper=document.getElementById('paper');
  beginPageTurn();
  if(!paper||!paper.clientWidth){
    logicalFallback(delta);
    return;
  }
  const next=physicalPage+delta;
  if(next>=0&&next<physicalPages){
    physicalPage=next;
    paper.scrollLeft=physicalPage*paper.clientWidth;
    syncLogical();
    updateHud();
    finishPageTurn();
    return;
  }
  logicalFallback(delta);
}
function installReaderGestures(){
  const surface=document.querySelector('.reader-paper-wrap');
  const paper=document.getElementById('paper');
  if(!surface||!paper||!surface.addEventListener)return;

  let start=null,drag=false,startScroll=0,touchRunning=false,lastFinish=0;
  const blocked=el=>el&&el.closest&&el.closest('input,textarea,select,a,summary,details,.copy-btn,.reader-action,.focus-exit,.circle-btn,.focus-btn');

  function begin(x,y,target,source){
    if(blocked(target))return false;
    start={x,y,t:Date.now(),source};
    startScroll=paper.scrollLeft;
    drag=false;
    return true;
  }
  function move(x,y,event){
    if(!start)return;
    const dx=x-start.x,dy=y-start.y;
    if(!drag){
      if(Math.abs(dx)<6)return;
      if(Math.abs(dx)<=Math.abs(dy)*1.02)return;
      drag=true;
    }
    // Do not drag the page itself. Every successful turn uses the same whole-page transition.
    if(event&&event.cancelable)event.preventDefault();
  }
  function finish(x,y,event){
    if(!start)return;
    const dx=x-start.x,dy=y-start.y,ms=Math.max(1,Date.now()-start.t);
    const wasDrag=drag;
    start=null;drag=false;lastFinish=Date.now();
    const distance=Math.abs(dx);
    const horizontal=distance>Math.abs(dy)*1.02;
    const normalThreshold=Math.min(80,Math.max(34,(innerWidth||360)*.06));
    const quickFlick=ms<=420&&distance>=24;
    if(wasDrag&&horizontal&&(distance>=normalThreshold||quickFlick)){
      changePhysical(dx<0?1:-1);
    }else{
      paper.scrollLeft=physicalPage*paper.clientWidth;
    }
    if(event&&event.cancelable&&wasDrag)event.preventDefault();
  }

  // Android/WebView: use native touch events across title + body.
  surface.addEventListener('touchstart',e=>{
    if(!e.touches||e.touches.length!==1)return;
    touchRunning=true;
    const q=e.touches[0];
    begin(q.clientX,q.clientY,e.target,'touch');
  },{passive:true});
  surface.addEventListener('touchmove',e=>{
    if(!touchRunning||!start||start.source!=='touch'||!e.touches||e.touches.length!==1)return;
    const q=e.touches[0];
    move(q.clientX,q.clientY,e);
  },{passive:false});
  surface.addEventListener('touchend',e=>{
    if(!touchRunning)return;
    const q=(e.changedTouches&&e.changedTouches[0])||(start?{clientX:start.x,clientY:start.y}:{clientX:0,clientY:0});
    finish(q.clientX,q.clientY,e);
    touchRunning=false;
  },{passive:false});
  surface.addEventListener('touchcancel',()=>{
    touchRunning=false;start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;
  },{passive:true});

  // Mouse / stylus fallback. Touch pointers are ignored to prevent double firing.
  surface.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||touchRunning||Date.now()-lastFinish<120)return;
    if(begin(e.clientX,e.clientY,e.target,'pointer')){
      try{surface.setPointerCapture&&surface.setPointerCapture(e.pointerId)}catch(err){}
    }
  });
  surface.addEventListener('pointermove',e=>{
    if(!start||start.source!=='pointer')return;
    move(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointerup',e=>{
    if(!start||start.source!=='pointer')return;
    finish(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointercancel',()=>{
    if(start&&start.source==='pointer'){start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;}
  });
}

function doAction(action,el){
  const c=chapters[current.c],p=c.pages[current.p];
  if(action==='home'||action==='books'||action==='search'||action==='saved'||action==='settings'){route=action;render();return}
  if(action==='track'){selectedTrack=Number(el.dataset.track);route='track';render();return}

  if(action==='chapter'){const i=Number(el.dataset.c);openPage(chapters[i].pages[0].id);return}
  if(action==='continue'){openPage(state.location);return}

    state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):state.bookmarks.concat(p.id);

  if(action==='complete'){state.complete=state.complete.includes(c.id)?state.complete.filter(x=>x!==c.id):state.complete.concat(c.id);persist();render();return}
  if(action==='copy-code'){
    const code=el.closest('.code').querySelector('code').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast('코드를 복사했습니다')).catch(()=>copyFallback(code));else copyFallback(code);
