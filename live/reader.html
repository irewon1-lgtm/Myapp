<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="app-schema" content="codingroadmap-live-v1">
<title>코딩 로드맵</title>
<style>
/* LIBRARY_REBUILD_V8 — clean rewrite, no legacy style layers */
:root{
  --ivory:#fbf8f1;
  --ivory2:#f4eee3;
  --paper:#fffdf8;
  --ink:#231d17;
  --muted:#8d8377;
  --hair:#e8ded0;
  --gold:#ad8247;
  --gold2:#d7ba84;
  --green:#718764;
  --reader:#17120e;
  --reader2:#211912;
  --readerInk:#f2e9dc;
  --readerMuted:#b9aa97;
  --readerHair:#403226;
  --readerGold:#d1a354;
  --navSafe:calc(28px + env(safe-area-inset-bottom));
  --readerBody:18px;
  --readerLine:1.68;
  --pagePad:clamp(22px,5vw,52px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--ivory);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{cursor:pointer}
.serif,.display-title,.section-title,.book-title,.track-name,.chapter-name,.reader-title,.reader-flow h1,.reader-flow h2,.reader-flow h3{font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif}
.screen{min-height:100dvh;background:
  radial-gradient(circle at 5% 0,#fffefb 0 15%,transparent 37%),
  linear-gradient(180deg,var(--ivory) 0%,#f8f3ea 100%)}
.shell{width:min(1180px,100%);margin:0 auto;padding:30px clamp(20px,4vw,46px) 150px}
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:2px 0 28px}
.display-title{font-size:clamp(40px,5vw,62px);line-height:1.08;letter-spacing:-.055em;font-weight:600;margin:0 0 8px}
.home-sub{margin:0;color:var(--muted);font-size:16px}
.home-quote{font-family:Georgia,"Noto Serif KR",serif;color:#9b8a76;text-align:right;line-height:1.45;font-size:14px;padding-top:10px;white-space:nowrap}
.home-quote:after{content:"—";display:block;margin-top:3px}
.continue-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);overflow:hidden;min-height:270px;border:1px solid #eadfce;border-radius:24px;background:#f2e7d6;box-shadow:0 18px 45px #7a5d3512}
.continue-copy{padding:32px 34px;display:flex;flex-direction:column;justify-content:center}
.continue-kicker{font-size:31px;line-height:1.2;letter-spacing:-.045em;margin-bottom:8px}
.continue-lead{margin:0;color:#8f8172;font-family:Georgia,"Noto Serif KR",serif;font-size:16px;line-height:1.55}
.continue-rule{width:135px;height:1px;background:#d5c5ae;margin:15px 0}
.continue-meta{font-size:12px;letter-spacing:.07em;color:#8e806f;margin-bottom:5px}
.continue-title{font-family:Georgia,"Noto Serif KR",serif;font-size:25px;line-height:1.3;margin:0 0 14px}
.progress-row{display:flex;align-items:center;gap:11px;max-width:390px;margin-bottom:18px}
.progress-track{height:7px;flex:1;background:#ddd5c9;border-radius:99px;overflow:hidden}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,#b88a4b,#dfc282);border-radius:99px}
.progress-row b{font-size:13px;color:#5d5144;font-weight:600}
.pill-primary{border:0;border-radius:999px;background:linear-gradient(180deg,#bb8e50,#a77a3e);color:white;min-height:50px;padding:0 25px;align-self:flex-start;font-weight:700;letter-spacing:-.02em}
.still-life{position:relative;overflow:hidden;background:
  radial-gradient(circle at 76% 31%,#fff8dd 0 8%,transparent 9%),
  linear-gradient(128deg,#eee0cc 0 32%,#faf5eb 48%,#cbb28d 49%,#e5d4ba 100%)}
.still-life:before{content:"";position:absolute;right:12%;bottom:18%;width:132px;height:94px;border-radius:7px;background:linear-gradient(#f5f0e6,#d5c6b1);box-shadow:0 14px 24px #59442e26;transform:rotate(-2deg)}
.still-life:after{content:"GOOD CODE\A A KINDER\A TOMORROW";white-space:pre;position:absolute;right:16%;bottom:28%;font:500 12px/1.4 Georgia,serif;color:#75634d;text-align:center}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 14px}
.section-title{font-size:30px;line-height:1.2;letter-spacing:-.045em;margin:0}
.section-caption{font-family:Georgia,"Noto Serif KR",serif;color:#9a8c7d;margin:4px 0 0;font-size:13px}
.section-link{border:0;background:transparent;color:#817567;padding:8px 0}
.book-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,220px);gap:20px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.book-rail::-webkit-scrollbar{display:none}
.book-item{border:0;background:transparent;padding:0;text-align:left;min-width:0;scroll-snap-align:start}
.book-cover{position:relative;height:250px;border:1px solid #d9cebd;border-radius:5px 14px 14px 5px;padding:21px 18px;overflow:hidden;box-shadow:8px 12px 24px #6f593a22,inset 7px 0 10px #00000009}
.book-cover:after{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:#ffffff95;box-shadow:4px 0 8px #614d3417}
.book-cover small{display:block;position:relative;z-index:1;font:500 10px Georgia,serif;letter-spacing:.08em;opacity:.75}
.book-cover strong{display:block;position:relative;z-index:1;font:600 23px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px;letter-spacing:-.04em}
.book-cover em{position:absolute;left:18px;bottom:18px;font:500 9px/1.3 Georgia,serif;letter-spacing:.11em;font-style:normal;opacity:.72}
.book-cover .cover-art{position:absolute;left:18px;right:18px;bottom:50px;height:75px;border-radius:2px;background:linear-gradient(180deg,#edcf9d 0 39%,#7f7760 40% 60%,#dbc080 61%)}
.tone1{background:#eee5d6}
.tone2{background:#315245;color:#f4eee3;border-color:#506d61}
.tone3{background:#e8deca}
.tone4{background:#353330;color:#f2eadc;border-color:#504b45}
.book-meta{padding:10px 5px 0}
.book-meta small{color:#9b8e7d;font-size:10px;letter-spacing:.07em}
.book-title{display:block;font-size:17px;line-height:1.3;margin:3px 0 7px}
.book-progress{display:flex;align-items:center;gap:8px}
.book-progress .bar{flex:1;height:6px;background:#e2dbcf;border-radius:99px;overflow:hidden}
.book-progress .bar i{display:block;height:100%;background:#b78a4b}
.book-progress span{font-size:11px;color:#8b7e6e;white-space:nowrap}
.library-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:28px;padding:18px 23px;border-radius:16px;background:#f1e8db;color:#8e7e69}
.library-banner .leaf{font-size:28px;color:#b58b51}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:92px;padding:7px max(18px,env(safe-area-inset-left)) var(--navSafe);background:#fffdf9f5;border-top:1px solid #e4dacd;backdrop-filter:blur(14px);box-shadow:0 -10px 32px #7e644014}
.bottom-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:#786d62;font-size:11px}
.bottom-nav button.active{color:#a87b3e;font-weight:700}
.nav-icon{width:24px;height:24px;display:block}
.top-row{display:flex;align-items:center;gap:14px;margin:4px 0 24px}
.back-btn{border:0;background:transparent;font-size:31px;padding:0 6px 0 0;min-width:44px;height:44px}
.track-name{font-size:clamp(24px,3vw,34px);line-height:1.2}
.track-hero{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:18px;border:1px solid #e9dece;border-radius:20px;background:#f2e8d8}
.track-mini{height:245px;border:1px solid #d9cdbb;border-radius:5px 12px 12px 5px;background:#eee4d5;padding:22px 18px;box-shadow:7px 10px 22px #745b3a1e}
.track-mini small{font:500 10px Georgia,serif;letter-spacing:.08em;color:#766856}
.track-mini strong{display:block;font:600 22px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px}
.track-mini .photo{height:85px;margin-top:20px;background:linear-gradient(180deg,#e8cb98 0 42%,#7e765f 43% 61%,#d7ba79 62%)}
.track-copy{padding:9px 10px 7px 0;display:flex;flex-direction:column;justify-content:center}
.track-headline{font-size:25px;line-height:1.4;margin-bottom:11px}
.track-desc{margin:0;color:#75695c;font-family:Georgia,"Noto Serif KR",serif;line-height:1.55}
.track-copy .pill-primary{align-self:flex-end;margin-top:17px}
.chapter-list{display:grid;gap:8px}
.chapter-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:13px;border:1px solid #e8dfd2;border-radius:14px;background:#fffdf8;padding:12px 14px;text-align:left;box-shadow:0 4px 13px #866c4b08}
.chapter-row.current{background:#f3e7d3}
.chapter-num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#f0e6d7;font-family:Georgia,serif;font-size:17px}
.chapter-row.current .chapter-num{background:#dfc59a}
.chapter-name{font-size:17px;line-height:1.25}
.chapter-sub{display:block;margin-top:4px;color:#978a7c;font-family:system-ui;font-size:11px}
.status-chip{border-radius:999px;background:#f1eee7;color:#877b6f;padding:7px 12px;font-size:11px;white-space:nowrap}
.status-chip.done{background:#edf2e9;color:#65805a}
.status-chip.reading{background:#fff8ed;color:#9f7338}
.saved-head{margin:8px 0 18px}
.saved-head h1{font-size:42px;line-height:1.1;margin:0}
.saved-head p{font-family:Georgia,"Noto Serif KR",serif;color:#9a8b79;margin:6px 0 0}
.chips{display:flex;gap:9px;margin:20px 0}
.chip{border:0;border-radius:999px;background:#f0e8dc;color:#6f6356;padding:10px 19px}
.chip.active{background:#ad8349;color:white}
.saved-list{display:grid;gap:13px}
.saved-card{display:grid;grid-template-columns:36px minmax(0,1fr) 150px;gap:15px;align-items:center;width:100%;border:1px solid #e8dfd2;border-radius:17px;background:#fffdf8;padding:13px 15px;text-align:left}
.saved-mark{align-self:start;width:30px;height:37px;border:1px solid #e6d9c6;border-radius:7px;background:#fff8ed;color:#ae8246;display:grid;place-items:center}
.saved-copy small{font-family:Georgia,"Noto Serif KR",serif;color:#3d352e;font-size:12px}
.saved-copy strong{display:block;font-family:Georgia,"Noto Serif KR",serif;font-size:19px;line-height:1.35;margin:5px 0}
.saved-copy p{margin:0;color:#8d8072;font-family:Georgia,"Noto Serif KR",serif;font-size:13px;line-height:1.45}
.saved-thumb{height:104px;border-radius:11px;background:linear-gradient(135deg,#e9d8ba 0,#f9f2e7 45%,#baa17d 46%,#e6d5b9 100%);position:relative;overflow:hidden}
.saved-thumb:after{content:"A NEW\A JOURNEY";white-space:pre;position:absolute;right:12px;bottom:10px;font:500 9px/1.3 Georgia,serif;color:#76634c}
.panel{border:1px solid #e8dfd2;border-radius:16px;background:#fffdf8;padding:18px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:18px}
.panel p{margin:0;color:#85796d}
.panel .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.small-btn{border:1px solid #ddd1c1;border-radius:10px;background:#fffaf2;padding:9px 12px}
.search-input,textarea{width:100%;border:1px solid #ddd2c3;border-radius:12px;background:#fffdf9;padding:13px 14px;color:var(--ink)}
.search-results{display:grid;gap:8px;margin-top:13px}
.result{border:1px solid #e6dccf;border-radius:13px;background:#fffdf8;padding:13px 14px;text-align:left}
.result small{display:block;color:#998b7a;font-size:10px}
.result strong{display:block;font-family:Georgia,"Noto Serif KR",serif;margin-top:4px}
.result p{margin:5px 0 0;color:#81766a;font-size:12px}
.empty{color:#958879;padding:24px 2px}
dialog{width:min(620px,calc(100% - 28px));max-height:82dvh;overflow:auto;border:1px solid #d9cebf;border-radius:18px;background:#fffaf2;color:var(--ink);padding:21px;box-shadow:0 22px 70px #0005}
dialog::backdrop{background:#0009}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-top h2{margin:0;font-family:Georgia,"Noto Serif KR",serif}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translateX(-50%);max-width:90vw;background:#2a2119;color:#f4ecdf;border:1px solid #584633;border-radius:10px;padding:10px 15px;font-size:13px;box-shadow:0 10px 35px #0006}

/* Reader — single visual language, no legacy overrides */
/* TITLE_TOP_PAGE_V2 — persistent large topic title above every physical swipe page */
/* SWIPE_TRACK_FOCUS_V1 — robust swipe, track remaining pages, rebuilt focus mode */
/* SWIPE_CONTENT_CODE_V2 — full-surface touch swipe and concrete code-first Track 2 explanations */
/* BOOK_SOURCES_V1 — chapter-end verified 2026 bestseller references */
/* TRACK_GLOBAL_SLIDES_V1 — footer numbering spans every physical slide in the current track */
/* UNIFIED_PAGE_TURN_V1 — forward/back/swipe/buttons all use the same whole-page transition */
/* ESSENTIAL_CONTENT_V1 — repeated study prompts removed; only subject content remains */
.reader-shell{height:100dvh;background:var(--reader);color:var(--readerInk);display:grid;grid-template-rows:58px minmax(0,1fr) auto;overflow:hidden}
.reader-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:7px;padding:6px 15px;background:#17120ef5;border-bottom:1px solid #2d241c}
.reader-top button{border:0;background:transparent;color:var(--readerInk);min-width:42px;height:42px;border-radius:10px}
.reader-heading{text-align:center;min-width:0}
.reader-heading strong{display:block;font:500 17px/1.2 Georgia,"Noto Serif KR",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-heading small{display:block;color:#9a8872;font:700 9px/1.2 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:.08em;margin-top:2px}
.reader-paper-wrap{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:var(--reader);touch-action:pan-y;overscroll-behavior-x:contain;opacity:1;transition:opacity 110ms ease-out}
.page-turning .reader-paper-wrap{opacity:.08}
.topic-header{width:min(880px,calc(100% - 88px));margin:0 auto;padding:0 0 6px;background:var(--reader);z-index:3}
.topic-title{margin:0 var(--pagePad) 8px;font:700 32px/1.18 Georgia,"Noto Serif KR","NanumMyeongjo",serif;letter-spacing:-.045em;color:var(--readerInk)}
.topic-header .section-marker{margin-bottom:0}
.reader-stage{position:relative;min-height:0;display:flex;justify-content:center;overflow:hidden;background:var(--reader);touch-action:pan-y;overscroll-behavior-x:contain}
.reader-paper{position:relative;width:min(880px,calc(100% - 88px));height:100%;overflow-x:hidden;overflow-y:hidden;background:var(--reader);scroll-behavior:auto;overscroll-behavior:none;touch-action:pan-y}
.reader-flow{height:auto;width:100%;column-count:1;column-gap:0;column-fill:auto;font-size:var(--readerBody);line-height:var(--readerLine);font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif;color:var(--readerInk);-webkit-text-size-adjust:none;text-size-adjust:none}
.lesson-section{
  --pagePad:0;
  display:block;
  padding:6px clamp(22px,5vw,52px) 0;
  break-inside:auto;
  -webkit-column-break-inside:auto;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone
}
.logical-anchor{display:block;width:0;height:0;overflow:hidden}
.reader-flow>*:not(.logical-anchor){margin-left:var(--pagePad);margin-right:var(--pagePad)}
.reader-flow>.code,.reader-flow>.diagram,.reader-flow>.callout,.reader-flow>.practice-box,.reader-flow>.question-box,.reader-flow>.summary-card,.reader-flow>details{width:auto}
.chapter-ribbon{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:42px;margin:0 var(--pagePad);padding:7px 12px;
  border-top:1px solid #6a5137;border-bottom:1px solid #6a5137;
  background:linear-gradient(90deg,#2c2117,#201812);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
}
.chapter-ribbon small{color:#c69a58;font-size:10px;font-weight:800;letter-spacing:.09em;white-space:nowrap}
.chapter-ribbon strong{font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif;color:#f1e6d6;font-size:18px;line-height:1.25;text-align:right}
.section-marker{
  display:flex;align-items:center;gap:7px;min-height:27px;
  margin:0 var(--pagePad) 12px;padding:2px 7px 2px 0;
  border-top:1px solid #473628;border-bottom:1px solid #2e241c;
  background:linear-gradient(90deg,#1e1711,#17120e 72%);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  break-after:auto;page-break-after:auto;
}
.section-marker:before{content:"";width:3px;height:19px;border-radius:2px;background:#a47b45;flex:0 0 auto}
.section-marker .kind{
  min-width:38px;padding:2px 7px;border-radius:999px;background:#4c351d;
  font-size:10px;font-weight:900;letter-spacing:.08em;color:#f0c77e;white-space:nowrap;text-align:center
}
.section-marker .hint{font-size:10px;font-weight:650;color:#a89783;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-marker.type-practice:before,.section-marker.type-check:before{background:#e0b263}
.section-marker.type-practice .kind,.section-marker.type-check .kind{background:#65451f;color:#ffd99a}
.section-marker.type-solution:before{background:#93a982}
.section-marker.type-solution .kind{background:#31412d;color:#bfd1b4}
.section-marker.type-summary:before{background:#b89a6c}
.section-marker.type-summary .kind{background:#51422e;color:#dfc79f}
.section-marker.type-glossary:before{background:#c69a58}
.section-marker.type-example:before{background:#c68a4e}
.section-marker.type-example .kind{background:#5a3d20;color:#f0c189}
.reader-flow .eyebrow{display:none}
.reader-flow .page-title{margin:0 0 10px;font-size:32px;line-height:1.18;letter-spacing:-.045em;font-weight:700;break-after:auto}
.reader-flow .practice-box,.reader-flow .question-box{border-color:#6a5031;background:#241a10}
.reader-flow .summary-card{border-color:#5f523d;background:#211b14}
.solution-banner{
  margin:0 var(--pagePad) 12px;padding:7px 10px;border-left:3px solid #93a982;
  background:linear-gradient(90deg,#1d2119,#171a15);color:#cbd8c2;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  font-size:11px;font-weight:850;letter-spacing:.04em;
}

.reader-flow h1{margin:0 0 8px;font-size:34px;line-height:1.18;letter-spacing:-.045em;font-weight:600;break-after:auto}
.reader-flow h2{margin:0 0 7px;font-size:24px;line-height:1.28;break-after:auto}
.reader-flow h3{margin:0 0 5px;font-size:19px;line-height:1.35;break-after:auto}
.reader-flow p,.reader-flow .paragraph{font-size:var(--readerBody);line-height:var(--readerLine);padding:0;orphans:2;widows:2}
.reader-flow p{margin:0}
.reader-flow ul{margin:0;padding-left:24px}
.reader-flow li{margin:0;line-height:var(--readerLine);orphans:2;widows:2}
.reader-flow li+li{margin-top:5px}

.prose-stack{margin-top:0;margin-bottom:15px;break-inside:auto;-webkit-column-break-inside:auto}
.prose-stack .paragraph{color:#dfd5c8}
.prose-stack .lead-paragraph{
  margin:0 0 10px;padding:11px 14px 11px 15px;border-left:3px solid #9c7849;
  border-radius:0 10px 10px 0;background:linear-gradient(90deg,#241b14,#1b1511 74%);
  color:#f2e9dc;font-weight:520
}
.prose-stack .body-paragraph{margin:10px 0 0}
.prose-stack.type-practice .lead-paragraph,.prose-stack.type-check .lead-paragraph{border-left-color:#e0b263;background:linear-gradient(90deg,#2a2014,#1b1510)}
.prose-stack.type-example .lead-paragraph{border-left-color:#c68a4e;background:linear-gradient(90deg,#281c12,#1b1510)}
.prose-stack.type-summary .lead-paragraph{border-left-color:#b89a6c}
.prose-stack.type-visual .lead-paragraph{border-left-color:#8d9a76}

.block-kicker{
  margin:0 0 6px;color:#b99a70;font:850 10px/1.3 system-ui,-apple-system,"Noto Sans KR",sans-serif;
  letter-spacing:.09em
}
.keyword-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px;margin-bottom:14px}
.keyword-row .block-kicker{margin:0 2px 0 0}
.keyword-chip{
  display:inline-flex;align-items:center;min-height:28px;padding:3px 9px;border:1px solid #4a392c;
  border-radius:999px;background:#1f1813;color:#d8c9b7;
  font:700 11px/1.25 system-ui,-apple-system,"Noto Sans KR",sans-serif
}

.glossary-card{
  margin-top:10px;margin-bottom:12px;padding:12px 14px;border:1px solid #49382a;border-radius:12px;
  background:linear-gradient(145deg,#201812,#18130f);break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .glossary-term{display:block;margin:0 0 6px;font-size:20px;line-height:1.3;color:#f2e5d2}
.glossary-definition{margin:0 0 10px!important;color:#e1d6c8}
.glossary-meta{padding-top:9px;border-top:1px solid #3a2d23}
.glossary-meta p+p{margin-top:6px!important}
.reader-flow .glossary-label{
  display:inline;color:#c69a58;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  font-size:10px;font-weight:850;margin:0 6px 0 0!important;letter-spacing:.04em
}

.keypoints-card{
  margin-top:12px;margin-bottom:14px;padding:11px 14px 12px;border:1px solid #4b3b2f;border-radius:12px;

}
.keypoints-card ul{margin-top:2px}
.keypoints-card li{color:#e4d9cc}

.solution-prose{margin-top:0;margin-bottom:14px}
.solution-step{

  padding:10px 12px;border:1px solid #35422f;border-radius:11px;background:#181d16;

}
.solution-step+.solution-step{margin-top:9px}
.solution-step p{color:#dfE7d9}
.micro-label{
  display:inline-flex;justify-content:center;padding:3px 5px;border-radius:999px;background:#31412d;
  color:#bfd1b4;font:850 10px/1.25 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:.04em
}

.reader-flow .card,.reader-flow .callout,.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{
  -webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .card{border:0;border-top:1px solid #3a2d23;border-radius:0;background:transparent;padding:8px 0}
.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:12px;background:#1e1712;padding:11px 14px
}
.reader-flow .practice-box h3,.reader-flow .question-box h3,.reader-flow .summary-card h3{color:#efd3a0}
.reader-flow .label{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#c69a58;font-size:10px;font-weight:700;margin:3px 0 1px}
.reader-flow .callout{
  margin-top:12px;margin-bottom:14px;border:1px solid #5a472f;border-radius:12px;
  background:linear-gradient(135deg,#2b2117,#211912);padding:11px 14px;break-inside:auto
}
.reader-flow .callout-title{font-weight:800;color:#e2bd7b;margin-bottom:4px}
.reader-flow .goal{
  margin-top:12px;margin-bottom:14px;border-left:3px solid var(--readerGold);
  padding:8px 0 8px 12px;color:#d6c7b3;background:linear-gradient(90deg,#241b13aa,transparent)
}

.reader-flow .code{
  margin-top:12px;margin-bottom:14px;border:1px solid #4a392d;border-radius:11px;overflow:visible;
  background:#100d0b;-webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .code-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;
  background:#1e1712;color:#bfae99;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:11px
}
.reader-flow .copy-btn{border:0;background:transparent;color:#d7c4aa;padding:3px 5px}
.reader-flow pre{
  margin:0;padding:10px 12px;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;
  font:15px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace;color:#ece4d8;orphans:2;widows:2
}
.reader-flow .code-output{
  border-top:1px solid #382c22;padding:8px 12px;white-space:pre-wrap;
  font:15px/1.58 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcae9b
}
.code-explain{
  margin:-4px 0 14px;padding:11px 13px;border:1px solid #3f352b;border-radius:11px;background:#181511;
  break-inside:auto;-webkit-column-break-inside:auto
}
.code-explain h3{margin:0 0 8px!important;color:#e7d7c3;font-size:16px!important}
.code-explain ol{margin:0;padding-left:23px}
.code-explain li{margin:0;color:#d9cdbf;font-size:15px;line-height:1.58}
.code-explain li+li{margin-top:6px}
.code-trace{
  margin:0 0 16px;padding:10px 0 0;border-top:1px solid #3b3027
}
.code-trace h3{margin:0 0 7px!important;color:#d8c7b3;font-size:16px!important}
.code-trace p{margin:0!important;color:#d2c5b7}
.code-trace p+p{margin-top:7px!important}

.reader-flow .diagram{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:11px;
  overflow:visible;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .diagram-row{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:8px 11px;border-bottom:1px solid #34291f}
.reader-flow .diagram-row:last-child{border-bottom:0}
.reader-flow .diagram-key{color:#d3a45b;font-weight:800}

.extra-card{
  margin-top:11px;margin-bottom:13px;padding:10px 13px 11px;border-top:1px solid #49382b;border-bottom:1px solid #2d241d;
  background:linear-gradient(90deg,#1c1612,#18130f);break-inside:auto;-webkit-column-break-inside:auto
}
.extra-card h3{margin:0 0 5px!important;color:#e8dccd}
.extra-card p{color:#d4c7b7}

.reader-flow details{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:11px;padding:10px 13px;
  break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow summary{cursor:pointer;color:#d8b272;font-weight:700}
.chapter-references{margin:14px 0 0;padding:12px 0 0;border-top:1px solid #3d3228}
.chapter-references h3{margin:0 0 8px!important;font-size:16px!important;color:#d7c5ae}
.chapter-references ol{margin:0;padding-left:22px}
.chapter-references li{margin:0;color:#bfae9a;font-size:13px;line-height:1.55}
.chapter-references li+li{margin-top:7px}
.chapter-references strong{color:#e0d2c0;font-weight:700}
.reader-flow .chapter-end{margin-top:16px;border-top:1px solid #49382b;padding-top:12px}
.reader-flow .chapter-end .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.reader-flow .reader-action{border:1px solid #5b4632;border-radius:10px;background:#231a13;color:#eadfce;padding:7px 10px}
@media(max-width:520px){
  .solution-step{grid-template-columns:42px minmax(0,1fr);gap:8px;padding:9px 10px}
  .prose-stack .lead-paragraph{padding:10px 11px 10px 12px}
  .glossary-card,.keypoints-card,.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .callout{padding-left:11px;padding-right:11px}
}
.edge-zone{position:absolute;top:0;bottom:0;z-index:15;width:clamp(44px,7vw,86px);border:0;background:transparent}
.edge-prev{left:0}.edge-next{right:0}
.reader-bottom{display:grid;grid-template-columns:auto minmax(150px,1fr) auto auto;align-items:center;gap:10px;min-height:92px;padding:7px 18px var(--navSafe);background:#17120ef5;border-top:1px solid #33281f}
.reader-bottom button{border:1px solid #51402f;background:#1a140f;color:#eadfce}
.circle-btn{width:48px;height:48px;border-radius:50%;font-size:29px;line-height:1;padding:0}
.focus-btn{min-height:42px;border-radius:13px!important;padding:0 12px;font-size:11px}
.reader-page-info{text-align:center;color:#c9baa7;font:500 12px Georgia,"Noto Serif KR",serif}
.reader-progress{height:5px;max-width:240px;margin:6px auto 0;background:#3b3027;border-radius:99px;overflow:hidden}
.reader-progress i{display:block;height:100%;background:var(--readerGold);border-radius:99px}
.focus-exit,.focus-hud{display:none}
.reader-shell.focus{grid-template-rows:minmax(0,1fr)}
.reader-shell.focus .reader-top,.reader-shell.focus .reader-bottom{display:none}
.reader-shell.focus .reader-paper,.reader-shell.focus .topic-header{width:min(960px,calc(100% - 44px))}
.reader-shell.focus .topic-title{padding-right:0}
.reader-shell.focus .focus-exit{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;border:1px solid #574634;border-radius:999px;background:#19130ed9;color:#e7dccd;padding:9px 13px;font-size:11px;backdrop-filter:blur(8px)}
.reader-shell.focus .focus-hud{display:block;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;max-width:calc(100vw - 180px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid #423427;border-radius:999px;background:#17120ecb;color:#b9a995;padding:7px 12px;font:700 10px/1 system-ui,-apple-system,"Noto Sans KR",sans-serif;backdrop-filter:blur(8px)}
@media(min-width:900px){
  .book-rail{grid-auto-columns:minmax(185px,230px)}
  .reader-paper,.topic-header{width:min(800px,calc(100% - 180px))}
  .reader-flow h1{font-size:36px}
}
@media(max-width:720px){
  .shell{padding:24px 18px 145px}
  .home-head{margin-bottom:22px}
  .display-title{font-size:42px}
  .home-quote{font-size:12px}
  .continue-card{grid-template-columns:1fr}
  .still-life{height:148px;order:-1}
  .continue-copy{padding:22px 24px}
  .continue-kicker{font-size:27px}
  .book-rail{grid-auto-columns:minmax(154px,184px);gap:14px}
  .book-cover{height:222px}
  .track-hero{grid-template-columns:112px 1fr;gap:16px}
  .track-mini{height:188px;padding:16px 12px}
  .track-mini strong{font-size:17px}
  .track-mini .photo{height:56px}
  .track-headline{font-size:20px}
  .track-desc{font-size:12px}
  .saved-card{grid-template-columns:32px minmax(0,1fr) 108px;gap:10px}
  .saved-thumb{height:90px}
  .saved-copy strong{font-size:16px}
  .reader-paper,.topic-header{width:calc(100% - 54px)}
  .reader-top{grid-template-columns:auto minmax(0,1fr) auto auto}
  .reader-top .note-top{display:none}
  .reader-flow h1{font-size:32px}
  .reader-bottom{grid-template-columns:auto minmax(100px,1fr) auto}
}

/* COZY_EDITORIAL_2026_V1 — warm, dimensional, soft editorial UI */
:root{
  --ivory:#fff8f4;
  --ivory2:#f7eee9;
  --paper:#fffdfb;
  --ink:#4b3937;
  --muted:#907a77;
  --hair:#eadad4;
  --gold:#c38e7e;
  --gold2:#e2b9a8;
  --green:#9daf97;
  --rose:#dda8a9;
  --rose2:#f2d1ca;
  --peach:#f2c6aa;
  --sage:#b8c5ad;
  --lav:#cec3da;
  --butter:#e9d9a7;
  --cocoa:#6b504c;
  --reader:#2d2524;
  --reader2:#382d2b;
  --readerInk:#fff6ef;
  --readerMuted:#d7c2b9;
  --readerHair:#594541;
  --readerGold:#e0b39c;
}
html,body{
  background:#fff8f4;
  color:var(--ink);
  font-family:ui-rounded,"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;
}
.serif,.display-title,.section-title,.book-title,.track-name,.chapter-name,.reader-title,.reader-flow h1,.reader-flow h2,.reader-flow h3,.continue-kicker,.track-headline{
  font-family:"Noto Serif KR","NanumMyeongjo","Apple SD Gothic Neo",serif;
}
.screen{
  background:
    radial-gradient(circle at 92% 2%,#f8ddda 0 9%,transparent 29%),
    radial-gradient(circle at 3% 22%,#f5e5c8 0 8%,transparent 25%),
    radial-gradient(circle at 88% 55%,#e5eadc 0 8%,transparent 26%),
    linear-gradient(180deg,#fffaf7 0%,#fff6f1 52%,#f9f1ec 100%);
}
.shell{padding-top:34px}
.home-head{align-items:center;margin-bottom:30px}
.display-title{
  font-size:clamp(42px,6vw,66px);
  line-height:1.04;
  font-weight:800;
  color:#5a403e;
  letter-spacing:-.06em;
}
.home-sub{font-size:15px;color:#9a7e79}
.home-quote{
  padding:13px 17px;
  border:1px solid #efdeda;
  border-radius:22px;
  background:#ffffffa8;
  box-shadow:0 10px 30px #7d51451a;
  color:#a47d77;
}
.continue-card{
  border:1px solid #f0ddd6;
  border-radius:34px;
  min-height:284px;
  background:
    linear-gradient(135deg,#fff9f6 0%,#f9e6df 54%,#f1ddcf 100%);
  box-shadow:0 28px 70px #815b4c1f,0 4px 14px #9d75621a;
  overflow:hidden;
}
.continue-copy{padding:36px 38px}
.continue-kicker{color:#654846;font-size:32px;font-weight:800}
.continue-lead{color:#9b7d77}
.continue-rule{background:linear-gradient(90deg,#d49e91,transparent);height:2px}
.continue-meta{color:#b07f77;font-weight:800}
.continue-title{color:#58413f;font-size:26px;font-weight:750}
.pill-primary{
  min-height:52px;
  padding:0 26px;
  border-radius:18px;
  background:linear-gradient(135deg,#c98f86,#b87975);
  color:#fffaf8;
  box-shadow:0 12px 26px #9e696140, inset 0 1px #ffffff70;
  border:1px solid #ffffff66;
}
.pill-primary:active{transform:translateY(1px);box-shadow:0 6px 14px #9e696130}
.still-life{
  background:
    radial-gradient(circle at 68% 25%,#fff7df 0 8%,transparent 9%),
    radial-gradient(ellipse at 24% 80%,#d9c7d9 0 15%,transparent 16%),
    radial-gradient(ellipse at 78% 84%,#bfcbb1 0 18%,transparent 19%),
    linear-gradient(145deg,#f6d8cd,#f9eee5 48%,#e7cfbe 49%,#f3e7dc);
}
.still-life:before{
  width:145px;height:105px;border-radius:18px;
  background:linear-gradient(160deg,#fffdf8,#eadbd3);
  box-shadow:0 18px 35px #6d49342b;
  transform:rotate(-5deg);
}
.still-life:after{color:#9d7771;font-family:"Noto Serif KR",serif;letter-spacing:.08em}
.section-title{font-size:29px;font-weight:800;color:#604745}
.section-caption{color:#a88c86}
.section-link{color:#b07872;font-weight:750}
.book-rail{
  gap:18px;
  padding:8px 8px 20px;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
.cozy-track-rail{grid-auto-columns:minmax(170px,214px)}
.library-track-rail{grid-auto-columns:minmax(190px,230px);overflow-x:auto}
.book-item{scroll-snap-align:center;transition:transform .22s ease,filter .22s ease}
.book-item:active{transform:scale(.975)}
.book-cover{
  height:252px;
  border:1px solid #ffffffa0;
  border-radius:26px 30px 30px 14px;
  box-shadow:0 20px 38px #76534625, inset 0 1px #ffffff8a;
  padding:23px 20px;
}
.book-cover:after{
  content:"";
  position:absolute;inset:8px;
  border:1px solid #ffffff59;border-radius:20px 24px 24px 10px;
  pointer-events:none;
}
.book-cover.tone1{background:linear-gradient(155deg,#edc5bd,#d69b9a)}
.book-cover.tone2{background:linear-gradient(155deg,#d9d0e7,#b7aacb)}
.book-cover.tone3{background:linear-gradient(155deg,#d7dfc8,#aebd9d)}
.book-cover.tone4{background:linear-gradient(155deg,#f0d5b6,#d8ae8c)}
.book-cover strong{color:#fffdfb;text-shadow:0 2px 10px #5f3c3650}
.book-cover small,.book-cover em{color:#fffaf4}
.book-meta{padding:12px 6px 0}
.book-title{font-size:18px;font-weight:800;color:#604744}
.book-progress .bar,.progress-track{background:#ecdfda}
.book-progress .bar i,.progress-track i{background:linear-gradient(90deg,#d79d93,#b9abca,#aebb9f)}
.library-banner{
  border:1px solid #ebd9d2;
  border-radius:28px;
  background:linear-gradient(135deg,#fff9f5,#f3e5df);
  box-shadow:0 18px 44px #76514316;
  color:#765a56;
}
.bottom-nav{
  left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 28px));
  transform:translateX(-50%);
  border:1px solid #ead8d2;
  border-radius:24px;
  background:#fffaf7e8;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 48px #6b483b26;
  overflow:hidden;
}
.bottom-nav button{color:#9b817c;border-radius:18px;margin:7px 4px;padding:9px 8px}
.bottom-nav button.active{color:#9b625f;background:linear-gradient(180deg,#f6ded9,#f3ebe5);font-weight:800}
.top-row{min-height:56px;align-items:center}
.back-btn{
  width:44px;height:44px;border-radius:16px;
  border:1px solid #ecdcd6;background:#fffaf7;
  box-shadow:0 8px 20px #78524814;
}
.track-name{color:#755651;font-weight:800}
.track-screen{overflow:hidden}
.track-shell{animation:trackFade .24s ease both}
.track-shell.slide-from-right{animation:trackInRight .28s cubic-bezier(.2,.75,.25,1) both}
.track-shell.slide-from-left{animation:trackInLeft .28s cubic-bezier(.2,.75,.25,1) both}
@keyframes trackFade{from{opacity:.6}to{opacity:1}}
@keyframes trackInRight{from{opacity:.45;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes trackInLeft{from{opacity:.45;transform:translateX(-46px)}to{opacity:1;transform:none}}
.track-swipe-surface{touch-action:pan-y;min-height:calc(100dvh - 180px)}
.track-swipe-hint{margin-left:auto;font-size:11px;color:#b69b94;background:#fff8f5;border:1px solid #efddd7;border-radius:99px;padding:7px 10px}
.track-dots{display:flex;justify-content:center;gap:7px;margin:0 0 15px}
.track-dot{width:7px;height:7px;border:0;border-radius:99px;padding:0;background:#dbc9c4;transition:.2s}
.track-dot.active{width:24px;background:#c68c84}
.track-hero{
  border:1px solid #eeddd7;
  border-radius:32px;
  background:linear-gradient(140deg,#fffaf7,#f5e5df);
  box-shadow:0 24px 58px #76504519;
  padding:24px;
}
.track-mini{
  border-radius:22px;
  border:1px solid #ffffff90;
  background:linear-gradient(155deg,#d7a19c,#bea9c8);
  box-shadow:0 16px 30px #75514928;
}
.track-copy{padding:6px 4px}
.track-headline{color:#5b4240;font-weight:800}
.track-desc{color:#957b76}
.chapter-list{display:grid;gap:12px}
.chapter-row{
  border:1px solid #ecddd8;
  border-radius:22px;
  background:#fffcfae8;
  box-shadow:0 9px 24px #72504410;
  min-height:82px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.chapter-row:active{transform:scale(.988)}
.chapter-row.current{
  border-color:#deb1a9;
  background:linear-gradient(135deg,#fff6f2,#f7e1dc);
  box-shadow:0 14px 30px #9b6c611b;
}
.chapter-num{
  background:#f3ded8;color:#a46864;border-radius:14px;
  font-weight:850;
}
.status-chip.reading{background:#f1d8d4;color:#9d625e}
.status-chip.done{background:#dfe8d7;color:#6f8066}
.swipe-caption{text-align:center;color:#b19791;font-size:12px;margin:8px 0 16px}

.reader-heading strong,.topic-title{color:#fff7f0}
.reader-heading small{color:#d6aaa0}
.topic-title{font-weight:800;letter-spacing:-.04em}
.chapter-ribbon{

  background:linear-gradient(90deg,#44312e,#2f2524);

.section-marker{background:linear-gradient(90deg,#382a28,#2d2524 78%);border-color:#5a4440}

.reader-flow p{color:#f5e8e1}

@media(max-width:720px){

  .display-title{font-size:44px}
  .continue-card{border-radius:28px}

  .track-swipe-hint{display:none}

<script id="course" type="application/json">{"schema":"codingroadmap-live-v1","version":1790178046203,"label":"0.9.7 · Track 2 초보자 초상세판 · 실제 줄 의미 중심","tracks":[{"id":1,"title":"코딩의 시작","subtitle":"8개 챕터 · 121장 · 정답·풀이 포함","available":true,"chapters":["코딩이란?","실행 흐름","변수","타입","입력과 형변환","오류와 디버깅","연산","미니 프로젝트"]},{"id":2,"title":"Python 기초","subtitle":"8개 챕터 · 234장 · 초보 확장 설명·예제·실습·정답풀이 포함","available":true,"chapters":["조건문 if","반복문 for·while","함수 만들기","리스트와 딕셔너리","문자열 다루기","파일 읽기와 쓰기","예외 처리","Python 자동화 미니 프로젝트"]},{"id":3,"title":"문제 해결","subtitle":"8개 챕터 · 문제 분해부터 AI 협업 검증까지","available":true,"chapters":["문제를 작은 단계로 쪼개기","작은 단계를 알고리즘으로 연결하기","상태와 데이터 흐름 추적하기","조건과 반복으로 흐름 설계하기","함수로 역할을 나누고 연결하기","오류를 재현하고 원인을 좁히기","테스트와 경계값으로 검증하기","AI와 함께 문제를 설계·수정·검증하기"]},{"id":4,"title":"웹의 기본","subtitle":"화면과 인터넷이 연결되는 구조","available":false,"chapters":[]},{"id":5,"title":"TypeScript","subtitle":"움직이는 웹앱 만들기","available":false,"chapters":[]},{"id":6,"title":"SQL과 데이터","subtitle":"저장하고 다시 찾는 법","available":false,"chapters":[]},{"id":7,"title":"API와 백엔드","subtitle":"앱 뒤쪽 만들기","available":false,"chapters":[]},{"id":8,"title":"Android 앱","subtitle":"Galaxy에서 직접 실행하기","available":false,"chapters":[]},{"id":9,"title":"Git·테스트·디버깅","subtitle":"망가뜨리지 않고 고치기","available":false,"chapters":[]},{"id":10,"title":"AI 활용 개발","subtitle":"LLM을 앱 기능으로 넣기","available":false,"chapters":[]},{"id":11,"title":"운영 기초","subtitle":"작은 앱의 오류와 데이터 보관","available":false,"chapters":[]}],"chapters":[{"chapter":1,"title":"코딩이란?","pages":[{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":["이 챕터에서 실제로 반복해서 나오는 단어를 먼저 익힙니다. 전부 외우려 하지 말고, ‘이 단어를 보면 어떤 개념인지’ 정도를 떠올릴 수 있으면 충분합니다.","각 단어는 뜻만 적지 않고 어디에서 쓰는지와 간단한 예시까지 붙였습니다. 뒤의 본문에서 같은 단어를 다시 만났을 때 의미가 훨씬 빨리 연결됩니다."],"glossary":[{"term":"program 프로그램","description":"컴퓨터가 해야 할 일을 순서대로 적어 둔 명령들의 묶음입니다. 한두 줄의 코드도 실행 목적을 가지면 프로그램의 일부가 될 수 있고, 여러 기능이 모이면 하나의 앱이나 도구가 됩니다.","usage":"여러 코드가 어떤 목표를 위해 함께 움직이는지 설명할 때 씁니다.","example":"예: 계산기 프로그램은 입력을 받고 계산한 뒤 결과를 출력합니다."},{"term":"code 코드","description":"프로그래밍 언어의 규칙에 맞춰 사람이 작성한 원문입니다. 컴퓨터가 바로 이해하는 최종 형태라기보다, 실행 환경이 읽고 처리할 수 있도록 적은 지시문이라고 보면 됩니다.","usage":"프로그램의 구체적인 명령이나 한 줄 한 줄을 말할 때 사용합니다.","example":"예: print(\"안녕\")은 화면에 글자를 보여 주는 코드입니다."},{"term":"programming 프로그래밍","description":"문제를 작은 단계로 나누고, 그 단계를 코드로 표현하고, 실행 결과를 확인하며 수정하는 전체 과정을 말합니다. 단순히 문법을 외우는 것보다 문제를 구조화하고 검증하는 과정까지 포함합니다.","usage":"기능을 설계하고 코드를 작성·수정·테스트하는 전체 활동을 설명할 때 씁니다.","example":"예: 지출 계산기를 설계하고 코드를 작성해 테스트하는 과정이 프로그래밍입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c1-p1"},{"kind":"glossary","eyebrow":"CHAPTER 01 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":["두 번째 단어집은 이 챕터의 코드를 읽거나 오류를 검색할 때 특히 자주 보게 되는 표현들입니다. 한국어 뜻과 영어 원어를 함께 알아두면 인터넷 문서나 AI 답변을 이해하기 쉬워집니다.","예시는 완성된 프로그램을 외우기 위한 것이 아니라, 단어가 실제 코드에서 어떤 모습으로 나타나는지 빠르게 알아보기 위한 최소 예시입니다."],"glossary":[{"term":"Python 파이썬","description":"사람이 비교적 읽기 쉬운 문법을 가진 프로그래밍 언어입니다. 데이터 처리, 자동화, 웹, AI 등 다양한 분야에서 사용되며 입문자가 코드 흐름을 익히기에도 적합합니다.","usage":"이 트랙에서 예제 코드를 작성하고 실행할 언어로 사용합니다.","example":"예: age = 37처럼 값을 변수에 저장하는 문법을 Python으로 작성합니다."},{"term":"run / execute 실행","description":"작성해 둔 코드를 실제로 처리해 결과를 만들도록 요청하는 동작입니다. 코드를 수정했더라도 다시 실행하지 않으면 새 결과가 보이지 않을 수 있습니다.","usage":"코드가 실제로 어떻게 동작하는지 확인하거나 수정 결과를 검증할 때 사용합니다.","example":"예: 코드 편집 후 Run 버튼을 눌러 출력이 바뀌었는지 확인합니다."},{"term":"output 출력","description":"프로그램이 처리한 결과를 바깥으로 보여 주거나 전달하는 것을 말합니다. 화면의 글자, 파일에 저장된 내용, 앱의 화면 변화 모두 넓게는 출력이 될 수 있습니다.","usage":"프로그램이 사용자에게 어떤 결과를 제공했는지 말할 때 씁니다.","example":"예: print(5)의 화면 결과 5는 출력입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c1-p2"},{"id":"t1-c1-setup","kind":"concept","eyebrow":"시작하기 전 · 준비","title":"코드는 어디에 적고 실행하나요?","paragraphs":["이 앱은 교재를 읽고 코드를 복사하는 학습 리더입니다. Python 코드를 직접 실행하는 기능은 아직 없습니다. 예제의 실행 결과는 설명이며 실행 버튼을 누른 결과가 아닙니다.","Python을 실행할 수 있는 편집기에서 새 파일을 만들고 이름을 hello.py로 정하세요. .py는 Python 코드 파일이라는 표시입니다. 휴대폰·태블릿이라면 Python 실행 앱 또는 웹 실행 환경을 별도로 열어야 합니다.","아래 코드를 붙여넣고 실행(Run)하면 출력 창에 안녕하세요가 보여야 합니다. 입력을 받는 예제는 input()을 지원하는 환경인지도 확인하세요.","휴대폰 키보드가 따옴표를 “ ”처럼 둥근 모양으로 바꾸면 오류가 날 수 있습니다. 코드의 따옴표는 \" 또는 '를 사용하고, 처음에는 복사한 예제로 성공한 뒤 한 글자씩 바꾸세요."],"code":"print(\"안녕하세요\")","codeNote":"출력 창: 안녕하세요","bullets":["코드 입력 칸과 출력 창을 구분하기","수정한 코드를 저장한 뒤 다시 실행하기","실행 환경이 준비되지 않았다면 우선 출력 예상 연습부터 하기"]},{"kind":"concept","eyebrow":"CHAPTER 01 · 큰 그림","title":"코딩은 컴퓨터에게 일을 시키는 방법입니다","paragraphs":["컴퓨터는 사람이 원하는 일을 눈치로 알아듣지 못합니다. 그래서 우리가 원하는 일을 일정한 규칙에 맞춰 명령으로 적어 줍니다. 그 명령들의 묶음이 프로그램이고, 그 원문이 코드(code)입니다.","코딩(coding) 또는 프로그래밍(programming)은 이 코드를 만들고 고치는 일입니다. Python은 코드를 적는 여러 프로그래밍 언어 중 하나이며, 이 트랙에서는 Python을 이용해 가장 기본적인 코딩 사고방식을 익힙니다.","처음부터 CPU·메모리 같은 깊은 원리를 외울 필요는 없습니다. 지금은 ‘내가 코드를 적는다 → 실행 환경이 읽는다 → 실제 결과가 나온다’는 연결을 정확히 이해하면 충분합니다.","사람에게는 ‘적당히 알아서 해’라는 표현이 통하지만 컴퓨터는 그렇지 않습니다. 명령이 정확히 무엇을 뜻하는지, 어떤 순서로 처리할지, 어떤 값을 사용할지를 코드로 분명하게 적어야 합니다. 그래서 코딩은 단순히 명령어를 외우는 일이 아니라, 하고 싶은 일을 작은 단계로 나누고 모호하지 않게 표현하는 연습이기도 합니다.","코드는 컴퓨터만 읽는 글이 아닙니다. 며칠 뒤의 나와 다른 사람도 읽습니다. 그래서 같은 결과가 나오더라도 의미가 잘 보이는 이름과 단순한 구조를 쓰는 것이 중요합니다. 처음부터 멋진 코드를 쓰려 하기보다 ‘읽었을 때 무슨 일을 하는지 알 수 있는가’를 기준으로 보면 됩니다."],"keywords":["program 프로그램","code 코드","programming 프로그래밍","Python 파이썬","run 실행","output 출력"],"calloutTitle":"이번 챕터의 목표","calloutBody":"코딩이 무엇인지 자기 말로 설명하고, 아주 짧은 Python 코드를 실행해 결과를 확인할 수 있으면 됩니다.","extras":[],"visibleExtras":2,"id":"t1-c1-p3"},{"kind":"visual","eyebrow":"흐름으로 이해하기","title":"코드는 실행되어야 결과가 생깁니다","paragraphs":["소스 코드는 사람이 읽고 고칠 수 있는 원문입니다. Python 실행 환경은 그 코드를 읽고 명령을 순서대로 처리합니다.","앱에서 버튼을 누르면 화면이 바뀌는 것도 같은 구조입니다. 사용자의 입력이 들어오고, 프로그램이 정해 둔 규칙대로 처리한 뒤, 화면이나 파일 같은 결과가 나옵니다.","코드를 적어 두기만 하면 아무 일도 일어나지 않습니다. 실제 결과가 생기려면 실행(run)이 필요합니다. 실행은 ‘작성된 코드를 지금 이 순간 실제로 처리해 보라’는 요청입니다. 편집 화면과 실행 결과 화면을 구분하는 습관은 초보 단계에서 매우 중요합니다.","출력(output)은 프로그램이 우리에게 보내는 피드백입니다. 예상한 출력과 실제 출력이 같으면 현재까지의 가설이 맞았다는 뜻이고, 다르면 어디에서 생각이 달라졌는지 찾을 단서가 됩니다. 그래서 실행 결과를 그냥 보는 것이 아니라 ‘내 예상과 같은가?’라고 비교하는 습관을 들이는 것이 좋습니다."],"visual":"CODE_TO_OUTPUT","bullets":["사람이 소스 코드를 작성합니다.","Python이 코드를 실행합니다.","실행 결과가 화면에 출력됩니다.","코드를 바꾸면 결과도 바뀔 수 있습니다.","코드를 수정한 뒤에는 다시 실행해야 바뀐 결과를 볼 수 있습니다.","결과가 이상하면 먼저 ‘내가 수정한 파일을 실제로 실행했는가?’도 확인합니다."],"extras":[],"visibleExtras":0,"id":"t1-c1-p4"},{"kind":"concept","eyebrow":"CHAPTER 01 · 흐름 심화","title":"실제로 연결해서 이해하기","paragraphs":["실제 앱에서도 버튼 클릭, 입력값 처리, 화면 갱신은 모두 코드가 실행되어 결과를 만드는 과정입니다.","코드는 적어 두는 순간 끝나는 글이 아니라, 실행될 때 실제 상태를 바꾸거나 결과를 만드는 절차입니다. 그래서 코드를 읽을 때는 “무슨 문장이 적혀 있나”와 “실행했을 때 무엇이 바뀌나”를 나눠 생각하면 훨씬 정확해집니다.","print(\"시작\")처럼 눈에 보이는 출력 한 줄을 넣으면 어느 지점까지 코드가 실행됐는지 확인할 수 있습니다. 앱에서도 로그나 화면 변화가 같은 역할을 합니다.","한 단계 더 들어가면 프로그램은 입력을 받고, 현재 상태를 참고해 처리한 뒤, 출력이나 상태 변화라는 결과를 남깁니다. 같은 코드를 실행해도 입력이나 시작 상태가 달라지면 결과가 달라질 수 있다는 점까지 이해하면 이후 변수·조건문·함수를 배울 때 연결이 쉬워집니다.","초보자가 자주 하는 실수는 코드를 수정한 것과 수정된 코드가 실제로 실행된 것을 같은 일로 생각하는 것입니다. 저장만 하고 다시 실행하지 않았거나, 내가 바꾼 줄까지 실행 흐름이 도달하지 않았다면 화면 결과는 바뀌지 않을 수 있습니다.","앞으로 앱의 버튼, 입력칸, 화면 갱신을 배울 때도 원리는 같습니다. 사용자의 행동이 입력이 되고, 코드가 실행되며, 그 결과로 화면이나 데이터가 바뀝니다. 지금 배우는 짧은 Python 코드가 나중의 앱 동작과 같은 구조를 가진 셈입니다."],"keywords":["실행 흐름","입력·처리·출력","상태 변화","읽기 쉬운 코드"],"extras":[],"visibleExtras":0,"id":"t1-c1-p5"},{"kind":"example","eyebrow":"첫 코드","title":"print로 결과를 눈으로 확인합니다","paragraphs":["print()는 값을 화면에 보여 주는 Python 함수입니다. 처음에는 ‘코드가 정말 실행됐는지 확인하는 창’이라고 생각하면 쉽습니다.","따옴표 안의 글자는 그대로 출력되고, 따옴표가 없는 숫자 계산식은 먼저 계산된 뒤 결과가 출력됩니다.","print는 함수(function)입니다. 지금은 함수라는 용어를 깊게 외울 필요는 없고, ‘괄호 안에 값을 넣으면 화면에 보여 주는 도구’라고 이해하면 충분합니다. print(2 + 3)에서는 괄호 안의 2 + 3이 먼저 5라는 값을 만들고, 그 값이 print에 전달됩니다.","반대로 print(\"2 + 3\")에서는 따옴표가 있기 때문에 2 + 3 전체가 글자입니다. 컴퓨터는 우리가 보는 모양보다 문법을 기준으로 판단합니다. 같은 문자 조합이라도 따옴표, 괄호, 연산자 같은 기호가 붙는 방식에 따라 의미가 달라집니다."],"code":"print(\"안녕하세요\")\nprint(2 + 3)\nprint(\"2 + 3\")","codeNote":"예상 결과: 안녕하세요 / 5 / 2 + 3\n\n실행 전에 세 줄의 결과를 순서대로 적어 본 뒤 실제 출력과 비교하세요. 틀려도 괜찮습니다. ‘왜 틀렸는지’를 설명할 수 있으면 학습이 된 것입니다.","calloutTitle":"보이는 모양이 같아도 내부 의미는 다를 수 있습니다","calloutBody":"print(10)과 print(\"10\")은 화면에서는 비슷해 보여도 하나는 숫자, 하나는 문자열입니다. 타입은 Chapter 4에서 자세히 배웁니다.","extras":[],"visibleExtras":2,"id":"t1-c1-p6"},{"kind":"practice","eyebrow":"실습 A · 직접 바꾸기","title":"코드 한 글자를 바꾸고 결과를 비교하세요","paragraphs":["코딩은 눈으로만 읽는 것보다 직접 바꾸고 실행할 때 훨씬 빨리 익숙해집니다. 아래 코드를 그대로 실행한 뒤, 이름과 숫자를 자기 값으로 바꿔 보세요.","실행 버튼을 누르기 전에 결과를 먼저 예상하는 습관을 들이면 디버깅 능력도 함께 자랍니다.","실습에서는 한 번에 여러 곳을 바꾸지 않는 것이 좋습니다. 이름 하나만 바꾸고 실행한 뒤, 숫자 하나를 바꾸고 다시 실행하면 어떤 변경이 어떤 결과를 만들었는지 분명하게 볼 수 있습니다. 이것은 나중에 디버깅할 때도 그대로 쓰는 방식입니다.","예상 결과를 먼저 적는 이유는 기억력 테스트를 하려는 것이 아닙니다. 내가 코드를 어떻게 해석했는지 밖으로 꺼내 놓기 위해서입니다. 예상과 실제가 다르면 ‘코드를 잘못 읽은 지점’을 찾을 수 있고, 같으면 현재 이해가 맞는지 확인할 수 있습니다."],"code":"print(\"민수\")\nprint(8 + 9)\nprint(7)","practicePrompt":"① 이름을 내 이름으로 바꾸기 ② 8 + 9를 다른 계산으로 바꾸기 ③ 실행 전에 결과를 종이에 적기","extras":[],"visibleExtras":2,"id":"t1-c1-p7","answerOnNext":true},{"id":"t1-c1-p7-solution","kind":"solution","eyebrow":"정답과 풀이","title":"코드 한 글자를 바꾸고 결과를 비교하세요 · 풀이","paragraphs":["첫 줄은 따옴표 안의 이름을 그대로 보여 줍니다.","둘째 줄은 10 + 5를 먼저 계산해서 15를 보여 줍니다.","셋째 줄은 숫자 7을 보여 줍니다. 이름만 바꿔도 뒤 두 줄의 결과는 그대로입니다."],"code":"print(\"승원\")\nprint(10 + 5)\nprint(7)","codeNote":"실행 결과 또는 테스트 기준\n승원\n15\n7"},{"kind":"concept","eyebrow":"CHAPTER 01 · 실습 확장","title":"코드 한 글자를 바꾸고 결과를 비교하세요 — 이어서 이해하기","paragraphs":["print(\"안녕\")을 print(\"안녕하세요\")로 바꾸면 바뀐 코드와 바뀐 출력의 관계가 아주 분명합니다. 처음에는 한 번에 한 요소만 바꿔야 변화의 원인을 정확히 볼 수 있습니다."],"keywords":["실행 흐름","입력·처리·출력","상태 변화","읽기 쉬운 코드"],"extras":[],"visibleExtras":0,"id":"t1-c1-p8"},{"kind":"check","eyebrow":"확인 문제","title":"코딩의 큰 그림을 확인합니다","paragraphs":["아래 질문에 답한 뒤 정답을 열어 보세요.","문제를 풀 때는 먼저 따옴표 안과 밖을 나눠 보세요. 따옴표 안은 문자열 그대로이고, 따옴표 밖의 계산식은 실제 계산 대상입니다. 그다음 print가 무엇을 받는지 확인하면 결과를 예측하기 쉬워집니다.","이처럼 문법 기호를 기준으로 코드를 읽는 습관은 앞으로도 계속 사용합니다. 괄호, 따옴표, 등호, 콜론 같은 기호는 장식이 아니라 Python에게 의미를 전달하는 문법입니다."],"question":"print(\"2 + 3\")과 print(2 + 3)은 왜 결과가 다를까요?","extras":[],"visibleExtras":5,"id":"t1-c1-p9","answerOnNext":true},{"id":"t1-c1-p9-solution","kind":"solution","eyebrow":"정답과 풀이","title":"코딩의 큰 그림을 확인합니다 · 풀이","paragraphs":["첫 번째는 따옴표 안의 글자를 그대로 출력하므로 2 + 3이 보입니다. 두 번째는 2 + 3이라는 표현식을 먼저 계산해 5를 만든 뒤 그 값을 출력합니다."],"extras":[]},{"kind":"summary","eyebrow":"Chapter 1 정리","title":"지금 알아야 할 것","paragraphs":["프로그램은 컴퓨터가 해야 할 일을 순서대로 적어 놓은 명령들의 묶음입니다. 코드는 그 프로그램을 만드는 원문이고, Python은 그 코드를 적는 언어입니다.","가장 중요한 한 문장은 ‘사람이 코드를 쓰고, Python 실행 환경이 그 코드를 읽어 실제 결과를 만든다’입니다.","다음 챕터에서는 여러 줄의 코드가 어떤 순서로 실행되는지 배웁니다.","트랙1 전체에서 가장 중요한 학습 방식은 ‘읽기 → 예상하기 → 조금 바꾸기 → 실행하기 → 실제 결과와 비교하기’입니다. 이 다섯 단계를 반복하면 새로운 문법을 배울 때도 같은 방법을 적용할 수 있습니다.","지금 단계에서 모든 용어를 외우지 못해도 괜찮습니다. program, code, run, output 정도를 보고 대략 뜻을 떠올릴 수 있고, 모르는 단어를 검색할 수 있으면 충분합니다. 다음 챕터부터는 실제 코드를 한 줄씩 추적하는 연습이 시작됩니다."],"bullets":["코드(code)와 프로그램(program)을 구분할 수 있다.","print()로 결과를 확인할 수 있다.","코딩은 명령어 암기보다 문제를 작은 단계로 표현하는 능력이 중요합니다."],"extras":[],"visibleExtras":2,"id":"t1-c1-p10"},{"kind":"concept","eyebrow":"CHAPTER 01 · 심화 정리","title":"지금 알아야 할 것 — 한 단계 더","paragraphs":["코드는 컴퓨터에게 정확한 절차를 전달하는 글이며, 동시에 나중에 다시 읽을 사람을 위한 설명이기도 합니다. 이 챕터에서는 실행과 출력의 연결을 놓치지 않는 것이 핵심입니다.","“입력을 받고 → 코드가 실행되고 → 결과가 나온다”는 문장을 기준으로 지금까지의 용어를 연결해 보세요. 프로그램, 코드, 실행, 출력이 따로 떨어진 단어가 아니라 하나의 흐름이 됩니다."],"keywords":["실행 흐름","입력·처리·출력","상태 변화","읽기 쉬운 코드"],"extras":[],"visibleExtras":0,"id":"t1-c1-p11"}],"track":1,"id":"t1-c1","remember":"print와 따옴표의 역할","practiceGoal":"이름과 계산식을 바꾸고 출력 비교","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":2,"title":"실행 흐름","pages":[{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"execution order 실행 순서","description":"코드가 실제로 처리되는 순서를 뜻합니다. Python은 기본적으로 위에서 아래로 실행하지만, 이후 조건문과 반복문을 배우면 흐름이 갈라지거나 되돌아갈 수 있습니다.","usage":"결과가 왜 그 순서로 나왔는지 추적할 때 사용합니다.","example":"예: print(\"A\") 다음 줄에 print(\"B\")가 있으면 A가 먼저 출력됩니다."},{"term":"flow 흐름","description":"프로그램이 어느 코드에서 시작해 어떤 순서로 다음 단계로 이동하는지를 말합니다. 단순한 코드에서는 직선처럼 보이지만 조건과 반복이 생기면 여러 경로를 가질 수 있습니다.","usage":"코드가 어느 길로 실행되는지 큰 그림을 설명할 때 씁니다.","example":"예: 입력 → 계산 → 출력은 가장 단순한 실행 흐름입니다."},{"term":"statement 문장","description":"Python이 하나의 명령 단위로 실행하는 코드 조각을 뜻합니다. 대입문이나 print 호출처럼 프로그램에 실제 동작을 지시하는 부분을 생각하면 쉽습니다.","usage":"한 줄 또는 하나의 실행 단위를 구분해 설명할 때 사용합니다.","example":"예: age = 37은 값을 변수에 저장하는 statement입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c2-p1"},{"kind":"glossary","eyebrow":"CHAPTER 02 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"expression 표현식","description":"계산되어 하나의 값이 되는 코드 조각입니다. 숫자 계산뿐 아니라 변수 조회, 함수 호출, 문자열 연결도 결과값을 만들면 표현식으로 볼 수 있습니다.","usage":"한 줄 안에서 먼저 어떤 값이 만들어지는지 분석할 때 씁니다.","example":"예: 3 * 2 + 1은 계산 결과 7을 만드는 expression입니다."},{"term":"comment 주석","description":"# 뒤에 적는 사람용 메모이며 Python은 실행하지 않습니다. 코드만 보고 알 수 없는 이유나 의도를 남길 때 특히 유용합니다.","usage":"코드의 목적이나 주의점을 다음에 읽을 사람에게 설명할 때 사용합니다.","example":"예: # 배송비는 5만원 이상 무료 라고 규칙을 적을 수 있습니다."},{"term":"control flow 제어 흐름","description":"프로그램의 실행 순서를 결정하는 전체 구조를 뜻합니다. 지금은 순차 실행이 중심이지만 if, for, while을 배우면 어떤 코드가 실행되고 건너뛰는지가 더 중요해집니다.","usage":"조건이나 반복 때문에 실행 경로가 바뀌는 코드를 설명할 때 씁니다.","example":"예: 점수가 60 이상일 때만 합격 문구를 보여 주는 if가 control flow를 바꿉니다."}],"extras":[],"visibleExtras":1,"id":"t1-c2-p2"},{"kind":"concept","eyebrow":"CHAPTER 02 · 코드 읽기","title":"Python은 기본적으로 위에서 아래로 실행합니다","paragraphs":["프로그램은 여러 명령이 모인 것입니다. 특별한 지시가 없다면 Python은 위에 적힌 줄부터 아래 줄까지 차례대로 실행합니다. 이 기본 흐름을 알면 짧은 코드를 읽을 때 결과를 훨씬 쉽게 예상할 수 있습니다.","코드의 내용뿐 아니라 위치와 순서도 의미의 일부입니다. 값을 만들기 전에 사용하면 NameError가 날 수 있고, 출력 순서를 바꾸면 화면에 보이는 순서도 달라집니다.","순차 실행(sequential execution)은 아주 단순해 보이지만 코드를 읽는 기본 축입니다. 한 줄이 실행되면서 변수 값이나 출력 결과가 바뀌고, 그 바뀐 상태가 다음 줄에 영향을 줄 수 있기 때문입니다. 그래서 ‘지금 몇 번째 줄인가?’와 ‘지금까지 무엇이 바뀌었는가?’를 함께 추적하는 것이 중요합니다.","나중에 조건문과 반복문을 배우면 실행 흐름이 위에서 아래로만 가지 않고 건너뛰거나 되돌아오기도 합니다. 그렇기 때문에 지금 순차 실행을 정확히 익혀 두면 복잡한 흐름을 이해할 때 기준점을 잡기 쉽습니다."],"keywords":["execution order 실행 순서","flow 흐름","sequential execution 순차 실행","statement 문장","expression 표현식"],"calloutTitle":"코드를 읽는 첫 번째 방법","calloutBody":"① 위에서 아래로 읽기 ② 각 줄이 무슨 일을 하는지 보기 ③ 한 줄 안에서는 먼저 계산되는 부분을 찾기","extras":[],"visibleExtras":3,"id":"t1-c2-p3"},{"kind":"concept","eyebrow":"CHAPTER 02 · 개념 심화","title":"Python은 기본적으로 위에서 아래로 실행합니다 — 이어서 이해하기","paragraphs":["실행 흐름을 안다는 것은 단순히 “위에서 아래”라는 문장을 외우는 것이 아니라, 특정 순간에 어느 줄이 실행 중이고 그 직전까지 어떤 값이 만들어졌는지를 추적할 수 있다는 뜻입니다. 이 습관이 생기면 결과가 예상과 달라도 원인을 훨씬 빨리 찾을 수 있습니다.","x = 1 다음에 x = x + 2가 있다면 두 번째 줄을 읽은 뒤 현재 x는 3입니다. 다음 줄은 항상 최신 값을 사용하므로 줄마다 상태를 갱신해야 합니다.","조금 더 어려운 관점에서는 한 줄 안에서도 먼저 값을 계산한 뒤 그 결과를 대입하거나 함수에 전달합니다. 예를 들어 total = price * count에서는 오른쪽 계산이 먼저 끝나고, 그 결과가 total이라는 이름과 연결됩니다. “줄의 순서”뿐 아니라 “한 줄 안의 평가 순서”도 있다는 점을 기억하세요.","코드를 읽으면서 머릿속으로 여러 줄을 한꺼번에 처리하면 현재 값이 쉽게 꼬입니다. 특히 같은 변수가 여러 번 바뀌면 처음 값과 현재 값을 섞기 쉽습니다. 한 줄이 끝날 때마다 현재 값을 짧게 적는 방식이 가장 안전합니다.","조건문과 반복문을 배우면 실행 순서는 단순한 직선이 아니라 갈라지거나 되돌아옵니다. 지금부터 현재 위치와 현재 값을 추적하는 습관을 만들면 이후 복잡한 흐름도 같은 방식으로 읽을 수 있습니다."],"keywords":["위에서 아래","현재 위치","표현식 평가","상태 추적"],"extras":[],"visibleExtras":0,"id":"t1-c2-p4"},{"kind":"visual","eyebrow":"눈으로 보는 실행 순서","title":"한 줄씩 현재 위치를 따라가세요","paragraphs":["처음 보는 코드를 한 번에 이해하려 하지 말고, 현재 실행 위치가 어디인지 표시하면서 따라가면 됩니다.","한 줄 안에 계산식이 있다면 계산이 먼저 끝난 뒤 그 결과를 바깥 명령이 사용합니다.","코드를 따라갈 때 머릿속으로만 기억하지 말고 간단한 추적표를 만들어도 좋습니다. 왼쪽에는 줄 번호, 가운데에는 실행한 코드, 오른쪽에는 그 시점의 출력이나 변수 값을 적습니다. 초보일수록 이렇게 눈에 보이게 기록하면 실수가 크게 줄어듭니다.","실행 흐름을 추적하는 능력은 디버깅과 직접 연결됩니다. 프로그램이 기대와 다르게 동작하면 ‘어느 줄까지는 예상대로였고, 어느 줄부터 달라졌는가?’를 찾아야 하기 때문입니다."],"visual":"TOP_TO_BOTTOM","bullets":["1번 줄 실행","2번 줄 실행","3번 줄 실행","각 줄 안의 표현식은 필요한 순서로 계산","줄 번호와 현재 출력값을 함께 적으면 흐름이 보입니다.","값이 바뀌는 코드라면 ‘실행 전 값 → 실행 후 값’을 기록합니다."],"extras":[],"visibleExtras":1,"id":"t1-c2-p5"},{"kind":"concept","eyebrow":"CHAPTER 02 · 흐름 심화","title":"한 줄씩 현재 위치를 따라가세요 — 이어서 이해하기","paragraphs":["실행 흐름을 추적하는 습관은 이후 조건문·반복문과 디버깅의 기반이 됩니다. ‘지금 어느 줄이고, 현재 값이 무엇인가’를 계속 확인하세요.","화살표나 줄 번호를 따라가며 “지금 이 줄”, “이 줄이 끝난 뒤 값”을 말로 설명하면 눈으로만 읽을 때보다 흐름을 놓치지 않습니다."],"keywords":["위에서 아래","현재 위치","표현식 평가","상태 추적"],"extras":[],"visibleExtras":0,"id":"t1-c2-p6"},{"kind":"example","eyebrow":"예제","title":"순서를 바꾸면 결과도 바뀝니다","paragraphs":["아래 코드는 세 개의 print 문장이 적힌 순서대로 실행됩니다. 가운데 줄을 위로 옮기면 출력 순서도 함께 바뀝니다.","# 뒤의 내용은 주석(comment)입니다. Python은 실행하지 않고 사람에게 남기는 메모로 취급합니다.","#으로 시작하는 주석은 Python이 실행하지 않습니다. 하지만 사람에게는 매우 중요할 수 있습니다. 특히 왜 이런 선택을 했는지, 나중에 확인해야 할 점이 무엇인지 남기는 데 유용합니다.","다만 ‘print는 출력한다’처럼 코드만 봐도 바로 알 수 있는 내용을 주석으로 반복하면 오히려 읽을 내용만 늘어납니다. 좋은 주석은 코드 자체로 드러나지 않는 이유나 의도를 보완합니다.","디버깅할 때는 임시 print를 중간중간 넣어 ‘여기까지 실행됐는지’, ‘이 시점의 값이 무엇인지’를 확인하기도 합니다. 문제를 찾은 뒤에는 불필요한 임시 출력은 정리하는 편이 좋습니다."],"code":"print(\"첫 번째\")\nprint(\"두 번째\")\n# 이 줄은 실행되지 않습니다\nprint(\"세 번째\")","codeNote":"출력: 첫 번째 → 두 번째 → 세 번째","extras":[],"visibleExtras":3,"id":"t1-c2-p7"},{"kind":"practice","eyebrow":"실습 A/B · 순서와 예측","title":"순서를 직접 바꾸고 실행 전에 결과를 적으세요","paragraphs":["먼저 ‘준비 → 실행 → 완료’가 순서대로 나오게 만든 뒤, 가운데 줄만 주석 처리해 결과가 어떻게 바뀌는지 확인하세요.","실제 디버깅에서도 임시 print를 넣어 프로그램이 어디까지 실행됐는지 확인하는 경우가 많습니다.","실습에서 순서를 바꿀 때는 먼저 원래 결과를 기록해 두세요. 그런 다음 한 줄만 이동하고 새 결과를 기록하면 순서가 결과에 주는 영향을 명확하게 비교할 수 있습니다.","주석 처리 실험도 같은 원리입니다. 한 줄 앞에 #을 붙여 실행에서 제외한 뒤, 그 줄이 없어졌을 때 전체 결과가 어떻게 달라지는지 관찰하세요. 이 방식은 복잡한 코드에서 특정 부분이 문제인지 확인할 때도 쓰입니다."],"code":"print(\"준비\")\nprint(\"실행\")\nprint(\"완료\")","practicePrompt":"① ‘실행’ 줄을 첫 줄로 옮기기 ② 다시 원상복구하기 ③ 가운데 줄 앞에 #을 붙이기","extras":[],"visibleExtras":2,"id":"t1-c2-p8","answerOnNext":true},{"id":"t1-c2-p8-solution","kind":"solution","eyebrow":"정답과 풀이","title":"순서를 직접 바꾸고 실행 전에 결과를 적으세요 · 풀이","paragraphs":["# 뒤의 내용은 실행하지 않습니다. 가운데 줄은 코드가 남아 있어도 출력되지 않습니다.","두 번째 실험: 주석을 지우고 print(\"실행\") 줄을 맨 위로 옮기면 실행, 준비, 완료 순서로 보입니다."],"code":"print(\"준비\")\n# print(\"실행\")\nprint(\"완료\")","codeNote":"실행 결과 또는 테스트 기준\n준비\n완료"},{"kind":"concept","eyebrow":"CHAPTER 02 · 실습 확장","title":"순서를 직접 바꾸고 실행 전에 결과를 적으세요 — 이어서 이해하기","paragraphs":["코드 순서를 바꾸기 전에 결과를 먼저 적으면 실행 흐름을 실제로 이해했는지 확인할 수 있습니다. 정답을 맞히는 것보다 틀린 예상의 원인을 찾는 것이 더 중요합니다."],"keywords":["위에서 아래","현재 위치","표현식 평가","상태 추적"],"extras":[],"visibleExtras":0,"id":"t1-c2-p9"},{"kind":"check","eyebrow":"확인 문제","title":"문장과 표현식을 구분해 봅니다","question":"print(3 * 2 + 1)에서 먼저 계산되는 부분과 최종 출력값은 무엇일까요?","paragraphs":["print(3 * 2 + 1)을 읽을 때는 먼저 ‘print라는 바깥 명령’과 ‘3 * 2 + 1이라는 안쪽 표현식’을 나눕니다. 그다음 안쪽 표현식의 연산 순서를 해결하고, 마지막에 만들어진 값이 print로 전달된다고 보면 됩니다.","이렇게 바깥 구조와 안쪽 계산을 분리해 읽는 습관은 함수 호출이 여러 겹으로 들어간 코드를 만났을 때 특히 도움이 됩니다."],"extras":[],"visibleExtras":5,"id":"t1-c2-p10","answerOnNext":true},{"id":"t1-c2-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"문장과 표현식을 구분해 봅니다 · 풀이","paragraphs":["곱셈 3 * 2가 먼저 계산되어 6이 되고, 그 결과에 1을 더해 7이 됩니다. print는 최종값 7을 출력합니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 02 · 확인 확장","title":"문장과 표현식을 구분해 봅니다 — 이어서 이해하기","paragraphs":["3 + 4 같은 표현식은 값 7을 만들고, total = 3 + 4 같은 대입문은 그 값을 total에 연결하는 일을 합니다. 같은 줄 안에서 “값을 만드는 부분”과 “그 값을 사용하는 부분”을 구분해 보세요."],"keywords":["위에서 아래","현재 위치","표현식 평가","상태 추적"],"extras":[],"visibleExtras":0,"id":"t1-c2-p11"},{"kind":"summary","eyebrow":"Chapter 2 정리","title":"코드를 읽는 기본 습관","paragraphs":["코드를 만나면 먼저 위에서 아래로 읽고, 각 줄에서 ‘무슨 명령인지’와 ‘어떤 값이 먼저 계산되는지’를 나눠 보세요.","주석은 실행용 코드가 아니라 사람을 위한 설명입니다. 좋은 주석은 코드만 봐도 알 수 있는 말을 반복하기보다 ‘왜 이렇게 했는지’를 남깁니다.","다음 챕터에서는 값을 저장하고 다시 사용하는 변수로 넘어갑니다.","짧은 코드도 줄이 많아지면 한눈에 이해하기 어려워집니다. 그래서 실행 순서를 추적하는 능력은 ‘코드를 읽는 체력’과 같습니다. 지금부터 한 줄씩 현재 상태를 확인하는 습관을 들이면 뒤에서 조건문·반복문을 만났을 때 부담이 훨씬 줄어듭니다.","다음 챕터의 변수는 실행 흐름과 함께 봐야 합니다. 같은 변수 이름도 어느 줄까지 실행했는지에 따라 현재 값이 달라질 수 있기 때문입니다."],"bullets":["실행 위치를 한 줄씩 추적한다.","표현식은 값을 만들고, 문장은 그 값을 사용해 일을 한다.","코드 위치와 순서도 의미의 일부다.","실행 순서와 현재 상태를 함께 추적한다.","주석과 실제 실행 코드를 구분한다.","한 줄 안에서는 필요한 계산이 끝난 뒤 바깥 명령이 실행된다."],"extras":[],"visibleExtras":3,"id":"t1-c2-p12"},{"kind":"concept","eyebrow":"CHAPTER 02 · 심화 정리","title":"코드를 읽는 기본 습관 — 한 단계 더","paragraphs":["처음에는 ① 위에서 아래로 줄 확인 ② 오른쪽 계산 ③ 대입 후 현재 값 갱신 ④ 출력 확인의 순서로 읽으면 좋습니다. 같은 읽기 절차를 반복하면 긴 코드에서도 덜 흔들립니다."],"keywords":["위에서 아래","현재 위치","표현식 평가","상태 추적"],"extras":[],"visibleExtras":0,"id":"t1-c2-p13"}],"track":1,"id":"t1-c2","remember":"위에서 아래로 실행, # 주석","practiceGoal":"출력 순서 바꾸기","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":3,"title":"변수","pages":[{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"variable 변수","description":"값을 다시 사용하기 위해 붙이는 이름입니다. Python에서는 상자 자체라기보다 이름이 현재 값과 연결되어 있다고 이해하면 더 정확합니다.","usage":"입력값, 계산 결과, 상태처럼 나중에 다시 써야 할 데이터를 저장할 때 사용합니다.","example":"예: total = 15000이라고 하면 total이라는 이름으로 15000을 다시 사용할 수 있습니다."},{"term":"value 값","description":"프로그램이 실제로 다루는 데이터입니다. 숫자, 문자열, True/False뿐 아니라 이후 배우는 리스트나 딕셔너리도 모두 값이 될 수 있습니다.","usage":"변수에 저장되거나 계산에 사용되는 실제 데이터를 말할 때 씁니다.","example":"예: age = 37에서 37이 value입니다."},{"term":"assignment 대입","description":"오른쪽에서 만든 값을 왼쪽 변수 이름에 연결하는 동작입니다. 수학의 등호와 달리 ‘양쪽이 같다’보다 ‘오른쪽 값을 왼쪽에 저장한다’고 읽는 편이 맞습니다.","usage":"변수를 만들거나 새 값으로 바꿀 때 사용합니다.","example":"예: name = \"민수\"는 문자열 값을 name에 대입합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c3-p1"},{"kind":"concept","eyebrow":"CHAPTER 03 · 용어 연결","title":"용어를 실제 코드 흐름으로 연결하기","paragraphs":["세 단어를 ‘이름이 값과 연결되고 다시 바뀔 수 있다’는 흐름으로 묶어 보세요. 변수는 단독 용어보다 값·대입·재대입과 함께 이해해야 실제 코드에서 의미가 보입니다.","변수는 값을 담아 두는 상자라고 비유할 수 있지만, 실제 코드를 읽을 때는 “이 이름이 지금 어떤 값을 가리키는가”라고 생각하는 편이 더 정확합니다. 중요한 것은 변수의 처음 값이 아니라 실행의 현재 시점에서 연결된 값입니다.","변수는 이름, 대입은 이름과 값을 연결하는 동작, 재대입은 그 연결을 새 값으로 바꾸는 동작입니다. 세 단어를 따로 외우지 말고 실행 흐름으로 연결하세요.","대입문을 읽을 때는 오른쪽을 먼저 계산하고 그 결과를 왼쪽 이름에 연결한다고 생각하세요. count = count + 1은 수학의 등식이 아니라, 기존 count 값을 읽어 1을 더한 뒤 새 결과를 다시 count에 연결하는 실행 명령입니다. 이 차이를 이해하면 재대입이 자연스러워집니다.","변수 이름이 같으면 값도 계속 같을 것이라고 생각하는 실수가 많습니다. 재대입 이후에는 이전 값이 아니라 새 값을 기준으로 다음 줄이 실행됩니다. 코드 옆에 name → value 형태로 현재 연결을 적어 보면 혼동이 크게 줄어듭니다.","나중에 리스트, 객체, 함수, 앱 상태를 다룰 때도 “현재 어떤 이름이 어떤 값을 가리키는가”라는 질문이 핵심이 됩니다. 변수 추적은 단순 문법이 아니라 프로그램의 상태를 읽는 기본 기술입니다."],"keywords":["변수","대입","재대입","현재 값"],"extras":[],"visibleExtras":0,"id":"t1-c3-p2"},{"kind":"glossary","eyebrow":"CHAPTER 03 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"binding 연결","description":"변수 이름이 특정 값을 가리키도록 연결된 상태를 설명하는 표현입니다. Python의 변수 동작을 ‘상자’ 비유보다 조금 더 정확하게 설명할 때 자주 사용됩니다.","usage":"이름과 값의 관계를 설명하거나 재대입을 이해할 때 씁니다.","example":"예: name이라는 이름이 \"민수\"와 연결되었다가 \"영희\"로 다시 연결될 수 있습니다."},{"term":"reassignment 재대입","description":"이미 존재하는 변수에 새로운 값을 다시 대입하는 것입니다. 재대입 이후 같은 변수 이름을 사용하면 새 값이 사용됩니다.","usage":"카운트 증가, 누적 계산, 상태 변경처럼 현재 값을 갱신할 때 사용합니다.","example":"예: score = 10 다음에 score = 15를 실행하면 이후 score는 15입니다."},{"term":"identifier 식별자","description":"변수·함수처럼 코드 안의 대상을 구분하기 위해 붙이는 이름을 넓게 부르는 말입니다. Python의 이름 규칙을 지켜야 하며 역할이 드러나는 이름을 쓰는 것이 좋습니다.","usage":"변수명이나 함수명을 일반적으로 설명할 때 사용합니다.","example":"예: user_age와 total_price는 의미가 드러나는 identifier입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c3-p3"},{"kind":"concept","eyebrow":"CHAPTER 03 · 값 기억하기","title":"변수는 값을 다시 쓰기 위한 이름입니다","paragraphs":["프로그램에서 같은 숫자나 글자를 여러 번 직접 적으면 수정하기 어렵습니다. 그래서 값에 이름을 붙여 저장해 두고 그 이름을 다시 사용합니다. 이 이름이 변수(variable)입니다.","처음에는 변수를 ‘값을 넣는 상자’라고 생각해도 됩니다. 더 정확한 설명에서는 ‘이름이 값에 연결된다(binding)’고 표현합니다. 지금 단계에서는 두 설명이 같은 방향을 가리킨다고 이해하면 충분합니다.","변수를 사용하는 가장 큰 이유는 값을 ‘기억’하기 위해서만이 아닙니다. 값에 의미를 붙이기 위해서입니다. 15000이라는 숫자만 보면 무엇인지 알기 어렵지만 daily_budget이라는 이름이 붙으면 역할이 보입니다.","대입문을 읽을 때는 왼쪽에서 오른쪽으로 수학식처럼 읽지 말고, 먼저 오른쪽 값을 계산한 뒤 그 결과를 왼쪽 이름에 연결한다고 생각하세요. Python의 =는 ‘양쪽이 같다’는 수학의 등호와 역할이 다릅니다."],"keywords":["variable 변수","value 값","assignment 대입","binding 연결","reassignment 재대입","identifier 식별자"],"calloutTitle":"읽는 법","calloutBody":"name = \"민수\"를 보면 ‘name이라는 이름을 민수라는 값에 연결했다’라고 읽으세요.","extras":[],"visibleExtras":3,"id":"t1-c3-p4"},{"kind":"concept","eyebrow":"CHAPTER 03 · 개념 심화","title":"변수는 값을 다시 쓰기 위한 이름입니다 — 이어서 이해하기","paragraphs":["같은 변수 이름이 여러 번 등장해도 다음 줄에서 사용하는 것은 가장 최근에 대입된 값입니다. 변수 추적에서는 마지막 대입 위치가 중요한 이유입니다."],"keywords":["변수","대입","재대입","현재 값"],"extras":[],"visibleExtras":0,"id":"t1-c3-p5"},{"kind":"visual","eyebrow":"시각화","title":"이름 → 값으로 연결해 생각하세요","paragraphs":["변수 이름은 값 그 자체가 아니라, 프로그램이 그 값을 다시 찾을 수 있게 해 주는 이름입니다.","같은 변수에 새 값을 대입하면 이후에는 최신 값이 사용됩니다. 이것이 재대입(reassignment)입니다.","프로그램이 실행되는 동안 변수들이 어떤 값을 가리키고 있는지 전체 모습으로 생각하면 ‘프로그램의 상태(state)’를 이해하는 데 도움이 됩니다. 상태는 그 순간 프로그램이 기억하고 있는 값들의 모음이라고 볼 수 있습니다.","재대입이 일어나면 과거 값이 자동으로 출력되거나 남아 있는 것이 아니라, 이후 그 변수 이름을 사용할 때 새 값이 사용됩니다. 따라서 코드 중간에서 값이 바뀌는 위치를 놓치지 않는 것이 중요합니다."],"visual":"VARIABLE_BINDING","bullets":["name → \"민수\"","age → 37","age = 38을 실행하면 이후 age는 38","변수 이름은 역할이 드러나게 짓는 편이 좋음","변수 이름은 값의 역할을 설명하는 작은 문서 역할도 합니다.","재대입 전후를 추적하면 예상하지 못한 결과를 찾기 쉽습니다."],"extras":[],"visibleExtras":1,"id":"t1-c3-p6"},{"kind":"concept","eyebrow":"CHAPTER 03 · 흐름 심화","title":"이름 → 값으로 연결해 생각하세요 — 이어서 이해하기","paragraphs":["변수가 두세 개만 있어도 머릿속으로만 추적하면 쉽게 섞입니다. name | value 표를 만들고 대입이 실행될 때마다 해당 행의 값만 갱신하면 흐름이 선명해집니다."],"keywords":["변수","대입","재대입","현재 값"],"extras":[],"visibleExtras":0,"id":"t1-c3-p7"},{"kind":"example","eyebrow":"예제","title":"한 번 만든 변수는 뒤에서 다시 사용할 수 있습니다","code":"name = \"민수\"\nage = 37\nhome_city = \"서울\"\nprint(name, \"는\", home_city, \"에 살고\", age, \"살입니다\")","paragraphs":["name, age, home_city는 각각 사용자 이름, 나이, 거주 도시라는 역할을 가집니다. 값이 바뀌어도 출력 코드는 그대로 재사용할 수 있습니다.","좋은 변수 이름은 코드를 다시 읽는 시간을 줄여 줍니다. Python에서는 보통 소문자와 밑줄을 사용한 snake_case가 일반적입니다.","변수 이름은 길다고 무조건 좋은 것도, 짧다고 무조건 나쁜 것도 아닙니다. 코드의 범위와 역할을 고려해 충분히 의미가 드러나는 이름을 쓰면 됩니다. 초보 단계에서는 x, a, data처럼 너무 넓은 이름보다 age, visit_count, total_price처럼 구체적인 이름이 읽기 쉽습니다.","snake_case는 여러 단어를 밑줄로 연결하는 이름 방식입니다. Python에서는 매우 흔하게 사용됩니다. 이름 스타일을 통일하면 프로젝트가 커져도 변수 이름을 훨씬 빠르게 읽을 수 있습니다."],"codeNote":"예: visit_count, today_sales, user_phone_number","extras":[],"visibleExtras":3,"id":"t1-c3-p8"},{"kind":"practice","eyebrow":"실습 A/B · 내 정보로 바꾸기","title":"변수 이름과 값을 직접 바꿔 보세요","practicePrompt":"① name, age, home_city 값을 내 정보로 변경 ② age를 한 번 더 재대입해 최신 값이 출력되는지 확인 ③ x 같은 모호한 이름을 의미 있는 이름으로 고치기","paragraphs":["변수 이름을 바꾸면 그 이름을 사용하는 모든 위치도 함께 바꿔야 합니다. 일부만 바꾸면 NameError가 날 수 있습니다.","변수 이름을 바꿀 때는 정의한 줄뿐 아니라 그 변수를 사용하는 모든 줄을 함께 바꿔야 합니다. 일부만 바뀌면 Python 입장에서는 서로 다른 이름으로 보이기 때문에 NameError가 발생할 수 있습니다.","실습할 때는 먼저 정상 실행되는 버전을 저장해 두고, 이름을 하나 바꾼 뒤 다시 실행하세요. 오류가 나면 어떤 줄에서 옛 이름이 남았는지 찾는 연습이 됩니다."],"extras":[],"visibleExtras":4,"id":"t1-c3-p9","answerOnNext":true},{"id":"t1-c3-p9-solution","kind":"solution","eyebrow":"정답과 풀이","title":"변수 이름과 값을 직접 바꿔 보세요 · 풀이","paragraphs":["name, age, home_city는 Python이 미리 정한 단어가 아니라 우리가 붙인 이름입니다.","age = 38은 이름 age에 새 값을 연결합니다. 마지막 출력에는 37 대신 38이 사용됩니다.","이름을 user_name으로 바꾸려면 정의와 print 안의 name을 모두 바꿔야 합니다."],"code":"name = \"승원\"\nage = 37\nhome_city = \"서울\"\nage = 38\nprint(name, age, home_city)","codeNote":"실행 결과 또는 테스트 기준\n승원 38 서울"},{"kind":"concept","eyebrow":"CHAPTER 03 · 실습 확장","title":"변수 이름과 값을 직접 바꿔 보세요 — 이어서 이해하기","paragraphs":["a, b보다 price, count처럼 의미가 드러나는 이름을 쓰면 코드를 다시 볼 때 계산 의도를 바로 이해할 수 있습니다. 짧다고 항상 좋은 이름은 아닙니다."],"keywords":["변수","대입","재대입","현재 값"],"extras":[],"visibleExtras":0,"id":"t1-c3-p10"},{"kind":"check","eyebrow":"확인 문제","title":"대입과 재대입을 읽어 봅니다","question":"score = 10\nscore = score + 5\nprint(score)\n결과는 무엇일까요?","paragraphs":["score = score + 5 같은 코드는 수학식으로 보면 이상해 보일 수 있습니다. Python에서는 오른쪽 score의 현재 값을 먼저 읽어 계산하고, 그 결과를 다시 왼쪽 score에 저장하기 때문에 가능한 표현입니다.","즉 한 줄 안에서도 ‘오른쪽 계산 → 왼쪽 대입’이라는 순서가 있습니다. 이 순서를 이해하면 누적 합계나 카운터처럼 같은 변수 값을 계속 갱신하는 코드를 쉽게 읽을 수 있습니다."],"extras":[],"visibleExtras":5,"id":"t1-c3-p11","answerOnNext":true},{"id":"t1-c3-p11-solution","kind":"solution","eyebrow":"정답과 풀이","title":"대입과 재대입을 읽어 봅니다 · 풀이","paragraphs":["15입니다. 두 번째 줄의 오른쪽 score는 기존 값 10을 사용해 15를 만들고, 그 결과를 다시 score에 대입합니다."],"extras":[]},{"kind":"summary","eyebrow":"Chapter 3 정리","title":"이름과 값의 관계","paragraphs":["변수는 프로그램이 값을 기억하고 다시 사용하는 가장 기본적인 방법입니다. 값을 직접 반복해서 적는 대신 역할이 드러나는 이름을 붙이면 코드가 읽기 쉬워지고 수정도 쉬워집니다.","변수를 볼 때는 ‘이 이름에는 지금 어떤 값이 연결되어 있는가?’를 생각하세요.","다음 챕터에서는 값 자체의 종류인 타입을 배웁니다.","변수는 이후 거의 모든 코드에서 등장합니다. 입력받은 값을 저장하고, 계산 결과를 저장하고, 오류를 추적할 때 현재 값을 확인하는 등 프로그램의 상태를 이해하는 중심 역할을 합니다.","다음 챕터의 타입은 변수에 연결된 값이 ‘어떤 종류인지’를 다룹니다. 변수 이름과 타입을 함께 보면 코드가 왜 특정 연산에서 성공하거나 실패하는지 이해하기 쉬워집니다."],"bullets":["변수는 이름, 값은 실제 데이터다.","= 는 오른쪽 값을 왼쪽 이름에 대입한다.","재대입 후에는 최신 값이 사용된다.","좋은 이름은 의미가 보인다.","대입은 오른쪽 값을 먼저 계산한 뒤 왼쪽 이름에 저장한다.","변수 이름은 역할이 보이게 짓는다.","재대입은 현재 상태를 바꾼다."],"extras":[],"visibleExtras":2,"id":"t1-c3-p12"},{"kind":"concept","eyebrow":"CHAPTER 03 · 심화 정리","title":"이름과 값의 관계 — 한 단계 더","paragraphs":["변수는 프로그램의 현재 상태를 이해하는 중심 도구입니다. 이름이 어떤 값을 가리키는지 추적하면 재대입과 계산 흐름이 훨씬 선명해집니다.","프로그램이 실행되는 동안 변수 값들의 조합은 그 순간의 상태라고 볼 수 있습니다. 값이 바뀔 때 상태도 바뀌며, 출력은 그 상태를 바깥에서 확인하는 한 방법입니다."],"keywords":["변수","대입","재대입","현재 값"],"extras":[],"visibleExtras":0,"id":"t1-c3-p13"}],"track":1,"id":"t1-c3","remember":"=는 대입, 이름 철자 구분","practiceGoal":"값 재대입과 NameError 수정","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":4,"title":"타입","pages":[{"kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"type 데이터 타입","description":"값이 어떤 종류의 데이터인지 나타내는 분류입니다. 타입은 그 값에 어떤 연산과 기능을 사용할 수 있는지와 연결됩니다.","usage":"값이 왜 특정 연산에서 성공하거나 오류가 나는지 설명할 때 씁니다.","example":"예: 10은 int, \"10\"은 str이라 같은 모양처럼 보여도 동작이 다릅니다."},{"term":"int 정수","description":"소수점이 없는 정수를 표현하는 Python 타입입니다. 개수, 나이, 횟수처럼 정수 계산이 필요한 값에 자주 사용됩니다.","usage":"덧셈·뺄셈·곱셈 등 정수 계산을 할 때 사용합니다.","example":"예: count = 4, age = 37은 int 값입니다."},{"term":"float 실수","description":"소수점이 있는 수를 표현하는 타입입니다. 나눗셈 결과나 비율, 측정값처럼 소수 부분이 필요한 계산에서 자주 등장합니다.","usage":"정밀한 소수 계산이나 비율을 다룰 때 사용합니다.","example":"예: rate = 0.1, temperature = 36.5는 float입니다."}],"extras":[],"visibleExtras":1,"id":"t1-c4-p1"},{"kind":"concept","eyebrow":"CHAPTER 04 · 용어 연결","title":"용어를 실제 코드 흐름으로 연결하기","paragraphs":["세 단어를 실제 값 하나씩과 연결해 말해 보세요. 타입 이름만 외우기보다 어떤 값이 어떤 타입이고 어떤 연산을 할 수 있는지 함께 기억하는 편이 좋습니다.","타입은 값의 이름표가 아니라 그 값으로 어떤 연산을 할 수 있는지 결정하는 규칙에 가깝습니다. 숫자 3과 문자열 \"3\"은 화면에 비슷하게 보여도 더하기, 비교, 변환에서 전혀 다른 방식으로 동작합니다.","int, float, str, bool을 단어로만 외우지 말고 각각 3, 3.5, \"3\", True 같은 실제 값과 연결하세요. 값의 모양과 타입을 함께 기억해야 코드에서 빠르게 알아볼 수 있습니다.","Python은 변수 이름 자체에 타입을 고정하지 않고 실행 중 연결된 값이 타입을 가집니다. 그래서 같은 변수 이름에 처음에는 숫자를, 나중에는 문자열을 넣는 것도 가능하지만 초보 단계에서는 이런 변경을 자주 하면 읽기 어려워집니다. 가능한 한 한 변수는 비슷한 의미와 타입을 유지하는 편이 좋습니다.","오류가 나면 계산식부터 의심하기 쉽지만 실제 원인은 타입이 다른 경우가 많습니다. 특히 input()으로 받은 값은 숫자처럼 보여도 문자열이므로, 계산 전에 type()이나 필요한 형 변환을 확인하는 습관이 중요합니다.","이후 API, 파일, 데이터베이스에서 값을 가져올 때도 타입 확인은 계속 필요합니다. 외부에서 들어온 값이 내가 기대한 타입인지 확인하는 습관은 실제 앱에서도 오류를 줄이는 기본 방어선입니다."],"keywords":["int·float·str·bool","type()","연산 규칙","형 변환"],"extras":[],"visibleExtras":0,"id":"t1-c4-p2"},{"kind":"glossary","eyebrow":"CHAPTER 04 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"str 문자열","description":"글자의 순서를 표현하는 타입이며 따옴표로 감싼 값이 대표적입니다. 숫자 모양의 글자도 따옴표로 감싸져 있으면 계산용 숫자가 아니라 문자열입니다.","usage":"이름, 주소, 코드, 메시지처럼 글자 데이터를 다룰 때 사용합니다.","example":"예: phone = \"01012345678\"은 계산보다 식별에 쓰는 문자열입니다."},{"term":"bool 불리언","description":"True와 False 두 값으로 참과 거짓을 표현하는 타입입니다. 이후 조건문에서 어떤 코드 경로를 실행할지 결정하는 핵심 값이 됩니다.","usage":"조건의 성립 여부나 상태를 표현할 때 사용합니다.","example":"예: is_member = True는 회원 여부가 참임을 나타냅니다."},{"term":"type() 타입 확인","description":"값이나 변수의 실제 타입을 확인하는 Python 내장 함수입니다. 예상과 다른 결과가 나오거나 TypeError를 만났을 때 원인을 좁히는 데 매우 유용합니다.","usage":"디버깅 중 현재 값의 종류를 직접 확인할 때 사용합니다.","example":"예: print(type(user_input))으로 input 결과가 str인지 확인할 수 있습니다."}],"extras":[],"visibleExtras":1,"id":"t1-c4-p3"},{"kind":"concept","eyebrow":"CHAPTER 04 · 값의 종류","title":"처음 알아야 할 네 가지 타입","paragraphs":["컴퓨터는 10이라는 숫자와 \"10\"이라는 글자를 다르게 다룹니다. 값의 종류를 데이터 타입(data type), 줄여서 타입(type)이라고 합니다.","입문 단계에서는 int, float, str, bool 네 가지를 먼저 구분하면 충분합니다. 타입 이름을 외우는 것보다 ‘이 값으로 어떤 동작을 할 수 있는가’를 연결해서 이해하는 것이 더 중요합니다.","타입은 단순한 이름표가 아니라 값에 허용되는 연산과 처리 방법을 결정하는 규칙과 연결됩니다.","타입은 단순히 데이터를 분류하는 이름표가 아니라, 그 값에 어떤 연산과 기능을 사용할 수 있는지 결정하는 규칙과 연결됩니다. 예를 들어 숫자는 덧셈·뺄셈 같은 산술 연산이 자연스럽고, 문자열은 글자를 이어 붙이거나 반복하는 동작이 자연스럽습니다.","bool은 True와 False 두 값을 표현합니다. 지금은 참과 거짓을 저장하는 타입이라고 이해하면 충분하고, 다음 트랙에서 조건문을 배울 때 ‘어떤 조건이 참인가 거짓인가’를 판단하는 핵심 역할을 하게 됩니다."],"keywords":["int 정수","float 실수","str 문자열","bool 참/거짓","type() 타입 확인","literal 리터럴"],"calloutTitle":"핵심","calloutBody":"값의 생김새보다 문법을 보세요. \"100\"은 숫자처럼 보여도 따옴표가 있으므로 str입니다.","extras":[],"visibleExtras":3,"id":"t1-c4-p4"},{"kind":"concept","eyebrow":"CHAPTER 04 · 개념 심화","title":"처음 알아야 할 네 가지 타입 — 이어서 이해하기","paragraphs":["숫자 2 + 3은 5가 되지만 문자열 \"2\" + \"3\"은 \"23\"이 됩니다. + 기호가 같아도 값의 타입에 따라 동작이 달라질 수 있습니다."],"keywords":["int·float·str·bool","type()","연산 규칙","형 변환"],"extras":[],"visibleExtras":0,"id":"t1-c4-p5"},{"kind":"visual","eyebrow":"한눈에 비교","title":"같은 모양처럼 보여도 타입은 다릅니다","visual":"TYPE_TABLE","paragraphs":["10, 10.0, \"10\", True는 화면에서 비슷하게 보일 수 있지만 Python에서는 서로 다른 종류의 값입니다.","사용자 ID가 00123처럼 앞의 0을 유지해야 한다면 숫자가 아니라 문자열로 보관하는 것이 더 알맞을 수 있습니다. 타입은 값의 모양뿐 아니라 앞으로 어떻게 사용할지도 고려해 선택합니다.","같은 ‘10’처럼 보여도 실제 목적에 따라 타입 선택이 달라질 수 있습니다. 수량이나 가격이라면 숫자가 적합하지만, 우편번호·상품코드·전화번호처럼 계산할 필요가 없고 앞자리 0이 중요하다면 문자열이 더 자연스럽습니다.","그래서 타입을 정할 때는 ‘이 값이 어떻게 생겼는가?’보다 ‘앞으로 이 값으로 무엇을 할 것인가?’를 함께 생각해야 합니다."],"bullets":["10 → int → 정수 계산","10.0 → float → 소수 계산","\"10\" → str → 글자 처리","True → bool → 참/거짓 판단","계산할 값인지, 식별용 값인지 목적을 먼저 봅니다.","문자열은 숫자 모양이어도 계산용 숫자가 아닐 수 있습니다."],"extras":[],"visibleExtras":2,"id":"t1-c4-p6"},{"kind":"example","eyebrow":"예제","title":"type()으로 실제 타입을 확인하세요","code":"print(type(10))\nprint(type(10.0))\nprint(type(\"10\"))\nprint(type(True))","paragraphs":["값이 예상과 다르게 움직이면 type()으로 실제 타입부터 확인하는 습관이 좋습니다.","같은 + 연산자도 숫자끼리는 더하기, 문자열끼리는 연결처럼 타입에 따라 의미가 달라질 수 있습니다.","type()은 문제를 찾을 때 매우 유용합니다. 내가 int라고 생각한 값이 실제로 str인지, 계산 결과가 float가 되었는지 직접 확인할 수 있기 때문입니다.","+ 연산자도 타입에 따라 의미가 달라집니다. 2 + 3은 숫자 덧셈이지만 \"2\" + \"3\"은 두 문자열을 이어 붙여 \"23\"을 만듭니다. 겉으로 같은 + 기호라도 양쪽 값의 타입을 먼저 봐야 합니다."],"codeNote":"숫자와 문자열을 바로 섞어 더하면 TypeError가 날 수 있습니다.\n\n예상과 다른 결과가 나오면 print(value)만 보지 말고 print(type(value))까지 함께 확인해 보세요.","extras":[],"visibleExtras":3,"id":"t1-c4-p7"},{"kind":"concept","eyebrow":"CHAPTER 04 · 예제 확장","title":"type()으로 실제 타입을 확인하세요 — 한 단계 더","paragraphs":["코드가 길어질수록 값의 타입을 눈으로 추측하는 것보다 실제로 확인하는 편이 안전합니다. 특히 외부 입력이나 변환 직후에 type()을 쓰면 오류 원인을 빠르게 좁힐 수 있습니다."],"keywords":["int·float·str·bool","type()","연산 규칙","형 변환"],"extras":[],"visibleExtras":0,"id":"t1-c4-p8"},{"kind":"practice","eyebrow":"실습 A/B · 같은 모양, 다른 타입","title":"실행 전에 결과를 예상하세요","code":"x = 5\ny = \"5\"\nprint(x * 2)\nprint(y * 2)","practicePrompt":"① 두 print 결과 예상 ② 실제 실행 ③ x와 y에 type()을 적용해 타입 기록 ④ \"3.14\"를 float로 바꿔 보기","paragraphs":["문자열 반복은 처음 보면 이상하게 느껴질 수 있지만, Python에서는 \"ha\" * 3처럼 문자열을 여러 번 반복하는 연산이 가능합니다. 그래서 y = \"5\"일 때 y * 2는 10이 아니라 \"55\"가 됩니다.","이 실습의 목적은 결과를 외우는 것이 아니라 ‘같은 연산자라도 타입이 달라지면 동작이 달라질 수 있다’는 감각을 얻는 것입니다."],"extras":[],"visibleExtras":4,"id":"t1-c4-p9","answerOnNext":true},{"id":"t1-c4-p9-solution","kind":"solution","eyebrow":"정답과 풀이","title":"실행 전에 결과를 예상하세요 · 풀이","paragraphs":["숫자 곱셈과 문자열 반복은 같은 * 기호를 사용하지만 결과가 다릅니다.","y의 출력 55는 문자열입니다. print에서는 문자열을 감싼 따옴표가 표시되지 않습니다.","float(\"3.14\")는 문자열을 소수 계산용 값으로 바꿉니다."],"code":"x = 5\ny = \"5\"\nprint(x * 2)\nprint(y * 2)\nprint(type(x))\nprint(type(y))\nprint(float(\"3.14\"))","codeNote":"실행 결과 또는 테스트 기준\n10\n55\n\u003cclass 'int'>\n\u003cclass 'str'>\n3.14"},{"kind":"check","eyebrow":"확인 문제","title":"타입 읽기","question":"print(type(\"3.14\"))의 결과는 float일까요, str일까요?","paragraphs":["\"3.14\"를 float로 바꾸려면 float(\"3.14\")처럼 명시적으로 변환합니다. 이때 Python은 문자열 내용이 실제 숫자 형태인지 확인합니다. \"삼점일사\"처럼 숫자로 해석할 수 없는 문자열이라면 변환이 실패합니다.","따라서 타입 문제를 해결할 때는 현재 타입을 확인한 뒤 필요한 타입으로 변환할 수 있는 값인지까지 생각해야 합니다."],"extras":[],"visibleExtras":5,"id":"t1-c4-p10","answerOnNext":true},{"id":"t1-c4-p10-solution","kind":"solution","eyebrow":"정답과 풀이","title":"타입 읽기 · 풀이","paragraphs":["str입니다. 안쪽에 소수점 모양이 있어도 따옴표로 감싸져 있기 때문입니다. 계산하려면 float(\"3.14\")처럼 변환해야 합니다."],"extras":[]},{"kind":"concept","eyebrow":"CHAPTER 04 · 확인 확장","title":"타입 읽기 — 이어서 이해하기","paragraphs":["문자열에는 이어붙이기와 길이 확인이 자연스럽고, 숫자에는 산술 연산이 자연스럽습니다. 타입을 먼저 확인하면 어떤 연산이 가능한지도 어느 정도 예상할 수 있습니다."],"keywords":["int·float·str·bool","type()","연산 규칙","형 변환"],"extras":[],"visibleExtras":0,"id":"t1-c4-p11"},{"kind":"summary","eyebrow":"Chapter 4 정리","title":"값의 종류를 먼저 확인하세요","paragraphs":["타입은 컴퓨터가 값을 어떻게 다룰지 결정합니다. int·float는 숫자 계산, str은 글자 처리, bool은 참과 거짓 표현에 사용합니다.","오류가 났을 때는 ‘이 값의 타입이 내가 생각한 것과 같은가?’를 먼저 확인해 보세요. 많은 초보 오류가 이 한 질문으로 좁혀집니다.","다음 챕터에서는 사용자 입력이 처음에는 str로 들어온다는 점을 이용해 형 변환을 배웁니다.","타입을 이해하면 오류 메시지가 훨씬 덜 낯설어집니다. TypeError가 보이면 ‘서로 다른 종류의 값을 잘못 섞었나?’라고 먼저 의심할 수 있고, ValueError라면 ‘변환하려는 값의 내용이 적절한가?’를 살펴볼 수 있습니다.","다음 챕터에서는 input()이 항상 문자열을 반환한다는 사실을 이용해, 외부에서 들어온 값을 원하는 타입으로 바꾸는 흐름을 연습합니다."],"bullets":["따옴표가 있으면 문자열이다.","type()으로 실제 타입을 확인할 수 있다.","타입이 다르면 같은 연산자도 다르게 동작할 수 있다.","타입은 가능한 연산과 연결된다.","겉모양보다 실제 타입과 사용 목적을 본다.","type()은 디버깅용 확인 도구다."],"extras":[],"visibleExtras":3,"id":"t1-c4-p12"},{"kind":"concept","eyebrow":"CHAPTER 04 · 심화 정리","title":"값의 종류를 먼저 확인하세요 — 한 단계 더","paragraphs":["계산이 이상하거나 TypeError가 나면 값의 타입을 먼저 확인하세요. 데이터가 올바른 값처럼 보여도 문자열일 수 있습니다."],"keywords":["int·float·str·bool","type()","연산 규칙","형 변환"],"extras":[],"visibleExtras":0,"id":"t1-c4-p13"}],"track":1,"id":"t1-c4","remember":"int·float·str·bool의 대표값","practiceGoal":"type으로 확인하고 연산 비교","sources":[{"title":"Python 3.14 공식 튜토리얼","url":"https://docs.python.org/3.14/tutorial/","reviewed":"2026-09-20"}]},{"chapter":5,"title":"입력과 형변환","pages":[{"kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 1/2","title":"먼저 알아두면 좋은 단어","paragraphs":[],"glossary":[{"term":"input 입력","description":"사용자·파일·센서·인터넷처럼 프로그램 밖에서 안으로 들어오는 데이터를 뜻합니다. Python의 input()은 키보드 입력을 받아 문자열로 돌려줍니다.","usage":"프로그램이 실행될 때마다 다른 값을 받아 처리해야 할 때 사용합니다.","example":"예: age = input(\"나이: \")로 사용자의 나이를 받습니다."},{"term":"process 처리","description":"입력값을 계산·변환·검사·저장하는 중간 작업을 말합니다. 프로그램의 핵심 규칙이 대부분 이 처리 단계에 들어갑니다.","usage":"입력에서 출력으로 가는 사이에 데이터가 어떻게 바뀌는지 설명할 때 씁니다.","example":"예: 문자열 나이를 int로 바꾸고 1을 더하는 과정이 process입니다."},{"term":"output 출력","description":"처리가 끝난 결과를 사용자나 다른 시스템에 전달하는 단계입니다. 화면 출력뿐 아니라 파일 저장이나 앱 화면 변경도 출력이 될 수 있습니다.","usage":"프로그램이 최종 결과를 어떻게 보여 주는지 설명할 때 사용합니다.","example":"예: print(f\"합계: {total}\")은 계산 결과를 화면에 출력합니다."}],"extras":[],"visibleExtras":1,"id":"t1-c5-p1"},{"kind":"concept","eyebrow":"CHAPTER 05 · 용어 연결","title":"용어를 실제 코드 흐름으로 연결하기","paragraphs":["세 단어를 ‘입력받고 → 필요한 타입으로 바꾸고 → 계산한다’는 순서로 묶어 보세요. 입력은 값 자체보다 현재 타입을 먼저 확인하는 습관이 중요합니다.","사용자 입력은 프로그램 밖에서 들어오는 값이므로 프로그램이 기대한 모양과 다를 수 있습니다. 따라서 입력을 받는 순간부터 “무슨 값이 들어왔는가”뿐 아니라 “현재 타입과 형식이 무엇인가”를 같이 확인해야 합니다.","input()으로 받은 값은 문자열이고, 숫자 계산이 필요하면 int()나 float() 같은 변환이 필요합니다. 입력·타입·변환·계산을 하나의 흐름으로 묶어 이해하세요.","조금 더 실제 프로그램에 가까운 방식은 입력 → 검증 → 변환 → 처리 → 출력의 단계를 나누는 것입니다. 예를 들어 나이를 입력받으면 먼저 비어 있지 않은지 확인하고, 정수로 바꿀 수 있는지 확인한 뒤 계산합니다. 이렇게 단계가 분리되면 문제가 생긴 위치도 쉽게 찾을 수 있습니다.","int(input())처럼 한 줄로 짧게 쓰는 코드는 편하지만, 잘못된 입력이 들어오면 어느 단계에서 문제가 생겼는지 초보자가 파악하기 어렵습니다. 학습 단계에서는 raw = input(), age = int(raw)처럼 두 단계로 나눠 쓰는 편이 원리를 이해하기 좋습니다.","나중에 앱의 입력창, 웹 폼, API 요청을 다룰 때도 같은 원칙을 씁니다. 외부 입력을 그대로 믿지 않고 검증한 뒤 내부에서 쓰기 좋은 형태로 바꾸는 것이 안정적인 프로그램의 기본입니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p2"},{"kind":"glossary","eyebrow":"CHAPTER 05 · 시작 전 단어집 2/2","title":"코드에서 자주 만나는 표현","paragraphs":[],"glossary":[{"term":"conversion 형 변환","description":"값을 다른 타입으로 바꾸는 작업입니다. input()으로 받은 문자열을 숫자로 계산하려면 int()나 float() 같은 변환이 필요합니다.","usage":"현재 타입과 다음 작업에 필요한 타입이 다를 때 사용합니다.","example":"예: age = int(\"37\")은 문자열을 정수로 변환합니다."},{"term":"return value 반환값","description":"함수나 입력 함수가 실행된 뒤 호출한 쪽에 돌려주는 값을 말합니다. 지금은 input()이 문자열을 반환한다는 사실을 이해하는 데 먼저 사용합니다.","usage":"함수가 결과로 무엇을 돌려주는지 설명할 때 씁니다.","example":"예: input(\"이름: \")의 return value는 사용자가 입력한 문자열입니다."},{"term":"ValueError 값 오류","description":"타입 변환처럼 가능한 작업을 시도했지만 실제 값의 내용이 요구 형식에 맞지 않을 때 자주 발생합니다. 타입 자체보다 값의 형식이 문제라는 점이 핵심입니다.","usage":"숫자로 바꿀 수 없는 문자열 같은 잘못된 입력을 찾을 때 사용합니다.","example":"예: int(\"사과\")는 숫자로 해석할 수 없어 ValueError가 납니다."}],"extras":[],"visibleExtras":1,"id":"t1-c5-p3"},{"kind":"concept","eyebrow":"CHAPTER 05 · 입력 받기","title":"프로그램은 입력을 받아 처리하고 출력합니다","paragraphs":["프로그램을 세 칸으로 나누면 이해가 쉬워집니다. 입력(input)은 밖에서 들어오는 값, 처리(process)는 계산·변환·저장 같은 중간 작업, 출력(output)은 사용자에게 보여 주는 결과입니다.","input()은 키보드 입력을 받는 Python 함수입니다. 중요한 점은 사용자가 숫자를 입력해도 input()의 결과는 기본적으로 문자열(str)이라는 것입니다.","숫자 계산이 필요하면 int()나 float()로 바꿔야 합니다. 이런 과정을 형 변환(type conversion)이라고 합니다.","사용자 입력은 프로그램 바깥에서 들어오는 데이터입니다. 그래서 프로그램 내부에서 우리가 직접 만든 값보다 더 조심해서 다루는 편이 좋습니다. 사용자가 빈칸을 입력할 수도 있고, 숫자를 요구했는데 글자를 입력할 수도 있기 때문입니다.","입문 단계에서는 복잡한 검증까지 하지 않더라도 ‘외부 입력은 먼저 타입을 확인하고 필요한 형태로 정리한다’는 원칙을 기억하면 좋습니다. 이 원칙은 나중에 파일·웹·API 데이터를 다룰 때도 그대로 이어집니다."],"keywords":["input 입력","process 처리","output 출력","I/O 입력/출력","conversion 형 변환","return value 반환값"],"calloutTitle":"초보자가 자주 막히는 지점","calloutBody":"키보드로 10을 입력해도 처음에는 글자 \"10\"입니다. 계산하려면 숫자 타입으로 바꿔야 합니다.","extras":[],"visibleExtras":2,"id":"t1-c5-p4"},{"kind":"concept","eyebrow":"CHAPTER 05 · 개념 심화","title":"프로그램은 입력을 받아 처리하고 출력합니다 — 이어서 이해하기","paragraphs":["외부 입력은 프로그램 밖에서 들어오므로 타입과 형식을 확인하는 습관이 중요합니다. 변환·처리·출력을 단계로 나누면 오류 위치도 찾기 쉬워집니다.","키보드 입력처럼 프로그램 밖에서 들어오는 값은 언제든 예상과 다를 수 있습니다. 실제 프로그램은 입력이 비어 있거나 숫자가 아닌 경우도 고려합니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p5"},{"kind":"visual","eyebrow":"데이터 흐름","title":"입력 → 타입 확인/변환 → 처리 → 출력","visual":"INPUT_CONVERSION","paragraphs":["입력 처리 문제에서는 두 질문을 하면 됩니다. ‘지금 이 값은 어떤 타입인가?’ 그리고 ‘다음 연산에는 어떤 타입이 필요한가?’입니다.","외부에서 들어오는 값은 완벽하다고 가정하지 않는 습관이 중요합니다. 지금은 int 변환만 배우지만, 나중에는 빈 값·범위·잘못된 형식도 검사하게 됩니다.","입력 → 변환 → 처리 → 출력 흐름을 한 줄에 모두 적을 수도 있지만, 초보 단계에서는 중간값을 변수로 나누는 편이 훨씬 읽기 쉽습니다. raw_age = input(...), age = int(raw_age)처럼 단계가 보이면 어느 부분에서 문제가 났는지도 찾기 쉽습니다.","실무에서도 외부 데이터는 경계(boundary)에서 가능한 한 일찍 정리하고 검증하는 편이 좋습니다. 지금은 작은 콘솔 프로그램이지만 사고방식은 같습니다."],"bullets":["input() 결과는 str","계산이 필요하면 int() 또는 float()","변환이 실패하면 ValueError 가능","처리 후 print 또는 f-string으로 출력","외부에서 들어온 값은 바로 믿지 않고 먼저 확인합니다.","변환과 계산을 분리하면 오류 위치가 더 잘 보입니다."],"extras":[],"visibleExtras":1,"id":"t1-c5-p6"},{"kind":"concept","eyebrow":"CHAPTER 05 · 흐름 심화","title":"입력 → 타입 확인/변환 → 처리 → 출력 — 한 단계 더","paragraphs":["raw → converted → result처럼 중간값을 나누면 어떤 단계에서 값이 잘못됐는지 바로 확인할 수 있습니다. 짧은 코드보다 관찰하기 쉬운 코드가 학습에는 더 좋습니다."],"keywords":["input()","문자열 입력","형 변환","입력 검증"],"extras":[],"visibleExtras":0,"id":"t1-c5-p7"},{"kind":"example","eyebrow":"예제","title":"입력받은 나이로 다음 나이를 계산합니다","code":"name = input(\"이름: \")\nage = int(input(\"나이: \"))\nnext_age = age + 1\nprint(f\"{name}님의 다음 나이는 {next_age}살입니다\")","paragraphs":["name은 글자로 사용하므로 str 그대로 두고, age는 + 1 계산이 필요하므로 int로 변환합니다.","f-string은 문자열 안에 변수 값을 넣기 쉽게 해 줍니다. 중괄호 안의 변수 값이 실제 값으로 바뀌어 출력됩니다.","int(input(...))처럼 한 줄로 쓰면 짧지만, 처음에는 두 단계로 나눠 보는 것도 좋습니다. raw_age = input(\"나이: \")로 먼저 받은 뒤 print(type(raw_age))를 확인하고, age = int(raw_age)로 변환하면 과정이 눈에 보입니다.","f-s
