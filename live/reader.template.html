<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="app-schema" content="codingroadmap-live-v1">
<title>코딩 로드맵</title>
<style>
/* LIBRARY_REBUILD_V8 — clean rewrite, no legacy style layers */
:root{
  --ivory:#fbf8f1;
  --ivory2:#f4eee3;
  --paper:#fffdf8;
  --ink:#231d17;
  --muted:#8d8377;
  --hair:#e8ded0;
  --gold:#ad8247;
  --gold2:#d7ba84;
  --green:#718764;
  --reader:#17120e;
  --reader2:#211912;
  --readerInk:#f2e9dc;
  --readerMuted:#b9aa97;
  --readerHair:#403226;
  --readerGold:#d1a354;
  --navSafe:calc(28px + env(safe-area-inset-bottom));
  --readerBody:18px;
  --readerLine:1.68;
  --pagePad:clamp(22px,5vw,52px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--ivory);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{cursor:pointer}
.serif,.display-title,.section-title,.book-title,.track-name,.chapter-name,.reader-title,.reader-flow h1,.reader-flow h2,.reader-flow h3{font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif}
.screen{min-height:100dvh;background:
  radial-gradient(circle at 5% 0,#fffefb 0 15%,transparent 37%),
  linear-gradient(180deg,var(--ivory) 0%,#f8f3ea 100%)}
.shell{width:min(1180px,100%);margin:0 auto;padding:30px clamp(20px,4vw,46px) 150px}
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:2px 0 28px}
.display-title{font-size:clamp(40px,5vw,62px);line-height:1.08;letter-spacing:-.055em;font-weight:600;margin:0 0 8px}
.home-sub{margin:0;color:var(--muted);font-size:16px}
.home-quote{font-family:Georgia,"Noto Serif KR",serif;color:#9b8a76;text-align:right;line-height:1.45;font-size:14px;padding-top:10px;white-space:nowrap}
.home-quote:after{content:"—";display:block;margin-top:3px}
.continue-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);overflow:hidden;min-height:270px;border:1px solid #eadfce;border-radius:24px;background:#f2e7d6;box-shadow:0 18px 45px #7a5d3512}
.continue-copy{padding:32px 34px;display:flex;flex-direction:column;justify-content:center}
.continue-kicker{font-size:31px;line-height:1.2;letter-spacing:-.045em;margin-bottom:8px}
.continue-lead{margin:0;color:#8f8172;font-family:Georgia,"Noto Serif KR",serif;font-size:16px;line-height:1.55}
.continue-rule{width:135px;height:1px;background:#d5c5ae;margin:15px 0}
.continue-meta{font-size:12px;letter-spacing:.07em;color:#8e806f;margin-bottom:5px}
.continue-title{font-family:Georgia,"Noto Serif KR",serif;font-size:25px;line-height:1.3;margin:0 0 14px}
.progress-row{display:flex;align-items:center;gap:11px;max-width:390px;margin-bottom:18px}
.progress-track{height:7px;flex:1;background:#ddd5c9;border-radius:99px;overflow:hidden}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,#b88a4b,#dfc282);border-radius:99px}
.progress-row b{font-size:13px;color:#5d5144;font-weight:600}
.pill-primary{border:0;border-radius:999px;background:linear-gradient(180deg,#bb8e50,#a77a3e);color:white;min-height:50px;padding:0 25px;align-self:flex-start;font-weight:700;letter-spacing:-.02em}
.still-life{position:relative;overflow:hidden;background:
  radial-gradient(circle at 76% 31%,#fff8dd 0 8%,transparent 9%),
  linear-gradient(128deg,#eee0cc 0 32%,#faf5eb 48%,#cbb28d 49%,#e5d4ba 100%)}
.still-life:before{content:"";position:absolute;right:12%;bottom:18%;width:132px;height:94px;border-radius:7px;background:linear-gradient(#f5f0e6,#d5c6b1);box-shadow:0 14px 24px #59442e26;transform:rotate(-2deg)}
.still-life:after{content:"GOOD CODE\A A KINDER\A TOMORROW";white-space:pre;position:absolute;right:16%;bottom:28%;font:500 12px/1.4 Georgia,serif;color:#75634d;text-align:center}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 14px}
.section-title{font-size:30px;line-height:1.2;letter-spacing:-.045em;margin:0}
.section-caption{font-family:Georgia,"Noto Serif KR",serif;color:#9a8c7d;margin:4px 0 0;font-size:13px}
.section-link{border:0;background:transparent;color:#817567;padding:8px 0}
.book-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,220px);gap:20px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.book-rail::-webkit-scrollbar{display:none}
.book-item{border:0;background:transparent;padding:0;text-align:left;min-width:0;scroll-snap-align:start}
.book-cover{position:relative;height:250px;border:1px solid #d9cebd;border-radius:5px 14px 14px 5px;padding:21px 18px;overflow:hidden;box-shadow:8px 12px 24px #6f593a22,inset 7px 0 10px #00000009}
.book-cover:after{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:#ffffff95;box-shadow:4px 0 8px #614d3417}
.book-cover small{display:block;position:relative;z-index:1;font:500 10px Georgia,serif;letter-spacing:.08em;opacity:.75}
.book-cover strong{display:block;position:relative;z-index:1;font:600 23px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px;letter-spacing:-.04em}
.book-cover em{position:absolute;left:18px;bottom:18px;font:500 9px/1.3 Georgia,serif;letter-spacing:.11em;font-style:normal;opacity:.72}
.book-cover .cover-art{position:absolute;left:18px;right:18px;bottom:50px;height:75px;border-radius:2px;background:linear-gradient(180deg,#edcf9d 0 39%,#7f7760 40% 60%,#dbc080 61%)}
.tone1{background:#eee5d6}
.tone2{background:#315245;color:#f4eee3;border-color:#506d61}
.tone3{background:#e8deca}
.tone4{background:#353330;color:#f2eadc;border-color:#504b45}
.book-meta{padding:10px 5px 0}
.book-meta small{color:#9b8e7d;font-size:10px;letter-spacing:.07em}
.book-title{display:block;font-size:17px;line-height:1.3;margin:3px 0 7px}
.book-progress{display:flex;align-items:center;gap:8px}
.book-progress .bar{flex:1;height:6px;background:#e2dbcf;border-radius:99px;overflow:hidden}
.book-progress .bar i{display:block;height:100%;background:#b78a4b}
.book-progress span{font-size:11px;color:#8b7e6e;white-space:nowrap}
.library-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:28px;padding:18px 23px;border-radius:16px;background:#f1e8db;color:#8e7e69}
.library-banner .leaf{font-size:28px;color:#b58b51}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:92px;padding:7px max(18px,env(safe-area-inset-left)) var(--navSafe);background:#fffdf9f5;border-top:1px solid #e4dacd;backdrop-filter:blur(14px);box-shadow:0 -10px 32px #7e644014}
.bottom-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:#786d62;font-size:11px}
.bottom-nav button.active{color:#a87b3e;font-weight:700}
.nav-icon{width:24px;height:24px;display:block}
.top-row{display:flex;align-items:center;gap:14px;margin:4px 0 24px}
.back-btn{border:0;background:transparent;font-size:31px;padding:0 6px 0 0;min-width:44px;height:44px}
.track-name{font-size:clamp(24px,3vw,34px);line-height:1.2}
.track-hero{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:18px;border:1px solid #e9dece;border-radius:20px;background:#f2e8d8}
.track-mini{height:245px;border:1px solid #d9cdbb;border-radius:5px 12px 12px 5px;background:#eee4d5;padding:22px 18px;box-shadow:7px 10px 22px #745b3a1e}
.track-mini small{font:500 10px Georgia,serif;letter-spacing:.08em;color:#766856}
.track-mini strong{display:block;font:600 22px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px}
.track-mini .photo{height:85px;margin-top:20px;background:linear-gradient(180deg,#e8cb98 0 42%,#7e765f 43% 61%,#d7ba79 62%)}
.track-copy{padding:9px 10px 7px 0;display:flex;flex-direction:column;justify-content:center}
.track-headline{font-size:25px;line-height:1.4;margin-bottom:11px}
.track-desc{margin:0;color:#75695c;font-family:Georgia,"Noto Serif KR",serif;line-height:1.55}
.track-copy .pill-primary{align-self:flex-end;margin-top:17px}
.chapter-list{display:grid;gap:8px}
.chapter-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:13px;border:1px solid #e8dfd2;border-radius:14px;background:#fffdf8;padding:12px 14px;text-align:left;box-shadow:0 4px 13px #866c4b08}
.chapter-row.current{background:#f3e7d3}
.chapter-num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#f0e6d7;font-family:Georgia,serif;font-size:17px}
.chapter-row.current .chapter-num{background:#dfc59a}
.chapter-name{font-size:17px;line-height:1.25}
.chapter-sub{display:block;margin-top:4px;color:#978a7c;font-family:system-ui;font-size:11px}
.status-chip{border-radius:999px;background:#f1eee7;color:#877b6f;padding:7px 12px;font-size:11px;white-space:nowrap}
.status-chip.done{background:#edf2e9;color:#65805a}
.status-chip.reading{background:#fff8ed;color:#9f7338}
.saved-head{margin:8px 0 18px}
.saved-head h1{font-size:42px;line-height:1.1;margin:0}
.saved-head p{font-family:Georgia,"Noto Serif KR",serif;color:#9a8b79;margin:6px 0 0}
.chips{display:flex;gap:9px;margin:20px 0}
.chip{border:0;border-radius:999px;background:#f0e8dc;color:#6f6356;padding:10px 19px}
.chip.active{background:#ad8349;color:white}
.saved-list{display:grid;gap:13px}
.saved-card{display:grid;grid-template-columns:36px minmax(0,1fr) 150px;gap:15px;align-items:center;width:100%;border:1px solid #e8dfd2;border-radius:17px;background:#fffdf8;padding:13px 15px;text-align:left}
.saved-mark{align-self:start;width:30px;height:37px;border:1px solid #e6d9c6;border-radius:7px;background:#fff8ed;color:#ae8246;display:grid;place-items:center}
.saved-copy small{font-family:Georgia,"Noto Serif KR",serif;color:#3d352e;font-size:12px}
.saved-copy strong{display:block;font-family:Georgia,"Noto Serif KR",serif;font-size:19px;line-height:1.35;margin:5px 0}
.saved-copy p{margin:0;color:#8d8072;font-family:Georgia,"Noto Serif KR",serif;font-size:13px;line-height:1.45}
.saved-thumb{height:104px;border-radius:11px;background:linear-gradient(135deg,#e9d8ba 0,#f9f2e7 45%,#baa17d 46%,#e6d5b9 100%);position:relative;overflow:hidden}
.saved-thumb:after{content:"A NEW\A JOURNEY";white-space:pre;position:absolute;right:12px;bottom:10px;font:500 9px/1.3 Georgia,serif;color:#76634c}
.panel{border:1px solid #e8dfd2;border-radius:16px;background:#fffdf8;padding:18px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:18px}
.panel p{margin:0;color:#85796d}
.panel .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.small-btn{border:1px solid #ddd1c1;border-radius:10px;background:#fffaf2;padding:9px 12px}
.search-input,textarea{width:100%;border:1px solid #ddd2c3;border-radius:12px;background:#fffdf9;padding:13px 14px;color:var(--ink)}
.search-results{display:grid;gap:8px;margin-top:13px}
.result{border:1px solid #e6dccf;border-radius:13px;background:#fffdf8;padding:13px 14px;text-align:left}
.result small{display:block;color:#998b7a;font-size:10px}
.result strong{display:block;font-family:Georgia,"Noto Serif KR",serif;margin-top:4px}
.result p{margin:5px 0 0;color:#81766a;font-size:12px}
.empty{color:#958879;padding:24px 2px}
dialog{width:min(620px,calc(100% - 28px));max-height:82dvh;overflow:auto;border:1px solid #d9cebf;border-radius:18px;background:#fffaf2;color:var(--ink);padding:21px;box-shadow:0 22px 70px #0005}
dialog::backdrop{background:#0009}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-top h2{margin:0;font-family:Georgia,"Noto Serif KR",serif}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translateX(-50%);max-width:90vw;background:#2a2119;color:#f4ecdf;border:1px solid #584633;border-radius:10px;padding:10px 15px;font-size:13px;box-shadow:0 10px 35px #0006}

/* Reader — single visual language, no legacy overrides */
.reader-shell{height:100dvh;background:var(--reader);color:var(--readerInk);display:grid;grid-template-rows:58px minmax(0,1fr) auto;overflow:hidden}
.reader-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:7px;padding:6px 15px;background:#17120ef5;border-bottom:1px solid #2d241c}
.reader-top button{border:0;background:transparent;color:var(--readerInk);min-width:42px;height:42px;border-radius:10px}
.reader-heading{text-align:center;min-width:0}
.reader-heading strong{display:block;font:500 17px/1.2 Georgia,"Noto Serif KR",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-heading small{display:none}
.reader-paper-wrap{position:relative;min-height:0;display:flex;justify-content:center;overflow:hidden;background:var(--reader)}
.reader-paper{position:relative;width:min(880px,calc(100% - 88px));height:100%;overflow-x:hidden;overflow-y:hidden;background:var(--reader);scroll-behavior:smooth;overscroll-behavior:none}
.reader-flow{height:auto;width:100%;column-count:1;column-gap:0;column-fill:auto;font-size:var(--readerBody);line-height:var(--readerLine);font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif;color:var(--readerInk);-webkit-text-size-adjust:none;text-size-adjust:none}
.lesson-section{display:contents}
.logical-anchor{display:block;width:0;height:0;overflow:hidden;break-after:avoid;page-break-after:avoid}
.reader-flow>*:not(.logical-anchor){margin-left:var(--pagePad);margin-right:var(--pagePad)}
.reader-flow>.code,.reader-flow>.diagram,.reader-flow>.callout,.reader-flow>.practice-box,.reader-flow>.question-box,.reader-flow>.summary-card,.reader-flow>details{width:auto}
.reader-flow .eyebrow{margin:0 0 4px;color:var(--readerGold);font-size:12px;line-height:1.4;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.reader-flow h1{margin:0 0 8px;font-size:34px;line-height:1.18;letter-spacing:-.045em;font-weight:600;break-after:avoid}
.reader-flow h2{margin:0 0 5px;font-size:24px;line-height:1.28;break-after:avoid}
.reader-flow h3{margin:0 0 4px;font-size:19px;line-height:1.3;break-after:auto}
.reader-flow .glossary-term,.reader-flow .extra-title{margin:0;padding-top:6px;border-top:1px solid #3a2d23;break-after:auto;page-break-after:auto}
.reader-flow .glossary-label{margin:2px 0 0!important;break-after:auto;page-break-after:auto}
.reader-flow p,.reader-flow .paragraph{font-size:var(--readerBody);line-height:var(--readerLine);margin:0;padding:0;orphans:1;widows:1}
.reader-flow p+p,.reader-flow .paragraph+.paragraph{margin-top:0}
.reader-flow ul{margin:0;padding-left:23px}
.reader-flow li{margin:0;line-height:var(--readerLine);orphans:1;widows:1}
.reader-flow li+li{margin-top:0}
.reader-flow .card,.reader-flow .callout,.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{margin:0;-webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto}
.reader-flow .card{border:0;border-top:1px solid #3a2d23;border-radius:0;background:transparent;padding:6px 0}
.reader-flow .card+.card{margin-top:0}
.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{border:1px solid #49392c;border-radius:11px;background:#1e1712;padding:8px 11px}
.reader-flow .label{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#c69a58;font-size:10px;font-weight:700;margin:3px 0 1px}
.reader-flow .callout{border:1px solid #5a472f;border-radius:11px;background:linear-gradient(135deg,#2b2117,#211912);padding:8px 11px;break-inside:auto}
.reader-flow .callout-title{font-weight:700;color:#e2bd7b;margin-bottom:2px}
.reader-flow .goal{margin:0;border-left:2px solid var(--readerGold);padding:0 0 0 10px;color:#c9baa6}
.reader-flow .code{margin:0;border:1px solid #4a392d;border-radius:10px;overflow:visible;background:#100d0b;-webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto}
.reader-flow .code-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 10px;background:#1e1712;color:#bfae99;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:11px}
.reader-flow .copy-btn{border:0;background:transparent;color:#d7c4aa;padding:3px 5px}
.reader-flow pre{margin:0;padding:8px 12px;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;font:15px/1.58 ui-monospace,SFMono-Regular,Consolas,monospace;color:#ece4d8;orphans:1;widows:1}
.reader-flow .code-output{border-top:1px solid #382c22;padding:6px 12px;white-space:pre-wrap;font:15px/1.58 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcae9b}
.reader-flow .diagram{margin:0;border:1px solid #49392c;border-radius:10px;overflow:visible;break-inside:auto;-webkit-column-break-inside:auto}
.reader-flow .diagram-row{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:6px 11px;border-bottom:1px solid #34291f}
.reader-flow .diagram-row:last-child{border-bottom:0}
.reader-flow .diagram-key{color:#d3a45b;font-weight:700}
.reader-flow details{margin:0;border:1px solid #49392c;border-radius:10px;padding:8px 11px;break-inside:auto;-webkit-column-break-inside:auto}
.reader-flow summary{cursor:pointer;color:#d8b272}
.reader-flow .chapter-end{border-top:1px solid #49382b;padding-top:7px}
.reader-flow .chapter-end .actions{display:flex;gap:7px;flex-wrap:wrap}
.reader-flow .reader-action{border:1px solid #5b4632;border-radius:10px;background:#231a13;color:#eadfce;padding:7px 10px}
.edge-zone{position:absolute;top:0;bottom:0;z-index:15;width:clamp(44px,7vw,86px);border:0;background:transparent}
.edge-prev{left:0}.edge-next{right:0}
.reader-bottom{display:grid;grid-template-columns:auto minmax(120px,1fr) auto auto;align-items:center;gap:10px;min-height:84px;padding:8px 18px var(--navSafe);background:#17120ef5;border-top:1px solid #33281f}
.reader-bottom button{border:1px solid #51402f;background:#1a140f;color:#eadfce}
.circle-btn{width:48px;height:48px;border-radius:50%;font-size:29px;line-height:1;padding:0}
.focus-btn{min-height:42px;border-radius:13px!important;padding:0 12px;font-size:11px}
.reader-page-info{text-align:center;color:#c9baa7;font:500 12px Georgia,"Noto Serif KR",serif}
.reader-progress{height:5px;max-width:240px;margin:7px auto 0;background:#3b3027;border-radius:99px;overflow:hidden}
.reader-progress i{display:block;height:100%;background:var(--readerGold);border-radius:99px}
.reader-shell.focus .reader-top{display:none}
.reader-shell.focus{grid-template-rows:minmax(0,1fr) auto}
.reader-shell.focus .reader-paper{width:min(920px,calc(100% - 70px))}
.reader-shell.focus .reader-bottom{min-height:72px}
.reader-shell.focus .focus-btn:after{content:" 해제"}
@media(min-width:900px){
  .book-rail{grid-auto-columns:minmax(185px,230px)}
  .reader-paper{width:min(800px,calc(100% - 180px))}
  .reader-flow h1{font-size:36px}
}
@media(max-width:720px){
  .shell{padding:24px 18px 145px}
  .home-head{margin-bottom:22px}
  .display-title{font-size:42px}
  .home-quote{font-size:12px}
  .continue-card{grid-template-columns:1fr}
  .still-life{height:148px;order:-1}
  .continue-copy{padding:22px 24px}
  .continue-kicker{font-size:27px}
  .book-rail{grid-auto-columns:minmax(154px,184px);gap:14px}
  .book-cover{height:222px}
  .track-hero{grid-template-columns:112px 1fr;gap:16px}
  .track-mini{height:188px;padding:16px 12px}
  .track-mini strong{font-size:17px}
  .track-mini .photo{height:56px}
  .track-headline{font-size:20px}
  .track-desc{font-size:12px}
  .saved-card{grid-template-columns:32px minmax(0,1fr) 108px;gap:10px}
  .saved-thumb{height:90px}
  .saved-copy strong{font-size:16px}
  .reader-paper{width:calc(100% - 54px)}
  .reader-top{grid-template-columns:auto minmax(0,1fr) auto auto}
  .reader-top .note-top{display:none}
  .reader-flow h1{font-size:32px}
  .reader-bottom{grid-template-columns:auto minmax(100px,1fr) auto}
  .reader-bottom .focus-btn{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="modal"></dialog>
<div id="toast" class="toast" hidden></div>
<script id="course" type="application/json">__COURSE_JSON__</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course').textContent);
const chapters=COURSE.chapters;
const native=window.RoadmapNative;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const defaults={schema:1,version:2,location:chapters[0].pages[0].id,bookmarks:[],notes:{},complete:[],visited:[],migrated:false};
let state;
try{state=JSON.parse(native?native.getState():localStorage.getItem('codingroadmap-live-state')||'{}')}catch(e){state={}}
state=Object.assign({},defaults,state);
for(const k of ['bookmarks','complete','visited'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.notes||typeof state.notes!=='object'||Array.isArray(state.notes))state.notes={};
let route='home';
let current=locate(state.location)||{c:0,p:0};
let selectedTrack=chapters[current.c].track;
let focus=false;
let searchQuery='';
let savedFilter='all';
let updateStatus=native?native.getStatus():'저장된 교재';
let toastTimer;
let physicalPage=0;
let physicalPages=1;
let pendingTargetId=state.location;
let pendingLast=false;
let previewRoute='';
try{if(typeof location!=='undefined')previewRoute=new URLSearchParams(location.search).get('preview')||''}catch(e){}

function locate(id){
  for(let c=0;c<chapters.length;c++){
    const p=chapters[c].pages.findIndex(x=>x.id===id);
    if(p>=0)return {c,p};
  }
  return null;
}
function persist(){
  try{
    const raw=JSON.stringify(state);
    if(native)native.saveState(raw);else localStorage.setItem('codingroadmap-live-state',raw);
  }catch(e){toast('학습 기록을 저장하지 못했습니다')}
}
function migrate(){
  if(state.migrated)return;
  try{
    const old=native?JSON.parse(native.getLegacy()||'{}'):{};
    state.legacy=old;
    if(Object.keys(old).length){
      const c=(Number(old.current_track)||0)*8+(Number(old.current_chapter)||0);
      const chapter=chapters[c];
      if(chapter){
        const id=chapter.id+'-p'+((Number(old.current_page)||0)+1);
        state.location=locate(id)?id:chapter.pages[0].id;
        current=locate(state.location)||current;
      }
    }
  }catch(e){}
  state.migrated=true;
  persist();
}
migrate();

function toast(message){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.hidden=true,2400);
}
function navSvg(type){
  const common='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon" aria-hidden="true"';
  if(type==='home')return '<svg '+common+'><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>';
  if(type==='books')return '<svg '+common+'><path d="M4 4.5h6.5v15H4z"/><path d="M13.5 4.5H20v15h-6.5z"/><path d="M10.5 7.5h3"/></svg>';
  if(type==='saved')return '<svg '+common+'><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>';
  return '<svg '+common+'><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1-2.8 2.8-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.6V21h-4v-.1A1.8 1.8 0 0 0 8.8 19a1.8 1.8 0 0 0-2 .4l-.1.1-2.8-2.8.1-.1a1.8 1.8 0 0 0 .4-2A1.8 1.8 0 0 0 2.8 13H2.7V9h.1A1.8 1.8 0 0 0 4.4 8a1.8 1.8 0 0 0-.4-2l-.1-.1 2.8-2.8.1.1a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 9.9 2h4a1.8 1.8 0 0 0 1.1 1.6 1.8 1.8 0 0 0 2-.4l.1-.1 2.8 2.8-.1.1a1.8 1.8 0 0 0-.4 2A1.8 1.8 0 0 0 21 9h.1v4H21a1.8 1.8 0 0 0-1.6 2z"/></svg>';
}
function bottomNav(){
  const item=(id,label)=>'<button class="'+(route===id||(id==='books'&&route==='track')?'active':'')+'" data-action="'+id+'">'+navSvg(id)+'<span>'+label+'</span></button>';
  return '<nav class="bottom-nav">'+item('home','홈')+item('books','서재')+item('saved','북마크')+item('settings','설정')+'</nav>';
}
function progressForTrack(id){
  const ids=chapters.filter(c=>c.track===id).flatMap(c=>c.pages.map(p=>p.id));
  if(!ids.length)return 0;
  return Math.round(100*ids.filter(id=>state.visited.includes(id)).length/ids.length);
}
function coverTone(id){return 'tone'+(((Number(id)||1)-1)%4+1)}
function bookCard(track){
  const p=progressForTrack(track.id);
  return '<button class="book-item" data-action="track" data-track="'+track.id+'" '+(track.available?'':'disabled')+'>'+
    '<div class="book-cover '+coverTone(track.id)+'"><small>TRACK '+String(track.id).padStart(2,'0')+'</small><strong>'+esc(track.title)+'</strong><div class="cover-art"></div><em>'+(track.available?'A NEW JOURNEY BEGINS':'COMING SOON')+'</em></div>'+
    '<div class="book-meta"><small>TRACK '+String(track.id).padStart(2,'0')+'</small><span class="book-title">'+esc(track.title)+'</span><div class="book-progress"><div class="bar"><i style="width:'+(track.available?p:0)+'%"></i></div><span>'+(track.available?(p?p+'%':'시작 전'):'준비 중')+'</span></div></div></button>';
}
function home(){
  const c=chapters[current.c],p=c.pages[current.p],prog=progressForTrack(c.track);
  return '<div class="screen"><main class="shell">'+
    '<section class="home-head"><div><h1 class="display-title">코딩 로드맵</h1><p class="home-sub">오늘도, 더 나은 개발자가 되어볼까요?</p></div><div class="home-quote">좋은 코드는<br>더 좋은 가능성을<br>만듭니다.</div></section>'+
    '<section class="continue-card"><div class="continue-copy"><div class="continue-kicker serif">이어 학습하기</div><p class="continue-lead">지금의 한 걸음이,<br>더 넓은 세상을 만듭니다.</p><div class="continue-rule"></div><div class="continue-meta">TRACK '+String(c.track).padStart(2,'0')+' · '+esc(c.title)+'</div><h2 class="continue-title">'+esc(p.title)+'</h2><div class="progress-row"><div class="progress-track"><i style="width:'+prog+'%"></i></div><b>'+prog+'%</b></div><button class="pill-primary" data-action="continue">이어보기 →</button></div><div class="still-life" aria-hidden="true"></div></section>'+
    '<div class="section-head"><div><h2 class="section-title">학습 트랙</h2><p class="section-caption">한 장씩, 차근차근 나만의 속도로.</p></div><button class="section-link" data-action="books">전체 보기 ›</button></div>'+
    '<div class="book-rail">'+COURSE.tracks.slice(0,4).map(bookCard).join('')+'</div>'+
    '<div class="section-head"><div><h2 class="section-title">내 서재</h2><p class="section-caption">지금의 배움이, 언젠가 더 큰 나를 만듭니다.</p></div></div>'+
    '<div class="library-banner"><span class="leaf">❧</span><span>꾸준히 배우는<br><strong>당신이 이미 특별합니다.</strong></span><span>Good Code<br>A Kinder Tomorrow</span></div>'+
    '</main>'+bottomNav()+'</div>';
}
function books(){
  return '<div class="screen"><main class="shell"><section class="home-head"><div><h1 class="display-title">내 서재</h1><p class="home-sub">배우고 싶은 트랙을 골라 시작하세요.</p></div><div class="home-quote">작은 배움이 모여,<br>큰 변화를 만듭니다.</div></section>'+
    '<div class="book-rail" style="grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));overflow:visible">'+COURSE.tracks.map(bookCard).join('')+'</div></main>'+bottomNav()+'</div>';
}
function trackPage(){
  const t=COURSE.tracks.find(x=>x.id===selectedTrack);
  const list=chapters.map((c,i)=>{
    if(c.track!==selectedTrack)return '';
    const status=state.complete.includes(c.id)?'<span class="status-chip done">✓ 완료</span>':i===current.c?'<span class="status-chip reading">읽는 중</span>':'<span class="status-chip">›</span>';
    return '<button class="chapter-row '+(i===current.c?'current':'')+'" data-action="chapter" data-c="'+i+'"><span class="chapter-num">'+c.chapter+'</span><span><span class="chapter-name">Chapter '+c.chapter+' · '+esc(c.title)+'</span><span class="chapter-sub">'+c.pages.length+'장 · 직접 연습 포함</span></span>'+status+'</button>';
  }).join('');
  const first=chapters.findIndex(c=>c.track===selectedTrack);
  const target=chapters[current.c]&&chapters[current.c].track===selectedTrack?current.c:first;
  const prog=progressForTrack(selectedTrack);
  return '<div class="screen"><main class="shell"><div class="top-row"><button class="back-btn" data-action="home">←</button><div class="track-name">TRACK '+String(t.id).padStart(2,'0')+' · '+esc(t.title)+'</div></div>'+
    '<section class="track-hero"><div class="track-mini"><small>TRACK '+String(t.id).padStart(2,'0')+'</small><strong>'+esc(t.title)+'</strong><div class="photo"></div></div><div class="track-copy"><div class="track-headline serif">지금의 한 걸음이,<br>더 넓은 세상을 만듭니다.</div><p class="track-desc">'+esc(t.subtitle||'차근차근, 어렵지 않게 배웁니다.')+'</p><div class="progress-row" style="margin-top:14px"><div class="progress-track"><i style="width:'+prog+'%"></i></div><b>'+prog+'%</b></div><button class="pill-primary" data-action="chapter" data-c="'+target+'">이어보기 →</button></div></section>'+
    '<div class="section-head"><div><h2 class="section-title">목차</h2><p class="section-caption">작은 배움이 모여, 큰 변화를 만듭니다.</p></div></div><div class="chapter-list">'+list+'</div></main>'+bottomNav()+'</div>';
}
function pageText(page){
  return [page.title].concat(page.paragraphs||[],page.bullets||[],page.question||'',page.practicePrompt||'',page.code||'',...(page.glossary||[]).flatMap(g=>[g.term,g.description,g.usage,g.example])).join(' ');
}
function summaryText(page){
  const s=(page.paragraphs&&page.paragraphs[0])||page.question||page.practicePrompt||page.codeNote||'다시 읽고 싶은 학습 페이지입니다.';
  return String(s).slice(0,90)+(String(s).length>90?'…':'');
}
function saved(){
  const markCards=state.bookmarks.map(id=>{
    const pos=locate(id);if(!pos)return '';
    const c=chapters[pos.c],p=c.pages[pos.p];
    return '<button class="saved-card" data-action="open" data-id="'+esc(id)+'" data-saved-kind="bookmark"><span class="saved-mark">▮</span><span class="saved-copy"><small>Chapter '+c.chapter+' · '+esc(c.title)+'</small><strong>“'+esc(p.title)+'”</strong><p>'+esc(summaryText(p))+'</p></span><span class="saved-thumb"></span></button>';
  }).join('');
  const noteCards=Object.entries(state.notes).filter(([id,s])=>String(s).trim()).map(([id,s])=>{
    const pos=locate(id);if(!pos)return '';
    const c=chapters[pos.c],p=c.pages[pos.p];
    return '<button class="saved-card" data-action="open" data-id="'+esc(id)+'" data-saved-kind="note"><span class="saved-mark">✎</span><span class="saved-copy"><small>내 메모 · Chapter '+c.chapter+'</small><strong>'+esc(p.title)+'</strong><p>'+esc(String(s).slice(0,100))+'</p></span><span class="saved-thumb"></span></button>';
  }).join('');
  const cards=(savedFilter==='bookmark'?markCards:savedFilter==='note'?noteCards:markCards+noteCards)||'<p class="empty">저장한 내용이 없습니다.</p>';
  return '<div class="screen"><main class="shell"><section class="home-head"><div><h1 class="display-title">코딩 로드맵</h1><p class="home-sub">오늘도, 더 나은 개발자가 되어볼까요?</p></div><div class="home-quote">좋은 코드는<br>더 좋은 가능성을<br>만듭니다.</div></section><section class="saved-head"><h1 class="serif">북마크</h1><p>다시 보고 싶은 순간들을 모아두었어요.</p></section><div class="chips"><button class="chip '+(savedFilter==='all'?'active':'')+'" data-action="saved-filter" data-filter="all">전체</button><button class="chip '+(savedFilter==='bookmark'?'active':'')+'" data-action="saved-filter" data-filter="bookmark">북마크</button><button class="chip '+(savedFilter==='note'?'active':'')+'" data-action="saved-filter" data-filter="note">메모</button></div><div class="saved-list">'+cards+'</div></main>'+bottomNav()+'</div>';
}
function searchResults(q){
  if(!q.trim())return '<p class="empty">변수, NameError, return처럼 모르는 말을 찾아보세요.</p>';
  const hits=[];
  chapters.forEach((c,ci)=>c.pages.forEach((p,pi)=>{
    const s=pageText(p);
    const n=s.toLowerCase().indexOf(q.toLowerCase());
    if(n>=0)hits.push({c,ci,p,pi,s:s.slice(Math.max(0,n-30),n+110)});
  }));
  return hits.slice(0,100).map(h=>'<button class="result" data-action="open" data-id="'+esc(h.p.id)+'"><small>TRACK '+h.c.track+' · Chapter '+h.c.chapter+'</small><strong>'+esc(h.p.title)+'</strong><p>'+esc(h.s)+'…</p></button>').join('')||'<p class="empty">검색 결과가 없습니다.</p>';
}
function search(){
  return '<div class="screen"><main class="shell"><div class="top-row"><button class="back-btn" data-action="home">←</button><div class="track-name">본문·용어 검색</div></div><input id="search" class="search-input" placeholder="단어, 코드, 오류 이름 검색" value="'+esc(searchQuery)+'"><div id="results" class="search-results">'+searchResults(searchQuery)+'</div></main>'+bottomNav()+'</div>';
}
function settings(){
  return '<div class="screen"><main class="shell"><div class="top-row"><button class="back-btn" data-action="home">←</button><div class="track-name">설정</div></div>'+
    '<section class="panel"><h3>읽기 화면</h3><p>본문 크기 18px · 줄간격 1.68 · 페이지별 자동 축소 없음. 화면 크기에 맞춰 같은 규격으로 페이지를 나눕니다.</p></section>'+
    '<section class="panel"><h3>자동 업데이트</h3><p>'+esc(updateStatus)+'</p><div class="actions"><button class="small-btn" data-action="refresh">지금 확인</button><button class="small-btn" data-action="apply">받은 변경 적용</button></div></section>'+
    '<section class="panel"><h3>학습 기록</h3><p>읽던 위치, 북마크, 메모, 완료 기록을 파일로 저장하거나 복원합니다.</p><div class="actions"><button class="small-btn" data-action="export">기록 내보내기</button><button class="small-btn" data-action="import">기록 가져오기</button></div><input id="import-file" type="file" accept="application/json" hidden></section>'+
    '<section class="panel"><h3>기존 화면</h3><p>APK에 포함된 이전 화면을 열 수 있습니다.</p><div class="actions"><button class="small-btn" data-action="legacy">이전 앱 화면 열기</button></div></section>'+
    '</main>'+bottomNav()+'</div>';
}
function diagram(page,c){
  let rows=null;
  if(page.visual==='PROBLEM_SOLVING_FLOW')rows=[['목표','무엇이 되면 해결인가?'],['입력·출력','무엇을 받고 무엇을 만들까?'],['제약조건','어떤 규칙과 경계가 있나?'],['분해','작은 동사 단계로 나누기'],['흐름','순서·조건·반복 표시'],['의사코드','문법 없이 실행 순서 점검'],['코드·테스트','작게 구현하고 경계값 확인']];
  else if(page.visual==='CODE_TO_OUTPUT')rows=[['작성','print("안녕")'],['실행','Python이 코드 처리'],['출력','안녕']];
  else if(page.visual==='TOP_TO_BOTTOM')rows=[['1번 줄','위에서 시작'],['중간','값과 조건 확인'],['마지막','결과 출력']];
  else if(page.visual==='VARIABLE_BINDING')rows=[['name','"민수"'],['age','37 → 38']];
  else if(page.visual==='TYPE_TABLE')rows=[['int','정수'],['float','실수'],['str','문자열'],['bool','참/거짓']];
  else if(page.visual==='INPUT_CONVERSION')rows=[['입력','문자열'],['변환','int(...)'],['처리','숫자 계산']];
  else if(page.visual==='ERROR_MAP')rows=[['NameError','이름·철자'],['TypeError','타입·연산'],['ValueError','값 내용'],['SyntaxError','문법']];
  else if(page.visual==='CALC_STEPS')rows=[['입력','수량·가격'],['처리','곱하고 더하기'],['출력','합계']];
  else if(page.visual==='IPO_PROJECT')rows=[['입력','데이터'],['처리','규칙 적용'],['출력','결과']];
  if(!rows)return '';
  return '<div class="diagram">'+rows.map(r=>'<div class="diagram-row"><span class="diagram-key">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div>';
}
function codeBlock(code,note){
  return '<div class="code"><div class="code-bar"><span>Python · 예제 코드</span><button class="copy-btn" data-action="copy-code">복사하기</button></div><pre><code>'+esc(code)+'</code></pre>'+(note?'<div class="code-output">'+esc(note)+'</div>':'')+'</div>';
}
function lessonSection(page,c,index){
  let out='<span class="logical-anchor" data-page-id="'+esc(page.id)+'" data-page-index="'+index+'" aria-hidden="true"></span><div class="eyebrow">'+esc(page.eyebrow||page.kind)+'</div><h1>'+esc(page.title)+'</h1>';
  (page.paragraphs||[]).forEach(s=>out+='<p class="paragraph">'+txt(s)+'</p>');
  (page.glossary||[]).forEach(g=>{
    out+='<h3 class="glossary-term">'+esc(g.term)+'</h3><p>'+txt(g.description)+'</p><div class="label glossary-label">어디에 쓰나요?</div><p>'+txt(g.usage)+'</p><div class="label glossary-label">예시</div><p>'+txt(g.example)+'</p>';
  });
  if(page.visual)out+=diagram(page,c);
  if(page.bullets&&page.bullets.length)out+='<ul>'+page.bullets.map(x=>'<li>'+txt(x)+'</li>').join('')+'</ul>';
  if(page.calloutTitle)out+='<div class="callout"><div class="callout-title">'+esc(page.calloutTitle)+'</div><p>'+txt(page.calloutBody||'')+'</p></div>';
  if(page.code)out+=codeBlock(page.code,page.codeNote);
  if(page.practicePrompt)out+='<div class="practice-box"><h3>직접 해보기</h3><p>'+txt(page.practicePrompt)+'</p></div>';
  if(page.question)out+='<div class="question-box"><h3>먼저 생각해 보세요</h3><p>'+txt(page.question)+'</p></div>';
  if(page.answerOnNext)out+='<div class="goal">먼저 예상 결과와 이유를 적어 보세요. 다음 내용에 정답과 풀이가 이어집니다.</div>';
  if(page.answer)out+='<details><summary>정답·해설</summary><p>'+txt(page.answer)+'</p></details>';
  (page.extras||[]).forEach(e=>out+='<h3 class="extra-title">'+esc(e.title)+'</h3><p>'+txt(e.body)+'</p>');
  if(page.closingPrompt)out+='<div class="goal">'+txt(page.closingPrompt)+'</div>';
  if(page.kind==='summary')out+='<div class="summary-card"><h3>기억할 것</h3><p>'+esc(c.remember||'')+'</p><h3>직접 해볼 것</h3><p>'+esc(c.practiceGoal||'')+'</p></div>';
  if(index===c.pages.length-1)out+='<div class="chapter-end"><h3>이 챕터를 설명할 수 있나요?</h3><p>'+esc(c.practiceGoal||'직접 설명해 보세요.')+'</p><div class="actions"><button class="reader-action" data-action="complete">'+(state.complete.includes(c.id)?'완료 표시 취소':'이해 완료로 표시')+'</button><button class="reader-action" data-action="track-current">목차로</button></div></div>';
  return out;
}
function chapterFlow(c){return c.pages.map((p,i)=>lessonSection(p,c,i)).join('')}
function reader(){
  const c=chapters[current.c],p=c.pages[current.p];
  return '<div class="reader-shell '+(focus?'focus':'')+'">'+
    '<header class="reader-top"><button data-action="track-current" aria-label="목차">←</button><div class="reader-heading"><strong>Chapter '+c.chapter+' · '+esc(c.title)+'</strong><small>TRACK '+c.track+'</small></div><button data-action="bookmark" aria-label="북마크">'+(state.bookmarks.includes(p.id)?'★':'☆')+'</button><button class="note-top" data-action="note" aria-label="메모">▤</button><button data-action="display" aria-label="읽기 설정">Aa</button></header>'+
    '<div class="reader-paper-wrap"><button class="edge-zone edge-prev" data-action="prev" aria-label="이전 페이지"></button><article id="paper" class="reader-paper"><div id="flow" class="reader-flow">'+chapterFlow(c)+'</div></article><button class="edge-zone edge-next" data-action="next" aria-label="다음 페이지"></button></div>'+
    '<footer class="reader-bottom"><button class="circle-btn" data-action="prev" aria-label="이전">‹</button><div class="reader-page-info"><span id="page-pos">1 / 1</span><div class="reader-progress"><i id="page-progress" style="width:0%"></i></div></div><button class="circle-btn" data-action="next" aria-label="다음">›</button><button class="focus-btn" data-action="focus">▣ 집중</button></footer>'+
    '</div>';
}
function render(){
  if(previewRoute==='reader'){route='reader';previewRoute=''}else if(previewRoute==='books'){route='books';previewRoute=''}else if(previewRoute==='track'){route='track';selectedTrack=1;previewRoute=''}else if(previewRoute==='saved'){route='saved';previewRoute=''}
  const map={home,books,track:trackPage,reader,search,saved,settings};
  document.getElementById('app').innerHTML=(map[route]||home)();
  document.title='코딩 로드맵 · '+(route==='reader'?chapters[current.c].title:'서재');
  if(route==='reader'){
    installReaderGestures();
    if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(layoutReader));
    else layoutReader();
  }
  if(native)native.ready();
}
function openPage(id,last){
  const pos=locate(id);
  if(!pos){toast('현재 교재에서 이 페이지를 찾지 못했습니다');return}
  current=pos;
  selectedTrack=chapters[pos.c].track;
  state.location=id;
  if(!state.visited.includes(id))state.visited.push(id);
  persist();
  pendingTargetId=id;
  pendingLast=!!last;
  route='reader';
  render();
}
function logicalFallback(delta){
  let c=current.c,p=current.p+delta;
  if(p<0){if(c===0)return;c--;p=chapters[c].pages.length-1}
  else if(p>=chapters[c].pages.length){if(c===chapters.length-1)return;c++;p=0}
  openPage(chapters[c].pages[p].id,delta<0);
}
function physicalForId(id){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelector||!paper.getBoundingClientRect)return 0;
  const sec=flow.querySelector('.logical-anchor[data-page-id="'+String(id).replace(/"/g,'\\"')+'"]');
  if(!sec||!sec.getClientRects)return 0;
  const pr=paper.getBoundingClientRect();
  let left=Infinity;
  for(const rect of sec.getClientRects())left=Math.min(left,rect.left-pr.left+paper.scrollLeft);
  return Number.isFinite(left)?Math.max(0,Math.min(physicalPages-1,Math.floor(left/Math.max(paper.clientWidth,1)+.001))):0;
}
function syncLogical(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelectorAll||!paper.getBoundingClientRect||!paper.clientWidth)return;
  const pr=paper.getBoundingClientRect();
  let best=null,bestPage=-1,bestIndex=-1;
  for(const anchor of flow.querySelectorAll('.logical-anchor')){
    if(!anchor.getClientRects)continue;
    const rects=anchor.getClientRects();
    if(!rects||!rects.length)continue;
    const rect=rects[0];
    const left=rect.left-pr.left+paper.scrollLeft;
    const page=Math.max(0,Math.floor(left/Math.max(paper.clientWidth,1)+.001));
    const idx=Number(anchor.dataset.pageIndex);
    if(page<=physicalPage&&(page>bestPage||(page===bestPage&&idx>=bestIndex))){
      best=anchor;bestPage=page;bestIndex=idx;
    }
  }
  if(!best)return;
  const idx=Number(best.dataset.pageIndex);
  if(Number.isFinite(idx)&&idx>=0&&idx<chapters[current.c].pages.length){
    current.p=idx;
    state.location=chapters[current.c].pages[idx].id;
    if(!state.visited.includes(state.location))state.visited.push(state.location);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');
    if(star)star.textContent=state.bookmarks.includes(state.location)?'★':'☆';
  }
}
function updateHud(){
  const pos=document.getElementById('page-pos');
  const bar=document.getElementById('page-progress');
  if(pos)pos.textContent=(physicalPage+1)+' / '+physicalPages;
  if(bar)bar.style.width=(100*(physicalPage+1)/Math.max(physicalPages,1))+'%';
}
function layoutReader(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!paper.clientWidth||!paper.clientHeight)return;
  const w=paper.clientWidth,h=paper.clientHeight;
  flow.style.width='100%';
  flow.style.height='auto';
  flow.style.columnCount='1';
  flow.style.columnGap='0px';
  flow.style.columnFill='auto';
  paper.scrollLeft=0;
  const natural=Math.max(flow.scrollHeight,1);
  let guess=Math.max(1,Math.floor(natural/h+.001));
  const applyColumns=count=>{
    flow.style.width=(count*w)+'px';
    flow.style.height=h+'px';
    flow.style.columnCount=String(count);
    flow.style.columnGap='0px';
    flow.style.columnFill='balance';
  };
  applyColumns(guess);
  let actual=Math.max(1,Math.ceil(Math.max(flow.scrollWidth,w)/w-.001));
  if(actual>guess){guess=actual;applyColumns(guess);actual=Math.max(guess,Math.ceil(Math.max(flow.scrollWidth,w)/w-.001))}
  physicalPages=actual;
  if(physicalPages!==guess)applyColumns(physicalPages);
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{
    physicalPage=pendingLast?physicalPages-1:physicalForId(pendingTargetId||state.location);
    pendingLast=false;
    pendingTargetId='';
    paper.scrollLeft=physicalPage*w;
    syncLogical();
    updateHud();
    try{
      const cs=getComputedStyle(flow),ps=getComputedStyle(paper),footer=document.querySelector('.reader-bottom'),fr=footer&&footer.getBoundingClientRect?footer.getBoundingClientRect():null;
      document.body.dataset.qaReady='1';
      document.body.dataset.qaPages=String(physicalPages);
      document.body.dataset.qaFont=cs.fontSize;
      document.body.dataset.qaLineHeight=cs.lineHeight;
      document.body.dataset.qaOverflowY=ps.overflowY;
      document.body.dataset.qaFit=(flow.scrollHeight<=paper.clientHeight+2?'1':'0');
      document.body.dataset.qaFooterVisible=(!fr||fr.bottom<=innerHeight+1?'1':'0');
      document.body.dataset.qaViewport=String(innerWidth)+'x'+String(innerHeight);
    }catch(e){}
  });
}
function changePhysical(delta){
  const paper=document.getElementById('paper');
  if(!paper||!paper.clientWidth){logicalFallback(delta);return}
  const next=physicalPage+delta;
  if(next>=0&&next<physicalPages){
    physicalPage=next;
    if(typeof paper.scrollTo==='function')paper.scrollTo({left:physicalPage*paper.clientWidth,top:0,behavior:'smooth'});
    else paper.scrollLeft=physicalPage*paper.clientWidth;
    setTimeout(syncLogical,190);
    updateHud();
    return;
  }
  const nc=current.c+(delta>0?1:-1);
  if(nc<0||nc>=chapters.length)return;
  const target=chapters[nc];
  openPage(target.pages[delta>0?0:target.pages.length-1].id,delta<0);
}
function installReaderGestures(){
  const paper=document.getElementById('paper');
  if(!paper||!paper.addEventListener)return;
  let start=null,drag=false,startScroll=0;
  paper.addEventListener('pointerdown',e=>{
    if(e.target.closest('pre,button,a,input,textarea,summary,details'))return;
    start={x:e.clientX,y:e.clientY,t:Date.now()};
    startScroll=paper.scrollLeft;
    drag=false;
    try{paper.setPointerCapture&&paper.setPointerCapture(e.pointerId)}catch(err){}
  });
  paper.addEventListener('pointermove',e=>{
    if(!start)return;
    const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(!drag){
      if(Math.abs(dx)<10)return;
      if(Math.abs(dx)<=Math.abs(dy)*1.2)return;
      drag=true;
    }
    paper.scrollLeft=startScroll-dx;
    if(e.cancelable)e.preventDefault();
  });
  paper.addEventListener('pointerup',e=>{
    if(!start)return;
    const dx=e.clientX-start.x,dy=e.clientY-start.y,ms=Date.now()-start.t;
    start=null;
    const threshold=Math.min(110,Math.max(58,(innerWidth||360)*.1));
    if(drag&&Math.abs(dx)>threshold&&Math.abs(dx)>Math.abs(dy)*1.2&&ms<1400)changePhysical(dx<0?1:-1);
    else{
      if(typeof paper.scrollTo==='function')paper.scrollTo({left:physicalPage*paper.clientWidth,top:0,behavior:'smooth'});
      else paper.scrollLeft=physicalPage*paper.clientWidth;
    }
    drag=false;
  });
  paper.addEventListener('pointercancel',()=>{
    start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;
  });
}
function modal(title,body){
  const el=document.getElementById('modal');
  el.innerHTML='<div class="modal-top"><h2>'+esc(title)+'</h2><button class="small-btn" data-action="close">닫기</button></div>'+body;
  el.showModal();
}
function goBack(){
  const d=document.getElementById('modal');
  if(d.open){d.close();return true}
  if(route==='home')return false;
  if(route==='reader'){route='track';selectedTrack=chapters[current.c].track}
  else route='home';
  render();
  return true;
}
window.goBack=goBack;
function doAction(action,el){
  const c=chapters[current.c],p=c.pages[current.p];
  if(action==='home'||action==='books'||action==='search'||action==='saved'||action==='settings'){route=action;render();return}
  if(action==='track'){selectedTrack=Number(el.dataset.track);route='track';render();return}
  if(action==='track-current'){selectedTrack=c.track;route='track';render();return}
  if(action==='chapter'){const i=Number(el.dataset.c);openPage(chapters[i].pages[0].id);return}
  if(action==='continue'){openPage(state.location);return}
  if(action==='open'){openPage(el.dataset.id);return}
  if(action==='prev'){changePhysical(-1);return}
  if(action==='next'){changePhysical(1);return}
  if(action==='focus'){focus=!focus;render();return}
  if(action==='bookmark'){
    state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):state.bookmarks.concat(p.id);
    persist();render();toast(state.bookmarks.includes(p.id)?'북마크에 저장했습니다':'북마크를 해제했습니다');return;
  }
  if(action==='note'){modal('내 메모','<p style="color:#817567;margin-top:0">Chapter '+c.chapter+' · '+esc(p.title)+'</p><textarea id="note" rows="8">'+esc(state.notes[p.id]||'')+'</textarea>');return}
  if(action==='display'){modal('읽기 설정','<section class="panel"><h3>고정 읽기 규격</h3><p>본문 18px · 줄간격 1.68 · 페이지별 자동 확대/축소 없음.</p></section>');return}
  if(action==='complete'){state.complete=state.complete.includes(c.id)?state.complete.filter(x=>x!==c.id):state.complete.concat(c.id);persist();render();return}
  if(action==='copy-code'){
    const code=el.closest('.code').querySelector('code').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast('코드를 복사했습니다')).catch(()=>copyFallback(code));else copyFallback(code);
    return;
  }
  if(action==='saved-filter'){savedFilter=el.dataset.filter||'all';render();return}
  if(action==='refresh'){if(native){native.refresh();toast('최신 교재를 확인합니다')}return}
  if(action==='apply'){if(native)native.apply();return}
  if(action==='legacy'){if(native)native.openLegacy();return}
  if(action==='export'){
    const raw=JSON.stringify({app:'codingroadmap-live-v1',state},null,2);
    if(native)native.exportState(raw);return;
  }
  if(action==='import'){if(native)native.importState();else document.getElementById('import-file').click();return}
  if(action==='close'){document.getElementById('modal').close();return}
}
function copyFallback(value){
  const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'코드를 복사했습니다':'코드를 길게 눌러 복사하세요');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const action=el.dataset.action;
  const d=document.getElementById('modal');
  if(d.open&&action!=='close')d.close();
  doAction(action,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){searchQuery=e.target.value;document.getElementById('results').innerHTML=searchResults(searchQuery)}
  if(e.target.id==='note'){state.notes[chapters[current.c].pages[current.p].id]=e.target.value;persist()}
});
window.importProgress=raw=>{
  try{
    const data=JSON.parse(raw);
    if(data.app!=='codingroadmap-live-v1'||data.state?.schema!==1)throw Error();
    const s=data.state;
    if(!Array.isArray(s.bookmarks)||!Array.isArray(s.complete)||!s.notes||typeof s.notes!=='object')throw Error();
    state.bookmarks=[...new Set(state.bookmarks.concat(s.bookmarks.filter(x=>typeof x==='string')))];
    state.complete=[...new Set(state.complete.concat(s.complete.filter(x=>typeof x==='string')))];
    for(const [id,note] of Object.entries(s.notes)){
      if(typeof note!=='string')continue;
      if(state.notes[id]&&state.notes[id]!==note)state.notes[id]+='\n\n[가져온 메모]\n'+note;else state.notes[id]=note;
    }
    persist();render();toast('학습 기록을 복원했습니다');
  }catch(e){toast('이 앱의 올바른 백업 파일이 아닙니다')}
};
window.onUpdateStatus=s=>{updateStatus=s;if(route==='settings')render()};
if(typeof addEventListener==='function'){
  addEventListener('resize',()=>{if(route==='reader')setTimeout(layoutReader,40)});
  addEventListener('orientationchange',()=>{if(route==='reader')setTimeout(layoutReader,120)});
}
render();
</script>
</body>
