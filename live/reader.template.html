<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="app-schema" content="codingroadmap-live-v1">
<title>코딩 로드맵</title>
<style>
/* LIBRARY_REBUILD_V8 — clean rewrite, no legacy style layers */
:root{
  --ivory:#fbf8f1;
  --ivory2:#f4eee3;
  --paper:#fffdf8;
  --ink:#231d17;
  --muted:#8d8377;
  --hair:#e8ded0;
  --gold:#ad8247;
  --gold2:#d7ba84;
  --green:#718764;
  --reader:#17120e;
  --reader2:#211912;
  --readerInk:#f2e9dc;
  --readerMuted:#b9aa97;
  --readerHair:#403226;
  --readerGold:#d1a354;
  --navSafe:calc(28px + env(safe-area-inset-bottom));
  --readerBody:18px;
  --readerLine:1.68;
  --pagePad:clamp(22px,5vw,52px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--ivory);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{cursor:pointer}
.serif,.display-title,.section-title,.book-title,.track-name,.chapter-name,.reader-title,.reader-flow h1,.reader-flow h2,.reader-flow h3{font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif}
.screen{min-height:100dvh;background:
  radial-gradient(circle at 5% 0,#fffefb 0 15%,transparent 37%),
  linear-gradient(180deg,var(--ivory) 0%,#f8f3ea 100%)}
.shell{width:min(1180px,100%);margin:0 auto;padding:30px clamp(20px,4vw,46px) 150px}
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin:2px 0 28px}
.display-title{font-size:clamp(40px,5vw,62px);line-height:1.08;letter-spacing:-.055em;font-weight:600;margin:0 0 8px}
.home-sub{margin:0;color:var(--muted);font-size:16px}
.home-quote{font-family:Georgia,"Noto Serif KR",serif;color:#9b8a76;text-align:right;line-height:1.45;font-size:14px;padding-top:10px;white-space:nowrap}
.home-quote:after{content:"—";display:block;margin-top:3px}
.continue-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);overflow:hidden;min-height:270px;border:1px solid #eadfce;border-radius:24px;background:#f2e7d6;box-shadow:0 18px 45px #7a5d3512}
.continue-copy{padding:32px 34px;display:flex;flex-direction:column;justify-content:center}
.continue-kicker{font-size:31px;line-height:1.2;letter-spacing:-.045em;margin-bottom:8px}
.continue-lead{margin:0;color:#8f8172;font-family:Georgia,"Noto Serif KR",serif;font-size:16px;line-height:1.55}
.continue-rule{width:135px;height:1px;background:#d5c5ae;margin:15px 0}
.continue-meta{font-size:12px;letter-spacing:.07em;color:#8e806f;margin-bottom:5px}
.continue-title{font-family:Georgia,"Noto Serif KR",serif;font-size:25px;line-height:1.3;margin:0 0 14px}
.progress-row{display:flex;align-items:center;gap:11px;max-width:390px;margin-bottom:18px}
.progress-track{height:7px;flex:1;background:#ddd5c9;border-radius:99px;overflow:hidden}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,#b88a4b,#dfc282);border-radius:99px}
.progress-row b{font-size:13px;color:#5d5144;font-weight:600}
.pill-primary{border:0;border-radius:999px;background:linear-gradient(180deg,#bb8e50,#a77a3e);color:white;min-height:50px;padding:0 25px;align-self:flex-start;font-weight:700;letter-spacing:-.02em}
.still-life{position:relative;overflow:hidden;background:
  radial-gradient(circle at 76% 31%,#fff8dd 0 8%,transparent 9%),
  linear-gradient(128deg,#eee0cc 0 32%,#faf5eb 48%,#cbb28d 49%,#e5d4ba 100%)}
.still-life:before{content:"";position:absolute;right:12%;bottom:18%;width:132px;height:94px;border-radius:7px;background:linear-gradient(#f5f0e6,#d5c6b1);box-shadow:0 14px 24px #59442e26;transform:rotate(-2deg)}
.still-life:after{content:"GOOD CODE\A A KINDER\A TOMORROW";white-space:pre;position:absolute;right:16%;bottom:28%;font:500 12px/1.4 Georgia,serif;color:#75634d;text-align:center}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:34px 0 14px}
.section-title{font-size:30px;line-height:1.2;letter-spacing:-.045em;margin:0}
.section-caption{font-family:Georgia,"Noto Serif KR",serif;color:#9a8c7d;margin:4px 0 0;font-size:13px}
.section-link{border:0;background:transparent;color:#817567;padding:8px 0}
.book-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,220px);gap:20px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.book-rail::-webkit-scrollbar{display:none}
.book-item{border:0;background:transparent;padding:0;text-align:left;min-width:0;scroll-snap-align:start}
.book-cover{position:relative;height:250px;border:1px solid #d9cebd;border-radius:5px 14px 14px 5px;padding:21px 18px;overflow:hidden;box-shadow:8px 12px 24px #6f593a22,inset 7px 0 10px #00000009}
.book-cover:after{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:#ffffff95;box-shadow:4px 0 8px #614d3417}
.book-cover small{display:block;position:relative;z-index:1;font:500 10px Georgia,serif;letter-spacing:.08em;opacity:.75}
.book-cover strong{display:block;position:relative;z-index:1;font:600 23px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px;letter-spacing:-.04em}
.book-cover em{position:absolute;left:18px;bottom:18px;font:500 9px/1.3 Georgia,serif;letter-spacing:.11em;font-style:normal;opacity:.72}
.book-cover .cover-art{position:absolute;left:18px;right:18px;bottom:50px;height:75px;border-radius:2px;background:linear-gradient(180deg,#edcf9d 0 39%,#7f7760 40% 60%,#dbc080 61%)}
.tone1{background:#eee5d6}
.tone2{background:#315245;color:#f4eee3;border-color:#506d61}
.tone3{background:#e8deca}
.tone4{background:#353330;color:#f2eadc;border-color:#504b45}
.book-meta{padding:10px 5px 0}
.book-meta small{color:#9b8e7d;font-size:10px;letter-spacing:.07em}
.book-title{display:block;font-size:17px;line-height:1.3;margin:3px 0 7px}
.book-progress{display:flex;align-items:center;gap:8px}
.book-progress .bar{flex:1;height:6px;background:#e2dbcf;border-radius:99px;overflow:hidden}
.book-progress .bar i{display:block;height:100%;background:#b78a4b}
.book-progress span{font-size:11px;color:#8b7e6e;white-space:nowrap}
.library-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:28px;padding:18px 23px;border-radius:16px;background:#f1e8db;color:#8e7e69}
.library-banner .leaf{font-size:28px;color:#b58b51}
.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);min-height:92px;padding:7px max(18px,env(safe-area-inset-left)) var(--navSafe);background:#fffdf9f5;border-top:1px solid #e4dacd;backdrop-filter:blur(14px);box-shadow:0 -10px 32px #7e644014}
.bottom-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:#786d62;font-size:11px}
.bottom-nav button.active{color:#a87b3e;font-weight:700}
.nav-icon{width:24px;height:24px;display:block}
.top-row{display:flex;align-items:center;gap:14px;margin:4px 0 24px}
.back-btn{border:0;background:transparent;font-size:31px;padding:0 6px 0 0;min-width:44px;height:44px}
.track-name{font-size:clamp(24px,3vw,34px);line-height:1.2}
.track-hero{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:18px;border:1px solid #e9dece;border-radius:20px;background:#f2e8d8}
.track-mini{height:245px;border:1px solid #d9cdbb;border-radius:5px 12px 12px 5px;background:#eee4d5;padding:22px 18px;box-shadow:7px 10px 22px #745b3a1e}
.track-mini small{font:500 10px Georgia,serif;letter-spacing:.08em;color:#766856}
.track-mini strong{display:block;font:600 22px/1.28 Georgia,"Noto Serif KR",serif;margin-top:14px}
.track-mini .photo{height:85px;margin-top:20px;background:linear-gradient(180deg,#e8cb98 0 42%,#7e765f 43% 61%,#d7ba79 62%)}
.track-copy{padding:9px 10px 7px 0;display:flex;flex-direction:column;justify-content:center}
.track-headline{font-size:25px;line-height:1.4;margin-bottom:11px}
.track-desc{margin:0;color:#75695c;font-family:Georgia,"Noto Serif KR",serif;line-height:1.55}
.track-copy .pill-primary{align-self:flex-end;margin-top:17px}
.chapter-list{display:grid;gap:8px}
.chapter-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:13px;border:1px solid #e8dfd2;border-radius:14px;background:#fffdf8;padding:12px 14px;text-align:left;box-shadow:0 4px 13px #866c4b08}
.chapter-row.current{background:#f3e7d3}
.chapter-num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#f0e6d7;font-family:Georgia,serif;font-size:17px}
.chapter-row.current .chapter-num{background:#dfc59a}
.chapter-name{font-size:17px;line-height:1.25}
.chapter-sub{display:block;margin-top:4px;color:#978a7c;font-family:system-ui;font-size:11px}
.status-chip{border-radius:999px;background:#f1eee7;color:#877b6f;padding:7px 12px;font-size:11px;white-space:nowrap}
.status-chip.done{background:#edf2e9;color:#65805a}
.status-chip.reading{background:#fff8ed;color:#9f7338}
.saved-head{margin:8px 0 18px}
.saved-head h1{font-size:42px;line-height:1.1;margin:0}
.saved-head p{font-family:Georgia,"Noto Serif KR",serif;color:#9a8b79;margin:6px 0 0}
.chips{display:flex;gap:9px;margin:20px 0}
.chip{border:0;border-radius:999px;background:#f0e8dc;color:#6f6356;padding:10px 19px}
.chip.active{background:#ad8349;color:white}
.saved-list{display:grid;gap:13px}
.saved-card{display:grid;grid-template-columns:36px minmax(0,1fr) 150px;gap:15px;align-items:center;width:100%;border:1px solid #e8dfd2;border-radius:17px;background:#fffdf8;padding:13px 15px;text-align:left}
.saved-mark{align-self:start;width:30px;height:37px;border:1px solid #e6d9c6;border-radius:7px;background:#fff8ed;color:#ae8246;display:grid;place-items:center}
.saved-copy small{font-family:Georgia,"Noto Serif KR",serif;color:#3d352e;font-size:12px}
.saved-copy strong{display:block;font-family:Georgia,"Noto Serif KR",serif;font-size:19px;line-height:1.35;margin:5px 0}
.saved-copy p{margin:0;color:#8d8072;font-family:Georgia,"Noto Serif KR",serif;font-size:13px;line-height:1.45}
.saved-thumb{height:104px;border-radius:11px;background:linear-gradient(135deg,#e9d8ba 0,#f9f2e7 45%,#baa17d 46%,#e6d5b9 100%);position:relative;overflow:hidden}
.saved-thumb:after{content:"A NEW\A JOURNEY";white-space:pre;position:absolute;right:12px;bottom:10px;font:500 9px/1.3 Georgia,serif;color:#76634c}
.panel{border:1px solid #e8dfd2;border-radius:16px;background:#fffdf8;padding:18px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:18px}
.panel p{margin:0;color:#85796d}
.panel .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.small-btn{border:1px solid #ddd1c1;border-radius:10px;background:#fffaf2;padding:9px 12px}
.search-input,textarea{width:100%;border:1px solid #ddd2c3;border-radius:12px;background:#fffdf9;padding:13px 14px;color:var(--ink)}
.search-results{display:grid;gap:8px;margin-top:13px}
.result{border:1px solid #e6dccf;border-radius:13px;background:#fffdf8;padding:13px 14px;text-align:left}
.result small{display:block;color:#998b7a;font-size:10px}
.result strong{display:block;font-family:Georgia,"Noto Serif KR",serif;margin-top:4px}
.result p{margin:5px 0 0;color:#81766a;font-size:12px}
.empty{color:#958879;padding:24px 2px}
dialog{width:min(620px,calc(100% - 28px));max-height:82dvh;overflow:auto;border:1px solid #d9cebf;border-radius:18px;background:#fffaf2;color:var(--ink);padding:21px;box-shadow:0 22px 70px #0005}
dialog::backdrop{background:#0009}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-top h2{margin:0;font-family:Georgia,"Noto Serif KR",serif}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translateX(-50%);max-width:90vw;background:#2a2119;color:#f4ecdf;border:1px solid #584633;border-radius:10px;padding:10px 15px;font-size:13px;box-shadow:0 10px 35px #0006}

/* Reader — single visual language, no legacy overrides */
/* TITLE_TOP_PAGE_V2 — persistent large topic title above every physical swipe page */
/* SWIPE_TRACK_FOCUS_V1 — robust swipe, track remaining pages, rebuilt focus mode */
/* SWIPE_CONTENT_CODE_V2 — full-surface touch swipe and concrete code-first Track 2 explanations */
/* BOOK_SOURCES_V1 — chapter-end verified 2026 bestseller references */
/* TRACK_GLOBAL_SLIDES_V1 — footer numbering spans every physical slide in the current track */
/* UNIFIED_PAGE_TURN_V1 — forward/back/swipe/buttons all use the same whole-page transition */
/* ESSENTIAL_CONTENT_V1 — repeated study prompts removed; only subject content remains */
.reader-shell{height:100dvh;background:var(--reader);color:var(--readerInk);display:grid;grid-template-rows:58px minmax(0,1fr) auto;overflow:hidden}
.reader-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:7px;padding:6px 15px;background:#17120ef5;border-bottom:1px solid #2d241c}
.reader-top button{border:0;background:transparent;color:var(--readerInk);min-width:42px;height:42px;border-radius:10px}
.reader-heading{text-align:center;min-width:0}
.reader-heading strong{display:block;font:500 17px/1.2 Georgia,"Noto Serif KR",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-heading small{display:block;color:#9a8872;font:700 9px/1.2 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:.08em;margin-top:2px}
.reader-paper-wrap{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:var(--reader);touch-action:pan-y;overscroll-behavior-x:contain;opacity:1;transition:opacity 110ms ease-out}
.page-turning .reader-paper-wrap{opacity:.08}
.topic-header{width:min(880px,calc(100% - 88px));margin:0 auto;padding:0 0 6px;background:var(--reader);z-index:3}
.topic-title{margin:0 var(--pagePad) 8px;font:700 32px/1.18 Georgia,"Noto Serif KR","NanumMyeongjo",serif;letter-spacing:-.045em;color:var(--readerInk)}
.topic-header .section-marker{margin-bottom:0}
.reader-stage{position:relative;min-height:0;display:flex;justify-content:center;overflow:hidden;background:var(--reader);touch-action:pan-y;overscroll-behavior-x:contain}
.reader-paper{position:relative;width:min(880px,calc(100% - 88px));height:100%;overflow-x:hidden;overflow-y:hidden;background:var(--reader);scroll-behavior:auto;overscroll-behavior:none;touch-action:pan-y}
.reader-flow{height:auto;width:100%;column-count:1;column-gap:0;column-fill:auto;font-size:var(--readerBody);line-height:var(--readerLine);font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif;color:var(--readerInk);-webkit-text-size-adjust:none;text-size-adjust:none}
.lesson-section{
  --pagePad:0;
  display:block;
  padding:6px clamp(22px,5vw,52px) 0;
  break-inside:auto;
  -webkit-column-break-inside:auto;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone
}
.logical-anchor{display:block;width:0;height:0;overflow:hidden}
.reader-flow>*:not(.logical-anchor){margin-left:var(--pagePad);margin-right:var(--pagePad)}
.reader-flow>.code,.reader-flow>.diagram,.reader-flow>.callout,.reader-flow>.practice-box,.reader-flow>.question-box,.reader-flow>.summary-card,.reader-flow>details{width:auto}
.chapter-ribbon{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:42px;margin:0 var(--pagePad);padding:7px 12px;
  border-top:1px solid #6a5137;border-bottom:1px solid #6a5137;
  background:linear-gradient(90deg,#2c2117,#201812);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
}
.chapter-ribbon small{color:#c69a58;font-size:10px;font-weight:800;letter-spacing:.09em;white-space:nowrap}
.chapter-ribbon strong{font-family:Georgia,"Noto Serif KR","NanumMyeongjo",serif;color:#f1e6d6;font-size:18px;line-height:1.25;text-align:right}
.section-marker{
  display:flex;align-items:center;gap:7px;min-height:27px;
  margin:0 var(--pagePad) 12px;padding:2px 7px 2px 0;
  border-top:1px solid #473628;border-bottom:1px solid #2e241c;
  background:linear-gradient(90deg,#1e1711,#17120e 72%);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  break-after:auto;page-break-after:auto;
}
.section-marker:before{content:"";width:3px;height:19px;border-radius:2px;background:#a47b45;flex:0 0 auto}
.section-marker .kind{
  min-width:38px;padding:2px 7px;border-radius:999px;background:#4c351d;
  font-size:10px;font-weight:900;letter-spacing:.08em;color:#f0c77e;white-space:nowrap;text-align:center
}
.section-marker .hint{font-size:10px;font-weight:650;color:#a89783;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-marker.type-practice:before,.section-marker.type-check:before{background:#e0b263}
.section-marker.type-practice .kind,.section-marker.type-check .kind{background:#65451f;color:#ffd99a}
.section-marker.type-solution:before{background:#93a982}
.section-marker.type-solution .kind{background:#31412d;color:#bfd1b4}
.section-marker.type-summary:before{background:#b89a6c}
.section-marker.type-summary .kind{background:#51422e;color:#dfc79f}
.section-marker.type-glossary:before{background:#c69a58}
.section-marker.type-example:before{background:#c68a4e}
.section-marker.type-example .kind{background:#5a3d20;color:#f0c189}
.reader-flow .eyebrow{display:none}
.reader-flow .page-title{margin:0 0 10px;font-size:32px;line-height:1.18;letter-spacing:-.045em;font-weight:700;break-after:auto}
.reader-flow .practice-box,.reader-flow .question-box{border-color:#6a5031;background:#241a10}
.reader-flow .summary-card{border-color:#5f523d;background:#211b14}
.solution-banner{
  margin:0 var(--pagePad) 12px;padding:7px 10px;border-left:3px solid #93a982;
  background:linear-gradient(90deg,#1d2119,#171a15);color:#cbd8c2;
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  font-size:11px;font-weight:850;letter-spacing:.04em;
}

.reader-flow h1{margin:0 0 8px;font-size:34px;line-height:1.18;letter-spacing:-.045em;font-weight:600;break-after:auto}
.reader-flow h2{margin:0 0 7px;font-size:24px;line-height:1.28;break-after:auto}
.reader-flow h3{margin:0 0 5px;font-size:19px;line-height:1.35;break-after:auto}
.reader-flow p,.reader-flow .paragraph{font-size:var(--readerBody);line-height:var(--readerLine);padding:0;orphans:2;widows:2}
.reader-flow p{margin:0}
.reader-flow ul{margin:0;padding-left:24px}
.reader-flow li{margin:0;line-height:var(--readerLine);orphans:2;widows:2}
.reader-flow li+li{margin-top:5px}

.prose-stack{margin-top:0;margin-bottom:15px;break-inside:auto;-webkit-column-break-inside:auto}
.prose-stack .paragraph{color:#dfd5c8}
.prose-stack .lead-paragraph{
  margin:0 0 10px;padding:11px 14px 11px 15px;border-left:3px solid #9c7849;
  border-radius:0 10px 10px 0;background:linear-gradient(90deg,#241b14,#1b1511 74%);
  color:#f2e9dc;font-weight:520
}
.prose-stack .body-paragraph{margin:10px 0 0}
.prose-stack.type-practice .lead-paragraph,.prose-stack.type-check .lead-paragraph{border-left-color:#e0b263;background:linear-gradient(90deg,#2a2014,#1b1510)}
.prose-stack.type-example .lead-paragraph{border-left-color:#c68a4e;background:linear-gradient(90deg,#281c12,#1b1510)}
.prose-stack.type-summary .lead-paragraph{border-left-color:#b89a6c}
.prose-stack.type-visual .lead-paragraph{border-left-color:#8d9a76}

.block-kicker{
  margin:0 0 6px;color:#b99a70;font:850 10px/1.3 system-ui,-apple-system,"Noto Sans KR",sans-serif;
  letter-spacing:.09em
}
.keyword-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px;margin-bottom:14px}
.keyword-row .block-kicker{margin:0 2px 0 0}
.keyword-chip{
  display:inline-flex;align-items:center;min-height:28px;padding:3px 9px;border:1px solid #4a392c;
  border-radius:999px;background:#1f1813;color:#d8c9b7;
  font:700 11px/1.25 system-ui,-apple-system,"Noto Sans KR",sans-serif
}

.glossary-card{
  margin-top:10px;margin-bottom:12px;padding:12px 14px;border:1px solid #49382a;border-radius:12px;
  background:linear-gradient(145deg,#201812,#18130f);break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .glossary-term{display:block;margin:0 0 6px;font-size:20px;line-height:1.3;color:#f2e5d2}
.glossary-definition{margin:0 0 10px!important;color:#e1d6c8}
.glossary-meta{padding-top:9px;border-top:1px solid #3a2d23}
.glossary-meta p+p{margin-top:6px!important}
.reader-flow .glossary-label{
  display:inline;color:#c69a58;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  font-size:10px;font-weight:850;margin:0 6px 0 0!important;letter-spacing:.04em
}

.keypoints-card{
  margin-top:12px;margin-bottom:14px;padding:11px 14px 12px;border:1px solid #4b3b2f;border-radius:12px;

}
.keypoints-card ul{margin-top:2px}
.keypoints-card li{color:#e4d9cc}

.solution-prose{margin-top:0;margin-bottom:14px}
.solution-step{

  padding:10px 12px;border:1px solid #35422f;border-radius:11px;background:#181d16;

}
.solution-step+.solution-step{margin-top:9px}
.solution-step p{color:#dfE7d9}
.micro-label{
  display:inline-flex;justify-content:center;padding:3px 5px;border-radius:999px;background:#31412d;
  color:#bfd1b4;font:850 10px/1.25 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:.04em
}

.reader-flow .card,.reader-flow .callout,.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{
  -webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .card{border:0;border-top:1px solid #3a2d23;border-radius:0;background:transparent;padding:8px 0}
.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .summary-card{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:12px;background:#1e1712;padding:11px 14px
}
.reader-flow .practice-box h3,.reader-flow .question-box h3,.reader-flow .summary-card h3{color:#efd3a0}
.reader-flow .label{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#c69a58;font-size:10px;font-weight:700;margin:3px 0 1px}
.reader-flow .callout{
  margin-top:12px;margin-bottom:14px;border:1px solid #5a472f;border-radius:12px;
  background:linear-gradient(135deg,#2b2117,#211912);padding:11px 14px;break-inside:auto
}
.reader-flow .callout-title{font-weight:800;color:#e2bd7b;margin-bottom:4px}
.reader-flow .goal{
  margin-top:12px;margin-bottom:14px;border-left:3px solid var(--readerGold);
  padding:8px 0 8px 12px;color:#d6c7b3;background:linear-gradient(90deg,#241b13aa,transparent)
}

.reader-flow .code{
  margin-top:12px;margin-bottom:14px;border:1px solid #4a392d;border-radius:11px;overflow:visible;
  background:#100d0b;-webkit-box-decoration-break:clone;box-decoration-break:clone;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .code-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;
  background:#1e1712;color:#bfae99;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:11px
}
.reader-flow .copy-btn{border:0;background:transparent;color:#d7c4aa;padding:3px 5px}
.reader-flow pre{
  margin:0;padding:10px 12px;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;
  font:15px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace;color:#ece4d8;orphans:2;widows:2
}
.reader-flow .code-output{
  border-top:1px solid #382c22;padding:8px 12px;white-space:pre-wrap;
  font:15px/1.58 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcae9b
}
.code-explain{
  margin:-4px 0 14px;padding:11px 13px;border:1px solid #3f352b;border-radius:11px;background:#181511;
  break-inside:auto;-webkit-column-break-inside:auto
}
.code-explain h3{margin:0 0 8px!important;color:#e7d7c3;font-size:16px!important}
.code-explain ol{margin:0;padding-left:23px}
.code-explain li{margin:0;color:#d9cdbf;font-size:15px;line-height:1.58}
.code-explain li+li{margin-top:6px}
.code-trace{
  margin:0 0 16px;padding:10px 0 0;border-top:1px solid #3b3027
}
.code-trace h3{margin:0 0 7px!important;color:#d8c7b3;font-size:16px!important}
.code-trace p{margin:0!important;color:#d2c5b7}
.code-trace p+p{margin-top:7px!important}

.reader-flow .diagram{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:11px;
  overflow:visible;break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow .diagram-row{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:8px 11px;border-bottom:1px solid #34291f}
.reader-flow .diagram-row:last-child{border-bottom:0}
.reader-flow .diagram-key{color:#d3a45b;font-weight:800}

.extra-card{
  margin-top:11px;margin-bottom:13px;padding:10px 13px 11px;border-top:1px solid #49382b;border-bottom:1px solid #2d241d;
  background:linear-gradient(90deg,#1c1612,#18130f);break-inside:auto;-webkit-column-break-inside:auto
}
.extra-card h3{margin:0 0 5px!important;color:#e8dccd}
.extra-card p{color:#d4c7b7}

.reader-flow details{
  margin-top:12px;margin-bottom:14px;border:1px solid #49392c;border-radius:11px;padding:10px 13px;
  break-inside:auto;-webkit-column-break-inside:auto
}
.reader-flow summary{cursor:pointer;color:#d8b272;font-weight:700}
.chapter-references{margin:14px 0 0;padding:12px 0 0;border-top:1px solid #3d3228}
.chapter-references h3{margin:0 0 8px!important;font-size:16px!important;color:#d7c5ae}
.chapter-references ol{margin:0;padding-left:22px}
.chapter-references li{margin:0;color:#bfae9a;font-size:13px;line-height:1.55}
.chapter-references li+li{margin-top:7px}
.chapter-references strong{color:#e0d2c0;font-weight:700}
.reader-flow .chapter-end{margin-top:16px;border-top:1px solid #49382b;padding-top:12px}
.reader-flow .chapter-end .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.reader-flow .reader-action{border:1px solid #5b4632;border-radius:10px;background:#231a13;color:#eadfce;padding:7px 10px}
@media(max-width:520px){
  .solution-step{grid-template-columns:42px minmax(0,1fr);gap:8px;padding:9px 10px}
  .prose-stack .lead-paragraph{padding:10px 11px 10px 12px}
  .glossary-card,.keypoints-card,.reader-flow .practice-box,.reader-flow .question-box,.reader-flow .callout{padding-left:11px;padding-right:11px}
}
.edge-zone{position:absolute;top:0;bottom:0;z-index:15;width:clamp(44px,7vw,86px);border:0;background:transparent}
.edge-prev{left:0}.edge-next{right:0}
.reader-bottom{display:grid;grid-template-columns:auto minmax(150px,1fr) auto auto;align-items:center;gap:10px;min-height:92px;padding:7px 18px var(--navSafe);background:#17120ef5;border-top:1px solid #33281f}
.reader-bottom button{border:1px solid #51402f;background:#1a140f;color:#eadfce}
.circle-btn{width:48px;height:48px;border-radius:50%;font-size:29px;line-height:1;padding:0}
.focus-btn{min-height:42px;border-radius:13px!important;padding:0 12px;font-size:11px}
.reader-page-info{text-align:center;color:#c9baa7;font:500 12px Georgia,"Noto Serif KR",serif}
.reader-progress{height:5px;max-width:240px;margin:6px auto 0;background:#3b3027;border-radius:99px;overflow:hidden}
.reader-progress i{display:block;height:100%;background:var(--readerGold);border-radius:99px}
.focus-exit,.focus-hud{display:none}
.reader-shell.focus{grid-template-rows:minmax(0,1fr)}
.reader-shell.focus .reader-top,.reader-shell.focus .reader-bottom{display:none}
.reader-shell.focus .reader-paper,.reader-shell.focus .topic-header{width:min(960px,calc(100% - 44px))}
.reader-shell.focus .topic-title{padding-right:0}
.reader-shell.focus .focus-exit{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;border:1px solid #574634;border-radius:999px;background:#19130ed9;color:#e7dccd;padding:9px 13px;font-size:11px;backdrop-filter:blur(8px)}
.reader-shell.focus .focus-hud{display:block;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;max-width:calc(100vw - 180px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid #423427;border-radius:999px;background:#17120ecb;color:#b9a995;padding:7px 12px;font:700 10px/1 system-ui,-apple-system,"Noto Sans KR",sans-serif;backdrop-filter:blur(8px)}
@media(min-width:900px){
  .book-rail{grid-auto-columns:minmax(185px,230px)}
  .reader-paper,.topic-header{width:min(800px,calc(100% - 180px))}
  .reader-flow h1{font-size:36px}
}
@media(max-width:720px){
  .shell{padding:24px 18px 145px}
  .home-head{margin-bottom:22px}
  .display-title{font-size:42px}
  .home-quote{font-size:12px}
  .continue-card{grid-template-columns:1fr}
  .still-life{height:148px;order:-1}
  .continue-copy{padding:22px 24px}
  .continue-kicker{font-size:27px}
  .book-rail{grid-auto-columns:minmax(154px,184px);gap:14px}
  .book-cover{height:222px}
  .track-hero{grid-template-columns:112px 1fr;gap:16px}
  .track-mini{height:188px;padding:16px 12px}
  .track-mini strong{font-size:17px}
  .track-mini .photo{height:56px}
  .track-headline{font-size:20px}
  .track-desc{font-size:12px}
  .saved-card{grid-template-columns:32px minmax(0,1fr) 108px;gap:10px}
  .saved-thumb{height:90px}
  .saved-copy strong{font-size:16px}
  .reader-paper,.topic-header{width:calc(100% - 54px)}
  .reader-top{grid-template-columns:auto minmax(0,1fr) auto auto}
  .reader-top .note-top{display:none}
  .reader-flow h1{font-size:32px}
  .reader-bottom{grid-template-columns:auto minmax(100px,1fr) auto}
}

/* COZY_EDITORIAL_2026_V1 — warm, dimensional, soft editorial UI */
:root{
  --ivory:#fff8f4;
  --ivory2:#f7eee9;
  --paper:#fffdfb;
  --ink:#4b3937;
  --muted:#907a77;
  --hair:#eadad4;
  --gold:#c38e7e;
  --gold2:#e2b9a8;
  --green:#9daf97;
  --rose:#dda8a9;
  --rose2:#f2d1ca;
  --peach:#f2c6aa;
  --sage:#b8c5ad;
  --lav:#cec3da;
  --butter:#e9d9a7;
  --cocoa:#6b504c;
  --reader:#2d2524;
  --reader2:#382d2b;
  --readerInk:#fff6ef;
  --readerMuted:#d7c2b9;
  --readerHair:#594541;
  --readerGold:#e0b39c;
}
html,body{
  background:#fff8f4;
  color:var(--ink);
  font-family:ui-rounded,"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;
}
.serif,.display-title,.section-title,.book-title,.track-name,.chapter-name,.reader-title,.reader-flow h1,.reader-flow h2,.reader-flow h3,.continue-kicker,.track-headline{
  font-family:"Noto Serif KR","NanumMyeongjo","Apple SD Gothic Neo",serif;
}
.screen{
  background:
    radial-gradient(circle at 92% 2%,#f8ddda 0 9%,transparent 29%),
    radial-gradient(circle at 3% 22%,#f5e5c8 0 8%,transparent 25%),
    radial-gradient(circle at 88% 55%,#e5eadc 0 8%,transparent 26%),
    linear-gradient(180deg,#fffaf7 0%,#fff6f1 52%,#f9f1ec 100%);
}
.shell{padding-top:34px}
.home-head{align-items:center;margin-bottom:30px}
.display-title{
  font-size:clamp(42px,6vw,66px);
  line-height:1.04;
  font-weight:800;
  color:#5a403e;
  letter-spacing:-.06em;
}
.home-sub{font-size:15px;color:#9a7e79}
.home-quote{
  padding:13px 17px;
  border:1px solid #efdeda;
  border-radius:22px;
  background:#ffffffa8;
  box-shadow:0 10px 30px #7d51451a;
  color:#a47d77;
}
.continue-card{
  border:1px solid #f0ddd6;
  border-radius:34px;
  min-height:284px;
  background:
    linear-gradient(135deg,#fff9f6 0%,#f9e6df 54%,#f1ddcf 100%);
  box-shadow:0 28px 70px #815b4c1f,0 4px 14px #9d75621a;
  overflow:hidden;
}
.continue-copy{padding:36px 38px}
.continue-kicker{color:#654846;font-size:32px;font-weight:800}
.continue-lead{color:#9b7d77}
.continue-rule{background:linear-gradient(90deg,#d49e91,transparent);height:2px}
.continue-meta{color:#b07f77;font-weight:800}
.continue-title{color:#58413f;font-size:26px;font-weight:750}
.pill-primary{
  min-height:52px;
  padding:0 26px;
  border-radius:18px;
  background:linear-gradient(135deg,#c98f86,#b87975);
  color:#fffaf8;
  box-shadow:0 12px 26px #9e696140, inset 0 1px #ffffff70;
  border:1px solid #ffffff66;
}
.pill-primary:active{transform:translateY(1px);box-shadow:0 6px 14px #9e696130}
.still-life{
  background:
    radial-gradient(circle at 68% 25%,#fff7df 0 8%,transparent 9%),
    radial-gradient(ellipse at 24% 80%,#d9c7d9 0 15%,transparent 16%),
    radial-gradient(ellipse at 78% 84%,#bfcbb1 0 18%,transparent 19%),
    linear-gradient(145deg,#f6d8cd,#f9eee5 48%,#e7cfbe 49%,#f3e7dc);
}
.still-life:before{
  width:145px;height:105px;border-radius:18px;
  background:linear-gradient(160deg,#fffdf8,#eadbd3);
  box-shadow:0 18px 35px #6d49342b;
  transform:rotate(-5deg);
}
.still-life:after{color:#9d7771;font-family:"Noto Serif KR",serif;letter-spacing:.08em}
.section-title{font-size:29px;font-weight:800;color:#604745}
.section-caption{color:#a88c86}
.section-link{color:#b07872;font-weight:750}
.book-rail{
  gap:18px;
  padding:8px 8px 20px;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
.cozy-track-rail{grid-auto-columns:minmax(170px,214px)}
.library-track-rail{grid-auto-columns:minmax(190px,230px);overflow-x:auto}
.book-item{scroll-snap-align:center;transition:transform .22s ease,filter .22s ease}
.book-item:active{transform:scale(.975)}
.book-cover{
  height:252px;
  border:1px solid #ffffffa0;
  border-radius:26px 30px 30px 14px;
  box-shadow:0 20px 38px #76534625, inset 0 1px #ffffff8a;
  padding:23px 20px;
}
.book-cover:after{
  content:"";
  position:absolute;inset:8px;
  border:1px solid #ffffff59;border-radius:20px 24px 24px 10px;
  pointer-events:none;
}
.book-cover.tone1{background:linear-gradient(155deg,#edc5bd,#d69b9a)}
.book-cover.tone2{background:linear-gradient(155deg,#d9d0e7,#b7aacb)}
.book-cover.tone3{background:linear-gradient(155deg,#d7dfc8,#aebd9d)}
.book-cover.tone4{background:linear-gradient(155deg,#f0d5b6,#d8ae8c)}
.book-cover strong{color:#fffdfb;text-shadow:0 2px 10px #5f3c3650}
.book-cover small,.book-cover em{color:#fffaf4}
.book-meta{padding:12px 6px 0}
.book-title{font-size:18px;font-weight:800;color:#604744}
.book-progress .bar,.progress-track{background:#ecdfda}
.book-progress .bar i,.progress-track i{background:linear-gradient(90deg,#d79d93,#b9abca,#aebb9f)}
.library-banner{
  border:1px solid #ebd9d2;
  border-radius:28px;
  background:linear-gradient(135deg,#fff9f5,#f3e5df);
  box-shadow:0 18px 44px #76514316;
  color:#765a56;
}
.bottom-nav{
  left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 28px));
  transform:translateX(-50%);
  border:1px solid #ead8d2;
  border-radius:24px;
  background:#fffaf7e8;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 48px #6b483b26;
  overflow:hidden;
}
.bottom-nav button{color:#9b817c;border-radius:18px;margin:7px 4px;padding:9px 8px}
.bottom-nav button.active{color:#9b625f;background:linear-gradient(180deg,#f6ded9,#f3ebe5);font-weight:800}
.top-row{min-height:56px;align-items:center}
.back-btn{
  width:44px;height:44px;border-radius:16px;
  border:1px solid #ecdcd6;background:#fffaf7;
  box-shadow:0 8px 20px #78524814;
}
.track-name{color:#755651;font-weight:800}
.track-screen{overflow:hidden}
.track-shell{animation:trackFade .24s ease both}
.track-shell.slide-from-right{animation:trackInRight .28s cubic-bezier(.2,.75,.25,1) both}
.track-shell.slide-from-left{animation:trackInLeft .28s cubic-bezier(.2,.75,.25,1) both}
@keyframes trackFade{from{opacity:.6}to{opacity:1}}
@keyframes trackInRight{from{opacity:.45;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes trackInLeft{from{opacity:.45;transform:translateX(-46px)}to{opacity:1;transform:none}}
.track-swipe-surface{touch-action:pan-y;min-height:calc(100dvh - 180px)}
.track-swipe-hint{margin-left:auto;font-size:11px;color:#b69b94;background:#fff8f5;border:1px solid #efddd7;border-radius:99px;padding:7px 10px}
.track-dots{display:flex;justify-content:center;gap:7px;margin:0 0 15px}
.track-dot{width:7px;height:7px;border:0;border-radius:99px;padding:0;background:#dbc9c4;transition:.2s}
.track-dot.active{width:24px;background:#c68c84}
.track-hero{
  border:1px solid #eeddd7;
  border-radius:32px;
  background:linear-gradient(140deg,#fffaf7,#f5e5df);
  box-shadow:0 24px 58px #76504519;
  padding:24px;
}
.track-mini{
  border-radius:22px;
  border:1px solid #ffffff90;
  background:linear-gradient(155deg,#d7a19c,#bea9c8);
  box-shadow:0 16px 30px #75514928;
}
.track-copy{padding:6px 4px}
.track-headline{color:#5b4240;font-weight:800}
.track-desc{color:#957b76}
.chapter-list{display:grid;gap:12px}
.chapter-row{
  border:1px solid #ecddd8;
  border-radius:22px;
  background:#fffcfae8;
  box-shadow:0 9px 24px #72504410;
  min-height:82px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.chapter-row:active{transform:scale(.988)}
.chapter-row.current{
  border-color:#deb1a9;
  background:linear-gradient(135deg,#fff6f2,#f7e1dc);
  box-shadow:0 14px 30px #9b6c611b;
}
.chapter-num{
  background:#f3ded8;color:#a46864;border-radius:14px;
  font-weight:850;
}
.status-chip.reading{background:#f1d8d4;color:#9d625e}
.status-chip.done{background:#dfe8d7;color:#6f8066}
.swipe-caption{text-align:center;color:#b19791;font-size:12px;margin:8px 0 16px}

.reader-heading strong,.topic-title{color:#fff7f0}
.reader-heading small{color:#d6aaa0}
.topic-title{font-weight:800;letter-spacing:-.04em}
.chapter-ribbon{

  background:linear-gradient(90deg,#44312e,#2f2524);

.section-marker{background:linear-gradient(90deg,#382a28,#2d2524 78%);border-color:#5a4440}

.reader-flow p{color:#f5e8e1}

@media(max-width:720px){

  .display-title{font-size:44px}
  .continue-card{border-radius:28px}

  .track-swipe-hint{display:none}

<body>
<div id="app"></div>
<dialog id="modal"></dialog>
<div id="toast" class="toast" hidden></div>
<script id="course" type="application/json">__COURSE_JSON__</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course').textContent);
const chapters=COURSE.chapters;
const native=window.RoadmapNative;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const defaults={schema:1,version:4,location:chapters[0].pages[0].id,bookmarks:[],notes:{},complete:[],visited:[],readerPositions:{},readerDark:false,readerFont:18,practiceCode:{},migrated:false};
let state;
try{state=JSON.parse(native?native.getState():localStorage.getItem('codingroadmap-live-state')||'{}')}catch(e){state={}}
state=Object.assign({},defaults,state);
for(const k of ['bookmarks','complete','visited'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.notes||typeof state.notes!=='object'||Array.isArray(state.notes))state.notes={};
if(!state.readerPositions||typeof state.readerPositions!=='object'||Array.isArray(state.readerPositions))state.readerPositions={};
if(!state.practiceCode||typeof state.practiceCode!=='object'||Array.isArray(state.practiceCode))state.practiceCode={};
state.readerDark=!!state.readerDark;
state.readerFont=Math.max(15,Math.min(24,Number(state.readerFont)||18));
let route='home';
let current=locate(state.location)||{c:0,p:0};
let selectedTrack=chapters[current.c].track;
let focus=false;
let searchQuery='';
let savedFilter='all';
let updateStatus=native?native.getStatus():'저장된 교재';
let toastTimer;
let physicalPage=0;
let physicalPages=1;
let pendingTargetId=state.location;
let pendingLast=false;
let pendingPhysicalRatio=null;
let pendingSavedPosition=null;
let pageTurnActive=false;
let trackTransitionDir=0;
let readerMenuOpen=false;
let practiceOutput='';
let practiceError='';
let practiceRunning=false;
let pyodidePromise=null;
let trackSlideMap={track:null,key:'',entries:[],byId:{},total:1,ready:false};
let previewRoute='';
try{if(typeof location!=='undefined')previewRoute=new URLSearchParams(location.search).get('preview')||''}catch(e){}

function locate(id){
  for(let c=0;c<chapters.length;c++){
    const p=chapters[c].pages.findIndex(x=>x.id===id);
    if(p>=0)return {c,p};
  }
  return null;
}
function beginPageTurn(){
  pageTurnActive=true;
  if(document.body&&document.body.classList&&typeof document.body.classList.add==='function')document.body.classList.add('page-turning');
}
function finishPageTurn(){
  if(!pageTurnActive)return;
  const done=()=>{
    if(document.body&&document.body.classList&&typeof document.body.classList.remove==='function')document.body.classList.remove('page-turning');
    pageTurnActive=false;
  };
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(done);
  else done();
}
function persist(){
  try{
    const raw=JSON.stringify(state);
    if(native)native.saveState(raw);else localStorage.setItem('codingroadmap-live-state',raw);
  }catch(e){toast('학습 기록을 저장하지 못했습니다')}
}
/* EXACT_READER_RESUME_V1 — logical page + physical slide are persisted together */
function readerPositionKey(cIndex){
  const chapter=chapters[cIndex];
  return chapter?chapter.id:'';
}
function saveReaderPosition(){
  if(route!=='reader'||!chapters[current.c])return;
  const key=readerPositionKey(current.c);
  if(!key)return;
  state.readerPositions[key]={
    logicalId:state.location,
    physical:Math.max(0,Number(physicalPage)||0),
    total:Math.max(1,Number(physicalPages)||1),
    ratio:physicalPages>1?Math.max(0,Math.min(1,physicalPage/(physicalPages-1))):0
  };
  persist();
}
function savedReaderPosition(cIndex){
  const key=readerPositionKey(cIndex);
  const saved=key&&state.readerPositions?state.readerPositions[key]:null;
  if(!saved||typeof saved!=='object')return null;
  return saved;
}
function leaveReader(){
  if(route==='reader')saveReaderPosition();
}
function migrate(){
  if(state.migrated)return;
  try{
    const old=native?JSON.parse(native.getLegacy()||'{}'):{};
    state.legacy=old;
    if(Object.keys(old).length){
      const c=(Number(old.current_track)||0)*8+(Number(old.current_chapter)||0);
      const chapter=chapters[c];
      if(chapter){
        const id=chapter.id+'-p'+((Number(old.current_page)||0)+1);
        state.location=locate(id)?id:chapter.pages[0].id;
        current=locate(state.location)||current;
      }
    }
  }catch(e){}
  state.migrated=true;
  persist();
}
migrate();

function toast(message){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.hidden=true,2400);
}
function navSvg(type){
  const common='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="nav-icon" aria-hidden="true"';
  if(type==='home')return '<svg '+common+'><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>';
  if(type==='track')return '<svg '+common+'><path d="M5 4h14v4H5z"/><path d="M5 10h14v4H5z"/><path d="M5 16h14v4H5z"/></svg>';
  if(type==='read')return '<svg '+common+'><path d="M4 5.5c2.9-.6 5.6.1 8 2v11c-2.4-1.9-5.1-2.6-8-2z"/><path d="M20 5.5c-2.9-.6-5.6.1-8 2v11c2.4-1.9 5.1-2.6 8-2z"/></svg>';
  if(type==='practice')return '<svg '+common+'><path d="m8 9-4 3 4 3"/><path d="m16 9 4 3-4 3"/><path d="m14 5-4 14"/></svg>';
  return '<svg '+common+'><circle cx="12" cy="8" r="3"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/></svg>';
}
function bottomNav(){
  const item=(action,label,type,active)=>'<button class="'+(active?'active':'')+'" data-action="'+action+'">'+navSvg(type)+'<span>'+label+'</span></button>';
  return '<nav class="bottom-nav editorial-nav">'+
    item('home','홈','home',route==='home')+
    item('track-current','트랙','track',route==='track'||route==='books')+
    item('continue','읽기','read',route==='reader')+
    item('practice','실습','practice',route==='practice')+
    item('settings','마이','settings',route==='settings')+
    '</nav>';
}
function trackPageIds(id){
  return chapters.filter(c=>c.track===id).flatMap(c=>c.pages.map(p=>p.id));
}
function trackStats(id){
  const ids=trackPageIds(id);
  const visited=new Set(state.visited);
  const read=ids.filter(pageId=>visited.has(pageId)).length;
  return {total:ids.length,read,remaining:Math.max(0,ids.length-read)};
}
function progressForTrack(id){
  const stats=trackStats(id);
  if(!stats.total)return 0;
  return Math.round(100*stats.read/stats.total);
}
function trackLogicalPages(trackId){
  const out=[];
  chapters.forEach((c,ci)=>{
    if(c.track!==trackId)return;
    c.pages.forEach((p,pi)=>out.push({c,ci,p,pi}));
  });
  return out;
}
function rebuildTrackSlideMap(trackId,paperWidth,wrapHeight){
  const key=[COURSE.version,trackId,Math.round(paperWidth),Math.round(wrapHeight),focus?'focus':'normal'].join(':');
  if(trackSlideMap.ready&&trackSlideMap.key===key)return;

  const items=trackLogicalPages(trackId);
  const host=document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.position='fixed';
  host.style.left='-20000px';
  host.style.top='0';
  host.style.width=paperWidth+'px';
  host.style.height=wrapHeight+'px';
  host.style.visibility='hidden';
  host.style.pointerEvents='none';
  host.style.overflow='hidden';
  host.style.zIndex='-1';
  document.body.appendChild(host);

  const entries=[],byId={};
  let start=0;
  for(const item of items){
    const p=item.p,c=item.c;
    host.innerHTML='<div class="topic-header"><h1 class="topic-title">'+esc(p.title)+'</h1><div class="section-marker type-'+esc(p.kind)+'"><span class="kind">'+esc(kindLabel(p.kind))+'</span><span class="hint">'+esc(sectionHint(p))+'</span></div></div><article class="reader-paper"><div class="reader-flow">'+lessonSection(p,c,item.pi)+'</div></article>';
    const topic=host.querySelector('.topic-header');
    const measurePaper=host.querySelector('.reader-paper');
    const measureFlow=host.querySelector('.reader-flow');
    topic.style.width=paperWidth+'px';
    topic.style.margin='0';
    const topicHeight=Math.ceil(topic.getBoundingClientRect().height);
    const bodyHeight=Math.max(120,wrapHeight-topicHeight);
    measurePaper.style.width=paperWidth+'px';
    measurePaper.style.height=bodyHeight+'px';
    measurePaper.style.overflow='hidden';
    measureFlow.style.width=paperWidth+'px';
    measureFlow.style.height=bodyHeight+'px';
    measureFlow.style.columnCount='auto';
    measureFlow.style.columnWidth=paperWidth+'px';
    measureFlow.style.columnGap='0px';
    measureFlow.style.columnFill='auto';
    const count=Math.max(1,Math.ceil(Math.max(measureFlow.scrollWidth,paperWidth)/paperWidth-.001));
    const entry={id:p.id,count,start};
    entries.push(entry);
    byId[p.id]=entry;
    start+=count;
  }
  host.remove();
  trackSlideMap={track:trackId,key,entries,byId,total:Math.max(1,start),ready:true};
}
function reconcileCurrentTrackSlideCount(){
  if(!trackSlideMap.ready)return;
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.byId[id];
  if(!entry||entry.count===physicalPages)return;
  const diff=physicalPages-entry.count;
  entry.count=physicalPages;
  let passed=false;
  for(const x of trackSlideMap.entries){
    if(x.id===id){passed=true;continue}
    if(passed)x.start+=diff;
  }
  trackSlideMap.total=Math.max(1,trackSlideMap.total+diff);
}
function currentTrackSlidePosition(){
  const id=chapters[current.c]?.pages[current.p]?.id;
  const entry=trackSlideMap.ready?trackSlideMap.byId[id]:null;
  if(!entry){
    const ids=trackPageIds(chapters[current.c].track);
    const logical=Math.max(0,ids.indexOf(id));
    return {current:logical+1,total:Math.max(1,ids.length)};
  }
  return {
    current:Math.max(1,Math.min(trackSlideMap.total,entry.start+physicalPage+1)),
    total:trackSlideMap.total
  };
}

function highlightPythonLine(line){
  let out='',i=0;
  const keywords=new Set(['def','return','if','elif','else','for','while','in','not','and','or','True','False','None','try','except','finally','raise','break','continue','import','from','as','class','with','lambda']);
  const escChar=c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c);
  while(i<line.length){
    const ch=line[i];
    if(ch==='#'){out+='<span class="tok-comment">'+esc(line.slice(i))+'</span>';break}
    if(ch==='"'||ch==="'"){
      const q=ch;let j=i+1;
      while(j<line.length){if(line[j]==='\\'){j+=2;continue}if(line[j]===q){j++;break}j++}
      out+='<span class="tok-string">'+esc(line.slice(i,j))+'</span>';i=j;continue;
    }
    if(/[0-9]/.test(ch)){
      let j=i+1;while(j<line.length&&/[0-9._]/.test(line[j]))j++;
      out+='<span class="tok-number">'+esc(line.slice(i,j))+'</span>';i=j;continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      let j=i+1;while(j<line.length&&/[A-Za-z0-9_]/.test(line[j]))j++;
      const word=line.slice(i,j);
      out+=(keywords.has(word)?'<span class="tok-keyword">'+word+'</span>':esc(word));i=j;continue;
    }
    out+=escChar(ch);i++;
  }
  return out||' ';
}

function ensurePyodide(){
  if(pyodidePromise)return pyodidePromise;
  pyodidePromise=new Promise((resolve,reject)=>{
    if(window.loadPyodide){resolve();return}
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';
    sc.onload=resolve;sc.onerror=()=>reject(new Error('Python 실행 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'));
    document.head.appendChild(sc);
  }).then(()=>window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'}));
  return pyodidePromise;
}

function physicalForId(id){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelector||!paper.getBoundingClientRect)return 0;
  const sec=flow.querySelector('.logical-anchor[data-page-id="'+String(id).replace(/"/g,'\\"')+'"]');
  if(!sec||!sec.getClientRects)return 0;
  const pr=paper.getBoundingClientRect();
  let left=Infinity;
  for(const rect of sec.getClientRects())left=Math.min(left,rect.left-pr.left+paper.scrollLeft);
  return Number.isFinite(left)?Math.max(0,Math.min(physicalPages-1,Math.floor(left/Math.max(paper.clientWidth,1)+.001))):0;
}
function syncLogical(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!flow.querySelectorAll||!paper.getBoundingClientRect||!paper.clientWidth)return;
  const pr=paper.getBoundingClientRect();
  const topBand=Math.min(150,Math.max(86,paper.clientHeight*.16));
  let previous=null,nearTop=null,nearTopY=-Infinity;
  for(const anchor of flow.querySelectorAll('.logical-anchor')){
    if(!anchor.getClientRects)continue;
    const rects=anchor.getClientRects();
    if(!rects||!rects.length)continue;
    const rect=rects[0];
    const left=rect.left-pr.left+paper.scrollLeft;
    const page=Math.max(0,Math.floor(left/Math.max(paper.clientWidth,1)+.001));
    const y=rect.top-pr.top;
    const idx=Number(anchor.dataset.pageIndex);
    if(!Number.isFinite(idx))continue;
    if(page<physicalPage||(page===physicalPage&&y<=0)){
      previous={anchor,idx,page,y};
    }else if(page===physicalPage&&y<=topBand&&y>=nearTopY){
      nearTop={anchor,idx,page,y};
      nearTopY=y;
    }
  }
  const best=nearTop||previous;
  if(!best)return;
  const idx=best.idx;
  if(idx>=0&&idx<chapters[current.c].pages.length){
    current.p=idx;
    state.location=chapters[current.c].pages[idx].id;
    if(!state.visited.includes(state.location))state.visited.push(state.location);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');
    if(star)star.textContent=state.bookmarks.includes(state.location)?'★':'☆';
  }
}

function layoutReader(){
  const paper=document.getElementById('paper'),flow=document.getElementById('flow');
  if(!paper||!flow||!paper.clientWidth||!paper.clientHeight)return;
  const w=paper.clientWidth,h=paper.clientHeight;
  flow.style.width=w+'px';
  flow.style.height=h+'px';
  flow.style.columnCount='auto';
  flow.style.columnWidth=w+'px';
  flow.style.columnGap='0px';
  flow.style.columnFill='auto';
  paper.scrollLeft=0;
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{
    physicalPages=Math.max(1,Math.ceil(Math.max(flow.scrollWidth,w)/w-.001));
    if(pendingPhysicalRatio!==null){
      physicalPage=Math.max(0,Math.min(physicalPages-1,Math.round(pendingPhysicalRatio*Math.max(physicalPages-1,0))));
      pendingPhysicalRatio=null;
    }else if(pendingSavedPosition){
      const saved=pendingSavedPosition;
      const sameLayout=Number(saved.total)===physicalPages;
      const exact=sameLayout?Number(saved.physical):Math.round((Number(saved.ratio)||0)*Math.max(physicalPages-1,0));
      physicalPage=Math.max(0,Math.min(physicalPages-1,Number.isFinite(exact)?exact:physicalForId(pendingTargetId||state.location)));
      pendingSavedPosition=null;
    }else{
      physicalPage=pendingLast?physicalPages-1:physicalForId(pendingTargetId||state.location);
    }
    pendingLast=false;
    pendingTargetId='';
    paper.scrollLeft=physicalPage*w;
    const wrap=document.querySelector('.reader-paper-wrap');
    if(wrap){
      rebuildTrackSlideMap(chapters[current.c].track,w,wrap.clientHeight);

    }catch(e){}

function changePhysical(delta){
  const paper=document.getElementById('paper');
  beginPageTurn();
  if(!paper||!paper.clientWidth){

function installReaderGestures(){
  const surface=document.querySelector('.reader-paper-wrap');
  const paper=document.getElementById('paper');
  if(!surface||!paper||!surface.addEventListener)return;

  let start=null,drag=false,startScroll=0,touchRunning=false,lastFinish=0;
  const blocked=el=>el&&el.closest&&el.closest('input,textarea,select,a,summary,details,.copy-btn,.reader-action,.focus-exit,.circle-btn,.focus-btn');

  function begin(x,y,target,source){
    if(blocked(target))return false;
    start={x,y,t:Date.now(),source};
    startScroll=paper.scrollLeft;
    drag=false;

  }
  function move(x,y,event){
    if(!start)return;
    const dx=x-start.x,dy=y-start.y;

      if(Math.abs(dx)<6)return;

  }

    const normalThreshold=Math.min(80,Math.max(34,(innerWidth||360)*.06));
    const quickFlick=ms<=420&&distance>=24;

  surface.addEventListener('touchend',e=>{
    if(!touchRunning)return;
    const q=(e.changedTouches&&e.changedTouches[0])||(start?{clientX:start.x,clientY:start.y}:{clientX:0,clientY:0});
    finish(q.clientX,q.clientY,e);
    touchRunning=false;
  },{passive:false});
  surface.addEventListener('touchcancel',()=>{
    touchRunning=false;start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;
  },{passive:true});

  // Mouse / stylus fallback. Touch pointers are ignored to prevent double firing.
  surface.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||touchRunning||Date.now()-lastFinish<120)return;
    if(begin(e.clientX,e.clientY,e.target,'pointer')){
      try{surface.setPointerCapture&&surface.setPointerCapture(e.pointerId)}catch(err){}
    }
  });
  surface.addEventListener('pointermove',e=>{
    if(!start||start.source!=='pointer')return;
    move(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointerup',e=>{
    if(!start||start.source!=='pointer')return;
    finish(e.clientX,e.clientY,e);
  });
  surface.addEventListener('pointercancel',()=>{
    if(start&&start.source==='pointer'){start=null;drag=false;paper.scrollLeft=physicalPage*paper.clientWidth;}
  });
}
/* TRACK_SWIPE_NAV_V1 — swipe between learning tracks */
function switchTrack(delta){
  const tracks=COURSE.tracks;
  const index=tracks.findIndex(x=>x.id===selectedTrack);
  if(index<0)return;
  const next=Math.max(0,Math.min(tracks.length-1,index+delta));
  if(next===index)return;
  trackTransitionDir=delta;
  selectedTrack=tracks[next].id;
  route='track';
  render();
}
function installTrackGestures(){
  const surface=document.querySelector('.track-swipe-surface');
  if(!surface||!surface.addEventListener)return;
  let start=null;
  const begin=(x,y,target)=>{
    if(target&&target.closest&&target.closest('button,input,textarea,a'))return;
    start={x,y,t:Date.now()};
  };
  const end=(x,y)=>{
    if(!start)return;
    const dx=x-start.x,dy=y-start.y,ms=Date.now()-start.t;
    start=null;
    const horizontal=Math.abs(dx)>Math.abs(dy)*1.15;
    const threshold=Math.min(90,Math.max(42,(innerWidth||360)*.1));
    if(horizontal&&(Math.abs(dx)>=threshold||(ms<360&&Math.abs(dx)>=30)))switchTrack(dx<0?1:-1);
  };
  surface.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length===1)begin(e.touches[0].clientX,e.touches[0].clientY,e.target)},{passive:true});
  surface.addEventListener('touchend',e=>{const q=e.changedTouches&&e.changedTouches[0];if(q)end(q.clientX,q.clientY)},{passive:true});
  surface.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')begin(e.clientX,e.clientY,e.target)});
  surface.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')end(e.clientX,e.clientY)});
}
function modal(title,body){
  const el=document.getElementById('modal');
  el.innerHTML='<div class="modal-top"><h2>'+esc(title)+'</h2><button class="small-btn" data-action="close">닫기</button></div>'+body;
  el.showModal();
}
function goBack(){
  const d=document.getElementById('modal');
  if(d.open){d.close();return true}
  if(route==='home')return false;
  if(route==='reader'){
    saveReaderPosition();route='track';selectedTrack=chapters[current.c].track;
  }else if(route==='practice'){
    route='reader';
  }else route='home';
  render();
  return true;
}
window.goBack=goBack;
function doAction(action,el){
  const c=chapters[current.c],p=c.pages[current.p];
  if(action==='home'||action==='books'||action==='search'||action==='saved'||action==='settings'){leaveReader();readerMenuOpen=false;route=action;render();return}
  if(action==='track'){leaveReader();readerMenuOpen=false;trackTransitionDir=Number(el.dataset.track)>selectedTrack?1:-1;selectedTrack=Number(el.dataset.track);route='track';render();return}
  if(action==='track-current'){saveReaderPosition();readerMenuOpen=false;selectedTrack=c.track;route='track';render();return}
  if(action==='chapter'){const i=Number(el.dataset.c);openPage(chapters[i].pages[0].id);return}
  if(action==='continue'){readerMenuOpen=false;openPage(state.location,false,true);return}
  if(action==='continue-track'){
    const saved=locate(state.location);
    if(saved&&chapters[saved.c].track===selectedTrack)openPage(state.location,false,true);
    else{const first=chapters.findIndex(x=>x.track===selectedTrack);if(first>=0)openPage(chapters[first].pages[0].id)}
    return;
  }
  if(action==='open'){openPage(el.dataset.id);return}
  if(action==='prev'){changePhysical(-1);return}
  if(action==='next'){changePhysical(1);return}
  if(action==='reader-menu'){
    readerMenuOpen=!readerMenuOpen;
    const menu=document.getElementById('reader-menu');if(menu)menu.hidden=!readerMenuOpen;
    return;
  }
  if(action==='toggle-dark'){
    pendingPhysicalRatio=physicalPages>1?physicalPage/(physicalPages-1):0;
    state.readerDark=!state.readerDark;persist();readerMenuOpen=true;render();return;
  }
  if(action==='bookmark'){
    state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):state.bookmarks.concat(p.id);
    persist();
    const star=document.querySelector('[data-action="bookmark"]');if(star)star.textContent=state.bookmarks.includes(p.id)?'★':'☆';
    toast(state.bookmarks.includes(p.id)?'북마크에 저장했습니다':'북마크를 해제했습니다');return;
  }
  if(action==='summary'){
    const summary=(p.paragraphs||[]).slice(0,3).join('\n\n')||(p.bullets||[]).join('\n• ');
    modal('핵심 요약','<section class="summary-modal"><h3>'+esc(p.title)+'</h3><p>'+txt(summary||'이 페이지의 핵심 내용을 다시 읽어보세요.')+'</p></section>');return;
  }
  if(action==='practice'){leaveReader();readerMenuOpen=false;route='practice';practiceOutput='';practiceError='';render();return}
  if(action==='run-python'){runPythonPractice();return}
  if(action==='practice-reset'){
    if(p){delete state.practiceCode[p.id];persist()}
    practiceOutput='';practiceError='';render();return;
  }
  if(action==='note'){modal('내 메모','<p style="color:#817567;margin-top:0">Chapter '+c.chapter+' · '+esc(p.title)+'</p><textarea id="note" rows="8">'+esc(state.notes[p.id]||'')+'</textarea>');return}
  if(action==='display'){readerMenuOpen=true;const menu=document.getElementById('reader-menu');if(menu)menu.hidden=false;return}
  if(action==='complete'){state.complete=state.complete.includes(c.id)?state.complete.filter(x=>x!==c.id):state.complete.concat(c.id);persist();render();return}
  if(action==='copy-code'){
    const code=el.closest('.code').querySelector('code').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast('코드를 복사했습니다')).catch(()=>copyFallback(code));else copyFallback(code);return;
  }
  if(action==='saved-filter'){savedFilter=el.dataset.filter||'all';render();return}
  if(action==='refresh'){if(native){native.refresh();toast('최신 교재를 확인합니다')}return}
  if(action==='apply'){if(native)native.apply();return}
  if(action==='legacy'){if(native)native.openLegacy();return}
  if(action==='export'){const raw=JSON.stringify({app:'codingroadmap-live-v1',state},null,2);if(native)native.exportState(raw);return}
  if(action==='import'){if(native)native.importState();else document.getElementById('import-file').click();return}
  if(action==='close'){document.getElementById('modal').close();return}
}
function copyFallback(value){
  const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'코드를 복사했습니다':'코드를 길게 눌러 복사하세요');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const action=el.dataset.action;
  const d=document.getElementById('modal');
  if(d.open&&action!=='close')d.close();
  doAction(action,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){searchQuery=e.target.value;document.getElementById('results').innerHTML=searchResults(searchQuery)}
  if(e.target.id==='note'){state.notes[chapters[current.c].pages[current.p].id]=e.target.value;persist()}
  if(e.target.id==='practice-code'){
    const p=chapters[current.c]?.pages[current.p];if(p){state.practiceCode[p.id]=e.target.value;persist()}
  }
  if(e.target.id==='reader-font-range'){
    const value=Math.max(15,Math.min(24,Number(e.target.value)||18));
    pendingPhysicalRatio=physicalPages>1?physicalPage/(physicalPages-1):0;
    state.readerFont=value;persist();
    const shell=document.querySelector('.reader-shell');if(shell)shell.style.setProperty('--readerBody',value+'px');
    const label=document.getElementById('font-value');if(label)label.textContent=value+'px';
    trackSlideMap.ready=false;
    setTimeout(layoutReader,30);
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveReaderPosition()});
if(typeof window.addEventListener==='function')window.addEventListener('pagehide',saveReaderPosition);
window.importProgress=raw=>{
  try{
    const data=JSON.parse(raw);
    if(data.app!=='codingroadmap-live-v1'||data.state?.schema!==1)throw Error();
    const s=data.state;
    if(!Array.isArray(s.bookmarks)||!Array.isArray(s.complete)||!s.notes||typeof s.notes!=='object')throw Error();
    state.bookmarks=[...new Set(state.bookmarks.concat(s.bookmarks.filter(x=>typeof x==='string')))];
    state.complete=[...new Set(state.complete.concat(s.complete.filter(x=>typeof x==='string')))];
    for(const [id,note] of Object.entries(s.notes)){
      if(typeof note!=='string')continue;
      if(state.notes[id]&&state.notes[id]!==note)state.notes[id]+='\n\n[가져온 메모]\n'+note;else state.notes[id]=note;
    }
    persist();render();toast('학습 기록을 복원했습니다');
  }catch(e){toast('이 앱의 올바른 백업 파일이 아닙니다')}
};
window.onUpdateStatus=s=>{updateStatus=s;if(route==='settings')render()};
if(typeof addEventListener==='function'){
  addEventListener('resize',()=>{if(route==='reader')setTimeout(layoutReader,40)});
  addEventListener('orientationchange',()=>{if(route==='reader')setTimeout(layoutReader,120)});
}
render();
</script>
