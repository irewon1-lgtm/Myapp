<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><meta name="app-schema" content="codingroadmap-live-v1"><title>코딩 로드맵</title>
<style>
:root{
  --bg:#151616;--surface:#1f2020;--raised:#292a2a;--paper:#1b1c1c;--nav:#222323;

  --bg:#f5f3ee;--surface:#fffefb;--raised:#eeece5;--paper:#fffdf9;--nav:#fffefb;

  --shadow:0 14px 42px #5f5a4c1c;color-scheme:light
}
button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;min-height:48px;padding:9px 15px;cursor:pointer;line-height:1.35;transition:transform .14s ease,background .14s ease,border-color .14s ease}
button:active{transform:scale(.985)}button:hover{background:var(--raised)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.42;cursor:default;transform:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;box-shadow:none}button.flat{background:transparent;border-color:transparent}a{color:var(--accent)}
header{position:sticky;top:0;z-index:12;border-bottom:1px solid var(--line);padding:11px max(18px,env(safe-area-inset-left));min-height:70px;display:flex;align-items:center;gap:8px;background:var(--bg)}
header .brand{position:relative;padding-left:50px;font-weight:800;letter-spacing:-.045em;flex:1;min-width:0;line-height:1.25}
header .brand::before{content:"C";position:absolute;left:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:inset 0 0 0 1px #0000000d}
header .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header>button{min-height:44px;padding-inline:12px}
.shell{max-width:1180px;margin:0 auto;padding:34px 24px 124px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.085em;font-weight:850}.muted{color:var(--muted)}
h1,h2,h3,p{margin:0}h1{font-family:inherit;font-weight:850;font-size:clamp(30px,4vw,48px);line-height:1.24;letter-spacing:-.055em;margin:12px 0 20px}h2{font-size:24px;line-height:1.4;letter-spacing:-.035em;margin-bottom:14px}h3{font-size:18px;line-height:1.55;letter-spacing:-.025em}p+p{margin-top:18px}
.hero{position:relative;overflow:hidden;padding:30px;border:0;border-radius:24px;background:var(--accent);color:var(--accent-ink);margin:0 0 34px;box-shadow:0 15px 38px #0000001f}.hero::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-62px;top:-78px;background:#ffffff35;pointer-events:none}.hero p,.hero .muted{max-width:620px;color:#4e4a31}.hero .actions{margin-top:24px}.hero .badge{border-color:#27231444;color:#3f3a22;background:#ffffff42}.hero button{background:#fff9;border-color:#0000;color:#282617}.hero button.primary{background:#252419;color:#fff;border-color:#252419}
.actions{display:flex;flex-wrap:wrap;gap:9px}.section-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:26px 0 16px}.section-head h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.track{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:25px 22px 22px 26px;min-height:190px;width:100%;border:1px solid var(--line);border-radius:21px;background:var(--surface);box-shadow:0 8px 22px #00000013}.track::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}.track::after{content:"";position:absolute;right:-34px;bottom:-46px;width:128px;height:128px;border-radius:36px;transform:rotate(22deg);background:var(--raised);opacity:.66;pointer-events:none}.track .eyebrow,.track h3,.track small{position:relative;z-index:1}.track h3{font-size:23px;margin:10px 0 12px;max-width:88%}.track small{color:var(--muted);display:block;margin-top:auto}.track.unavailable{opacity:.56;box-shadow:none}.track.unavailable::before{background:var(--line)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--green)}
.chapter{display:flex;align-items:center;text-align:left;gap:17px;width:100%;padding:18px 18px;margin-bottom:10px;border-radius:17px;background:var(--surface);box-shadow:0 4px 14px #0000000b}.chapter .num{display:grid;place-items:center;color:var(--accent-ink);background:var(--accent);border-radius:12px;font-size:15px;font-weight:850;min-width:42px;height:42px}.chapter .name{flex:1;min-width:0;font-weight:700}.chapter small{display:block;color:var(--muted);font-size:13px;font-weight:450;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.breadcrumb{font-size:11px;color:var(--muted);line-height:1.5;letter-spacing:.04em}.reader{height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}.reader-head{position:relative;z-index:4;flex:0 0 auto;padding:8px 14px;gap:5px;min-height:62px;background:var(--bg);box-shadow:0 8px 24px #00000008}.reader-head .brand::before{display:none}.reader-head .titles{flex:1;min-width:0}.reader-head strong{font-size:14px;display:block;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-head button{padding:7px 10px;font-size:13px;min-height:42px}
.paper{flex:1 1 auto;min-height:0;width:min(var(--reader-width),calc(100% - 28px));margin:0 auto;overflow-y:auto;overscroll-behavior-y:contain;padding:38px 34px 64px;scrollbar-gutter:stable;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 34px #00000012}.paper h1{font-size:clamp(28px,3.2vw,38px);margin:12px 0 28px}.paper .paragraph{margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);padding:21px;border-radius:18px;margin-top:22px;box-shadow:0 5px 16px #00000009}.card h3{color:var(--text);margin-bottom:8px}.card h3::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 9px 2px 0}.card .label{font-size:12px;font-weight:800;color:var(--green);margin:16px 0 5px}.card p{font-size:.95em}
.code{margin:24px 0;border:1px solid var(--line);background:#121313;color:#f2f1ea;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px #0000001d}.code .bar{background:#242525;padding:8px 13px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d2d0ca}.code .bar button{color:#e3c94f}.code pre{font-size:.87em;line-height:1.78;overflow-x:auto;white-space:pre;margin:0;padding:19px 20px;word-break:normal;overflow-wrap:normal;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;tab-size:4}.code .output{border-top:1px solid #333;font-size:.85em;color:#c9c6bf;white-space:pre-wrap;padding:16px 20px;background:#181919}
ul{padding-left:22px}li+li{margin-top:9px}
.footer{flex:0 0 auto;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--bg);min-height:64px}.footer .position{flex:1;text-align:center;font-size:11px;color:var(--muted);line-height:1.45}.footer button{min-width:70px;min-height:44px}.progress{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}.reader.focus .reader-head{display:none}.reader.focus .footer{padding-block:4px}.reader.focus .footer .position{font-size:10px}.reader.focus .footer button{font-size:13px;min-height:42px}
.search-box,input,textarea,select{width:100%;padding:13px 15px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px}.search-box{margin-bottom:20px}textarea{min-height:180px;line-height:1.75}.result{width:100%;text-align:left;padding:17px;margin-bottom:10px;border-radius:16px}.result small{display:block;color:var(--muted);font-size:12px}.result p{font-size:14px;margin-top:6px}
.nav{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(680px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0;padding:7px;border:1px solid var(--line);border-radius:22px;background:var(--nav);box-shadow:var(--shadow)}.nav button{border:0;background:transparent;min-height:52px;padding:8px 6px;border-radius:15px;font-size:13px;font-weight:700}.nav button:active{background:var(--raised)}
dialog{width:min(620px,calc(100% - 28px));max-height:85dvh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:#000b}dialog .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}dialog h2{margin:0}dialog button{margin:4px 0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--raised);color:var(--text);border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:14px;z-index:30;max-width:90vw;box-shadow:var(--shadow)}.info{font-size:14px;color:var(--muted);white-space:pre-wrap}.goal{border-left:4px solid var(--accent);padding:2px 0 2px 16px;margin:25px 0;font-size:15px}.goal strong{color:var(--accent)}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:21px}.summary-grid .card{margin:0}.select-wrap{margin:15px 0}.diagram{margin-top:24px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--surface)}.diagram .row{display:flex;gap:15px;padding:13px 17px;border-bottom:1px solid var(--line);font-size:15px}.diagram .row:last-child{border:0}.diagram .key{min-width:92px;color:var(--accent);font-weight:800}.empty{padding:30px 0;color:var(--muted)}.note-preview{white-space:pre-wrap}.footnote{color:var(--muted);font-size:12px;margin-top:20px}
body.light .code{background:#171818;color:#f4f2ec}body.light .code .bar{background:#252626}body.light .primary{color:var(--accent-ink)}
@media (min-width:600px) and (max-width:899px){
  .shell{max-width:860px;padding:38px 34px 126px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.track{min-height:204px}.hero{padding:36px}.paper{width:calc(100% - 46px);padding:46px 48px 70px;border-radius:24px 24px 0 0}.reader-head{padding-left:24px;padding-right:24px}.footer{padding-left:24px;padding-right:24px}.footer .position{font-size:12px}.card{padding:23px}
}
@media (min-width:900px){
  .shell{max-width:1180px;padding:42px 42px 128px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.track{min-height:210px}.hero{padding:38px 40px}.reader-head{padding-left:max(28px,calc((100vw - 1120px)/2));padding-right:max(28px,calc((100vw - 1120px)/2))}.paper{--reader-width:960px;width:min(var(--reader-width),calc(100% - 104px));padding:50px 62px 78px;border-radius:26px 26px 0 0}.footer{padding-left:max(30px,calc((100vw - 1120px)/2));padding-right:max(30px,calc((100vw - 1120px)/2))}.footer .position{font-size:12px}.chapter{padding:19px 22px}.card{padding:24px}
}
@media (min-width:1180px) and (orientation:landscape){.paper{--reader-width:1000px}.shell{max-width:1240px}}
@media (max-width:599px){.grid{grid-template-columns:1fr}.track{min-height:150px}.shell{padding:24px 16px 112px}.hero{padding:23px}.summary-grid{grid-template-columns:1fr}.reader-head .optional{display:none}.paper{width:100%;border-radius:0;border-left:0;border-right:0;padding:28px 20px 42px;box-shadow:none}.card{padding:18px}.reader-head strong{font-size:13px}.footer{gap:5px}.footer button{padding:8px 9px;min-width:58px}.two-col{grid-template-columns:1fr}.nav{bottom:max(8px,env(safe-area-inset-bottom));width:calc(100% - 20px);border-radius:19px}.nav button{font-size:12px;min-height:48px}}
@media (max-height:650px) and (orientation:landscape){header{min-height:58px}.reader-head{min-height:54px}.paper{padding-top:30px;padding-bottom:46px}.footer{min-height:56px}.track{min-height:170px}.nav button{min-height:46px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" class="toast" hidden></div>
<script id="course" type="application/json">__COURSE_JSON__</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course').textContent);
const chapters=COURSE.chapters, native=window.RoadmapNative;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=s=>esc(s).replace(/\n/g,'<br>');
const defaults={schema:1,version:1,location:chapters[0].pages[0].id,bookmarks:[],notes:{},complete:[],visited:[],font:18,theme:'dark',migrated:false};
let state;
try{state=JSON.parse(native?native.getState():localStorage.getItem('codingroadmap-live-state')||'{}')}catch{state={}}
state=Object.assign({},defaults,state);
for(const k of ['bookmarks','complete','visited'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.notes||typeof state.notes!=='object'||Array.isArray(state.notes))state.notes={};
let route='home', current=locate(state.location)||{c:0,p:0}, focus=false, searchQuery='', updateStatus=native?native.getStatus():'저장된 교재',toastTimer;
function locate(id){for(let c=0;c<chapters.length;c++){const p=chapters[c].pages.findIndex(x=>x.id===id);if(p>=0)return {c,p}}return null}
function persist(){try{const raw=JSON.stringify(state);if(native)native.saveState(raw);else localStorage.setItem('codingroadmap-live-state',raw)}catch{toast('학습 기록을 저장하지 못했습니다')}}
function migrate(){if(state.migrated)return;try{const old=native?JSON.parse(native.getLegacy()||'{}'):{};state.legacy=old;if(Object.keys(old).length){const c=(Number(old.current_track)||0)*8+(Number(old.current_chapter)||0);const chapter=chapters[c];if(chapter){const oldId=`${chapter.id}-p${(Number(old.current_page)||0)+1}`;state.location=locate(oldId)?oldId:chapter.pages[0].id;current=locate(state.location)}if(old.text_scale)state.font=Math.round(18*old.text_scale)}}catch{}state.migrated=true;persist()}
migrate();
function applyDisplay(){state.font=Math.min(26,Math.max(15,Number(state.font)||18));document.documentElement.style.setProperty('--font',state.font+'px');document.body.classList.toggle('light',state.theme==='light')}
applyDisplay();
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}
function btn(label,action,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function header(label='코딩 로드맵'){return `<header><div class="brand">${esc(label)}<small>천천히 읽고, 직접 바꾸며 배우기</small></div>${btn('검색','search','flat')}${btn('설정','settings','flat')}</header>`}
function nav(){return `<nav class="nav">${btn('홈','home')}${btn('책장','books')}${btn('저장한 내용','saved')}${btn('설정','settings')}</nav>`}
function completed(t){return chapters.filter(c=>c.track===t&&state.complete.includes(c.id)).length}
function home(){const c=chapters[current.c],p=c.pages[current.p];return header()+`<main class="shell"><div class="eyebrow">나의 코딩 책장</div><h1>한 장씩,<br>내 힘으로 이해하기.</h1><section class="hero"><span class="badge">이어서 읽기</span><h2 style="margin-top:16px">${esc(c.title)}</h2><p class="muted">트랙 ${c.track} · 챕터 ${c.chapter}<br>${esc(p.title)}</p><div class="actions">${btn('읽던 곳으로','continue','primary')}${btn('전체 목차','books')}</div></section><div class="section-head"><h2>지금 읽을 수 있는 책</h2><span class="muted" style="font-size:13px">2개 트랙</span></div><div class="grid">${COURSE.tracks.filter(t=>t.available).map(trackCard).join('')}</div><div class="card"><h3>읽는 것에서 직접 해보는 것으로</h3><p>단어 뜻과 예시를 보고, 코드의 결과를 예상한 뒤 직접 바꿔 보세요. 문제 다음 장에는 정답 코드와 풀이가 있습니다.</p><p class="info" style="margin-top:12px">이 앱은 교재 리더입니다. Python 실행은 별도 실행 환경에서 진행합니다.</p></div>${nav()}<p class="footnote">${esc(COURSE.label)} · ${chapters.length}개 챕터 · ${chapters.reduce((n,c)=>n+c.pages.length,0)}장<br>${esc(updateStatus)}</p></main>`}
function trackCard(t){return `<button class="track ${t.available?'':'unavailable'}" data-action="track" data-track="${t.id}" ${t.available?'':'disabled'}><span class="eyebrow">TRACK ${String(t.id).padStart(2,'0')}</span><h3>${esc(t.title)}</h3><small>${t.available?`${t.chapters.length}개 챕터 · 이해 완료 ${completed(t.id)}개`:'준비 중 · 본문 미제공'}</small></button>`}
function books(){return header('전체 책장')+`<main class="shell"><h1>배움의 순서</h1><p class="muted">트랙 1부터 2까지 본문이 준비되어 있습니다. 이후 트랙은 아직 읽을 수 없습니다.</p><div class="grid" style="margin-top:24px">${COURSE.tracks.map(trackCard).join('')}</div>${nav()}</main>`}
let selectedTrack=chapters[current.c].track;
function trackPage(){const t=COURSE.tracks.find(t=>t.id===selectedTrack);return header()+`<main class="shell"><div class="eyebrow">TRACK ${String(t.id).padStart(2,'0')}</div><h1>${esc(t.title)}</h1><p class="muted">${t.id===1?'코딩 단어부터 변수·타입·오류와 작은 프로젝트까지.':'조건문부터 파일 처리와 작은 자동화까지.'}</p><p class="footnote">완료 표시는 페이지를 열었다고 올라가지 않습니다. 직접 이해 여부를 표시하세요.</p><div style="margin-top:24px">${chapters.map((c,i)=>c.track!==selectedTrack?'':`<button class="chapter" data-action="chapter" data-c="${i}"><span class="num">${String(c.chapter).padStart(2,'0')}</span><span class="name">${esc(c.title)}<small>${c.pages.length}장 · ${esc(c.practiceGoal)}</small></span><span class="pill">${state.complete.includes(c.id)?'이해 완료':'읽기'}</span></button>`).join('')}</div>${nav()}</main>`}
const diagramData={CODE_TO_OUTPUT:[['작성','print("안녕")'],['실행','Python이 코드 처리'],['출력','안녕']],TOP_TO_BOTTOM:[['1번 줄','print("준비")'],['2번 줄','print("실행")'],['3번 줄','print("완료")']],VARIABLE_BINDING:[['name','"민수"'],['age','37 → 재대입 후 38']],TYPE_TABLE:[['10','int · 정수'],['10.0','float · 실수'],['"10"','str · 문자열'],['True','bool · 참/거짓']],INPUT_CONVERSION:[['입력','"37" · 문자열'],['변환','int("37") → 37'],['처리','37 + 1 → 38']],ERROR_MAP:[['NameError','정의·철자·순서'],['TypeError','값의 타입과 연산'],['ValueError','변환하려는 값의 내용'],['SyntaxError','따옴표·괄호·문법']],CALC_STEPS:[['상품금액','2500 × 4 = 10000'],['배송비','10000 + 3000'],['합계','13000']],IPO_PROJECT:[['입력','커피·점심·교통비'],['처리','숫자 변환 후 합계'],['출력','오늘 총지출']]};
const track2Diagrams=[ [['조건','score >= 90?'],['참','A 선택 → 분기 종료'],['거짓','score >= 80? 검사'],['다시 참','B 선택 → 분기 종료']], [['꺼내기','prices의 다음 price'],['검사','price >= 10000'],['누적','참이면 total과 count 갱신'],['되돌기','다음 항목, 없으면 반복 끝']], [['호출','calc_discount(50000, 0.1)'],['연결','price=50000, rate=0.1'],['계산','50000 - 5000 = 45000.0'],['반환','result = 45000.0']], [['리스트','users: 사용자 여러 명'],['항목','user: 사용자 한 명'],['조회','user["age"]: 나이'],['조건','30 이상이면 이름 출력']], [['원문','"  Seoul,37,Python  \\n"'],['정리','strip()로 앞뒤 공백 제거'],['분리','split(",")로 세 칸'],['변환','age는 int, interest는 lower']], [['쓰기','w: 비우고 새 내용 작성'],['닫기','with 블록 끝'],['읽기','r: 한 줄씩 읽기'],['출력','줄바꿈 정리 후 print']], [['시도','int(raw)'],['성공','숫자로 다음 계산'],['ValueError','숫자 입력 안내'],['그 외 오류','자동으로 같은 처리되지 않음']], [['읽기','expenses.txt'],['검증','두 칸·금액·카테고리'],['합산','카테고리별 totals'],['저장','report.txt + 오류 건수']] ];
function diagram(p,c){let rows=c.track===2?track2Diagrams[c.chapter-1]:diagramData[p.visual];if(!rows)return '';return `<div class="diagram" role="table" aria-label="실행 흐름">${rows.map(([a,b])=>`<div class="row" role="row"><span class="key">${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div>`}
function codeCard(code,note){return `<div class="code"><div class="bar"><span>Python · 예제 코드</span>${btn('복사','copy-code','flat')}</div><pre><code>${esc(code)}</code></pre>${note?`<div class="output">${esc(note)}</div>`:''}</div>`}
function pageBody(p,c){return `<div class="eyebrow">${esc(p.eyebrow||p.kind)}</div><h1>${esc(p.title)}</h1>${p.paragraphs?.map(s=>`<p class="paragraph">${text(s)}</p>`).join('')||''}${p.glossary?.map(g=>`<section class="card"><h3>${esc(g.term)}</h3><p>${text(g.description)}</p><div class="label">어디에 쓰나요?</div><p>${text(g.usage)}</p><div class="label">예시</div><p>${text(g.example)}</p></section>`).join('')||''}${p.visual?diagram(p,c):''}${p.bullets?.length?`<div class="card"><ul>${p.bullets.map(x=>`<li>${text(x)}</li>`).join('')}</ul></div>`:''}${p.calloutTitle?`<div class="card"><h3>${esc(p.calloutTitle)}</h3><p>${text(p.calloutBody)}</p></div>`:''}${p.code?codeCard(p.code,p.codeNote):''}${p.practicePrompt?`<section class="card"><h3>직접 해보기</h3><p>${text(p.practicePrompt)}</p></section>`:''}${p.question?`<section class="card"><h3>먼저 생각해 보세요</h3><p>${text(p.question)}</p></section>`:''}${p.answerOnNext?`<div class="goal">예상 결과와 이유를 먼저 적어 보세요.<br><strong>다음 장에 정답과 단계별 풀이가 있습니다.</strong></div><div class="actions">${btn('내 생각 적기','note')}${btn('풀이로 이동','next','primary')}</div>`:''}${p.answer?`<details class="card"><summary>정답·해설</summary><p>${text(p.answer)}</p></details>`:''}${p.extras?.map(e=>`<section class="card"><h3>${esc(e.title)}</h3><p>${text(e.body)}</p></section>`).join('')||''}${p.closingPrompt?`<p class="goal">${text(p.closingPrompt)}</p>`:''}${p.kind==='summary'?`<div class="summary-grid"><div class="card"><h3>기억할 것</h3><p>${esc(c.remember)}</p></div><div class="card"><h3>직접 해볼 것</h3><p>${esc(c.practiceGoal)}</p></div></div>`:''}${current.p===c.pages.length-1?`<div class="card"><h3>이 챕터를 설명할 수 있나요?</h3><p>${esc(c.practiceGoal)}를 직접 해보고 표시하세요.</p><div class="actions" style="margin-top:15px">${btn(state.complete.includes(c.id)?'이해 완료 취소':'이해 완료로 표시','complete','primary')}${btn('목차로','track-current')}</div><p class="footnote">기준 문서: <a href="https://docs.python.org/3.14/tutorial/" target="_blank" rel="noopener">Python 3.14 공식 튜토리얼</a> · 보완 검토 2026-09-20</p></div>`:''}`}
function reader(){const c=chapters[current.c],p=c.pages[current.p],atStart=current.c===0&&current.p===0,atEnd=current.c===chapters.length-1&&current.p===c.pages.length-1;return `<div class="reader ${focus?'focus':''}"><header class="reader-head">${btn('〈 목차','track-current','flat')}<div class="titles"><span class="breadcrumb">TRACK ${c.track} · CHAPTER ${c.chapter}</span><strong>${esc(c.title)}</strong></div>${btn(state.bookmarks.includes(p.id)?'★':'☆','bookmark','flat','aria-label="북마크"')}${btn('메모','note','flat optional')}${btn('Aa','display','flat')}${btn('⋯','reader-menu','flat','aria-label="읽기 메뉴"')}</header><article class="paper" id="paper">${pageBody(p,c)}</article><footer class="footer">${btn('이전','prev','',atStart?'disabled':'')}<div class="position">${current.p+1} / ${c.pages.length}장 · 트랙 ${c.track}<div class="progress"><i style="width:${100*(current.p+1)/c.pages.length}%"></i></div></div>${btn(focus?'메뉴':'집중','focus','flat')}${btn('다음','next','',atEnd?'disabled':'')}</footer></div>`}
function excerpt(p){return [p.title,...(p.paragraphs||[]),p.code||'',p.question||'',...(p.glossary||[]).flatMap(g=>[g.term,g.description,g.example])].join(' ')}
function results(q){if(!q.trim())return '<p class="muted">변수, NameError, return처럼 모르는 말을 찾아보세요.</p>';const hits=[];chapters.forEach((c,ci)=>c.pages.forEach((p,pi)=>{const s=excerpt(p);const pos=s.toLowerCase().indexOf(q.toLowerCase());if(pos>=0)hits.push({c,ci,p,pi,s:s.slice(Math.max(0,pos-30),pos+120)})}));return `<p class="info" style="margin-bottom:16px">${hits.length}장 검색됨</p>`+hits.slice(0,100).map(h=>`<button class="result" data-action="open" data-id="${h.p.id}"><small>트랙 ${h.c.track} · ${esc(h.c.title)}</small><strong>${esc(h.p.title)}</strong><p>${esc(h.s)}…</p></button>`).join('')}
function search(){return header('본문·용어 검색')+`<main class="shell"><h1>막힌 곳을 찾아보기</h1><input id="search" class="search-box" aria-label="본문·용어 검색" placeholder="단어, 코드, 오류 이름 검색" value="${esc(searchQuery)}"><div id="results">${results(searchQuery)}</div>${nav()}</main>`}
function saved(){const marks=state.bookmarks.map(id=>{const pos=locate(id);if(!pos)return '';const c=chapters[pos.c],p=c.pages[pos.p];return `<button class="result" data-action="open" data-id="${id}"><small>트랙 ${c.track} · ${esc(c.title)}</small>${esc(p.title)}</button>`}).join('');const notes=Object.entries(state.notes).filter(([_,s])=>s.trim()).map(([id,s])=>{const pos=locate(id);const c=pos&&chapters[pos.c];return `<button class="result" data-action="open" data-id="${esc(id)}"><small>${c?`트랙 ${c.track} · ${esc(c.title)}`:'이전 교재 기록'}</small><p class="note-preview">${esc(s)}</p></button>`}).join('');let legacy='';try{const old=JSON.parse(state.legacy?.notes_json||'{}');if(Object.keys(old).length)legacy='<h2 style="margin-top:28px">이전 앱 메모</h2><p class="info">이전 앱이 트랙 구분 없이 저장한 메모입니다. 원문을 보존했습니다.</p>'+Object.entries(old).map(([k,s])=>`<div class="card"><h3>이전 챕터 ${Number(k)+1}</h3><p class="note-preview">${esc(s)}</p></div>`).join('')}catch{}return header('저장한 내용')+`<main class="shell"><h1>다시 볼 내용</h1><h2>북마크</h2>${marks||'<p class="empty">읽는 화면에서 ☆를 누르면 저장됩니다.</p>'}<h2 style="margin-top:26px">내 메모</h2>${notes||'<p class="empty">예상 결과와 헷갈린 이유를 적어 두세요.</p>'}${legacy}${state.legacy?.bookmarks?.length?`<p class="footnote">이전 앱 북마크: 챕터 ${state.legacy.bookmarks.map(x=>Number(x)+1).join(', ')} · 원래 화면에서 확인할 수 있습니다.</p>`:''}${nav()}</main>`}
function settings(){return header('설정')+`<main class="shell"><h1>편하게 읽기</h1><section class="card"><h3>글자와 화면</h3><div class="actions">${btn('작게','font-down')}${btn(state.font+'px','noop','flat')}${btn('크게','font-up')}${btn(state.theme==='dark'?'밝은 화면':'어두운 화면','theme')}</div></section><section class="card"><h3>자동 업데이트</h3><p>${esc(updateStatus)}</p><p class="info">앱을 새로 실행할 때 최신 교재와 화면을 확인합니다. 연결이 안 되면 저장된 교재가 열립니다. 읽는 도중에는 페이지를 강제로 바꾸지 않습니다.</p><div class="actions" style="margin-top:16px">${btn('지금 확인','refresh')}${btn('받은 변경 적용','apply')}</div><p class="footnote">${esc(COURSE.label)} · 콘텐츠 ${COURSE.version}</p></section><section class="card"><h3>학습 기록 보관</h3><p class="info">읽던 위치, 북마크, 메모, 이해 완료 표시를 파일로 저장하거나 복원합니다. 복원 시 기존 기록은 유지하면서 합칩니다.</p><div class="actions" style="margin-top:16px">${btn('기록 내보내기','export')}${btn('기록 가져오기','import')}</div><input id="import-file" type="file" accept="application/json" hidden></section><section class="card"><h3>기존 화면</h3><p class="info">이전 책장과 기록은 삭제하지 않았습니다. 아래 버튼은 APK에 들어 있는 이전 화면을 엽니다. 이전 화면에는 새 교재가 자동 반영되지 않습니다.</p>${btn('이전 앱 화면 열기','legacy')}</section>${nav()}</main>`}
function render(){applyDisplay();document.getElementById('app').innerHTML=({home,books,track:trackPage,reader,search,saved,settings}[route]||home)();document.title='코딩 로드맵 · '+(route==='reader'?chapters[current.c].title:'책장');if(route==='reader')installGestures();if(native)native.ready()}
function openPage(id){const pos=locate(id);if(!pos){toast('현재 교재에서 이 페이지를 찾지 못했습니다');return}current=pos;selectedTrack=chapters[pos.c].track;state.location=id;if(!state.visited.includes(id))state.visited.push(id);persist();route='reader';render()}
function move(delta){let {c,p}=current;p+=delta;if(p<0){if(c===0)return;c--;p=chapters[c].pages.length-1}else if(p>=chapters[c].pages.length){if(c===chapters.length-1)return;c++;p=0}openPage(chapters[c].pages[p].id)}
function modal(title,body){const el=document.getElementById('modal');el.innerHTML=`<div class="top"><h2>${esc(title)}</h2>${btn('닫기','close','flat')}</div>${body}`;el.showModal()}
function goBack(){const d=document.getElementById('modal');if(d.open){d.close();return true}if(route==='home')return false;route=route==='reader'?'track':'home';selectedTrack=chapters[current.c].track;render();return true}window.goBack=goBack;
function doAction(a,el){const c=chapters[current.c],p=c.pages[current.p];switch(a){case'home':case'books':case'search':case'saved':case'settings':route=a;render();break;case'track':selectedTrack=Number(el.dataset.track);route='track';render();break;case'track-current':selectedTrack=c.track;route='track';render();break;case'chapter':openPage(chapters[Number(el.dataset.c)].pages[0].id);break;case'continue':openPage(state.location);break;case'open':openPage(el.dataset.id);break;case'prev':move(-1);break;case'next':move(1);break;case'focus':{const top=document.getElementById('paper').scrollTop;focus=!focus;render();document.getElementById('paper').scrollTop=top;break;}case'bookmark':state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):[...state.bookmarks,p.id];persist();const scroll=document.getElementById('paper').scrollTop;render();document.getElementById('paper').scrollTop=scroll;toast(state.bookmarks.includes(p.id)?'북마크에 저장했습니다':'북마크를 해제했습니다');break;case'note':modal('내 생각과 메모',`<p class="info">트랙 ${c.track} · ${esc(p.title)}<br>입력한 내용은 자동 저장됩니다.</p><textarea id="note" aria-label="학습 메모" style="margin-top:15px">${esc(state.notes[p.id]||'')}</textarea>`);break;case'display':modal('읽기 설정',`<p>글자 ${state.font}px</p><div class="actions">${btn('작게','font-down')}${btn('크게','font-up')}${btn('화면색 전환','theme')}</div>`);break;case'reader-menu':modal('읽기 메뉴',`<div class="two-col">${btn('이 페이지 메모','note')}${btn('본문·용어 검색','search')}${btn('목차','track-current')}${btn('이해 완료 표시','complete')}${btn('홈','home')}${btn('설정','settings')}</div>`);break;case'font-down':case'font-up':state.font=Math.min(26,Math.max(15,state.font+(a==='font-up'?1:-1)));persist();applyDisplay();if(route==='settings')render();else if(document.getElementById('modal').open){document.getElementById('modal').close();doAction('display',el)}break;case'theme':state.theme=state.theme==='dark'?'light':'dark';persist();applyDisplay();if(route==='settings')render();break;case'complete':state.complete=state.complete.includes(c.id)?state.complete.filter(x=>x!==c.id):[...state.complete,c.id];persist();toast(state.complete.includes(c.id)?'이해 완료로 표시했습니다':'완료 표시를 해제했습니다');if(route==='reader')render();break;case'close':document.getElementById('modal').close();break;case'copy-code':{const v=el.closest('.code').querySelector('code').textContent;navigator.clipboard?.writeText(v).then(()=>toast('코드를 복사했습니다')).catch(()=>copyFallback(v));if(!navigator.clipboard)copyFallback(v);break}case'refresh':if(native){native.refresh();toast('최신 교재를 확인합니다')}else toast('APK에서 자동 업데이트를 확인할 수 있습니다');break;case'apply':if(native)native.apply();else toast('APK에서 변경을 적용할 수 있습니다');break;case'legacy':if(native)native.openLegacy();else toast('기존 화면은 APK에서 열 수 있습니다');break;case'export':{const raw=JSON.stringify({app:'codingroadmap-live-v1',state},null,2);if(native)native.exportState(raw);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='CodingRoadmap-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}break}case'import':if(native)native.importState();else document.getElementById('import-file').click();break;}}
function copyFallback(value){const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'코드를 복사했습니다':'코드를 길게 눌러 복사하세요')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(document.getElementById('modal').open&&!['close','font-up','font-down','theme','noop'].includes(a))document.getElementById('modal').close();doAction(a,el)});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchQuery=e.target.value;document.getElementById('results').innerHTML=results(searchQuery)}if(e.target.id==='note'){state.notes[chapters[current.c].pages[current.p].id]=e.target.value;persist()}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files[0])window.importProgress(await e.target.files[0].text())});
window.importProgress=raw=>{try{const data=JSON.parse(raw);if(data.app!=='codingroadmap-live-v1'||data.state?.schema!==1)throw Error();const s=data.state;if(!Array.isArray(s.bookmarks)||!Array.isArray(s.complete)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes)||Object.values(s.notes).some(x=>typeof x!=='string'))throw Error();state.bookmarks=[...new Set([...state.bookmarks,...s.bookmarks.filter(x=>typeof x==='string')])];state.complete=[...new Set([...state.complete,...s.complete.filter(x=>typeof x==='string')])];for(const [id,note]of Object.entries(s.notes)){if(state.notes[id]&&state.notes[id]!==note)state.notes[id]+='\n\n[가져온 메모]\n'+note;else state.notes[id]=note}persist();render();toast('학습 기록을 합쳐서 복원했습니다')}catch{toast('이 앱의 올바른 백업 파일이 아닙니다')}};
window.onUpdateStatus=s=>{updateStatus=s;if(route==='settings')render()};
function installGestures(){const el=document.getElementById('paper');let start=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('pre,button,a,input,textarea,summary,details'))return;start={x:e.clientX,y:e.clientY,t:Date.now()}});el.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y,ms=Date.now()-start.t;start=null;if(window.getSelection()?.toString())return;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.7&&ms<1000)move(dx>0?-1:1);else if(Math.abs(dx)<7&&Math.abs(dy)<7&&ms<350&&e.target===el){if(e.clientX<24)move(-1);else if(e.clientX>innerWidth-24)move(1)}});el.addEventListener('pointercancel',()=>start=null)}
render();
</script></body></html>
