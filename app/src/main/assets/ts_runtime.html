<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="typescript.js"></script>
  <script src="ts_libs.js"></script>
</head>
<body>
<script>
(() => {
  const MAX_OUTPUT = 65536;
  const MAX_SOURCE = 32768;
  const NETWORK_RE = /\b(fetch\s*\(|XMLHttpRequest|WebSocket|EventSource|importScripts\s*\(|new\s+Worker\s*\(|new\s+SharedWorker\s*\(|require\s*\(|import\s*\()/;
  const STORAGE_RE = /\b(localStorage|sessionStorage|indexedDB)\b/;

  function basename(name) {
    return String(name).replace(/\\/g, '/').split('/').pop();
  }

  function textOfDiagnostic(d) {
    const message = ts.flattenDiagnosticMessageText(d.messageText, '\n');
    if (!d.file || typeof d.start !== 'number') return message;
    const pos = d.file.getLineAndCharacterOfPosition(d.start);
    return `${d.file.fileName}:${pos.line + 1}:${pos.character + 1} ${message}`;
  }

  function compile(source) {
    const files = Object.assign({}, window.__TS_LIBS__ || {});
    files['user.ts'] = source;
    let jsOutput = '';

    const options = {
      target: ts.ScriptTarget.ES2020,
      module: ts.ModuleKind.None,
      strict: true,
      noEmitOnError: true,
      noLib: true,
      skipLibCheck: true
    };

    const host = {
      getSourceFile(fileName, languageVersion) {
        const key = basename(fileName);
        const text = files[key];
        return text === undefined ? undefined : ts.createSourceFile(fileName, text, languageVersion, true);
      },
      getDefaultLibFileName() { return 'lib.es2020.full.d.ts'; },
      writeFile(fileName, text) {
        if (fileName.endsWith('.js')) jsOutput = text;
      },
      getCurrentDirectory() { return ''; },
      getDirectories() { return []; },
      fileExists(fileName) { return Object.prototype.hasOwnProperty.call(files, basename(fileName)); },
      readFile(fileName) { return files[basename(fileName)]; },
      getCanonicalFileName(fileName) { return fileName; },
      useCaseSensitiveFileNames() { return true; },
      getNewLine() { return '\n'; },
      directoryExists() { return true; },
      realpath(fileName) { return fileName; }
    };

    const roots = ['lib.es2020.full.d.ts', 'user.ts'];
    const program = ts.createProgram(roots, options, host);
    const diagnostics = ts.getPreEmitDiagnostics(program)
      .filter((d) => d.category === ts.DiagnosticCategory.Error)
      .filter((d) => !d.file || basename(d.file.fileName) === 'user.ts');

    if (diagnostics.length > 0) {
      return { ok: false, error: diagnostics.slice(0, 10).map(textOfDiagnostic).join('\n') };
    }

    const emitResult = program.emit();
    const emitErrors = emitResult.diagnostics
      .filter((d) => d.category === ts.DiagnosticCategory.Error)
      .map(textOfDiagnostic);
    if (emitErrors.length > 0 || !jsOutput) {
      return { ok: false, error: emitErrors.join('\n') || 'TypeScript compiler produced no JavaScript output.' };
    }

    return { ok: true, js: jsOutput };
  }

  function securityCheck(source) {
    if (source.length > MAX_SOURCE) return 'source is limited to 32768 characters';
    if (NETWORK_RE.test(source)) return 'network, dynamic import, require, and nested workers are blocked';
    if (STORAGE_RE.test(source)) return 'persistent browser storage is blocked';
    return null;
  }

  function runWorker(jsCode, timeoutMs) {
    return new Promise((resolve) => {
      const workerSource = `
        const __logs = [];
        const __safeText = (v) => {
          try { return typeof v === 'string' ? v : JSON.stringify(v); }
          catch (_) { return String(v); }
        };
        console.log = (...args) => {
          const line = args.map(__safeText).join(' ');
          const current = __logs.join('\\n').length;
          if (current < ${MAX_OUTPUT}) __logs.push(line.slice(0, Math.max(0, ${MAX_OUTPUT} - current)));
        };
        console.error = console.log;
        console.warn = console.log;
        self.fetch = () => Promise.reject(new Error('Network access blocked by sandbox'));
        self.XMLHttpRequest = undefined;
        self.WebSocket = undefined;
        self.EventSource = undefined;
        self.Worker = undefined;
        self.SharedWorker = undefined;
        self.importScripts = () => { throw new Error('importScripts blocked by sandbox'); };
        self.indexedDB = undefined;
        const __send = self.postMessage.bind(self);
        self.postMessage = () => { throw new Error('postMessage is reserved by sandbox'); };
        try {
          (new Function(${JSON.stringify(jsCode)}))();
          __send({ success: true, output: __logs.join('\\n').slice(0, ${MAX_OUTPUT}) });
        } catch (e) {
          __send({ success: false, output: __logs.join('\\n').slice(0, ${MAX_OUTPUT}), errorMessage: (e && e.stack) ? String(e.stack) : String(e) });
        }
      `;

      const blob = new Blob([workerSource], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const worker = new Worker(url);
      let settled = false;

      const finish = (result) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        worker.terminate();
        URL.revokeObjectURL(url);
        resolve(result);
      };

      worker.onmessage = (event) => finish(event.data || { success: false, output: '', errorMessage: 'empty worker response' });
      worker.onerror = (event) => finish({ success: false, output: '', errorMessage: String(event.message || 'worker error') });
      const timer = setTimeout(() => finish({ success: false, output: '', errorMessage: 'TimeoutError: TypeScript execution budget exceeded', isTimeout: true }), Math.max(250, timeoutMs));
    });
  }

  window.runTypeScript = async function(source, timeoutMs) {
    const started = performance.now();
    try {
      const securityError = securityCheck(String(source));
      if (securityError) {
        return { success: false, output: '', errorMessage: `[security] ${securityError}`, isSecurityViolation: true, isTimeout: false, compilerVersion: window.__TS_VERSION__ || ts.version };
      }

      const compiled = compile(String(source));
      if (!compiled.ok) {
        return { success: false, output: '', errorMessage: `TypeScript compile error:\n${compiled.error}`, isSecurityViolation: false, isTimeout: false, compilerVersion: window.__TS_VERSION__ || ts.version };
      }

      const runtime = await runWorker(compiled.js, Number(timeoutMs) || 2500);
      return {
        success: !!runtime.success,
        output: String(runtime.output || ''),
        errorMessage: runtime.errorMessage ? String(runtime.errorMessage) : null,
        isSecurityViolation: false,
        isTimeout: !!runtime.isTimeout,
        compilerVersion: window.__TS_VERSION__ || ts.version,
        executionTimeMs: Math.round(performance.now() - started)
      };
    } catch (e) {
      return { success: false, output: '', errorMessage: String(e && e.stack ? e.stack : e), isSecurityViolation: false, isTimeout: false, compilerVersion: window.__TS_VERSION__ || (window.ts && ts.version) || 'unknown' };
    }
  };
})();
</script>
</body>
</html>
